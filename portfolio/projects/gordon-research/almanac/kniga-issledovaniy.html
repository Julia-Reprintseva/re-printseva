<script>
const DATA = [{"intro": true, "num": "00", "title": "Вместо вступления (введение к книге)", "ptitle": "Вместо вступления", "subtitle": "", "date": "22 сентября 2026 г.", "perm": "https://www.facebook.com/yuri.gordon/posts/pfbid02txWajZ2Dn6Ags5oh29WiCJGsmP6hPiQiVBjfQkaRQ1g974AFjPHWKtx6s645pwYol", "slug": "", "html": "<p><span class=\"dc\">Е</span>сть одна важная для автора этой книги позиция. Я — художник.</p><p>Не ученый, не документалист, не искусствовед. Позиция, которая многое позволяет. Ученый обязан сомневаться и обнародовать только подтвержденное. Документалист должен, по возможности, собирать и публиковать все доступные факты. Искусствовед не имеет права быть необъективным — он аналитик, а не зоил.</p><p>Художник волен во всём. Затем, что ветру, и орлу, и сердцу девы нет закона. У человека, занимающегося искусством, есть только одна обязанность — свобода суждения*. Он имеет полное право хвалить и ругать, любить и ненавидеть. Он может и должен ошибаться — а вот раскаиваться в ошибках не обязан, потому что часто ошибки — лучшее из сделанного художником.</p>", "figs": [], "aq": null, "research": null}, {"intro": false, "num": "01", "title": "Глава про латиникириллизацию в СССР", "ptitle": "Как был упущен лучший случай сбросить Пушкина с корабля современности", "subtitle": "", "date": "14 мая 2025 г.", "perm": "https://www.facebook.com/story.php?story_fbid=23987832897490830&id=100000723643455", "slug": "", "html": "<p>Большевики мыслили глобально, даже когда начинали «строить социализм в одной, отдельно взятой». Доставшуюся от царского режима территорию они считали безнадежно отсталой и годной только на капитальную переделку. Поэтому сразу задумались о замене кириллицы на что-то более модное и прогрессивное.</p><p>Что же это могло быть? Конечно, только латиница. Латинский алфавит к началу 20 века использовался везде, где утвердилась христианская вера в ее католическом и протестантском изводах: в Европе и ее колониях, а также в переставших быть колониями Америках.</p><p>Все прозелитические религии — доктрины книг и азбук. Иудаизм шел в комплекте с квадратным письмом. Христианство, начав говорить и писать по-гречески, быстро усвоило латынь и латиницу, и так же быстро породило армянский, грузинский, а потом и глаголический с кириллическим алфавиты. Ислам разнес по миру арабицу, и она победила даже там, где были многовековые письменные традиции — например, в Египте, в Персии и в Сирии.</p>", "figs": [], "aq": null, "research": null}, {"intro": false, "num": "02", "title": "Глава о советских деньгах, приправленная долларами, фунтами, франками и керенками", "ptitle": "О советских деньгах", "subtitle": "или Иван Иванович Гознак", "date": "26 мая 2025 г.", "perm": "https://www.facebook.com/story.php?story_fbid=24086483494292436&id=100000723643455", "slug": "", "html": "<p><span class=\"dc\">В</span>о-первых, деньги — это красиво. Или не во-первых? Что должна говорить купюра или монета?</p><p>Наверное, прежде всего она выглядеть ценностью. Потом — внушать уважение к власти, ее выпустившей. Потом — иметь достойную защиту от фальшивомонетчиков. Потом, скорее всего, должна что-то сообщить о культуре народа и времени выпуска. Ах, да! Чуть не забыл. Она должна быть похожей на деньги!</p><p>Мне всегда казалось, что советские деньги, с которыми я имел дело всё детство и молодость, с одной стороны, были самым точным выражением той жизни, а с другой — одновременно! — не имели с ней ничего общего.</p>", "figs": [], "aq": null, "research": null}, {"intro": false, "num": "03", "title": "Глава о советских прописях 1930-х", "ptitle": "Советские прописи глазами типографа и ИИ", "subtitle": "От живого письма к мёртвому чертежу.", "date": "11 июля 2025 г.", "perm": "https://www.facebook.com/100000723643455/posts/24461477630126352/", "slug": "propisi", "html": "<p><span class=\"dc\">К</span>аждый человек в современном мире должен (обязан, имеет неотложную необходимость) уметь читать и писать. Это настолько ясно, что Капитан Очевидность улетает, скучая.</p><p>А как было век-полвека назад на территории бывшей Российской империи?</p><p>С чтением понятно: получив в нагрузку к гражданским правам государственные обязанности, каждый советский человек должен был уметь прочесть «не влезай убьет» на трансформаторной будке и «Правила проезда» там, где он хочет проехать.</p>", "figs": [], "aq": ["Как вы помните, мы с партнёром Юлией Репринцевой создаем моего цифрового доппельгангера, чтоб помочь писать эту книгу.", "Юрий Гордон, из текста главы"], "research": {"task": "Найти пособия по обучению письму 1900–1990, распознать тексты прописей, сравнить методы обучения, показать, как менялась связь письма и политики.", "work": "Собрана база из 18 изданий — буквари, прописи, методички: распознавание, сжатие и нарезка PDF под лимиты загрузки, две недели «кормления» кастомного ассистента-«двойника». Найден и описан недокументированный лимит ChatGPT — 80 МБ на аккаунт. Глава подготовлена в двух регистрах: нейтральном аналитическом и в голосе автора.", "tools": "ChatGPT (кастомный проект, Deep Research), ChatPDF, Perplexity", "dates": "июнь — июль 2025"}}, {"intro": false, "num": "04", "title": "Глава о советских шрифтах и геноциде букв («Как превратить цветущий луг в картофельное поле»)", "ptitle": "Как превратить цветущий луг* в картофельное поле", "subtitle": "", "date": "26 августа 2025 г.", "perm": "https://www.facebook.com/story.php?story_fbid=24842304568710321&id=100000723643455", "slug": "shrifty", "html": "<p><span class=\"dc\">Э</span>та глава должна была быть серединой и сердцевиной моей книги. Собственно, мои занятия шрифтом — прямое следствие того, что в 1930-м по заданию советского правительства несколько умных, профессиональных, полных заботы о ближних людей отправили на переплавку примерно 95% от имевшихся тогда в наличии 1500 наборных шрифтов.</p><p>По отношению к людям такое называется геноцидом. Но это же не люди — подумаешь, буковки! Ведь оставили самых лучших, крепких, удобочитаемых. Это просто селекция, правда ведь? Неправда.</p><p>Типографика — точный слепок живой речи. Чем она богаче, разнообразнее, даже дурее — тем точнее передается смысл. Это касается любой буквенной коммуникации — от многотомной энциклопедии до вывески булошной.</p>", "figs": [], "aq": ["Там же — ссылка на наше с Юлией Репринцевой исследование предмета при помощи ИИ, результатом которого стала эта статья. На мой взгляд, это лучший наш перфоманс.", "Юрий Гордон, из текста главы"], "research": {"task": "Найти публикации о шрифтах, составить каталоги по десятилетиям, выяснить, какие шрифты использовались чаще, найти государственные меры по их отбору — список оставленного и отброшенного.", "work": "Perplexity собрал источники; по ним в проекте для промптов составлен бриф для Deep Research; ChatGPT провёл сравнение стандартизации шрифтов в СССР, США, Британии, Франции и Германии до 1953 года. Найдены ОСТ 1337 и ГОСТ 3489, циркуляр Бормана 1941 года о запрете фрактуры.", "tools": "Perplexity, ChatGPT Deep Research (o3)", "dates": "июль — август 2025"}}, {"intro": false, "num": "05", "title": "Глава о буквах московского метро («Буквы подземного космодрома»)", "ptitle": "Буквы подземного космодрома", "subtitle": "или От Сокольников до Парка на метро", "date": "9 сентября 2025 г.", "perm": "https://www.facebook.com/story.php?story_fbid=24961957913411652&id=100000723643455", "slug": "metro", "html": "<p><span class=\"dc\">П</span>о Москве двадцатых ходили пешком. Пять километров — я сам их промерил ногами — это диаметр Садового кольца. Извозчик был хорошим ускорением. Трамвай решал транспортную проблему. Автобусы только появились. Такси — было и такси, но оставалось некой экзотикой почти до времён «Бриллиантовой руки». Частные авто встречались только у очень специальных граждан.</p><p>Москва начала тридцатых была небольшим постсредневековым городом, в основном сосредоточенным в двух кольцах бывших стен: Бульварном и Садовом, и только-только доросшим окраинами до третьего оборонительного кольца — валов и застав.</p><p>Москва, где долго не было своего барона Османа, аж до середины пятидесятых оставалась городом дворов и переулков (вспомним Окуджаву). Да, проспекты прокладывали, но они начинались за Садовым. Как ни ломали большевики Москву, единственной тотальной просекой в старом городе стал хрущёвский Гавана-стрит: Калининский Новый Арбат.</p>", "figs": [], "aq": ["Руководитель нейропомощников, как всегда, Юлия Репринцева.", "Юрий Гордон, из текста главы"], "research": {"task": "Проанализировать надписи метро по семи группам — наружные, на платформах, навигационные, памятные, технические, вагонные, временные; определить стилистику, проследить изменения, разобрать тексты по содержанию.", "work": "Промпт собран по требованиям OpenAI к GPT-5: цель, входные данные, критерии качества, формат, верификация. Perplexity нашёл 245 источников; GPT-5 написал эссе на 13 страниц с классификацией и оговорками по датировкам — и сам предложил проверки, которых в задании не было.", "tools": "Perplexity, ChatGPT GPT-5 Deep Research", "dates": "август — сентябрь 2025"}}, {"intro": false, "num": "06", "title": "Глава о советских вывесках и витринах 1930-х («Лампы сияют, цены снижены»)", "ptitle": "Лампы сияют, цены снижены", "subtitle": "Советские вывески и витрины эпохи великого перелома", "date": "4 октября 2025 г.", "perm": "https://www.facebook.com/story.php?story_fbid=25178341208439987&id=100000723643455", "slug": "vyveski", "html": "<p><span class=\"dc\">Т</span>орговля — лучшее из человеческих занятий, совершенно незаслуженно проклятое в культуре русского языка. Причем проклятое с обоих концов: с «народного» поговоркой «не обманешь — не продашь», а с «интеллигентского» — Карлом Марксом с его лютой ненавистью к частному капиталу и прибавочной стоимости.</p><p>Реклама — весёлая дочь торговли. Да, часто слишком навязчивая, слишком сладкая, слишком неразборчивая в обольщении. Но зато приносящая радость дурацкой покупки и самодовольство от обладания очередным пирожком цивилизации, что, собственно, и делает нас людьми.</p><p>В предреволюционной Российской империи реклама была густой, яркой и повсеместной — особенно наружная в больших городах. Вывесок и витрин было столько, что на центральных улицах архитектура полностью пропадала под буквами и картинками, зазывавшими, манившими и обещавшими что угодно, от рюмки водки до «синьки в пакетикахъ и мешочкахъ тов. Ратнеръ» (реальная вывеска заведения, принадлежавшего предкам лучшего друга моего папы).</p>", "figs": [], "aq": ["А мой партнёр и нейрокапитан Юлия Репринцева всё изощреннее тасует и комбинирует возможности сетей.", "Юрий Гордон, из текста главы"], "research": {"task": "Найти визуальные и текстовые источники о вывесках и витринах 1928–1941: как производились, были ли стандарты, чем отличались столица и периферия; отдельно — Торгсин.", "work": "Два брифа — на сбор корпуса и на сравнительный анализ (СССР 1928–41, США времён Депрессии, послевоенная Европа). Три исследования каскадом: результаты ChatGPT и Perplexity (111 ссылок) — на вход Gemini с поиском западных источников.", "tools": "ChatGPT Deep Research, Perplexity, Gemini Deep Research", "dates": "сентябрь — октябрь 2025"}}, {"intro": false, "num": "07", "title": "Глава о советских обложках и титульных листах 1935–1953 («Если выпало в провинции родиться»)", "ptitle": "Если выпало в провинции родиться", "subtitle": "Советские обложки и титулы 1935-1953", "date": "6 ноября 2025 г.", "perm": "https://www.facebook.com/story.php?story_fbid=25508324675441637&id=100000723643455", "slug": "oblozhki", "html": "<p><span class=\"dc\">В</span>озможно, я взялся за эту книгу только затем, чтобы написать эту главу. А думать о ней начал в 1981 году, делая свои первые книжные обложки и титулы.</p><p>То, чем мы тогда почти все, за редкими исключениями, занимались, казалось мне страшно убогим кустарным провинциализмом, дремучей архаикой.</p><p>Особенно это касалось букв. Наборных шрифтов было раз два и обчелся, доступ к ним для рядового дизайнера был адски сложным. Новых практически никто не делал. Гельветики не было. Кириллическая Футура стала свежей сенсацией стиля Олимпиады 80.</p>", "figs": [], "aq": ["Юлия Репринцева решила провести сравнительный эксперимент и дала один и тот же промпт разным нейросетям.", "Юрий Гордон, из текста главы"], "research": {"task": "Собрать изображения обложек и титулов, классифицировать шрифты — наборные и рисованные, композицию, нешрифтовые элементы; сопоставить с дореволюционными и зарубежными.", "work": "Одно задание запущено параллельно в шести системах; выводы всех шести положены рядом для сравнения; три раунда итеративного поиска по художникам Рербергу и Телингатеру.", "tools": "ChatGPT, Perplexity, Gemini, DeepSeek, Grok, Qwen", "dates": "октябрь — ноябрь 2025"}}, {"intro": false, "num": "08", "title": "Советская монументальная пропаганда — от полотна до бетона", "ptitle": "Монументальная пропаганда — от полотна до бетона", "subtitle": "", "date": "18 февраля 2026 г.", "perm": "https://www.facebook.com/100000723643455/posts/26431847396422689/", "slug": "propaganda", "html": "<p><span class=\"dc\">Л</span>юбое тоталитарное государство лезет в мозги населения везде, где только может, начиная с улицы. Вождь мирового пролетариата выдвигает план монументальной пропаганды в 1918 году, еще даже не зная, что его государство тоталитарное.</p><p>Первые пробы монументалки пришли с улицы, с демонстраций, были дешевыми и крайне агрессивными. Главная задача — создать образ врага и отделить своих от чужих. Враги — «буржуи», генералы, попы; свои — «трудящиеся», пролетарии и крестьяне. Лозунги от «Долой!» до «Да здравствует!». Буквы — всякие, но много модного арнуво и футуристской криволапицы. Желание красивых и/или выразительных букв — наследие старого мира и некоторая теплота исполнителей.</p><p>В этот первый период пропагандой занимаются «идейные» товарищи. И она выходит злой, кровожадной, но по-своему страстной и даже честной. Но так будет недолго — максимум до конца Гражданской войны.</p>", "figs": [], "aq": ["Как всегда до того, как я начал писать главу, мы с ЮР провели глубокое ИИ исследование по этой же теме.", "Юрий Гордон, t.me/yurigordon/819, 20 февраля 2026"], "research": {"task": "Изучить эволюцию монументальной пропаганды — оформление парадов, демонстраций, стационарные конструкции — с 1917 по 1991: идеология, лозунги, типографика, материалы; собрать максимум визуального материала.", "work": "Один рабочий день: 11:55 задание → 12:05 каркас в Perplexity → 12:10 бриф в проекте для промптов → 13:00 отчёт Gemini → 14:01 итоговый документ и PDF. Три системы, три отчёта.", "tools": "Perplexity, ChatGPT Deep Research, Gemini Deep Research", "dates": "февраль 2026"}}, {"intro": false, "num": "09", "title": "Случай Банниковой и не только, или А был ли план?", "ptitle": "Случай Банниковой и не только", "subtitle": "или А был ли план?", "date": "12 марта 2026 г.", "perm": "https://www.facebook.com/100000723643455/posts/26643468658593894/", "slug": "shriftoviki", "html": "<p><span class=\"dc\">Н</span>есколько глав назад я описал геноцид шрифтов в ссср в начале 1930-х. Тогда собрались умные дяди, решили бороться с буржуазными предрассудками и переплавили 75% Бертгольда, Лемана и иже с ними. И был составлен план развития шрифтового хозяйства на века вперед, упершийся в Литературную гарнитуру.</p><p>Здесь, прежде чем перейти к одной из героинь главы, я хочу остановиться и предьявить большевикам претензию, достойную их героического замаха.</p><p>Что такое шрифтовая библиотека целой культуры? Это не просто буковки, которыми набирают книги, газеты, учебники, рекламу, объявления, навигацию и всё прочее, вплоть до трамвайных билетов.</p>", "figs": [], "aq": ["Параллельно со мной ту же проблему анализировал ChatGPT под руководством Юлии Репринцевой.", "Юрий Гордон, t.me/yurigordon/855, 13 марта 2026"], "research": {"task": "Биографии авторов наборных шрифтов 1930–1960, каталог гарнитур, типология, был ли государственный план разработки шрифтов; доработка — краткие биографии и исправления.", "work": "Двухступенчатый промптинг: модель сначала выступает как специалист по брифам, сама пишет ТЗ и задаёт восемь вопросов о глубине, потом идёт исследование. Три запуска — два первых с ошибками, третий пошёл в главу. Правки — в тот же день.", "tools": "ChatGPT Deep Research", "dates": "март 2026"}}, {"intro": false, "num": "10", "title": "Анализ двух книг «Искусство шрифта. Работы московских художников книги» (1960 и 1977)", "ptitle": "Анализирую две книги с одним названием: «Искусство шрифта. Работы московских художников книги»", "subtitle": "", "date": "21 марта 2026 г.", "perm": "https://www.facebook.com/story.php?story_fbid=26733763439564415&id=100000723643455", "slug": "iskusstvo-shrifta", "html": "<p><span class=\"dc\">Э</span>ту главу можно считать продолжением предыдущей, где я показал два альбома «Искусства шрифта». В этот раз хочу внимательно сравнить их: время выхода, состав участников, тематику, особенности показанных работ. Будем звать их кратко: «ИШ-1960» и «ИШ-1977».</p><p>«ИШ-1960» готовился два года и вышел в 1960. Это середина оттепели (с 1954 до 1956 ее начало, а основной период — 1956–1964). Карибский кризис, кукуруза, первые хрущевки. Гагарин еще не полетел, но уже вот-вот. Нынешнее поколение будет жить при коммунизме. Застой пока не чуем никем нигде.</p><p>«ИШ-1977» сдан в набор в 1974, подписан в печать в 1977. Три года в производстве. Это расцвет застоя и развитого социализма. Бровеносец еще вяжет лыко, отпраздновали 60 лет октября, впереди олимпийский мишка и Афган.</p>", "figs": [], "aq": ["А теперь заглянем в Содержание и в Список иллюстраций, включив ИИ (ChatGPT и Gemini). Юлия Репринцева, прошу!", "Юрий Гордон, из текста главы"], "research": {"task": "Сравнить состав участников двух альбомов, систематизировать по типу работ, сравнить работы по времени и композиции; для всех участников — даты жизни и четыре хронологических списка.", "work": "Четыре шага верификации: первый ответ Gemini → проверка ChatGPT по страницам библиотеки, где вскрылись выдуманные участники и проценты → анализ по сканам оглавлений (38 и 59 имён, 16 общих) → выверенная база с датами жизни и 13 авторами гарнитур.", "tools": "Gemini, ChatGPT", "dates": "март 2026"}}, {"intro": false, "num": "11", "title": "Глава о каллилеттеринге оттепели («Попустило и скукожило»)", "ptitle": "Попустило и скукожило", "subtitle": "Советский неоромантизм в надписях оттепели: взмах крыла и суровый стиль небритого гротеска", "date": "3 апреля 2026 г.", "perm": "https://www.facebook.com/100000723643455/posts/26880068174933940/", "slug": "ottepel", "html": "<p><span class=\"dc\">Ш</span>естидесятые годы — поиски того, как можно. Чтобы понять, что это значит: «как можно», давайте разбежимся издалека.</p><p>Нулевые годы двадцатого века — возбухание. Российская культура тащит с Запада всё, что может утащить — от импрессионизма до эмансипации, и набирает воздуха для крика. Приличное общество морщится и нервно спрашивает: а что, так можно?</p><p>Десятые годы — мощный вопль. Вдруг выясняется, что российские футуристы вполне способны переорать итальянских, а пощечины общественному вкусу грозят перерасти в скидывание с корабля современности. ДА, ТАК МОЖНО! капслоком рычит авангард.</p>", "figs": [], "aq": ["То, что об этом предмете думает ИИ под руководством Юлия Репринцева см. отдельной ссылкой…", "Юрий Гордон, постскриптум главы"], "research": {"task": "Собрать вывески, обложки, плакаты и рекламу оттепели, определить стилистику и мотивы, выяснить источники, проследить эволюцию, сопоставить с западными аналогами; затем — добавить кинотеатры, концертные залы, фирменные магазины.", "work": "Бриф в проекте для промптов → Gemini Deep Research: 30 объектов с описанием формы буквы, шесть типов шрифтовой формы, 23 источника; доработка по замечанию автора.", "tools": "Gemini Deep Research, ChatGPT", "dates": "март — апрель 2026"}}, {"intro": false, "num": "12", "title": "Глава о машинописи и литературном языке", "ptitle": "Машинопись и литературный язык", "subtitle": "", "date": "18 мая 2026 г.", "perm": "https://www.facebook.com/100000723643455/posts/27410854155188670/", "slug": "", "html": "<p><span class=\"dc\">П</span>омните, в самом начале книги я сравнивал себя с человеком, зашедшим с фонариком в огромный тёмный склад? Пусть эта короткая главка будет таким спотлайтом, выхватившим всего один элемент большого явления под именем «Самиздат».</p><p>Запрещенную литературу размножали по-разному. Переписывали от руки. Переснимали на фото. Издавали заграницей и нелегально ввозили. Под конец советского строя ксерокопировали и даже печатали на ранних принтерах.</p><p>Но, видимо, главным способом распространения была машинопись. Пишмашинок было много, в том числе в частных руках. Они компактны и достаточно производительны. Писчей бумаги хватало. Копирки в те времена тоже было полно.</p>", "figs": [], "aq": null, "research": null}, {"intro": false, "num": "13", "title": "Глава о Фестивале 1957 и Олимпиаде 1980 («От ромашки до мишки»)", "ptitle": "От ромашки до мишки — визуальная коммуникация Фестиваля-57 и Олимпиады-80", "subtitle": "", "date": "12 июня 2026 г.", "perm": "https://www.facebook.com/100000723643455/posts/27730650253209057/", "slug": "festival", "html": "<p><span class=\"dc\">И</span>сторический контекст: в 1956 году на ХХ съезде кпсс генсек Хрущев публично разоблачил покойного отца народов Сталина. В ссср буйно забулькала оттепель. Даже начал приподниматься уголок железного занавеса. И тут очень кстати международный союз прогрессивной молодежи вместе с не менее прогрессивным союзом международных студентов решили провести свой опрятный вудсток в Москве. И товарищи из цк вместе с товарищем майором внезапно это разрешили.</p><p>Чтобы понять, почему Это произошло, достаточно генеалогии. Международный союз молодежи — наследник Коммунистического интернационала молодёжи (КИМ), который, в свою очередь, был молодежной секцией коминтерна — организации, стоявшей на довольствии в Москве и в конце концов Москвой же прикрытой.</p><p>И всё ж случился шок-контент: ссср вдруг повернулся к миру передом и стал настойчиво демонстрировать всем желающим свои неоспоримые преимущества. Но чу: в числе преимуществ не было графического дизайна. Вообще не было — он отсутствовал за полной ненадобностью.</p>", "figs": [], "aq": ["Для тех, кому хочется большей объективности — глубокое исследование от ChatGPT под руководством Юлия Репринцева.", "Юрий Гордон, постскриптум главы"], "research": {"task": "«Давай я скину идею, а ты превратишь её в промпт»: описать и сравнить оформление Фестиваля молодёжи 1957 года и Олимпиады 1980 года, сопоставить с западным оформлением того же времени; нужны и глубокие исследования, и выжимка.", "work": "Серия из шести брифов и шести Deep Research: советские массовые праздники, олимпийские дизайн-системы 1968–1980, чемпионаты мира, аннотированная база западных источников — и единая аналитическая глава на их основе. Итоговую базу Юрий Гордон назвал лучшим, что ИИ сделал для его книги.", "tools": "ChatGPT Deep Research", "dates": "май — июнь 2026"}}, {"intro": false, "num": "14", "title": "Советские прописи шестидесятых. Воспоминания школьника-левши", "ptitle": "Советские прописи шестидесятых", "subtitle": "Воспоминания первоклассника-левши, пошедшего в школу в 1965 году", "date": "15 июня 2026 г.", "perm": "https://www.facebook.com/100000723643455/posts/27770387565901992/", "slug": "", "html": "<p><span class=\"dc\">Н</span>а стене в классе висело учебное пособие. На нём был представлен алфавит прописей — заглавные и строчные буквы. Буквы были крупные, аккуратно начерченные, с ровным механическим нажимом. Над всем этим тянулась наборная строка (Литературная гарнитура, узкое полужирное начертание): «Пиши правильно и красиво».</p><p>Я много наблюдал, как мама работает. Она была литредактором и часто брала статьи на дом. Мама сидела за секретером с откидным столом, держа в одной руке ручку, в другой — цветной карандаш кохинор (щегольство в тогдашней Москве). Мама не была амбидекстром — просто левшой, как и я. Левшой, наученной письму правой в советской школе двадцатых.</p><p>До школы я и не пытался что-то делать правой. Зачем? Ведь у меня есть чудесная левая, которой я начал рисовать раньше, чем научился говорить. Мои способности были настолько очевидны, что даже папа-правша пытался к ним пристроиться, говоря, что он держит нож левой.</p>", "figs": [], "aq": null, "research": null}, {"intro": false, "num": "15", "title": "Каталог ручных и машинных шрифтов 1966 года как зеркало советской деградации", "ptitle": "Каталог ручных и машинных шрифтов 1966 года как зеркало советской деградации", "subtitle": "", "date": "25 июня 2026 г.", "perm": "https://www.facebook.com/story.php?story_fbid=27897516943189053&id=100000723643455", "slug": "", "html": "<p><span class=\"dc\">Е</span>сли вы помните, я как-то разбирал афишу знаменитых футуристов, напечатанную в Тифлисе в 1913 году (рис. 2). На ней было использовано пятьдесят шрифтов. Тифлис, конечно, не маленький и культурный город, но в типографическом смысле не Питер и не Москва. Тем более, что грузины никогда не переходили на кириллицу. Так вот: пятьдесят шрифтов — это много не только для рекламной бумажки, отпечатанной на южной границе империи. Это больше того, чем могла похвастаться спустя полвека вся полиграфическая промышленность «самой читающей страны мира».</p><p>Шрифтов в Российской империи было полно. Большая часть поставлялась Бертгольдом и Леманом из Германии, но хватало и собственных словолитен. В любом уездном городе не бедный обыватель мог заказать себе приличную визитную карточку или приглашение на свадьбу (рис. 3) на хорошей бумаге, каллиграфическим шрифтом, можно с виньетками и рамочками.</p><p>Потом настал 1914 год, германское снабжение прервалось.<br>Потом случился октябрь 1917, типографии экспроприировали.<br>Потом, после НЭПа, в 1930 году, собрались умные люди и стали с умным видом отбирать подходящие шрифты, а неподходящие переплавили. Тогда же составили умные планы по развитию наилучших шрифтов для нужд полиграфического производства.</p>", "figs": [], "aq": null, "research": null}, {"intro": false, "num": "16", "title": "Случай Шварцмана", "ptitle": "Случай Шварцмана", "subtitle": "", "date": "18 июля 2026 г.", "perm": "https://www.facebook.com/100000723643455/posts/28155623924045019/", "slug": "", "html": "<p><span class=\"dc\">М</span>ы порываем с сухим, заученным дизайном, геометрическими комбинациями, нивелирующими своеобычное, неповторимо индивидуальное, порываем с иллюстративной ложнозначительной позой, с назойливой тематичностью, не свойственной структуре знака.</p><p>Мы новыми трансформациями спонтанно воплощаем извечную мечту о магическом знаке, напряженно ищем полноты означенности, высокой знаковой независимости, благого молчания иератического тавра.</p><p>Эпиграф к этой главе — классический манифест художника-модерниста, создающего очередной изм. В нулевые-двадцатые годы прошлого века такие тексты публиковались к каждой выставке. Однако этот манифест особенный.</p>", "figs": [], "aq": null, "research": null}, {"intro": false, "num": "17", "title": "Фотонабор и ОНШ: последний акт советского шрифтостроения", "ptitle": "Фотонабор и ОНШ: последний акт советского шрифтостроения", "subtitle": "", "date": "16 августа 2026 г.", "perm": "https://www.facebook.com/100000723643455/posts/28514747981465943/", "slug": "", "html": "<p><span class=\"dc\">«К</span>огда у меня в руках новая книга…» — эту строку из «Оды типографии» Пабло Неруды страшно любили советские типографы.</p><p>Так вот, когда у меня в руках или перед глазами двухтомный каталог шрифтов для фотонаборного комплекса «Каскад» — гордости советского полиграфического машиностроения — у меня опускаются руки и пропадает всякое желание смотреть на буквы.</p><p>В прошлый раз я описывал «Каталог ручных и машинных шрифтов» 1966 года. Это был финал советской высокой печати (в смыле момент перехода на плоскую, офсет), когда назрела смена парка печатных машин, а вместе с ним переделка всего комплекта шрифтов. Тогдашний набор состоял из остатков дореволюционных гарнитур и жидкой неструктурированной кашицы новых советских дополнений.</p>", "figs": [], "aq": null, "research": null}, {"intro": false, "num": "18", "title": "Случай Чернихова", "ptitle": "Случай Чернихова", "subtitle": "", "date": "29 августа 2026 г.", "perm": "https://www.facebook.com/story.php?story_fbid=28679794764961263&id=100000723643455", "slug": "", "html": "<p><span class=\"dc\">С</span> конца 1930-х годов в поле его деятельности были две темы: ветряные мельницы и шрифты.<br>Из Википедии</p><p>Он был на три года старше Мандельштама.</p><p>Биография Якова Чернихова — образец того, чего может добиться упорный и талантливый еврейский мальчик из семьи обедневшего коммерсанта с одиннадцатью детьми. При любой власти.</p>", "figs": [], "aq": null, "research": null}, {"intro": false, "num": "19", "title": "Последние советские прописи", "ptitle": "Последние советские прописи", "subtitle": "", "date": "31 августа 2026 г.", "perm": "https://www.facebook.com/100000723643455/posts/28704805405793532/", "slug": "", "html": "<p><span class=\"dc\">О</span>бучив моё поколение макать перо в чернильницу, советская педогогика всё-таки пала под натиском фирмы BiC, с рыданием отбросила письмо с нажимом и отменила чистописание в начальных классах. Шариковая ручка, этот кольт-письмейкер, уравняла всех.</p><p>Последние советские прописи провозгласили безотрывное письмо. Безотрывность заключалась не в попытке написать букву одним движением, а в отсутствии необходимости периодически макать перо в фиолетовую жижу с нефтяным отблеском.</p><p>Форма строчных букв осталась практически неизменной: всё те же палочки, крючочки и кружки (пардон овалы). Послабление вышло только в отсутствии нажима. А вот заглавные попытались отмотать от лишних завитушек (в классической каллиграфии они нужны для разгона руки), зато некоторые буквы — например, А, Б — приобрели некоторую безотрывность (то есть их стало сложней писать неопытной рукой).</p>", "figs": [], "aq": null, "research": null}, {"intro": false, "num": "20", "title": "Таймс против Литературной, или битва Масленицы с Великим Постом", "ptitle": "Таймс против Литературной, или битва Масленицы с Великим Постом", "subtitle": "", "date": "28 сентября 2026 г.", "perm": "https://www.facebook.com/yuri.gordon/posts/pfbid0X78aoThYMdqbbz5mQemo5ZzhiMWnHo9SPutump8pbooyNLkTKEA947qiiJTfPLhyl", "slug": "", "html": "<p><span class=\"dc\">В</span> этой главе речь пойдет о великой битве старого с новым, фактически об отмене крепостного права и даровании вольностей дворянских, которую, однако, практически никто не заметил и которую пресёк, сам того не ведая, лесник номер 286.</p><p>В середине-конце 80-х издательство «Мир» было единственным стильным издательством в ссср. В том смысле, что одно оно имело продуманный и развитой фирменный стиль, базировавшийся на типографике, и в частности — на шрифте Таймс.</p><p>Позвольте, но никакого шрифта Таймс в ссср тогда не было! Не было-не было, а в «Мире» был.</p>", "figs": [], "aq": null, "research": null}];

  const pushPage = () => { if(cur.length){ pages.push(cur.map(b=>b.outerHTML).join('')); cur = []; } };
  for (const b of blocks){
    cur.push(b); render(cur);

    if (b.tagName === 'P' && b.textContent.split(' ').length > 40){
      const words = b.textContent.split(' '); let lo = 0, hi = words.length, best = 0;
      const mk = (n) => { const p = document.createElement('p'); p.textContent = words.slice(0,n).join(' '); return p; };
      while (lo < hi){ const mid = (lo+hi+1)>>1; render([...cur, mk(mid)]); if (fits()){ best = mid; lo = mid; } else hi = mid-1; }

    pushPage(); cur.push(b); render(cur);
    if (!fits()){ pushPage(); }
  }
  pushPage();
  return pages;
}

/* мышь целиком за нами: у библиотеки клик по углу листает назад и вместе с нашим обработчиком возвращал тот же разворот */
book.addEventListener('click', e => { if (e.target.closest('a,button,input,textarea')) return; pf.flipNext(); });
pf.loadFromHTML(document.querySelectorAll('#book .page'));
const pos = document.getElementById('pos');
const keyOf = i => pages[i] && (pages[i].dataset.key || ('p|' + i));
const findByKey = k => { const i = pages.findIndex(p => p.dataset.key === k); return i >= 0 ? i : (k.startsWith('p|') ? Math.min(+k.slice(2), pages.length-1) : 0); };
let marks = LS('marks') || {}; let notes = LS('notes') || {};
const paint = () => pages.forEach(p => { const k = p.dataset.key; p.classList.toggle('marked', !!(k && marks[k])); p.classList.toggle('noted', !!(k && notes[k])); });
const upd = () => { const i = pf.getCurrentPageIndex(); pos.textContent = (i+1) + ' / ' + pages.length; document.querySelector('#progress i').style.width = (100*(i+1)/pages.length)+'%'; SV('last', keyOf(i)); const k=keyOf(i); document.getElementById('b-mark').classList.toggle('on', !!marks[k]); document.getElementById('b-mark').textContent = (marks[k]?'★':'☆')+' закладка'; };
pf.on('flip', upd); paint(); upd();
const hp = (location.hash.match(/^#p=(\d+)/) || [])[1];   // #p=N — открыть на странице N
const last = LS('last'); if (hp) setTimeout(()=>pf.turnToPage(Math.min(+hp-1, pages.length-1)), 300); else if (last && last !== 'p|0') setTimeout(()=>pf.turnToPage(findByKey(last)), 300);
document.getElementById('home').onclick = e => { e.preventDefault(); pf.turnToPage(0); };
document.getElementById('b-toc').onclick = () => pf.turnToPage(pages.indexOf(tocPage));
const mm = document.getElementById('mineMenu');
mm.innerHTML = DATA.map((ch,i) => ch.research ? `<a href="#" data-p="${starts[i]}"><span>${ch.num}</span>${ch.ptitle}</a>` : '').join('');
document.getElementById('b-mine').onclick = e => { e.stopPropagation(); mm.classList.toggle('open'); };
mm.addEventListener('click', e => { const a = e.target.closest('a[data-p]'); if (a){ e.preventDefault(); pf.turnToPage(+a.dataset.p); mm.classList.remove('open'); } });
document.addEventListener('click', () => mm.classList.remove('open'));
document.getElementById('b-mark').onclick = () => { const k = keyOf(pf.getCurrentPageIndex()); if (!k) return; if (marks[k]) delete marks[k]; else marks[k] = { ch: pages[pf.getCurrentPageIndex()].dataset.ch || '', q: pages[pf.getCurrentPageIndex()].textContent.replace(/\s+/g,' ').trim().slice(0,90), t: Date.now() }; SV('marks', marks); paint(); upd(); };
const nb = document.getElementById('noteBox'), nt = document.getElementById('noteText'); let noteKey = null;
document.getElementById('b-note').onclick = () => { noteKey = keyOf(pf.getCurrentPageIndex()); nt.value = (notes[noteKey]||{}).n || ''; document.getElementById('noteTitle').textContent = 'Заметка · стр. ' + (pf.getCurrentPageIndex()+1); nb.classList.add('open'); nt.focus(); };
document.getElementById('n-close').onclick = () => nb.classList.remove('open');
document.getElementById('n-save').onclick = () => { if (nt.value.trim()) notes[noteKey] = { ch: pages[pf.getCurrentPageIndex()].dataset.ch || '', q: pages[pf.getCurrentPageIndex()].textContent.replace(/\s+/g,' ').trim().slice(0,90), n: nt.value.trim(), t: Date.now() }; else delete notes[noteKey]; SV('notes', notes); paint(); nb.classList.remove('open'); };
document.getElementById('n-del').onclick = () => { delete notes[noteKey]; SV('notes', notes); paint(); nb.classList.remove('open'); };
const panel = document.getElementById('panel'), plist = document.getElementById('plist');
const chTitle = n => { const c = DATA.find(x => x.num === n); return c ? ((c.intro ? 'Вступление' : 'Глава ' + n) + ' · ' + c.ptitle) : ''; };
const renderList = () => { const items = []; for (const [k,v] of Object.entries(marks)) items.push({k, kind:'★ закладка', ...v}); for (const [k,v] of Object.entries(notes)) items.push({k, kind:'✎ заметка', ...v}); items.sort((a,b)=>findByKey(a.k)-findByKey(b.k)); plist.innerHTML = items.length ? items.map(it => `<div class="it" data-k="${it.k}"><small>${it.kind} · стр. ${findByKey(it.k)+1} · ${chTitle(it.ch)}</small><span class="q">${it.q}…</span>${it.n?`<div class="n">${it.n.replace(/</g,'&lt;')}</div>`:''}</div>`).join('') : '<div class="empty">Пока пусто. Поставьте закладку ☆ или напишите заметку ✎ на любой странице.</div>'; };
document.getElementById('b-list').onclick = () => { renderList(); panel.classList.toggle('open'); };
document.getElementById('b-close').onclick = () => panel.classList.remove('open');
plist.addEventListener('click', e => { const it = e.target.closest('.it'); if (it){ pf.turnToPage(findByKey(it.dataset.k)); panel.classList.remove('open'); } });
document.getElementById('b-export').onclick = () => { const items = []; for (const [k,v] of Object.entries(marks)) items.push(`★ стр. ${findByKey(k)+1} · ${chTitle(v.ch)}\n   «${v.q}…»`); for (const [k,v] of Object.entries(notes)) items.push(`✎ стр. ${findByKey(k)+1} · ${chTitle(v.ch)}\n   «${v.q}…»\n   ${v.n}`); const blob = new Blob(['Буквы XX века — закладки и заметки\n\n' + items.join('\n\n')], {type:'text/plain'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Буквы XX века — заметки.txt'; a.click(); };
const q = document.getElementById('q');
const doSearch = () => { const term = q.value.trim().toLowerCase(); if (term.length < 2) return; const hits = []; pages.forEach((p,i) => { if (!p.dataset.key) return; const t = p.textContent.replace(/\s+/g,' '); const pos = t.toLowerCase().indexOf(term); if (pos >= 0) hits.push({i, ch: p.dataset.ch, snip: t.slice(Math.max(0,pos-60), pos+80)}); }); document.querySelector('#panel .ph b').textContent = 'Поиск: «' + q.value.trim() + '» — ' + hits.length; plist.innerHTML = hits.length ? hits.map(h => `<div class="it" data-p="${h.i}"><small>стр. ${h.i+1} · ${chTitle(h.ch)}</small>…${h.snip.replace(/</g,'&lt;').replace(new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'), m=>'<mark>'+m+'</mark>')}…</div>`).join('') : '<div class="empty">Ничего не найдено.</div>'; panel.classList.add('open'); };
q.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); if (e.key === 'Escape'){ q.value=''; panel.classList.remove('open'); } });
plist.addEventListener('click', e => { const it = e.target.closest('.it[data-p]'); if (it){ pf.turnToPage(+it.dataset.p); panel.classList.remove('open'); } });
document.getElementById('b-list').addEventListener('click', () => { document.querySelector('#panel .ph b').textContent = 'Закладки и заметки'; });
document.getElementById('b-full').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{}); };
document.addEventListener('fullscreenchange', () => { const k = keyOf(pf.getCurrentPageIndex()); SV('last', k); setTimeout(() => location.reload(), 150); });
const refs = d => { const k = keyOf(pf.getCurrentPageIndex()); SV('fs', d); SV('last', k); location.reload(); };
document.getElementById('b-minus').onclick = () => refs(Math.max(-4, FSB-1));
document.getElementById('b-plus').onclick = () => refs(Math.min(6, FSB+1));
document.getElementById('b-theme').onclick = () => { const order = ['', 'sepia', 'night']; const cur = order.indexOf(THEME); const nxt = order[(cur+1)%order.length]; SV('theme', nxt); location.reload(); };
document.getElementById('prev').onclick = () => pf.flipPrev();
document.getElementById('first').onclick = () => pf.turnToPage(0);
document.getElementById('last').onclick = () => pf.turnToPage(pages.length - 1);
document.getElementById('next').onclick = () => pf.flipNext();
document.addEventListener('keydown', e => { if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return; if (e.key === 'ArrowRight') pf.flipNext(); if (e.key === 'ArrowLeft') pf.flipPrev(); });
// ссылки оглавления: StPageFlip сам ловит клики по странице как перелистывание — глушим его события и переходим напрямую
tocPages.forEach(tp => tp.querySelectorAll('a[data-p]').forEach(a => {
  ['mousedown','mouseup','touchstart','touchend','pointerdown','pointerup'].forEach(ev => a.addEventListener(ev, e => e.stopPropagation()));
  a.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); pf.turnToPage(+a.dataset.p); });
}));
</script>
</body>
</html>
