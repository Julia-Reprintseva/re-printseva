<br>На месте, где сейчас мумия, сам Ильич, живее всех живых, вещает морю кепок.</p><p>Оформление на скорую руку, тоже живое, хаотичное и агрессивное (видите молнии во все стороны?). Культ личности состоит, как всегда, из живого и мертвого: слева огромный Маркс в сиянии, справа огромный докладчик в таком же.<br>Типографика острая и модная, тип Чехонин.</p><p>Заметим: у аудитории вообще нет никаких лозунгов, только штандарты под трибуной</p>", 1.0], ["img/08/08-002.jpg", "08-002", "<p>Первомай 1919, Рига<br>Первое, что бросается в глаза — нет штатских, а часть демонстрантов аж в седле.<br>На заднем плане импровизированная вроде как триумфальная арка. На ней сверху звезда (а не серп и молот, эмблема праздника труда). Еще видны звезды на штандартах конницы. На одной из них редкая эмблема: молот скрещен с косой.</p>", 1.0], ["img/08/08-003.jpg", "08-003", "<p>Н.А. Андреев, Д.М. Осипов. Монумент советской Конституции («статуя Свободы»), Москва, напротив Моссовета, 1918-1919. Кирпич, бетон.</p><p>Центральная композиция ленинского плана монументальной пропаганды. Большевики ищут символический ряд, куда можно вписаться, и вписываются сразу везде.</p><p>Обелиск — имперский символ. Первый привез Август, а моду на них задал Наполеон. Крылатая дева — то ли Ника, то ли муза (при чем здесь конституция?). Шар в ее руке — то ли держава, то ли земной шар — вселенские амбиции?</p><p>В целом, материал был какой попало, символика туманная. Народ прозвал статую Свободой, а шар арбузом. И ответил анекдотом:<br>Что это у вас Свобода напротив Моссовета? А потому, что у нас Моссовет против свободы.</p><p>Кончилось дело грустно: перед 800-летием Москвы в 1947 году обветшавшую свободу-конституцию взорвали, а на ее месте поставили конного и долгорукого князя Гюрги.</p>", 1.0], ["img/08/08-004.jpg", "08-004", "<p>Майские праздники в Москве 1924<br>Грузовик, груженый детьми. У них флажки (явно раздача). На борту грузовика моднейший леттеринг: «Диктатура рабочего класса — ключ к освобождению мирового пролетариата». А может, это никакой не грузовик, а забор трибуны?</p>", 1.0], ["img/08/08-005.jpg", "08-005", "<b>Титр из фильма «Сталинское племя». 1938 г., посвященного физкультпараду 1937.</b><p>Титры набраны (то ли написаны, то ли выложены) очень модным и гламурным шрифтом ардеко. На самом параде ничего подобного в типографике не было.</p><p>Надо сказать, фильм сделан довольно хитро. Он начинается с того, что девушка в спортивных трусах и майке выходит из подъезда (так, будто в Москве человек в кальсонах не должен идти только в сопровождении сотрудника милиции и только в отделение милиции), а потом идет по улице, вливаясь в стройные ряды таких же как она, собирающихся ниоткуда. И все они, смеясь и держась под ручки, выходят на площадь, а там сразу встают в ряды и начинают изображать живые фигуры.</p><p>То есть сто раз отрепетированный и жестко срежиссированный парад с кучей аксессуаров и гигантскими движущимися установками подается как свободная демонстрация.</p>", 1.0], ["img/08/08-006.jpg", "08-006", "<b>Кадр из фильма «Сталинское племя». 1938</b><p>Фигура «Звезда», возможно в честь свежеустановленных над Кремлем. Чей портрет в центре не знаю.</p>", 1.0], ["img/08/08-007.jpg", "08-007", "<b>Один из физкультпарадов 1930-х. Они проводились каждый год.</b><p>Не по уставу одетые девушки и юноши исполняют эволюции с винтовками, к которым прицеплены красные флаги.</p><p>Смысл действа на лозунге: сегодня физкультурник — завтра боец. Обратим внимание на стандартизированный гротеск надписи и на точку в конце.</p><p>Лозунг слева, видимо, начинается с «Мы пла-», но почему-то хочется сказать «пле-».</p>", 1.0], ["img/08/08-008.jpg", "08-008", "<b>Другой физкультпарад на том же месте.</b><p>Как я догадался, что другой? По флагу между Л и С, он повернут в другую сторону. И на нем читается «пламенный привет лучшему другу физкультурников». А еще шрифт другой на транспаранте.</p>", 1.0], ["img/08/08-009.jpg", "08-009", "<p>Третий физкультпарад с той же точки. Юноши изображают танк, а самый сильный — танковую пушку.</p><p>Теперь пламенный привет виден справа, вытянутый в строчку.</p>", 1.0], ["img/08/08-010.jpg", "08-010", "<b>Девушки несут много-много лучшего друга.</b>", 1.0], ["img/08/08-011.jpg", "08-011", "<p>Кадр из фильма «Сталинское племя», где видно, что он про 1937 год. Год с лампочками, палочным шрифтом.</p>", 1.0], ["img/08/08-012.jpg", "08-012", "<b>Еще кадр из из фильма «Сталинское племя», 1938.</b><p>Открывает парад общество «Локомотив». Символично. Буквы максимально лапидарные, даже моноширинные.</p>", 1.0], ["img/08/08-013.jpg", "08-013", "<p>Еще кадр из того же фильма, к сожалению нерезкий. Но и по нему видно размер катимой статуи лучшего друга.<br>На башнях музея шрифтовые композиции с выключкой по центру. Выключка по центру означает приказ прочитать, а не предложение.</p>", 1.0], ["img/08/08-014.jpg", "08-014", "<p>Еще один физкультпарад (я что-то увлёкся).<br>Внизу замерли многочисленные каре физкультурников. Над ними царит человек в фуражке полуростом в четыре этажа. На крыше изречение, начинающееся с очень крупного слова [жиз]НЕРАДОСТНЫХ, а дальше: «способных поднять могущество советской страны и защитить ее от покушений со стороны врагов». И подпись.</p>", 1.0], ["img/08/08-015.jpg", "08-015", "<b>Последний выбранный мной кадр из «Сталинского племени», 1938.</b><p>На высоте трехэтажного постамента по площади едут замершие, но живые Рабочий и Колхозница. Смотрим на орудия: и молот, и серп хоть картонные, но как настоящие. Серп даже с зубчиками.</p>", 1.0], ["img/08/08-016.jpg", "08-016", "<b>Настоящие титанические Рабочий и Колхозница.</b><p>Что меня напрягает в мухинском шедевре? Во-первых, они не идут. Слишком широко для шага. Это выпад, за которым должен последовать либо шаг назад, в исходное положение, либо дошаг вперёд с остановкой.<br>Во-вторых, это только сбоку динамика. А спереди — центральная композиция, символ устойчивости и нерушимой силы.</p>", 1.0], ["img/08/08-017.jpg", "08-017", "<b>ВДНХ, центральный павильон.</b><p>Высотка до высоток. Самый классический тип сталинского классицизма. На фронтоне 16 гербов республик. Над ними римским капитальным «союз советских и тд». Герб метров пять высотой. 16 флагов. Между ними трубы. Колонны с капителями, но без баз. Звезда на венке на шпиле. Две скульптуры с руками в разные стороны. Под шпилем еще флаги. А на фасаде крыши еще какие-то украшенные пенёчки метра по четыре каждый. Под портиком двери примерно шестиметровой высоты.</p><p>Зачем я всё это перечислил? Чтобы вы увидели: всё это богатство в целом соразмерно друг другу, но абсолютно не сопоставимо с микробами, копошащимися при входе. Каждый раз, проходя сквозь входной портал ВДНХ, я просто охреневаю от пафоса и от нечеловеческой, ликующей пошлости. Дорого и богато. Дорого и богато!</p>", 1.0], ["img/08/08-018.jpg", "08-018", "<b>Павильон №2.</b><p>Почти все колоннады на ВДНХ длинноногие примерно в два раза от ордера. Этим они слегка напоминают слонов Дали на паучьих ножках. Именно так и должна выглядеть монументальная попса</p>", 1.0], ["img/08/08-019.jpg", "08-019", "<b>Павильон №58 «Слово» (бывшее «Земледелие», бывшая «Украинская ССР»).</b><p>Мы сделали внутри этого павильона центр «Слово». Работа легкая, веселая, но серьёзная и не стыдная. Но сам павильон… Снаружи он примерно как Дворец Дожей. Изнутри — как помесь райкома и храма Цереры. Самое сильное чувство, как войдёшь — остановившегося времени. Ни в одном соборе такого нет. Как будто кто-то построил дорогущую декорацию, а шоу разорилось.</p>", 1.0], ["img/08/08-020.jpg", "08-020", "<p>Демонстрация колхозников под лозунгом «Мы колхозники на базе сплошной коллективизации ликвидируем кулака как класса». Начало 1930-х.</p><p>Ликвидаторы по большей части женщины. Основное оружие наступающих — грабли. Но есть и вилы.</p><p>В Москве примерно в это время проходят парады физкультурников. Но здесь, судя по одежде и погоде, осень.</p><p>Текст лозунга написан неумело, но очень старательно, на совесть.</p>", 1.0], ["img/08/08-021.jpg", "08-021", "<b>Схема металлоконструкций внутри Дворца Советов.</b><p>В реальности к 1941 году стройка дошла только до первого кольца. Потом металл разобрали на противотанковые ежи.</p>", 1.0], ["img/08/08-022.jpg", "08-022", "<p>Сверху: панорама Москвы реки с Дворцом Советов. Картинка из интернета. В книге не будет использована.<br>Снизу: Яндекс-панорама того же места от 2021 года. В книге не будет использована.</p><p>Выдохнули.</p>", 1.0], ["img/08/08-023.jpg", "08-023", "<b>1 мая 1943 года. Ленинград</b><p>Надо сказать, что возможности обычной, не монументальной пропаганды были в ссср несравнимо меньше, чем после его распада. Вне праздников пропаганда довольствовалась крышами, досками объявлений и другими сравнительно небольшими площадками.</p><p>Лозунги было видно не потому, что они занимали всё место, а потому, что им не с чем было конкурировать. Советские города были скудны.</p>", 1.0], ["img/08/08-024.jpg", "08-024", "<b>Путевые доски с названиями станций Московского метро сталинского времени.</b><p>Конечно, никакой Театральной не было: типографика та же, но видны дырки от надписи «Площадь Свердлова».</p><p>Что бросается в глаза? Отсутствие дизайна. В ссср, где всё было по плану и по стандарту, не было даже намека на стандартную типографику в метро. Ну ладно — пусть все станции разные. Но почему не связать их ниткой стандартных досок с названиями?</p><p>Качество антикв (а здесь одни антиквы) — от среднего до фантазийного. До римской провинции первого века н. э. не дотягивает никто.</p>", 1.0], ["img/08/08-025.jpg", "08-025", "<b>Памятная доска из вестибюля станции «Арбатская». 1952. Мрамор, бронза.</b><p>Обаятельный своей наивностью леттеринг. Особенно хороши первая М с неправильно поставленными ширинами штрихов (должно быть: узкий, широкий, узкий, широкий) и последняя Я с отдавленной ножкой.</p><p>Слой сталинской культуры был тонким и в любой момент мог сорваться в народное творчество</p>", 1.0], ["img/08/08-026.jpg", "08-026", "<p>Мозаика на станции «Киевская». Оригинальный вариант. Сейчас за спиной Ленина красная кашка на месте усатого товарища.<br>По ссылке можно посмотреть, скольких усатых товарищей лишился метрополитен:<br>https://moscowwalks.ru/2019/12/19/stalin-metro/</p>", 1.0], ["img/08/08-027.jpg", "08-027", "<p>Курская кольцевая. До 1956 г.<br>Санктуарий храма подземного бога. Псевдоним великого озарившего скрыт правым пилоном. На полукуполе ниши — намек и на Пантеон, и на могилу булочника Эврисака</p><p>Храмы подземного бога существовали на каждой станции кольцевой линии.</p>", 1.0], ["img/08/08-028.jpg", "08-028", "<b>Все высотки на одной картинке из интернета. В книгу она не пойдет.</b><p>Сможете опознать каждую? Нет ли вопросов, почему семь (должно было быть восемь) строившихся по единому плану зданий примерно одного силуэта настолько различаются в деталях? У меня есть ответ. А у вас?</p>", 1.0], ["img/08/08-029.jpg", "08-029", "<b>Еще немного демонстраций. Первомайская в Москве 1952 года.</b><p>Эти несколько иллюстраций показывают застывшую еще в тридцатые форму советского официального праздника. Меняются времена и правители, а флаги всё также кучкуются, и портреты всё также в ряд.</p><p>Кстати о портретах. В ряду живых вождей один вечноживой. А еще все равны, но два равнее на полголовы. Ну, и конечно за углом тот, кто реально главный, дан в полный размер — не на жалкий этаж, а на четыре.</p><p>Все шрифты — гротески в стиле «плакатное перо». То есть без намека на игру. Кроме надписи слева — «Таганский район». Там заморочились с антиквой.</p>", 1.0], ["img/08/08-030.jpg", "08-030", "<b>Хрущев открывает Маркса Кербеля. Торжественное открытие монумента 29 октября 1961 года</b><p>«На фоне Пушкина снимается семейство» (Окуджава)</p><p>Заложил этого Маркса еще Ленин, но потом как-то всё не срасталось. И вот, после выноса из мавзолея и предания стене усатого, воздвигся, наконец, патриарх «Капитала».</p><p>Внизу открывающие. Узнаю по центру Хрущева, за его правым плечом торчит жердь Суслова. Правее (от нас) Брежнев вскинул бровь, еще правее Микоян. Остальных сходу не опознал.</p><p>А вот Маркс очень хорош. В меру условный, с живинкой и добрым прищуром, по-ленински азартно вырастающий из гранитной скалы. И вообще не центральная композиция.</p><p>А какие буквы! Тонкая протофутура с микрозасечками, изящно прорезанная в глыбе. И что уже полная революция: выключка влево!</p><p>Не знаю, помните ли вы, лет десять назад я сказал: демократия в этой стране наступит, когда таблички на госучреждениях наберут строчными с выключкой влево. Спасибо, Лев Кербель, за первую попытку.</p>", 1.0], ["img/08/08-031.jpg", "08-031", "<b>Демонстрация на Красной площади. Неведомое 1 мая.</b><p>Точно после 20 съезда: портретная голова только одна, и это не усатый. Судя по качеству съемки — начало 70-х. Народ, кажется, в плащах. В светлых. Примета того же времени.</p><p>А вот типографика и оформление настолько устарелые, что можно и на хрущевские времена поставить</p>", 1.0], ["img/08/08-032.jpg", "08-032", "<b>1964 год. Москва. Демонстрация на 1 мая</b><p>Вот в 1964 году толпа потемнее. Декорации всё те же.<br>Но смотрите: «досрочно» на зеленом молотке скомпоновано живенько, не по центру! Оттепель (еще пока).</p>", 1.0], ["img/08/08-033.jpg", "08-033", "<p>Заинцы празднуют 1 мая в 1972 году<br>Город Заинск стоит на реке Зай в Татарстане. Я случайно наткнулся на фотографии демонстрации на заинском сайте. Там к ним, кажется, относятся бережно и с теплотой.</p><p>Что на этой фотографии из к монументальной пропаганды?</p><p>Во-первых, сама форма демонстрации. Она точно та же, что в Москве, просто поменьше и победнее. И архаичней, чего я сразу не заметил. На украшенном грузовике надпись «Заинская ГРЭС» шестидесятнического вида под конструктивизм. А на борту — плакат с голубем мира и разноцветными народами. Так было положено в те годы бескомпромиссной борьбы за мир на полях холодной войны.</p><p>Формат демонстрации ничем, кроме числа участников, не отличается от московского. Кроме флажка справа. Проверил: это не флаг Татарстана. Неужели флаг Заинска?</p><p>На центральном доме виден монументальный юбилейный плакат: 50 лет ссср, который я сначала принял за 50 лет ВОСР. Плакат, судя по цифрам, профессиональный, семидесятнический. На нем кремлевская башня со звездой и 15 флагов союзных республик. А по центру советский флаг. Это реалии 1970-х. В 1922 и республик было меньше, и звезд на кремле не имелось, но кто ж помнит.</p><p>На том же доме транспарант, относящийся не к Первомаю, а к биг дате: «да здравствует дружба народов ссср!». По-русски. В Татарстане.</p><p>Значит, на календаре не 1967, а 1972 год. А я-то удивился лесу самых разномастных телеантенн на крышах! В 1967 телевизор был почти роскошью. В 1972 — почти в каждой квартире. Но до центральных антенн еще не дошло.</p><p>Сам центральный дом — уменьшенная до трех этажей копия первых, еще серокирпичных, московских пятиэтажек с арочными остатками архитектурных излишеств, но с редкими балконами.</p><p>А вот дальше по улице дом в четыре этажа и с регулярными балконами. Вдруг понял: на сталинках балконы — декор и привилегия, на хрущевках — жилплощадь. Кстати, на белом доме слева балконов нет вовсе. Сталинка?</p>", 1.0], ["img/08/08-034.jpg", "08-034", "<b>Первомай в Москве, 1970, за два года до заинской демонстрации.</b><p>Цветущий застой. Формат демонстрации тот же, что лет десять назад, но есть нюансы. Гербы республик на стене. В колонне демонстрантов примерно тот же Ленин, что на позапозапрошлой картинке, выводит гуськом политбюро. Все видимые вдалеке дома отранспарантчены по карнизам от четвертого этажа и выше.</p><p>А на Историческом музее красочное панно. На нем более чем условный пролетарий на фоне такого же условного глобуса воздевает условнейшее знамя. Сверху написано, кажется: «выше знамя пролетарского интернационализма!» Снизу добавлено: «за единство всех ххххххххрхххххххских сил!» Антиимпериалистических? Композиция бодрая, не центральная. Классика застоя: за всё хорошее и да здравствует Капитан Очевидность.</p><p>Еще виден над толпой здоровенный кроваво-бордовый плоский ленин в развевающемся пальто, куда-то энергично спешащий.</p><p>Снимали с Василия Блаженного. На переднем плане Минин Пожарскому: смотри-ка, князь, сколько народу нагнали!<br>А плотный строй солдат держит оцепление, разделяя колонны. На мавзолее должен махать рукой энергичный еще бровеносец, но от Минина его не видать.</p><p>В моей голове непроизвольно крутится Ким:</p><p>«Все улицы как будто стали краше<br>И праздник как бы входит в каждый дом.<br>Сегодня все трудящиеся наши (и не наши)<br>Испытывают радостный подъем.</p><p>Они идут с плакатами, с цветами,<br>На них костюмы новые видать.<br>Давно уже расстались мы с цепями —<br>Нам, слава богу, есть, чего терять!»</p>", 1.0], ["img/08/08-035.jpg", "08-035", "<b>Фотомонтаж: сталинка с Яндекс панорамы (Земляной вал 48) против хрущевок.</b><p>Найдите элемент штучной архитектуры, он же монументальной пропаганды.</p>", 1.0], ["img/08/08-036.jpg", "08-036", "<p>Юноша в кепке лежит в траве на фоне клумбы «слава кпсс!»<br>На заднем плане скамейка, фонтан, ваза и некто гипсовый в шинели. Еще дальше редколесье: сосны, берёзы. Видимо, санаторий в средних широтах. После 1952 года.</p><p>Леттеринг клумбы старательный, но старообразный. Буквы С, А и К по моде 1930-х. Скорее всего, фото сделано до 1956 года. Слово «кпсс» тогда было ещё модной новинкой. Ну а слогану была суждена долгая жизнь</p>", 1.0], ["img/08/08-037.jpg", "08-037", "<p>Мозаика оттепели. Дворец пионеров. Улица Косыгина 17. Е.Аблин, А.Губарев, Г.Дервиз и другие, 1962.</p><p>Правая часть длинной панорамы. С одной стороны, всё идеологически безупречно. Ленин на флаге, ГЭС на реке, мирный атом на руке.</p><p>С другой — стилистически свободно, да и вообще декоративная композиция из отдельных кусков с белыми просветами. Очень условные фигуры. «Выключка» вправо. Формализм, одним словом. За десять лет до 1962 за такое можно было вылететь из союза художников.</p><p>«А за что его? Да за абстракцию…<br>Это ж надо! А трезвона подняли»</p><p>Галич</p>", 1.0], ["img/08/08-038.jpg", "08-038", "<b>Гидрометцентр. Большой Предтеченский пер 11. Художник неизвестен, 1965</b><p>Мозаика уже постхрущевская, но пластика и тематика оттепельная. Лежаче-летящий нереалистический космонавт, никакой центральности, на фоне сплошное миро (не в смысле мироздание, а в смысле абстракции).</p>", 1.0], ["img/08/08-039.jpg", "08-039", "<b>Мозаика на брандмауере. Типография «Детская книга». Сущевский вал 49. И.Бережной, 1979</b><p>Поворачивая с Сущёвки в сторону издательства «Просвещение», где в 1981-88 годах клепал обложки, картинки и макеты, каждый раз впирался в эту мозаику, думал: «какой ужас» и пытался прочитать, что там выкамушковано.</p><p>А там что-то из Ленина про воспитание, но дальше неразборчиво, лишь слышно город-сад. И детки, и книжки, и красные звезды, и космонавт, и даже строят трёхэтажный дом в Заинске. И родина-мать-училка зовет куда-то разными руками.</p>", 1.0], ["img/08/08-040.jpg", "08-040", "<p>Библиотека 2-го медицинского института имени Пирогова. Ул. Островитянова 1с5. «Исцеление человека», Л.Полищук, С.Щербинина, 1979</p><p>Малая часть эпичнейшей панорамы. Модный шрифт. Композиция и даже буквы через угол! Картинки напоминают то ли Кирико, то ли Дали. В застойные времена иногда проскакивали совершенно невероятные вещи. Эта похожа на медицинский вариант «Соляриса».</p><p>Является ли она монументальной пропагандой? Да, несомненно. Но чего?</p>", 1.0], ["img/08/08-041.jpg", "08-041", "<b>Монумент «Слава советской науке». Воронеж. Народное название: «Молекула».</b><p>Говорят, объект должен был стоять в Зеленограде, но тамошние жители его забраковали. И тогда один воронежский гендиректор обменял композицию на три тонны металла и привез к себе в Воронеж.</p><p>Монумент — характерное и наивное сочетание стилизованных абстрактных форм и предельно конкретного флага-ленты с лозунгом — формы, известной со средних веков.</p><p>Это, несомненно, монументальная пропаганда. Понятно, для чего она предназначалась в наукограде Зеленограде. Но что ей делать на перекрестке в Воронеже? Мне кажется, это тот случай, когда советская идеосфера начала сама порождать лозунги, как сор — стихи у Ахматовой.</p><p>Однако, на фото есть еще кое-что. А именно полнопрофильная, с колоннами и лепниной, сталинка областного масштаба, а за ней даже микровысотка, немного похожая на колокольню. Это следствие самопроизвольного расползания сталинского имперского стиля</p>", 1.0], ["img/08/08-042.jpg", "08-042", "<p>Плакат «Планы партии — планы народа» со Шварценеггером в главной роли.<br>Эпоха застоя. Автора не искал</p><p>Плакат удачно имитирует типовую крышную установку семидесятых. В нём есть всё: туповатый персонаж, мутный пафос, полная неподвижность и полное отсутствие идеологического соблазна</p>", 1.0], ["img/08/08-043.jpg", "08-043", "<p>Плакат «бам-бам-бам-бам-бам! Партия сказала надо — комсомол ответил есть»<br>Поздний застой, строительство Байкало-Амурской магистрали (БАМ). 1974 — далее везде.</p><p>В центре находящийся в старческой эйфории генсек. Он в зимнем, все в летнем. Стилизация (очень поверхностная) под плакаты конструктивистов и журнал «ссср на стройке». Плакат выглядит настолько издевательским, что непонятно, куда смотрела цензура.</p>", 1.0], ["img/08/08-044.jpg", "08-044", "<b>Брежневский брутализм. Серп-и-молот-и-звезда. Бетон. Город Сатка, недалеко от Челябинска</b><p>Качественный пример бессмысленного символизма. Интересно, как забрался на молот любитель Анастасии</p>", 1.0], ["img/08/08-045.jpg", "08-045", "<p>Последний кейс этой главы. Я наткнулся на него случайно, но решил, что здесь сошлось много черт, относящихся к монументальной пропаганде. Это первая из четырех иллюстраций о многослойном монументально-пропагандистском памятнике в Волгограде. Общий вид</p><p>Этот комплекс расположен на площади Ленина на проспекте Ленина. Тыльной стороной он примыкает к тылу военно-патриотического комплекса «Дом Павлова».</p><p>Сам знаменитый дом был отстроен еще в войну. Потом, в 1950-52, по бокам от него построили ещё два похожих. Позже, в 1960 году, поставили мощный памятник Ленину лицом к проспекту, спиной к дому Павлова. Видимо тогда же три дома за спиной Ильича были соединены полукруглой колоннадой. Наконец, уже в 80-е, на всю заднюю стену Дома Павлова смонтировали трехэтажной высоты барельеф, посвященный обороне этого дома. Видимо тогда же с противоположной стороны дома была открыта памятная стела.</p><p>Получившийся в результате конгломерат за счет осевой центральной композиции может показаться единым комплексом. Однако стоит присмотреться, как он распадается на противоречащие друг другу части.</p><p>Колоннада, крашенная желтой краской, выглядит объектом муниципального строительства. Она хорошо держит площадь, отгораживая пространство Ленина от пространства Павлова, но красоты и пафоса в ней немного.<br>Продолжение на следующей картинке</p>", 1.0], ["img/08/08-046.jpg", "08-046", "<b>Волгоград продолжение</b><p>Памятник Ленину состоит из двух почти враждебных друг другу частей. Наверху стоит классический труд скульптора Вучетича: как бы реалистический исполин с хорошо пересчитанными пуговицами на жилете, театральным жестом приглашающий гостей за невидимый стол. Этот жест настолько противоречит известному ленинскому тычку рукой в оппонента, описанному Пастернаком как «выпад на рапире», что даже удивительно. К тому же у колосса маленькая голова. Вся фигура относится к сталинскому стилю, напоминая солдата в Трептов парке того же автора.</p><p>А снизу — довольно удивительный постамент. Он, конечно, изображает очень условный броневик. Сверху круглая башня, ниже скошенная броня. А там, где у броневика радиатор, вдруг вопит совершенно мавзолейного вида огромная надпись «ЛЕНИН». Как будто в ссср надо было кому-то объяснять, кто стоит на пьедестале с рукой наотмашку.</p><p>Весь пьедестал — шестидесятнический суровый стиль из красного гранита. Надпись тоже очень характерная для шестидесятых — гротеск с остроугольными Л, И.</p><p>Теперь памятная стена Дома Павлова. Это плоский, но толстый бетонный рельеф по кирпичной стене в стиле брежневского брутализма. При всем своем пафосе он собран из готовых образов, один из которых — солдат, двумя руками метающий связку гранат — прямо позаимствован с картины «Оборона Севастополя». Стена сильно проигрывает Ленину, даже несмотря на его явную эклектичность.</p><p>Все три объекта — памятник, колоннада, стена — разными языками говорят о разном. Памятник — типично советский маркер владения: это место принадлежит коммунистам. Неважно, что никакой ленин никому отсюда не указывал. Мы назвали бывшую торговую площадь этим именем — теперь живите с ним. Как москвичи с мумией в мавзолее.</p><p>Дом Павлова — значительно более важный для этого города мемориал. Он стоит прямо на месте исторических событий. Но так вышло, что он развернут в другую сторону, а в тыл к фикции Ленина попал по случаю. И вот обзавелся стеной, выглядывающей из-за Ленинской спины, как бы из подвала.</p><p>Колоннада — неловкая попытка разграничить два пространства. Она направляет внимание в центр площади, на пафосный памятник пустоте, и отбирает воздух памяти у защитников этого места.</p><p>Продолжение на следующей картинке</p>", 1.0], ["img/08/08-047.jpg", "08-047", "<b>Типографика задней стены Дома Павлова</b><p>Мемориальная надпись — самая удачная часть стены. Здесь брутализм более чем уместен, да и врезанные в камень буквы сделаны качественно. Единственное, чем пренебрег исполнитель-монументалист — знаки препинания. И совершенно напрасно. Именно такие мелочи позволяют проявить уважение к героям места, не слепливая их инициалы в бессмысленные пары букв. И ритм чтения от этого только улучшился бы. Чтобы понять это, нужен был типограф. Но его не позвали.</p>", 1.0]], "research": {"task": "Изучить эволюцию монументальной пропаганды — оформление парадов, демонстраций, стационарные конструкции — с 1917 по 1991: идеология, лозунги, типографика, материалы; собрать максимум визуального материала.", "work": "Один рабочий день: 11:55 задание → 12:05 каркас в Perplexity → 12:10 бриф в проекте для промптов → 13:00 отчёт Gemini → 14:01 итоговый документ и PDF. Три системы, три отчёта.", "tools": "Perplexity, ChatGPT Deep Research, Gemini Deep Research", "dates": "февраль 2026"}}, {"intro": false, "num": "09", "title": "Случай Банниковой и не только, или А был ли план?", "ptitle": "Случай Банниковой и не только", "subtitle": "или А был ли план?", "date": "12 марта 2026 г.", "perm": "https://www.facebook.com/100000723643455/posts/26643468658593894/", "slug": "shriftoviki", "html": "<p><span class=\"dc\">Н</span>есколько глав назад (ссылка в комментарии) я описал геноцид шрифтов в ссср в начале 1930-х. Тогда собрались умные дяди, решили бороться с буржуазными предрассудками и переплавили 75% Бертгольда, Лемана и иже с ними. И был составлен план развития шрифтового хозяйства на века вперед, упершийся в Литературную гарнитуру.</p>\n<p>Здесь, прежде чем перейти к одной из героинь главы, я хочу остановиться и предьявить большевикам претензию, достойную их героического замаха.</p>\n<p>Что такое шрифтовая библиотека целой культуры? Это не просто буковки, которыми набирают книги, газеты, учебники, рекламу, объявления, навигацию и всё прочее, вплоть до трамвайных билетов.</p>\n<p>Это идеально точное зеркало, отражающее состояние культуры. Ее уровень, в том числе интеллектуальный, амбиции, запросы, отношения с модой, возможности точно решать все возникающие задачи.</p>\n<p>В двадцатый век Российская империя вошла как крупный и бодро развивающийся типографический рынок. Почти ничего своего еще не производя, но жадно потребляя всё новое от соседей.</p>\n<p>В 1914 прервались поставки из Германии. РИ, а потом Р.С.Ф.С.Р. и ссср оказались отрезаны от шрифтовых трендов. Потом решили, что самые умные, и переплавили, что было в запасе. А что создали взамен?</p>\n<p>Взамен были утопические идеи о каком-то новом человеке, которому нужны будут новые буквы. И реальность культурного слома, когда типографика из одного из инструментов культуры превратилась в часть государственного производства — вместе с выплавкой чугуна и клёпкой танковой брони.</p>\n<p>ссср лет на тридцать просто выпал из мировой шрифтовой культуры. Что драматически сказалось на уровне потребления наборных букв. Советские граждане десятилетиями жевали Литературную гарнитуру.</p>\n<p>Когда же развитие типографического производства потребовало обновления шрифтового парка (следите за стилем изложения) — появился ВНИИ Полиграфмаш, а в нём даже Отдел наборных шрифтов. Который стал разрабатывать гарнитуры для чего? Правильно, для производства печатной продукции.</p>\n<p>Во всем мире новые шрифты появлялись для потребителей чтения, а в ссср — для производителей печати.</p>\n<p>Был ли в производстве новых шрифтов план? Да, конечно. Во-первых, они должны были экономить бумагу (см. Кудряшевская Энциклопедическая). Во-вторых, они должны были читаться несмотря на все усилия печатников (тут широкий ассортимент, вершиной которого стали очень поздние фотонаборные Тип Бодони и Тип Таймс). Ну, и наконец они должны были закрывать бреши в самом необходимом ассортименте (см. Журнальная Рубленая). Конечный потребитель, он же Новый Человек Эпохи Коммунизма, должен был всё это кушать и просить добавки.</p>\n<p>Теперь пора вспомнить о лучшем советском шрифте всех времен — Банниковской гарнитуре.</p>\n<p>Банникова Галина Андреевна<br>* 1901 (Сарапул) †1972 (Москва)<br>Окончила Всероссийскую академию художеств (1925-1930).<br>Работала в шрифте, книжной и станковой графике. Основные шрифты: Банниковская гарнитура. 1950; гарнитура «Байконур». 1960-1969; акцидентный шрифт гарнитуры «Кама» для строкоотливного крупнокегельного набора на машинах «СК». 1967-1971, и другие.</p>\n<p>(CV из лучшего советского издания о шрифтах, «Искусство шрифта. Работы Московских художников книги. 1959-1974» созданного М. Г. Жуковым и ко в 1978 г.)</p>\n<p>Как видите, Банникова не «художник книги», а профессиональный шрифтовой дизайнер. Главная область работы — наборный шрифт. Вспомним Телингатера, который был типографом очень широкого профиля. За сорок лет работы Банникова выпустила три заслуживших упоминания шрифта, из которых более или менее известной стала только Банниковская.</p>\n<p>Чтобы оценить качество проработки контура, посмотрите на отдельную букву Б среди картинок. Как живо, не механически, сделаны наплывы в местах стыков. Как филигранно проработана волнообразная верхняя крышка. Как прорисован полуовал с деликатным утолщением относительно основного штриха. Как мягко полнеет клюв верхнего терминала.</p>\n<p>А потом посмотрите увеличенный кегль 10 из каталога наборных шрифтов. И спросите себя: а нахрена старалась Галина Андреевна?</p>\n<p>Банниковская была выпущена в широком диапазоне кеглей — от восьмого (!) до тридцать шестого. Ей кое-что набирали, но по сути дела она оказалась никому не нужна. Все ее изыски — отсылки к Петровской Гражданской, к Баскервилю, все ее наплывы и курсивы остались личным достижением автора.</p>\n<p>И все мы — бывшие советские типографы — обязательно вздохнем, вспоминая: ах, Банниковская…</p>\n<p>В начале 80-х я пытался было пиратски передрать ее из жуковского фолианта, благо весь алфавит был налицо, да так и не нашел применения. Время ушло.</p>\n<p>Пример Банниковской очень характерен. Иногда плановое хозяйство давало кряк и позволяло авторам доводить до серии весьма неожиданные проекты. У той же Галины Банниковой есть гарнитура Байконур с обратным энтасисом. Какой обратный энтасис в электричке Москва–Петушки?! А впрочем, только там он и энтасис. Под кориандровую.</p>\n<p>Примерно так же, как у Банниковской, сложилась судьба других именных гарнитур: Бажановской, Жихарева, Кузаняна, Лазурского, Рерберга, Телингатера. Они были выпущены, попали в каталоги и в ассортимент типографий, но зачем?</p>\n<p>Если бы речь шла о частном предпринимательстве, не было бы вопросов. Ну, выпустили что-то по случаю, не полетело. Но в ссср, можно напомню, был вечный план гармонического производства только особо необходимых изделий. А вот эти разнородные, разностильные, не имеющие общего культурного кода буквы — они точно были выпущены по плану?</p>\n<p>Это с одной стороны. А с другой, имея в арсенале Телингатера, Лазурского, Банникову, Кузаняна и еще нескольких блестящих профи, получить от каждого по одному-два случайных акцидентных (или даже текстовых) шрифта — не есть ли бездарное расточительство ограниченных ресурсов?</p>\n<p>Или, может быть, предположить третий вариант: развитие шрифтового комплекса шло само по себе, имея внутреннюю логику, связанную с общим развитием культуры, а плановое хозяйство было просто идиотским корсетом, в который неразумные большевики пытались запихнуть расползающиеся прелести новой кириллицы?</p>\n<div class=\"orn\" role=\"separator\"><b></b></div>\n<p>На другой стороне планового хозяйства возвышается монументальная фигура Кудряшева.</p>\n<p>Кудряшев Николай Николаевич<br>* 1909 †1991 (Москва)<br>Учился в Высшем художественно-техническом институте — ВХУТЕИН (1926-1928).<br>Работал в наборном шрифте, живописи. Основные шрифты: наборный газетный шрифт (Эксцельсиор) — совместно с М. Щелкуновым. 1936; Ново-газетная гарнитура. 1945; Газетная рубленая гарнитура (узкая). 1952; шрифт для журнала «Советский Союз». 1952; Словарная гарнитура. 1952-1954; Энциклопедическая гарнитура. 1954; газетная Трудовская гарнитура. 1954-1956; шрифт для сочинений В. И. Ленина. 1971 и другие. Все работы выполнены с 3. Масленниковой.<br>Первая премия на конкурсе шрифтов стран СЭВ в Дрездене в 1971.</p>\n<p>Тандем Кудряшев-Масленникова был предельно эффективным и высокопрофессиональным. Они не выпендривались, но решали поставленные задачи. Именно их Энциклопедическая гарнитура (возможно, первая в ссср суперсемья с сильно расширенным знаковым составом) сэкономила чуть ли не целый лес бумаги за счет укороченных выносов, уменьшенного интерлиньяжа и отличной читаемости в мелких кеглях.</p>\n<p>Все шрифты Кудряшева системны и хорошо простроены. Если кого-то называть советским Фрутигером, то Кудряшева-Масленникову. Разница только в том, что эта пара не делала ничего нового. Или скорее так: их шрифты сделаны строго по техзаданию.</p>\n<p>Смог бы так Лазурский? Не знаю. Телингатер, возможно, сумел бы партийной ногой наступить себе на горло, но и ему бы нужна была бригада отрисовщиков. А Кудряшевы справлялись сами.</p>\n<p>На мой взгляд, шрифты Кудряшева и есть «хорошее плановое советское» — то, что могла предложить эта культура, не зарываясь и не проваливаясь.</p>\n<p>Правда, для их появления не обязательно было переворачивать всё в октябре 1917. Достаточно было начать где-то в двадцатые издание энциклопедии — и Бертгольд с Леманом подогнали бы какой-нибудь мелкокегельный эксклюзив.</p>\n<p>В самом начале века я много верстал гарнитурой Петербург — паратайповским вариантом Кудряшевской энциклопедической, разработанной Владимиром Ефимовым. Шрифт легко и уверенно стелился в наборе, не заставляя спотыкаться ни на одной букве. Имел ровный вкус, не раздражающий, но и не радующий. Он был, пожалуй, лучшим из всего, что мог в нулевые предложить Паратайп. И всё же было ощущение, что этот шрифт заменяет какой-то другой, более точный, более органичный для этого языка. И так со всей библиотекой Отдела наборных шрифтов.</p>\n<p>Не то, чтобы советские наборные шрифты были плохи. Но в них было какое-то дребезжание и морок. Как будто сквозь эти буквы пыталось пробиться что-то другое, не состоявшееся, намного более точное.</p>\n<p>Возможно, это были просто Футура, Гельветика (но не Журнальная рубленая), Сенчури (не путать со Школьной), Баскервиль (но не Банниковская), Гарамон (а не Лазурского)?</p>\n<p>Кстати, с гарнитурой Лазурского в новые времена произошел легкий конфуз. Она была выпущена как нечто изысканно-классическое, книжное — а набирали ей преимущественно дамские романы. Впрочем, Оптима тоже не создавалась для шампуней, но стала королевой парфюма.</p>\n<p>Там, где рыночная экономика (она же Природа) изобретет, кроме коровы и козы, муравьеда и трубкозуба, плановая предложит пользователю кушать муравьев вилкой, ибо нефиг выпендриваться. Но вдруг, крякнув, запустит в серию муразуба-трубкоеда, изготовленного строго по госту. Вот примерно так было с наборными шрифтами в ссср.</p>\n<p>Ни Банниковская, ни Лазурского не потеснили Литературную. Её вышиб пинком Таймс — но это произошло уже в другую эпоху.</p>\n<p>И перейдем к картинкам.</p>\n<p class=\"ps\"><span class=\"pslabel\">PS</span> Рассказ о том, что нашел ИИ по теме, выйдет отдельным постом</p>", "figs": [["img/09/09-001.jpg", "09-001", "<p>Две книги с одинаковым названием: «Искусство шрифта. Работы московских художников книги». Формат обеих 70×108 в 1/8. Первая отпечатана в Риге в 1960, вторая в Вене в 1977.</p><p>Первая книга — обычный советский послесталинский альбом. Рижане старались: конгрев и золото на переплете до сих пор впечатляют.</p><p>А вот вторая книга — абсолютный шедевр, лучший из виденных мной альбомов советского времени. Печать по белым плашкам на серой верже, крашеной в массе. Из верже же — но, кажется, более тонкой — суперобложка. А сверху футляр, ей же вержей же оклеенный.</p><p>Я, мерзкий варвар, много лет накрывал этим томом кювету с проявителем, поэтому покровы поизорвались. Но и сейчас видно масть и стать.</p><p>Шрифт, обратите внимание, Гилл Санс, которого в союзе никто не нюхал. И всё это произвелось на свет благодаря М.Г. Жукову — единственному в ссср дизайнеру, который мог себе такое позволить.</p><p>Лучшие картинки этого поста взяты из этого фолианта</p><p>В альбоме 1960 года нет ни одного шрифтового дизайнера. Ни Банниковой, ни Кудряшева. Лазурский с Телингатером есть, но наборные спесимены отсутствуют. Не барское дело.</p><p>А вот у Жукова акцент сделан на набор, и справедливость постфактум восстановлена.</p>", 1.0], ["img/09/09-002.jpg", "09-002", "<p>Развороты с Лазурским из альбомов 1960 и 1977 года. Обратите внимание на потрясающую раскрываемость тома Жукова. Она достигнута за счет хитрого устройства корешка</p>", 1.0], ["img/09/09-003.jpg", "09-003", "<p>Предисловие из третьего моего источника: «Каталога ручных и машинных шрифтов», М., Книга, 1966.<br>«Цель данного Каталога — показать образцы ручных и машинных шрифтов, изготовляемых на отечественных заводах».<br>Это правда.</p><p>«Любой из воспроизведенных в Каталоге шрифтов может быть заказан полиграфическим предприятием по требованию издательства».<br>А вот это враньё. Не любой, не любым, не всегда и не всем. Потому что ешь, что дают. Здесь не ресторан.<br>Но самое главное: до 1917 года любой шрифт мог быть куплен любым человеком — были б деньги. Или заказан набор этим шрифтом.</p><p>Что же до качества печати в этом каталоге — даже здесь видно, каково оно</p>", 1.0], ["img/09/09-004.jpg", "09-004", "<p>Банникова похожа на школьную учительницу. На самом же деле она интересный исследователь и тонкий дизайнер. Которому повезло с реализацией задуманного, но не подфартило с местом и временем</p>", 1.0], ["img/09/09-005.jpg", "09-005", "<b>Банниковская гарнитура. Там даже политипажики попадались. Страница из Жуковской книги</b>", 1.0], ["img/09/09-006.jpg", "09-006", "<p>Буква Б из Банниковской, сильно увеличено. Оцените сложность формы. А заодно — фактуру бумаги и качество венской печати</p>", 1.0], ["img/09/09-007.jpg", "09-007", "<p>Банниковская в мелком и среднем кегле (отдельная Б рядом с большой). Внимательно смотрим на качество набора, ровность строки, растискивание. Стоила ли овчинка выделки?</p>", 1.0], ["img/09/09-008.jpg", "09-008", "<b>Банникова. Гарнитура «Байконур». Даже издалека чувствуется пряность</b>", 1.0], ["img/09/09-009.jpg", "09-009", "<p>Банникова. Гарнитура «Байконур». Детали. Обратный энтазис — это еще не всё! Вы посмотрите, как прорисованы Фф</p>", 1.0], ["img/09/09-010.jpg", "09-010", "<p>Полоса, посвященная Кудряшеву (здесь он Кудряшов). Трудовая гарнитура: 12 начертаний! Для советского времени нечто немыслимое. Говорю же: Фрутигер</p>", 1.0], ["img/09/09-011.jpg", "09-011", "<p>Разворот с Кудряшевской энциклопедической гарнитурой, в которой имеется не только гречица, но даже готика. В «Петербурге» этаких роскошей не осталось</p>", 1.0], ["img/09/09-012.jpg", "09-012", "<p>Лазурский в Риме б был Катулл. Но настоящего Траяна почему-то так и не сделал. Гарнитура Лазурского — не римский капитальный шрифт и не венецианская антиква. И не новый извод Гарамона. Это некая тоска по мировой культуре, данная в ощущениях советского художника книги, вынужденно ставшего шрифтовым дизайнером</p>", 1.0], ["img/09/09-013.jpg", "09-013", "<p>Телингатер в молодости мог бы стать автором авангардных шрифтов — если бы попал в Баухаус. А в зрелом возрасте — чего-нибудь вроде чихольдовского Сабона. Но увы — оставил только Акцидентную. Хороший шрифт, но что ж так мало? Справа — гарнитура Народная, кусочек</p>", 1.0], ["img/09/09-014.jpg", "09-014", "<b>Эскиз Акцидентной Телингатера</b>", 1.0], ["img/09/09-015.jpg", "09-015", "<p>Разворот из «Каталога ручных и машинных шрифтов» с гарнитурами Телингатера и Рерберга. Островок битого ардеко в море соцреализма</p>", 1.0], ["img/09/09-016.jpg", "09-016", "<b>Мне всегда нравился Кузанян.<br>Еще в прошлом веке, когда баловался его Декором.</b>", 1.0], ["img/09/09-017.jpg", "09-017", "<b>Гарнитура Кузаняна — один из малоиспользованных интересных советских шрифтов</b>", 1.0], ["img/09/09-018.jpg", "09-018", "<p>Журнальную рубленую перепилили с Эрбар гротеска. Пилить начали еще до войны. У этого шрифта масса странностей. Первая — он почему-то страшно растискивался. Это заметно и в каталоге. Вторая — его регулярное начертание в текстовых кеглях было слишком жирным, а болд — прямо совсем черным. Еще он был слишком широким. И наконец, в кеглях мельче 14 у него были другие а, Жж, Кк, Лл, чем в более крупных.</p>", 1.0], ["img/09/09-019.jpg", "09-019", "<p>Титул «Каталога ручных и машинных шрифтов», М., Книга, 1966. Набор Журнальной рубленой с разными К в мелком и крупном кеглях</p>", 1.0], ["img/09/09-020.jpg", "09-020", "<b>Два разворота из каталога шрифтов фотонаборной машины «Каскад». 1983</b><p>Достойный предперестроечный финал семидесятилетнего развития советской шрифтовой индустрии. Шрифты Тип Бодони и Тип Таймс.</p><p>На что смотреть? На тонкие штрихи. Они сделаны потолще, чтоб не стравились. В результате обе гарнитуры как в скафандрах, или как будто их обвели контуром.</p>", 1.0], ["img/09/09-021.jpg", "09-021", "<p>Тип Таймс. Мне кажется, худшее, что могло произойти с Таймсом — это потеря остроты. И это не шрифтовые дизайнеры из ОНШ разучились буквы рисовать. Это ТЗ у отечественного производителя было такое.</p><p>Вот что бывает, дети, когда вместо работы на потребителя отрасль занимается выполнением плана по печати</p>", 1.0]], "research": {"task": "Биографии авторов наборных шрифтов 1930–1960, каталог гарнитур, типология, был ли государственный план разработки шрифтов; доработка — краткие биографии и исправления.", "work": "Двухступенчатый промптинг: модель сначала выступает как специалист по брифам, сама пишет ТЗ и задаёт восемь вопросов о глубине, потом идёт исследование. Три запуска — два первых с ошибками, третий пошёл в главу. Правки — в тот же день.", "tools": "ChatGPT Deep Research", "dates": "март 2026"}}, {"intro": false, "num": "10", "title": "Анализ двух книг «Искусство шрифта. Работы московских художников книги» (1960 и 1977)", "ptitle": "Анализирую две книги с одним названием: «Искусство шрифта. Работы московских художников книги»", "subtitle": "", "date": "21 марта 2026 г.", "perm": "https://www.facebook.com/story.php?story_fbid=26733763439564415&id=100000723643455", "slug": "iskusstvo-shrifta", "html": "<p><span class=\"dc\">Э</span>ту главу можно считать продолжением предыдущей, где я показал два альбома «Искусства шрифта». В этот раз хочу внимательно сравнить их: время выхода, состав участников, тематику, особенности показанных работ. Будем звать их кратко: «ИШ-1960» и «ИШ-1977».</p>\n<p>«ИШ-1960» готовился два года и вышел в 1960. Это середина оттепели (с 1954 до 1956 ее начало, а основной период — 1956–1964). Карибский кризис, кукуруза, первые хрущевки. Гагарин еще не полетел, но уже вот-вот. Нынешнее поколение будет жить при коммунизме. Застой пока не чуем никем нигде.</p>\n<p>«ИШ-1977» сдан в набор в 1974, подписан в печать в 1977. Три года в производстве. Это расцвет застоя и развитого социализма. Бровеносец еще вяжет лыко, отпраздновали 60 лет октября, впереди олимпийский мишка и Афган.</p>\n<p>Внешний вид альбомов был кратко описан в прошлый раз. Теперь подробности.</p>\n<p>«ИШ-1960»<br>Издательство «Искусство», Москва<br>Формат: 70×108 в 1/8, или 26,5×34 см. Корешок толщиной 20 мм. Корешок круглёный, переплёт с форзацами. Переплёт твердый тканевый с глубоким блинтовым тиснением и запечаткой шрифтом золотом и черной краской. Раскрываемость очень хорошая.<br>Внутри бумага матовая, примерно 120 г/м, 148 страниц.<br>Печать плашками как бы в четыре краски: черная, красная, серая, бледно-желтая, но красная краска сильно варьируется — от ярко-оранжевой через алую в глухую вишнево-коричневатую. Возможно, так и задумано, но замысел не вполне ясен. Печать рижская, то есть лучшая из возможных советских. Перед выходными данными — длинный список технических специалистов Образцовой типографии, г. Рига.<br>Макет и оформление Г. В. Дмитриев<br>Цена 16 р. 80 к. (С 1 января 1961 г. цена 1 р. 68 к.).<br>Основной шрифт: Журнальная Рубленая.</p>\n<p>«ИШ-1977»<br>Издательство «Книга», Москва<br>Формат: 70×108 в 1/8, или 27×34 см. Толщина корешка 34 мм. Корешок плоский, с приклейными сторонками из толстого картона, оклеенного верже. Ляссе. Печать на переплете в одну краску без тиснения. Раскрываемость идеальная.<br>Сверху суперобложка из верже с печатью плашками в четыре краски: терракотовый, черный, прозрачный серый, белый. На всё это надет футляр из толстого, оклеенного верже картона с печатью в три краски: терракотовый, серый и черный.<br>Внутри бумага серая верже крашенная в массе 160 г/м. 188 страниц.<br>Печать… Тут я в некотором ступоре. В основном это плашки в три краски: белая (чаще всего фон, перекрывающая серый цвет бумаги), красная в терракотту, черная. Но везде, где нужен полноцвет и тон, вступает, видимо, четырехкрасочная печать. Правда, некоторые плашки закатаны еще какими-то цветами, например сине-зеленым. Что там была за машина и как делались оригиналы в еще докомпьютерную эпоху — надо спросить у великого МГЖ*. Печать выше всяких похвал. Последняя строчка выходных данных: Типография Глобус, Вена<br>___________<br>*МГЖ — Максим Георгиевич Жуков<br>Оформление Максима Жукова<br>Цена 18 р.<br>Основной шрифт: Gill Sans</p>\n<p>Сравним технические характеристики, как это любим мы, ситизены века гаджетов.</p>\n<p>Первое: время. С 1960 до 1977 прошло почти целое поколение. Несмотря на это, как и на то, что книги выпущены разными издательствами, между ними есть очевидная связь. Точнее даже: вторая книга прямо продолжает первую, об этом сказано в ее аннотации. Отсюда, видимо, единый формат и некоторое сходство в работе с цветом. И это всё, что есть общего.</p>\n<p>Во всём остальном «ИШ-1977» антипод «ИШ-1960».</p>\n<p>Внешнее оформление.</p>\n<p>«ИШ-1960» — обычный художественный альбом: В меру монументальный переплёт, авантитул, распашной титул раннешестидесятнического вида, слегка напоминающий титул раннего Телингатера. Да и сами буквы названия балансируют между Телингатером и Лазурским: монументальность в сочетании с живостью. В 1960 году это смотрелось свежо. Сейчас выглядит скорее не оттепелью, но проталиной в сталинском ледниковом периоде.</p>\n<p>Внешний ансамбль «ИШ-1977» — даже не вызов предку, а показательное избиение. Всё в этой томине (в полтора раза толще), начиная с футляра, демонстрирует отвратительную советским нищебродам, но скромно упоённую собой европейскую роскошь. Да, я толстый и красивый парниша. Ты никогда не видел верже? А у меня из него и пальто, и костюм, и даже наборное полотно. Как тебе наощупь? И вот да: роскошный том не может без ляссе (ты еще не забыл за полвека, что это?), но легко обходится без тиснения. А как тебе приклейные сторонки переплета? Знаю, знаю, у вас так не носят. А теперь смотри фокус. На первую сторонку футляра выносим аннотацию. Это как? А вот так: на фасаде висит не транспарант, а содержательная табличка. И еще на футляре, супере и переплете у нас маленькое заглавие на трех языках текстовым шрифтом и почти текстовым кеглем. Но зато на футляре две огромных буквы, по одной на сторону, на супере они внакладку уходят в перегиб на клапан (а клапан с огромным запáхом, что твой, то есть мой, шлафрок). А на переплёте у нас будет что? А ничего, пустота. Ты тужился выкрикнуть стопятьсотым кеглем враспор, а мы тебя уели минутой молчания. Фасад «ИШ-1977» выскочил из своего советского времени лет на пятнадцать вперед, да и сейчас выглядит нормально современным.</p>\n<h3>Макет и общее содержание</h3>\n<p>«ИШ-1960» — обычный художественный альбом: два абзаца вступления от составителя, «воздушный» и необязательный макет, полное отсутствие подписей к картинкам, а вместо пофамильного Содержания в конце Список иллюстраций, такой же воздушный и оттого необычайно длинный.</p>\n<p>Текстовый шрифт — Журнальная Рубленая, для 1960 года она не дрыканый гротеск, а самомоднейшая новина.</p>\n<p>Макет сделан художником Дмитриевым, не включенным в состав участников. А вот в «ИШ-1977» он есть — и как раз с переплетом «ИШ-1960». В 1960-м Дмитриеву было немного за тридцать — маловато для собравшейся компании.</p>\n<p>«ИШ-1977» — почти энциклопедия. Плотнейший трёхъязычный сеточный макет швейцарской школы. Список участников, он же Содержание, вынесен вперед на европейский манер. До альбома — могучее многостраничное введение от самого прогрессивного в то время знатока книжной и типо- графики Юрия Герчука*. Все картинки пронумерованы и подписаны. А в тылу — целый справочный аппарат, такой же плотный и содержательный, как сама книга. Всё это, конечно, заслуга отца современной российской типографики Максима Жукова (не верю, что он только автор макета). В 1973 Жукову было тридцать — самое оно для той книги, которую он проектировал. И конечно же, он есть в числе участников. И не только он — все его друзья попали.</p>\n<p>Текстовый шрифт — Gill Sans. Не то, чтоб его вообще не видели в ссср, но он был доступен только внешторгиздатовцам по большим праздникам. А вот так, чтоб раскатать набор на 186 страниц — такое мог себе позволить только один советский дизайнер. Он и позволил.</p>\n<h3>Наконец, цена</h3>\n<p>«ИШ-1960» стоит не дешево. Книга больше рубля в 1961 году — детям не игрушка.</p>\n<p>«ИШ-1977» стоит как крыло самолета. 18 рублей за книгу?! Вы с ума сошли. Для честной советской книги это цена непристойная и неконвенциональная. Фу такой быть.<br>_____________<br>*я давно не читал этой статьи Герчука — и пожалуй, напрасно. В ней дважды пересказана история российско-советской шрифтовой культуры. Начало автор выбрал верно: с мирискусников. Дальше тоже всё изложено так, что можно и согласиться. Кроме одного — базового — посыла. Автор утверждает, что русской шрифтовой культуре присуще увлечение рисованным леттерингом в ущерб набору. И возводит это прямо к «Миру искусства». Мол, тогда всё руками рисовали, да и дальше продолжили. А вот на Западе всё больше набором, набором.</p>\n<p>Глядя из 21 века, хочется возразить: во-первых, в арнуво-сецессионе-модерне все рисовали буквы, несмотря на наборный бум. Просто идей была тьма, и технология позволяла. А вот в тридцатые в ссср не новый жанр открыли — ручками обложки рисовать — а шрифты кончились, да и допуск к ним тоже ) Так что не в загадочной советской душе дело, а в товарище надзирателе.</p>\n<p>Подведем итог простого рассматривания книжек.</p>\n<p>«ИШ-1960» — пышно, легковесно, не дизайн, но «искусство книги», советское значит отличное.<br>«ИШ-1977» — гиперпонтово, серьёзно, «швейцарский» дизайн с английским акцентом, мерседес это вам не москвич.</p>\n<div class=\"orn\" role=\"separator\"><b></b></div>\n<p>А теперь заглянем в Содержание и в Список иллюстраций, включив ИИ (ChatGPT и Gemini). Юлия Репринцева, прошу!</p>\n<p>«ИШ-1960» составлен на базе выставки 1953 года «с дополнениями». Это выставка достижений сталинского леттеринга*.<br>__________<br>*слово «леттеринг», так же как слово «дизайн», вошло в советский язык намного позже.</p>\n<p>Основной корпус иллюстраций — титульные листы (где раздолье для пера и тонкой кисточки) и «шрифтовые композиции» — особый жанр советской станковой графики, где курчавые всадники бьются в кудрявом порядке, изображая буквы. К шрифту как инструменту типографа это не имеет никакого отношения.</p>\n<p>Поскольку выставлено достижение до 1953, господствуют центральные композиции. Наборного шрифта нет вообще. Редкие авторы, чьими именами названы выпущенные к тому моменту гарнитуры: Бажанов, Лазурский, Кузанян, Рерберг, Телингатер — никаких наборных композиций имени себя не демонстрируют. Ни одного профессионального шрифтового дизайнера в списке нет.</p>\n<p>«ИШ-1977» — прошло сто лет, и юный град, полночных стран краса и диво. Содержание этого тома соотносится с содержанием предыдущего по принципу «нет уж, позвольте».</p>\n<p>Во-первых, в него попали все, кого тогда забыли. Это, прежде всего, Галина Банникова, Николай Кудряшев, Михаил Ровенский — профессиональные шрифтовики, авторы гарнитур для металлического набора. Оказывается, буквы рисуют не только члены мосха, но и сотрудники Отдела наборных шрифтов.</p>\n<p>Во-вторых, в «ИШ-1977» присутствуют те, кого правильнее называть дизайнерами (книжными и графическими), а не [только] художниками книги, и уж точно не [только] «оформителями». Это сам МГЖ и его одиннадцать друзей: Аникст, Ганнушкина, Гусева, Калинин, Козубов, Корольков, Курбатов, Максин, Марков, Перцов, Трофимова, Троянкер, Ясинский (на самом деле тринадцать). У всех в анамнезе Полиграф. Все так или иначе экспериментируют с формой букв. У многих среди прочего есть товарные знаки и эмблемы. К этой компании примыкает А. Д. Крюков — графический дизайнер, многолетний лидер Промграфики.</p>\n<p>С точки зрения композиций присутствуют какие угодно: от бронзово-центральных до круговых, вихревых, свободнокинутых.</p>\n<p>В этом смысле чрезвычайно интересно приглашение Татьяны Мавриной — мастера авторского лубка, и еще нескольких свободных каллиграфов. В прошлом томе они смотрелись бы как Ван Гог в Парижском Салоне.</p>\n<p>В «ИШ-1977» идет интенсивное осмысление наборного гротеска. Советская культура, прохлопавшая Футуру, Гилл Санс, Гельветику — а к 1977 и Авангард — начинает впопыхах рубить засечки, на которых сидела тридцать лет. Выходит немного смешно (см. Хельветика), но искренне и мило. Наиболее радикальные заглядываются на болгарицу, которую только недавно протащили в свет болгарские товарищи. Основной вопрос: хороши ли выносы у букв? И годится ли ß на строчную в? Наше поколение, следующее за Жуковским, тоже помаялось этой дурью.</p>\n<p>Что до инструментов, к традиционным перу и кисточке (и больше белил, не стесняйся править контур!) добавились не виданные с двадцатых циркуль и рейсфедер, а также фотоувеличитель и резиновый клей. Система рекле* начинает триумфальное вытеснение каллиграфии и рисованного леттеринга (кстати, ни слова «леттеринг», ни слова «дизайн» еще нет в обороте).<br>___________<br>*рекле — режь-клей. Буквы вырезаются из фотокасс, расклеиваются в слова на резиновом клее, потом переснимаются под фотоувеличителем, а потом печатаются в размер макета и еще раз вклеиваются на тот же резиновый клей. Сейчас это кажется галерным рабством, а тогда считалось самым продвинутым способом работы.</p>\n<h3>Конклюзия</h3>\n<p>Мы рассмотрели две книги: «ИШ-1960» и «ИШ-1977» и увидели странный временной глитч. Первая из них вышла в самую оттепель, а по внешности и содержанию — продукт позднесталинской эстетики. Вторая напечатана в цветущий застой, но и по конструкции, и по содержанию опережает время лет на десять. То есть между ними не одно поколение и не две советские формации, а, соответственно, два и четыре.</p>\n<p>Пятидесятники против семидесятников, поздняя империя против перестройки. Вот ведь как бывает.</p>\n<p>Целиком обе книги можно посмотреть в Библиотекусе Студии Лебедева. Ссылвкомм.<br>Я выкладываю наиболее характерные фрагменты.</p>", "figs": [["img/10/10-001.jpg", "10-001", "<p>Переплёт «ИШ-1960»<br>Название выполнено в характерном стиле советского леттеринга. Оно было нарисовано целиком, а не составлено из отдельных букв: все буквы немного разные, даже три С в слове «искусство».</p><p>Видно, что автор не шрифтовик: все засечки решены в разной манере, даже те, что вполне могли бы быть одинаковыми. Еще есть пара не слишком удачно решенных деталей: стык верхних штрихов КУ и куцый хвостик У, например. А еще в слове ШРИФТА, состоящем из шести разных букв, автор не справился ритмом: в паре ШР дырка, тройка ФТА немного подзажата. А буква А нерешительно покосилась вправо: вроде изображает вертикаль, а вроде и нет.</p><p>Зачем я придираюсь по мелочи? Потому что советские художники книги почему-то считаются мастерами леттеринга, хотя это не всегда и не совсем так. Лучшее, что есть в этой надписи — некоторая шестидесятническая живость.</p>", 1.0], ["img/10/10-002.jpg", "10-002", "<p>Авантитульный разворот «ИШ-1960»<br>Чрезвычайно характерная советская постсталинская наборная композиция.</p><p>Очень мелкая Журнальная Рубленая пытается изобразить красивый шрифт.<br>Выключка по центру с расключкой. Наборщик не доверяет материалу настолько, что пытается изобразить коробочку. Набор в три кегля (!) с разной разрядкой. Смотрите внимательно: деградация наборного искусства как она есть.</p><p>Кстати: вам не кажется, что вот такую суперклассическую центральную композицию недурно было бы набрать Лазурским или Банниковской. Ну, ОК, Лазурского в 1960 году еще не допилили. Но Банниковская-то уже была? Но нет — модернисты предпочитают гротеск! Или просто в Рижской образцовой типографии не нашлось Банниковской?</p>", 1.0], ["img/10/10-003.jpg", "10-003", "<b>Распашной титул «ИШ-1960»</b><p>Здесь всё нарядно, если не разбирать детали. Слово «Искусство» вдруг из капитального стало строчным — что понятно, потому что композиция разомкнута вправо — и украсилось курсивной m (при прямой И), а также милой игривой в из какого-то третьего комплекта букв. Вообще-то это красиво. Но немного портит впечатление дробноватый ритм правой половины композиции.<br>Кстати, на титуле ни одной наборной буквы. Отсюда разница между Москвой слева и издательством справа.</p>", 1.0], ["img/10/10-004.jpg", "10-004", "<b>Оборот титула и вступление «ИШ-1960»</b><p>Еще одна классическая советская композиция. Точнее даже две.</p><p>Слева на центральную ось элегантно нанизана редколлегия, причем самая длинная строчка держит края листа, но Телингатера обломали, чтоб не делать крест на пузе. Обратим внимание на художественную разрядку другим кеглем всего, что не фамилии, и олл капс тем же кеглем названия редакции. Не знаю, сам ли Гордиан Дмитриев это расписывал построчно или в Риге нашелся метранпаж, но явно старались.</p><p>А теперь посмотрим на правую страницу. Там не только нет выключки по центру, но даже центральная ось намеренно сбита. Рубрика «От составителя» разряжена выключена вправо (единственный случай на всю книгу), а очень крупная буквица выбита влево за блок набора. При этом колонцифра (на спусковой!) убрана так далеко в правый угол, что я ее только что заметил.</p><p>То есть две соседние полосы не только не составляют ансамбль (не правда ли, товарищ Чихольд?) но и вообще друг друга не замечают. Почему?</p><p>Думаю, это раннеоттепельная реакция на засилье боярского застолья: нам надо и торжественно, и художественно. Художественно — это растрепать кудри. Торжественно — это нанизать на шампур. Одно для редколлегии, второе для души.</p><p>И опять Журнальная Рубленая изображает красивый шрифт. Ведь когда набираешь вразрядку, виднее к а ж д у ю букву. Если буквы красивые — становится еще краше. А если лесорубленые — выходит шмурдяк в кларетных рюмочках. Но другого гротеска у страны победившего С даже в Риге не нашлось.</p><p>Последнее по этой картинке. На одной полосе уместилось всё вступление. NB</p>", 1.0], ["img/10/10-005.jpg", "10-005", "<b>Типовой разворот — Александр Васин</b><p>Ранние работы одного из самых типичных и обаятельных художников оттепели (ему посвящен мой вариативный Вильон).</p><p>Сначала насладимся макетом. Он оттепельный — без оси по центру. Он продуманный: сложная симметрия относительно корешка. Желтая плашка слева вынута из запечатанной желтым страницы справа, но они не поставлены тупо вровень, а сдвинуты вверх-вниз. Маленькая композиция держит правый верхний угол, но и она отвечает не белой дырке, а отражает букву В на левой полосе. Правый нижний угол нагружен тремя буквицами, добивая осевую симметрию. Тонко.</p><p>А теперь типографика. Фамилия в сильную разрядку — так по всему макету. Первая буква — васинская. Забавно, но МГЖ в 1977 сохранит этот прием.<br>Имя Отчество другим кеглем и в другую разрядку, но точно расключились по ширине текстового блока ниже. Случайность? Не думаю. Проверяем… Все имена-отчества расключены по биоблокам! Или эти блоки текста расключены по ИО? Это уже не тонкость. Это изыск на грани экзекуции наборщика. Вопрос: зачем? Ответ: для красоты набора. Вопрос: какой в этом смысл? Ответ: так надо.</p><p>На развороте четыре экспоната. Просторно. Однако на этой выставке картин сюжет отсутствует один. Где подписи? В списке иллюстраций на с. 140. Не благодарите.</p><p>Смотрим картинки. Это ранний Васин. Он с 1947 по 1953 год рисовал ненавистные центральные композиции и до сих пор ими икает. Слева прямо классика. Справа уже васинские картинки, но текстовый блок еще загнан в ЦК. Кстати, тоже с «расключками», хотя рисовано весёлой рукой.</p><p>У Жукова (см. ниже-ниже) на той же площади шесть объектов, подписи и пара крупных деталей.</p>", 1.0], ["img/10/10-006.jpg", "10-006", "<b>Лазурский, два разворота</b><p>Лазурский член редколлегии, у него пять полос. Четыре буквы в правом нижнем углу на последней из них — явно отрисовки наборной гарнитуры. Лезем в подписи (с. 142), читаем: «фрагмент алфавита. 1958». В 1960 году художнику книги в альбоме «Искусство шрифта» стыдно признаться, что он сотрудничает с Отделом наборных шрифтов.</p>", 1.0], ["img/10/10-007.jpg", "10-007", "<p>Рерберг. Разворот.<br>Справа картинка с буквами, идентичными Гарнитуре Рерберга (на их основн я сделал шрифт Вокруг света). Что сообщает подпись (с. 144)? «Алфавит». Даже без даты.</p>", 1.0], ["img/10/10-008.jpg", "10-008", "<b>Телингатер. Первый разворот (а всего пять генеральских полос).</b><p>Слева сталинская переплётина 1947 года со сложной композицией и даже без выключки по центру и со строчными цифрами (маэстро можно). И с удивительно жалкими буковками Л. Как его на такое пробило?!</p><p>Справа на всю полосу эскиз Акцидентной Телингатера. Смотрим подпись на с. 145: «Алфавит». Ну Соломон Бенедиктович, ну вы же типограф!</p>", 1.0], ["img/10/10-009.jpg", "10-009", "<b>Разворот из Списка иллюстраций. Сс. 144-145.</b><p>Смотрим на верстку. Что видим? Это не список иллюстраций, а содержание. Акцент на номер страницы — их видно раньше, чем более высокие в иерархии фамилии авторов.</p><p>Наконец-то выключка влево. Но имена даны по центру. Зачем? Чтоб хоть как-то удержать вертикаль. Строки слишком длинные, потому что надо заполнить формат. А заполнить не выходит, так как подписи слишком короткие. Кегелек мелкий, без очков не видно. Формат позволяет сверстать всё это в три колонки, но у нас же не телефонный справочник, а юбилейный альбом.</p>", 1.0], ["img/10/10-010.jpg", "10-010", "<b>Фрагмент полосы с работниками печати. Запомним и сравним с тем, что будет в «ИШ-1977»</b>", 1.0], ["img/10/10-011.jpg", "10-011", "<p>«ИШ-1977» Футляр, первая и четвертая сторонки с аннотацией на первой. Между ними виднелся толстый плоский вержеевый корешок.<br>Что самое главное, важнее всего прочего, в верстке этой книги?</p><p>Раз, два, три — отгадка:</p><p>Выключка влево!</p><p>Это столпейший столп швейцарской школы. В «ИШ-1977» он выставлен с безукоризненной последовательностью. Флаговый набор everywhere</p>", 1.0], ["img/10/10-012.jpg", "10-012", "<b>«ИШ-1977» Суперобложка, первая и четвертая сторонки</b>", 1.0], ["img/10/10-013.jpg", "10-013", "<b>«ИШ-1977» Клапан суперобложки. Вся в тюле и в паньархате в зал Леночка вошла</b>", 1.0], ["img/10/10-014.jpg", "10-014", "<b>«ИШ-1977» Переплёт и ляссе.</b><p>Добро пожаловать в мир швейцарской типографики английскими буквами.<br>Другое восприятие пространства. Принципиально иное отношение к пустому полю. Другой тип сообщения. А что там у нас по-английски? The lettering art. Уверен, что это личный вклад МГЖ.</p>", 1.0], ["img/10/10-015.jpg", "10-015", "<b>«ИШ-1977» Авантитульный и титульный развороты.</b><p>Помните авантитул «ИШ-1960»? Там коробочка текста пыталась создать центральную ось. Здесь флажок стоит в очень странном месте (если не видеть невидимой сетки). В этом жесте — и вызов, и приглашение автора макета осваивать пустое пространство книги.</p><p>Титул и переплёт выстроены по одному принципу с аккуратной и точной нюансировкой. А именно: название по-русски выделено размером и позицией; издательство подтянуто наверх и вставлено в блок с годами. Нет ни малейшей попытки заполнить низ полосы.</p><p>Вспомните титул «ИШ-1960». Сильнее он не смог бы возразить.</p>", 1.0], ["img/10/10-016.jpg", "10-016", "<b>«ИШ-1977» Разворот с Содержанием</b><p>Здесь так много типографики, что боюсь вас заболтать.<br>Слева межколонник между текстом на русском и тремя переводами шире, чем колонки между ними.<br>Редколлегия подвешена на той же высоте, что блок авторов. Длиииииннннаая горизонталь.</p><p>Справа работа в два кегля, где основное выделение — фамилии, причем автор предисловия Юрий Герчук уравнен с участниками. Колонки авторов не выравнены. Почему? Потому, что если выравнять, левая не достанет до низа полосы, а к тому же повиснет одна строка. А так флаг становится еще более флагом. Цифры страниц мелко и слева. Техническая часть выбита в третью колонку и мельче.</p><p>Даже в ИнДизайне такой разворот сходу не построишь. А этот был расписан руками на бумаге. В ссср это мог сделать один человек. Он и сделал.</p>", 1.0], ["img/10/10-017.jpg", "10-017", "<b>«ИШ-1977» фрагмент предыдущего разворота, блок авторов и редколлегия.</b><p>Не знаю почему, но почти уверен, что переводы состоялись благодаря МГЖ. В этом тоже принципиальное отличие «ИШ-1977» от «ИШ-1960». Там был междусобойчик, здесь заявка на общение с миром. Напомню: на дворе не оттепель, а самый что ни на есть застой.</p><p>В редколлегию вошли два художника, не участвовавших в книге: Бисти и Носков. Не знаю, что это значит.</p>", 1.0], ["img/10/10-018.jpg", "10-018", "<p>«ИШ-1977» Спусковая полоса с началом вступительной статьи и первой сноской. Фрагмент.<br>Во-первых, типографика. Минимальное и равное выделение автора и заголовка. Заголовок откинут на один шаг сетки (очень скромное выделение) и на тот же шаг втянуты первые строки абзацев (наглый швейцарский визг). Сноска мелким кеглем отправлена в боковое поле в узкую колонку. И висит прямо напротив цифры. Модно.</p><p>По содержанию: видимый куб текста больше, чем всё предисловие к «ИШ-1960». А ведь Герчук еще только воздуха набирает.<br>Первая сноска — про гротеск. Случайность?</p>", 1.0], ["img/10/10-019.jpg", "10-019", "<b>«ИШ-1977» Первый автор: Михаил Аникст.</b><p>Альбом заходит с козырей: Аникст, с Жуковым и Троянкером — первая тройка книжных дизайнеров того времени. А потом (или уже тогда?) главных художников «Искусства», «Мира» и «Книги».</p><p>У Аникста две полосы, и на второй — «Подводная газета». Это манифест набора. Стиль воспроизводит дореволюционные афиши — теми старыми шрифтами, которые еще остались в типографиях. Не знаю, настоящий это набор или рекле, но выглядит натурально.</p>", 1.0], ["img/10/10-020.jpg", "10-020", "<b>«ИШ-1977» Три полосы Банниковой.</b><p>Слева перед ней типичный оттепельный леттеринг Бажанова — свободный и даже игривый, но это было и в «ИШ-1960».</p><p>А вот экспозиция Банниковой — сплошь наборная. В советской книге про искусство шрифта внезапно появляются подписи: образец набора, курсив, полужирный. Никогда не было.</p>", 1.0], ["img/10/10-021.jpg", "10-021", "<b>«ИШ-1977» Две полосы Васина между Васильевым и Ганнушкиным.</b><p>Помните Васина из «ИШ-1960»? Там он был еще немного скованным, а здесь в лучшем виде. Центральная композиция побеждена и обсмеяна — посмотрите на «Теплицу» с осью из шатких кубиков букв и со сбоем фамилией автора. Остальные работы прямо девочки на шаре — балансируют на хитро выстроенных осях.</p>", 1.0], ["img/10/10-022.jpg", "10-022", "<p>«ИШ-1977» разворот Гордиана Дмитриева — с ч/б фото «ИШ-1960» и логотипом издательства «Искусство». Только я вижу здесь иронию Жукова?</p>", 1.0], ["img/10/10-023.jpg", "10-023", "<b>«ИШ-1977» Три полосы Максима Жукова.</b><p>Однажды, еще в ЖЖ, я имел дерзость сказать, что считаю себя учеником МГ. Он тут же возмутился: где это я вас учил?! А вот здесь, дорогой Максим. Эти три полосы в «ИШ-1977» сделали из меня — любителя букв — профессионального типографа. Они и сейчас смотрятся живо, а в конце семидесятых были просто ошарашивающим ударом по голове. А что, так тоже можно?</p><p>Я тысячу раз пересматривал эти картинки, любовался стилизованными знаками Зодиака, промерял «Меандр», восхищался шрифтом Театр… Примерно такой же шок я испытал, листая U&amp;lc и Emigre. Вся книга «ИШ-1977» про контроль и умную типографику, а эти полосы про свободу и лёгкость в дизайне. С кем из наших это сравнить? С ранним Телингатером и с Володей Чайкой.</p>", 1.0], ["img/10/10-024.jpg", "10-024", "<b>«ИШ-1977» для контраста: один из двух разворотов Николая Кудряшева (здесь Кудряшова).</b><p>Слева — Трудовская гарнитура, намеренно показанная как Univers. Системный подход к типографике, custom font — оказывается, всё это было в ссср, только показывать не умели.</p><p>А на правой полосе просто страница из энциклопедии, набранная первой советской superfamily — (нарочно латиницей, для пущей диковинности) — Энциклопедической гарнитурой.</p><p>Мне кажется, этот разворот, вместе в Банниковой и самим МГЖ — самое сильное противопоставление международного типографического дизайна «искусству книги» в советском понимании.</p>", 1.0], ["img/10/10-025.jpg", "10-025", "<b>«ИШ-1977» два разворота тогдашнего соратника и сокурсника МГЖ Юрия Курбатова.</b><p>На первом — самый наглый макетный пассаж во всей книге: фотолеттеринг «Я землю эту люблю», пущенный через корешок так, что буква Э рубится пополам. Мало того, что вся эта каллиграммная история с Маяковским нарывается на спор. Но резануть прямо по букве, уже закрученной в спираль??! Это пощечина общественному вкусу, которую мог себе позволить только один дизайнер в ссср. Он и позволил.</p><p>На втором развороте среди студенческих проб наборного шрифта притаилась умилительно нелепая «болгарская» Хельветика, авторства Курбатова и Жукова. Это тоже манифест. Сейчас ее, кажется, кто-то цифранул. Ну, или вдохновился. А тогда это был крик души.</p>", 1.0], ["img/10/10-026.jpg", "10-026", "<p>Четыре полосы Лазурского. На одной из них — целая страница набора Гарнитурой Лазурского (помните, как в «ИШ-1960» он скрывал свою причастность к низкому ремеслу шрифтовика?). Конечно, в экспозиции присутствуют и роскошные шрифтовые композиции, но целая страница набора… Кстати, прочтите текст )</p>", 1.0], ["img/10/10-027.jpg", "10-027", "<p>«ИШ-1977», в отличие от «ИШ-1960», чрезвычайно разнообразна. Я нарочно выбрал контрастные развороты. В прошлом альбоме невозможно представить лубошника. А тут пожалуйста — целая Маврина с буковками, кой-как накрашенными кисточкой.</p>", 1.0], ["img/10/10-028.jpg", "10-028", "<p>Разворот Маркевича. Слева на черной плашке — шрифтовая композиция, на базе которой был сделан шрифт Citizen M</p>", 1.0], ["img/10/10-029.jpg", "10-029", "<p>Один из двух разворотов Телингатера с эскизом Народной гарнитуры. Так и написано: Титульный наборный акцидентный шрифт. А не алфавит какой-нибудь.</p>", 1.0], ["img/10/10-030.jpg", "10-030", "<p>Еще один разворот, сильно на меня повлиявший. Буквы Фаика Тагирова, сочетающие геометрическую конструкцию с лёгким безумием. Особенно люблю Ё. И точку с запятой.</p>", 1.0], ["img/10/10-031.jpg", "10-031", "<p>Разворот Аркадия Троянкера — один из последних. Если у Аникста набор отсылает к набору, то у Троянкера старинная афиша нарисована вручную.</p><p>Теперь вы понимаете, почему я пишу эту книгу )</p>", 1.0], ["img/10/10-032.jpg", "10-032", "<b>Разворот с началом справочного аппарата. Блок текста слева я отдельно покажу.</b><p>Справа — начало многостраничного Списка репродукций. Левая колонка по-русски, три правых перевод. Цифры слева, выключены вправо. Цифры — номера иллюстраций, не страниц. Навигация по имени участника. Всё смакетировано по сетке, разумеется.</p>", 1.0], ["img/10/10-033.jpg", "10-033", "<p>Блоки «Вниманию читателя» и «Принятые сокращения» с предыдущей картинки. Вы обратили внимание, что на типографе Лазурском был галстук-бабочка? Так вот, этот блок — невидимая бабочка типографа Максима Жукова (он же, в данном случае, Владимир Набоков), которую МГЖ слегка трогает пальцами, как бы поправляя.</p>", 1.0], ["img/10/10-034.jpg", "10-034", "<p>Разворот с окончанием Списка литературы (а как же) и выходными данными. Слева, опять заметим, снова невыравненные колонки.</p>", 1.0], ["img/10/10-035.jpg", "10-035", "<p>Выходные данные крупно.<br>Скромно об издательских работниках.<br>Ни слова о работниках типографии (вспомните как их перечислили в «ИШ-1960»).</p><p>Непристойная бумага.<br>Неприличная цена.<br>Тираж странный: 27000.<br>Обычно в ссср тиражи были от 50000 и выше. Но тут платили твёрдой валютой и на ветер ее, судя по всему, не кидали.</p><p>Хотя любопытно, как распространялось издание. В странах ли народной демократии, в буржуазно ли империалистических?</p><p>Не помню, как я его купил. Но помню лютую борьбу жажды причащения и жабы. Хорошо, что жаба пошла в болото</p>", 1.0]], "research": {"task": "Сравнить состав участников двух альбомов, систематизировать по типу работ, сравнить работы по времени и композиции; для всех участников — даты жизни и четыре хронологических списка.", "work": "Четыре шага верификации: первый ответ Gemini → проверка ChatGPT по страницам библиотеки, где вскрылись выдуманные участники и проценты → анализ по сканам оглавлений (38 и 59 имён, 16 общих) → выверенная база с датами жизни и 13 авторами гарнитур.", "tools": "Gemini, ChatGPT", "dates": "март 2026"}}, {"intro": false, "num": "11", "title": "Глава о каллилеттеринге оттепели («Попустило и скукожило»)", "ptitle": "Попустило и скукожило", "subtitle": "Советский неоромантизм в надписях оттепели: взмах крыла и суровый стиль небритого гротеска", "date": "3 апреля 2026 г.", "perm": "https://www.facebook.com/100000723643455/posts/26880068174933940/", "slug": "ottepel", "html": "<p><span class=\"dc\">Ш</span>естидесятые годы — поиски того, как можно. Чтобы понять, что это значит: «как можно», давайте разбежимся издалека.</p>\n<div class=\"orn\" role=\"separator\"><b></b></div>\n<p>Нулевые годы двадцатого века — возбухание. Российская культура тащит с Запада всё, что может утащить — от импрессионизма до эмансипации, и набирает воздуха для крика. Приличное общество морщится и нервно спрашивает: а что, так можно?</p>\n<p>Десятые годы — мощный вопль. Вдруг выясняется, что российские футуристы вполне способны переорать итальянских, а пощечины общественному вкусу грозят перерасти в скидывание с корабля современности. ДА, ТАК МОЖНО! капслоком рычит авангард.</p>\n<p>Двадцатые годы. Авангардисты внезапно в силе и при власти. А те, кто реально власти, с некоторым офигением спрашивают у т. Луначарского: а что, теперь так носят? И выясняют, что да, так носят, причем в Париже и в Нью-Йорке.</p>\n<p>Тридцатые годы. Товарищи приходят в себя и начисто соскрёбывают авангард с паровоза. Объявлен тотальный соцреализм и членство в творческих союзах. Теперь, чтобы открыть рот, сначала надо показать корочку. Вопрос о том, как можно, снят с повестки. Правила в уставе. Неуставные отношения с искусством караются по статье. Всё, что по внешнему контуру соврая, объявлено буржуазным пережитком.</p>\n<p>Культура, только что собиравшаяся стать мировым событием, становится бурчанием в животе жругра, уцраора или как его там звали.</p>\n<p>Сороковые – пятьдесят третий. Все занятия культурой начинаются с вопроса: а как теперь можно? Точного ответа, несмотря на уставы творческих союзов, не знает никто. Зато все точно знают: что высунешь — то и оттяпают.</p>\n<p>И вот чейнстокс закончился. Отшибленная культура высунулась из-под лавки и стала пробовать: а так можно? А так? Тогда (да и мне по сю пору, до самой предыдущей главы) казалось, что оттепель стала почти свободой. А на самом деле она была только робким вопросом: а так можно?</p>\n<div class=\"orn\" role=\"separator\"><b></b></div>\n<p>Теперь давайте посмотрим, что и как стало можно. Источниками будут гугл имидж, те две книги «ИШ-1960» и «ИШ-1977», которые я разбирал в прошлой главе, статья в журнале «Шрифт» и еще кое-что (ссылвкомм).</p>\n<p>Поговорим о самом заметном, вместе с отменой центральной композиции. О размашистой шестидесятнической каллиграфии. Откуда она?</p>\n<p>Каллиграфия, как любое искусство, основанное на технических навыках, требует школы. В ссср были музыкальные школы. Была школа балета. А вот каллиграфии не учили нигде. Школьное чистописание похоже на каллиграфию как строевой шаг на милонгу. Тоже вроде ровненько, но как-то асексуально.</p>\n<p>Сталинский книжный леттеринг, который часто называют каллиграфией, на самом деле практически всегда нарисован. Да, руки у советских оформителей книги были твердые. Но строгая цензура и отсутствие образцов делали буквы или скованными, или странноватыми. Эта странность заметна даже у Соломона Телингатера. На титуле «Штурм Берлина» 1948 года каллиграфия, изображающая свободную дневниковую запись, как будто танцует в полной парадной форме с аксельбантами, не отцепив саблю и не сняв шпор.</p>\n<p>На соседней полосе в той же «ИШ-1960» показан титульный лист, в свое время поразивший меня своей своеобычностью: «Памятники народного зодчества Верхнего Поволжья». Изображенные Телингатером буквы, видимо, должны отсылать одновременно к вязи, Гражданке Петровой и к народному рукописному книжному шрифту где-то середины 18 века. Дополнительные надписи сделаны условной писарской скорописью тех же 1750-х.</p>\n<p>Эклектика настолько дикая и настолько обаятельная, что ничем, кроме поиска ответа на вопрос, можно ли так в 1952 году, я ее объяснить не могу.</p>\n<p>Оттепель «отпустила руку». Каллиграфы стали каллиграфами.</p>\n<p>Например, Александр Васин и Сергей Пожарский: в «ИШ-1960 они скорее рисуют, а в «ИШ-1977» уже явно рукопишут.</p>\n<p>Еще характернее работы Юрия Васильева. В 1957 он от руки рисует почти наборный шрифт среднего кегля, а в 1970 выдает титул с изящнейшей скорописью.</p>\n<p>Но главной звезды оттепельной каллиграфии нет ни в одном из «ИШ». Для первого альбома Феликс-Лев Збарский был слишком молод и стилен. То, на что другие отважились в 1961, он крутил еще в 1956. А это совсем разные времена.</p>\n<p>Ну а ко времени застойного либерализма 1977 года Збарский уже оказался в Нью-Йорке транзитом через Израиль, и след его в отечественной книжной графике аккуратно стёрли. Интересно, что к началу семидесятых Збарский стал чуть не адептом швейцарской школы и строил титулы из наборного шрифта.</p>\n<p>В начале шестидесятых в ссср начал заводиться дизайн — и промышленный, и графический. Правда, само слово вошло в оборот только в 80-е. До того дисциплина называлась «техническая эстетика», а дизайнеры были «художниками-конструкторами». Головной институт ВНИИТЭ (технической эстетики) организован в 1962. Примерно в то же время появились отраслевые СХКБ (специальные художественно-конструкторские бюро). Обо всем этом напишу отдельно, а сейчас только вспомню о комбинате «Промграфика» и его главном художнике А. Д. Крюкове. Пожалуй, он был первым советским графи
