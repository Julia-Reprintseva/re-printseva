<script>
const DATA = [{"intro": true, "num": "00", "title": "Вместо вступления (введение к книге)", "ptitle": "Вместо вступления", "subtitle": "", "date": "22 сентября 2026 г.", "perm": "https://www.facebook.com/yuri.gordon/posts/pfbid02txWajZ2Dn6Ags5oh29WiCJGsmP6hPiQiVBjfQkaRQ1g974AFjPHWKtx6s645pwYol", "slug": "", "html": "<p><span class=\"dc\">Е</span>сть одна важная для автора этой книги позиция. Я — художник.</p>\n<p>Не ученый, не документалист, не искусствовед. Позиция, которая многое позволяет. Ученый обязан сомневаться и обнародовать только подтвержденное. Документалист должен, по возможности, собирать и публиковать все доступные факты. Искусствовед не имеет права быть необъективным — он аналитик, а не зоил.</p>\n<p>Художник волен во всём. Затем, что ветру, и орлу, и сердцу девы нет закона. У человека, занимающегося искусством, есть только одна обязанность — свобода суждения*. Он имеет полное право хвалить и ругать, любить и ненавидеть. Он может и должен ошибаться — а вот раскаиваться в ошибках не обязан, потому что часто ошибки — лучшее из сделанного художником.</p>\n<p>Эта книга — попытка выявить и воссоздать, глядя через буквы — художественную реальность прошлого века. Не обязательно равную настоящей, далеко не всегда объективную, но делающую видимым то, что может быть упущено при объективном анализе.</p>\n<p>Например, я пишу о полном провале советской типографики. Это в «самой читающей стране мира». Но полиграфкомбинаты работали! Но тиражи исправно выходили! И букв на все хватало! Какой провал?!</p>\n<p>Однако мне достаточно сравнить два каталога — компании Бертгольд, 1903 года, и советский, издательства «Книга», 1966 года — чтобы написать даже не о провале, а о геноциде шрифтового наследия, даром доставшегося большевикам после их прихода к власти.</p>\n<p>Пожалуй, это и есть мой метод: не пытаться учесть всё, но найти точку силы или болевой узел. А ещё посмотреть оттуда, откуда никто не ждет. Пока пишу, выяснил, что через буквы видно многое, что с других сторон прикрыто толстым слоем идеологии и не менее толстой корой привычки.</p>\n<p>Часто поймать фокус удается через деталь, как бы высвеченную острым лучом карманного фонаря.</p>\n<p>Как показать, что до национализации типографий в России было больше шрифтов, чем в могучем ссср?</p>\n<p>Пересчитать их на одном провинциальном плакате 1913 года и выяснить, что в официальном каталоге всей отрасли 1966 года стало меньше.</p>\n<p>Как продемонстрировать роль рекламы в обычной жизни в начале прошлого века?</p>\n<p>Показать фото большой улицы, где рекламные конструкции полностью меняют форму домов.</p>\n<p>Как поймать большевиков на ухарских непродуманных реформах?</p>\n<p>Найти на первой полосе «Правды» в главном слове «с’езд» выбитый зуб — сдуру переплавленный твёрдый знак, который так и не вернули в шрифт спустя 16 лет после орфографической реформы.</p>\n<p>Всё это не научные приёмы, но метафоры. (Кстати, картинки можно найти в подборках к соответствующим главам).</p>\n<p>Здесь нет претензий на объективность исследования, но есть стремление к художественной цельности рассказа. Зачем? Потому что я так вижу — и считаю необходимым поделиться с читателями этим видением. Иногда острый рисунок точнее описывает реальность, чем чертеж в трех проекциях.</p>\n<p>Ну, а если случится промах — не беда. Придут исследователи и всё разложат по полочкам. Но, как я не раз убеждался — они могут и не прийти, если не подсветишь то, что почему-то считается неважным. Бывает, что роль провокатора — положительная.</p>\n<p>Кстати, знаете, почему главным шрифтом советской типографики стала Латинская гарнитура — успешный коммерческий проект немецкой фирмы?</p>\n<p>Потому, что кремлевские мечтатели ничего не могли толком спланировать (в случае с буквами это очевидно), а по-настоящему новых форм боялись как огня. Ибо во всем, кроме продразверстки, они были трогательно буржуазны. Вот и выбрали самый бюргерский шрифт из всех доступных.</p>\n<p>Книга еще не закончена, но, как сказал цитировавшийся выше автор: хоть поздно, а вступленье есть.</p>\n<div class=\"orn\" role=\"separator\"><b></b></div>\n<p>*подразумевающая личную ответственность за сказанное и сделанное. Художник прежде всего профессионал, ремесленник, его подпись дорого стоит.</p>\n<p>Все главы «Букв 20 века» по ссылвкомм.</p>", "figs": [["img/00/20-001.jpg", "20-001", "<b>Тулуз-Лотрек, «Жокей», 1899</b><p>На этой картинке — первое в мире применение камеры Go pro, до изобретения которой оставалось больше ста лет.</p><p>Гениальный калека изобрел спортивную телеперспективу, а заодно и новый способ переживания состязаний — от первого лица. Для этого пришлось сломать форму, исказить пространство, черти что проделать с силуэтами.</p><p>Это как раз тот случай, когда острый рисунок передает то, чего не передать никак иначе.</p><p>Если мне в книжке удастся хоть раз попасть в десятую долю такой точности — значит, не зря взялся.</p>", 1.0], ["img/00/20-002.jpg", "20-002", "<b>Два примера из главы с прописями.</b><p>Демонстрация метода подачи материала.</p><p>Не все добрые читатели, одарившие главу про прописи 700++ лайками, уловили моё сардоническое отношение к этой форме обучения письму.</p><p>Некоторые даже немного обиделись на «шипи курсиво и грамощно», но почему-то пропустили то, что именно мыла мама, не говоря уж об аллитерации в примере о мальчике и Марсе</p>", 1.0]], "research": null}, {"intro": false, "num": "01", "title": "Глава про латиникириллизацию в СССР", "ptitle": "Как был упущен лучший случай сбросить Пушкина с корабля современности", "subtitle": "", "date": "14 мая 2025 г.", "perm": "https://www.facebook.com/story.php?story_fbid=23987832897490830&id=100000723643455", "slug": "", "html": "<div class=\"epi\"><p>И изъяснялася с трудом<br>На языке своём родном<br><br>I izjasnálasá s trudom<br>Na jazyke svojom rodnom<br><br>I izjasnälasä s trudom<br>Na jazyke svojom rodnom</p></div>\n<p><span class=\"dc\">[</span>Пост написан на базе двух статей в Вики, книги «Империя наций» и материалов, собранных для карты «Кириллица в пространстве и времени» в экспозиции центра «Слово»].</p>\n<p>Большевики мыслили глобально, даже когда начинали «строить социализм в одной, отдельно взятой». Доставшуюся от царского режима территорию они считали безнадежно отсталой и годной только на капитальную переделку. Поэтому сразу задумались о замене кириллицы на что-то более модное и прогрессивное.</p>\n<p>Что же это могло быть? Конечно, только латиница. Латинский алфавит к началу 20 века использовался везде, где утвердилась христианская вера в ее католическом и протестантском изводах: в Европе и ее колониях, а также в переставших быть колониями Америках.</p>\n<p>Все прозелитические религии — доктрины книг и азбук. Иудаизм шел в комплекте с квадратным письмом. Христианство, начав говорить и писать по-гречески, быстро усвоило латынь и латиницу, и так же быстро породило армянский, грузинский, а потом и глаголический с кириллическим алфавиты. Ислам разнес по миру арабицу, и она победила даже там, где были многовековые письменные традиции — например, в Египте, в Персии и в Сирии.</p>\n<p>Кириллица досталась одной из самых хищных мировых империй — Российской. Вплоть до своего развала эта империя была к тому же православной — то есть, казалось бы, должна была неумолимо перемалывать любое другое письмо, попавшее в ее границы. Однако, несмотря на все попытки, царям и Синоду не удалось навязать кириллицу ни одному из письменных народов, попавших в черту оседлости православия. Ни Польша с Финляндией, ни Прибалтика, ни Грузия с Арменией, ни мусульманский Кавказ и Центральная Азия не лишились своих систем письма. Даже не имевшие своей территории евреи имели комплекты типографских шрифтов везде, где проживали.</p>\n<p>И только советский строй сумел потеснить, а где-то полностью вытеснить связанные с религиями письменности. Это произошло потому, что большевики были не просто атеистами, но воинствующими безбожниками: их квазирелигия должна была стереть все прочие веры и заменить священные книги «Капиталом» в качестве Ветхого завета и «Кратким курсом» в качестве Нового.</p>\n<p>Что интересно: важным фактором, повлиявшим на отношение советской власти к письменностям, была борьба марксистов с набиравшей силу фашистской расовой теорией.</p>\n<p>Большевики считали, что все народы развиваются. Что состав крови — не приговор. Что нет народов первого и второго сорта. И это довольно круто, не так ли?</p>\n<p>Но! Марксизм гласил: все как один народы проходят одни и те же стадии развития — от первобытной до коммунистической. И никак иначе. И на этом пути создание наций прогрессивно только при переходе от средневековья к буржуазному обществу. А дальше нации вредны и должны слиться в общечеловеческом экстазе строительства земного рая.</p>\n<p>Поэтому надо всячески поощрять отсталые народы к национальному самосознанию, нацкультуре и нацписьму. А тех, кто уже самосознался — наоборот, избавлять от пережитков национализма. Поэтому сначала внедрялась коренизация, а потом сразу же — дружба народов с интеграцией в новую общность — советский народ. (Как создавались и пересоздавались советские нации, народы и народности вместе с приписанными им культурами и письменностями — отдельная и кровавая история).</p>\n<p>Советский же народ, по первоначальной утопической грёзе вождей, должен был заразить окрестные народы призраком коммунизма, и тут им всем очень бы пригодилась общая письменность.</p>\n<p>То, что у народа может быть собственная культура, связанная с письменностью, не смущало политических авангардистов. Ведь они же одним из первых декретов отменили яти с ижицами — и ничего! Значит, можно и весь алфавит поменять. Впечатляющий сплав научной рациональности с утопическим безумием. Корабль современности — не место для нянюшкиных сказок. За борт их!</p>\n<p>Надо сказать, советский эксперимент с буквами был не единственным. Параллельно шли еще две алфавитных революции.</p>\n<p>На руинах Османской империи младотурки отказались от ислама и арабицы, вместо которых ввели светское обучение и латиницу. Это был сверхрадикальный слом парадигмы в развитой государственнической и религиозной культуре.</p>\n<p>На западе тоже произошел алфавитный перелом. Еще в начале 20 века немецкие педагоги утверждали, что письмо и шрифты, основанные на антикве, вредны для глаз. Только немецкое! Только готическое!</p>\n<p>А в 1941-м нацисты были готовы объявить готический шрифт коварным иудейским изобретением.</p>\n<p>Советские ученые и политики следили и за турками, и за немцами. Например, советские эксперименты с латинизацией тюркских языков шли прямо параллельно с турецкими. А немецкому модернизаторству соответствовал отказ от «славянских» шрифтов, ассоциировавшихся с церковью и старым режимом.</p>\n<p>Но ведь письмо связано с культурой. Гражданка Петрова почти мгновенно сделала Московию Россией. Сто лет для культуры — очень немного. Что же должно было произойти при переходе от арабицы к латинице с полным изменением графики и даже направления письма?!</p>\n<p>Арабское письмо противостоит прямоугольной цивилизации. Арабская строка состоит из мелких крючков, хвостов и воздуха. По заполнению пространства она настолько не экономна, что и сравнить не с чем.</p>\n<p>При этом арабица легко закручивается в сложнейшие каллиграфические узлы, полностью используя данное поле. То есть может быть и тесной, и даже кирпичной. Но не становится — в текстовом наборе.</p>\n<p>На мой взгляд, это должно как-то влиять на мироощущение читающих арабицу на всех языках, где она используется. Интересно, как?</p>\n<p>А уж поворот движения строки вообще трудно представим. Просто возьмите в руку даже не книгу — израильский паспорт. На ваших глазах исполнится пророчество: последние станут первыми. Дети, положите букварь на парту правильно. Корешком налево. Нет, направо.</p>\n<h3>Давайте вернемся к началу поста</h3>\n<p>И изъяснялася с трудом<br>На языке своём родном</p>\n<p>I izjasnálasá s trudom<br>Na jazyke svojom rodnom</p>\n<p>I izjasnälasä s trudom<br>Na jazyke svojom rodnom</p>\n<p>Что из этого Пушкин?</p>\n<p>Первые две строки — современное правописание. Вторые и третьи — два варианта латинизации русского языка, предложенные в 1930-х. Как насчет прочитать в таком виде всего «Евгения Онегина»?</p>\n<p>А ведь был момент, когда главное перо ссср уже занеслось над машинописным указом о всеобщей латинизации (в том числе русского, украинского и белорусского языков). Но тут не грянула мировая революция, и латинизацию заменили русификацией. И Пушкин остался на корабле.</p>\n<h3>Между тем настоящий Пушкинъ писал так</h3>\n<p>И изъяснялася съ трудомъ<br>На языкѣ своемъ родномъ</p>\n<p>Пожалуй, здесь немного больше мёда поэзии. Или просто ять горчит?</p>\n<h3>А в советские тридцатые набрали бы так</h3>\n<p>И из’яснялася с трудом<br>На языке своем родном</p>\n<p>Казалось бы — всего одна заноза вместо твёрдого знака. А строчка уже отдаёт советским ситчиком.</p>\n<p>Кто дочитал досюда — буквоед и терпеливец. А ведь я только начал разбираться с Пушкиным на корабле.</p>\n<p>В этот раз иллюстрации живут немного отдельно от текста и сопровождаются собственным [под]текстом</p>", "figs": [], "research": null}, {"intro": false, "num": "02", "title": "Глава о советских деньгах, приправленная долларами, фунтами, франками и керенками", "ptitle": "О советских деньгах", "subtitle": "или Иван Иванович Гознак", "date": "26 мая 2025 г.", "perm": "https://www.facebook.com/story.php?story_fbid=24086483494292436&id=100000723643455", "slug": "", "html": "<div class=\"epi\"><p>В рабочем столе отца всегда лежали — в качестве образцов — «катенька» и «петенька» (царские сторублёвка и пятисотенная с изображением Екатерины II и Петра I)</p><span class=\"epi-a\">Из воспоминаний Дубасова-сына</span></div>\n<p><span class=\"dc\">В</span>о-первых, деньги — это красиво. Или не во-первых? Что должна говорить купюра или монета?</p>\n<p>Наверное, прежде всего она выглядеть ценностью. Потом — внушать уважение к власти, ее выпустившей. Потом — иметь достойную защиту от фальшивомонетчиков. Потом, скорее всего, должна что-то сообщить о культуре народа и времени выпуска. Ах, да! Чуть не забыл. Она должна быть похожей на деньги!</p>\n<p>Мне всегда казалось, что советские деньги, с которыми я имел дело всё детство и молодость, с одной стороны, были самым точным выражением той жизни, а с другой — одновременно! — не имели с ней ничего общего.</p>\n<p>Деньги были свойскими: ленин, башенки, завитушки какие-то, как в метро, рубли и трешки — да и пятёрки — цвета немаркого, такое мятое советское барокко.</p>\n<p>Понятно, что радужные десятки, а особенно пурпурные четвертаки уже из другой оперы, от них пахло достатком. Зелёные полтинники что-то вроде генералов, а сотню простому советскому человеку видеть не полагалось, она примерно архиепископ.</p>\n<p>Но вглядевшись в обычный рубль, можно было заметить нечто очень странное. Его буквы, орнаменты, гильоши как будто говорили по-старорежимному, с ятями. В них было нечто даже не буржуазное, но сословно-монархическое, про ваших благородий и высокопревосходительств. Как такое могло прорасти на трудовых и мозолистых пролетарских деньгах?</p>\n<p>Это удивляет. Но есть нечто уже совершенно поразительное: советские деньги — авторские!</p>\n<p>Фактически все, от первого бумажного червонца до последней брежневской сотни, есть выставка произведений одного художника — Ивана Дубасова.</p>\n<p>Если прибавить к его заслугам соавторство в гербе ссср, дизайн Ордена Ленина и звезды Героя, возникает фигура прямо титаническая. Говорят, что Дубасов, многолетний главный художник Гознака, был буквально секретным оружием советской денежной системы.</p>\n<p>Его карьера была стремительной. Выпускник дореволюционной Строгановки, то есть дипломированный художник, стал всего-навсего учителем рисования. Но вот однажды послал на юбилейный конкурс эскиз марки, нарисованный марганцовкой. И победил! И не кого-нибудь, а Чехонина с Митрохиным.</p>\n<p>После этого молодой человек поступил на службу в Гознак, попутно дорисовав герб ссср, и там довольно скоро стал главным художником.</p>\n<p>Я специально рассказываю биографию Дубасова как сказку — но недалеко от того, что написано в Вики. Ссылка где надо — можете проверить.</p>\n<p>Долго ли, коротко — начал Иван рисовать деньги. Да так их приятно рисовал, что занимался этим с 1925 по 1961 год. То есть нарисовал почти все советские банкноты. И даже последние, «павловские», выпущенные в 1991 году, после смерти Ивана Ивановича, тоже сделаны по его эскизам.</p>\n<p>С чем это можно сравнить? Да ни с чем. За это время сменилось три поколения архитекторов — от дерзких конструктивистов до брежневских бруталистов. А советские рубли сохраняли нерушимую приверженность стилю Дубасова.</p>\n<p>Кстати, а что это за стиль?</p>\n<p>Первые работы мэтра — марка 1922 года и «Сеятель» на червонце 1923 — такое позднее арнуво или раннее ардеко. Очень сдержанное, без чехонинских завихрений. И буквы такие же — вполне аккуратные антиквы, много каллиграфии. Трёшка 1934 года просто стильная. Да и три купюры 1938 — со стахановцем, пехотой и соколом — стилистически вполне соответствуют своему времени.</p>\n<p>А вот после войны случился переворот. Купюры 1947 года похожи на фирменные бланки или меню государственных обедов из 1913. Шрифты резко усложняются, обрастают завитушками в псевдорусском стиле. Орнаменты становятся могуче-барочными, в духе метро Киевская.</p>\n<p>А всё вместе начинает очень сильно напоминать «катеньку» и «петеньку». Видимо, вовремя извлеченных из ящика.</p>\n<p>Но что еще удивительнее: хрущевские деньги 1961 года выполнены в точно таком же стиле! Уже с домов исчезла лепнина. Уже проведена борьба с излишествами. Уже прошел Фестиваль молодежи в Москве. Гагарин в космосе! А на советских рублях нарисованы буквы из царствования Александра III. И никого это совершенно не смущает. Традиция?! Какая традиция? Вы же, товарищи, до основания — а затем?</p>\n<p>Сила обаяния Дубасова настолько велика, что и спустя ещё полвека, уже в совершенно другой стране, деньги рисуют по его лекалам. А давайте назовём все наши бумажки дубасовками? Ну, хотя бы постдубасовками. Потому что этот художник нуждается в увековечении.</p>\n<p>Персональная выставка И. И. Дубасова продолжалась с 1925 по 1991 год. Ее зрителями были все граждане ссср. А если говорить о гербе — то и весь мир. Замри, Пикассо. Уйди в даль, Дали. Иван Дубасов — главный художник 20 века.</p>\n<p>При этом самый безличный из всех. Очень профессиональный, всё умеющий — и никакой. Как будто в его деньгах выразилось коллективное бессознательное всего советского народа во главе с партией того-сего. Все мечты о лучшей жизни с обоями в розах и канарейкой на салфетке с кружевами — под мудрым руководством с журьбой этих глаз со стенки. Чтобы это понять, надо сравнить советские деньги с несоветскими.</p>\n<p>Деньги должны быть похожи на деньги. Именно это, на мой взгляд, важнейшая особенность рублей Дубасова. Они сделаны тщательно, дорого и крепко. В ранних образцах есть художественность. В поздних вместо нее — тяжеловесная породистая банкнотистость.</p>\n<p>«Деревянные» рубли 1947-1961 гг. не выглядели фантиками. Наоборот — с них смотрела богатая, старая, неповоротливая, но страшно уверенная в себе империя. Особенно это стало заметно после реформы 1961 года, когда граждане снова стали считать копейки.</p>\n<p>Дубасовские деньги были самой сильной, самой доступной, самой всепроникающей — и при этом самой желанной для каждого советского человека формой пропаганды.</p>\n<p>Мы — внуки Дубасова. У нас в головах на почетном месте лежат эти цифры, башенки, водяные ильичи, орнаментальные загогулины и радужные разводы. Именно они — наша внутренняя империя, наша тайная страсть, наша прелесть — самовоспроизводящаяся в новых бумажках Гознака.</p>\n<p>Иллюстрации взяты из каталога на портале фокснотс (ссылка в комментарии) Если любите разглядывать денежки — вам туда. Я едва оторвался после недели залипания в гильоши и цыферки.</p>\n<p class=\"ps\"><span class=\"pslabel\">PS</span> Смотрите подписи к картинкам — там очень много о деталях. И много других, несоветских, денег. И пишите комментарии, пожалуйста!</p>\n<p class=\"ps\"><span class=\"pslabel\">PPS</span> О ленточках на гербе ссср</p>\n<p>Изначально ленточек было шесть. Надпись на русском — одна из равных.</p>\n<p>Когда республик стало 11, русская надпись переехала вниз по центру. Тогда не стали портить симметрию, просто как бы для красоты Старшего Брата посадили на председательский трон.</p>\n<p>В 1947 году республик 16, ленточек 15: восемь слева, семь справа. Симметрия нарушена, русская внизу по центру. Вроде бы можно бы вернуть федеративное равноправие — но нет: пусть будет асимметрия, но русские пролетарьи главнее.</p>\n<p>Потом Карело-финскую ССР понизили, и опять всё стало ровненько: 7+7, один на троне. Так и дожили до Большого Пшика.</p>", "figs": [], "research": null}, {"intro": false, "num": "03", "title": "Глава о советских прописях 1930-х", "ptitle": "Советские прописи глазами типографа и ИИ", "subtitle": "От живого письма к мёртвому чертежу.", "date": "11 июля 2025 г.", "perm": "https://www.facebook.com/100000723643455/posts/24461477630126352/", "slug": "propisi", "html": "<p class=\"note\">Это третья глава о прописях и чистописании. Ссылки на две предыдущие в комментариях.</p>\n<div class=\"epi\"><p>«Отвечает лодырям серый кот: …<br>… Ни попить без грамоты, ни поесть…»</p><span class=\"epi-a\">Самуил Маршак</span></div>\n<p><span class=\"dc\">К</span>аждый человек в современном мире должен (обязан, имеет неотложную необходимость) уметь читать и писать. Это настолько ясно, что Капитан Очевидность улетает, скучая.</p>\n<p>А как было век-полвека назад на территории бывшей Российской империи?</p>\n<p>С чтением понятно: получив в нагрузку к гражданским правам государственные обязанности, каждый советский человек должен был уметь прочесть «не влезай убьет» на трансформаторной будке и «Правила проезда» там, где он хочет проехать.</p>\n<p>Кроме того, он обязан был разбирать, хоть по складам, основные заклинания новой религии, а также знать побуквенно имена вождей, чтоб не ошибиться, прославляя, вычеркивая и замазывая.</p>\n<p>Со всеобщим умением писать всё не так однозначно. Оно было необходимо более-менее образованной части общества, а для прочих ограничивалось десятком заявлений, тремя десятками подписей и открытками родным на праздники — за всю жизнь. Но всё же умение писать в 20 веке можно считать одним из самых базовых.</p>\n<p>А как с чистописанием? Его можно сравнить с двумя другими дисциплинами: обучению танцам и строевой подготовкой.</p>\n<p>Важно: чистописание — не каллиграфия. Каллиграфия — это балет: род искусства, предполагающий высокий уровень умения и обязательный элемент творчества.</p>\n<p>Чистописание — обучение копированию стандартного образца. Оно было признано выработать стандартный почерк — не слишком быстро читаемый, но ровный и теоретически довольно скорый при записывании. Любой индивидуальный почерк считался ухудшением божественного прототипа и карался снижением оценок.</p>\n<p>Знаю, что многие считают чистописание необходимым навыком. Однако, как вам кажется, что важнее: умение всех делать что-то одинаково или умение каждого делать что-то самостоятельно? Например — думать и находить собственный путь в жизни. А ведь почерк — точное графическое отображение характера. Что лучше: сто миллионов одинаковых почерков или сто миллионов разных? Для тоталитарного устройства, конечно, удобней первый вариант.</p>\n<p>Возвращаясь к танцам и каллиграфии. Это два столпа дворянского обучения. В 19 веке ловкий танцор или танцовщица имели матримониальные преференции (см. сочинения графа Толстого, не говоря уж о нашем всем).</p>\n<p>Красивый почерк был лучшим стартом карьеры чиновника. Но тут речь не о школьном чистописании, а о каллиграфии достаточно высокого уровня.</p>\n<p>К советскому времени каллиграфы выродились в писарей, а за протоколы, доклады и отчеты отвечала машинистка. Чистописание в школе с тридцатых годов стало точным подобием шагистики.</p>\n<p class=\"verse\">Раз-два<br>все в ряд<br>шагай<br>отряд</p>\n<p>Это было необходимое предуведомление. Подробности о том, как тянули носок в 1915, 1922, 1934 и далее до 1969 года — в подписях к картинкам.</p>\n<div class=\"orn\" role=\"separator\"><b></b></div>\n<p>А теперь вторая часть поста — о нашем проекте «Цифровой I——о Г» — в связи с прописями.</p>\n<p>Капитан О, возвращайся! Сейчас будет весело.</p>\n<p>Как вы помните, мы с партнёром Юлией Репринцевой создаем моего цифрового доппельгангера, чтоб помочь писать эту книгу. Младенчик попался умненький, но возникли огромные проблемы с кормлением.</p>\n<p>Сначала всё шло гладко. ИИ быстро нашел нужные пособия и показал высокую способность читать никак не подготовленные пдфы. Он разбирал даже прописи — куда лучше, чем профессиональный FineReader.</p>\n<p>Но вдруг случился затык. Обычно текстовый пдф, пусть и многостраничный, весит сотни килобайт. Ну, пару мегабайт от силы. Наши буквари и даже тетрадки прописей норовили уйти за 10 мегабайт из-за сотен картинок (в т. ч. самих прописей). А самый злобный учебник, подготовленный по стандартам ABBEE, тянул на 156 Мб.</p>\n<p>Простой чат таких не ест. Даже по одному.<br>Проект ест, но не больше десяти, а каждый кусочек чтоб не больше десяти Мб.</p>\n<p>Две недели мы каторжно плясали с бубнами, сначала сжимая пдфы (в Акробате, а потом вообще вручную, уменьшая каждую страницу), а после пытаясь скормить полученное младенцу. Тот плевался, зависал и требовал поделить файлы на всё более мелкие кусочки.</p>\n<p>А попутно еще ругался, что не понимает гадких прописей! Что там везде буква а! Аааааааааааа!</p>\n<p>В конце концов мы поделили наши 18 изданий на две группы: книжки отдельно, тетрадки отдельно.</p>\n<p>Потом вручную набрали образцов прописей из тетрадок и предложили гугнивцу.</p>\n<p>И что вы думаете? Тут же всё слопал, прочитал и выдал вполне разумный анализ содержания прописей по смыслу текстов, социальному составу учеников, по нагнетанию политики в учебный процесс.</p>\n<p>Тогда мы нарезали книжки дольками, сократили число до 10 и размер до 10 Мб, стали загружать… Опять не жрёт.</p>\n<p>Тут Юля не выдержала и спросила: тебе чего надо? И чат вдруг выдал секрет: оказывается, в тайном правиле загрузки общий объем файлов не должен быть больше 80 Мб! То есть 10 по 10 равно 80. Славно.</p>\n<p>Уменьшили. Отбросили все лишние копыта. Съел.</p>\n<p>Финальный пдф прилагаю. Ссылка в комменте. Сами смотрите, насколько глубоко чат разобрался в обучении письму в период от 1915 до 1961 года. Мне кажется, хорошо поработал — и рассказал совершенно не так, как я )</p>\n<p>На всё исследование ушло минут пятнадцать.</p>\n<p>Единственное, чего чатик так и не понял — чем писали. Это несложно объяснить, но мне, честно говоря, немного надоело с ним возиться )</p>\n<div class=\"orn\" role=\"separator\"><b></b></div>\n<h3>Третья часть — о самих прописях</h3>\n<p>С визуальной стороны прописи за полвека почти не изменились. Они становились то чуть кудрявее, то чуть проще, но никакой системы в этих вариациях букв не было.</p>\n<p>Система была в более или менее жестком подходе к чистописанию, выражавшемся в использовании и частоте косой линовки. Чтобы унифицировать почерк, подопытных надо было загнать в косую сетку. Предельный случай шагописания — рекомендации учителю давать образцы сочетаний букв, нарушающие ритм письма, с тем, чтобы ребенок писал точно по косым линейкам. Примеры смотрите на картинках.</p>\n<p>А еще — если не знали — запомните фамилию Флеров (или Флёров). Из всех чистописателей он единственный, на мой взгляд, чьи идеи хороши и сегодня.</p>", "figs": [["img/03/03-001.jpg", "03-001", "<b>В. С. Гербач. «Методическое руководство к обучению письму». 1915</b><p>К этой книге я уже обращался в посте о дореволюционных прописях. Приглашаю вас читать, что прописано. С течением времени слова для копирования будут сильно меняться</p>", 1.0], ["img/03/03-002.jpg", "03-002", "<b>В. С. Гербач. «Методическое руководство к обучению письму». 1915</b><p>Значение графической сетки. Гербач считал, что сетка в косую линейку необходима для запоминания правильных форм букв. Причем формы эти он описывал очень жестко и точно.</p><p>По сути, его чистописание было подвидом строгой каллиграфии. В том, что такой почерк наилучший, он не сомневался.</p>", 1.0], ["img/03/03-003.jpg", "03-003", "<b>В. С. Гербач. «Методическое руководство к обучению письму». 1915</b><p>На этих картинках обратите внимание на три вещи.</p><p>Первая: буква б без толщины на хвосте. Попробуйте ее так написать тонким пером — и не нажать при двойном повороте.</p><p>Вторая: д хвостом вверх и д хвостом вниз. Одна из этих форм позже будет признана чуждой советскому письму.</p><p>Третья: цифры на клетках имеют тот же наклон, что и на линейках. Это говорит о еще не утраченном чувстве письма. Потом изменится.</p>", 1.0], ["img/03/03-004.jpg", "03-004", "<b>В. С. Гербач. «Методическое руководство к обучению письму». 1915</b><p>Алфавиты от Гербача. Замечаем сверхузкие в, е, з, с, ч, ь, э. Эти буквы со временем начнут серьезно ломать ритм письма, и без того не слишком ровный в прописях. Но здесь еще нормальной ширины г.</p>", 1.0], ["img/03/03-005.jpg", "03-005", "<b>Тетрадь Гербача 1914</b><p>Гербач был не только видным теоретиком и практиком, но и серьезным бизнесменом. Под его маркой выходили не только пособия, но и тетради, и перья.</p>", 1.0], ["img/03/03-006.jpg", "03-006", "<b>Тетрадь Гербача 1914</b><p>Редкий случай политического пафоса в школьной тетради. Почерк — прямой курсив, пропагандистом которого был г-н Гербач.</p>", 1.0], ["img/03/03-007.jpg", "03-007", "<b>В. Флеров. «Наглядные уроки письма». 1916</b><p>Флеров был противником письма по косым линейкам. Поэтому его прописи не такие напядные, как у всех прочих, зато с нормальным ритмом и шириной букв.</p>", 1.0], ["img/03/03-008.jpg", "03-008", "<b>В. Флеров. «Наглядные уроки письма». 1916</b><p>Алфавит Флерова. От Гербача отличается латинизированной формой заглавных Н, Т. Они долго будут мерцать в советских прописях. Строчная д двух видов.</p>", 1.0], ["img/03/03-009.jpg", "03-009", "<b>В. Флеров. «Наглядные уроки письма». 1916</b><p>Если сможете — прочитайте теоретическую часть Флерова. Она резко контрастирует со всем остальным в этом посте.</p>", 1.0], ["img/03/03-010.jpg", "03-010", "<p>М. Ф. Робинсон, М. Л. Закожурникова. «Поход за грамоту. Рабочая книга по грамоте для деревенских школ и подростков. 1930</p><p>Из всех пособий по прописям эта книжка самая политически наивная и бесстыжая. Икона советской религии появляется на первой же странице, а ее (иконы) псевдоним — главное слово, что было в начале.</p><p>Обратим внимание: писать предлагается не только пером, но и чем-то безнажимным. А прописи — из всех — самые лапидарные.</p>", 1.0], ["img/03/03-011.jpg", "03-011", "<p>М. Ф. Робинсон, М. Л. Закожурникова. «Поход за грамоту. Рабочая книга по грамоте для деревенских школ и подростков. 1930</p><p>Вторая страница. Или третья? Заклинание именем продолжается чуть не на полтетради.</p><p>Смотрим на жесты одетых по-военному подростков. Такое чувство, что это кинораскладка пионерского салюта — слева направо.</p>", 1.0], ["img/03/03-012.jpg", "03-012", "<p>М. Ф. Робинсон, М. Л. Закожурникова. «Поход за грамоту. Рабочая книга по грамоте для деревенских школ и подростков. 1930</p><p>Вторым словом является ссср. Не Россия, не Русь, не дай бог. А главный предмет — винтовка.</p>", 1.0], ["img/03/03-013.jpg", "03-013", "<p>М. Ф. Робинсон, М. Л. Закожурникова. «Поход за грамоту. Рабочая книга по грамоте для деревенских школ и подростков. 1930</p><p>Наш Роман в роте. Здесь нет прописей, но есть строевая.</p>", 1.0], ["img/03/03-014.jpg", "03-014", "<p>М. Ф. Робинсон, М. Л. Закожурникова. «Поход за грамоту. Рабочая книга по грамоте для деревенских школ и подростков. 1930</p><p>Буква Т в слове «трактор». Упрощение и лишение левой разгонной завитушки.<br>А если внимательно посмотреть на пропись, видно, что ее чертили. Раньше так не было.</p>", 1.0], ["img/03/03-015.jpg", "03-015", "<p>М. Ф. Робинсон, М. Л. Закожурникова. «Поход за грамоту. Рабочая книга по грамоте для деревенских школ и подростков. 1930</p><p>Сравните К у Флерова и здесь. Там средняя горизонталь была рукописной петлёй. В советских прописях она превратилась в жесткую полку.</p>", 1.0], ["img/03/03-016.jpg", "03-016", "<p>М. Ф. Робинсон, М. Л. Закожурникова. «Поход за грамоту. Рабочая книга по грамоте для деревенских школ и подростков. 1930</p><p>Эта картинка — некоторый апофеоз госнахальства. Колокола сняли, продали, а денежки не себе оставили (например, парты купить), а заём на них купили!</p>", 1.0], ["img/03/03-017.jpg", "03-017", "<p>М. Ф. Робинсон, М. Л. Закожурникова. «Поход за грамоту. Рабочая книга по грамоте для деревенских школ и подростков. 1930</p><p>Отличный пример обучающего текста</p>", 1.0], ["img/03/03-018.jpg", "03-018", "<b>Тетрадь в линейку с портретом Троцкого на обложке. 1926</b><p>Внизу восемь гномов идут в трудовую школу</p>", 1.0], ["img/03/03-019.jpg", "03-019", "<b>Тетрадь в линейку с портретом Троцкого на обложке. 1926</b><p>Реальный скорописный почерк молодого человека в 1926 году. Писано, конечно, авторучкой. И сюжет захватывающий</p>", 1.0], ["img/03/03-020.jpg", "03-020", "<b>Тетрадь для механики-физики ученика II группы школы Ф.З.У. Николаева Николая. 19-2/II-30</b>", 1.0], ["img/03/03-021.jpg", "03-021", "<b>Тетрадь для механики-физики ученика II группы школы Ф.З.У. Николаева Николая. 19-2/II-30</b><p>Еще один реальный почерк 1930 года. Здесь, может быть, и пером писано: толщина штрихов разная.<br>Смотрим на форму букв к, р (с высоким выносом вверх). На под- и надчеркивания. На букву я с загнутым назад хвостом. Всё это против правил чистописания.</p>", 1.0], ["img/03/03-022.jpg", "03-022", "<b>Воскресенская (сотоварищи). Прописи 1935</b><p>Прописи Воскресенской переживут их главного героя.</p><p>Правила держания ручки взяты у Гербача.</p><p>А вот картинка с пионером за партой будет нашим рефреном. Смотрите, как она меняется с десятилетиями.</p>", 1.0], ["img/03/03-023.jpg", "03-023", "<b>Воскресенская (сотоварищи). Прописи 1935</b><p>Удивительно: в прописях на косой линовке одна форма заглавных (невиданная ранее), а для более продвинутых учеников — другая, кудрявая.</p><p>Эти заглавные как бы изображают подросшие строчные. Зачем? Ведь потом надо переучиваться?</p>", 1.0], ["img/03/03-024.jpg", "03-024", "<b>Воскресенская (сотоварищи). Прописи 1935</b><p>Первый алфавит Воскресенской с псевдозаглавными. Строчная д лишилась товарки хвостом вверх, зато вдруг явилась У двух видов.</p><p>А над ними парят уже хорошо отобранные товарищи.</p>", 1.0], ["img/03/03-025.jpg", "03-025", "<b>Воскресенская (сотоварищи). Прописи 1935</b><p>При упрощенных заглавных особенно хороши старорежимные №№</p><p>А зайку нужно изловить. И сдать, видимо, куда надо.</p>", 1.0], ["img/03/03-026.jpg", "03-026", "<b>Воскресенская (сотоварищи). Прописи 1935</b><p>Без косой линовки письмо становится более ритмичным и сбалансированным по ширинам.</p><p>А вот и настоящие заглавные. С немного застенчивыми петельками.</p>", 1.0], ["img/03/03-027.jpg", "03-027", "<b>Воскресенская (сотоварищи). Прописи 1935</b><p>Последний текст в тетради. Все акценты расставлены.<br>Главные слова: все, площадь, флагов, часовой, Союз (с заглавной), трудовой, воевать.</p>", 1.0], ["img/03/03-028.jpg", "03-028", "<b>Воскресенская Прописи 1947</b><p>Послевоенные прописи. Это, конечно, реконструкция книги (там дальше даже голубые линейки).</p><p>Смотрим на парту. Есть ли что новое?</p><p>А вот что точно новое: подписи не набраны, а написаны вручную чертежным шрифтом. Так проще сделать клише</p>", 1.0], ["img/03/03-029.jpg", "03-029", "<b>Воскресенская Прописи 1947</b><p>Алфавит Воскресенской-47. Прошло 12 лет. Что изменилось?</p><p>Во-первых, исчезли квазизаглавные.<br>Во-вторых, ужесточилось впиливание букв в клетки. Появилась переходная строчная в. Остались две формы з.<br>Заглавные сильно унифицировались: смотрим на левые части К, Н, Ю и на все завитушки (в том числе у З, Э)</p><p>Но самое важное: это не рукой писано. Буквы чертил чертёжник. Еще не так железно, как двадцать лет спустя, но уже вполне непостижно уму и руке семилетки.</p>", 1.0], ["img/03/03-030.jpg", "03-030", "<b>Воскресенская Прописи 1947</b><p>Что ты, Юрий, видел в зоопарке?</p><p>Сбои ритма видел, т. Воскресенская. Тигру недоложили г. Медведю сплюснули ве. Так не пишут, дорогой товарищ.</p>", 1.0], ["img/03/03-031.jpg", "03-031", "<b>Воскресенская Прописи 1947</b><p>Финальная ода. Два раза встречается слово «русское(ая)». Еще не с заглавной. А после — две заглавных Родины и одна раскрытая аббревиатура.</p>", 1.0], ["img/03/03-032.jpg", "03-032", "<b>Воскресенская Прописи 1947</b><p>Цифры изменили наклон под клетку. В столбик удобно. А как по клеткам буквы писать?</p>", 1.0], ["img/03/03-033.jpg", "03-033", "<b>Воскресенская Прописи 1948, 2 класс</b><p>Если не реставрировать, прописи выглядят так.</p><p>Второй класс, а косая линовка сохраняется. Может быть, повторение пройденного?</p><p>Подписи все те же, чертежным шрифтом.</p><p>В слитном ряду строчных особенно заметны (намеренные, чтоб вписаться в линовку) сбои ритма. Это уже совсем не письмо от руки.</p><p>Особенно обратите внимание на то, как следует писать строчную к с двумя отрывами руки от бумаги и тремя разнонаправленными движениями.</p>", 1.0], ["img/03/03-034.jpg", "03-034", "<b>Воскресенская Прописи 1948, 2 класс</b><p>Щорс и Чапаев герои. Андрей в мавзолей. Ленин в третьей степени. Москва-Метро.</p>", 1.0], ["img/03/03-035.jpg", "03-035", "<b>Воскресенская Прописи 1948, 2 класс</b><p>Алфавит-48 почти без изменений, но перечерчен заново.<br>Буквы Ф (6 штук) и Д (3 штуки) — пример копипаста эпохи рекле.</p><p>Линовка второй краской слегка ушла вверх. Хотя старались.</p>", 1.0], ["img/03/03-036.jpg", "03-036", "<b>Воскресенская Прописи 1948, 2 класс</b><p>Финальный аккорд прописей.</p>", 1.0], ["img/03/03-037.jpg", "03-037", "<b>Воскресенская Прописи 1957, 3 класс</b><p>Опять книжка после отбеливания (а может переиздание?)</p><p>Соскучились по пионеру? Сличайте! Есть отличия.</p><p>Чертежный шрифт на месте. А вот что новое — это простые приемы каллиграфии. У Гербача и Флерова они шли до писания букв, просто для развития мелкой моторики.</p>", 1.0], ["img/03/03-038.jpg", "03-038", "<b>Воскресенская Прописи 1957, 3 класс</b><p>Каллиграфические упражнения на связность письма и переход от нажима к волосным линиям. Не такая уж простая физкультура, между прочим.</p><p>Ну, и как всегда читаем ложнобессмысленный набор слов.</p>", 1.0], ["img/03/03-039.jpg", "03-039", "<b>Воскресенская Прописи 1957, 3 класс</b><p>Упражнение на слитное письмо с заглавными.</p><p>Слова с корнем рос/рус — трижды.</p>", 1.0], ["img/03/03-040.jpg", "03-040", "<b>Воскресенская Прописи 1957, 3 класс</b><p>Великий полководец превратился в фабрику.<br>А я не хочу улетать, даже если я Исаковский.</p>", 1.0], ["img/03/03-041.jpg", "03-041", "<b>Воскресенская Прописи 1957, 3 класс</b><p>Простите. Эту страницу я выбрал из чистой ностальгии. В 1957 году мой папа, конструктор авиадвигателей, вернулся в Москву из добровольной поездки на четыре года в МТС (машинно-тракторную станцию) под городом Кашин. Счастье мамы было так велико, что почти немедленно родился впс. Поездка была вызвана некоторыми сложностями в написании папиной фамилии в начале 1950-х.</p>", 1.0], ["img/03/03-042.jpg", "03-042", "<b>Воскресенская Прописи 1957, 3 класс</b><p>Предпоследняя страница прописей. Жалко, я не взял похожий образец письма из 1915 года.<br>Заметим, что кто не стал фабрикой, тот обернулся городом.</p>", 1.0], ["img/03/03-043.jpg", "03-043", "<b>Воскресенская Прописи 1957, 3 класс</b><p>Самая последняя страница. Образец прописного объявления.</p><p>Кружок, вообще-то, добровольное объединение. Но есть нюанс.</p>", 1.0], ["img/03/03-044.jpg", "03-044", "<b>Воскресенская Прописи 1962, 1 класс</b><p>Сличаем пионеров (они опять стали октябрятами, но галстук сохранили).</p>", 1.0], ["img/03/03-045.jpg", "03-045", "<b>Воскресенская Прописи 1962, 1 класс</b><p>Напрасно я дал разворот — плохо видно алфавит. Но верьте на слово: наш чертежник не подвёл. Из новинок — исчезла бесхвостая з.<br>И стало больше копипаста.</p>", 1.0], ["img/03/03-046.jpg", "03-046", "<b>Воскресенская Прописи 1962, 1 класс</b><p>В учебном тексте стало чуть меньше пропаганды. Оттепель, господа.</p>", 1.0], ["img/03/03-047.jpg", "03-047", "<b>Н. Н. Боголюбов. Методика чистописания. 1955</b><p>Прошу прощения за отметки резкие ногтей на весьма серьезной и по-своему добросовестной книге.</p><p>Но увы — даже пропуская все ритуальные цитаты, мне хотелось спорить чуть не с каждой фразой.</p><p>Контекст: 1952-55 год. В книге упоминается Монтессори. Не то, чтоб т. Боголюбов (ха: в рифму к Воскресенской, разночинцы из поповичей) был глуп, непрофессионален или не любил свое дело. Он убежден, что учить писать (и чистописать) надо именно так.</p><p>При этом он вообще не думает об отношении человека к письму, о личном почерке, о читаемости и реальной скорости письма, об инструментах письма, о ситуациях, где современный ему взрослый человек пишет.</p>", 1.0], ["img/03/03-048.jpg", "03-048", "<b>Н. Н. Боголюбов. Методика чистописания. 1955</b><p>Вопль против противников линовки. Конечно, результаты работы Ю. И. Фаусек не показаны. Но Монтессори помянут.</p>", 1.0], ["img/03/03-049.jpg", "03-049", "<b>Н. Н. Боголюбов. Методика чистописания. 1955</b><p>Здесь опровергаются взгляды не только Монтессори, но и Флерова из 1915 года. Метод сводил учителя. Ай-яй-яй.</p><p>Генетический метод был заявлен еще Гербачом. Он состоит в последовательном изучении деталей букв. Не проверял, использовалось ли слово «генетический» между 1915 и 1955 годом, когда уже попустило.</p>", 1.0], ["img/03/03-050.jpg", "03-050", "<b>Н. Н. Боголюбов. Методика чистописания. 1955</b><p>Чистописание наехало на жизнь. И сказало: нельзя ж с тремя чертами, а т с одной ногой!<br>А еще в советской школе у букв простота начертаний (для сравнения см. прописи Флерова 1915 года).</p><p>Буквы под углом 65 градусов! (У Гербача было 62. Не есть ли это правый уклон?)</p>", 1.0], ["img/03/03-051.jpg", "03-051", "<b>Н. Н. Боголюбов. Методика чистописания. 1955</b><p>Наклон и нажим — вот наш девиз. Гербач, правда, считал прямое письмо более гигиеничным, но тут мы ему не верим. А что авторучкой хрен нажмешь (даже с открытым пером) — так сие не наша проблема.</p><p>Кстати, корявки в окне явно добавляют живости</p>", 1.0], ["img/03/03-052.jpg", "03-052", "<b>Н. Н. Боголюбов. Методика чистописания. 1955</b><p>Не может быть чище-опрятнее без нажима!<br>А еще, оказывается, пишут некоторые с левым наклоном!</p>", 1.0], ["img/03/03-053.jpg", "03-053", "<b>Н. Н. Боголюбов. Методика чистописания. 1955</b><p>Вот! Нашел и вырвал с корнем д хвостом вверх!<br>Советскому стилю также чужда намеренная кудреватость.</p>", 1.0], ["img/03/03-054.jpg", "03-054", "<b>Н. Н. Боголюбов. Методика чистописания. 1955</b><p>И вот она, наконец, в славе и силе — советская школьная парта-несдвигайка, детище проф. Ф. Ф. Эрисмана. Великий цельный блок, призванный упаковать школьника так, чтоб никакой сколиоз его не изогнул.</p>", 1.0], ["img/03/03-055.jpg", "03-055", "<b>Н. Н. Боголюбов. Методика чистописания. 1955</b><p>Парты, по идее, должны были подбираться по росту. Им бы как-то регулироваться, ведь подопытные растут — но нет. Отрицательная дистанция и яркий грохот крышки — вот мои воспоминания об этом объекте. Впрочем, у него все углы были круглые, в отличие от более поздних моделей</p>", 1.0], ["img/03/03-056.jpg", "03-056", "<b>Н. Н. Боголюбов. Методика чистописания. 1955</b><p>Всё те же приёмы. Всё та же вставка с пером номер один.</p>", 1.0], ["img/03/03-057.jpg", "03-057", "<b>Н. Н. Боголюбов. Методика чистописания. 1955</b><p>Всё, больше не мучаю. Просто посмотрите: слева правильный крючок, справа неправильные.</p><p>Автор правильного без экзамена зачисляется в адьютанты его превосходительства</p>", 1.0], ["img/03/03-058.jpg", "03-058", "<b>Тетрадь в линейку, Ростов-на-Дону. 1950</b><p>Кто-то женский, взрослый и нервный (мама? практикантка?) записывал открытый урок чтения</p>", 1.0], ["img/03/03-059.jpg", "03-059", "<b>Тетрадь в линейку, Ростов-на-Дону. 1950</b><p>Взрослый почерк 1950 года. Возможно, автор учился по прописям 1935 и не усвоил заглавную П (см. слово «План»).</p>", 1.0], ["img/03/03-060.jpg", "03-060", "<b>Тетрадь в линейку, Ростов-на-Дону. 1950</b><p>Не мог не поделиться колорадским жуком (смотрите цветной диафильм) на задней обложке тетрадки</p>", 1.0], ["img/03/03-061.jpg", "03-061", "<b>Тетрадь для работ по чистописанию ученицы 1 класса а школы № 5 Габитовой Гули. 1969</b><p>От Гули три картинки. На этой тетрадку надписала, видимо, мама. Авторучкой.</p>", 1.0], ["img/03/03-062.jpg", "03-062", "<b>Тетрадь для работ по чистописанию ученицы 1 класса а школы № 5 Габитовой Гули. 1969</b><p>А вот чистописала Гуля уже шариковой. И прописи, кажется, новые. Если вообще были.</p>", 1.0], ["img/03/03-063.jpg", "03-063", "<b>Тетрадь для работ по письму ученицы 1 класса а школы № 5 Габитовой Гули. 1969</b><p>Гуля пишет шариком диктант о художнике Шилове</p>", 1.0], ["img/03/03-064.jpg", "03-064", "<b>Тетрадь по письму уч-ка 2 в кл. средней шк. №14 г. Воложского Тунина Михаила. 1965</b><p>Модная тетрадка с косой рамочкой. Подписана (зуб даю) авторучкой с открытым пером.</p><p>Герман Титов, космонавт №2, был популярен почти как Гагарин</p>", 1.0], ["img/03/03-065.jpg", "03-065", "<b>Тетрадь по письму уч-ка 2 в кл. средней шк. №14 г. Воложского Тунина Михаила. 1965</b><p>Вот, наконец-то, нормальный ученический почерк задрюченного чистописанием моего почти ровесника. Старается парень, нажимает. До шариковых ручек в младших классах еще три года.</p>", 1.0], ["img/03/03-066.jpg", "03-066", "<b>Тетрадь по теоретической механике. МЭИ, пт-1-50, В. Охапкин. 1951</b><p>Под занавес слово студенту. Первый курс МЭИ, стандартная советская перовая ручка с жестким пером без нажима и толстым штрихом.</p><p>Разница между школьником и студентом — подпись печатными буквами (и даже капителью). Прощай, школа, умри, чистопись</p>", 1.0], ["img/03/03-067.jpg", "03-067", "<b>Тетрадь по теоретической механике. МЭИ, пт-1-50, В. Охапкин. 1951</b><p>По сравнению с довоенными почерками почти нет над- и подчеркиваний (кажется, просто вышли из моды), зато строчная т строго об одной ноге.</p><p>Буква Т в заголовке (Трение) вспомнила о каллиграфии, да тут же и позабыла.</p><p>Что хорошего в этом обычном почерке? Ритм и характер. Просто писал какой-то нормальный парень, довольно энергичный, без особенного выпендрёжа. Нужны ему были косые линейки? Не знаю.</p><p>Мне они не сильно помогли стать профессиональным типографом и даже чуть-чуть каллиграфом свободного стиля левой руки</p>", 1.0]], "research": {"task": "Найти пособия по обучению письму 1900–1990, распознать тексты прописей, сравнить методы обучения, показать, как менялась связь письма и политики.", "work": "Собрана база из 18 изданий — буквари, прописи, методички: распознавание, сжатие и нарезка PDF под лимиты загрузки, две недели «кормления» кастомного ассистента-«двойника». Найден и описан недокументированный лимит ChatGPT — 80 МБ на аккаунт. Глава подготовлена в двух регистрах: нейтральном аналитическом и в голосе автора.", "tools": "ChatGPT (кастомный проект, Deep Research), ChatPDF, Perplexity", "dates": "июнь — июль 2025"}}, {"intro": false, "num": "04", "title": "Глава о советских шрифтах и геноциде букв («Как превратить цветущий луг в картофельное поле»)", "ptitle": "Как превратить цветущий луг* в картофельное поле", "subtitle": "", "date": "26 августа 2025 г.", "perm": "https://www.facebook.com/story.php?story_fbid=24842304568710321&id=100000723643455", "slug": "shrifty", "html": "<p><span class=\"dc\">Э</span>та глава должна была быть серединой и сердцевиной моей книги. Собственно, мои занятия шрифтом — прямое следствие того, что в 1930-м по заданию советского правительства несколько умных, профессиональных, полных заботы о ближних людей отправили на переплавку примерно 95% от имевшихся тогда в наличии 1500 наборных шрифтов.</p>\n<p>По отношению к людям такое называется геноцидом. Но это же не люди — подумаешь, буковки! Ведь оставили самых лучших, крепких, удобочитаемых. Это просто селекция, правда ведь? Неправда.</p>\n<p>Типографика — точный слепок живой речи. Чем она богаче, разнообразнее, даже дурее — тем точнее передается смысл. Это касается любой буквенной коммуникации — от многотомной энциклопедии до вывески булошной.</p>\n<p>При этом надо помнить, что в обществе полной грамотности практически всё текстовое общение идет через наборный шрифт. Каллиграфия, рукопись, монументальные надписи — только край хрустящей корочки. А мякоть — набор.</p>\n<p>Переплавщики были полны энтузиазма — тем более, что предшествующий стиль модерн (арнуво) оставил тонны весьма странных букв. Сейчас отсечем лишнее, свернём головы канарейкам, избавимся от буржуазных сладостей — и на этом месте насадим новый сад, краше прежнего. Хрен они насадили.</p>\n<p>Они оставили самую буржуазную из всех антикв — Латинскую, переназвав ее Литературной, и горстку несовершенных гротесков, ни один из которых так и не смогли даже толком почистить.</p>\n<p>С гротесками особенно смешно. Казалось бы: что может быть современнее, технологичнее и пролетарскее, чем шрифт без засечек? Однако ссср так и не родил не то, что Гилл Санса, но даже Футуры с Гельветикой. А ведь было близко.</p>\n<p>Весь этот ужас и убожество случились по двум причинам: 1) огосударствление печати, 2) необходимость идеологической накачки при помощи печатного станка. Первый пункт убил типографию как услугу; второй способствовал укрупнению и упрощению производства.</p>\n<p>Самая читающая страна в мире читала одни и те же буквы на трамвайном билете, в газете, в сочинениях любимого вождя и проклятого поэта (когда его вдруг разрешили).</p>\n<p>Давайте еще раз отмахнёмся: подумаешь, буковки! Да мы их и не замечали )</p>\n<p>Конечно. А теперь не чуем шуршания однообразных тараканов в собственных головах.</p>\n<p class=\"aside\">Как всегда: смотрите подписи к картинкам! Фб не дает верстать по-человечески, поэтому половина смысла может кануть</p>\n<div class=\"orn\" role=\"separator\"><b></b></div>\n<p>Этот глав-пост (глава-пост) сопровождается двумя важными дополнениями.</p>\n<p>Первое: блестящая, на мой взгляд, статья чата gpt со сравнительным анализом процессов, происходивших в типографике ссср, США, Великобритании, Германии, Франции в начале-середине 20 века (ссылка в комм).</p>\n<p>Там же — ссылка на наше с Юлией Репринцевой исследование предмета при помощи ИИ, результатом которого стала эта статья. На мой взгляд, это лучший наш перфоманс. Налаживается технология, улучшается поиск, ИИ делает весьма разумные выводы.</p>\n<p>Второе: пдф каталога фирмы Бертгольд 1909 года. Просто смотрите и радуйтесь исчезнувшей и так до сих пор полностью не восстановленной культуре (ссылка в комм).</p>\n<p class=\"ps\"><span class=\"pslabel\">PS</span> Основной источник материалов для этой главы — статьи в журнале «Шрифт». Спасибо, Евгений Юкечев и Рустам Габбасов (Марк, где теги?!)! Само существование такого сильного профессионального издания свидетельствует о настоящем типографическом возрождении после советского провала и застоя.</p>", "figs": [["img/04/04-001.jpg", "04-001", "<p>Иллюстрации к этой главе начинаются с дореволюционного материала. Чтобы понять, чего мы лишились, надо вспомнить, что это было.</p><p>Рекламная брошюра «Художественного и писчебумажного магазина» В. Чекато. «КАРТИНЫ, ГРАВЮРЫ И ФОТОГРАФИИ». Москва. 1900.</p><p>Из коллекции «Отраслевого канцелярского музея»</p><p>Всё это набор.</p><p>12 шрифтов, наборные орнаменты, наборная рамка</p>", 1.0], ["img/04/04-002.jpg", "04-002", "<b>Почти все картинки отсняты с книг, стоящих рядком в моем шкафу.</b><p>Сначала полюбуемся на то, что до 1917 года называлось «роскошным изданием».</p><p>Ариост. «Неистовый Роланд». С-Пб, 1892. Титульный лист.<br>9 шрифтов (ах, какая безвкусица и эклектика!), наборный орнамент, гравированная иллюстрация.</p>", 1.0], ["img/04/04-003.jpg", "04-003", "<b>Тот же Ариост 1892, уголок наборной рамки</b>", 1.0], ["img/04/04-004.jpg", "04-004", "<p>Ариост 1892, спусковая полоса. Наборный орнамент, заглавие другим шрифтом, наборный инициал (запомните). Всё это — набор, работа метранпажа.</p>", 1.0], ["img/04/04-005.jpg", "04-005", "<p>Ариост 1892, выходные данные. Частная, заметим, типография. Хорошая, но далеко не единственная. На качество набора и бумаги вы, наверное, уже обратили внимание</p>", 1.0], ["img/04/04-006.jpg", "04-006", "<b>Ариост 1892, разворот с иллюстрацией на своей бумаге.</b>", 1.0], ["img/04/04-007.jpg", "04-007", "<p>Ариост 1892, набор. Видимо, это Обыкновенный узкий шрифт Бертгольда, судя по характерной строчной букве у.</p>", 1.0], ["img/04/04-008.jpg", "04-008", "<b>Рядом на полке стоит роскошное советское издание эпохи развитого социализма.</b><p>Бокаччо. Декамерон. Гос. издательство худ. литературы. М, 1955.</p><p>Спусковая полоса.</p><p>Гарнитура Академическая (одна из помилованных дореволюционных).</p><p>Иллюстрация — продольная гравюра из итальянской, скорее всего, инкунабулы (простите, не полез искать, откуда). Перерисовка сделана аккуратно, но при этом никто не подумал, что исходная фотография (цельнотянутая?) была с искажением за счет изгиба страницы оригинала.</p><p>Буквица рисованная — наборные инициалы кончились.</p>", 1.0], ["img/04/04-009.jpg", "04-009", "<b>Вазари. Жизнеописания. М, Терра, 1993</b><p>Гарнитура Академическая</p><p>Спусковая полоса. Это уже компьютерный набор, но Академическая на месте. Почему? А нечем больше изобразить Возрождение.</p><p>Буквицу, скорее всего, нарисовали. Инициалов в компьютере в 1993 году еще не водилось, а интернет еще только начинался.</p>", 1.0], ["img/04/04-010.jpg", "04-010", "<b>Наконец, моя самая любимая книга.</b><p>Томас Мэлори. Смерть Артура. М, Наука, серия «Литпамятники». 1993</p><p>Гарнитура Академическая.</p><p>Заставки — Бердслей.</p><p>Набор имитирует издания Уильяма Морриса. Вот здесь Академическая точно попадает в стиль эпохи. Не английского возрождения, а британского модерна.</p>", 1.0], ["img/04/04-011.jpg", "04-011", "<b>Томас Мэлори. Смерть Артура. М, Наука, серия «Литпамятники». 1993</b><p>Гарнитура Академическая.</p><p>На мой взгляд, очень красиво.<br>Но до первоисточника не дотягивает</p>", 1.0], ["img/04/04-012.jpg", "04-012", "<b>С небес роскошных изданий на советские грядки.</b><p>Тетрадь, задняя обложка, 1950</p><p>Гарнитуры Литературная, Жирный гротеск, узкий рубленый (но какой?)</p><p>Эта картинка должна была быть дальше, но лень перекидывать. Показываю из-за Литературной гарнитуры, столь же частой на советских страницах, как колорадский жук на колхозных полях</p>", 1.0], ["img/04/04-013.jpg", "04-013", "<b>Ведомость оценки знаний. Г. Жуковский, 1966</b><p>Заголовок набран гарнитурой Пальмира (!) Это большая редкость в советской типографике. По названию шрифта понятно, что он был создан до исторического материализма.</p><p>Буквенная мелочь под линейками — разумеется, Литературная</p>", 1.0], ["img/04/04-014.jpg", "04-014", "<b>Отсюда начинается рассказ о главном советском шрифте.</b><p>Латинский. Гарнитура 27. Компания Бертгольд, каталог 1909 года.</p><p>Латинский шрифт (разумеется, переводной с немецкого оригинала) был одним из первых в России комплексно созданных шрифтовых семейств. Он включал большой диапазон кеглей — от мелкого до заголовочных — и разнообразные варианты начертаний: светлое, полужирное, узкое, расширенное. Для своего времени — выдающееся решение. Гарнитура позиционировалась как модная, элегантная и несколько подчеркнуто буржуазная.</p>", 1.0], ["img/04/04-015.jpg", "04-015", "<b>Латинский. Бертгольд, 1909. Словолитня и фабрика медных линеек. Берлин, С-Пб, Москва</b><p>Из пана не бывает хама?</p>", 1.0], ["img/04/04-016.jpg", "04-016", "<b>Латинский. Бертгольд, 1909</b><p>Полужирный курсив. Обращаем внимание на разброс по кеглям. Системная работа</p>", 1.0], ["img/04/04-017.jpg", "04-017", "<b>Латинский. Бертгольд, 1909. Узкий полужирный</b>", 1.0], ["img/04/04-018.jpg", "04-018", "<b>Латинская гарнитура из немецкого каталога фирмы Бертгольд. 1912.</b><p>Из немецкого каталога. Скорее всего, роман «Даръ» в 1938 году был набран в Берлине этим шрифтом. Почему-то не переплавленным</p>", 1.0], ["img/04/04-019.jpg", "04-019", "<b>А вот и конкуренты.</b><p>Светлый Рената, каталог Лемана, 1902</p><p>Русский немец Леман бьётся за отечественный рынок с немецким немцем Бертгольдом. Латинский и Рената вышли почти одновременно. Кто у кого что скрал — или никто не скрал — неизвестно. Но нишу модного наборного шрифта они делили.</p>", 1.0], ["img/04/04-020.jpg", "04-020", "<b>Полужирный Рената, каталог Лемана, 1902.</b><p>Если кто видел мой Эльзенскок (зайдите в тг), там пародийно обыгрываю эти латинско-ренатские Кк</p>", 1.0], ["img/04/04-021.jpg", "04-021", "<b>Газета «Правда», 26.01.1934</b><p>Лозунг курсивом справа вверху и заголовок внизу — Литературная гарнитура</p><p>С’езд — следствие дефицита твёрдых знаков, пущенных в распыл после введения новой орфографии. Но расширенное начертание сохранилось</p>", 1.0], ["img/04/04-022.jpg", "04-022", "<b>О. Мандельштам Стихотворения. Советский писатель, Ленинградское отделение, 1978</b><p>Гарнитура Литературная</p><p>(«На полицейской бумаге верже — ночь наглоталась колючих ершей —<br>Звёзды живут — канцелярские птички,<br>Пишут и пишут свои рапортички») (цит. по памяти)</p>", 1.0], ["img/04/04-023.jpg", "04-023", "<b>Эккерман. Разговоры с Гёте… Ереван, Айастан, 1988 (Макулатурное издание)</b><p>Гарнитура Литературная</p>", 1.0], ["img/04/04-024.jpg", "04-024", "<b>Фрагмент карты-романа «Кириллица в пространстве и времени» из павильона «Слово» на вднх.</b><p>Трамвайный билет тюменского гортранспорта. Гарнитура Литературная.</p><p>Когда я говорю, что буквы Литературной встречались в ссср так же часто, как тараканы на коммунальных кухнях, я не шучу</p>", 1.0], ["img/04/04-025.jpg", "04-025", "<b>Литературная гарнитура, каталог 1966 года<br>М., Книга.</b><p>Этот каталог содержал все доступные на тот момент в металлическом наборе шрифты. Литературная занимала в нем главное место</p>", 1.0], ["img/04/04-026.jpg", "04-026", "<b>Литературная гарнитура, полужирное узкое начертание. Каталог 1966 года<br>М., Книга.</b><p>Именно с этого скана была выпилена моя гарнитура ПалеоЛит</p>", 1.0], ["img/04/04-027.jpg", "04-027", "<b>Каталог ручных и машинных шрифтов. М., Книга, 1966</b><p>Вот и весь ассортимент советского набора на сорок девятом году от начала новой эры</p>", 1.0]], "research": {"task": "Найти публикации о шрифтах, составить каталоги по десятилетиям, выяснить, какие шрифты использовались чаще, найти государственные меры по их отбору — список оставленного и отброшенного.", "work": "Perplexity собрал источники; по ним в проекте для промптов составлен бриф для Deep Research; ChatGPT провёл сравнение стандартизации шрифтов в СССР, США, Британии, Франции и Германии до 1953 года. Найдены ОСТ 1337 и ГОСТ 3489, циркуляр Бормана 1941 года о запрете фрактуры.", "tools": "Perplexity, ChatGPT Deep Research (o3)", "dates": "июль — август 2025"}}, {"intro": false, "num": "05", "title": "Глава о буквах московского метро («Буквы подземного космодрома»)", "ptitle": "Буквы подземного космодрома", "subtitle": "или От Сокольников до Парка на метро", "date": "9 сентября 2025 г.", "perm": "https://www.facebook.com/story.php?story_fbid=24961957913411652&id=100000723643455", "slug": "metro", "html": "<p><span class=\"dc\">П</span>о Москве двадцатых ходили пешком. Пять километров — я сам их промерил ногами — это диаметр Садового кольца. Извозчик был хорошим ускорением. Трамвай решал транспортную проблему. Автобусы только появились. Такси — было и такси, но оставалось некой экзотикой почти до времён «Бриллиантовой руки». Частные авто встречались только у очень специальных граждан.</p>\n<p>Москва начала тридцатых была небольшим постсредневековым городом, в основном сосредоточенным в двух кольцах бывших стен: Бульварном и Садовом, и только-только доросшим окраинами до третьего оборонительного кольца — валов и застав.</p>\n<p>Москва, где долго не было своего барона Османа, аж до середины пятидесятых оставалась городом дворов и переулков (вспомним Окуджаву). Да, проспекты прокладывали, но они начинались за Садовым. Как ни ломали большевики Москву, единственной тотальной просекой в старом городе стал хрущёвский Гавана-стрит: Калининский Новый Арбат.</p>\n<p>Это с одной стороны. С другой — «квартирный вопрос испортил их»: советская Москва сразу после волшебного переноса столицы начала стремительно пухнуть от служивого люда бесконечных наркоматов и трестов, а поверх ее накрыло индустриализацией: со всех сторон задымили огромные американские заводы.</p>\n<p>В советской Москве можно было ломать что угодно. До Петра она была деревянной и горела раз в пять лет. После 1703 года муж её бросил и сбежал на Северо-Запад к новой столице. Живучая Москва вывернулась и стала барской, с садами-усадьбами. Но тут пришел Наполеон. Пожар с погромом — начинай сначала.</p>\n<p>Большевикам Москва досталась бойким купеческим городом, в два раза меньшим, чем Питер, но свежезастроенным особняками и доходными домами в стиле модерн. Два этажа были нормой. Пять — громадой. Редкие тучерезы достигали девятиэтажного небоскрёбства.</p>\n<p>И вот в этом отнюдь не мегаполисе внезапно завёлся спейс-шатл.</p>\n<p>Метро не было московской сиюминутной необходимостью. Скорее — утопией навырост. Впрочем, вики пишет, что толчком к осуществлению гигантского проекта был ужас, испытанный т. Кагановичем при транспортном коллапсе в Москве 6 января 1931 года.</p>\n<div class=\"orn\" role=\"separator\"><b></b></div>\n<p>Эта длинная гиперболическая подводка нужна была только для того, чтоб стало понятно, почему на первой линии метро такие буквы.</p>\n<p>Начнем снаружи. К 1935 году конструктивизм уже почти проиграл «сталинскому ардеко», или «постконструктивизму» — новому дорогому имперскому стилю, еще не обросшему лепниной, но уже украшенному мрамором, сталью, гранитом и туфом.</p>\n<p>При этом вестибюли первых станций (см. фото) были еще довольно смелыми и почти конструктивистскими. А надписи «МЕТРО» на них — во-первых, метровыми (а то и больше), а во-вторых — палочными, то есть еще более авангардными, чем архитектура.</p>\n<p>Что любопытно: изначально снаружи не было названий станций. Просто: «метро» — и всё. Как думаете, почему?</p>\n<p>Новое средство передвижения с самого начала прокламировалось не как коммунальная услуга, а как модный аттракцион. Такими буквами хорошо читать «ЦИРК» или даже «диснейленд». Неудивительно, что на первое представление порталов выстроились огромные очереди (см. фото).</p>\n<p>Однако, у вестибюлей метро были и другие коннотации. Также как первые вокзалы, входы в метро косили под храмы и гробницы. Только не христианские, а языческие — египетские и античные (см. фото). Со временем это сходство только усилилось.</p>\n<p>Снаружи первых вестибюлей при открытии образцового транспорта красовались портреты двух усатых дядей. Один из них позже размножился и стал главным богом туннелей, а второго удивительно долго и заживо прославляли на входе (см. фото), пока он не примкнул к не той группе и не отправился на заслуженный отдых.</p>\n<p>Христос в Вифании вывел Лазаря из подземелья. В Москве Лазарь стал почетным покровителем нижнего мира.</p>\n<p>Метро с самого начала «сверкнул перилами дубовыми» — отделка была дорогая и с явным расчетом произвести впечатление. А вот типографика первых станций скорее отсылала к лондонскому андеграунду. Довольно стильно, довольно скромно (см. коллажи).</p>\n<p>Сейчас уже трудно понять, все ли названия станций будущей красной линии были набраны гротеском, или попадались антиквы. Есть даже ощущение, что у них был унифицированный шрифт. Это видно на коллажах из названий станций в конце подборки картинок.</p>\n<p>Учитывая, что дизайна как профессии еще не существовало, а буквы в метро менялись постоянно, почти невероятно, что стиль надписей первой ветки прослеживается до сих пор. В некотором смысле время в метро остановилось после открытия.</p>\n<p>Позже, с конца тридцатых и до 1953, все главные надписи в метро ушли в рассинхрон — на каждой станции своя антиква, некоторые стилизованные под римский капитальный, другие с барочными сладостями. Но практически все — с засечками. Так продолжалось до самой борьбы с культом и прочими излишествами.</p>\n<p>Логотип метро — знаменитая большая М — с самого 1935 года была динамичной и остроугольной. Ее не полностью унифицировали (тогда в ссср вообще не было понятия «фирменный стиль»), но узнаваемости добились моментально.</p>\n<p>Эти М, такие же перекрупненные, как надписи «МЕТРО», украшали многие (но не все) вестибюли в день открытия. Не знаю, когда и кто их ввел в проект, но уже в 1935 году они присутствовали почти везде. А вот на эскизах станций логотипа еще нет.</p>\n<p>Что точно было унифицировано — навигация. У меня есть непроверенное ощущение, что ей занимались не архитекторы, а эксплуататоры, мосметро. Указатели входов-выходов, направлений и касс выполнены по одному образцу и висят на одних и тех же местах. И эти указатели типологически вокзальные, как бы более стимпанковские, чем модный электрический метро. Тексты навигации менялись, но стиль дожил до световых коробов восьмидесятых.</p>\n<p>Надо сказать, что до самого пришествия Студии Лебедева навигация в метро с эстетической точки зрения выглядела как продукт заводского отдела оформления.</p>\n<p>(Вообще навигация в ссср — весьма трудная тема. Возможно, придется посвятить ей отдельную главу в этой книге). Но в метро она была с самого начала — и весьма подробная для того времени.</p>\n<p>Метро было витриной достижений советского строя. При этом любопытно, что внимание было сосредоточено не на функции — удобстве пользователей, а на великолепии отделки и затейливой архитектуре станций.</p>\n<p>Когда читаю панегирики совершенствам «самого красивого в мире метро», всегда вспоминаю, как много раз стоял в ступоре, не в силах найти за лесом декора указатель в нужную сторону. Не знаю, как вас, а меня почему-то особенно бесили платформы с узкими рядами колонн — вроде Комсомольской радиальной. По-моему, это прямое издевательство над бедным пассажиром )</p>\n<p>Впрочем, есть и архитектурные шедевры — Кропоткинская и Маяковская.</p>\n<p>Однако к буквам. Снаружи и внутри метро была и есть масса надписей, не относящихся к человекоперевозкам. От памятных табличек со сложной судьбой (см. фото) до указаний пассажирам, как правильно вести себя в космопорте.</p>\n<p>А еще метро много раз украшали снаружи и изнутри всяческими лозунгами, призывами и прочей наглядной агитацией. Правда, до изнанки поездов добрались только в нынешнем веке. Кое-что есть у меня в подборке. И всё оно относится к народному леттерингу.</p>\n<p>Конклюзия. Буквы метро первого периода (1935-1938) можно разделить на два вида: пропагандистские и технические. Первые всегда повышенно выразительны и сделаны дорого. Вторые скучноваты, но деловиты. Над первыми трудились архитекторы и возможно типографы, вторые производились аккуратными оформителями, но отнюдь не мастерами леттеринга.</p>\n<p>Этот дисбаланс «красивого» и «технического» абсолютно не ощущался в советское время — везде, не только в метро. Первый раз его заметили и попытались исправить в стиле Московской Олимпиады 1980 года — с весьма переменным успехом.</p>\n<p>И еще один важный вывод по стилистике: архитекторы и типографы, создававшие внешний вид первых станций, были утопистами конструктивистского и ардекошного толка. Их стиль резко контрастирует с пафосными храмами подземного Юпитера, выстроенными с середины сороковых до 1953 года. Да, это тоже была пропаганда, но рекламировалось светлое будущее, а не вневременное прошлоящее. К этой теме еще придется вернуться.</p>\n<p>Внимательно пройдя фотографии, пока делал подписи, убедился: единственным сознательно использованным элементом стиля метро был логотип. Всё остальное никак не осмысливалось и не приводилось в систему. Конечно, указатели внутри станций создавали эффект общего пространства, но сами по себе они не были стилизованы и систематизированы: у московского метро не было ни артдиректора, ни брендменеджера.</p>\n<p>Подробности — в подписях к фото.</p>\n<div class=\"orn\" role=\"separator\"><b></b></div>\n<p>Все материалы к этой главе были собраны ИИ Перплексити. В комментарии — ссылка на собрание ссылок. Их больше двухсот.</p>\n<p>Также в комментарии — мощное эссе о буквах в метро от Чата GPT.</p>\n<p>Руководитель нейропомощников, как всегда, Юлия Репринцева. Ее отчет о сборе и обработке информации — в ее тг-канале. Ссылка на него в комментарии же.</p>\n<p>С каждым новым заходом у нас получается интереснее и лучше. Это касается и сбора материала, и анализа. В этот раз мне пришлось специально отстраиваться от выводов, сделанных ИИ.</p>\n<p>А еще в комментариях ссылка на статью о метро в проекте «Арзамас».</p>\n<p>И еще — ссылка на материал Студии Лебедева о реновации логотипа Московского метро</p>\n<p>Все визуальные материалы — с одного сайта. Ссылка в комментарии</p>", "figs": [["img/05/05-001.jpg", "05-001", "<b>Пролетарской столице образцовый транспорт.<br>МЕТРОполитен. Рекламный плакат, 1934</b><p>Качественно сделанный архитектурный разрез будущей станции метро. На стене слева — план Москвы с прочерченной первой линией от Сокольников до Парка культуры с ответвлением к Киевскому вокзалу.</p><p>Кстати, здесь видны границы Москвы в то время: примерно по нынешнему Третьему кольцу</p>", 1.0], ["img/05/05-002.jpg", "05-002", "<p>Вся Москва строит метро (плакат), 1934.<br>Found in the collection of the Russian State Library, Moscow. (Photo by Fine Art Images/Heritage Images/Getty Images)</p><p>«Вся Москва строит» — то есть рабочих не хватало, и москвичей сгоняли на субботники. Москвичи ругались, но копали.</p><p>Через 47 лет, в 1981 г., меня, молодого дизайнера, тоже посылали на стройку станций «Авиамоторная» и «Площадь Ильича». Но как я был не комсомолец, не много там настроил.</p><p>Стиль плаката как бы постконструктивистский, но буквы уже игривые, ардекошные.</p><p>Ну, и мелко понизу трогательное: Москва строит не просто метро, но лучшее в мире</p>", 1.0], ["img/05/05-003.jpg", "05-003", "<b>Сокольники. Вестибюль, «в основном одобренный» эскиз.</b><p>Я буду сначала показывать эскизы вестибюлей, а потом их фото.</p><p>Надпись над входом та же, что на реальном вестибюле. Лого М нет. Слово «вход» написано шрифтом арнуво. А вот заголовок внизу страницы — ардекошный.</p><p>Спортсменов потом других поставили. А потом и вовсе убрали</p>", 1.0], ["img/05/05-004.jpg", "05-004", "<b>Сокольники. 15 мая 1935</b><p>Первый день работы. Очередь желающих пролететь до Парка на метро.</p><p>Лого М на месте. Надпись тоже. Два усатых дяди на страже. Флаги вьются. Лозунги зажигают.</p><p>На заднем плане двухэтажная окраина</p>", 1.0], ["img/05/05-005.jpg", "05-005", "<b>Сокольники. Вестибюль ночью. 1935</b><p>Роскошный метронуар с ноткой оккультности.<br>Лого М на месте. Надпись «МЕТРО» — причесанный конструктивизм</p><p>Ага! Слово «вход» написано тонким брусковым шрифтом, сохранившимся до наших дней.</p>", 1.0], ["img/05/05-006.jpg", "05-006", "<p>Слово вход с предыдущей картинки, попавшее в кадр из-за героического фриза, расположенного выше. Очень недурной брусковый шрифт</p>", 1.0], ["img/05/05-007.jpg", "05-007", "<b>Сокольники. 1935. Открытка. Фото Великжанина</b><p>Навигация стиля «плакатное перо» (хотя это, конечно, начерченный леттеринг).</p><p>Поверху пролетарский привет, видимо оставшийся от торжественного открытия.<br>Стиль транспаранта — арнуво, перекованное в постконструктивизм и внезапно со строчными. Так представлял себе торжественное сообщение мосметровский оформитель</p><p>А вот подписи на всей серии открыток — забавное сочетание ардекошного логослова «Москва» и прочей надписи, запиленной чертёжным шрифтом</p>", 1.0], ["img/05/05-008.jpg", "05-008", "<p>Сокольники. Навигация конца 60-х или начала 70-х. Стилистика тридцатых, но шрифт, кажется, антиква или ленточная антиква.</p><p>Пример того, как время застыло в бывшем космолёте, ныне обычной подземке (хотя и мраморно-гранитной).</p>", 1.0], ["img/05/05-009.jpg", "05-009", "<b>Красносельская. Эскиз вестибюля. Постконструктивизм.</b><p>Надписи «МЕТРО» по бокам остались в реальном вестибюле, а вот роскошную М над входом убрали. Логотипа с косыми штрихами еще нет</p>", 1.0], ["img/05/05-010.jpg", "05-010", "<b>Красносельская, вестибюль, вид в три четверти. 1935</b><p>Прямо над входом очень крупная палочная надпись «МЕТРО», нужная не столько для навигации, сколько для привлечения внимания. Сбоку вторая надпись «МЕТРО», поменьше, декоративная, с трёхногой Т. При этом буква М с одной стороны и О с другой вписаны в декоративный бортик, поддерживающий фронтальную надпись. Всё это — чистый аттракцион.</p><p>Логотипа М нет. Названия станции нет</p>", 1.0], ["img/05/05-011.jpg", "05-011", "<p>Комсомольская. Два вестибюля — один вписан в Казанский вокзал, второй рядом с Ленинградским (сейчас там огромная храмина Кольцевой). 1935</p><p>Надписи «МЕТРО» очень крупные, палочные, причесанный конструктивизм. Они похожи друг на друга, но разнятся в деталях.</p><p>Логотип М есть — на Казанском входе на лбу, на Ленинградском — по бокам. Названия станции нет.</p><p>Справа от Лен-входа усатый Лазарь. Другой усатый, видимо, с обратной стороны.</p><p>Казанский вход украшен двумя то ли диарамными, то ли вообще объемными прибытиями поезда по бокам от портала. То есть подача нового средства доставки максимально отрекламирована</p>", 1.0], ["img/05/05-012.jpg", "05-012", "<b>Комсомольская радиальная.<br>Фотографии Юрия Гридчина, 2024</b><p>Два артефакта с буквами.</p><p>На первом плане капитель со значком КИМ (коммунистический интернационал молодежи). Почему не советский комсомол? Наверное, еще надеялись на торжество мировой революции. Стилистика — ардеко.</p><p>В глубине — длинный карниз с названием станции той же наивной антиквой, что и на путевой стене. Не знаю, с тридцатых она там или позже приделали</p>", 1.0], ["img/05/05-013.jpg", "05-013", "<b>Метростроевцы гордятся своими сроками постройки. 1935</b><p>Стиль транспаранта тот же, что в переходе в Сокольниках: примодненное арнуво со строчными. А слово «МЕТРО» внезапно написалось какими-то ложнославянскими буквами. Опять-таки: представление о прекрасном метрооформителя-профессионала</p>", 1.0], ["img/05/05-014.jpg", "05-014", "<p>Навигация на прозрачном планшете слева (буквы видны насквозь). Стиль «плакатное перо». А вот на лбу поезда надпись в духе народного ардеко</p>", 1.0], ["img/05/05-015.jpg", "05-015", "<b>Красные ворота. Вестибюль. 1935</b><p>Один из самых космических порталов первой линии метро. Показываю сразу четыре картинки (две на следующем кадре), по которым видно, как часто менялись буквы на фасаде.</p><p>Начнем снизу. Видимо, это май, возможно прямо день открытия метро. На верхней дуге — огромный логотип М. В углублениях между дугами лампочками выложен транспарант: «Железному наркому транспорта т. Кагановичу метростроевский привет!». Внизу по бокам еще две агитки, а рядом флаги, флаги. Названия станции нет, но есть скромная надпись «вход» прямо над дверями.</p><p>На картинке сверху праздники закончились. Логотип М имеется, но сильно поменьше и приделан к третьей дуге. Товарищ Каганович тоже отсветился. Названия станции нет, надписи «вход» тоже</p>", 1.0], ["img/05/05-016.jpg", "05-016", "<b>Красные ворота (продолжение). Тоже 1935.</b><p>На картинке сверху очень крупный логотип М на двух верхних дугах. Привета Лазарю в углублениях нет. Флаги тоже убрали. Зато прямо над дверями модная палочная надпись «МЕТРО». Названия станции, разумеется, нет.</p><p>Внизу — вид площади с вестибюлем. Дом с брандмауером за спиной метро свидетельствует, что его его двухэтажного собрата снесли, чтоб построить вестибюль М.</p><p>На виде «с дрона» заметно, насколько космической кажется архитектура метро даже по сравнению с новыми домами.</p><p>Логотип М на третьей дуге. Причем это, скорее, крупная буква с верхнего снимка, чем та, что была на предыдущей паре картинок. Похоже, что в считанные месяцы после открытия неведомые силы гоняли букву по фасаду, подыскивая размер и расположение.</p><p>А в правом нижнем углу фото стоит в стороне (прямо посреди Садового кольца) Маруська с чистым лаком покрытой коляской</p>", 1.0], ["img/05/05-017.jpg", "05-017", "<b>Красные ворота. Внутренняя навигация. 1935</b><p>Технические надписи выполнены в стиле «плакатное перо» (но начерчены). Слева рядом с указателем «Кассы» схема линии: палочка с двойным хвостиком.</p><p>В зале двойная навигация. При входе указатели «К центру» и «К Сокольникам», а глубже по сторонам перечни станций. Характерные метрострелки сохранятся до восьмидесятых</p>", 1.0], ["img/05/05-018.jpg", "05-018", "<p>Кировская, эскиз вестибюля с окнами от могилы Эврисака (см. дальше).<br>Надпись «МЕТРО» в эскизе лучше по ритму, чем в будет в жизни. И это ардеко.</p><p>Логотип М отсутствует</p>", 1.0], ["img/05/05-019.jpg", "05-019", "<p>Кировская. Сверху — финальный эскиз вестибюля. Отсутствует только логотип М. Стилистика — советское ардеко или постконструктивизм.</p><p>Снизу — ранний эскиз станции «Мясницкие ворота» 1929 года. Стиль — конструктивизм. Наверху решетчатый петушиный гребень с прямой М мельниковских кровей. Надпись «МЕТРО» палочным шрифтом с трёхногой Т аж наклонилась над входом, так хочет быть прочитанной.</p><p>Ворота еще Мясницкие. Товарищ Киров пока не обратился в улицу и крейсер.</p>", 1.0], ["img/05/05-020.jpg", "05-020", "<p>Гробница богатого пекаря Марка Вергилия Эврисака, построенная в конце I века до н.э.. Этот необычный памятник, расположенный у Порта-Маджоре, украшен рельефами, изображающими процесс выпечки хлеба, и содержит загадочные вертикальные трубы, которые, по одной из версий, символизируют тестомесильные аппараты и элеваторы для зерна (текст из сети).</p><p>Круглые окна пленили авангардистов и ардекошников. В частности, они украсили вестибюль Кировской</p>", 1.0], ["img/05/0
