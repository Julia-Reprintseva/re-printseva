ообще трудно представим. Просто возьмите в руку даже не книгу — израильский паспорт. На ваших глазах исполнится пророчество: последние станут первыми. Дети, положите букварь на парту правильно. Корешком налево. Нет, направо.</p>\n<h3>Давайте вернемся к началу поста</h3>\n<p>И изъяснялася с трудом<br>На языке своём родном</p>\n<p>I izjasnálasá s trudom<br>Na jazyke svojom rodnom</p>\n<p>I izjasnälasä s trudom<br>Na jazyke svojom rodnom</p>\n<p>Что из этого Пушкин?</p>\n<p>Первые две строки — современное правописание. Вторые и третьи — два варианта латинизации русского языка, предложенные в 1930-х. Как насчет прочитать в таком виде всего «Евгения Онегина»?</p>\n<p>А ведь был момент, когда главное перо ссср уже занеслось над машинописным указом о всеобщей латинизации (в том числе русского, украинского и белорусского языков). Но тут не грянула мировая революция, и латинизацию заменили русификацией. И Пушкин остался на корабле.</p>\n<h3>Между тем настоящий Пушкинъ писал так</h3>\n<p>И изъяснялася съ трудомъ<br>На языкѣ своемъ родномъ</p>\n<p>Пожалуй, здесь немного больше мёда поэзии. Или просто ять горчит?</p>\n<h3>А в советские тридцатые набрали бы так</h3>\n<p>И из’яснялася с трудом<br>На языке своем родном</p>\n<p>Казалось бы — всего одна заноза вместо твёрдого знака. А строчка уже отдаёт советским ситчиком.</p>\n<p>Кто дочитал досюда — буквоед и терпеливец. А ведь я только начал разбираться с Пушкиным на корабле.</p>\n<p>В этот раз иллюстрации живут немного отдельно от текста и сопровождаются собственным [под]текстом</p>", "figs": [["img/01/01-001.jpg", "01-001", "<b>Первый герб ссср, утвержденный к исполнению 7/08/1923 г.</b><p>На шести лентах (чем ниже — тем престижнее) соединяются пролетарии всех стран на: русском, украинском, грузинском, тюрко-татарском, белорусском и армянском языках. Заметим: тюрко-татары изъясняются арабицей.</p>", 1.0], ["img/01/01-002.jpg", "01-002", "<p>Те же пролетарии в табличке. 1923 год</p>", 1.0], ["img/01/01-003.jpg", "01-003", "<p>Карта автономных республик примерно 1926 года. Найдите Казахстан, Узбекистан, Таджикистан, Туркменистан.</p><p>Не то, чтоб большевики придумали эти нации. Но в Центральной (она же Средняя) Азии всё было не так однозначно. А потом за дело взялась советская бюрократия. Результат — на современной политической карте.</p>", 1.0], ["img/01/01-004.jpg", "01-004", "<p>Ранние варианты герба Таджикской сср. Национальная письменность — арабицей.</p>", 1.0], ["img/01/01-005.jpg", "01-005", "<p>Ранние варианты герба Киргизской ССР. Национальная письменность — сильно расширенная латиница</p>", 1.0], ["img/01/01-006.jpg", "01-006", "<b>Красная чайхана в Советском Туркестане на Среднеазиатской ЖД. 1920-е годы.</b><p>Сверху на двуязычной вывеске арабица.</p>", 1.0], ["img/01/01-007.jpg", "01-007", "<b>Делегация комсомольцев из Средней Азии на Красной площади, 1921 год.</b><p>Флаги с арабицей и кириллицей</p>", 1.0], ["img/01/01-008.jpg", "01-008", "<p>10 лет борьбы бакинского пролетариата. Расширенная латиница и кириллица</p>", 1.0], ["img/01/01-009.jpg", "01-009", "<b>Герб Азербайджанской ССР (1921-1927)</b><p>Арабица и кириллица</p>", 1.0], ["img/01/01-010.jpg", "01-010", "<b>Герб Азербайджанской ССР (1927-1931)</b><p>Латиница</p>", 1.0], ["img/01/01-011.jpg", "01-011", "<b>Герб Азербайджанской ССР (1940-1978)</b><p>Кириллица расширенная и кириллица просто</p>", 1.0], ["img/01/01-012.jpg", "01-012", "<b>Герб Азербайджанской ССР (1931-1937)</b><p>Внезапный мусульманский серп-и-звезда посреди торжества советского атеизма.<br>Надписи латиницей. Отрисовка явно современная, так что за точность не ручаюсь</p>", 1.0], ["img/01/01-013.jpg", "01-013", "<p>Фрагмент карты «Кириллица в пространстве и времени» с дополнениями к кириллическому алфавиту, сделанными для двух исчезающих на Дальнем Востоке языков</p>", 1.0], ["img/01/01-014.jpg", "01-014", "<b>С той же карты — как расширилась и похорошела кириллица стараниями советских ученых.</b><p>Вопрос, насколько эти старания были целесообразны — сейчас ставить уже поздно.</p>", 1.0], ["img/01/01-015.jpg", "01-015", "<p>Кириллица в ссср расширилась безбрежно, а вот твердые знаки долго были в дефиците. Переплавили сгоряча</p>", 1.0], ["img/01/01-016.jpg", "01-016", "<b>Эта и следующие картинки из книги «Советский рекламный плакат».</b><p>На всех них — советские колониальные товары конца НЭПа (1928-30 гг).</p><p>Первые три постера (с деталями) — ташкентской тобачной фабрики «Утрак». На них видно, во-первых, кто ЦА (все крупные надписи по-русски), во-вторых и в-третьих — как происходило вытеснение арабицы латиницей.</p>", 1.0], ["img/01/01-017.jpg", "01-017", "<p>Деталь предыдущего плаката. На акцизной марке видна мелкая арабица</p>", 1.0], ["img/01/01-018.jpg", "01-018", "<p>Второй плакат «Уртака». Папиросы «Верненькие»</p>", 1.0], ["img/01/01-019.jpg", "01-019", "<p>Деталь «Верненьких» с арабицей</p>", 1.0], ["img/01/01-020.jpg", "01-020", "<p>Третий раз закинул я невод. Пришел самый роскошный «Уртак» — на сей раз с чрезвычайно колоритной латиницей. При этом вся рекламная часть — по-русски</p>", 1.0], ["img/01/01-021.jpg", "01-021", "<p>«Уртак»-деталь. Логотипы в основном кириллические, но есть два латинских и один арабицей. А брендирование — двуалфавитное, русско-латинское</p>", 1.0], ["img/01/01-022.jpg", "01-022", "<p>Эту картинку я уже показывал, но уж больно хороша.<br>Опять реклама по-русски, а вот бренд двумя алфавитами. Вино, заметим, кахетинское. Разлито в Баку, на Армянской улице. Кавказ тоже дело тонкое</p>", 1.0]], "research": null}, {"intro": false, "num": "27", "title": "Глава о советских деньгах, приправленная долларами, фунтами, франками и керенками", "ptitle": "О советских деньгах", "subtitle": "или Иван Иванович Гознак", "date": "26 мая 2025 г.", "perm": "https://www.facebook.com/story.php?story_fbid=24086483494292436&id=100000723643455", "slug": "", "html": "<div class=\"epi\"><p>В рабочем столе отца всегда лежали — в качестве образцов — «катенька» и «петенька» (царские сторублёвка и пятисотенная с изображением Екатерины II и Петра I)</p><span class=\"epi-a\">Из воспоминаний Дубасова-сына</span></div>\n<p><span class=\"dc\">В</span>о-первых, деньги — это красиво. Или не во-первых? Что должна говорить купюра или монета?</p>\n<p>Наверное, прежде всего она выглядеть ценностью. Потом — внушать уважение к власти, ее выпустившей. Потом — иметь достойную защиту от фальшивомонетчиков. Потом, скорее всего, должна что-то сообщить о культуре народа и времени выпуска. Ах, да! Чуть не забыл. Она должна быть похожей на деньги!</p>\n<p>Мне всегда казалось, что советские деньги, с которыми я имел дело всё детство и молодость, с одной стороны, были самым точным выражением той жизни, а с другой — одновременно! — не имели с ней ничего общего.</p>\n<p>Деньги были свойскими: ленин, башенки, завитушки какие-то, как в метро, рубли и трешки — да и пятёрки — цвета немаркого, такое мятое советское барокко.</p>\n<p>Понятно, что радужные десятки, а особенно пурпурные четвертаки уже из другой оперы, от них пахло достатком. Зелёные полтинники что-то вроде генералов, а сотню простому советскому человеку видеть не полагалось, она примерно архиепископ.</p>\n<p>Но вглядевшись в обычный рубль, можно было заметить нечто очень странное. Его буквы, орнаменты, гильоши как будто говорили по-старорежимному, с ятями. В них было нечто даже не буржуазное, но сословно-монархическое, про ваших благородий и высокопревосходительств. Как такое могло прорасти на трудовых и мозолистых пролетарских деньгах?</p>\n<p>Это удивляет. Но есть нечто уже совершенно поразительное: советские деньги — авторские!</p>\n<p>Фактически все, от первого бумажного червонца до последней брежневской сотни, есть выставка произведений одного художника — Ивана Дубасова.</p>\n<p>Если прибавить к его заслугам соавторство в гербе ссср, дизайн Ордена Ленина и звезды Героя, возникает фигура прямо титаническая. Говорят, что Дубасов, многолетний главный художник Гознака, был буквально секретным оружием советской денежной системы.</p>\n<p>Его карьера была стремительной. Выпускник дореволюционной Строгановки, то есть дипломированный художник, стал всего-навсего учителем рисования. Но вот однажды послал на юбилейный конкурс эскиз марки, нарисованный марганцовкой. И победил! И не кого-нибудь, а Чехонина с Митрохиным.</p>\n<p>После этого молодой человек поступил на службу в Гознак, попутно дорисовав герб ссср, и там довольно скоро стал главным художником.</p>\n<p>Я специально рассказываю биографию Дубасова как сказку — но недалеко от того, что написано в Вики. Ссылка где надо — можете проверить.</p>\n<p>Долго ли, коротко — начал Иван рисовать деньги. Да так их приятно рисовал, что занимался этим с 1925 по 1961 год. То есть нарисовал почти все советские банкноты. И даже последние, «павловские», выпущенные в 1991 году, после смерти Ивана Ивановича, тоже сделаны по его эскизам.</p>\n<p>С чем это можно сравнить? Да ни с чем. За это время сменилось три поколения архитекторов — от дерзких конструктивистов до брежневских бруталистов. А советские рубли сохраняли нерушимую приверженность стилю Дубасова.</p>\n<p>Кстати, а что это за стиль?</p>\n<p>Первые работы мэтра — марка 1922 года и «Сеятель» на червонце 1923 — такое позднее арнуво или раннее ардеко. Очень сдержанное, без чехонинских завихрений. И буквы такие же — вполне аккуратные антиквы, много каллиграфии. Трёшка 1934 года просто стильная. Да и три купюры 1938 — со стахановцем, пехотой и соколом — стилистически вполне соответствуют своему времени.</p>\n<p>А вот после войны случился переворот. Купюры 1947 года похожи на фирменные бланки или меню государственных обедов из 1913. Шрифты резко усложняются, обрастают завитушками в псевдорусском стиле. Орнаменты становятся могуче-барочными, в духе метро Киевская.</p>\n<p>А всё вместе начинает очень сильно напоминать «катеньку» и «петеньку». Видимо, вовремя извлеченных из ящика.</p>\n<p>Но что еще удивительнее: хрущевские деньги 1961 года выполнены в точно таком же стиле! Уже с домов исчезла лепнина. Уже проведена борьба с излишествами. Уже прошел Фестиваль молодежи в Москве. Гагарин в космосе! А на советских рублях нарисованы буквы из царствования Александра III. И никого это совершенно не смущает. Традиция?! Какая традиция? Вы же, товарищи, до основания — а затем?</p>\n<p>Сила обаяния Дубасова настолько велика, что и спустя ещё полвека, уже в совершенно другой стране, деньги рисуют по его лекалам. А давайте назовём все наши бумажки дубасовками? Ну, хотя бы постдубасовками. Потому что этот художник нуждается в увековечении.</p>\n<p>Персональная выставка И. И. Дубасова продолжалась с 1925 по 1991 год. Ее зрителями были все граждане ссср. А если говорить о гербе — то и весь мир. Замри, Пикассо. Уйди в даль, Дали. Иван Дубасов — главный художник 20 века.</p>\n<p>При этом самый безличный из всех. Очень профессиональный, всё умеющий — и никакой. Как будто в его деньгах выразилось коллективное бессознательное всего советского народа во главе с партией того-сего. Все мечты о лучшей жизни с обоями в розах и канарейкой на салфетке с кружевами — под мудрым руководством с журьбой этих глаз со стенки. Чтобы это понять, надо сравнить советские деньги с несоветскими.</p>\n<p>Деньги должны быть похожи на деньги. Именно это, на мой взгляд, важнейшая особенность рублей Дубасова. Они сделаны тщательно, дорого и крепко. В ранних образцах есть художественность. В поздних вместо нее — тяжеловесная породистая банкнотистость.</p>\n<p>«Деревянные» рубли 1947-1961 гг. не выглядели фантиками. Наоборот — с них смотрела богатая, старая, неповоротливая, но страшно уверенная в себе империя. Особенно это стало заметно после реформы 1961 года, когда граждане снова стали считать копейки.</p>\n<p>Дубасовские деньги были самой сильной, самой доступной, самой всепроникающей — и при этом самой желанной для каждого советского человека формой пропаганды.</p>\n<p>Мы — внуки Дубасова. У нас в головах на почетном месте лежат эти цифры, башенки, водяные ильичи, орнаментальные загогулины и радужные разводы. Именно они — наша внутренняя империя, наша тайная страсть, наша прелесть — самовоспроизводящаяся в новых бумажках Гознака.</p>\n<p>Иллюстрации взяты из каталога на портале фокснотс Если любите разглядывать денежки — вам туда. Я едва оторвался после недели залипания в гильоши и цыферки.</p>\n<p class=\"ps\"><span class=\"pslabel\">PS</span> Смотрите подписи к картинкам — там очень много о деталях. И много других, несоветских, денег. И пишите комментарии, пожалуйста!</p>\n<p class=\"ps\"><span class=\"pslabel\">PPS</span> О ленточках на гербе ссср</p>\n<p>Изначально ленточек было шесть. Надпись на русском — одна из равных.</p>\n<p>Когда республик стало 11, русская надпись переехала вниз по центру. Тогда не стали портить симметрию, просто как бы для красоты Старшего Брата посадили на председательский трон.</p>\n<p>В 1947 году республик 16, ленточек 15: восемь слева, семь справа. Симметрия нарушена, русская внизу по центру. Вроде бы можно бы вернуть федеративное равноправие — но нет: пусть будет асимметрия, но русские пролетарьи главнее.</p>\n<p>Потом Карело-финскую ССР понизили, и опять всё стало ровненько: 7+7, один на троне. Так и дожили до Большого Пшика.</p>", "figs": [["img/02/02-001.jpg", "02-001", "<b>Государственный кредитный билет 100 рублей образца 1910.<br>Аверс сверху, реверс снизу.</b><p>«Катенька» из эпиграфа к посту и из дубасовского стола. Важный момент: портрет на реверсе. Это далеко не всегда так.<br>Обратите внимание на нумератор. Буквы изменятся, а цифры будут похожими по форме до конца советского строя.<br>Это самый поздний вариант «катеньки». Еще два — в «приложении», после советских денег.</p>", 1.0], ["img/02/02-002.jpg", "02-002", "<p>Государственный кредитный билет 500 рублей образца 1912.<br>Пятисотрублёвый «петенька». Вторая купюра, милая Дубасову.<br>Его аверс — без портрета — очень похож на реверсы Дубасова.</p><p>Варианты «петенек» — после советских денег.</p>", 1.0], ["img/02/02-003.jpg", "02-003", "<b>Марка РСФСР из серии «Пятилетие Октябрьской революции», 1922, 10 рублей</b><p>Та самая, нарисованная марганцовкой юбилейная марка, с которой начался карьерный взлёт Ивана Дубасова</p><p>Смотрим на буквы: шрифт очень модный в 1922 году. А вот слово «Почта» смело задвинуто под лавку</p>", 1.0], ["img/02/02-004.jpg", "02-004", "<b>Билет Государственного банка СССР 3 червонца образца 1924.</b><p>Первая авторская работа Дубасова на деньгах: фигура сеятеля.</p><p>Мне кажется, Иван Иванович любил курсив. На советских деньгах 1920-30-х годов курсивов много и они очень хороши.</p>", 1.0], ["img/02/02-005.jpg", "02-005", "<b>Государственный денежный знак 1 рубль образца 1922.</b><p>Этот рубль и трёшка со следующей картинки — первые из советских купюр, похожие на дубасовские. Но они выполнены другими художниками.<br>В «дополнении» смотрите более ранние большевистские деньги. Они довольно удивительны.</p><p>Обратите внимание на название: «государственный денежный знак». Товарищи не любили деньги и поначалу, судя по всему, стеснялись называть их казначейскими или банковскими билетами.</p>", 1.0], ["img/02/02-006.jpg", "02-006", "<b>Государственный денежный знак 3 рубля образца 1922.</b><p>Вот эта трёшка — вполне дубасовская по стилю и элементам, но тоже не его.<br>Буквы — арнуво, даже мелкий гротеск на реверсе с чудинкой и хвостиками.</p>", 1.0], ["img/02/02-007.jpg", "02-007", "<b>Государственный денежный знак 1000 рублей образца 1922.</b><p>Даже после падения в 10000 раз, рубль в 1922 году не перестал катиться вниз. Иначе зачем выпускать тысячную купюру?</p><p>Опять удачное цифровое решение. «1000 рублей» образуют компактный аккуратный блок. Наклон овалов нулей создаёт небольшую динамику.</p>", 1.0], ["img/02/02-008.jpg", "02-008", "<b>Государственный денежный знак 25 рублей образца 1922.</b><p>Денежную систему колбасило. На деньгах 1922 года предлагается обменивать 1 новый рубль на 10000 прошлогодних.<br>Отметим очень красивые цифры 25. Слово «рублей» стандартизировано для всей серии купюр. Редкий пример протодизайна. Дополнительные надписи, особенно «государственный денежный знак», какие-то удивительно архаичные, как будто из первой половины 19 века.</p>", 1.0], ["img/02/02-009.jpg", "02-009", "<b>Билет Государственного банка СССР 1 червонец образца 1926</b><p>Твёрдая советская валюта наполнилась чисты золотом и стала называться червонцами и билетами госбанка. То есть большевики, наконец, признали, что без денег никуда, а государственный банк есть не буржуазный предрассудок, а важный признак нормального государства.</p><p>Опять много курсива, но здесь он, пожалуй, перекудрявлен. Реверс купюры самый незатейливый, похож на что-то из 19 века.</p>", 1.0], ["img/02/02-010.jpg", "02-010", "<b>Билет Государственного банка СССР 2 червонца образца 1928.</b><p>Опять долларовая тема.</p><p>Экзотические надписи на грузинском, армянском и арабицей явно выделены для большей декоративности. Особенно арабица вывороткой прямо по центру. Реверс смутно напоминает будущие рубли. Это уже явно работа Дубасова.</p><p>Очень забавно читать коварные мелкие тексты слева и справа о том, как из этой бумажки сделать чистое золото и прочие активы.</p>", 1.0], ["img/02/02-011.jpg", "02-011", "<b>Билет Государственного банка СССР 5 червонцев образца 1928.</b><p>Если есть в числе работ Дубасова шедевр, то вот он. Самая элегантная советская деньга, у которой «нихрена на обороте», как Бродский некогда сказал.</p><p>Почти сплошной курсив с такой вызывающе эффектной П, что дух захватывает.</p><p>Если есть в этой купюре иноземное влияние, то конечно, британское. Посмотрите картинки в «приложении», там есть такой стати шиллинги и фунты.</p>", 1.0], ["img/02/02-012.jpg", "02-012", "<b>Билет Государственного банка 3 червонца 1932</b><p>Отчасти повторяет тему двух червонцев, но есть странность: крупные тройки на реверсе как будто ученик рисовал</p>", 1.0], ["img/02/02-013.jpg", "02-013", "<p>Государственный Казначейский Билет СССР 1 рубль золотом образца 1924<br>Аверс слева, реверс справа</p><p>Вертикальный золотой рубль 1924 года. Очень странный и по композиции, и по картинке (солнце встаёт над крышами избушек), и по формату, и по типографике. Такое чувство, что его делали наскоро. Но по имени то, что будет всегда до конца строя: казначейский билет.</p>", 1.0], ["img/02/02-014.jpg", "02-014", "<b>Государственный Казначейский Билет СССР 3 рубля золотом образца 1924.</b><p>На золотой трёшке удивительная композиция: нежно прильнувшие косец и кузнец за чтением не толстой книжки. Где они могли бы так прилечь, не уточняется.</p><p>На реверсе — как и на золотом рубле — очевидные следы спешки. Ни гильошей, ни барочных выкрутасов. Бедновато и как-то даже неряшливо.</p>", 1.0], ["img/02/02-015.jpg", "02-015", "<b>Государственный Казначейский Билет СССР 3 рубля образца 1925 года.</b><p>Не знаю, случайно или нет, но эта трёшка отдалённо напоминает доллар. Вообще долларовая тема будет время от времени всплывать на советских деньгах до самого конца тридцатых.</p><p>Вроде бы, Дубасов только начинал в это время, но эта серия не золотых денег похожа на послевоенные рубли. Особенно радужный реверс.</p>", 1.0], ["img/02/02-016.jpg", "02-016", "<b>Государственный Казначейский Билет СССР 5 рублей образца 1925 года.</b><p>Некоторое время советских деньгах пытались изображать пролетариев. Пожалуй, самый нелепый портрет на этой пятёрке. Из барочного картуша тревожно выглядывает человек с кепкой головного мозга. Ему ужасно неуютно среди имперской роскоши, и видимо, тянет опохмелиться. При этом портрет выразительный, очень в духе времени.</p><p>Верхний блок надписей выполнен модным шрифтом позднего модерна — но у Б и Р вдруг отросли русалочьи хвостики.</p><p>Купюра настолько не похожа на все прочие, что кажется случайной.</p><p>А вот реверс той же материи, что на трёшке. И тоже как будто не от этой деньги. Показать меньше</p>", 1.0], ["img/02/02-017.jpg", "02-017", "<b>Государственный Казначейский Билет СССР 1 рубль образца 1934.</b><p>Три казначейских билета 1934 года составляют серию — очень большая редкость для советских денег. На них почти нет объёмных орнаментов, строго выстроенные блоки и затейливые фигурные рамки.</p><p>Серийность есть и на реверсах, хотя единица явно не дотягивает до тройки и пятёрки. Показать меньше</p>", 1.0], ["img/02/02-018.jpg", "02-018", "<b>Государственный Казначейский Билет СССР 3 рубля образца 1934.</b><p>Самая интересная тройка на совденьгах. При том, что тройки как раз на них хороши. Но эта так мощно стоит на реверсе — да и на аверсе тоже — что хочется смотреть только на неё. Показать меньше</p>", 1.0], ["img/02/02-019.jpg", "02-019", "<b>Государственный Казначейский Билет СССР 5 рублей образца 1934.</b><p>Пятёрка под стать тройке — держит обе стороны купюры.</p><p>Дубасов — а это уж точно он — может, оказывается, быть не только помпезным, но и стильным. Показать меньше</p>", 1.0], ["img/02/02-020.jpg", "02-020", "<b>Государственный Казначейский Билет СССР 1 рубль образца 1938.</b><p>Серия из трёх казначейских билетов 1938 года — одна из самых заметных у Дубасова.<br>Во-первых, они с картинками (одна мирная, две воинственных).<br>Во-вторых, они с курсивом. И это последние крупные курсивы на советских деньгах.<br>В-третьих, это, наверное, самые «долларовые» рубли — если смотреть на аверсы.</p><p>На рубле изображён стахановец, но не Стаханов. Nothing personal. Мало ли что может случиться с героем пятилетки? Вдруг начнёт копать туннель в Англию?</p><p>На реверсе почему-то надпись, а не цифра. Что вдруг? Дизайн денег вообще штука хитрая, а советских и вовсе неисповедимая. Показать меньше</p>", 1.0], ["img/02/02-021.jpg", "02-021", "<b>Государственный Казначейский Билет СССР 3 рубля образца 1938.</b><p>На трёшке марширует пехота в касках 1938 года, вооруженная трёхлинейками со старинными штыками. Почему на деньгах солдаты? Странный вопрос для советского 1938 года, но загляните в «приложение» — в других странах Марс и Меркурий не так часто встречаются.</p><p>Очень красивый курсив и крупная тройка, повторяющаяся на реверсе. А на пятёрке не так. Показать меньше</p>", 1.0], ["img/02/02-022.jpg", "02-022", "<b>Государственный Казначейский Билет СССР 5 рублей образца 1938.</b><p>Сталинский сокол нарисован детально (особенно парашют), а вот истребители Дубасов явно не умел рисовать. Двухлопастной винт на моноплане тому свидетель.</p><p>Курсив совсем другой, чем на рубле и трёшке. Цифры тоже решены иначе, причем пятерка на аверсе неожиданно завитушистая. Показать меньше</p>", 1.0], ["img/02/02-023.jpg", "02-023", "<b>Билет Государственного банка СССР 1 червонец образца 1937.</b><p>Последние советские золотые червонцы. После них рубль изготавливался только из различных пород дерева стабильно невысокой ценности. Надпись об обеспечении золотом, очень мелкая и максимально ни к чему не обязывающая, под крупным блоком «Один червонец». Сравните с ценой в граммах на купюре с сеятелем.</p><p>Надписи и цифры ясные, без выкрутасов. Немного курсива. В целом почти ардеко, только немного в позументах.</p><p>Эта серия — первые советские деньги с Лениным. Он единственный реальный человек на союзных банкнотах. Остальное — обобщённые образы. Что особенно интересно — на деньгах нет ни одного портрета усатого вождя. Везде были — а на деньгах не было. Видимо, так поддерживался ореол бессеребреника.</p><p>На деньгах 1937 года впервые нет подписей преднаркомфина и казначея. Они исчезли и больше никогда не вернутся. Как вы думаете, почему?</p><p>И ещё одна важная деталь: с советских денег исчезла арабица. Вместо неё появилась латиница. Помните пост про латинизацию? Вот она в денежном выражении — для тюркских языков. Но это ненадолго.</p><p>А ещё ленточек на гербе ссср стало десять. Это тоже не навсегда. Показать меньше</p>", 1.0], ["img/02/02-024.jpg", "02-024", "<b>Билет Государственного банка СССР 10 червонцев образца 1937.</b><p>Десять червонцев завершают серию, куда входят обычные номиналы: 1, 3, 5, 10.<br>Все банкноты примерно одного рисунка, десятка только чуть богаче декорирована. Показать меньше</p>", 1.0], ["img/02/02-025.jpg", "02-025", "<b>Государственный казначейский билет СССР 1 рубль образца 1947.</b><p>Предпоследний большой дубасовский денежный проект: три казначейских билета — 1, 3, 5 рублей, четыре банковских — 10, 25, 50, 100.</p><p>Всё, что было до того (и до войны) — только эксперименты. Выпуски 1947 и 1961 года — советская классика. На гербе 15 ленточек. Азия кириллизована. От Европы в конец списка.</p><p>Стилистика — дореволюционная. «Катенька» и «петенька» вылезли из стола и правят бал.<br>Орнаменты — лепное советское барокко. Шрифты и цифры максимально вычурные, в завитушках, бантиках и крендельках. Со всех купюр серии прёт тяжёлая пышная архаика. Они выглядят даже более старообразно, чем прототипы 1910-х годов. Реверсы по тяжести и роскоши не уступают аверсам.</p><p>Все казначейские билеты вертикальные. Тоже отсылка к славному прошлому разрушенной большевиками Российской империи. Показать меньше</p>", 1.0], ["img/02/02-026.jpg", "02-026", "<b>Государственный казначейский билет СССР 3 рубля образца 1947.</b><p>Все композиции на купюрах 1947 года разные. И на аверсах, и на реверсах. Не повторяются ни шрифты, ни орнаменты, ни расположение блоков. Это ярко выраженный образец антидизайна. Как это можно оценить? Наверное, как выражение предельной избыточности, сверхбогатства — как в домах нуворишей, где позолочено всё, а остальное покрыто лепниной. Гробовщик Безейчук был бы доволен: Гознак кисть даёт!</p><p>Всё вышесказанное относится к трёшке — младшему сержанту советской денежной армии. На ней шесть разных цифр 3. Показать меньше</p>", 1.0], ["img/02/02-027.jpg", "02-027", "<b>Государственный казначейский билет СССР 5 рублей образца 1947.</b><p>Устал я их описывать. На пятёрке пять разных пятёрок. Почему меньше, чем на трёшке? Показать меньше</p>", 1.0], ["img/02/02-028.jpg", "02-028", "<b>Билет Государственного банка СССР 10 рублей образца 1947 года</b><p>Каталог, из которого я брал картинки, утверждает, что на банкнотах 10, 25 и 50 рублей 1947 года Ленин изображен на реверсе, а на сотенной — на аверсе.</p><p>На десятке восемь разных десяток. Три на лениноносном реверсе, пять на аверсе, где они играют в прятки.<br>И ни одного шрифта без прибамбасов. Показать меньше</p>", 1.0], ["img/02/02-029.jpg", "02-029", "<b>Билет Государственного банка СССР 25 рублей образца 1947 года</b><p>На четвертаке цифры разбежались ровно наоборот по сравнению с десяткой: всего два по 25 на аверсе, зато пять себя числят по-над Лениным. Показать меньше</p>", 1.0], ["img/02/02-030.jpg", "02-030", "<b>Билет Государственного банка СССР 50 рублей образца 1947 года</b><p>На полтиннике три разных 50 спереди, три разных сзади. Я не учитываю повторения.</p><p>А еще на десятке и четвертаке Ленин без рамочки, а на полтиннике в рамочке. Угадайте, как на сотне? Показать меньше</p>", 1.0], ["img/02/02-031.jpg", "02-031", "<b>Билет Государственного банка СССР 100 рублей образца 1947 года</b><p>Тадам! На сотне Ленин вылез на передок и рамочку как бы отбросил, но к полной свободе формы так и не вернулся.</p><p>По идее, маршальская сотня должна была быть увешана лепниной как маршалы орденами. Но нет! Пожалуй, она выглядит даже построже своих младших коллег. Показать меньше</p>", 1.0], ["img/02/02-032.jpg", "02-032", "<b>Государственный Казначейский Билет СССР 1 рубль образца 1961</b><p>Наконец мы добрались до денег, которые видело моё поколение и все последующие, заставшие в живых ссср.</p><p>Эта серия — финальный аккорд Дубасова — продолжает тему 1947 года, но становится еще более псевдорусской. Мне кажется, ее символами могут служить две О на рублёвке — такие вычурные и такие ненастоящие, что даже следующие за ними «дин рубль» смотрятся более естественными. Показать меньше</p>", 1.0], ["img/02/02-033.jpg", "02-033", "<b>Государственный Казначейский Билет СССР 3 рубля образца 1961</b><p>Чем примечательны младшие чины казначейства — на трёшке и пятёрке появились Кремлёвские башни. Это как бы эполеты на и без того парадной форме. Зато реверсы стали немного пожиже по сравнению с 1947 годом. Показать меньше</p>", 1.0], ["img/02/02-034.jpg", "02-034", "<b>Государственный Казначейский Билет СССР 5 рублей образца 1961.</b><p>Мне нравится военная метафора. Рубль где-то сержант, Трёшка старшина, Пятёрка тянет на старлея или капитана, а всё, что выше — уже старший комсостав.<br>На аверсе пятёрки четыре пятёрки — все разные. На реверсе ещё две формы. Всё-таки Дубасов — выдающийся леттерингист. Показать меньше</p>", 1.0], ["img/02/02-035.jpg", "02-035", "<b>Билет государственного банка СССР 10 рублей образца 1961.</b><p>Хрущевская десятка — «красненькая». Поднести ее считалось вполне ценным подарком за среднего размера услуги.</p><p>Ленин на десятке окончательно забронзовел и орельефился. Смотрит строго назад, в славное прошлое (относительно направления чтения). Занятно, что на следующих трех купюрах Ильич поворотится в будущее.</p><p>Со шрифтом всё как всегда: буквы завёрнуты в разных видов капустные листья, дорого и тенисто. Показать меньше</p>", 1.0], ["img/02/02-036.jpg", "02-036", "<b>Билет государственного банка СССР 25 рублей образца 1961.</b><p>На пурпурном четвертаке и выше Ленин смотрит в даль светлую.</p><p>Интересно, что каждая строка всех номиналов на всех купюрах сделана своим шрифтом. Если «Двадцать пять» одним, то «рублей» непременно иначе.</p><p>В пустом картуше на реверсе четвертака, кажется, был какой-то водяной знак Показать меньше</p>", 1.0], ["img/02/02-037.jpg", "02-037", "<b>Билет государственного банка СССР 50 рублей образца 1961.</b><p>Не помню, когда я первый раз увидел пятидесятирублёвую купюру. Скорее всего задолго до того, как получил её. Первые годы работы 50 рублей были больше половины моей месячной зарплаты. Видимо поэтому все встречавшиеся в советское время полтинники были чистыми и только один раз перегнутыми посередине.</p><p>Стоп! Оказывается, был ещё курсив на поздних рублях. Пятьдесят и сто рублей написаны курсивом, но каким! Вертикальным и таким толстым, что он больше похож на золотую цепь, чем н е (5х5). В обращении до 1922 г.</p><p>Народное название знаков - «мотыльки».</p><p>Написано: «Расчетный знак Р.С.Ф.С.Р. обязателен к обращению наравне с кредитными билетами».</p><p>Почтовые марки, которые пытаются ходить наравне с кредитными билетами. Не знаю, какова была их листовая покупательная способность, но на деньги они совсем не похожи. Показать меньше</p>", 1.0], ["img/02/02-052.jpg", "02-052", "<b>Расчетные знаки РСФСР 100 рублей образца 1921</b><p>Расчетные знаки РСФСР образца 1921 г. выпущены на основание декрета СНК от 16 июня 1921. В обращении до 1922 г.</p><p>Серия смелых номиналов 100-100000 рублей. Попытка делать деньги налету в пропасть инфляции. Меня заинтересовало разнообразие дизайнов. Смотрите эту и три следующих картинки.</p><p>У сотенной фактически нет реверса. «И дай им бог успеть спросить: Куды?.». Показать меньше</p>", 1.0], ["img/02/02-053.jpg", "02-053", "<b>Расчетные знаки РСФСР 10000 рублей образца 1921.</b><p>Судя по цвету, это десятка. На аверсе самая оригинальная композиция из всех виданных, на реверсе опять призывы мировой пожар раздуть. Показать меньше</p>", 1.0], ["img/02/02-054.jpg", "02-054", "<b>Расчетные знаки РСФСР 25000 рублей образца 1921.</b><p>Аверс 25000 похож на театральную афишу — хороший модерн в одну краску. Реверс внезапно классический, в ту же краску, без всяких пролетариев. Показать меньше</p>", 1.0], ["img/02/02-055.jpg", "02-055", "<b>Расчетные знаки РСФСР 50000 рублей образца 1921.</b><p>И вдруг — почти настоящий полтинник в богатом арнувошном картуше с кукурузой. Довольно красивая бумажка, не так ли?</p><p>А реверс как у 25000. Показать меньше</p>", 1.0], ["img/02/02-056.jpg", "02-056", "<b>Расчетные знаки РСФСР 100000 рублей образца 1921.</b><p>Сто тысяч как будто с другого неба упали. В какой коллекции политипажей нашли эту разлапистую Р? Вообще, похоже, что аверс почти наборный. А реверс внезапно не такой, как на двух предыдущих «знаках» Показать меньше</p>", 1.0], ["img/02/02-057.jpg", "02-057", "<p>Обяза нт 1917</b><p>На фунте святой Егорий прободает дракона, как положено. На реверсе вид из школьного учебника английского. Показать меньше</p>", 1.0], ["img/02/02-062.jpg", "02-062", "<b>Великобритания, 1 фунт 1928</b><p>Этот зелёный фунт немного напоминает дубасовские рубли тридцатых. Довольно лёгкая композиция, чуть-чуть барокко, курсив… Вряд ли имело место заимствование (кого у кого?), просто ардеко навеяло. Показать меньше</p>", 1.0], ["img/02/02-063.jpg", "02-063", "<b>Великобритания, 1 фунт Выпуск 1962-66</b><p>На мой взгляд, это самая красивая банкнота во всей подборке. Композиция, сложность и богатство деталей, выдающаяся каллиграфия и типографика, сдержанность и эффектность — и при всём этом лёгкость. И денежность — это именно деньги, ни что иное. Показать меньше</p>", 1.0], ["img/02/02-064.jpg", "02-064", "<b>Великобритания, 10 фунтов 1967</b><p>Тот же дизайн, что на фунтовой купюре, но десятка тяжелее, а игры в ней меньше.<br>Правда, очень хорош лев на реверсе.</p><p>Эти фунты ходили одновременно с советскими деньгами 1961 года. Иногда, чтобы почувствовать разницу культур, достаточно положить рядом две бумажки. Показать меньше</p>", 1.0], ["img/02/02-065.jpg", "02-065", "<b>Германия, 5 марок 1882</b><p>В каталоге стоит 1882 год, а на купюре — апрель 1874.</p><p>Вот это красивые деньги, правда? Не без немецкой пышности, с хорошей готикой, и с прямо выдающимся по выразительности реверсом. Показать меньше</p>", 1.0], ["img/02/02-066.jpg", "02-066", "<b>Германия, 20 марок 1882</b><p>Тутти-путти, рейхсбуржуазность, кукуруза в венке — но и это приятные глазу деньги империи, глядящей в гегемоны. Показать меньше</p>", 1.0], ["img/02/02-067.jpg", "02-067", "<b>Германия, 50 марок 1882</b><p>А вот если дева с крыльями на «петеньку» 1866 года наедет — кто кого заборет?<br>Опять приглашение сравнить культуры.</p><p>А еще обратите внимание — свитки на всех немецких реверсах разные. А красные надпечатки на них как бы не вполне точно вписываются в черный свиток. Интересно — так и задумано? Оммаж Гутенбергу? Показать меньше</p>", 1.0], ["img/02/02-068.jpg", "02-068", "<b>Германия, 5 марок 1914</b><p>В Первую мировую Германия вступала крепкой самоуверенной монархией с могучей денежной системой. По сравнению с 1880-ми годами деньги стали тяжелыми, пышными и некрасивыми.</p><p>Готического шрифта прибавилось в разы. Это немного похоже на стиль а ля рюс, расцветший в России по поводу трёхсотлетия Романовых. Показать меньше</p>", 1.0], ["img/02/02-069.jpg", "02-069", "<b>Германия, 50 марок 1914</b><p>Что-то в этом переборе есть, но деньги Антанты куда веселее.<br>Да и у союзников по Оси попадались куда более изысканные денежные знаки. Показать меньше</p>", 1.0], ["img/02/02-070.jpg", "02-070", "<b>Австро-Венгрия, 50 крон 1914</b><p>Вот самые модные деньги стиля сецессион. Даже имперская тяжесть не мешает суперсовременной типографике, орнаментике, иллюстрации. Легко представить эти банкноты на какой-нибудь венской выставке. Показать меньше</p>", 1.0], ["img/02/02-071.jpg", "02-071", "<b>Австро-Венгрия, 10 крон 1915</b><p>Младший братик фрау с предыдущей картинки. Общее с советскими деньгами — блока названий на разных языках, в том числе кириллицей. Показать меньше</p>", 1.0], ["img/02/02-072.jpg", "02-072", "<b>Австро-Венгрия, 1 крона 1916</b><p>Однокроновая бумажка намного проще, чем старшие товарки, и даже напечатана в две краски с простым перекрыванием одного цвета другим, но по стилю ничуть не хуже. Показать меньше</p>", 1.0], ["img/02/02-073.jpg", "02-073", "<b>50 франков тип 1927 г. &quot;Luc Olivier Merson&quot;</b><p>Во франках есть что-то неуловимо протоЕвровое. Показать меньше</p>", 1.0], ["img/02/02-074.jpg", "02-074", "<b>100 франков тип 1906 г. &quot;Luc Olivier Merson&quot; &quot;C инициалами LOM&quot;</b><p>Франки не похожи на другие деньги. Во-первых, они живописные. Во-вторых — вот они-то действительно авторские. Люк Оливье-Мерсон — художник. Его имя стоит на стофранковой купюре. А еще там присутствует крупная аббревиатура LOM (справа на мешке). Представьте себе инициалы ИИД на сторублёвке. Показать меньше</p>", 1.0], ["img/02/02-075.jpg", "02-075", "<b>1000 франков тип 1927 г. &quot;Cérès et Mercure&quot; модифицированный выпуск</b><p>Тысяча франков с Церерой и Меркурием, а также со смирным петушком и разными науками и ремёслами на обороте. В каталоге написано тип 1927, на банкноте стоит 1938 год. Как нам известно, чем дольше ходит деньга, тем стабильнее жизнь. Показать меньше</p>", 1.0], ["img/02/02-076.jpg", "02-076", "<b>300 франков тип 1938 г.</b><p>Одна из самых необычных купюр. Почти белая, с двумя очень крупными головами. Показать меньше</p>", 1.0], ["img/02/02-077.jpg", "02-077", "<b>20 франков тип 1940 г. &quot;Travail et Science&quot;</b><p>Последние предвоенные франки. Производство и наука. Любопытно, что аллегория ручного труда — дама. Ковровость усилилась. На всех франках основной шрифт — антиква арнуво. Показать меньше</p>", 1.0], ["img/02/02-078.jpg", "02-078", "<b>50 франков тип 1933 г. &quot;Cérès&quot;</b><p>Церера сама по себе, Меркурий сам по себе. Церера чем-то недовольна. Показать меньше</p>", 1.0], ["img/02/02-079.jpg", "02-079", "<b>100 франков тип 1939 г. &quot;Sully&quot;</b><p>В моей подборке это самые ранние деньги с портретом не короля или королевы, а простого герцога Сюлли, министра финансов Генриха IV. Показать меньше</p>", 1.0], ["img/02/02-080.jpg", "02-080", "<b>5000 франков тип 1934 г. &quot;Victoire&quot;</b><p>На пяти тысячах самый элегантный шрифт. А вот Победа одна на все стороны. Показать меньше</p>", 1.0], ["img/02/02-081.jpg", "02-081", "<b>100 новых франков тип 1959 г. &quot;Bonaparte&quot;</b><p>Последний экспонат моей подборки — сто новых франков 1959 года со старым добрым Бонапартом. Триумфальная арка на аверсе — символ военных побед, Дом инвалидов на реверсе — скорее всего, социальные заслуги императора. Показать меньше</p>", 1.0]], "research": null}, {"intro": false, "num": "28", "title": "Глава о советских прописях 1930-х", "ptitle": "Советские прописи глазами типографа и ИИ", "subtitle": "От живого письма к мёртвому чертежу.", "date": "11 июля 2025 г.", "perm": "https://www.facebook.com/100000723643455/posts/24461477630126352/", "slug": "propisi", "html": "<p class=\"note\">Это третья глава о прописях и чистописании.</p>\n<div class=\"epi\"><p>«Отвечает лодырям серый кот: …<br>… Ни попить без грамоты, ни поесть…»</p><span class=\"epi-a\">Самуил Маршак</span></div>\n<p><span class=\"dc\">К</span>аждый человек в современном мире должен (обязан, имеет неотложную необходимость) уметь читать и писать. Это настолько ясно, что Капитан Очевидность улетает, скучая.</p>\n<p>А как было век-полвека назад на территории бывшей Российской империи?</p>\n<p>С чтением понятно: получив в нагрузку к гражданским правам государственные обязанности, каждый советский человек должен был уметь прочесть «не влезай убьет» на трансформаторной будке и «Правила проезда» там, где он хочет проехать.</p>\n<p>Кроме того, он обязан был разбирать, хоть по складам, основные заклинания новой религии, а также знать побуквенно имена вождей, чтоб не ошибиться, прославляя, вычеркивая и замазывая.</p>\n<p>Со всеобщим умением писать всё не так однозначно. Оно было необходимо более-менее образованной части общества, а для прочих ограничивалось десятком заявлений, тремя десятками подписей и открытками родным на праздники — за всю жизнь. Но всё же умение писать в 20 веке можно считать одним из самых базовых.</p>\n<p>А как с чистописанием? Его можно сравнить с двумя другими дисциплинами: обучению танцам и строевой подготовкой.</p>\n<p>Важно: чистописание — не каллиграфия. Каллиграфия — это балет: род искусства, предполагающий высокий уровень умения и обязательный элемент творчества.</p>\n<p>Чистописание — обучение копированию стандартного образца. Оно было признано выработать стандартный почерк — не слишком быстро читаемый, но ровный и теоретически довольно скорый при записывании. Любой индивидуальный почерк считался ухудшением божественного прототипа и карался снижением оценок.</p>\n<p>Знаю, что многие считают чистописание необходимым навыком. Однако, как вам кажется, что важнее: умение всех делать что-то одинаково или умение каждого делать что-то самостоятельно? Например — думать и находить собственный путь в жизни. А ведь почерк — точное графическое отображение характера. Что лучше: сто миллионов одинаковых почерков или сто миллионов разных? Для тоталитарного устройства, конечно, удобней первый вариант.</p>\n<p>Возвращаясь к танцам и каллиграфии. Это два столпа дворянского обучения. В 19 веке ловкий танцор или танцовщица имели матримониальные преференции (см. сочинения графа Толстого, не говоря уж о нашем всем).</p>\n<p>Красивый почерк был лучшим стартом карьеры чиновника. Но тут речь не о школьном чистописании, а о каллиграфии достаточно высокого уровня.</p>\n<p>К советскому времени каллиграфы выродились в писарей, а за протоколы, доклады и отчеты отвечала машинистка. Чистописание в школе с тридцатых годов стало точным подобием шагистики.</p>\n<p class=\"verse\">Раз-два<br>все в ряд<br>шагай<br>отряд</p>\n<p>Это было необходимое предуведомление. Подробности о том, как тянули носок в 1915, 1922, 1934 и далее до 1969 года — в подписях к картинкам.</p>\n<div class=\"orn\" role=\"separator\"><b></b></div>\n<p>А теперь вторая часть поста — о нашем проекте «Цифровой I——о Г» — в связи с прописями.</p>\n<p>Капитан О, возвращайся! Сейчас будет весело.</p>\n<p>Как вы помните, мы с партнёром Юлией Репринцевой создаем моего цифрового доппельгангера, чтоб помочь писать эту книгу. Младенчик попался умненький, но возникли огромные проблемы с кормлением.</p>\n<p>Сначала всё шло гладко. ИИ быстро нашел нужные пособия и показал высокую способность читать никак не подготовленные пдфы. Он разбирал даже прописи — куда лучше, чем профессиональный FineReader.</p>\n<p>Но вдруг случился затык. Обычно текстовый пдф, пусть и многостраничный, весит сотни килобайт. Ну, пару мегабайт от силы. Наши буквари и даже тетрадки прописей норовили уйти за 10 мегабайт из-за сотен картинок (в т. ч. самих прописей). А самый злобный учебник, подготовленный по стандартам ABBEE, тянул на 156 Мб.</p>\n<p>Простой чат таких не ест. Даже по одному.<br>Проект ест, но не больше десяти, а каждый кусочек чтоб не больше десяти Мб.</p>\n<p>Две недели мы каторжно плясали с бубнами, сначала сжимая пдфы (в Акробате, а потом вообще вручную, уменьшая каждую страницу), а после пытаясь скормить полученное младенцу. Тот плевался, зависал и требовал поделить файлы на всё более мелкие кусочки.</p>\n<p>А попутно еще ругался, что не понимает гадких прописей! Что там везде буква а! Аааааааааааа!</p>\n<p>В конце концов мы поделили наши 18 изданий на две группы: книжки отдельно, тетрадки отдельно.</p>\n<p>Потом вручную набрали образцов прописей из тетрадок и предложили гугнивцу.</p>\n<p>И что вы думаете? Тут же всё слопал, прочитал и выдал вполне разумный анализ содержания прописей по смыслу текстов, социальному составу учеников, по нагнетанию политики в учебный процесс.</p>\n<p>Тогда мы нарезали книжки дольками, сократили число до 10 и размер до 10 Мб, стали загружать… Опять не жрёт.</p>\n<p>Тут Юля не выдержала и спросила: тебе чего надо? И чат вдруг выдал секрет: оказывается, в тайном правиле загрузки общий объем файлов не должен быть больше 80 Мб! То есть 10 по 10 равно 80. Славно.</p>\n<p>Уменьшили. Отбросили все лишние копыта. Съел.</p>\n<p>Финальный пдф прилагаю. Сами смотрите, насколько глубоко чат разобрался в обучении письму в период от 1915 до 1961 года. Мне кажется, хорошо поработал — и рассказал совершенно не так, как я )</p>\n<p>На всё исследование ушло минут пятнадцать.</p>\n<p>Единственное, чего чатик так и не понял — чем писали. Это несложно объяснить, но мне, честно говоря, немного надоело с ним возиться )</p>\n<div class=\"orn\" role=\"separator\"><b></b></div>\n<h3>Третья часть — о самих прописях</h3>\n<p>С визуальной стороны прописи за полвека почти не изменились. Они становились то чуть кудрявее, то чуть проще, но никакой системы в этих вариациях букв не было.</p>\n<p>Система была в более или менее жестком подходе к чистописанию, выражавшемся в использовании и частоте косой линовки. Чтобы унифицировать почерк, подопытных надо было загнать в косую сетку. Предельный случай шагописания — рекомендации учителю давать образцы сочетаний букв, нарушающие ритм письма, с тем, чтобы ребенок писал точно по косым линейкам. Примеры смотрите на картинках.</p>\n<p>А еще — если не знали — запомните фамилию Флеров (или Флёров). Из всех чистописателей он единственный, на мой взгляд, чьи идеи хороши и сегодня.</p>", "figs": [["img/03/03-001.jpg", "03-001", "<b>В. С. Гербач. «Методическое руководство к обучению письму». 1915</b><p>К этой книге я уже обращался в посте о дореволюционных прописях. Приглашаю вас читать, что прописано. С течением времени слова для копирования будут сильно меняться</p>", 1.0], ["img/03/03-002.jpg", "03-002", "<b>В. С. Гербач. «Методическое руководство к обучению письму». 1915</b><p>Значение графической сетки. Гербач считал, что сетка в косую линейку необходима для запоминания правильных форм букв. Причем формы эти он описывал очень жестко и точно.</p><p>По сути, его чистописание было подвидом строгой каллиграфии. В том, что такой почерк наилучший, он не сомневался.</p>", 1.0], ["img/03/03-003.jpg", "03-003", "<b>В. С. Гербач. «Методическое руководство к обучению письму». 1915</b><p>На этих картинках обратите внимание на три вещи.</p><p>Первая: буква б без толщины на хвосте. Попробуйте ее так написать тонким пером — и не нажать при двойном повороте.</p><p>Вторая: д хвостом вверх и д хвостом вниз. Одна из этих форм позже будет признана чуждой советскому письму.</p><p>Третья: цифры на клетках имеют тот же наклон, что и на линейках. Это говорит о еще не утраченном чувстве письма. Потом изменится.</p>", 1.0], ["img/03/03-004.jpg", "03-004", "<b>В. С. Гербач. «Методическое руководство к обучению письму». 1915</b><p>Алфавиты от Гербача. Замечаем сверхузкие в, е, з, с, ч, ь, э. Эти буквы со временем начнут серьезно ломать ритм письма, и без того не слишком ровный в прописях. Но здесь еще нормальной ширины г.</p>", 1.0], ["img/03/03-005.jpg", "03-005", "<b>Тетрадь Гербача 1914</b><p>Гербач был не только видным теоретиком и практиком, но и серьезным бизнесменом. Под его маркой выходили не только пособия, но и тетради, и перья.</p>", 1.0], ["img/03/03-006.jpg", "03-006", "<b>Тетрадь Гербача 1914</b><p>Редкий случай политического пафоса в школьной тетради. Почерк — прямой курсив, пропагандистом которого был г-н Гербач.</p>", 1.0], ["img/03/03-007.jpg", "03-007", "<b>В. Флеров. «Наглядные уроки письма». 1916</b><p>Флеров был противником письма по косым линейкам. Поэтому его прописи не такие напядные, как у всех прочих, зато с нормальным ритмом и шириной букв.</p>", 1.0], ["img/03/03-008.jpg", "03-008", "<b>В. Флеров. «Наглядные уроки письма». 1916</b><p>Алфавит Флерова. От Гербача отличается латинизированной формой заглавных Н, Т. Они долго будут мерцать в советских прописях. Строчная д двух видов.</p>", 1.0], ["img/03/03-009.jpg", "03-009", "<b>В. Флеров. «Наглядные уроки письма». 1916</b><p>Если сможете — прочитайте теоретическую часть Флерова. Она резко контрастирует со всем остальным в этом посте.</p>", 1.0], ["img/03/03-010.jpg", "03-010", "<p>М. Ф. Робинсон, М. Л. Закожурникова. «Поход за грамоту. Рабочая книга по грамоте для деревенских школ и подростков. 1930</p><p>Из всех пособий по прописям эта книжка самая политически наивная и бесстыжая. Икона советской религии появляется на первой же странице, а ее (иконы) псевдоним — главное слово, что было в начале.</p><p>Обратим внимание: писать предлагается не только пером, но и чем-то безнажимным. А прописи — из всех — самые лапидарные.</p>", 1.0], ["img/03/03-011.jpg", "03-011", "<p>М. Ф. Робинсон, М. Л. Закожурникова. «Поход за грамоту. Рабочая книга по грамоте для деревенских школ и подростков. 1930</p><p>Вторая страница. Или третья? Заклинание именем продолжается чуть не на полтетради.</p><p>Смотрим на жесты одетых по-военному подростков. Такое чувство, что это кинораскладка пионерского салюта — слева направо.</p>", 1.0], ["img/03/03-012.jpg", "03-012", "<p>М. Ф. Робинсон, М. Л. Закожурникова. «Поход за грамоту. Рабочая книга по грамоте для деревенских школ и подростков. 1930</p><p>Вторым словом является ссср. Не Россия, не Русь, не дай бог. А главный предмет — винтовка.</p>", 1.0], ["img/03/03-013.jpg", "03-013", "<p>М. Ф. Робинсон, М. Л. Закожурникова. «Поход за грамоту. Рабочая книга по грамоте для деревенских школ и подростков. 1930</p><p>Наш Роман в роте. Здесь нет прописей, но есть строевая.</p>", 1.0], ["img/03/03-014.jpg", "03-014", "<p>М. Ф. Робинсон, М. Л. Закожурникова. «Поход за грамоту. Рабочая книга по грамоте для деревенских школ и подростков. 1930</p><p>Буква Т в слове «трактор». Упрощение и лишение левой разгонной завитушки.<br>А если внимательно посмотреть на пропись, видно, что ее чертили. Раньше так не было.</p>", 1.0], ["img/03/03-015.jpg", "03-015", "<p>М. Ф. Робинсон, М. Л. Закожурникова. «Поход за грамоту. Рабочая книга по грамоте для деревенских школ и подростков. 1930</p><p>Сравните К у Флерова и здесь. Там средняя горизонталь была рукописной петлёй. В советских прописях она превратилась в жесткую полку.</p>", 1.0], ["img/03/03-016.jpg", "03-016", "<p>М. Ф. Робинсон, М. Л. Закожурникова. «Поход за грамоту. Рабочая книга по грамоте для деревенских школ и подростков. 1930</p><p>Эта картинка — некоторый апофеоз госнахальства. Колокола сняли, продали, а денежки не себе оставили (например, парты купить), а заём на них купили!</p>", 1.0], ["img/03/03-017.jpg", "03-017", "<p>М. Ф. Робинсон, М. Л. Закожурникова. «Поход за грамоту. Рабочая книга по грамоте для деревенских школ и подростков. 1930</p><p>Отличный пример обучающего текста</p>", 1.0], ["img/03/03-018.jpg", "03-018", "<b>Тетрадь в линейку с портретом Троцкого на обложке. 1926</b><p>Внизу восемь гномов идут в трудовую школу</p>", 1.0], ["img/03/03-019.jpg", "03-019", "<b>Тетрадь в линейку с портретом Троцкого на обложке. 1926</b><p>Реальный скорописный почерк молодого человека в 1926 году. Писано, конечно, авторучкой. И сюжет захватывающий</p>", 1.0], ["img/03/03-020.jpg", "03-020", "<p>Тетрадь для механики-физики ученика II группы школы Ф.З.У. Николаева Николая. 19-2/II-30</p>", 1.0], ["img/03/03-021.jpg", "03-021", "<b>Тетрадь для механики-физики ученика II группы школы Ф.З.У. Николаева Николая. 19-2/II-30</b><p>Еще один реальный почерк 1930 года. Здесь, может быть, и пером писано: толщина штрихов разная.<br>Смотрим на форму букв к, р (с высоким выносом вверх). На под- и надчеркивания. На букву я с загнутым назад хвостом. Всё это против правил чистописания.</p>", 1.0], ["img/03/03-022.jpg", "03-022", "<b>Воскресенская (сотоварищи). Прописи 1935</b><p>Прописи Воскресенской переживут их главного героя.</p><p>Правила держания ручки взяты у Гербача.</p><p>А вот картинка с пионером за партой будет нашим рефреном. Смотрите, как она меняется с десятилетиями.</p>", 1.0], ["img/03/03-023.jpg", "03-023", "<b>Воскресенская (сотоварищи). Прописи 1935</b><p>Удивительно: в прописях на косой линовке одна форма заглавных (невиданная ранее), а для более продвинутых учеников — другая, кудрявая.</p><p>Эти заглавные как бы изображают подросшие строчные. Зачем? Ведь потом надо переучиваться?</p>", 1.0], ["img/03/03-024.jpg", "03-024", "<b>Воскресенская (сотоварищи). Прописи 1935</b><p>Первый алфавит Воскресенской с псевдозаглавными. Строчная д лишилась товарки хвостом вверх, зато вдруг явилась У двух видов.</p><p>А над ними парят уже хорошо отобранные товарищи.</p>", 1.0], ["img/03/03-025.jpg", "03-025", "<b>Воскресенская (сотоварищи). Прописи 1935</b><p>При упрощенных заглавных особенно хороши старорежимные №№</p><p>А зайку нужно изловить. И сдать, видимо, куда надо.</p>", 1.0], ["img/03/03-026.jpg", "03-026", "<b>Воскресенская (сотоварищи). Прописи 1935</b><p>Без косой линовки письмо становится более ритмичным и сбалансированным по ширинам.</p><p>А вот и настоящие заглавные. С немного застенчивыми петельками.</p>", 1.0], ["img/03/03-027.jpg", "03-027", "<b>Воскресенская (сотоварищи). Прописи 1935</b><p>Последний текст в тетради. Все акценты расставлены.<br>Главные слова: все, площадь, флагов, часовой, Союз (с заглавной), трудовой, воевать.</p>", 1.0], ["img/03/03-028.jpg", "03-028", "<b>Воскресенская Прописи 1947</b><p>Послевоенные прописи. Это, конечно, реконструкция книги (там дальше даже голубые линейки).</p><p>Смотрим на парту. Есть ли что новое?</p><p>А вот что точно новое: подписи не набраны, а написаны вручную чертежным шрифтом. Так проще сделать клише</p>", 1.0], ["img/03/03-029.jpg", "03-029", "<b>Воскресенская Прописи 1947</b><p>Алфавит Воскресенской-47. Прошло 12 лет. Что изменилось?</p><p>Во-первых, исчезли квазизаглавные.<br>Во-вторых, ужесточилось впиливание букв в клетки. Появилась переходная строчная в. Остались две формы з.<br>Заглавные сильно унифицировались: смотрим на левые части К, Н, Ю и на все завитушки (в том числе у З, Э)</p><p>Но самое важное: это не рукой писано. Буквы чертил чертёжник. Еще не так железно, как двадцать лет спустя, но уже вполне непостижно уму и руке семилетки.</p>", 1.0], ["img/03/03-030.jpg", "03-030", "<b>Воскресенская Прописи 1947</b><p>Что ты, Юрий, видел в зоопарке?</p><p>Сбои ритма видел, т. Воскресенская. Тигру недоложили г. Медведю сплюснули ве. Так не пишут, дорогой товарищ.</p>", 1.0], ["img/03/03-031.jpg", "03-031", "<b>Воскресенская Прописи 1947</b><p>Финальная ода. Два раза встречается слово «русское(ая)». Еще не с заглавной. А после — две заглавных Родины и одна раскрытая аббревиатура.</p>", 1.0], ["img/03/03-032.jpg", "03-032", "<b>Воскресенская Прописи 1947</b><p>Цифры изменили наклон под клетку. В столбик удобно. А как по клеткам буквы писать?</p>", 1.0], ["img/03/03-033.jpg", "03-033", "<b>Воскресенская Прописи 1948, 2 класс</b><p>Если не реставрировать, прописи выглядят так.</p><p>Второй класс, а косая линовка сохраняется. Может быть, повторение пройденного?</p><p>Подписи все те же, чертежным шрифтом.</p><p>В слитном ряду строчных особенно заметны (намеренные, чтоб вписаться в линовку) сбои ритма. Это уже совсем не письмо от руки.</p><p>Особенно обратите внимание на то, как следует писать строчную к с двумя отрывами руки от бумаги и тремя разнонаправленными движениями.</p>", 1.0], ["img/03/03-034.jpg", "03-034", "<b>Воскресенская Прописи 1948, 2 класс</b><p>Щорс и Чапаев герои. Андрей в мавзолей. Ленин в третьей степени. Москва-Метро.</p>", 1.0], ["img/03/03-035.jpg", "03-035", "<b>Воскресенская Прописи 1948, 2 класс</b><p>Алфавит-48 почти без изменений, но перечерчен заново.<br>Буквы Ф (6 штук) и Д (3 штуки) — пример копипаста эпохи рекле.</p><p>Линовка второй краской слегка ушла вверх. Хотя старались.</p>", 1.0], ["img/03/03-036.jpg", "03-036", "<b>Воскресенская Прописи 1948, 2 класс</b><p>Финальный аккорд прописей.</p>", 1.0], ["img/03/03-037.jpg", "03-037", "<b>Воскресенская Прописи 1957, 3 класс</b><p>Опять книжка после отбеливания (а может переиздание?)</p><p>Соскучились по пионеру? Сличайте! Есть отличия.</p><p>Чертежный шрифт на месте. А вот что новое — это простые приемы каллиграфии. У Гербача и Флерова они шли до писания букв, просто для развития мелкой моторики.</p>", 1.0], ["img/03/03-038.jpg", "03-038", "<b>Воскресенская Прописи 1957, 3 класс</b><p>Каллиграфические упражнения на связность письма и переход от нажима к волосным линиям. Не такая уж простая физкультура, между прочим.</p><p>Ну, и как всегда читаем ложнобессмысленный набор слов.</p>", 1.0], ["img/03/03-039.jpg", "03-039", "<b>Воскресенская Прописи 1957, 3 класс</b><p>Упражнение на слитное письмо с заглавными.</p><p>Слова с корнем рос/рус — трижды.</p>", 1.0], ["img/03/03-040.jpg", "03-040", "<b>Воскресенская Прописи 1957, 3 класс</b><p>Великий полководец превратился в фабрику.<br>А я не хочу улетать, даже если я Исаковский.</p>", 1.0], ["img/03/03-041.jpg", "03-041", "<b>Воскресенская Прописи 1957, 3 класс</b><p>Простите. Эту страницу я выбрал из чистой ностальгии. В 1957 году мой папа, конструктор авиадвигателей, вернулся в Москву из добровольной поездки на четыре года в МТС (машинно-тракторную станцию) под городом Кашин. Счастье мамы было так велико, что почти немедленно родился впс. Поездка была вызвана некоторыми сложностями в написании папиной фамилии в начале 1950-х.</p>", 1.0], ["img/03/03-042.jpg", "03-042", "<b>Воскресенская Прописи 1957, 3 класс</b><p>Предпоследняя страница прописей. Жалко, я не взял похожий образец письма из 1915 года.<br>Заметим, что кто не стал фабрикой, тот обернулся городом.</p>", 1.0], ["img/03/03-043.jpg", "03-043", "<b>Воскресенская Прописи 1957, 3 класс</b><p>Самая последняя страница. Образец прописного объявления.</p><p>Кружок, вообще-то, добровольное объединение. Но есть нюанс.</p>", 1.0], ["img/03/03-044.jpg", "03-044", "<b>Воскресенская Прописи 1962, 1 класс</b><p>Сличаем пионеров (они опять стали октябрятами, но галстук сохранили).</p>", 1.0], ["img/03/03-045.jpg", "03-045", "<b>Воскресенская Прописи 1962, 1 класс</b><p>Напрасно я дал разворот — плохо видно алфавит. Но верьте на слово: наш чертежник не подвёл. Из новинок — исчезла бесхвостая з.<br>И стало больше копипаста.</p>", 1.0], ["img/03/03-046.jpg", "03-046", "<b>Воскресенская Прописи 1962, 1 класс</b><p>В учебном тексте стало чуть меньше пропаганды. Оттепель, господа.</p>", 1.0], ["img/03/03-047.jpg", "03-047", "<b>Н. Н. Боголюбов. Методика чистописания. 1955</b><p>Прошу прощения за отметки резкие ногтей на весьма серьезной и по-своему добросовестной книге.</p><p>Но увы — даже пропуская все ритуальные цитаты, мне хотелось спорить чуть не с каждой фразой.</p><p>Контекст: 1952-55 год. В книге упоминается Монтессори. Не то, чтоб т. Боголюбов (ха: в рифму к Воскресенской, разночинцы из поповичей) был глуп, непрофессионален или не любил свое дело. Он убежден, что учить писать (и чистописать) надо именно так.</p><p>При этом он вообще не думает об отношении человека к письму, о личном почерке, о читаемости и реальной скорости письма, об инструментах письма, о ситуациях, где современный ему взрослый человек пишет.</p>", 1.0], ["img/03/03-048.jpg", "03-048", "<b>Н. Н. Боголюбов. Методика чистописания. 1955</b><p>Вопль против противников линовки. Конечно, результаты работы Ю. И. Фаусек не показаны. Но Монтессори помянут.</p>", 1.0], ["img/03/03-049.jpg", "03-049", "<b>Н. Н. Боголюбов. Методика чистописания. 1955</b><p>Здесь опровергаются взгляды не только Монтессори, но и Флерова из 1915 года. Метод сводил учителя. Ай-яй-яй.</p><p>Генетический метод был заявлен еще Гербачом. Он состоит в последовательном изучении деталей букв. Не проверял, использовалось ли слово «генетический» между 1915 и 1955 годом, когда уже попустило.</p>", 1.0], ["img/03/03-050.jpg", "03-050", "<b>Н. Н. Боголюбов. Методика чистописания. 1955</b><p>Чистописание наехало на жизнь. И сказало: нельзя ж с тремя чертами, а т с одной ногой!<br>А еще в советской школе у букв простота начертаний (для сравнения см. прописи Флерова 1915 года).</p><p>Буквы под углом 65 градусов! (У Гербача было 62. Не есть ли это правый уклон?)</p>", 1.0], ["img/03/03-051.jpg", "03-051", "<b>Н. Н. Боголюбов. Методика чистописания. 1955</b><p>Наклон и нажим — вот наш девиз. Гербач, правда, считал прямое письмо более гигиеничным, но тут мы ему не верим. А что авторучкой хрен нажмешь (даже с открытым пером) — так сие не наша проблема.</p><p>Кстати, корявки в окне явно добавляют живости</p>", 1.0], ["img/03/03-052.jpg", "03-052", "<b>Н. Н. Боголюбов. Методика чистописания. 1955</b><p>Не может быть чище-опрятнее без нажима!<br>А еще, оказывается, пишут некоторые с левым наклоном!</p>", 1.0], ["img/03/03-053.jpg", "03-053", "<b>Н. Н. Боголюбов. Методика чистописания. 1955</b><p>Вот! Нашел и вырвал с корнем д хвостом вверх!<br>Советскому стилю также чужда намеренная кудреватость.</p>", 1.0], ["img/03/03-054.jpg", "03-054", "<b>Н. Н. Боголюбов. Методика чистописания. 1955</b><p>И вот она, наконец, в славе и силе — советская школьная парта-несдвигайка, детище проф. Ф. Ф. Эрисмана. Великий цельный блок, призванный упаковать школьника так, чтоб никакой сколиоз его не изогнул.</p>", 1.0], ["img/03/03-055.jpg", "03-055", "<b>Н. Н. Боголюбов. Методика чистописания. 1955</b><p>Парты, по идее, должны были подбираться по росту. Им бы как-то регулироваться, ведь подопытные растут — но нет. Отрицательная дистанция и яркий грохот крышки — вот мои воспоминания об этом объекте. Впрочем, у него все углы были круглые, в отличие от более поздних моделей</p>", 1.0], ["img/03/03-056.jpg", "03-056", "<b>Н. Н. Боголюбов. Методика чистописания. 1955</b><p>Всё те же приёмы. Всё та же вставка с пером номер один.</p>", 1.0], ["img/03/03-057.jpg", "03-057", "<b>Н. Н. Боголюбов. Методика чистописания. 1955</b><p>Всё, больше не мучаю. Просто посмотрите: слева правильный крючок, справа неправильные.</p><p>Автор правильного без экзамена зачисляется в адьютанты его превосходительства</p>", 1.0], ["img/03/03-058.jpg", "03-058", "<b>Тетрадь в линейку, Ростов-на-Дону. 1950</b><p>Кто-то женский, взрослый и нервный (мама? практикантка?) записывал открытый урок чтения</p>", 1.0], ["img/03/03-059.jpg", "03-059", "<b>Тетрадь в линейку, Ростов-на-Дону. 1950</b><p>Взрослый почерк 1950 года. Возможно, автор учился по прописям 1935 и не усвоил заглавную П (см. слово «План»).</p>", 1.0], ["img/03/03-060.jpg", "03-060", "<b>Тетрадь в линейку, Ростов-на-Дону. 1950</b><p>Не мог не поделиться колорадским жуком (смотрите цветной диафильм) на задней обложке тетрадки</p>", 1.0], ["img/03/03-061.jpg", "03-061", "<b>Тетрадь для работ по чистописанию ученицы 1 класса а школы № 5 Габитовой Гули. 1969</b><p>От Гули три картинки. На этой тетрадку надписала, видимо, мама. Авторучкой.</p>", 1.0], ["img/03/03-062.jpg", "03-062", "<b>Тетрадь для работ по чистописанию ученицы 1 класса а школы № 5 Габитовой Гули. 1969</b><p>А вот чистописала Гуля уже шариковой. И прописи, кажется, новые. Если вообще были.</p>", 1.0], ["img/03/03-063.jpg", "03-063", "<b>Тетрадь для работ по письму ученицы 1 класса а школы № 5 Габитовой Гули. 1969</b><p>Гуля пишет шариком диктант о художнике Шилове</p>", 1.0], ["img/03/03-064.jpg", "03-064", "<b>Тетрадь по письму уч-ка 2 в кл. средней шк. №14 г. Воложского Тунина Михаила. 1965</b><p>Модная тетрадка с косой рамочкой. Подписана (зуб даю) авторучкой с открытым пером.</p><p>Герман Титов, космонавт №2, был популярен почти как Гагарин</p>", 1.0], ["img/03/03-065.jpg", "03-065", "<b>Тетрадь по письму уч-ка 2 в кл. средней шк. №14 г. Воложского Тунина Михаила. 1965</b><p>Вот, наконец-то, нормальный ученический почерк задрюченного чистописанием моего почти ровесника. Старается парень, нажимает. До шариковых ручек в младших классах еще три года.</p>", 1.0], ["img/03/03-066.jpg", "03-066", "<b>Тетрадь по теоретической механике. МЭИ, пт-1-50, В. Охапкин. 1951</b><p>Под занавес слово студенту. Первый курс МЭИ, стандартная советская перовая ручка с жестким пером без нажима и толстым штрихом.</p><p>Разница между школьником и студентом — подпись печатными буквами (и даже капителью). Прощай, школа, умри, чистопись</p>", 1.0], ["img/03/03-067.jpg", "03-067", "<b>Тетрадь по теоретической механике. МЭИ, пт-1-50, В. Охапкин. 1951</b><p>По сравнению с довоенными почерками почти нет над- и подчеркиваний (кажется, просто вышли из моды), зато строчная т строго об одной ноге.</p><p>Буква Т в заголовке (Трение) вспомнила о каллиграфии, да тут же и позабыла.</p><p>Что хорошего в этом обычном почерке? Ритм и характер. Просто писал какой-то нормальный парень, довольно энергичный, без особенного выпендрёжа. Нужны ему были косые линейки? Не знаю.</p><p>Мне они не сильно помогли стать профессиональным типографом и даже чуть-чуть каллиграфом свободного стиля левой руки</p>", 1.0]], "research": {"task": "Найти пособия по обучению письму 1900–1990, распознать тексты прописей, сравнить методы обучения, показать, как менялась связь письма и политики.", "work": "Собрана база из 18 изданий — буквари, прописи, методички: распознавание, сжатие и нарезка PDF под лимиты загрузки, две недели «кормления» кастомного ассистента-«двойника». Найден и описан недокументированный лимит ChatGPT — 80 МБ на аккаунт. Глава подготовлена в двух регистрах: нейтральном аналитическом и в голосе автора.", "tools": "ChatGPT (кастомный проект, Deep Research), ChatPDF, Perplexity", "dates": "июнь — июль 2025"}}, {"intro": false, "num": "29", "title": "Глава о советских шрифтах и геноциде букв («Как превратить цветущий луг в картофельное поле»)", "ptitle": "Как превратить цветущий луг* в картофельное поле", "subtitle": "", "date": "26 августа 2025 г.", "perm": "https://www.facebook.com/story.php?story_fbid=24842304568710321&id=100000723643455", "slug": "shrifty", "html": "<p><span class=\"dc\">Э</span>та глава должна была быть серединой и сердцевиной моей книги. Собственно, мои занятия шрифтом — прямое следствие того, что в 1930-м по заданию советского правительства несколько умных, профессиональных, полных заботы о ближних людей отправили на переплавку примерно 95% от имевшихся тогда в наличии 1500 наборных шрифтов.</p>\n<p>По отношению к людям такое называется геноцидом. Но это же не люди — подумаешь, буковки! Ведь оставили самых лучших, крепких, удобочитаемых. Это просто селекция, правда ведь? Неправда.</p>\n<p>Типографика — точный слепок живой речи. Чем она богаче, разнообразнее, даже дурее — тем точнее передается смысл. Это касается любой буквенной коммуникации — от многотомной энциклопедии до вывески булошной.</p>\n<p>При этом надо помнить, что в обществе полной грамотности практически всё текстовое общение идет через наборный шрифт. Каллиграфия, рукопись, монументальные надписи — только край хрустящей корочки. А мякоть — набор.</p>\n<p>Переплавщики были полны энтузиазма — тем более, что предшествующий стиль модерн (арнуво) оставил тонны весьма странных букв. Сейчас отсечем лишнее, свернём головы канарейкам, избавимся от буржуазных сладостей — и на этом месте насадим новый сад, краше прежнего. Хрен они насадили.</p>\n<p>Они оставили самую буржуазную из всех антикв — Латинскую, переназвав ее Литературной, и горстку несовершенных гротесков, ни один из которых так и не смогли даже толком почистить.</p>\n<p>С гротесками особенно смешно. Казалось бы: что может быть современнее, технологичнее и пролетарскее, чем шрифт без засечек? Однако ссср так и не родил не то, что Гилл Санса, но даже Футуры с Гельветикой. А ведь было близко.</p>\n<p>Весь этот ужас и убожество случились по двум причинам: 1) огосударствление печати, 2) необходимость идеологической накачки при помощи печатного станка. Первый пункт убил типографию как услугу; второй способствовал укрупнению и упрощению производства.</p>\n<p>Самая читающая страна в мире читала одни и те же буквы на трамвайном билете, в газете, в сочинениях любимого вождя и проклятого поэта (когда его вдруг разрешили).</p>\n<p>Давайте еще раз отмахнёмся: подумаешь, буковки! Да мы их и не замечали )</p>\n<p>Конечно. А теперь не чуем шуршания однообразных тараканов в собственных головах.</p>\n<p class=\"aside\">Как всегда: смотрите подписи к картинкам! Фб не дает верстать по-человечески, поэтому половина смысла может кануть</p>\n<div class=\"orn\" role=\"separator\"><b></b></div>\n<p>Этот глав-пост (глава-пост) сопровождается двумя важными дополнениями.</p>\n<p>Первое: блестящая, на мой взгляд, статья чата gpt со сравнительным анализом процессов, происходивших в типографике ссср, США, Великобритании, Германии, Франции в начале-середине 20 века.</p>\n<p>Там же — ссылка на наше с Юлией Репринцевой исследование предмета при помощи ИИ, результатом которого стала эта статья. На мой взгляд, это лучший наш перфоманс. Налаживается технология, улучшается поиск, ИИ делает весьма разумные выводы.</p>\n<p>Второе: пдф каталога фирмы Бертгольд 1909 года. Просто смотрите и радуйтесь исчезнувшей и так до сих пор полностью не восстановленной культуре.</p>\n<p class=\"ps\"><span class=\"pslabel\">PS</span> Основной источник материалов для этой главы — статьи в журнале «Шрифт». Спасибо, Евгений Юкечев и Рустам Габбасов (Марк, где теги?!)! Само существование такого сильного профессионального издания свидетельствует о настоящем типографическом возрождении после советского провала и застоя.</p>", "figs": [["img/04/04-001.jpg", "04-001", "<p>Иллюстрации к этой главе начинаются с дореволюционного материала. Чтобы понять, чего мы лишились, надо вспомнить, что это было.</p><p>Рекламная брошюра «Художественного и писчебумажного магазина» В. Чекато. «КАРТИНЫ, ГРАВЮРЫ И ФОТОГРАФИИ». Москва. 1900.</p><p>Из коллекции «Отраслевого канцелярского музея»</p><p>Всё это набор.</p><p>12 шрифтов, наборные орнаменты, наборная рамка</p>", 1.0], ["img/04/04-002.jpg", "04-002", "<b>Почти все картинки отсняты с книг, стоящих рядком в моем шкафу.</b><p>Сначала полюбуемся на то, что до 1917 года называлось «роскошным изданием».</p><p>Ариост. «Неистовый Роланд». С-Пб, 1892. Титульный лист.<br>9 шрифтов (ах, какая безвкусица и эклектика!), наборный орнамент, гравированная иллюстрация.</p>", 1.0], ["img/04/04-003.jpg", "04-003", "<p>Тот же Ариост 1892, уголок наборной рамки</p>", 1.0], ["img/04/04-004.jpg", "04-004", "<p>Ариост 1892, спусковая полоса. Наборный орнамент, заглавие другим шрифтом, наборный инициал (запомните). Всё это — набор, работа метранпажа.</p>", 1.0], ["img/04/04-005.jpg", "04-005", "<p>Ариост 1892, выходные данные. Частная, заметим, типография. Хорошая, но далеко не единственная. На качество набора и бумаги вы, наверное, уже обратили внимание</p>", 1.0], ["img/04/04-006.jpg", "04-006", "<p>Ариост 1892, разворот с иллюстрацией на своей бумаге.</p>", 1.0], ["img/04/04-007.jpg", "04-007", "<p>Ариост 1892, набор. Видимо, это Обыкновенный узкий шрифт Бертгольда, судя по характерной строчной букве у.</p>", 1.0], ["img/04/04-008.jpg", "04-008", "<b>Рядом на полке стоит роскошное советское издание эпохи развитого социализма.</b><p>Бокаччо. Декамерон. Гос. издательство худ. литературы. М, 1955.</p><p>Спусковая полоса.</p><p>Гарнитура Академическая (одна из помилованных дореволюционных).</p><p>Иллюстрация — продольная гравюра из итальянской, скорее всего, инкунабулы (простите, не полез искать, откуда). Перерисовка сделана аккуратно, но при этом никто не подумал, что исходная фотография (цельнотянутая?) была с искажением за счет изгиба страницы оригинала.</p><p>Буквица рисованная — наборные инициалы кончились.</p>", 1.0], ["img/04/04-009.jpg", "04-009", "<b>Вазари. Жизнеописания. М, Терра, 1993</b><p>Гарнитура Академическая</p><p>Спусковая полоса. Это уже компьютерный набор, но Академическая на месте. Почему? А нечем больше изобразить Возрождение.</p><p>Буквицу, скорее всего, нарисовали. Инициалов в компьютере в 1993 году еще не водилось, а интернет еще только начинался.</p>", 1.0], ["img/04/04-010.jpg", "04-010", "<b>Наконец, моя самая любимая книга.</b><p>Томас Мэлори. Смерть Артура. М, Наука, серия «Литпамятники». 1993</p><p>Гарнитура Академическая.</p><p>Заставки — Бердслей.</p><p>Набор имитирует издания Уильяма Морриса. Вот здесь Академическая точно попадает в стиль эпохи. Не английского возрождения, а британского модерна.</p>", 1.0], ["img/04/04-011.jpg", "04-011", "<b>Томас Мэлори. Смерть Артура. М, Наука, серия «Литпамятники». 1993</b><p>Гарнитура Академическая.</p><p>На мой взгляд, очень красиво.<br>Но до первоисточника не дотягивает</p>", 1.0], ["img/04/04-012.jpg", "04-012", "<b>С небес роскошных изданий на советские грядки.</b><p>Тетрадь, задняя обложка, 1950</p><p>Гарнитуры Литературная, Жирный гротеск, узкий рубленый (но какой?)</p><p>Эта картинка должна была быть дальше, но лень перекидывать. Показываю из-за Литературной гарнитуры, столь же частой на советских страницах, как колорадский жук на колхозных полях</p>", 1.0], ["img/04/04-013.jpg", "04-013", "<b>Ведомость оценки знаний. Г. Жуковский, 1966</b><p>Заголовок набран гарнитурой Пальмира (!) Это большая редкость в советской типографике. По названию шрифта понятно, что он был создан до исторического материализма.</p><p>Буквенная мелочь под линейками — разумеется, Литературная</p>", 1.0], ["img/04/04-014.jpg", "04-014", "<b>Отсюда начинается рассказ о главном советском шрифте.</b><p>Латинский. Гарнитура 27. Компания Бертгольд, каталог 1909 года.</p><p>Латинский шрифт (разумеется, переводной с немецкого оригинала) был одним из первых в России комплексно созданных шрифтовых семейств. Он включал большой диапазон кеглей — от мелкого до заголовочных — и разнообразные варианты начертаний: светлое, полужирное, узкое, расширенное. Для своего времени — выдающееся решение. Гарнитура позиционировалась как модная, элегантная и несколько подчеркнуто буржуазная.</p>", 1.0], ["img/04/04-015.jpg", "04-015", "<b>Латинский. Бертгольд, 1909. Словолитня и фабрика медных линеек. Берлин, С-Пб, Москва</b><p>Из пана не бывает хама?</p>", 1.0], ["img/04/04-016.jpg", "04-016", "<b>Латинский. Бертгольд, 1909</b><p>Полужирный курсив. Обращаем внимание на разброс по кеглям. Системная работа</p>", 1.0], ["img/04/04-017.jpg", "04-017", "<p>Латинский. Бертгольд, 1909. Узкий полужирный</p>", 1.0], ["img/04/04-018.jpg", "04-018", "<b>Латинская гарнитура из немецкого каталога фирмы Бертгольд. 1912.</b><p>Из немецкого каталога. Скорее всего, роман «Даръ» в 1938 году был набран в Берлине этим шрифтом. Почему-то не переплавленным</p>", 1.0], ["img/04/04-019.jpg", "04-019", "<b>А вот и конкуренты.</b><p>Светлый Рената, каталог Лемана, 1902</p><p>Русский немец Леман бьётся за отечественный рынок с немецким немцем Бертгольдом. Латинский и Рената вышли почти одновременно. Кто у кого что скрал — или никто не скрал — неизвестно. Но нишу модного наборного шрифта они делили.</p>", 1.0], ["img/04/04-020.jpg", "04-020", "<b>Полужирный Рената, каталог Лемана, 1902.</b><p>Если кто видел мой Эльзенскок (зайдите в тг), там пародийно обыгрываю эти латинско-ренатские Кк</p>", 1.0], ["img/04/04-021.jpg", "04-021", "<b>Газета «Правда», 26.01.1934</b><p>Лозунг курсивом справа вверху и заголовок внизу — Литературная гарнитура</p><p>С’езд — следствие дефицита твёрдых знаков, пущенных в распыл после введения новой орфографии. Но расширенное начертание сохранилось</p>", 1.0], ["img/04/04-022.jpg", "04-022", "<b>О. Мандельштам Стихотворения. Советский писатель, Ленинградское отделение, 1978</b><p>Гарнитура Литературная</p><p>(«На полицейской бумаге верже — ночь наглоталась колючих ершей —<br>Звёзды живут — канцелярские птички,<br>Пишут и пишут свои рапортички») (цит. по памяти)</p>", 1.0], ["img/04/04-023.jpg", "04-023", "<b>Эккерман. Разговоры с Гёте… Ереван, Айастан, 1988 (Макулатурное издание)</b><p>Гарнитура Литературная</p>", 1.0], ["img/04/04-024.jpg", "04-024", "<b>Фрагмент карты-романа «Кириллица в пространстве и времени» из павильона «Слово» на вднх.</b><p>Трамвайный билет тюменского гортранспорта. Гарнитура Литературная.</p><p>Когда я говорю, что буквы Литературной встречались в ссср так же часто, как тараканы на коммунальных кухнях, я не шучу</p>", 1.0], ["img/04/04-025.jpg", "04-025", "<b>Литературная гарнитура, каталог 1966 года<br>М., Книга.</b><p>Этот каталог содержал все доступные на тот момент в металлическом наборе шрифты. Литературная занимала в нем главное место</p>", 1.0], ["img/04/04-026.jpg", "04-026", "<b>Литературная гарнитура, полужирное узкое начертание. Каталог 1966 года<br>М., Книга.</b><p>Именно с этого скана была выпилена моя гарнитура ПалеоЛит</p>", 1.0], ["img/04/04-027.jpg", "04-027", "<b>Каталог ручных и машинных шрифтов. М., Книга, 1966</b><p>Вот и весь ассортимент советского набора на сорок девятом году от начала новой эры</p>", 1.0]], "research": {"task": "Найти публикации о шрифтах, составить каталоги по десятилетиям, выяснить, какие шрифты использовались чаще, найти государственные меры по их отбору — список оставленного и отброшенного.", "work": "Perplexity собрал источники; по ним в проекте для промптов составлен бриф для Deep Research; ChatGPT провёл сравнение стандартизации шрифтов в СССР, США, Британии, Франции и Германии до 1953 года. Найдены ОСТ 1337 и ГОСТ 3489, циркуляр Бормана 1941 года о запрете фрактуры.", "tools": "Perplexity, ChatGPT Deep Research (o3)", "dates": "июль — август 2025"}}, {"intro": false, "num": "30", "title": "Глава о буквах московского метро («Буквы подземного космодрома»)", "ptitle": "Буквы подземного космодрома", "subtitle": "или От Сокольников до Парка на метро", "date": "9 сентября 2025 г.", "perm": "https://www.facebook.com/story.php?story_fbid=24961957913411652&id=100000723643455", "slug": "metro", "html": "<p><span class=\"dc\">П</span>о Москве двадцатых ходили пешком. Пять километров — я сам их промерил ногами — это диаметр Садового кольца. Извозчик был хорошим ускорением. Трамвай решал транспортную проблему. Автобусы только появились. Такси — было и такси, но оставалось некой экзотикой почти до времён «Бриллиантовой руки». Частные авто встречались только у очень специальных граждан.</p>\n<p>Москва начала тридцатых была небольшим постсредневековым городом, в основном сосредоточенным в двух кольцах бывших стен: Бульварном и Садовом, и только-только доросшим окраинами до третьего оборонительного кольца — валов и застав.</p>\n<p>Москва, где долго не было своего барона Османа, аж до середины пятидесятых оставалась городом дворов и переулков (вспомним Окуджаву). Да, проспекты прокладывали, но они начинались за Садовым. Как ни ломали большевики Москву, единственной тотальной просекой в старом городе стал хрущёвский Гавана-стрит: Калининский Новый Арбат.</p>\n<p>Это с одной стороны. С другой — «квартирный вопрос испортил их»: советская Москва сразу после волшебного переноса столицы начала стремительно пухнуть от служивого люда бесконечных наркоматов и трестов, а поверх ее накрыло индустриализацией: со всех сторон задымили огромные американские заводы.</p>\n<p>В советской Москве можно было ломать что угодно. До Петра она была деревянной и горела раз в пять лет. После 1703 года муж её бросил и сбежал на Северо-Запад к новой столице. Живучая Москва вывернулась и стала барской, с садами-усадьбами. Но тут пришел Наполеон. Пожар с погромом — начинай сначала.</p>\n<p>Большевикам Москва досталась бойким купеческим городом, в два раза меньшим, чем Питер, но свежезастроенным особняками и доходными домами в стиле модерн. Два этажа были нормой. Пять — громадой. Редкие тучерезы достигали девятиэтажного небоскрёбства.</p>\n<p>И вот в этом отнюдь не мегаполисе внезапно завёлся спейс-шатл.</p>\n<p>Метро не было московской сиюминутной необходимостью. Скорее — утопией навырост. Впрочем, вики пишет, что толчком к осуществлению гигантского проекта был ужас, испытанный т. Кагановичем при транспортном коллапсе в Москве 6 января 1931 года.</p>\n<div class=\"orn\" role=\"separator\"><b></b></div>\n<p>Эта длинная гиперболическая подводка нужна была только для того, чтоб стало понятно, почему на первой линии метро такие буквы.</p>\n<p>Начнем снаружи. К 1935 году конструктивизм уже почти проиграл «сталинскому ардеко», или «постконструктивизму» — новому дорогому имперскому стилю, еще не обросшему лепниной, но уже украшенному мрамором, сталью, гранитом и туфом.</p>\n<p>При этом вестибюли первых станций (см. фото) были еще довольно смелыми и почти конструктивистскими. А надписи «МЕТРО» на них — во-первых, метровыми (а то и больше), а во-вторых — палочными, то есть еще более авангардными, чем архитектура.</p>\n<p>Что любопытно: изначально снаружи не было названий станций. Просто: «метро» — и всё. Как думаете, почему?</p>\n<p>Новое средство передвижения с самого начала прокламировалось не как коммунальная услуга, а как модный аттракцион. Такими буквами хорошо читать «ЦИРК» или даже «диснейленд». Неудивительно, что на первое представление порталов выстроились огромные очереди (см. фото).</p>\n<p>Однако, у вестибюлей метро были и другие коннотации. Также как первые вокзалы, входы в метро косили под храмы и гробницы. Только не христианские, а языческие — египетские и античные (см. фото). Со временем это сходство только усилилось.</p>\n<p>Снаружи первых вестибюлей при открытии образцового транспорта
