<script>
const DATA = [{"intro": true, "num": "—", "title": "Вместо вступления (введение к книге)", "ptitle": "Вместо вступления", "subtitle": "", "date": "22 сентября 2026 г.", "perm": "https://www.facebook.com/yuri.gordon/posts/pfbid02txWajZ2Dn6Ags5oh29WiCJGsmP6hPiQiVBjfQkaRQ1g974AFjPHWKtx6s645pwYol", "slug": "", "html": "<p><span class=\"dc\">Е</span>сть одна важная для автора этой книги позиция. Я — художник.</p>\n<p>Не ученый, не документалист, не искусствовед. Позиция, которая многое позволяет. Ученый обязан сомневаться и обнародовать только подтвержденное. Документалист должен, по возможности, собирать и публиковать все доступные факты. Искусствовед не имеет права быть необъективным — он аналитик, а не зоил.</p>\n<p>Художник волен во всём. Затем, что ветру, и орлу, и сердцу девы нет закона. У человека, занимающегося искусством, есть только одна обязанность — свобода суждения*. Он имеет полное право хвалить и ругать, любить и ненавидеть. Он может и должен ошибаться — а вот раскаиваться в ошибках не обязан, потому что часто ошибки — лучшее из сделанного художником.</p>\n<p>Эта книга — попытка выявить и воссоздать, глядя через буквы — художественную реальность прошлого века. Не обязательно равную настоящей, далеко не всегда объективную, но делающую видимым то, что может быть упущено при объективном анализе.</p>\n<p>Например, я пишу о полном провале советской типографики. Это в «самой читающей стране мира». Но полиграфкомбинаты работали! Но тиражи исправно выходили! И букв на все хватало! Какой провал?!</p>\n<p>Однако мне достаточно сравнить два каталога — компании Бертгольд, 1903 года, и советский, издательства «Книга», 1966 года — чтобы написать даже не о провале, а о геноциде шрифтового наследия, даром доставшегося большевикам после их прихода к власти.</p>\n<p>Пожалуй, это и есть мой метод: не пытаться учесть всё, но найти точку силы или болевой узел. А ещё посмотреть оттуда, откуда никто не ждет. Пока пишу, выяснил, что через буквы видно многое, что с других сторон прикрыто толстым слоем идеологии и не менее толстой корой привычки.</p>\n<p>Часто поймать фокус удается через деталь, как бы высвеченную острым лучом карманного фонаря.</p>\n<p>Как показать, что до национализации типографий в России было больше шрифтов, чем в могучем ссср?</p>\n<p>Пересчитать их на одном провинциальном плакате 1913 года и выяснить, что в официальном каталоге всей отрасли 1966 года стало меньше.</p>\n<p>Как продемонстрировать роль рекламы в обычной жизни в начале прошлого века?</p>\n<p>Показать фото большой улицы, где рекламные конструкции полностью меняют форму домов.</p>\n<p>Как поймать большевиков на ухарских непродуманных реформах?</p>\n<p>Найти на первой полосе «Правды» в главном слове «с’езд» выбитый зуб — сдуру переплавленный твёрдый знак, который так и не вернули в шрифт спустя 16 лет после орфографической реформы.</p>\n<p>Всё это не научные приёмы, но метафоры. (Кстати, картинки можно найти в подборках к соответствующим главам).</p>\n<p>Здесь нет претензий на объективность исследования, но есть стремление к художественной цельности рассказа. Зачем? Потому что я так вижу — и считаю необходимым поделиться с читателями этим видением. Иногда острый рисунок точнее описывает реальность, чем чертеж в трех проекциях.</p>\n<p>Ну, а если случится промах — не беда. Придут исследователи и всё разложат по полочкам. Но, как я не раз убеждался — они могут и не прийти, если не подсветишь то, что почему-то считается неважным. Бывает, что роль провокатора — положительная.</p>\n<p>Кстати, знаете, почему главным шрифтом советской типографики стала Латинская гарнитура — успешный коммерческий проект немецкой фирмы?</p>\n<p>Потому, что кремлевские мечтатели ничего не могли толком спланировать (в случае с буквами это очевидно), а по-настоящему новых форм боялись как огня. Ибо во всем, кроме продразверстки, они были трогательно буржуазны. Вот и выбрали самый бюргерский шрифт из всех доступных.</p>\n<p>Книга еще не закончена, но, как сказал цитировавшийся выше автор: хоть поздно, а вступленье есть.</p>\n<div class=\"orn\" role=\"separator\"><b></b></div>\n<p>*подразумевающая личную ответственность за сказанное и сделанное. Художник прежде всего профессионал, ремесленник, его подпись дорого стоит.</p>", "figs": [["img/00/20-001.jpg", "20-001", "<b>Тулуз-Лотрек, «Жокей», 1899</b><p>На этой картинке — первое в мире применение камеры Go pro, до изобретения которой оставалось больше ста лет.</p><p>Гениальный калека изобрел спортивную телеперспективу, а заодно и новый способ переживания состязаний — от первого лица. Для этого пришлось сломать форму, исказить пространство, черти что проделать с силуэтами.</p><p>Это как раз тот случай, когда острый рисунок передает то, чего не передать никак иначе.</p><p>Если мне в книжке удастся хоть раз попасть в десятую долю такой точности — значит, не зря взялся.</p>", 1.0], ["img/00/20-002.jpg", "20-002", "<b>Два примера из главы с прописями.</b><p>Демонстрация метода подачи материала.</p><p>Не все добрые читатели, одарившие главу про прописи 700++ лайками, уловили моё сардоническое отношение к этой форме обучения письму.</p><p>Некоторые даже немного обиделись на «шипи курсиво и грамощно», но почему-то пропустили то, что именно мыла мама, не говоря уж об аллитерации в примере о мальчике и Марсе</p>", 1.0]], "research": null}, {"intro": false, "num": "1", "title": "О мелкой типографике (1900–1917)", "ptitle": "О мелкой типографике (1900–1917)", "subtitle": "", "date": "12 июля 2022", "perm": "https://www.facebook.com/story.php", "slug": "", "html": "<p><span class=\"dc\">Ч</span>то мы, выпускники советской школы, знаем о печати в Российской империи? Слово «цензура». А надо бы знать слово «услуга».</p>\n<p>До победы большевиков типографии были местом, куда может прийти любой человек, имеющий достаточно денег, чтобы оплатить работу наборщиков и метранпажей, печать и тираж. В советское время типография была наглухо отрезана от частных лиц.</p>\n<p>Отсутствие у граждан возможности обмениваться разными запечатанными бумажками вырезало целый пласт культуры, причем даже трудно сказать, насколько важный и глубокий. В сущности, это часть культуры общения. Слышали слово «атомизация»? Это про него.</p>\n<p>Приглашение на свадьбу, бланк конторы, рекламная брошюра, похвальный лист или свидетельство об окончании школы, да просто счет или чек — все эти мелочи печатались аккуратно и с уважением к заказчику — и к потребителю.</p>\n<p>Например, вариантов похвальных листов было огромное множество. Видимо, типографии предлагали шаблоны на выбор, впечатывая только «реквизиты заказчика». Но сегодня, рассматривая такой документ от церковно-приходской школы, чувствуешь щемящую досаду: ну и куда оно всё ухнуло?</p>\n<p>Кстати, советские документы, начиная с паспортов, есть всё ухудшающиеся со временем копии дореволюционных.</p>\n<p>К чему это я? Выгребая из почтового ящика на выброс кучу макулатуры, сколько листочков вы пожалели за их нетленную красоту?</p>\n<p>А всё потому, что около ста лет назад услуги типографов стали частью госполитики.</p>\n<p>(Проект «Буквы 20 века»)</p>", "figs": [["img/r01/r01-001.jpg", "r01-001", "<p>Приглашение на свадьбу. 1900</p>", 1.0], ["img/r01/r01-002.jpg", "r01-002", "<p>Приглашение на бал графу Шереметеву</p>", 1.0], ["img/r01/r01-003.jpg", "r01-003", "<p>Похвальный лист «министерского» начального училища. 1908</p>", 1.0], ["img/r01/r01-004.jpg", "r01-004", "<p>Свидетельство об окончании церковно-приходской школы. 1900</p>", 1.0], ["img/r01/r01-005.jpg", "r01-005", "<p>Брошюра «мастера-самоучки». 1900</p>", 1.0], ["img/r01/r01-006.jpg", "r01-006", "<p>Чек. 1972</p>", 1.0], ["img/r01/r01-007.jpg", "r01-007", "<p>Счет от В. Я. Агафонова. 1887</p>", 1.0], ["img/r01/r01-008.jpg", "r01-008", "<p>Бланк мельничной компании. 1915</p>", 1.0], ["img/r01/r01-009.jpg", "r01-009", "<p>Деловое письмо на бланке. 1912</p>", 1.0], ["img/r01/r01-010.jpg", "r01-010", "<p>Похвальный лист. 1896</p>", 1.0], ["img/r01/r01-011.jpg", "r01-011", "<p>Вкладыш с оценками в похвальный лист. 1896</p>", 1.0], ["img/r01/r01-012.jpg", "r01-012", "<p>Вклейной талон в загранпаспорт. 1892</p>", 1.0], ["img/r01/r01-013.jpg", "r01-013", "<p>Адрес-календарь и памятная (записная) книжка. 1900</p>", 1.0]], "research": null}, {"intro": false, "num": "2", "title": "О газетах (1900–1917)", "ptitle": "О газетах (1900–1917)", "subtitle": "", "date": "17 июля 2022", "perm": "https://www.facebook.com/story.php", "slug": "", "html": "<p><span class=\"dc\">П</span>родолжаю рассказ о буквах 20 века. Сегодня ищу собеседников по поводу газет начала прошлого века.</p>\n<p>Газеты в Российской империи шагали точно в ногу с прогрессом, а именно: чем стремительнее раскручивалась промышленная революция, тем больше становилось периодических изданий.</p>\n<p>Правда, царский режим время от времени перекрывал кислород, но как только давал обществу глотнуть воздуха — количество газет и тиражи взлетали мгновенно.</p>\n<p>Когда-то давным-давно, еще при недодохшем ссср, я делал книжку про что-то революционное. И получил для ознакомления огромную пачку сатирических газет 1906 года. Десятки названий. Все эти печатные мотыльки вспорхнули сразу после дарования конституции — и были прихлопнуты буквально два года спустя.</p>\n<p>Но прогресс не остановишь. В начале 20 века в РИ было полторы тысячи газет. В 1917 году — 16000, в десять раз больше.</p>\n<p>Что представлял из себя «бумажный телевизор»?</p>\n<p>Формат. Чем больше размер — тем круче газета. Самые крупные и многотиражные достигали в развороте метра с лишним.</p>\n<p>Макет. «Наборный». Того, что мы называем сейчас дизайном, практически нет. Полоса новостной газеты похожа на ящик старинного секретера с отделениями побольше и поменьше. Или на наборную кассу. Ее явно составлял метранпаж, а не приглашенный оформитель. Пространство газеты дорого, в него стараются набить как можно больше тестов и объявлений. Дизайн и красота появляются только в иллюстрированных изданиях — например, в сатирических.</p>\n<p>Интересно считать колонки — их может быть сколько угодно, от трех до восьми. Часты макеты с пятью или семью колонками.</p>\n<p>Логотип. Наборный или рисованный (клише). Встречаются и те, и другие, примерно в равных количествах. У всех коммерчески успешных газет логотипы небольшие: место дорого. А вот у «боевых листков» разных партий логотипы как правило крупные и набраны самыми модными шрифтами.</p>\n<p>Шапка (блок вокруг логотипа). Похожа на современные: сложный набор со всей необходимой информацией. Тоже видна рука метранпажей. В редких случаях шапка содержит элементы дизайна в нашем понимании.</p>\n<p>Набор. На скверных сканах не всегда можно понять, что за шрифт, но как правило это узкий вариант чего-то вроде Новой гарнитуры. Интерлиньяж тесный. Межколонники узкие или еще уже. Часто в межколонник вбита тонкая вертикальная линейка. В целом: трамвай в час пик. Заголовки мелкие. Стандартная внутренняя полоса — простыня со сплошным текстом.</p>\n<p>Реклама. Чем успешнее газета — тем больше рекламных кубиков. Причем не только на последней, но и на первой полосе. Не знаю точно, как это воспринимала продвинутая публика, но думаю, что «глотатели пустот» выкрикнулось неспроста. Рекламные блоки сверстаны тонко и даже изысканно. Именно в классифайде метранпаж мог продемонстрировать максимум ремесленной доблести. Количество используемых в рекламе шрифтов зашкаливает. Там же встречаются иллюстрации. В партийных газетах рекламы нет.</p>\n<p>Иллюстрации в ежедневных газетах практически отсутствуют. Они появляются в вечерних выпусках. Газеты черно-белые, вторая краска появляется в иллюстрированных изданиях.</p>\n<p>Я не нырял в архивы с головой, копнул буквально на пол-штыка. А для примеров выбрал номера газет, вышедшие сразу после отречения Николая II (2 марта 1917). И тут меня ждал психологический сюрприз.</p>\n<p>Все газеты, от леволиберальных через буржуазные до беспартийных, приветствовали «конец старого мира». К сожалению, не нашел ярых монархистов и черносотенцев, но видно, что государь император достал большую часть российского общества хуже горькой редьки.</p>\n<p>И тут вдруг из глубины моей антикоммунистической личности выпрыгнул ученик восьмого класса советской школы и удивился: ну надо же! Радуются мятежу?!</p>\n<p>Оказывается, где-то там, на донышке, сидела вбитая учебниками идея, что чистая публика не должна радоваться революциям, хотя бы и буржуазным. Что они «для народа». Нынешний я тоже удивился, улыбнулся — и прошло. Но осадочек о том, как прочно можно вдолбить в детскую голову школьный бред — остался.</p>\n<p>Проект Буквы 20 века.</p>\n<p>Иллюстрации и описания газет взяты из онлайн-коллекции Государственной публичной исторической библиотеки. Ссылка в комментарии.</p>", "figs": [["img/r02/r02-001.jpg", "r02-001", "<p>«Речь». 5 марта 1917. Газета издавалась ежедневно с 8 марта 1906 по 1917 гг. в Санкт-Петербурге. Пользовалась огромной популярностью и уважением в либерально-демократической среде. Лидер партии кадетов П.Н. Милюков был одним из редакторов газеты и автором большинства ее передовых статей, его соредактором был член ЦК партии кадетов И.В. Гессен.</p><p>Образцовая популярная либеральная газета. 4 полосы, 7 колонок. Обычно в номере было полно рекламы, в тч на первой полосе. Газета закрыта большевиками.</p>", 1.0], ["img/r02/r02-002.jpg", "r02-002", "<p>«Речь». 5 марта 1917. С. 2</p>", 1.0], ["img/r02/r02-003.jpg", "r02-003", "<p>«Речь». 5 марта 1917. С. 3</p>", 1.0], ["img/r02/r02-004.jpg", "r02-004", "<p>«Речь». 5 марта 1917. С. 4</p>", 1.0], ["img/r02/r02-005.jpg", "r02-005", "<p>«Московский листок». 3 марта 1917. Ежедневная газета, выходившая в 1881-1918 годах; одно из первых в России изданий, ориентированных на массовую аудиторию.</p><p>Закрыта большевиками.</p>", 1.0], ["img/r02/r02-006.jpg", "r02-006", "<p>«Московский листок». 3 марта 1917. С. 2</p>", 1.0], ["img/r02/r02-007.jpg", "r02-007", "<p>«Московский листок». 3 марта 1917. С. 3</p>", 1.0], ["img/r02/r02-008.jpg", "r02-008", "<p>«Московский листок». 3 марта 1917. С. 4</p>", 1.0], ["img/r02/r02-009.jpg", "r02-009", "<p>«Вечернее время» 6 марта 1917 г. Ежедневная вечерняя газета. Газета была основана 26 ноября 1911 года А.С. Сувориным. «Вечернее время» придерживалось умеренно правых политических позиций, близких к октябристам.</p><p>Редкий случай: блок фотографий.</p>", 1.0], ["img/r02/r02-010.jpg", "r02-010", "<p>«Вечернее время» 6 марта 1917 г. С. 2</p>", 1.0], ["img/r02/r02-011.jpg", "r02-011", "<p>«Вечернее время» 6 марта 1917 г. С. 3</p>", 1.0], ["img/r02/r02-012.jpg", "r02-012", "<p>«Вечернее время» 6 марта 1917 г. С. 4</p>", 1.0], ["img/r02/r02-013.jpg", "r02-013", "<p>«Забайкальская новь» 18 июня 1917. Ежедневная беспартийная газета. Издавалась в Чите с 3 мая 1907 г. по 1918 г.</p><p>Плашка «да здравствует…» висела чуть ли не полгода</p>", 1.0], ["img/r02/r02-014.jpg", "r02-014", "<p>«Забайкальская новь» 18 июня 1917. С. 2</p>", 1.0], ["img/r02/r02-015.jpg", "r02-015", "<p>«Забайкальская новь» 18 июня 1917. С. 3</p>", 1.0], ["img/r02/r02-016.jpg", "r02-016", "<p>«Забайкальская новь» 18 июня 1917. С. 4</p>", 1.0], ["img/r02/r02-017.jpg", "r02-017", "<b>«Социал-демократ» 7 марта 1917. Орган Московского бюро РСДРП.</b><p>Боевой листок в четыре колонки.</p>", 1.0], ["img/r02/r02-018.jpg", "r02-018", "<p>«Русские ведомости», 2 марта 1917. Газета, издаваемая в Москве с 3 сентября 1863 г., одна из крупнейших российских газет. С 1870-х гг. орган либеральной интеллигенции. Последний владелец — А. С. Суворин</p><p>Газета закрыта большевиками.</p>", 1.0], ["img/r02/r02-019.jpg", "r02-019", "<p>«Русские ведомости», 2 марта 1917. С. 2</p>", 1.0], ["img/r02/r02-020.jpg", "r02-020", "<p>«Русские ведомости», 2 марта 1917. С. 3</p>", 1.0], ["img/r02/r02-021.jpg", "r02-021", "<b>«Русские ведомости», 2 марта 1917. С. 4.</b><p>Редчайший случай: полполосы не запечатано</p>", 1.0], ["img/r02/r02-022.jpg", "r02-022", "<p>«Русское слово». 5 июля 1915 г. С. 2 (из восьми)</p>", 1.0], ["img/r02/r02-023.jpg", "r02-023", "<p>«Русское слово». Обычный номер: 5 июля 1915 г.<br>Была самой дешевой газетой среди ежедневных изданий — сначала 4 рубля в год (без доставки), затем — 7 рублей. По своему политическому направлению «Русское слово» под редакторством Дорошевича имело прогрессивную ориентацию, поддерживая кадетов и более левые политические силы.</p><p>Восемь колонок. Показываю 4 полосы из 8<br>Закрыта большевиками</p>", 1.0], ["img/r02/r02-024.jpg", "r02-024", "<p>«Русское слово». 5 июля 1915 г. С. 8 (из восьми)</p>", 1.0], ["img/r02/r02-025.jpg", "r02-025", "<p>«Русское слово». 5 июля 1915 г. С. 7 (из восьми)</p>", 1.0], ["img/r02/r02-026.jpg", "r02-026", "<p>«Вихрь» №3 1906. Еженедельная сатирическая газета.</p>", 1.0], ["img/r02/r02-027.jpg", "r02-027", "<p>«Вихрь» №3 1906. С. 2</p>", 1.0], ["img/r02/r02-028.jpg", "r02-028", "<p>«Вихрь» №3 1906. С. 3</p>", 1.0], ["img/r02/r02-029.jpg", "r02-029", "<p>«Вихрь» №3 1906. С. 4</p>", 1.0]], "research": null}, {"intro": false, "num": "3", "title": "Синодальная типография и «славянские» шрифты в 1901 году", "ptitle": "Синодальная типография и «славянские» шрифты в 1901 году", "subtitle": "", "date": "18 июля 2022", "perm": "https://www.facebook.com/story.php", "slug": "", "html": "<p><span class=\"dc\">А</span>пдейт: и немного славянских шрифтов от словолитни Гербека — для сравнения.</p>\n<p>Сегодня я рискну сунуться в область, где мало что понимаю и чем, признаться, не слишком интересовался раньше: жизнь допетровской кириллицы перед концом Российской империи.</p>\n<p>Постов будет два — не потому, что тема необъятная (не больше прочих), а просто вчера начал с каталога Синодальной типографии — и придумался цельный текст.</p>\n<p>Итак, аб ово: РИ была православным государством. Не теократией, где требуется верить, а бюрократией, где подданный должен креститься во всех смыслах этого слова. Желательно, на каждую церковь.</p>\n<p>При этом церковь (как институция) была встроена в госструктуру и подчинялась министерству религии — Святейшему Правительствующему Синоду. Командовал этим ведомством чиновник с очень характерным титулом: Обер-прокурор. Согласитесь, в этой титулатуре куда больше прусской муштры, чем русской веры. Об этом стоит помнить, рассуждая о «старостильных» буквах.</p>\n<p>Синодальные типографии в Москве и Питере учредил Пётр. То есть сначала открыл типографии, а потом приписал их к свежеучрежденному Синоду. За всю историю этих предприятий только раз ими заведовал церковный чин. И развалил бизнес.</p>\n<p>К началу 20 века питерская типография печатала в основном «гражданскими и иностранными» шрифтами, а московская — «славянскими». Славянскими буквами набирали богослужебные книги и учебники Закона Божьего для всех школ, в первую очередь — церковно-приходских.</p>\n<p>Закон Божий, кстати, стоял первым номером во всех учебных планах всех российских школ (кроме иноверческих). Но преподавался, судя по всему, по шкале от «спустя рукава» до «из рук вон». Количество часов на священные дисциплины постоянно уменьшалось.</p>\n<p>Синодальная типография в Питере (у меня есть скан ее каталога) была вполне неплохо оборудована. В описании фигурируют «две ротационных машины и американка». Что такое «американка», точно не знаю, но уверен — это современный печатный станок производства США.</p>\n<p>При этом все славянские шрифты набирались только вручную. В описании типографии есть длинный пассаж о том, чем они отличались от гражданских с иностранными и какие усилия надо было прикладывать, чтобы набирать то и другое в одну строку.</p>\n<p>Заметим: даже в главной типографии православного государства не было современных способов напечатать православную литературу православными буквами.</p>\n<p>Что же преставляли из себя церковные наборные шрифты в 1901 году?</p>\n<p>Судя по всему, их проектировали и отливали в словолитном отделении типографии. Диапазон текстовых кеглей — от 8 до 32.</p>\n<p>Названия шрифтов говорят, видимо, о происхождении рисунка (но может быть, и о месте разработки): Ординарно-библейский, Ново-киевский, Воскресенский, Киево-воскресенский, Осиповский, Арсеньевский, Евангельский…</p>\n<p>Акцидентных шрифтов всего 18, кегли от 10 до 84.</p>\n<p>Плюс немного буквиц.</p>\n<p>Боюсь ошибиться, кажется в наборе используется устав и полуустав, приближенный к уставу. Что важно: все текстовые шрифты имеют заглавные и строчные знаки. То есть Петровская реформа прошлась и по церковной печати. Кроме того, все славянские шрифты максимально, насколько позволяет графика, «антиквизированы»: повышен контраст, увеливены белые контрформы, начертание литер формализовано и соотнесено с нормами чтения гражданского шрифта.</p>\n<p>Но при этом никаких вольностей: славянский шрифт изображает вечную традицию так же, как в наши дни почетный караул — в киверах, мундирах и лосинах как бы времен очаковских и бородинских.</p>\n<p>В титульных шрифтах игры побольше, но это не «славянская» игра, а мимикрия под современность. Например, нет даже попытки сделать вязь с лигатурами. Зато полно брусковых и орнаментированных вариантов в стиле промышленной революции.</p>\n<p>Вывод. Синодальная типография в 1901 году была в полном порядке, но не имела будущего. И очень характерно, что ее модернизацией занимался не энергичный директор, не нанятый со стороны бизнесмен, и, разумеется, не церковный подвижник.</p>\n<p>Последний абзац описания типографии гласит: «Своим преобразованием и расширением, соответственно возрастающему спросу на священные, назидательные и учебные книги и современным усовершенствованиям в печатном деле, С-Петербургская Синодальная типография обязана высокому вниманию Святейшего Синода и попечительной заботливости Г. Синодального Обер-Прокурора К. П. Победоносцева».</p>\n<p>Уже после публикации посмотрел каталог словолитни О. Гербека — частного коммерческого предприятия. И нашел там множество значительно более любопытных славянских шрифтов, чем в государственной Синодальной. Среди них нашлись даже лигатуры для вязи под названием «монограммы».</p>\n<p>Продолжение следует.</p>\n<p class=\"ps\"><span class=\"pslabel\">PS</span> Мои нынешние посты — не главы из будущей книги, а короткие предварительные наброски.</p>\n<p>И, как всегда, жду специалистов для обсуждения темы. Отзовитесь, знатоки церковнославянской печати эпохи развивающегося империализма.</p>", "figs": [["img/r03/r03-001.jpg", "r03-001", "", 1.0], ["img/r03/r03-002.jpg", "r03-002", "", 1.0], ["img/r03/r03-003.jpg", "r03-003", "", 1.0], ["img/r03/r03-004.jpg", "r03-004", "", 1.0], ["img/r03/r03-005.jpg", "r03-005", "<p>Словолитня Гербека. Особенно интересна ленточная почти антиква</p>", 1.0], ["img/r03/r03-006.jpg", "r03-006", "<p>Словолитня Гербека. Шрифт посередине близок к палочным конструктивистским</p>", 1.0], ["img/r03/r03-007.jpg", "r03-007", "<p>Словолитня Гербека</p>", 1.0], ["img/r03/r03-008.jpg", "r03-008", "<p>Словолитня Гербека</p>", 1.0], ["img/r03/r03-009.jpg", "r03-009", "<p>Словолитня Гербека</p>", 1.0], ["img/r03/r03-010.jpg", "r03-010", "<p>Титульный лист</p>", 1.0], ["img/r03/r03-011.jpg", "r03-011", "<p>Шмуцтитул</p>", 1.0], ["img/r03/r03-012.jpg", "r03-012", "<p>Устав</p>", 1.0], ["img/r03/r03-013.jpg", "r03-013", "<p>Полуустав (?)</p>", 1.0], ["img/r03/r03-014.jpg", "r03-014", "<p>Устав, крупный кегль</p>", 1.0], ["img/r03/r03-015.jpg", "r03-015", "<p>Акцидентный заглавный</p>", 1.0], ["img/r03/r03-016.jpg", "r03-016", "<p>Акцидентный, заглавный и орнаментированный</p>", 1.0], ["img/r03/r03-017.jpg", "r03-017", "<p>Акцидентный строчной (?!) крупного кегля</p>", 1.0], ["img/r03/r03-018.jpg", "r03-018", "<p>Буквицы, одна краска</p>", 1.0], ["img/r03/r03-019.jpg", "r03-019", "<p>Буквицы, две краски</p>", 1.0], ["img/r03/r03-020.jpg", "r03-020", "<p>Раскладка наборной кассы с пояснением, что акценты лежат отдельно от литер</p>", 1.0], ["img/r03/r03-021.jpg", "r03-021", "<p>Политипажи. Обратите внимание на печати с гротеском по кругу. Этот гротеск — граница перехода из прошлого в настоящее время</p>", 1.0]], "research": null}, {"intro": false, "num": "4", "title": "Второй подряд пост о «славянских шрифтах»", "ptitle": "Второй подряд пост о «славянских шрифтах»", "subtitle": "", "date": "19 июля 2022", "perm": "https://www.facebook.com/story.php", "slug": "", "html": "<p><span class=\"dc\">Д</span>опетровская кириллица, несомненно, была скрепой. Православное государство прямо ассоциировало себя с уставом и вязью, и сильно обижалось, когда подданные позволяли себе шутить синодальными шрифтами (см. в комменте ссылку на дивную историю сборника «Аллилуйя»).</p>\n<p>Вязью декорировались меню государственных обедов (не все, но многие).</p>\n<p>Заглавными уставными буквами писали имена кораблей.</p>\n<p>Допетровская кириллица часто возникала на патриотических воззваниях.</p>\n<p>Часто — но далеко не всегда. Подбирая картинки к посту, я просмотрел сотни плакатов времен Первой мировой. Старая кириллица появляется не больше чем на каждом двадцатом.</p>\n<p>Мало того: даже на пасхальных открытках вязи почти нет. Как правило, оформители используют обычные «гражданские» шрифты, желательно модные. А если берутся писать под старину, выходит нечто скорее немецкое. Открыточная Пасха — мещанская, буржуазная — то есть максимально частное и домашнее дело. Скрепа туда никак не лезет.</p>\n<p>Что важнее всего: старая кириллица, изображая скрепу, остается чёрствоватой стариной, как бы качественно ни была исполнена.</p>\n<p>Но всё-таки нашлось место, где рвануло — там, где допетровские формы столкнулись с новой пластикой. Для российских модернистов и авангардистов старая кириллица стала примерно тем, чем для Уильяма Морриса — старопечатные английские книги и кельтский орнамент.</p>\n<p>Первым, кто пробил потолок, был гениальный Врубель. Его афиша к выставке 36 художников 1901 года — фантастический прорыв в авангард задолго до всяких футуристов. Грубые, мощные буквы, закрученные в зубодробительные лигатуры — просто так, для чистой радости — эту штуковину пока никто не перепрыгнул.</p>\n<p>А потом пришел изящный «Мир искусства» и виртуоз Билибин. «Ни у кого — этих звуков извивы». Он легко переплетает антиквенные формы с вязью. Орнаментирует. Усложняет. Упрощает. Проходится скорописью. Если б не буквы, Билибин был бы космополитичным арнуво-сецессионистом с условно русскими сюжетами. А с буквами — национальное достояние. Именно из букв Билибина можно наделать шикарных наборных шрифтов. Кто бы взялся?</p>\n<p>Вслед за Билибиным на первый план вышли Сергей Чехонин и Георгий Нарбут. И создали — вместе с массой подражателей и продолжателей — буквы позднего модерна, ставшие почти официальным «революционным стилем».</p>\n<p>Чехонин рисовал для наркомов. Нарбут параллельно создал стиль Украинской республики. Чехонин ушел в осколочный модернизм. Нарбут, как мне кажется, вспомнил книжные шрифты украинских типографий 16-17 века. В его буквах есть отсылка к западной кириллице, значительно раньше, чем московская, повстречавшейся с антиквой, и начавшей органическое сближение с ней намного раньше петровского перелома.</p>\n<p>Когда смотрю на обложки и эмблемы Чехонина, нацвет старой кириллицы вижу почти всегда. Чехонин берет не форму, не стиль, даже не детали — он прямо выжимает вкус допетровского письма. Имперская скрепа, недолго побыв в частном пользовании, перековалась в жестяной серп-и-молот.</p>", "figs": [["img/r04/r04-001.jpg", "r04-001", "<p>Виктор Васнецов. Меню-закладка на венчание Николая и Александры. 1896</p>", 1.0], ["img/r04/r04-002.jpg", "r04-002", "<p>Виктор Васнецов. Меню-закладка на венчание Николая и Александры. 1896. Деталь: отчаянная золотая вязь</p>", 1.0], ["img/r04/r04-003.jpg", "r04-003", "<p>Еще одно меню по тому же поводу</p>", 1.0], ["img/r04/r04-004.jpg", "r04-004", "<p>Казалось бы, во флоте должен господствовать петровский гражданский шрифт. Ан нет</p>", 1.0], ["img/r04/r04-005.jpg", "r04-005", "", 1.0], ["img/r04/r04-006.jpg", "r04-006", "<p>Константин Коровин, 1914</p>", 1.0], ["img/r04/r04-007.jpg", "r04-007", "", 1.0], ["img/r04/r04-008.jpg", "r04-008", "", 1.0], ["img/r04/r04-009.jpg", "r04-009", "<p>С. Виноградов. 1914</p>", 1.0], ["img/r04/r04-010.jpg", "r04-010", "", 1.0], ["img/r04/r04-011.jpg", "r04-011", "", 1.0], ["img/r04/r04-012.jpg", "r04-012", "", 1.0], ["img/r04/r04-013.jpg", "r04-013", "", 1.0], ["img/r04/r04-014.jpg", "r04-014", "", 1.0], ["img/r04/r04-015.jpg", "r04-015", "<p>На обложке скандальной книги В. Нарбута — крупнокегельный синодальный шрифт из предыдущего поста.</p>", 1.0], ["img/r04/r04-016.jpg", "r04-016", "<p>Михаил Врубель. Афиша, 1901</p>", 1.0], ["img/r04/r04-017.jpg", "r04-017", "<p>Иван Билибин. Модерн под видом допетровства</p>", 1.0], ["img/r04/r04-018.jpg", "r04-018", "<p>Интересно, не Билибин ли сделал логотип журнала? Уж больно хорош</p>", 1.0], ["img/r04/r04-019.jpg", "r04-019", "<p>Иван Билибин. Вот как хочет — так и поворачивает. Готовый шрифт в простом и чёрном варианте</p>", 1.0], ["img/r04/r04-020.jpg", "r04-020", "<p>Иван Билибин. «Антиквязь»</p>", 1.0], ["img/r04/r04-021.jpg", "r04-021", "<p>Иван Билибин</p>", 1.0], ["img/r04/r04-022.jpg", "r04-022", "<p>Иван Билибин. Скоропись</p>", 1.0], ["img/r04/r04-023.jpg", "r04-023", "<p>Иван Билибин</p>", 1.0], ["img/r04/r04-024.jpg", "r04-024", "<p>Иван Билибин</p>", 1.0], ["img/r04/r04-025.jpg", "r04-025", "<p>Сергей Чехонин тоже умел скорописать</p>", 1.0], ["img/r04/r04-026.jpg", "r04-026", "<p>Сергей Чехонин. Ну вот не допетровское — но вкус-то?</p>", 1.0], ["img/r04/r04-027.jpg", "r04-027", "<p>Сергей Чехонин. Эмблемы</p>", 1.0], ["img/r04/r04-028.jpg", "r04-028", "<p>Георгий Нарбут</p>", 1.0], ["img/r04/r04-029.jpg", "r04-029", "<p>Георгий Нарбут</p>", 1.0], ["img/r04/r04-030.jpg", "r04-030", "<p>Георгий Нарбут</p>", 1.0]], "research": null}, {"intro": false, "num": "5", "title": "Брендинг без дизайна на примере двух резинотрестов", "ptitle": "Брендинг без дизайна на примере двух резинотрестов", "subtitle": "", "date": "21 июля 2022", "perm": "https://www.facebook.com/story.php", "slug": "", "html": "<p><span class=\"dc\">В</span> дореволюционной России дизайна не было совсем, а логотипы (они же торговые или товарные марки) существовали в виде «фабричных марок», то есть клейма или шильдика непосредственно на изделии.</p>\n<p>Из множества рекламных плакатов и газетных объявлений я сумел выцепить только один пример последовательного продвижения фабричной марки в качестве главного атрибута бренда.</p>\n<p>Итак, были два мощных конкурента в резиновой отрасли: «Товарищество Российско-Американской Резиновой Мануфактуры (Т.Р.А.Р.М.) и Товарищество «Проводник». Обе марки были всемирно известны, и если писали «Лучшие в мире шины», то ни единою буквой не лгали. Например, лондонские автобусы обувались в шины «Колумб» — главный бренд «Проводника».</p>\n<p>Не знаю, сыграл ли роль основатель-американец, но Т.Р.А.Р.М. очень скоро, еще в 19 веке, обзавелся узнаваемой фабричной маркой «Треугольник». Мало того, сделал её визуально стабильной. И стал активно продвигать в качестве обязательного рекламного элемента. Это не был логотип в современном смысле: форма, пропорции, шрифт гуляли. Но общий посыл: «покупайте Треугольник» выдерживался почти везде. В тех случаях, когда марки не было, треугольниками были кавычки вокруг имени. Логотип полностью вытеснил аббревиатуру Т.Р.А.Р.М.</p>\n<p>Брендинг оказался настолько въедливым, что не исчез даже после национализации. Завод «Красный треугольник» пережил коммунистов.</p>\n<p>Надо сказать, реклама «Треугольника» часто была по-современному стильной. У бренда был маскот — красный дьявол, и очень узнаваемая картинка с подошвой, клейменой треугольником.</p>\n<p>«Проводник» продавал имена, а не изображения. Ни название фирмы, ни бренд «Колумб» не имели стабильной формы. Кажется даже, что компания специально «играла шрифтами» — настолько разными были объявления. Единственное, что повторялось — изображение шины с характерным рисунком протектора. Может быть, оно-то и составляло визуальный якорь?</p>\n<p>Не знаю, кто выиграл бы в жестокой каучуковой борьбе, но пришли большевики и отменили конкуренцию вместе с частным предпринимательством. С тех пор отечественные покрышки не ставят на болиды, да и лондонские автобусы переобулись в другие галоши</p>", "figs": [["img/r05/r05-001.jpg", "r05-001", "<p>Рекламный листок</p>", 1.0], ["img/r05/r05-002.jpg", "r05-002", "<p>Деталь с подошвой</p>", 1.0], ["img/r05/r05-003.jpg", "r05-003", "<p>Фабричное клеймо, оно же лого</p>", 1.0], ["img/r05/r05-004.jpg", "r05-004", "", 1.0], ["img/r05/r05-005.jpg", "r05-005", "<p>Треугольные кавычки</p>", 1.0], ["img/r05/r05-006.jpg", "r05-006", "<p>Указующий перст показыват на главное</p>", 1.0], ["img/r05/r05-007.jpg", "r05-007", "<p>Поставщик двора ЕИВ</p>", 1.0], ["img/r05/r05-008.jpg", "r05-008", "", 1.0], ["img/r05/r05-009.jpg", "r05-009", "<p>Апофеоз треугольника</p>", 1.0], ["img/r05/r05-010.jpg", "r05-010", "<p>Красный дьявол</p>", 1.0], ["img/r05/r05-011.jpg", "r05-011", "<p>Red Devil. Подметка детектед</p>", 1.0], ["img/r05/r05-012.jpg", "r05-012", "", 1.0], ["img/r05/r05-013.jpg", "r05-013", "", 1.0], ["img/r05/r05-014.jpg", "r05-014", "", 1.0], ["img/r05/r05-015.jpg", "r05-015", "", 1.0], ["img/r05/r05-016.jpg", "r05-016", "", 1.0], ["img/r05/r05-017.jpg", "r05-017", "", 1.0], ["img/r05/r05-018.jpg", "r05-018", "", 1.0], ["img/r05/r05-019.jpg", "r05-019", "", 1.0], ["img/r05/r05-020.jpg", "r05-020", "", 1.0], ["img/r05/r05-021.jpg", "r05-021", "<p>Вариант лого (Авто Шины)</p>", 1.0], ["img/r05/r05-022.jpg", "r05-022", "<p>«Проводник». Без логотипов, но с протектором</p>", 1.0], ["img/r05/r05-023.jpg", "r05-023", "<p>Тот же узорчик</p>", 1.0], ["img/r05/r05-024.jpg", "r05-024", "<p>Опять рисунок протектора четко выделен</p>", 1.0], ["img/r05/r05-025.jpg", "r05-025", "<p>И здесь. А шрифт — хоть какой</p>", 1.0], ["img/r05/r05-026.jpg", "r05-026", "", 1.0], ["img/r05/r05-027.jpg", "r05-027", "", 1.0], ["img/r05/r05-028.jpg", "r05-028", "<p>А тут попробовали украсть у конкурентов. Ай-яй-яй )</p>", 1.0], ["img/r05/r05-029.jpg", "r05-029", "<p>Во всех трех категориях победил «Колумб»</p>", 1.0], ["img/r05/r05-030.jpg", "r05-030", "<p>А это попытка отгрызть зимнюю резину у «Треугольника»</p>", 1.0], ["img/r05/r05-031.jpg", "r05-031", "<p>В газете можно и не узнать</p>", 1.0], ["img/r05/r05-032.jpg", "r05-032", "", 1.0]], "research": null}, {"intro": false, "num": "6", "title": "Крестиком и гладью: вышитые буквы", "ptitle": "Крестиком и гладью: вышитые буквы", "subtitle": "", "date": "25 июля 2022", "perm": "https://www.facebook.com/story.php", "slug": "", "html": "<p><span class=\"dc\">В</span> поисках народных букв наткнулся на коллекцию свадебных утиральников (они же рушники) из Смоленского музея. Кроме обычных орнаментов на них вышиты тексты — как правило, короткие пожелания вроде «утирайся на красу, умывайся на здоровье».</p>\n<p>Меня поразил контраст между отлично прорисованными буквами и почти полной неграмотностью вышивальщиц. Дело в том, что вышивка была одним из самых распространённых женских занятий, а в капиталистическом мире где бойко — там и рынок. Образцы для вышивания продавались везде и стоили очень дёшево. Альбом из 12 цветных листов с качественными немецкими рисунками стоил в начале прошлого века 8 копеек. Кроме того, образцы появлялись в приложениях к популярным журналам — к той же «Ниве», например. То есть, они вполне могли появиться не только в дворянском доме, но и в мещанской квартире, и в крестьянской избе.</p>\n<p>Наборы «меток и узоров» часто содержали буквы — полные алфавиты, буквицы, монограммы и вензеля. А в некоторые подборки для народного рынка вставляли целые тексты, чаще всего пословицы или строчки из песен.</p>\n<p>Вышивальщицы аккуратно копировали сложную форму букв, а вот с правописанием у них было туго. Дело в том, что даже если крестьянин или крестьянка учились в начальной школе, навыков правописания им почти не преподавали. Читать научили — и слава богу.</p>\n<p>Вторая часть картинок в посте — из альбома образцов 1913 года. Почти точно такой был у моей белорусско-польской бабушки. Она мастерски вышивала, а одну из ее скатертей с маминым вензелем стелили на стол до начала 70-х.</p>\n<p>В детстве, перебирая желтые листы и хрупкие кальки, я удивлялся: почему так много немецких букв? Теперь понял: вся серия альбомов (их были десятки) происходила из Эльзаса. Интересно, что в предназначенной для России коллекции все шрифты были кириллизованы, а орнаменты преобладали русские и украинские.</p>\n<p>Детали смотрите в подписях к картинкам.</p>\n<p>В комментах — ссылка на Смоленский музей и другая — где можно скачать весь альбом.</p>\n<p>Последняя картинка — мой шрифт Baker Street 221b Mrs Hudson, сделанный по образцам английской викторианской вышивки. Тот же крестик, но с привкусом Юнион Джека</p>", "figs": [["img/r06/r06-001.jpg", "r06-001", "<p>Правил писания вышивальщицы не знали. Пробелов, в общем, тоже. Когда не хватало букв, легко брали из другого алфавита</p>", 1.0], ["img/r06/r06-002.jpg", "r06-002", "", 1.0], ["img/r06/r06-003.jpg", "r06-003", "<p>Чередование черных и красных букв — точно как в образцах. 1898 год</p>", 1.0], ["img/r06/r06-004.jpg", "r06-004", "<p>Феодосия Григорьевна была грамотной мастерицей</p>", 1.0], ["img/r06/r06-005.jpg", "r06-005", "<p>Иногда не всё помещалось: «КАВОЛЮБЛЮТАВОДА»</p>", 1.0], ["img/r06/r06-006.jpg", "r06-006", "<p>Первая буква О — это часть Ю с другого конца рушника</p>", 1.0], ["img/r06/r06-007.jpg", "r06-007", "<p>«РАЮ» на самом деле «ДАРЮ»</p>", 1.0], ["img/r06/r06-008.jpg", "r06-008", "", 1.0], ["img/r06/r06-009.jpg", "r06-009", "", 1.0], ["img/r06/r06-010.jpg", "r06-010", "<p>Молодец коня поил<br>К кра[ль]сной девке приводи[л]</p>", 1.0], ["img/r06/r06-011.jpg", "r06-011", "<p>Первая обложка альбома. На ней — реселлер: книжный магазин в московском Пассаже</p>", 1.0], ["img/r06/r06-012.jpg", "r06-012", "<p>На авантитуле — экслибрис: «Сия книга Клавдии Ивановны Села Романовского»<br>И дата покупки другим пером и почерком: «Куплена 20 мая 1913 года»</p>", 1.0], ["img/r06/r06-013.jpg", "r06-013", "<p>Титул с обозначением издателя: De Dillmont в Мюльгаузене (Эльзас). А сверху — название серии: Библиотека DMC. Это действительно библиотека из десятков изданий, в основном на французском и немецком.</p>", 1.0], ["img/r06/r06-014.jpg", "r06-014", "<p>А это, на обороте титула, судя по всему, марка рижского (!) печатника. Остается только удивляться, как много европейцев потрудилось для Клавдии Ивановны из села Романовского</p>", 1.0], ["img/r06/r06-015.jpg", "r06-015", "<p>Это натуральные школьные прописи 1909 года</p>", 1.0], ["img/r06/r06-016.jpg", "r06-016", "<p>Двукрасочные буквицы</p>", 1.0], ["img/r06/r06-017.jpg", "r06-017", "<p>А вот и готика</p>", 1.0], ["img/r06/r06-018.jpg", "r06-018", "<p>И еще готика. А сверху — почти техно-авангард</p>", 1.0], ["img/r06/r06-019.jpg", "r06-019", "<p>Монограммы</p>", 1.0], ["img/r06/r06-020.jpg", "r06-020", "<p>Двухкрасочный шрифт с тенью</p>", 1.0], ["img/r06/r06-021.jpg", "r06-021", "<p>Образцы для вышивания гладью</p>", 1.0], ["img/r06/r06-022.jpg", "r06-022", "<p>Прорисовка образцов для глади</p>", 1.0], ["img/r06/r06-023.jpg", "r06-023", "<p>Вензеля</p>", 1.0], ["img/r06/r06-024.jpg", "r06-024", "<p>Так, по моему мнению, могла бы вышивать миссис Хадсон</p>", 1.0]], "research": null}, {"intro": false, "num": "7", "title": "Демонстративный леттеринг", "ptitle": "Демонстративный леттеринг", "subtitle": "", "date": "27 июля 2022", "perm": "https://www.facebook.com/story.php", "slug": "", "html": "<p><span class=\"dc\">Р</span>ассматривая фотографии демонстраций, всегда стараешься прочесть, <em>что</em> написано на знаменах и транспарантах. Я же попробую проанализировать, <em>как</em> написано.</p>\n<p>Подборка вышла скудная — просто Гугл имидж по запросу «демонстрация 1905-1917». Но и здесь можно кое-что выловить.</p>\n<p>Для начала — про цвет. На ч/б фото теряется драматизм и театральность демонстрации. Но стоит подкрасить транспаранты кумачом, и картина восстанавливается. Толпа в то время была в основном тёмной, так что эффект похож.</p>\n<p>Второе, что бросается в глаза: в 1905 году не было транспарантов. Только флаги. Во вторую революцию агитацию развертывали на два древка. Это может быть связано с возросшей грамотностью (чуть ли не в два раза). А уж горожане почти поголовно умели читать. Солдат, кстати, тоже учили грамоте.</p>\n<p>В современных картинках с демонстрациями почти всегда присутствуют итальянские шрифты. На старых фото я не нашел ни одного, хотя вокруг вывески были «итальянскими».</p>\n<p>При этом почти везде, где оформитель хотел красоты, появлялись формы модерна: обязательные Б, Р, Ъ, Ы, Ь со скошенным полуовалом. Впрочем, это же могло быть отсылкой к «славянским» шрифтам.</p>\n<p>Любопытно, что даже в длинных надписях нет рубленых О с прямыми сторонами. Культура плакатного пера еще не была выработана.</p>\n<p>Из всей подборки полностью профессионально выглядит только сложная конструкция Монетного двора с рельефным молот-и-молотом и двумя подвесками. Буквы там тоже исполнены качественно — что и не удивительно.</p>\n<p>Самые удивительные для меня транспаранты — от Союза офицерских депутатов. Во-первых, не знал, что такой был. Во-вторых, кто-то из господ, т.е. товарищей офицеров накрутил весьма нетривиальных, даже игривых, кренделей.</p>\n<p>Плакаты с призывом к террору — это уже не романтический 1917, а зверский 1918 год.</p>\n<p>Транспаранты хоть и были народным творчеством, писались со всей возможной аккуратностью. Спонтанных почеркушек, характерных для нынешних манифестаций, нет. Даже там, где кистью водила куцелапа какого-нибудь ротного грамотея, видно прилежание и уважение к «такому огромному лоскуту».</p>\n<p>На нескольких транспарантах встречается курсив. Это тоже, скорее всего, искусство для искусства — читать-то куда сложнее, уж не говоря о том, как трудно это было написать.</p>\n<p>Одну из фотографий я уже использовал в проекте «Слово» на карте «Кириллица в пространстве и времени». Это питерская демонстрация 18.06.1917. На фото два лозунга. Левый — про «миръ всему мiру» — написан по старой орфографии. Правый — «долой министров капиталистов» — по новой. Не исключено, что стоящие плечо к плечу граждане через год окажутся по разные стороны линии фронта.</p>\n<p>В дополнение к фотографиям — две картинки больших художников. Одна — обложка Чехонина. Вторая — иллюстрация Анненкова к «Двенадцати». Видно, как каждый из них трансформировал уличное творчество в собственные, почти классические формы.</p>\n<p class=\"ps\"><span class=\"pslabel\">PS</span> Детали — в подписях к фотографиям</p>", "figs": [["img/r07/r07-001.jpg", "r07-001", "<p>Демонстрация в подцветке. Февраль 1917.<br>На первом транспаранте — вытянутый гротеск с модернистскими фокусами: засечки у Т, разновысотность букв.<br>Второй написан курсивом, тоже довольно сложным, латинской k.<br>Про Учредительное собрание — почти ленточная антиква.<br>Долой самодержавие, судя по всему, сансериф.</p>", 1.0], ["img/r07/r07-002.jpg", "r07-002", "<p>Кровавое воскресенье. Только флаги, без растяжек.</p>", 1.0], ["img/r07/r07-003.jpg", "r07-003", "<p>Похороны Баумана. Фото заретушировано до состояния лубка. Лучше б они прописали, что на знамени. На дальнем плане маячит транспарант, но что-то слишком высоки у него древка. Похоже, подрисовали.</p>", 1.0], ["img/r07/r07-004.jpg", "r07-004", "<p>Гугл принял очередь за хлебом за манифестацию. Но над толпой не лозунги, а вывески — сплошь итальянскими шрифтами. 1917</p>", 1.0], ["img/r07/r07-005.jpg", "r07-005", "<p>Очень интересный образец юникейса (равноправие строчных и прописных!). Орфоргафия — промежуточная: твердых знаков нет, а i есть. Не пропустите БЩ «по-грузински», без выхода за строку. У Щ центральный хвост, как в древности. Умилительно не влезла вторая кавычка</p>", 1.0], ["img/r07/r07-006.jpg", "r07-006", "<p>День похорон 23.03.1917. Здесь почти ничего не видно (а жаль). Но я всё же углядел на одной из хоругвей латиницу, причем готическую (!). Найдёте?</p><p>Из шрифтов в основном гротески, часто с обратным контрастом. Справа видно энергичное «Будем достойны», а еще правее — «капительное» «За Св…» Кстати, «капители» довольно много.</p><p>Почти все надписи в стиле модерн, то есть это не просто так написано, а сделан тщательный леттеринг.</p>", 1.0], ["img/r07/r07-007.jpg", "r07-007", "<p>С тех же похорон жертв революции 23.03.1917. Экзотический Совет офицерских депутатов (ни одного погона с двумя просветами) вышел с красивыми лозунгами.</p>", 1.0], ["img/r07/r07-008.jpg", "r07-008", "<p>Единственный случай спонтанной агитации. Март 1917. Солдатушки не нашли кумача и расписали простыни. Очень старались, но явно спешили.<br>«В борьбе обретёшь ты право своё» — лозунг эсэров</p>", 1.0], ["img/r07/r07-009.jpg", "r07-009", "<p>Эту фотографию я использовал в проекте «Слово».<br>Жаль, не видно, что на левой хоругви.<br>Оба видимых транспаранта сделаны художественно, в стиле модерн. Министров, похоже, гонял человек, не чуждый изготовлению вывесок. 18.06.1917. Если по новому стилю — ровно 41 год до моего др )</p>", 1.0], ["img/r07/r07-010.jpg", "r07-010", "<p>Эту фотку я взял за ярую экзотику. Слева — плакат на слоне (живом). Справа аллегория старого режима, а на ней мужик с табличкой «Гришка Распутин». А рядом веселый карлик с подписью «Протопопов». По-моему, это цирк на марше. 1917<br>Сразу в голову лезет Д. А. Пригов:<br>«Когда большая крокодила<br>По улицам слона водила…»</p>", 1.0], ["img/r07/r07-011.jpg", "r07-011", "<p>1917. Редкий пример чистого месседжа без красот.</p>", 1.0], ["img/r07/r07-012.jpg", "r07-012", "<p>Милицiя в старой орфографии. 1917</p>", 1.0], ["img/r07/r07-013.jpg", "r07-013", "<p>Идут хозяева земли. Идёт монетный двор (если кто не считал цитату из советской песни — я не виноват).<br>Работал профессионал: даже линейку-усы вставил</p>", 1.0], ["img/r07/r07-014.jpg", "r07-014", "<p>А вот тут люди старались, но не рассчитали длину строки. Опомнились на «ПРИБ», дальше как поместилось. 1917</p>", 1.0], ["img/r07/r07-015.jpg", "r07-015", "<p>Еще курсив. Сокращение: «Город». вместо «Городское». 1917</p>", 1.0], ["img/r07/r07-016.jpg", "r07-016", "<p>Обратите внимание на хвостатые В и П в первой строке.<br>Почему-то хочется найти автора лозунга. Мне почему-то кажется, что это юноша с красным бантом, держащий левое древко. 23.03.1917</p>", 1.0], ["img/r07/r07-017.jpg", "r07-017", "<p>23.03.1917. Интересно, как выглядел в цвете транспарант «Вечная память»? Черные буквы на красном поле?</p>", 1.0], ["img/r07/r07-018.jpg", "r07-018", "<p>1917. А вот эти три транспаранта, похоже, вышли из одной полковой редакции. Многие воинские соединения издавали свои газеты, часто с крутыми логотипами. Так что было кому лозунги писать</p>", 1.0], ["img/r07/r07-019.jpg", "r07-019", "<p>А вот это, скорее всего, эсдеки с лозунгом за демократическую республику и интернационал. Однако, метров шесть-семь кумача экспроприировали. 1917</p>", 1.0], ["img/r07/r07-020.jpg", "r07-020", "<p>1918. Художественный призыв к террору от Петроградского губсовета. Стиль модерн. Орфография новая, «Ея» как учили в гимназии.</p>", 1.0], ["img/r07/r07-021.jpg", "r07-021", "<p>1918. Бесхитростный, но еще более устрашающий призыв убивать соотечественников по классовому признаку. Буквы кривые, но старательные, с загогулями и засечками</p>", 1.0], ["img/r07/r07-022.jpg", "r07-022", "<p>Чехонин. Плакат. 1919. Стиль — революционный модерн</p>", 1.0], ["img/r07/r07-023.jpg", "r07-023", "<p>Анненков. Иллюстрация к «Двенадцати» Блока. Почти гражданский шрифт на плакате — красиво, но не жизненно.</p>", 1.0]], "research": null}, {"intro": false, "num": "8", "title": "Чистописание в двойную косую линейку", "ptitle": "Чистописание в двойную косую линейку", "subtitle": "", "date": "1 августа 2022", "perm": "https://www.facebook.com/story.php", "slug": "", "html": "<p><span class=\"dc\">В</span>о всем, что я делаю, на первых ролях — случайность. Лучшая метафора для новой книги — луч фонарика в огромном складе. Каждый раз не знаю, что окажется в круге света — и это прекрасно.</p>\n<p>Сегодня большой рассказ о гугл-выдаче по запросу «школьные тетради 1900». Он привел на великолепный ресурс — виртуальный «Отраслевой канцелярский музей» (ссылка в комменте). Насколько я понял, в основе экспозиции личная коллекция хранителя музея Игоря Зайцева.</p>\n<p>Сходите, не пожалеете. Это золотая жила и магический кристалл в одном флаконе. В этом посте мне нужно только пересказать своими словами микрочасть увиденного и прочитанного.</p>\n<p>Итак, я полез за дореволюционными тетрадками. И выяснил, что они были разными и по формату, и по бумаге, и по количеству страниц, и по скреплению, и по линовке.</p>\n<p>Их печатали во многих местах (лучшая бумага, кажется, была рижская). А продавали в многочисленных писчебумажных магазинах, при многих из которых были собственные типографии. Часто на готовую тетрадь приклеивались стикеры с рекламой магазина и разметкой для заполнения («учени… …класса …школы»). Иногда впечатывали название конкретной школы или гимназии. Типовая государственная тетрадка в РИ была неведома.</p>\n<p>Тетради были не дешевы (для бедных учеников по 2 полновесных царских копейки). Поэтому обучение часто начинали на индивидуальных грифельных (аспидных) досках размерном с тетрадку (см. картинки). Писали на них меловыми или свинцовыми грифелями, белым по черному. Написанное стирали тряпкой, как в наше время мел с классной доски. Помните, у Мандельштама:</p>\n<h3>«Здесь пишет страх, здесь пишет сдвиг</h3>\n<p>Свинцовой палочкой молочной,</p>\n<h3>Здесь созревает черновик</h3>\n<h3>Учеников воды проточной»</h3>\n<p>Это как раз об аспидной доске. Не случайно ода — Грифельная.</p>\n<p>Вернемся к тетрадкам. Кайф коллекции в том, что они использованные. В них — прописи, домашние работы, сочинения, рисунки школьников столетней давности. Я натаскал некоторое количество — смотрите картинки с подписями.</p>\n<p>О том, как обучали письму, можно узнать из брошюры «Методическое Пособие к обучению письму» В. С. Гербача — на мой взгляд, весьма продуманной и прогрессивной не только для своего времени. Помимо обычного наклонного курсива, самоутвердившегося в России с 18 века, предлагается как более полезный для здоровья и разборчивый прямой курсив, а также «круглое письмо» ширококонечным первом. Примеры — на картинках. Судя по популярности почерка «рондо», эти вариации существовали не только в теории.</p>\n<p>Насколько я понимаю, крестьян в начальных школах не слишком мучили правописанием и грамматикой. А вот гимназисты и «реалисты» становились настоящими каллиграфами, что даже в начале 20 века сулило карьерный рост: хороший почерк ценился в бюрократической империи. Посмотрите, как заполнял дневник саратовский троешник Сидоров — это впечатляет.</p>\n<p>Забавно, что никому не приходило в голову задуматься, насколько не органичен английский слитный скрипт для кириллицы. Главное — скорость и равномерность письма. А то, что большая часть строчных похожа друг на друга, как солдаты в строю — ну, незначительный побочный эффект.</p>\n<p>Мы представляем царскую Россию как полуграмотную страну — и отчасти это верно. В 1915 году в начальных школах училась примерно половина российских детей. Но число и школ, и учителей, и учеников росло по экспоненте. В 1921 году в РИ должно было случиться всеобщее начальное обучение. Без всяких большевиков, заметим. Но не случилось.</p>\n<p>Подробности о тетрадях и прочей канцелярской утвари смотрите на сайте музея — там можно зависнуть надолго.</p>", "figs": [["img/r08/r08-001.jpg", "r08-001", "<p>Грифельная доска. Сторона для чистописания. Изготовлена в Риге</p>", 1.0], ["img/r08/r08-002.jpg", "r08-002", "<p>Грифельная доска. Сторона для арифметики (или для прямого почерка)</p>", 1.0], ["img/r08/r08-003.jpg", "r08-003", "<p>Грифели для писания на доске</p>", 1.0], ["img/r08/r08-004.jpg", "r08-004", "<p>Грифели и упаковка на 100 штук. Каждый грифель оклеен бумажкой с орнаментом. Орнаменты разные. Сделано в Риге (что-то много всего делали в Риге).</p>", 1.0], ["img/r08/r08-005.jpg", "r08-005", "<p>Не знаю автора. Класс в земской школе. Ученики разновозрастные. На задних партах — самые маленькие с грифельными досками.</p><p>Учительница — молодая женщина. В РИ начала 20 века половина учителей начальных школ были женщины.</p>", 1.0], ["img/r08/r08-006.jpg", "r08-006", "<p>Еще один земский класс. Опять учитель — учительница. Опять разновозрастные ученики. И снова грифельные доски вместо тетрадей.</p>", 1.0], ["img/r08/r08-007.jpg", "r08-007", "<p>Обложка руководства по обучению письму. 1915 год</p>", 1.0], ["img/r08/r08-008.jpg", "r08-008", "<p>Обычные прописи. Обратите внимание на строчную д: варианты с хвостом вниз и вверх. В советское время хвост вверх убрали, но все его все равно загибают )</p>", 1.0], ["img/r08/r08-009.jpg", "r08-009", "<p>Это довольно продвинутые образцы для письма.</p>", 1.0], ["img/r08/r08-010.jpg", "r08-010", "<p>Высший пилотаж школьной каллиграфии. Нас так не учили</p>", 1.0], ["img/r08/r08-011.jpg", "r08-011", "<p>Прямой почерк</p>", 1.0], ["img/r08/r08-012.jpg", "r08-012", "<p>Прямой почерк — строчные</p>", 1.0], ["img/r08/r08-013.jpg", "r08-013", "<p>Прямой почерк — цифры и детали. Отличие от косого — только в наклоне. И в удобочитаемости</p>", 1.0], ["img/r08/r08-014.jpg", "r08-014", "<p>Круглый почерк с характерными для плоского пера диагональными толщинами</p>", 1.0], ["img/r08/r08-015.jpg", "r08-015", "<p>Заглавные круглого почерка</p>", 1.0], ["img/r08/r08-016.jpg", "r08-016", "<p>Прописи круглого почерка</p>", 1.0], ["img/r08/r08-017.jpg", "r08-017", "<p>Прописи прямого почерка в компактном варианте. Письмо с нажимом остроконечным пером</p>", 1.0], ["img/r08/r08-018.jpg", "r08-018", "<p>Обложка тетради приготовишки С. Егорова. 1911-12 годы. Начало нелегкой науки письма</p>", 1.0], ["img/r08/r08-019.jpg", "r08-019", "<p>Прямой почерк в тетради (заметим — в клетку).</p>", 1.0], ["img/r08/r08-020.jpg", "r08-020", "<p>Тетрадь воспитанницы Ворониной с рекламой склада Комаровых на Садово-Кудринской</p>", 1.0], ["img/r08/r08-021.jpg", "r08-021", "<p>Пишет воспитанница Воронина</p>", 1.0], ["img/r08/r08-022.jpg", "r08-022", "<p>Интересно, что получил по чистописанию с обратным наклоном гимназист Алексей Пиккеев. Наклейка на тетради — именная Третьей СПб гимназии</p>", 1.0], ["img/r08/r08-023.jpg", "r08-023", "<p>Наклейка книжных и писчебумажных магазинов М. С. Елова. С ассортиментом товаров. Рыбинск</p>", 1.0], ["img/r08/r08-024.jpg", "r08-024", "<p>Тетрадь с рекламой знаменитого универмага «Мюр и Мерилиз» (ныне ЦУМ)</p>", 1.0], ["img/r08/r08-025.jpg", "r08-025", "<p>Тетрадь по природоведению Сергея Петрова. Каков почерк?</p>", 1.0], ["img/r08/r08-026.jpg", "r08-026", "<p>Из тетради Сергея Петрова. Каковы рисунки?</p>", 1.0], ["img/r08/r08-027.jpg", "r08-027", "<p>Еще из тетради Сергея Петрова. Кодекс Серафиниани как есть</p>", 1.0], ["img/r08/r08-028.jpg", "r08-028", "<p>Обложка дневника прилежного, но не слишком успевающего Константина Сидорова из Саратова</p>", 1.0], ["img/r08/r08-029.jpg", "r08-029", "<p>Что задано? Усекновение главы Иоанна Предтечи (на самом деле — праздник). Почерк у гимназиста Сидорова по нынешним меркам просто нереально хорош</p>", 1.0], ["img/r08/r08-030.jpg", "r08-030", "<p>Еще страница из дневника Сидорова. Никак не налюбуюсь</p>", 1.0], ["img/r08/r08-031.jpg", "r08-031", "<p>Обложка тетради с рефератом слушательницы 1-го отделения историко-фило(-логического? -софского?) факультета В. И. Андреевой. На обложке — трансформация школьного почерка во взрослый</p>", 1.0], ["img/r08/r08-032.jpg", "r08-032", "<p>Первая страница реферата В. И. Андреевой. Первая буква И — школьная. Дальше пошла разгоняться девичья рука во взрослый энергичный почерк</p>", 1.0], ["img/r08/r08-033.jpg", "r08-033", "<p>Ещё Мюр и Мерилиз. А внутри — «Дездемона и Мария»</p>", 1.0], ["img/r08/r08-034.jpg", "r08-034", "<p>Первая страница «Дездемоны и Марии». Аааааа.</p>", 1.0], ["img/r08/r08-035.jpg", "r08-035", "<p>Реклама писче бумажных товаров Петра Иванова Иконникова в Москве в 1850-е годы. Через полвека писчебумажные магазины имелись во всех городах империи</p>", 1.0]], "research": null}, {"intro": false, "num": "9", "title": "«На полицейской бумаге верже»", "ptitle": "«На полицейской бумаге верже»", "subtitle": "", "date": "6 августа 2022", "perm": "https://www.facebook.com/story.php", "slug": "", "html": "<p><span class=\"dc\">Р</span>оссийская империя была полицейским государством. Что это значит, нам, населяющим современную РФ, объяснять не нужно. Однако есть нюансы, и сегодняшний рассказ о них.</p>\n<p>Во-первых — об очередной случайной находке. Это новый, только формирующийся исторический портал hisdoc (ссылка в комменте). Место невероятное. Помимо тучи разнообразнейших документов, отсканированных с высоким разрешением, есть их расшифровки — и это таки отдельное чтение.</p>\n<p>(в скобках тихо прошу создателей ресурса немного уменьшить водяной знак HisDocRu — права правами, но выглядит уже как реклама. Спасибо)</p>\n<p>Итак, первый сюжет — с хисдока, и он показался поразительным настолько, что я на полвека вылез за рамки книги. Дело происходит в 1847 году. (Ссылка в комменте — не поленитель прочесть расшифровку на сайте).</p>\n<p>Сюжет — настолько кристально чистый Гоголь, что прямо неловко. Квартальный надзиратель рапортует частному приставу, что финляндский уроженец Гофман («я швабский немец, а не русская говядина!») пытается истребовать у некоего мещанина Орлова свои часы, а тот не отдает, и денег за них не дает тоже, а «по сделанному ему осмотру, ни требуемые часы, и никакого имущества, принадлежащего Орлову, кроме необходимо носильного платья не найдено». В результате Орлов подписан о невыезде из Москвы до конца разбирательства.</p>\n<p>На это пристав, коллежский асессор (то есть маиор) и кавалер с хорошей фамилией Эрдман дает вердикт: Орлова приструнить статьями такой-то и такой-то, одна административная, вторая уголовная.</p>\n<p>Что же тут поразительного (ну, кроме фамилии Гофман — прямиком из «Невского проспекта») скажете вы. Читайте подпись к картинке.</p>\n<p>А еще обратите внимание на почерки. Квартальный пишет как Акакий Акакиевич, «все буквы наособицу», то есть не очень слитно, хотя и пытается загнуть кренделей в подписи. Частный пристав отвечает уверенным (и не слишком разборчивым) министерским курсивом с летящим наклоном и правильным нажимом. Разница в две ступени Табели о рангах.</p>\n<p>Вообще полицейские почерки могут послужить темой специального расследования. Об их многообразии — второй сюжет. Набирайтесь терпения — дело тянулось долго.</p>\n<p>Первая картинка — обложка «Дела», почерпнутого на Викискладе («случайность вроде бы казалось»), ссылка на пдф в комменте.</p>\n<p>В 1900 году Мещанин Мордко Промышлянский из местечка Руднина Сквирского уезда Киевской губернии захотел получить паспорт. Паспорта в РИ выдавались не всем и по особым случаям. Возможно, еврею Мордку нужно было пересекать священную Черту оседлости. Ну, или еще зачем-то. Паспорт мещанину не дали, и он пожаловался Его Превосходительству Киевскому Губернатору.</p>\n<p>Дело возымело ход, и после разбирательств паспорт все же выдали, спустя два месяца после подачи жалобы, в феврале 1901.</p>\n<p>Что мне показалось интересным? Почерки, бланки, штампы. Если к ним внимательно присмотреться, видно как работала машина полицейского государства, как сложно она была устроена, как скрипела — но всё же выдавала нужный результат. Картинок много. Это фрагменты дела. Можно скачать пдф целиком.</p>\n<p>Подробности в подписях к картинкам.</p>\n<p>Третий сюжет — розовый листок с оборотом, взятый с хисдока. Это пропуск в Кремлёвский дворец (так и хочется добавить «Съездов») на торжественный выход их императорских величеств в ночь с 5 на 6 апреля 1903 года.</p>\n<p>Бедные величества ночь не спали, всё выходили. А супруга генерал-майора Мария Николаевна Шлетынская наслаждалась зрелищем. Комментарии в подписи к картинке.</p>\n<p>Ну и самое последнее-распоследнее — не полицейское: приглашение на свадьбу. 30 апреля 1903 г. Просто набор (высокая печать, каллиграфический шрифт, формат — визитка. Любуйтесь.</p>\n<p>Я накопал на хисдоке столько, что мог бы еще поста четыре пересказывать сюжеты. Но уймусь, оставлю вкусное для книги. Продолжение, разумеется, следует.</p>", "figs": [["img/r09/r09-001.jpg", "r09-001", "<p>Рапорт квартального надзирателя (10 ранг Табели о рангах) частному приставу (8 ранг). 26 июня 1847 г.</p><p>Почерк квартального: мелкий, разборчивый, буквы не всегда слиты, выносные элементы короткие. Форма букв — еврокурсив, но с легкими следами скорописи.</p><p>Но самое невероятное — это личный ПЕЧАТНЫЙ БЛАНК.<br>Пристав, видимо, имел тираж бланков для рапортов, которые раздавал каждому из квартальных.</p><p>Интересно, это частная приставская инициатива г-на Людвига Эрдмана, любителя орднунга, или так было по всей империи, от Москвы до самых Петушков?! Показать меньше</p>", 1.0], ["img/r09/r09-002.jpg", "r09-002", "<p>Рапорт квартального приставу, 1847, оборот. Подпись квартального, не без лихости, но всё место ушло на чин, фамилия поджала хвост. Дата: Августа 1 дня. Не сразу написал.</p>", 1.0], ["img/r09/r09-003.jpg", "r09-003", "<b>Вердикт частного пристава на рапорт квартального. 1847</b><p>Вот это я понимаю почерк. Наклон, выносы, энергия. Видно, что маиор Эрдман относится к делам серьезно и себя уважает.</p>", 1.0], ["img/r09/r09-004.jpg", "r09-004", "<b>Окончание вердикта частного пристава. Подпись. Красота.</b><p>Номера, судя по всему, вписаны другим чиновником. Куцей лапой. Эх!</p>", 1.0], ["img/r09/r09-005.jpg", "r09-005", "<p>Дело по жалобе мещанина Мордка Промышлянского. 1900-1901. Обложка отпечатана в киевской губернской (т. е. государственной) типографии. Орнамент рамки скромный, но пару дев с изобилием все же вставили.</p><p>Писарский почерк так себе, но имя-фамилия вписаны аккуратно.</p>", 1.0], ["img/r09/r09-006.jpg", "r09-006", "<p>Дело М. Промышлянского. Первый листок в стопке. Богуславская управа что-то плетет небрежным почерком</p>", 1.0], ["img/r09/r09-007.jpg", "r09-007", "<p>Дело М. Промышлянского. Второй лист сверху. Бланк Богуславской мещанской управы МВД. Рапорт. Написан в феврале, после получения по шапке из Киева. Почерк гимназический, твёрдого троешника. Разборчивый и с крендельками.</p>", 1.0], ["img/r09/r09-008.jpg", "r09-008", "<p>Дело М. Промышлянского. Оборот рапорта с предыдущей картинки с пометой тупым красным карандашом — видимо, вышестоящая инстанция сигналит: вот же! Какого хрена тянете?!</p>", 1.0], ["img/r09/r09-009.jpg", "r09-009", "<p>Дело М. Промышлянского. Конец рапорта. Подписи членов Богуславской управы и письмоводителя, всё это написавшего. Скромные зайчики, только самый младший, письмоводитель, пискнул телеграфистом Ятем.</p>", 1.0], ["img/r09/r09-010.jpg", "r09-010", "<p>Дело М. Промышлянского. Еще бланк Богуславской управы МВД. Просят о наведении справки. Почерк деловой. Сверху наискосок чья-то резолюция. Еще выше — почтовый штамп: посылали как открытое письмо. Внизу росчерк, показывающий, что текст не закончен.</p>", 1.0], ["img/r09/r09-011.jpg", "r09-011", "<p>Дело М. Промышлянского. Оборот предыдущего документа. Тут же справка. Судя по почерку справки, дающий ее ниже чином, чем запрашивающий.</p>", 1.0], ["img/r09/r09-012.jpg", "r09-012", "<p>Дело М. Промышлянского. Последняя страница предыдущего документа. Господи, ну сколько же писанины!</p>", 1.0], ["img/r09/r09-013.jpg", "r09-013", "<p>Дело М. Промышлянского. Киевское Губернское правление МВД. Тадаам! Вот так в 1900 году в уезды прилетало от начальства. Единственный документ в деле, отпечатанный на машинке.</p><p>Все быстро стали во фрунт и отчитались по форме. Эта бумажка — причина всех вышележащих.</p>", 1.0], ["img/r09/r09-014.jpg", "r09-014", "<p>Дело М. Промышлянского. Оборот предыдущего громометания. Подписано (в разрядку) неким Советником с хорошей полковничьей подписью.</p>", 1.0], ["img/r09/r09-015.jpg", "r09-015", "<p>Дело М. Промышлянского.<br>Вот она — изначальная жалоба мещанина Мордка. На самом деле не жалоба, а прошение. Написано от первого лица, но сомневаюсь, чтоб первым лицом. Вряд ли обычный местечковый еврей, даже с образованием, сумел бы так аккуратно, по-русски и по принятой форме, описать суть дела. Скорее всего, работал профессиональный юрист (?).</p>", 1.0], ["img/r09/r09-016.jpg", "r09-016", "<p>Дело М. Промышлянского. Оборот Прошения с подписью просителя. Мне кажется, что собственноручно вписаны только имя и фамилия — они несколько мельче остального текста, и перо, похоже, другое</p>", 1.0], ["img/r09/r09-017.jpg", "r09-017", "<p>Дело М. Промышлянского. Некая бумага, отправленная Сквирскому исправнику. Интересно, что поле слева — явно по форме. Для грифа и резолюций</p>", 1.0], ["img/r09/r09-018.jpg", "r09-018", "<p>Дело М. Промышлянского. Оборот предыдущего документа. Штамп с подписями. Очень модный курсив рондо.</p>", 1.0], ["img/r09/r09-019.jpg", "r09-019", "<p>Дело М. Промышлянского. Рапорт сквирского исправника. В левом углу — личный исправничий штамп. Почерк у исправника — как будто только что из штыковой атаки. Правда, немного настораживает подпись с другим наклоном. Может быть, это мелкий чин писал?</p>", 1.0], ["img/r09/r09-020.jpg", "r09-020", "<p>Дело М. Промышлянского. Оборот рапорта исправника. Опять модный киевский штамп.</p>", 1.0], ["img/r09/r09-021.jpg", "r09-021", "<p>Дело М. Промышлянского. Счастливая развязка: мещанин Промышлянский обрел паспорт (прислали почтой). Документ, по-моему, написан вручившим его приставом 2 стана (чья подпись тем же круглым почерком внизу). А мещанин Мордко оставил только свою остренькую фамилию — такую же, как на Прошении. Подпись человека, привычного к письму по-русски.</p><p>Замечу, что далеко не все православные мещане в 1901 году умели вывести свое имя.</p><p>Кстати, имя Мордко — идишный вариант Мордехая. Часто библейские имена искажались в просторечии. Например, моего дедушку, пока он жил в местечке Гривы, звали Залманом. А после переезда в Москву в 1918 году он стал Соломоном. И все старшие братья отца были Залмановичи, а он с младшим, Израилем — Соломоновичи. Показать меньше</p>", 1.0], ["img/r09/r09-022.jpg", "r09-022", "<b>Для тех, кто дополз: пропуск на лицезрение Величеств.</b><p>Обращаем внимание на игру шрифтами. Слово «пропуск» и титулатура набраны «славянским» шрифтом. Прочее — антиквой. Даты — курсивом гротеска. Иерархия, однако.</p><p>К той же иерархии относится каллиграфический генерал-лейтенант. Интересно: подпись клишированная? Думаю да. Показать меньше</p>", 1.0], ["img/r09/r09-023.jpg", "r09-023", "<p>Пропуск, оборот. Имя приглашенной вписано без разметки уверенным секретарским почерком.<br>Пропуск на одно лицо — никаких дочек и внучек. Вообще правила строгие, не забалует генеральская супруга Показать меньше</p>", 1.0], ["img/r09/r09-024.jpg", "r09-024", "<p>Приглашение на свадьбу. 30 апреля 1903 г.<br>Печать в два кегля (имена крупнее).<br>Пришлось поработать метранпажу, вставляя шпоны прямо посреди строки Показать меньше</p>", 1.0]], "research": null}, {"intro": false, "num": "10", "title": "Возврат каретки: пишмашинки, пишбарышни, пишписатели, пишбуквы", "ptitle": "Возврат каретки: пишмашинки, пишбарышни, пишписатели, пишбуквы", "subtitle": "", "date": "10 августа 2022", "perm": "https://www.facebook.com/story.php", "slug": "", "html": "<p><span class=\"dc\">П</span>ервые серийные печатные машинки появились в конце 60-х годов 19 века. Вроде бы, Марк Твен набирал «Тома Сойера» на чуть ли не на опытном экземпляре. Но революция печатания произошла чрезвычайно быстро.</p>\n<p>Граф Толстой, про которого мы думаем, что он от сохи и чуть ли не луддит, завел «Ремингтон» уже в семидесятых, и «Война и мир» ушли к издателю не в рукописи Софьи Андреевны, а отбитые на машинке. Сам граф не печатал, но дочерей своих эксплуатировал нещадно.</p>\n<p>К началу двадцатого века в России жестко конкурировали несколько западных фирм — Ремингтон, Ундервуд, Монарх, Корона, Континенталь, Мерцедес (не тот, что Даймлер-Бенц)…</p>\n<p>Первые машинки были «слепыми»: текущую строку не было видно. Поэтому, когда появились более продвинутые образцы, они специально рекламировались как «фул-визибль» — с читаемой активной строкой.</p>\n<p>Интересно разночтение в названии машин: «печатные» и «пишущие» — соответствующее их области применения — между письмом и печатью.</p>\n<p>В начале века машинки были дороги: «монарх-визибль» за 300 рублей бедный поэт вряд ли мог себе позволить. А вот успешный литератор мог.</p>\n<p>Нашествие печатных машин породило первую престижную чисто женскую профессию — машинистка, ремингтонистка, пишбарышня. Навык слепой скоростной десятипальцевой печати был одним из редких надеждых социальных лифтов для небогатых девушек. Настолько общепризнанных, что в США в конце 19 века рекламировали пишмашинку как способ сделать карьеру: машинистка —&gt; секретарша —&gt; супруга босса.</p>\n<p>Профессия машинистки была до такой степени женской, что для мужчин-скоропечатников не было слова «машинист». Машинист — это на паровозе. А за клавиатурой машинистка.</p>\n<p>Так, но когда же будет про буквы?</p>\n<p>Шрифт для пишмашин можно считать первым в истории настоящим техношрифтом. Его главная особенность — моноширинность. Площадки для букв было проще всего сделать одинаковыми по ширине — значит, буквам приходилось приспосабливаться к техзаданию.</p>\n<p>Заглавные слегка поджимали плечи. Трехмачтовые вроде Mm, Ww, Жж, Шш, Щщ совсем съёживались. А одномачтовые Ii, Jj, f, l, r, t обзаводились широкими горизонталями.</p>\n<p>Это очевидное уродство, повторенное миллионы раз на листах машинописи, стало мощным эстетическим приемом — вместе с дубоватой структурой текста, где буквы стоят не только строками, но и вертикальными рядами.</p>\n<p>В основе шрифта пишущих машинок — нечто вроде Кларендона. Египетский шрифт с минимальным контрастом и сильноразвитыми засечками. Он появился в середине 19 века и — удивительное дело — дожил до компьютерной эры, когда переродился в Курьер и прочие моноширинные шрифты для программеров.</p>\n<p>Конечно, были попытки разнообразить репертуар: гротески, курсивы, даже слитный скрипт попадался. Но тут в дело вступало главное правило: одна машинка = один шрифт. Нам, компьютерным, смешно, а тогда если начал набирать курсивом — всё, привет, на прямой не перейдешь. Поэтому чаще всего использовали прямое начертание.</p>\n<p>Ну, и конечно никакой смены раскладок. Если на клавишах кириллица — латиницу вписываем от руки. Я это видел в детстве в рукописях «Докладов Академии наук», которые редактировала мама. Вся статья на машинке, а формулы и даже отдельные буквы вроде a, b, c вписаны ручкой.</p>\n<p>В начале прошлого века машинки были настолько распространены, что вызвали обратную волну — типографские наборные шрифты, подражающие машинописным. В каталоге словолитни Гербек 1911 года есть шрифт, прямо рекламируемый: «представляет собой имитацию в настоящее время весьма распространенных пишущих машин» и «посредством оного могут быть изготовлены циркуляры поразительного сходства».</p>\n<p>Но самая удивительная «возвратка» от типографов машинисткам — каталог фирмы Бертгольд А. Г. 1923 года (позаимствованный из тг поста Евгения Григорьева). В нем не просто показаны разные шрифты, имитирующие машинописный набор, но и даны инструкции, как испортить набор типографский, чтобы его было не отличить от машинописного.</p>\n<p>Что меня сильно удивило — художники модерна и авангарда начала века не работали с пишущими машинками. Типографикой и набором увлекались, а вот соло на ундервуде не исполняли. Маяковский так и не научился стучать по клавишам (Бурлюк, правда, умел). Так что тема «буквы авангарда» будет в другой раз.</p>\n<p>[Как всегда, настойчиво рекомендую читать подписи к картинкам — там есть подробности, которых нет в теле поста].</p>", "figs": [["img/r10/r10-001.jpg", "r10-001", "<p>Лев Толстой и его Ремингтон</p>", 1.0], ["img/r10/r10-002.jpg", "r10-002", "<p>Underwood, он же Ундервудъ. Обратите внимание: на машинке не только кириллический логотип, но и сведения о реселлере: Г. Герлях, видимо, был крупным поставщиком Ундервуда</p>", 1.0], ["img/r10/r10-003.jpg", "r10-003", "<p>А вот уже полностью «окирилленый» Ундервуд</p>", 1.0], ["img/r10/r10-004.jpg", "r10-004", "<p>Мерцедес 3</p>", 1.0], ["img/r10/r10-005.jpg", "r10-005", "<p>Между «первая» и «лучшая» мелко написано «с видимым шрифтом»</p>", 1.0], ["img/r10/r10-006.jpg", "r10-006", "<p>Страница из толстого каталога, посвященная пишмашинам. Ремингтон, Ундервуд, Монарх, Гаммонд, Мерцедес, Стар, Смис-Визибл</p>", 1.0], ["img/r10/r10-007.jpg", "r10-007", "<p>Тонкая деталь: машина, изображенная технической торцовой гравюрой</p>", 1.0], ["img/r10/r10-008.jpg", "r10-008", "<p>300 рублей за «Монарх-Визибль». Не самая дорогая модель. На следующей странице — вариант за 325</p>", 1.0], ["img/r10/r10-009.jpg", "r10-009", "<p>Видный шрифт. 1910 г</p>", 1.0], ["img/r10/r10-010.jpg", "r10-010", "<p>Русская клавиатура ЙIУКЕНГ — такая же, как современная ЙЦУКЕНГ, но с десятеричной i на месте Ц</p>", 1.0], ["img/r10/r10-011.jpg", "r10-011", "<p>Шрифты пишущих машин. Один кириллический гротеск — я с ним еще не встречался. В массе — варианты малоконтрастного египетского</p>", 1.0], ["img/r10/r10-012.jpg", "r10-012", "<p>Это буквы из моего шрифта Эрика — моноширинного, конечно</p>", 1.0], ["img/r10/r10-013.jpg", "r10-013", "<p>Текст внизу набран хорошим увязистым кларендоном. 1890</p>", 1.0], ["img/r10/r10-014.jpg", "r10-014", "<p>Наборный шрифт, имитирующий пишущую машинку. Словолитня Гербек</p>", 1.0], ["img/r10/r10-015.jpg", "r10-015", "<p>Скелетный тонкий из каталога Гербек — близкий родственник пишмашиночного шрифта</p>", 1.0], ["img/r10/r10-016.jpg", "r10-016", "<p>Экспонат с ХисДокРу: типографский бланк с впечаткой на пишмашинке</p>", 1.0], ["img/r10/r10-017.jpg", "r10-017", "<p>Текст отречения Николая II. 1917. Марку машинки не знаю.</p>", 1.0], ["img/r10/r10-018.jpg", "r10-018", "<p>Письмо Льва Толстого с собственноручной правкой. 1910</p>", 1.0], ["img/r10/r10-019.jpg", "r10-019", "<p>Бертгольд А.Г. Каталог шрифтов, имитирующих машинопись. 1923 год. Обратите внимание на business as usual: в тексте милостивые государи, в нижнем блоке представительства в Питере и Москве. Где мировая война и большевики — непонятно.</p>", 1.0], ["img/r10/r10-020.jpg", "r10-020", "<p>Бертгольд А.Г. Каталог шрифтов, имитирующих машинопись. 1923</p>", 1.0], ["img/r10/r10-021.jpg", "r10-021", "<p>Бертгольд А.Г. Каталог шрифтов, имитирующих машинопись. Тот же шрифт после типографических ухищрений и порчи.</p>", 1.0], ["img/r10/r10-022.jpg", "r10-022", "<p>Бертгольд А.Г. Каталог шрифтов, имитирующих машинопись. Еще один пример подделки набора под машинопись.</p>", 1.0], ["img/r10/r10-023.jpg", "r10-023", "<p>Бертгольд А.Г. Каталог шрифтов, имитирующих машинопись. 1923. Курсивный шрифт с битыми альтернативными знаками.</p>", 1.0], ["img/r10/r10-024.jpg", "r10-024", "<b>Сатира из журнала «Печатник» 1927 года. Из коллекции канцелярского музея.</b><p>Здесь круто всё.<br>Во-первых, в советской нэпманской конторе должна быть машинка. Во-вторых, машинки продаются на базаре (помните фирму Г. Герлях? Всё, кончились дистрибьюторы). В-третьих, цена машинки — советская сотня (подешевела). В-четвёртых, латиница у нас теперь фашистский шрифт (пусть и в кавычках).<br>Ну, и наконец в-пятых — машинистка в короткой юбке и вообще сильно секси</p>", 1.0], ["img/r10/r10-025.jpg", "r10-025", "<p>Даже в 1998 году гр. Чер-в назывался «машинисткой пишущей машинки»</p>", 1.0], ["img/r10/r10-026.jpg", "r10-026", "<p>Реклама пишущей машинки начала 20 века.<br>Из коллекции канцелярского музея</p>", 1.0]], "research": null}, {"intro": false, "num": "11", "title": "Вывески времен цветущего капитализма", "ptitle": "Вывески времен цветущего капитализма", "subtitle": "", "date": "16 августа 2022", "perm": "https://www.facebook.com/story.php", "slug": "", "html": "<p><span class=\"dc\">О</span> вывесках написано много. Ссылки на несколько отличных материалов — в комментах. Прочитайте, постараюсь их не пересказывать. Моя задача — найти то, что обычно ускользает от внимания.</p>\n<p>Конец 19 — начало 20 века — эпоха вывесок. Никогда ни до, ни позже эта форма рекламы не была такой изумительно навязчивой. Даже близкородственная эра билбордов лет пятнадцать назад не знала такого массированного зарастания архитектуры рекламными конструкциями. На Невском и Тверской не осталось фасадов — отовсюду вопили буквы размером в полчеловека. Дома были похожи на гигантские афишные тумбы, оклеенные цирковыми плакатами. Это было чудовищно безвкусно — и дьявольски эстетично. Черно-белые фото не дают представления о рекламной какофонии. Все вывески были цветными — с золотом, радужными переливами, тенями, тройными контурами — со всеми ужас-ужасами, до каких пытался, но так и не додумался бедный компьютерный дизайнер эпохи первоначального фотошопа сто лет спустя.</p>\n<p>Вывески были мелкодетальными и многословными — ибо их жертвой становился пешеход — или, в крайнем случае, пассажир извозчика. Не скованные кодексами рекламной этики, продавцы давили на все чувства сразу. Это была счастливая эпоха юного, цветущего, беззаботного капитализма.</p>\n<p>К десятым годам в России сложилась довольно мощная индустрия наружной рекламы. Видимо, в основном это она состояла из артелей оформителей, но попадались и настоящие фирмы. Хочется сказать «дизайнерские», но нет — это все же еще брендинг без дизайна, хотя элементы будущих фирменных стилей стихийно появлялись.</p>\n<p>В одном заказе (о нем речь ниже) мне попалась брошюра астраханского рекламщика-самоучки, мастера вывесок.</p>\n<p>Изготовление наружки было еще ремесленным, штучным промыслом, но внутри него развивались собственные технологии — работа с железом, стеклом, изготовление объемных деталей — которые можно было поставить на поток. В России это только начиналось, а в Европе уже работало на промышленном уровне. В частности, астраханский рекламщик пишет, что до 1914 года имел прямые связи с немецкими производителями. То есть российские купцы и фабриканты к вывескам относились очень серьезно и готовы были заказывать «евродизайн».</p>\n<p>Брошюру можно скачать по ссылке. Посмотрите — там масса
