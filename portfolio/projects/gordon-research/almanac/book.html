 — и стилизованные под скоропись фамилии автора и художника.</p>\n<p>Технически обложка сделана мастерски: сложная плашечная раскладка на четыре краски, дающая эффект полнокрасочной печати.</p>\n<p>Последние пять лет советской вольницы характеризуются некоторым улучшением качества букв и даже попытками перейти от приблизительного «художественного рисования» к регулярному построению знаков.</p>\n<p>Что важно: государство ещё не взялось за упорядочение этой художественной формы. Воздух пока не выкачали, разнообразие не отменили. Через двенадцать лет, после войны, все эти вольности формализма будут жестко выскреблены, и в книжном оформлении настанет самая унылая и не очаровательная пора. Но это потом, а сейчас ещё есть на что посмотреть и даже чем погордиться.о</p>", "figs": [["img/r21/r21-001.jpg", "r21-001", "<p>Велимир Хлебников, Алексей Крученых<br>«Игра в аду»<br>Художник: Наталья Гончарова</p>", 1.0], ["img/r21/r21-002.jpg", "r21-002", "<p>Сергей Есенин<br>«Исус младенец»<br>Художник: Екатерина Турова<br>Издательство «Сегодня»</p>", 1.0], ["img/r21/r21-003.jpg", "r21-003", "<p>Натан Венгров<br>«Хвои»<br>Художник: Екатерина Турова<br>Издательство: «Сегодня»</p>", 1.0], ["img/r21/r21-004.jpg", "r21-004", "<p>«Сегодня». Натан Венгров<br>Художник: Вера Ермолаева<br>Издательство: «Сегодня»</p>", 1.0], ["img/r21/r21-005.jpg", "r21-005", "<p>Александр Кусиков<br>«Искандар Намэ»<br>Художник: Вера Александрова<br>Издательство: Имажинисты<br>1921-22</p>", 1.0], ["img/r21/r21-006.jpg", "r21-006", "<p>Евг. Замятин<br>«Большим детям сказки»<br>Издательство З.И. Гржебина<br>Петербург- Берлин</p>", 1.0], ["img/r21/r21-007.jpg", "r21-007", "<p>Сергей Есенин<br>Собрание стихов и поэм<br>Художник: Николай Зарецкий<br>Издательство З.И. Гржебина</p>", 1.0], ["img/r21/r21-008.jpg", "r21-008", "<p>Николай Дедюлин<br>Стихи<br>Художник: Николай Дедюлин<br>Самиздат.<br>Ярославль, 1922</p>", 1.0], ["img/r21/r21-009.jpg", "r21-009", "<p>Вадим Шершеневич, Матвей Ройзман<br>«Красный алкоголь  Госиздат</p>", 1.0], ["img/r21/r21-025.jpg", "r21-025", "<p>Редьярд Киплинг<br>«Откуда у кита такая глотка».<br>Перевод Корнея Чуковского<br>Перевод стихов Самуила Маршака<br>Художник: Эдуард Криммер<br>Издательство: ГОСИЗДАТ</p>", 1.0], ["img/r21/r21-026.jpg", "r21-026", "<p>Александр Неверов<br>«Голод»<br>Художник: Дмитрий Митрохин (?)<br>Издательство: ЗИФ<br>1926 (?)</p>", 1.0], ["img/r21/r21-027.jpg", "r21-027", "<p>Николай Асеев<br>«Красношейка».<br>Форзац левый (?)<br>Художник Натан Альтман<br>Издательство: ГОСИЗДАТ<br>1926</p><p>Прошу прощения, обложка убежала дальше )</p>", 1.0], ["img/r21/r21-028.jpg", "r21-028", "<p>Николай Асеев<br>«Красношейка».<br>Форзац правый (?)<br>Художник Натан Альтман<br>Издательство: ГОСИЗДАТ<br>1926</p><p>Прошу прощения, обложка убежала дальше )</p>", 1.0], ["img/r21/r21-029.jpg", "r21-029", "<p>Николай Асеев<br>«Красношейка».<br>Наконец-то обложка.<br>Обратите внимание: она не красная )<br>Художник Натан Альтман<br>Издательство: ГОСИЗДАТ</p>", 1.0], ["img/r21/r21-030.jpg", "r21-030", "<p>Эгон Эрвин Киш<br>«Неистовый репортёр»<br>Художник: ?<br>Издательство ЗИФ</p>", 1.0], ["img/r21/r21-031.jpg", "r21-031", "<p>Ольга Гурьян<br>«Двор».<br>Художник Борис Покровский<br>Издательство ЗИФ</p>", 1.0], ["img/r21/r21-032.jpg", "r21-032", "<p>Мария Соловьева<br>«Ёжик».<br>Художник Клавдия Козлова<br>ГОСИЗДАТ</p>", 1.0], ["img/r21/r21-033.jpg", "r21-033", "<p>Б. Самсонов (Борис Самохин)<br>«Мышиный писк»<br>Художник: R (?)<br>Издательство ЗИФ</p>", 1.0], ["img/r21/r21-034.jpg", "r21-034", "<p>Иван Саркизов-Серазини<br>«Лечитесь солнцем»<br>Художник Л.Ф.<br>Издательство ЗИФ</p>", 1.0], ["img/r21/r21-035.jpg", "r21-035", "<p>Обложка альманаха «Земля и фабрика»<br>Выпуск: 5<br>Художник: Сергей Чехонин<br>Издательство ЗИФ<br>1927-1931</p>", 1.0], ["img/r21/r21-036.jpg", "r21-036", "<p>Семен Кирсанов<br>«Моя именинная»<br>Художник Е. Рождественская<br>Издательство ЗИФ</p>", 1.0], ["img/r21/r21-037.jpg", "r21-037", "<p>Путеводитель по театрам Л азать меньше</p>", 1.0], ["img/r21/r21-063.jpg", "r21-063", "<p>Дм. (Борис) Четвериков<br>«Заграничный Степан»<br>Художник Л. Воронов<br>Издательство ЗИФ<br>1932 Показать меньше</p>", 1.0], ["img/r21/r21-064.jpg", "r21-064", "<p>Илья Сельвинский<br>«Тихоокеанские стихи»<br>Художник Лев Эппле<br>Издательство Московское товарищество писателей<br>1934 Показать меньше</p>", 1.0], ["img/r21/r21-065.jpg", "r21-065", "<p>Илья Сельвинский<br>«Улялаевщина»<br>Художник: ?<br>Издательство ОГИЗ ГИХЛ<br>1934 Показать меньше</p>", 1.0], ["img/r21/r21-066.jpg", "r21-066", "<p>Владимир Луговской<br>Однотомник<br>Художник: (?)<br>ГОСЛИТИЗДАТ<br>1935 Показать меньше</p>", 1.0], ["img/r21/r21-067.jpg", "r21-067", "<p>Самуил Маршак<br>«О глупом мышонке».<br>Художник Владимир Лебедев<br>ОГИЗ ДЕТГИЗ<br>1935 Показать меньше</p>", 1.0]], "research": null}, {"intro": false, "num": "22", "title": "Случай Фаворского, 1918-1934", "ptitle": "Случай Фаворского, 1918-1934", "subtitle": "О более поздних работах WF — в следующих главах книги", "date": "6 декабря 2023", "perm": "https://www.facebook.com/100000723643455/posts/7255431497824233/", "slug": "", "html": "<p><span class=\"dc\">М</span>не и сложно, и просто писать о Фаворском. Сложно потому, что уже очень много написано, и просто — потому что WF — важнейшая лично для меня фигура.</p>\n<p>Я стал заниматься тем, чем занимаюсь, во многом насмотревшись и начитавшись Фаворского лет сорок пять назад — и внутренний диалог с ним не окончен до сих пор.</p>\n<p>Фаворский считается мастером шрифта, но — имея за плечами опыт шрифта WF, оммажа Владимиру Фаворскому — могу сказать уверенно: он не был шрифтовиком, хотя награвировал, наверное, тысячи букв.</p>\n<p>Фаворский был типографом и композитором, а в отношении букв — визуальным поэтом. То, как он описывает отдельные буквы и типы шрифтов, свидетельствует о серьезнейших отношениях с плоскостью листа и техникой печати, а также со звуком — но никак не о шрифте как целом организме. И уж совсем не о «наборе подвижными литерами». Буква у WF не может изменить позицию на листе: она часть доски. Так даже маленький островок не сдвинуть с места: он врос в шельф.</p>\n<p>Мало того — Фаворский много и последовательно разрушает гладкий ритм надписей, чтобы добиться чисто композиционной выразительности пятна. Типограф-наборщик никогда бы не стал так делать, но для WF за листом всегда лежит цельная самшитовая доска, где белое — просто углубленное черное.</p>\n<p>Фаворский не признаёт _текста_ потому, что игнорирует строчные. Он мастер надписей — не текстов — не с Заглавной, а из ОДНИХ ЗАГЛАВНЫХ букв. Даже в наборном титуле журнала «ссср на стройке», явно сверстанном по эскизу WF, нет ни одной (!) строчной.</p>\n<p>Удивительным образом Фаворский почти всю жизнь оперировал «гарнитурой Фаворского» — гравированной антиквой с круглыми ОС, очень широко шагающей А и сверхвыразительно искаженной К с длинным высунутым языком. Эти буквы восходят к Академической гарнитуре, которая, в свою очередь, есть искажение a la rus английского Челтенхема. То есть главный шрифт Фаворского родом из стиля модерн в той его части, что связана с эклектикой времён промышленной революции.</p>\n<p>Буквы Фаворского, впервые появившиеся около 1918 года, уже тогда смотрелись архаично на фоне позднего модерна Чехонина, уж не говоря о драных кошках футуристов и палочных композициях конструктивистов.</p>\n<p>Фаворский не только внешне похож на Толстого — его вещи по-толстовски увесисты и основательны, и даже как бы вневременны. Но это только с одной стороны.</p>\n<p>Другая — изощренность в деталях и метафоричность. Во времена, когда буквы гарцевали, и словно кони, прыгали на месте, WF тщательно расставляет все акценты. Его титулы двадцатых несравненно более точно и тонко работают с формой и звуком текста, чем любые заумные или дадаистские каллиграммы. В этом отношении Фаворский — поразительно — близок к Мандельштаму.</p>\n<p>В своих рассуждениях о шрифте Фаворский делит буквы на объемные, пространственные, плоские и скелетные, но сам он — художник плоскости. Пространство в его гравюрах не иллюзорное, но умозрительное. Все его вещи без исключения — доски. Даже то, что отчетливо уходит в перспективу, у WF остается лежать на листе. И это мощнейшее, лучшее оружие Фаворского.</p>\n<p>Именно поэтому, попытавшись изменить доске в гравюрах к «Слову о полке Игореве» он потерял гораздо больше, чем приобрел.</p>\n<p>Еще одно важное наблюдение: Фаворский книжник, но не просто книжный художник, но художник книги-кодекса, читаемой слева направо. Он всегда знает, на какой — левой или правой — полосе живёт картинка. Он тщательно избегает строгих центральных композиций, потому что книга идёт, а не стоит на месте. И даже люди в гравюрах Фаворского почти всегда идут вдоль листа слева направо, сами похожие на буквы.</p>\n<p>Если верна заповедь «гравёр, береги чёрное» — то Фаворский редкостный мот и транжира. В его лучших титулах черного от силы 10 процентов. Правда, это очень сочный чёрный. Но если почувствовать композиции Фаворского не как собрание оттиснутых штрихов, но как цельные доски, становится физически понятно, какой плотный у него белый.</p>\n<p>Что же до наборной типографики, мне кажется, WF не слишком ей интересовался. Он больше монументалист, архитектор и поэт, чем начетчик абзацев и отбивок. За многими его роскошными обложками скрываются скучнейшие наборные титулы с выключкой по центру, никак не соотнесенные с наружкой ни по композиции, ни по шрифтовому наполнению. И конечно, там часто мелькает Академическая — такая аристократичная в советском наборе и такая серая мышка рядом по-настоящему барственными буквами Фаворского.</p>\n<p>Еще одна важная черта Фаворского — некоторая неуклюжесть. Это видно и в буквах, и особенно в натурных рисунках. Фаворский всегда ищет сопротивления материала, и если материал начинает подаваться, WF от себя додает упорства фигурам и буквам. Эта всегдашняя досказанность и упрямство формы (при высочайшем мастерстве гравёра и удивительно изобретательных пропусках) — фирменный приём Фаворского.</p>\n<p>Фаворский наплодил фаворят, но так и остался одинокой скалой в советской книжной графике, да и вообще в культуре. Всегда старообразный с виду. Слишком смелый и независимый по сути. Никогда по-крупному не модный, но всеми признанный как образец. Накатом истины сияющий сквозь воск, как точно сказал ОМ, не сумевший отличить высокую печать от глубокой.</p>\n<div class=\"orn\" role=\"separator\"><b></b></div>\n<p>Подробный разбор композиций и букв я решил убрать в комменты к картинкам. Так проще сосредоточиться на деталях.</p>\n<p>Большинство иллюстраций позаимствовано из публикаций в журнале «Шрифт». Ссылки в комментах.</p>", "figs": [["img/r22/r22-001.jpg", "r22-001", "<p>Портрет художника Истомина<br>Гравюра на дереве. (дальше пойдут сплошь гравюры, поэтому технику буду упоминать только когда не гравюра)<br>1918</p><p>Фаворский без шрифта Фаворского</p>", 1.0], ["img/r22/r22-002.jpg", "r22-002", "<b>Обложка, 1919</b><p>Может быть, один из первых заходов на антикву WF. Буквы пока узкие, и даже есть вынос вверх, но форма явно на подходе</p>", 1.0], ["img/r22/r22-003.jpg", "r22-003", "<b>Заставка или обложечная гравюра.<br>1921</b><p>Вот она, Афина из головы Зевса: шрифт Фаворского с самого начала был таким, как на всем известных картинках с его алфавитом.<br>Что интересно: композиция пока что строго центральная, но WF ищет способ ее расшатать при помощи не совсем симметричных серых штриховок</p>", 1.0], ["img/r22/r22-004.jpg", "r22-004", "<p>Упс, шаг назад, в 1920 год. Правда, «Озорные сказки переиздавались в 1922 (см. след. картинку).</p><p>Фаворский очень талантливо и очень эклектично упражняется в квазиисторическом леттеринге. Чего тут только нет — от устава до протоантиквы. А в целом композиция из прошедшей эпохи арнуво</p>", 1.0], ["img/r22/r22-005.jpg", "r22-005", "<p>В издании 1922 года титульный текстовый блок перегравирован заново. К нему добавлены выходные данные в том же стиле</p>", 1.0], ["img/r22/r22-006.jpg", "r22-006", "<p>Спусковая полоса из тех же «Озорных сказок» 1922 г.<br>Буквы Фаворского очень органично смотрятся с текстом, набранным Пальмирой. А буквица А — фирменная, широко шагающая. Можно было ее строк на пять раскатать</p>", 1.0], ["img/r22/r22-007.jpg", "r22-007", "<b>Обложка, 1922</b><p>Ну вот, наконец-то: «центральная композиция» по Фаворскому. Смотрим сверху вниз, на ось: Р в фамилии автора — Ф в названии — ствол дерева — нижний блок текста. Во-первых, сама ось не по центру. Во-вторых, сама ось не строго вертикальная. Но пуще того: посередине вообще никак не расключенный блок «комедия…»<br>И сигнатура WF, показывающая (строго по линии взгляда людей за столикосм), что мы имеем дело динамической системой.</p><p>Ну и какая же Ф! Наглядеться не могу )</p><p>(Кстати, на моей карте Петергофа лого никак не связано с этой кофейней. Но видать, об одном и том подумали — с разницей в сто лет) Показать меньше</p>", 1.0], ["img/r22/r22-008.jpg", "r22-008", "<p>Обложка журнала о печати с кучей нарезанного от руки текста. 1923 год. Советские типографии еще не совсем пришли в себя после национализации: проще погонять гравера, чем метранпажа найти.</p><p>Буквы Ж и К здесь смотрятся почти пародией на «классического» Фаворского. Но в целом даже странно, как быстро художник нашел свою модель на всю жизнь Показать меньше</p>", 1.0], ["img/r22/r22-009.jpg", "r22-009", "<p>Титул «Печати и революции». 1923<br>Вот это, господа, полный абзац: весь титул написан от руки. Или вырезан?<br>Показать меньше</p>", 1.0], ["img/r22/r22-010.jpg", "r22-010", "<b>Обложка, 1923</b><p>И пошла игра с осями. Это то, о чем было в тексте: визуальная поэзия, где каждая буква имеет пару (например, К из слова «маски» заигрывает с Л из слова «лица»). Нет ничего случайного, но всё — авторская прихоть, чистый формализм.</p><p>Особенно почему-то люблю этот столик на колесике с полувазой-стоппером Показать меньше</p>", 1.0], ["img/r22/r22-011.jpg", "r22-011", "<b>Обложка, 1923.</b><p>Фаворский пока увлечен параллельной штриховкой и разнотоновыми плашками, поэтому буквы еще не набрали веса.</p><p>Опять полуоткрытая композиция с полурамкой, шагающей вверх Показать меньше</p>", 1.0], ["img/r22/r22-012.jpg", "r22-012", "<b>Титул распашной. 1923</b><p>Контрапункт к динамической обложке с двумя как бы центрированными страницами.</p><p>Заметим, однако: на левой полосе справа внизу ворон убил симметрию, на правой ему ответил непойми зачем упавший на трагедию завиток Показать меньше</p>", 1.0], ["img/r22/r22-013.jpg", "r22-013", "<b>Обложка, 1923.</b><p>Не хочу ловить символы. Отмечу только ось через автора — как —<br>. Эта ось ничего не держит, кроме самой себя. Очень странная обложка, наверное тебе, Олег Пащенко, понравится Показать меньше</p>", 1.0], ["img/r22/r22-014.jpg", "r22-014", "<b>А вот эти «Мнимости», кажется 1924 года, сделали из меня художника книги.</b><p>По-моему, поразительно тонкая визуально-поэтическая работа с названием. Опущенные в туман МН — и заглавная вторая М, более сильная, чем первая. Продернутые белым ТИ и кусок «геометрии».</p><p>Наконец, игрек с иксом, читаемые как «УХ».</p><p>И такое соло сетками на гравюрных, что просто нет слов. Кто держал в руке штихель — поймёт мой восторг. Но главное — вся эта роскошь абсолютно уместна, она добавляет плотности и уважения к предмету книги Показать меньше</p>", 1.0], ["img/r22/r22-015.jpg", "r22-015", "<b>Марка издательства, год не нашел.</b><p>Если вы не догадывались, что Фаворский не Чехонин — вот наглядный пример. Особенно забавно похилилось «из» Показать меньше</p>", 1.0], ["img/r22/r22-016.jpg", "r22-016", "<b>Обложка (или авантитул?) 1925</b><p>А вот обратный пример — Чехонин бы так не смог.<br>Главный герой — Ферт, ставший Фитой, трансгендер леттеринга, показывающий крест там, где нет Христа. А парой к нему царственная ударная У, а по сторонам их дети-близнецы: мальчик Р и девочка Ерь.</p><p>Вся композиция являет круг, медленно кружащий вокруг Солнца в центре. И строки названия не режут, но вписаны в этот плавный ход светил Показать меньше</p>", 1.0], ["img/r22/r22-017.jpg", "r22-017", "<b>Титул распашной. MCMXXV</b><p>Налево не смотрим: там одна из лучших гравюр WF.</p><p>Смотрим направо: треугольник названия со снопом внизу скрещивается с Москвой и годом через длинную строку издателя (отбитую в рифму линейкой сверху).</p><p>Если бы на этом титул закончился — он был бы лёгок и воздушен. Но в него встроен центрированный блок с переводчиком, намного усложняющий игру. Кому он ответ?</p><p>Конечно, фигуре Руфи на левой полосе Показать меньше</p>", 1.0], ["img/r22/r22-018.jpg", "r22-018", "<b>Обложка, MCMXXV</b><p>Еще одна хитрая осевая игра Фаворского.</p><p>Казалось бы, ось слева: мощный черный столб.<br>Ан нет: центр внимания проходит от автора через У и колпак Петрушки на издательский блок, но</p><p>На этой оси всё не отцентровано. Буквы улезают вправо и теряют вес во всех строках, чтоб удержать равновесие. И тут мы видим, что кукла указывает внутрь книги, а столб слева указывает на плашку справа, а силуэт падает по движению, а мальчик-зритель белой своей головёнкой целится в точку, куда показывает кукла, одновременно являясь второй ножкой табуретки, первая из которых столб слева.</p><p>В доме, который построил WF Показать меньше</p>", 1.0], ["img/r22/r22-019.jpg", "r22-019", "<p>Обложка, на которой царь работает запятой между двумя своими именами. 1929 Показать меньше</p>", 1.0], ["img/r22/r22-020.jpg", "r22-020", "<b>Титул распашной от тех же Петров. 1929</b><p>Обратите внимание на наборный кавардак справа, дополненный падающей гравюрой. Наверняка авторский.</p><p>И больше никогда не называйте Фаворского шрифтовиком. Он художник-гравер и типограф. Показать меньше</p>", 1.0], ["img/r22/r22-021.jpg", "r22-021", "<b>Разворотная гравюра. 1928.</b><p>Люди-буквы, Ленин выделен полужирным Показать меньше</p>", 1.0], ["img/r22/r22-022.jpg", "r22-022", "<b>Разворотная гравюра. 1928.</b><p>Фаворский не только буквы сразу придумал, но и цифры.</p><p>А вот слово «ГОЛОД» упавшее справа — почти точное воспроизведение Рубленой гарнитуры Бертгольда Показать меньше</p>", 1.0], ["img/r22/r22-023.jpg", "r22-023", "<b>Обложка, 1929</b><p>Опять игра осей с расцентровкой по факту и центровкой по массам. Заметьте, как незаметно набирают к центру вес и стать буквы в обеих строках названия Показать меньше</p>", 1.0], ["img/r22/r22-024.jpg", "r22-024", "", 1.0], ["img/r22/r22-025.jpg", "r22-025", "<b>Обложка. MCMXXX</b><p>Русская литературная пародия Владимира Фаворского на самого себя.<br>Любопытно: имеет ли эта картинка какую-нибудь связь с обложкой «Парнас дыбом» из прошлой главы «Букв 20 века»?</p>", 1.0], ["img/r22/r22-026.jpg", "r22-026", "<b>Обложка, 1930<br>Редкость у WF: полуустав.</b><p>Начиная отсюда, сейчас пойдет череда конных и пеших, идущих слева направо (а иногда справа налево)</p>", 1.0], ["img/r22/r22-027.jpg", "r22-027", "<b>Обложка, 1930</b><p>Редкость: товарищи идут не в книгу, а из нея</p>", 1.0], ["img/r22/r22-028.jpg", "r22-028", "<b>Титул той же книги, 1931</b><p>Не правда ли, странно? Так и хочется сказать: демонстранты соскучились и решили не ходить дальше обложки</p>", 1.0], ["img/r22/r22-029.jpg", "r22-029", "<b>Обложка, 1931</b><p>В начале 30-х Фаворский полюбил гротеск и стал им мощно пользоваться.</p><p>И снова нарушенная центральная композиция</p>", 1.0], ["img/r22/r22-030.jpg", "r22-030", "<b>Серийная обложка, 1931.</b><p>Забавно: впечатанная литера V со страху попала в рифму фигурке с гравюры</p>", 1.0], ["img/r22/r22-031.jpg", "r22-031", "<b>Обложка (или супер?) 1931</b><p>Одна из нескольких двухкрасочных работ Фаворского, показывающая, что первую плоскость книги он упорно моделировал как плоскость: силуэтами и гротеском</p>", 1.0], ["img/r22/r22-032.jpg", "r22-032", "<p>Титул той же книги. 1931<br>Опять странности набора</p>", 1.0], ["img/r22/r22-033.jpg", "r22-033", "<b>Суперобложка. 1932</b><p>Гравюра убита наповал серой плашкой. Чтоб не мечтала создать иллюзию глубины</p>", 1.0], ["img/r22/r22-034.jpg", "r22-034", "<p>Ой. Переплет той же ночи. 1932<br>Неужели это Фаворский сделал?</p>", 1.0], ["img/r22/r22-035.jpg", "r22-035", "<b>Уфф. Титул распашной. 1932</b><p>Лучший пример того, что WF мыслил досками, породивший шикарный постмодернистский клиповый прием.</p><p>Где у лошадок головки?<br>А доска кончилась!<br>А доклеить доску?</p><p>Как вы смели такое предложить?!</p><p>…а конница всё идет слева направо Показать меньше</p>", 1.0], ["img/r22/r22-036.jpg", "r22-036", "<b>Переплет с запечаткой. 1932</b><p>Редчайший случай: WF не успел нарезать гравюры!<br>В 1932 году он столько всего нарезал, что на бронепоезд, видать, не хватило самшита.</p><p>И сразу стало видно, какие забавные у него человечки, когда выберутся из монумента Показать меньше</p>", 1.0], ["img/r22/r22-037.jpg", "r22-037", "<p>То ли титул, то ли оборот форзаца и спуск, не пойму. Та же книга, что на прошлой картинке. 1932</p><p>…а пешие всё идут слева направо, за конными вслед Показать меньше</p>", 1.0], ["img/r22/r22-038.jpg", "r22-038", "<b>Суперобложка. 1932</b><p>Одна из лучших силуэтных гравюр Фаворского (там еще труп на задней сторонке). Наглядное пособие по уплощению и пропуску форм Показать меньше</p>", 1.0], ["img/r22/r22-039.jpg", "r22-039", "<b>Переплет той же книги в развороте. 1932</b><p>Замаскированная Ф Показать меньше</p>", 1.0], ["img/r22/r22-040.jpg", "r22-040", "<b>Совершенно удивительный скифский форзац того же Пильняка. 1932</b><p>Если искать пример максимально нелепой, но дивно выразительной фигуры у Фаворского — то вот он Показать меньше</p>", 1.0], ["img/r22/r22-041.jpg", "r22-041", "<b>Ой. Титул распашной той же книги. 1932</b><p>Вдруг возникло почти реальное пространство и почти фотографический самолет. Гравюра, больше похожая на коллаж Родченко. Гравюра отличная, но зачем? Показать меньше</p>", 1.0], ["img/r22/r22-042.jpg", "r22-042", "<b>Суперобложка. 1932.</b><p>Видимо, эта лучшая? Или та, с парой?<br>Как-то неловко говорить о мастерской работе в две краски, где снег напечатан серым по белому Показать меньше</p>", 1.0], ["img/r22/r22-043.jpg", "r22-043", "<b>Титул распашной. 1932</b><p>Этот лучший у WF, или есть конкуренты?</p><p>По-моему, здесь достигает предельной плотности белый.<br>Все пропущенные части доски оттиснуты с той же силой, что и черные силуэты.<br>А буквы слегка подтаивают к правому краю, и это не просто так.<br>Это глоток воздуха, не дающий картинке приклеиться к развороту и немного растворяющий белый слой Показать меньше</p>", 1.0], ["img/r22/r22-044.jpg", "r22-044", "<b>Переплёт. 1932</b><p>Челобуква молниеносит Показать меньше</p>", 1.0], ["img/r22/r22-045.jpg", "r22-045", "<p>Форзац той же книги. 1932.<br>Не сразу видишь, что это одна гравюра дважды Показать меньше</p>", 1.0], ["img/r22/r22-046.jpg", "r22-046", "<b>Титул распашной. 1932</b><p>Только на доске можно допустить такое приклеивание автора к иллюстрации. Как будто он подпрыгнул из-за забора. Казалось бы: сделали фото, расклеили немного. Неть Показать меньше</p>", 1.0], ["img/r22/r22-047.jpg", "r22-047", "<b>Отсюда и сильно дальше пойдет серия картинок к собранию сочинений Мериме 1933 года.</b><p>Это далеко не лучший Фаворский, но очень любопытный.</p><p>Например, зачем он пришил плашку с буквами такими пупочками? Показать меньше</p>", 1.0], ["img/r22/r22-048.jpg", "r22-048", "<b>Мериме, первый форзац. 1933</b><p>Очень интересная голубая плашка Показать меньше</p>", 1.0], ["img/r22/r22-049.jpg", "r22-049", "<b>Мериме, фронтиспис. 1933</b><p>Если Толстой буква, и Ломоносов буква — почему Проспер не буква? Тоже буква, несет книжку в книжку Показать меньше</p>", 1.0], ["img/r22/r22-050.jpg", "r22-050", "<b>А вот, наконец, и Академическая на титуле.</b><p>Почему верхние блоки правой полосы так подпрыгнули? Не знаю Показать меньше</p>", 1.0], ["img/r22/r22-051.jpg", "r22-051", "<b>Мериме 1933, шмуцтитул</b><p>Опять та же центровка с акцентом направо Показать меньше</p>", 1.0], ["img/r22/r22-052.jpg", "r22-052", "<b>Мериме 1933, задний форзац.</b><p>На первом дама вылезала из плашки налево, на последнем лошадка ускакивает направо Показать меньше</p>", 1.0], ["img/r22/r22-053.jpg", "r22-053", "<p>Мериме 1933.<br>Титул тома? Обложка?<br>Таких будет четыре. И самое странное здесь — фамилия автора, прорывающая плашку, но не всеми буквами Показать меньше</p>", 1.0], ["img/r22/r22-054.jpg", "r22-054", "<b>Мериме, суперобложка? 1933</b><p>Здесь три гравюры: верхняя серийная, средняя с заглавием, нижняя была уже в другой компании Показать меньше</p>", 1.0], ["img/r22/r22-055.jpg", "r22-055", "<b>Мериме, суперобложка, 1933</b><p>Заметили, что средние части, с названиями, не то, чтоб очень точно повторяют буквы друг друга? Показать меньше</p>", 1.0], ["img/r22/r22-056.jpg", "r22-056", "<b>Мериме, суперобложка, 1933</b><p>Понимаю, что многовато.<br>Но оцените, сколько нарезал один гравер за один год Показать меньше</p>", 1.0], ["img/r22/r22-057.jpg", "r22-057", "<b>Мериме, переплёт. 1933.</b><p>Фаворский всегда поворачивается спиной к корешку. Максимально сильно прочувствованная книга-как-объект Показать меньше</p>", 1.0], ["img/r22/r22-058.jpg", "r22-058", "<p>Мериме, титул. 1933 (?)<br>Опять Академическая Показать меньше</p>", 1.0], ["img/r22/r22-059.jpg", "r22-059", "<b>Последняя книга-как-объект: классическая Vita Nova 1934 года. Футляр и переплёт.</b><p>Эти восемь букв Фаворского ближе всего к леттерингу Рерберга, более легкому и контрастному. Но ширина шага не даст обмануться Показать меньше</p>", 1.0], ["img/r22/r22-060.jpg", "r22-060", "<b>Титул распашной. 1934</b><p>Все классические приемы WF вместе: разбитая центральная композиция, отдельно стоящая буква-символ, движение направо, подчеркнутое взглядом Данте.</p><p>И, конечно же, шрифт Фаворского, заметно поплотневший и расширившийся. Показать меньше</p>", 1.0], ["img/r22/r22-061.jpg", "r22-061", "<p>Бонус-трек: наборный титул журнала «ссср на стройке», выполненный по макету Фаворского. 1935</p><p>Я ошибся: две строчки строчных здесь все-таки есть.<br>Правда, не исключено, что так мелко в кегль и так глубоко в подвал мастер не заглядывал Показать меньше</p>", 1.0]], "research": null}, {"intro": false, "num": "23", "title": "Первые советские товарные знаки", "ptitle": "Первые советские товарные знаки", "subtitle": "", "date": "18 марта 2024", "perm": "https://www.facebook.com/yuri.gordon/posts/pfbid02AK8ebMLPQmkMbJ7C7c3Fx5s1RpD3ENTSbM5eTcw84yyufNmLCngHfqKLnJ8XcvGml", "slug": "", "html": "<p><span class=\"dc\">Д</span>олго не мог себя заставить написать о советских товарных знаках от 1917 до начала 30-х. У этой нерешительности две причины.</p>\n<p>Во-первых, на эту тему довольно много написано, и написано толково. Ссылки в комментариях. Сказать что-то принципиально новое сложно, а повторять чужое не хочу.</p>\n<p>Во-вторых — и это главное — писать не хотелось, потому что среди массы значков, эмблем, композиций и чуть ли не гербов почти нет шедевров. Скучно. Особенно глядя на то, как в это же время развивался дизайн товарных знаков на Западе. Там тоже не счесть мусора, но жизнь прёт из каждой буквы.</p>\n<p>Но всё же давайте пройдемся по тем образцам, что я накопал в сети — каюсь, не экскаватором, а детским совком.</p>\n<p>Среди советских знаков самой первой поры лучше всего смотрятся те, что сделал Чехонин или его эпигоны в стилистике революционного арнуво. Это динамичные и эстетские композиции, где читаемость — далеко не главное. Важнее эффектное пятно и мастерское плетение букв.</p>\n<p>Возможно, самая известная чехронинская эмблема — Отдел изобразительных искусств Наркомпроса, 1919 года. Там есть всё: композиция в круге со спиральным центростремительным движением; серп-и-молот, запутавшийся в буквах; слияния и поглощения знаков; внезапные провалы в выворотку. Словом, мастер не посчитался с расходом графита и туши. А заказчики не приставали с читаемостью.</p>\n<p>«Что скажете, товарищ Луначарский? — Ааа-эээ-мнэ — свежо!»</p>\n<p>«Принято, товарищ Чехонин. Пройдите в кассу».</p>\n<p>Среди чехониноподобных знаков есть эмблема Ателье мод Москвошвея, подписанная ДМ. Неужели Дмитрий Митрохин мимикрировал под конкурента?!</p>\n<p>Самая большая подборка у меня (и самая плохая по качеству картинок) взята с сайта Музея торговли (ссылка в комменте). Судя по всему, это несколько страниц из какого-то каталога товарных знаков. По шрифтам и оформлению предположу, что он был составлен в 30–40-е годы прошлого века. К сожалению, на картинках мало что можно разобрать, да и в подписях тоже.</p>\n<p>Из того, что видно: знаки как правило сложные, в основном очень архаичные даже для того времени. Похоже, это связано с особенностями тогдашнего законодательства, наследовавшего дореволюционному. Но до октября 1917 всё же знаки были значительно интереснее. А там, где хотелось сделать остро и модно, не хватило дизайнерского умения.</p>\n<p>И всё это потому, что после 1917 года исчезла рекламная индустрия, и даже НЭП не сумел поднять ее на дореволюционную высоту. А там пошли пятилетки, конкуренция и частное производство накрылись, и товарные знаки потеряли главное своё назначение: быть звездой во лбу бренда и сиять ярче, чем у соседа по рынку.</p>\n<p>Из любопытного — история про войну товарных знаков двух советских жирокостных трестов (так в ссср называли парфюмерные фирмы). Смотрите подписи к картинкам.</p>\n<p>И еще одна история — про знаменитый на весь мир Красный Треугольник, покрасневший задолго до национализации. Марка была настолько хорошо продвинута досоветскими маркетологами, что долго еще продавала галоши и автомобильные шины по всему глобусу.</p>\n<p>Третий микроцикл в подписях под картинками посвящен кооперативу Интом, выпускавшему бритвенные лезвия. Это предприятие очень долго, до конца тридцатых, уворачивалось от национализации, меняя названия и официальные профили. Но в конце концов было проглочено какой-то госструктурой.</p>\n<p>Последняя подборка — знаки и логотипы двух советских автозаводов. Первый — АМО, он же ЗИС, он же ЗИЛ, второй ГАЗ.</p>\n<p>Автомобильные логотипы очень рано формализовались — ведь они украшали радиатор, как герб — рыцарские щиты. А значит, должны были стать эффектными, лаконичными и легко запоминаемыми. Так что здесь всё не так печально.</p>\n<p>Не знаю, откуда взялся дореволюционный круглый знак АМО (Автомобильное Московское Общество, товарищество на паях). Любопытно, как он менялся, пытаясь не отстать от времени.</p>\n<p>А вот первый логотип ГАЗ — производное от овала Форда, потому что сначала это был сборочный цех американских авто.</p>\n<p>В качестве постскриптума к главе — пара картинок с американской барахолки. Просто для сравнения с товарными знаками солидных советских трестов. Это даже не подборка, а прямо блошиный рынок.</p>\n<p>Выложившие эти листы характеризуют их так: «Эти старые торговые марки являются народным искусством в индустрии графического дизайна, и, как и в случае с любым народным искусством, здесь не применялось никаких правил. Скорее всего, они были созданы художниками-самоучками, писавшими от руки надписи, и иллюстраторами, которые не зацикливались на надлежащем использовании пробелов, капителей или интервалов между буквами, но, вероятно, им всё же следовало бы это сделать».</p>\n<p>Мне кажется, сравнение сразу показывает, почему дизайн расцветает при свободном рынке и вянет в его отсутствие.</p>", "figs": [["img/r23/r23-001.jpg", "r23-001", "<b>Сергей Чехонин. Марка издательства «Сирена». 1918</b><p>Чехонинский стиль досоветского периода</p>", 1.0], ["img/r23/r23-002.jpg", "r23-002", "<b>Сергей Чехонин. Эмблема Отдела изобразительного искусства Наркомпроса. 1919</b><p>Классика советского арнуво</p>", 1.0], ["img/r23/r23-003.jpg", "r23-003", "<b>Сергей Чехонин. Отдел по делам музеев и охране памятников искусства и старины. 1920</b><p>Внимательно отточкованный в бекграунде РСФСР практически не считывается</p>", 1.0], ["img/r23/r23-004.jpg", "r23-004", "<p>Сергей Чехонин. Эмблема Трансбалтъ (еще в старой орфографии). Балтийский морской транспорт. 1918</p>", 1.0], ["img/r23/r23-005.jpg", "r23-005", "<p>Сергей Чехонин. Заставка «Балтийский морской транспорт». 1919</p>", 1.0], ["img/r23/r23-006.jpg", "r23-006", "<p>Сергей Чехонин. Логотип Государственного Петроотеля. 1922</p>", 1.0], ["img/r23/r23-007.jpg", "r23-007", "<p>Сергей Чехонин. Эмблема «Два года Р.С.Ф.С.Р».. 1920</p>", 1.0], ["img/r23/r23-008.jpg", "r23-008", "<p>Сергей Чехонин. Эмблема к десятилетию революции. 1927</p>", 1.0], ["img/r23/r23-009.jpg", "r23-009", "<p>Сергей Чехонин. Почтовая марка к пятилетию РСФСР с очень харантерной монограммой. Номинал 150 еще не червонных рублей.</p><p>У меня такая есть. В Москве осталась</p>", 1.0], ["img/r23/r23-010.jpg", "r23-010", "<b>Сергей Чехонин (?) Эмблема Севзапторга. Начало 1920-х</b><p>Подписи нет, но уж больно чехонинские буквы, композиция и расцветший серпомолот</p>", 1.0], ["img/r23/r23-011.jpg", "r23-011", "<b>Ателье мод Москвошвей МСНХ. Начало 1920-х</b><p>Подпись ДМ. По стилю похоже на Чехонина, но буквы все же другие. Мне кажется, это Митрохин</p>", 1.0], ["img/r23/r23-012.jpg", "r23-012", "<p>Сергей Чехонин. Народное хозяйство. Эскиз эмблемы. 1920-е</p>", 1.0], ["img/r23/r23-013.jpg", "r23-013", "<p>Червонец 1922 года. На Гознаке явно оставались специалисты по рисованию денег. Здесь нет логотипов, но есть сложнейшая, с гильошами, монграмма РСФСР. Всё точно, солидно, старорежимно. Обращает внимание большое количество «славянского» шрифта. И факсимиле подписей бухгалтеров, чего в дальнейшем не было</p>", 1.0], ["img/r23/r23-014.jpg", "r23-014", "<b>Первый лист каталога товарных знаков из собрания Музея торговли. Видимо, начало 1930-х.</b><p>СЕВЗАПТОРГ, КРАСНАЯ ЭТНА, Гострест ДВИНОЛЕС (DL), КОЖМАШИНА (КМ); Тверской трест (два раза); Серпуховской трест</p><p>Кроме «чехонинского» Севзапторга любопытна Кожмашина — прямо не верится, что это 30-е. Красная Этна явно дореволюционная, только покрасневшая. Двинолес удивляет латинскими DL, но не исключено, что он сплавлял дерево в Европу.</p>", 1.0], ["img/r23/r23-015.jpg", "r23-015", "<p>Всесоюзный текстильный синдикат (ВТС), Акционерное общество &quot;Меркурий&quot;, Орехово-Зуевский государственный хлопчато-бумажный трест, Тамбовский суконный трест (ТСТ), Ленто-ткацкая фабрика Туркменистанской мануфактуры, Озёрская объединённая хлопчато-бумажная фабрика, Вигоневский трест (ВТ)</p><p>Круг и ромб — две главных формы тридцатых. Там, где хоть как-то теплился дизайн, компоновали в одну из этих двух форм</p>", 1.0], ["img/r23/r23-016.jpg", "r23-016", "<p>Красный молот (Завод сельско-хозяйственных орудий Нижний Новгород), Государственный электротехнический трест (ГЭТ), Мосстеклофарфор, Мальцкомбинат (ГМЗ), Красный якорь (Объединение цепно-якорных заводов), Баббит Новая звезда Гамма, Мологолес</p><p>Звёзд на советских эмблемах много. Почти столько же, сколько серпомолотов. Причем звезды никак не связаны с красной армией, чьей эмблемой они являлись в советском триединстве: пролетариат, крестьянство, военные.</p>", 1.0], ["img/r23/r23-017.jpg", "r23-017", "<p>Московское агентство &quot;ТРАНСПЕЧАТЬ&quot;, Государственный Музыкальный трест, Государственное издательство (ГИЗ), ПРОЛЕТКИНО Москва, Акционерное общество Международная книга СОЮЗ, Издательство &quot;Вопросы треда&quot;, Издательство &quot;Мосфинотдел&quot;, Государственная контора по заготовке и продаже метрических мер и весов Производство множительных аппаратов &quot;АПАКОГРАФ</p><p>Угол, прорывающий круг — еще одна частотная форма раннесоветских логотипов. Как правило, это книга, как в эмблемах ГИЗ и Мосфинотдел</p>", 1.0], ["img/r23/r23-018.jpg", "r23-018", "<p>МОСТОРГ, МОССЕЛЬПРОМ, Союз потребительских обществ, ПЛОДОВИНСОЮЗ, ПЕРВРОСРЫБА, ПИЩЕТРЕСТ Одесса, ПИЩЕТРЕСТ Ленинград (ГПТ), Трёхгорный пивзавод, ИМША, Вина Конкордии, ГРУЗГОССПИРТ Тифлис</p><p>Треугольников тоже много. Не исключаю, что популярность этой формы связана с резинотрестовым треугольником. У Моссельпрома, прославленного Маяковским и Родченко, на удивление архаичная эмблема</p><p>Зато милейшая свинко-бочка с крылышками — Вина Конкордии</p>", 1.0], ["img/r23/r23-019.jpg", "r23-019", "<p>Государственный трест Жиркость ТЭЖЭ, Фабрика &quot;ФАРМАХИМ&quot;, МОСХИМОСНОВА, какой-то Одесский трест, торгующий красками; некое МГТП; Франко-русское т-во «Одоль»; нечто в круге с серпомолотом; Гострест &quot;САНТОНОН&quot;.</p><p>Знак ТЖ — герой и победитель в битве жиртрестов (см. ниже)</p>", 1.0], ["img/r23/r23-020.jpg", "r23-020", "<p>МОСПОЛИГРАФ, ПОЛИГРАФ, МОСКВОШВЕЙ, Пролетарский труд, ТЕХНОТКАНЬ, АРМАТРЕСТ, ПЕСТРОТКАНЬ, Бердо-ремизная фабрика им. Бухарина (БЕРДОРЕМИЗТРЕСТ), Электросталь (ЭС)</p><p>Москвошвей, пиджак которого топорщился на Осипе Мандельштаме. А знак Электростали в каталоге был перевернут вверх ногами. Думаю, потому, что молния должна бить вниз, а она почему-то вверх. Или я напрасно его перевернул? Почему у Арматреста магендовид — не знаю. Но тогда это еще не был запрещенный символ, как в эпоху борьбы с израильской военщиной Показать меньше</p>", 1.0], ["img/r23/r23-021.jpg", "r23-021", "<p>Машинотрест, Москва; Гос. трест массового производства, Ленинград; Автопромторг ссср; Гос. инструментальный завод Металлист, Нижний Новгород; Общество «Чиче», видимо, торговое; Акционерное общество Мельстрой, Москва; видимо, Трест слабых токов; Районное управление металлообрабатывающей промышленности, Павлов Посад; Машиностроительный завод Двигатель революции, Н. Новгород<br>Самый интересный экспонат — визуальная айдентика завода Металлист. Почему рыбки? Почему звезда Давида? Почему колокола — прнятно: наверняка до революции работали на церковь (или поставляли ботала для животноводов) Показать меньше</p>", 1.0], ["img/r23/r23-022.jpg", "r23-022", "<p>Трест Моссукно. Газетное объявление. Видимо, 1920-е или начало 30-х. На эмблеме РСФСР, а в правом верхнем углу рамки — С.С.С.Р. с точками</p><p>Как видим, при НЭПе государственные тресты рекламировали себя как частные предприятия Показать меньше</p>", 1.0], ["img/r23/r23-023.jpg", "r23-023", "<b>Эмблема Треста Жиркость, сокращенно ТЭЖЭ</b><p>Трест был главным производителем советской парфюмерии Показать меньше</p>", 1.0], ["img/r23/r23-024.jpg", "r23-024", "<p>Вырезка из газеты с отчетом о тяжбе между Государственным трестом ТЭЖЭ и Ленинградским жировым трестом. 1927 Показать меньше</p>", 1.0], ["img/r23/r23-025.jpg", "r23-025", "<p>Побежденный в споре жирокостных парфюмеров Ленжиртрест завёл собственный товарный знак ЛЕНЖЕТ. 1928</p><p>Обложка прейс-куранта (сиречь рекламного каталога). Безплатно Показать меньше</p>", 1.0], ["img/r23/r23-026.jpg", "r23-026", "<p>Рекламное объявление т-ва Российско-Американской резиновой мануфактуры ТРАРМ. До 1917 года.</p><p>Орлов Поставщика Двора ЕИВ хватит на всю августейшую фамилию. Галош тоже.</p><p>Слоган акцентирует внимание на логотипе.<br>Указующий перст не дает потребителю шанса увернуться от целевого маркетинга.</p><p>Похвальба «самыя лучшiя в мiрѣ» — просто констатация факта. Показать меньше</p>", 1.0], ["img/r23/r23-027.jpg", "r23-027", "<p>Те же галоши при историческом материализме. Начало 1920-х.<br>Странное имя ТРАРМ сменилось благозвучным Резинотрест. А вот марка — треугольник — осталась Показать меньше</p>", 1.0], ["img/r23/r23-028.jpg", "r23-028", "<p>Маяковский и Родченко. Реклама галош Резинотреста. Середина 1920-х. Треугольник уступил место палочным частушкам. С виду довольно болро. Но вот как это сказалось на продажах, особенно в сидя плачущей Европе, сказать не берусь. Может, просто треугольник продавал бы и получше Показать меньше</p>", 1.0], ["img/r23/r23-029.jpg", "r23-029", "<b>«Товарищество на паях автомобильного Московского общества» (АМО). Логотип 1924 г.</b><p>СССР / 1916-1933</p><p>История марки:<br>Ремонтно-производственные мастерские, Москва, СССР (1 января 1916-20 июля 2016))<br>Автомобильный московский завод, АМО, Москва, СССР (20 июля 1916 — 1923)<br>Автомобильный московский завод им. П. Ферреро, Москва, СССР (1923-1925)<br>1-й Государственный автомобильный завод, Москва, СССР (1925-1931) Показать меньше</p>", 1.0], ["img/r23/r23-030.jpg", "r23-030", "<p>Логотип-шильдик АМО. 1930<br>Советское авто-ардеко Показать меньше</p>", 1.0], ["img/r23/r23-031.jpg", "r23-031", "<p>Логотип-шильдик Новый AMO (1931-1933)<br>Вместо ссср-дца пламенный мотор. С шестеренкой и летящей звездой.<br>Кстати, видите надпись «ссср»?<br>Вот и я не сразу прочел.</p><p>Судя по многословности и неловкой старательности, вещь спроектирована прямо в цехах Показать меньше</p>", 1.0], ["img/r23/r23-032.jpg", "r23-032", "<b>Завод имени Сталина (ЗиС) (1933-1935)<br>Бывшее АМО</b><p>Довольно архаичный и не слишком умело закрученный вензель (средняя И не вплетена в композицию, а просто подложена снизу).<br>Наверху отдающая легким сатанизмом двойная звезда. И три честных дырки под винтики Показать меньше</p>", 1.0], ["img/r23/r23-033.jpg", "r23-033", "<p>Логотип ЗиС 101 (1936-1941). Значок с решетки радиатора (Grill Badge).<br>Смотрим на буквы. Особенно на И. Старались заводские оформители Показать меньше</p>", 1.0], ["img/r23/r23-034.jpg", "r23-034", "<p>Носовая фигура ЗиС 101 (1937)<br>Забавно, что над капотом возвышался на стойке еще один капот, только более старообразный.</p><p>В крышечке шишечка<br>В шишечке дырочка<br>В дырочке пар Показать меньше</p>", 1.0], ["img/r23/r23-035.jpg", "r23-035", "<b>Носовое украшение ЗиС 110 (1945-1958)</b><p>Очень позднее советское ардеко. От мировых стандартов отстает уже на старте. А к 1958 выглядит просто ископаемым.<br>Качество штамповки, позолоты и глазирования очень так себе. А ведь это стояло на машине премиум-класса, или проще говоря, членовозе Показать меньше</p>", 1.0], ["img/r23/r23-036.jpg", "r23-036", "<p>Из вики:<br>«23 мая 1929 г. ВСНХ СССР и американская фирма Ford Motor Company заключили соглашение о технической помощи по организации и налаживанию массового производства легковых и грузовых автомобилей. Основой производственной программы были выбраны модели Ford A и Ford AA. Завод полного цикла проектировался американским архитектурным бюро Альберта Кана по образцу завода «Ривер-Руж», техническое руководство строительством осуществляла американская компания «Остин», строительство вёл трест «Металлострой»»</p><p>Слева: логотип первых ГАЗов, они же форды. Любопытны симметрично отзеркаленные серпомолоты.<br>Справа — у советских собственная фордость.</p><p>Потом у ГАЗа было еще много логотипов. Но об этом в свое время. Показать меньше</p>", 1.0], ["img/r23/r23-037.jpg", "r23-037", "<p>Борис Пастернак<br>Художник: Владимир Роскин<br>Издательство: ГИЗ<br>Год: 1927<br>Из собрания МИРА коллекция</p><p>Неожиданное дизайнерское решение книжной обложки: название превращено в псевдологотип-этикетку. Ну, и конечно прекрасны превращенные в орнамент бомбочки, решеточки и даже виселички Показать меньше</p>", 1.0], ["img/r23/r23-038.jpg", "r23-038", "<p>Одна из девяти страниц американской барахолки Показать меньше</p>", 1.0], ["img/r23/r23-039.jpg", "r23-039", "<p>И еще одна. Любуемся народным дизайном Показать меньше</p>", 1.0]], "research": null}, {"intro": false, "num": "24", "title": "Красные бланки", "ptitle": "Красные бланки", "subtitle": "", "date": "10 мая 2024", "perm": "https://www.facebook.com/yuri.gordon/posts/pfbid0GwSi9m9Tmy9WeHv7iKq4xtPUDVpTXtTiKzjryf6CMb7qHdf9VA6TzyL4XKYEzNfsl", "slug": "", "html": "<p><span class=\"dc\">П</span>родолжаю предыдущую главу, посвященную первым советским товарным знакам. В этот раз в поле внимания — фирменные бланки советских контор.</p>\n<p>В моем распоряжении оказалась целая коллекция бланков двадцатых-тридцатых годов, преимущественно полиграфических и издательских. А раньше, копаясь на портале ХисДок.ру, я встречал массу дореволюционных фирменных бланков. Между теми и этими есть сходства и различия, о чем и пойдет речь.</p>\n<p>Что касается деловых государственных бланков, советская власть полностью переняла дореволюционную форму: гриф в левом верхнем углу, набранный в несколько шрифтов. Только шрифты стали победнее и вместо орла — серп-и-молот.</p>\n<p>Меня это самовоспроизводство бюрократии даже немного умилило. Казалось бы: мы наш, мы новый с основанья — ан нет. Большевики, если внимательно поглядеть, совсем не левые. Они правые государственники, прямые наследники предыдущего режима. По крайней мере бланки у них завелись очень скоро и по всей бюрократической форме.</p>\n<p>До тридцатых годов советская бумажка с печатью была сильно похожа на царскую. Потом она потеряла остатки типографского лоска и сильно поскучнела.</p>\n<p>А вот фирменные бланки сразу стали скромнее, по двум причинам. С одной стороны, госконторы не рекламировали себя так, как частные компании. Для частника бланк — лицо фирмы. Для красного директора или чиновника — скорее род мундира. А в те годы мундир даже имя свое потерял, не говоря об эполетах и аксельбантах. И еще одно важное отличие частного от государственного: на бланке частной компании обязательно есть мелкие любопытные детали. Вовсе не обязательно красивые, но — домовитые, что ли. А советские бланки делались из общих соображений. Поэтому на них если что есть интересного — то непременно в главной роли.</p>\n<p>Несколько шапок для разных отделений Госиздата, других госиздательств и типографий начала 20-х годов сделаны, похоже, одной очень сильной рукой. Автор их — Александр Николаевич Лео, самый умелый и плодовитый из леттерингистов, доставшихся советам по наследству от частных типографий. Он умел делать с буквами решительно всё, но предпочитал очень странные формы, предельно эклектичные и вычурные.</p>\n<p>Также в ранних советских бланках появляется и протодизайн, как будто мимо пробежал Телингатер. Но чаще все-таки работал метранпаж: рамка в две краски, выключка по центру, шрифт покрасивее.</p>\n<p>Детали смотрите в подписях к картинкам.</p>\n<p>Я намеренно не стал вчитываться в тексты — а они там попадаются весьма колоритные. А вот за тем, как заполняются бланки, последил. Только самые ранние, конца 19 века или начала 20, заполнены от руки. Пишмашинка торжествует уже в 1905 году, а на советских бланках рукопись — скорее редкость.</p>\n<p>И, конечно же, качество каллиграфии — там, где она есть — куда хуже, чем при царском прижиме. Достаточно сравнить два заполненных от руки бланка, 1891 и 1905 года, с торжественным Свидетельством Палаты мер и весов 1926 г., куда старательный советский писарь внёс ФИО награжденного.</p>\n<p>К середине тридцатых советская печать пришла в себя после бурь и натисков. Казалось бы — должны самим себе отпечатать бланков на заглядение. Но нет: ни качество печати, ни количество дизайна не стали лучше, когда жить стало веселее</p>", "figs": [["img/r24/r24-001.jpg", "r24-001", "<p>Министерство финансов, управляющий Ставропольскою казенною палатою. 23 марта 1893 года<br>Справа — писарская каллиграфия, слева — начальственная резолюция<br>Типичный дореволюционный госбланк: гриф слева, печать в шесть шрифтов</p>", 1.0], ["img/r24/r24-002.jpg", "r24-002", "<b>Бланк фабрики Братьев Тарнополь, Одесса, 1905 год</b><p>Частный бланк в стиле промышленной революции: пышно, медально, богато.<br>Письмо начертано клерком, хозяин только подписал</p>", 1.0], ["img/r24/r24-003.jpg", "r24-003", "<p>Бланк конторы и склада В.Е. Вьюнника, г. Краснокутск Харьковской губернии. 1902 год<br>Опять пышный, затейливый и обаятельный по своему стиль ранней буржуазии</p>", 1.0], ["img/r24/r24-004.jpg", "r24-004", "<p>Бланк торговой компании Кеппен и Ко. 1907 г. Москва<br>Бланк имитирует государственный стиль: гриф слева, шрифтов немеряно. Но: сверху красиво отгравированный станок.<br>И вот уже текст набит секретаршей.</p>", 1.0], ["img/r24/r24-005.jpg", "r24-005", "<p>Филипп Петров, фабрикант вязаных платков. Москва, 1915<br>Такой глухо-синий почему-то был популярен у фабрикантов — не только российских. Я видел американские бланки точно такого цвета.</p>", 1.0], ["img/r24/r24-006.jpg", "r24-006", "<p>Торгово-промышленное товарищество на паях П.Б. Сергеева в Пензе. 1915 год<br>Частый мотив фирменных бланков — панорама предприятия. Ну, и регалий побольше.</p>", 1.0], ["img/r24/r24-007.jpg", "r24-007", "<p>И всё. Кончился старый строй, начались советы. Сейчас будет длинная серия бланков от товарища Лео. Для Госиздата, но не только.<br>Госиздат, Петроградское отделение, 1922 г.</p>", 1.0], ["img/r24/r24-008.jpg", "r24-008", "<b>Лео-2.</b><p>Госиздат, торговый сектор, 1923 г.</p>", 1.0], ["img/r24/r24-009.jpg", "r24-009", "<p>Лео-3.<br>Госиздат, главуправление, бумажный отдел. 1923 г.</p>", 1.0], ["img/r24/r24-010.jpg", "r24-010", "<p>Лео-4 (оцените, сколько заказов было у человека)<br>Госиздат, Главное управление. 1923 г.</p>", 1.0], ["img/r24/r24-011.jpg", "r24-011", "<p>Возможно, тоже Лео.<br>Книгоиздательство Петроград. 1923 г.<br>Вот это, похоже, частное издательство: сразу больше красот и они не такие формальные</p>", 1.0], ["img/r24/r24-012.jpg", "r24-012", "<p>Это почти наверняка Лео<br>Издательство «Всемирная литература», 1923 г.</p>", 1.0], ["img/r24/r24-013.jpg", "r24-013", "<p>Гострест «Петропечать». 1923 г.<br>Если это не Лео, то кто?<br>НЭП требует красоты даже от госконторы</p>", 1.0], ["img/r24/r24-014.jpg", "r24-014", "<p>Бланк Председателя Дальневосточного революционного комитета. 1923<br>Оцените родство советской бюрократии с досоветской. Что впечатляет — тонкая строчка соединяющихся пролетариев, набранная по дуге</p>", 1.0], ["img/r24/r24-015.jpg", "r24-015", "<p>Типография «Прибой», Ленинград. 1926<br>Гриф маленький, но стиль узнаваемый</p>", 1.0], ["img/r24/r24-016.jpg", "r24-016", "<p>Акционерное общество «Новтрестторг», Новгород, 1927 г.<br>Стиль шапки напоминает Чехонина. Но что удивительно: вся мелкота ниже товарного знака написана от руки!</p>", 1.0], ["img/r24/r24-017.jpg", "r24-017", "<p>Государственный трест «Полиграф», 1922 г.<br>Какой грифон слева! Вся шапка нарисована — это не набор</p>", 1.0], ["img/r24/r24-018.jpg", "r24-018", "", 1.0], ["img/r24/r24-019.jpg", "r24-019", "<p>Государственная типография им. Евг. Соколовой<br>Редкая полнонаборная шапка бланка. Метранпаж работал</p>", 1.0], ["img/r24/r24-020.jpg", "r24-020", "<p>Государстенная типография им. Ивана Федорова (бывш. Голике и Вильбор). 1923 г.<br>Тоже полный набор</p>", 1.0], ["img/r24/r24-021.jpg", "r24-021", "<p>Государственный трест «Полиграф», 1924 г.<br>Наборная шапка и стильный, под гравюру, знак</p>", 1.0], ["img/r24/r24-022.jpg", "r24-022", "<p>Государственный трест «Полиграф», 1925 г.<br>Знак тот же, шапка совсем другая.</p>", 1.0], ["img/r24/r24-023.jpg", "r24-023", "<p>Газета с чудесным названием «Голос текстилей», которое сейчас москвичу невозможно прочесть не как топоним. 1925 г.<br>Что удивительно: сплошной набор, причем очень хитрым шрифтом нескольких кеглей</p>", 1.0], ["img/r24/r24-024.jpg", "r24-024", "<p>Госиздательство «Музыкальный сектор». 1926 г.<br>Сектор не выпендривался, взял картинку с логотипом ГИЗа</p>", 1.0], ["img/r24/r24-025.jpg", "r24-025", "<p>Ленотгиз, 1926 г.<br>Вот здесь я вспомнил т. Полыхаева: бланк Служебной записки! Внутренняя бюрократия на марше</p>", 1.0], ["img/r24/r24-026.jpg", "r24-026", "<p>Официальный бланк Свидетельства Главной палаты мер и весов. 1926 г<br>Советский чиновник Пробирной палатки очень старательно выводит дореволюционную каллиграфию, но рука уже не та</p>", 1.0], ["img/r24/r24-027.jpg", "r24-027", "<p>Цинкография производственно-трудовой артели «Блэк-Уайт» Бланк счета, 1926 г.<br>Почти дизайн и почти товарный знак. И даже светлый гротеск!</p>", 1.0], ["img/r24/r24-028.jpg", "r24-028", "<p>Типо-литография Академии художеств. Бланк счета. 1926 г.<br>Тоже протодизайн. Советский</p>", 1.0], ["img/r24/r24-029.jpg", "r24-029", "<p>Акционерное издательское общество «Огонек». 1931 г.<br>Советский «Огонек» сохраняет стилистику «Нивы» — популярного буржуазного журнала</p>", 1.0], ["img/r24/r24-030.jpg", "r24-030", "<p>Госиздательство «Молодая гвардия», 1933 г.<br>Тоже формализованный и даже двукрасочный бланк с намеком на дизайн</p>", 1.0], ["img/r24/r24-031.jpg", "r24-031", "<p>Госконтора по продаже мер и весов. 1927 г. Еще НЭП в логотипе, еще дореволюционный стиль в бланке</p>", 1.0], ["img/r24/r24-032.jpg", "r24-032", "<p>Исполком международной организации помощи борцам революции МОПР. Служебная записка. 193…<br>Судите сами, какая прелесть: служебная записка для международных борцов революции.<br>То есть революция есть служба. Так и запишем</p>", 1.0], ["img/r24/r24-033.jpg", "r24-033", "<p>Государственное акционерное общество Academia. 1932 г.<br>Латиницей академи. И древний античный грек на лбу<br>И гарнитура Академическая в тексте, куда без нее</p>", 1.0], ["img/r24/r24-034.jpg", "r24-034", "<p>Гос муз издат Музгиз. 1935 г.<br>Заметим: Госиздат брендирует своим лого все подотделы.<br>Палочный логотип с микроприподнятием заглавной М<br>Тоже такой дизайн</p>", 1.0]], "research": null}, {"intro": false, "num": "25", "title": "Требуйте!", "ptitle": "Требуйте!", "subtitle": "Советский рекламный плакат, громкий, но не обольстительный", "date": "21 ноября 2024", "perm": "https://www.facebook.com/100000723643455/posts/9133488816685149/", "slug": "", "html": "<p><span class=\"dc\">П</span>осле долгого перерыва продолжаю рассказывать о буквах прошлого века.</p>\n<p>Когда думаешь о советской рекламе 20-40 годов, сразу вспоминаются: «нигде кроме как в Моссельпроме», Лиля Брик, кричащая криком про книги, «кто куда, а я в сберкассу», что-то с самолетами, что-то с пароходами, лучший в мире пломбир и ещё, конечно, слово «требуйте!».</p>\n<p>С него и начну. Появилось оно до 1917 года, но звучало совсем не так, как после. Гуглопоиск «рекламный плакат со словом требуйте» мгновенно принес несколько образцов дореволюционных требований. Я выбрал два: со склада оружия и для дам, желающих «быть красивой интересной». Не знаю, как было на практике, но смотрится как защита прав потребителя.</p>\n<p>В советское время настойчивое «требуйте» звучит примерно: «должно быть! Не верьте, что нет!». На одном резинотрестовском плакате голосом дяди Володи даже предлагается требовать мячики — но не у продавца, а у мамы.</p>\n<p>Кстати, если не забыли — Резинотрест это всемирно известная до 1917 года марка «Красный треугольник», я писал о ней раньше (ссылка в комменте).</p>\n<p>Реклама возродилась в ссср вместе с нэпом. И была она двух видов: советская и частная. Посмотрим, в чем разница.</p>\n<p>Открываю мой главный источник — роскошный альбом «Советский рекламный плакат 1923-1941» (спасибо,  Павел Снопков !).</p>\n<p>Первые два плаката акционерного общества «Добролет» — советские. Их слоганы начинаются словами «Стыдитесь» и «Тот не гражданин ссср». Слова «требуйте» нет — есть настойчивое предложение от государства вкладываться в нацпроект. Это еще не продразверстка — скорее продналог. Стиль суровый. Шрифты палочные. Автор — Родченко.</p>\n<p>За ними идут совместные творения Родченко и Маяковского. Их много. Они ГРОМКИЕ и НАСТОЙЧИВЫЕ. Среди них есть шедевры конструктивистской графики (та же Лиля).</p>\n<p>Как реклама они чудовищно плохи, потому что начисто лишены связи с потребителем (лучший пример — соски). Стишки на этих плакатах отчаянные по своей нелепой непритыкнутости. А когда авторам приходится действительно рекламировать что-то — например, часы Мозера в ГУМе — выходит по-настоящему смешно. Палочно-шрифтовая реклама хороша для дизайн-ностальгии, но не для продаж.</p>\n<p>Частная реклама совсем другая. Она очень похожа на дореволюционную. Товар лицом, марка или фирменный знак на почетном месте, обращение к покупателю без поэтического выпендрежа. Но самое рекламное — буквы. Во всех рекламах, где продавец хочет привлечь и обольстить (а реклама, как мы знаем, искусство обольщения) буквы становятся непростыми, «дорогими» и затейливыми.</p>\n<p>Даже государственные тресты — по сути, коммерческие структуры — выходя на рынок, начинали вести себя как частные фирмы, а иногда жестко конкурировали друг с другом (ссылка на пост о товарных знаках в комменте). Поэтому их рекламу делали не по-маяковски, а как положено. Особенно это видно у парфюмеров из жиртреста ТэЖе.</p>\n<p>Реклама в ссср была актуальна до тех пор, пока сохранялся хоть какой-то рынок. В двадцатые годы она работала почти как до 1917 — манила, обещала, но и (насколько-то) выполняла обещания. Качество рекламных плакатов и их типографика вполне на уровне 1913 года. Нормальная европейская рекламная продукция второго ряда. Рисовать персонажей и буквы советские плакатисты не разучились.</p>\n<p>Реклама 20-х довольно разнообразна. Это не только обычные для тогдашнего рынка продукты питания, табак, алкоголь и парфюмерия. Попадаются промтовары вроде кипятильника «Титан» и даже реклама такси. Жизнь собиралась налаживаться.</p>\n<p>Стиль ардеко, завоевавший мир в середине 20-х, пришел в ссср без опоздания. Уже в середине 20-х появились модные оттененные гротески, упрощенные обтекаемые формы и томные красавицы с маленькими круглыми прическами. Всё это любопытно соседствовало с «народным стилем» с красными пейзанами. То есть герои рекламы — «изящное сословие» и деревня. Пролетарии, которыми полнилась пропаганда, в товарной рекламе почти незаметны.</p>\n<p>Но наступил «великий перелом», и советская реклама сразу пошла работать в отдел пропаганды. Всё довоенное время ссср балансировал между тотальным дефицитом с карточной системой — и передышками, когда государство слегка приотпускало рынок и товары можно было купить за деньги. В эти моменты жить становилось лучше и веселее, а госпропаганда показывала достижения нового строя. Спектр товаров для внутреннего потребления сузился, а героями стали улыбчивые мамы городского вида и юные пионеры.</p>\n<p>Отдельно хочется отметить рекламу Торгсина — возможно, самого циничного предприятия по отъему ценностей у населения без конфискации. Первоначально сеть магазинов, как видно из названия, была рассчитана на торговлю с иностранцами, которые могли отовариться привычными благами за твердую валюту. Но позже, в голодные годы первой пятилетки, торгсины перешли на торговлю самым необходимым — за золото и драгметаллы. Граждане добровольно принесли государству всё, что у них еще оставалось, вплоть до нательных крестиков, а взамен получили (по цене золота) хлеб и муку. Я взял один плакат Торгсина — на английском. Подробности в комменте к картинке.</p>\n<p>Однако ссср не только ввозил, но и экспортировал. И рекламировал экспорт. Хорошо рекламировал, ярко и броско. Экспортные плакаты лаконичны, модны, латиница на них чистокровно ардекошная. Это настоящая имиджевая реклама.</p>\n<p>Советская реклама 30-х сейчас воспринимается ностальгически, как тогдашние комедии и золотые фонтаны ВДНХ. Чтобы понять, чем она была на самом деле, я даю в конце подборки несколько рекламных плакатов из внешнего, по отношению к ссср, мира. Они взяты из постов специалиста в области зарубежной рекламы (спасибо, Ирина Никифорова!). Сравним, посмотрим, чем тамошнее ардеко другее тутошнего.</p>\n<p>Вообще-то я хотел сделать подборку реклам мороженого, но сунувшись в Гугл имидж, обнаружил, что сравнивать невозможно. От «лучшего в мире советского мороженого» остался десяток плакатов (ну, два десятка за 70 лет), а по ту сторону железного занавеса их тысячи, и есть мощные традиции, бренды, ставшие мемами, музеи и коллекции. Показываю два бренда, подробности в подписях к картинкам.</p>\n<p>Конклюзия.</p>\n<p>Реклама в ссср была, и даже настоящая. Она появлялась тогда и там, когда и где пробивался рынок и зарождалась конкуренция (эка новость).</p>\n<p>Всё остальное — не реклама, а пропаганда. Отличить одно от другого просто. Реклама всегда про конкретный бренд, товар, услугу. По ней видно выгодоприобретателя. Пропаганда — даже когда нарисован пионер с банкой компота — уходит от ответа, где именно и почем эту банку можно купить.</p>\n<p>Что же касается букв, на рекламе буквы всегда чувственные, манящие и завлекающие. Пусть даже это жирный геометрический гротеск. Как только буквы перестают дразнить — привет, это не реклама, а что-то другое. Требуйте, может и дадут — по карточкам.</p>", "figs": [["img/r25/r25-001.jpg", "r25-001", "<p>Требуйте прейсъ-курантъ. Магазин оружия. 1910-е</p>", 1.0], ["img/r25/r25-002.jpg", "r25-002", "<p>Кто желает быть красивой, интересной требуйте всюду Крем Фу-Кианг. 1910-е</p>", 1.0], ["img/r25/r25-003.jpg", "r25-003", "<p>Ханс Руди Эрдт. Календарная стенка с рекламой московского магазина красок Рихарда Фридлендера.<br>1907-1908</p>", 1.0], ["img/r25/r25-004.jpg", "r25-004", "<p>Стыдись! Акционерное общество «Добролет». 1923<br>Автор Родченко</p>", 1.0], ["img/r25/r25-005.jpg", "r25-005", "<p>Тот не гражданин ссср… Акционерное общество «Добролет». 1923<br>Автор Родченко</p>", 1.0], ["img/r25/r25-006.jpg", "r25-006", "<p>Резинотрест (бывш. Российско-американская резиновая мануфактура ТРАРМ, она же «Красный треугольник»<br>Лучших сосок не было и нет (что правда на 1923 год).<br>Родченко — Маяковский</p>", 1.0], ["img/r25/r25-007.jpg", "r25-007", "<p>Резинотрест. Требуйте у мамы эти мячики<br>Родченко — Маяковский, 1923</p>", 1.0], ["img/r25/r25-008.jpg", "r25-008", "<p>Книги. Ленгиз<br>Родченко, 1923</p>", 1.0], ["img/r25/r25-009.jpg", "r25-009", "<b>Часы Мозера в ГУМе. 1923<br>Родченко</b><p>Кто ЦА, товарищи?</p>", 1.0], ["img/r25/r25-010.jpg", "r25-010", "<p>Резинотрест ориентальный. 1924<br>Родченко — Маяковский<br>Каждый сам себе царь и верблюд</p>", 1.0], ["img/r25/r25-011.jpg", "r25-011", "<b>Резинотрест космический. 1924.<br>Родченко — Маяковский</b><p>Здесь всё прекрасно, от ссср в качестве тени от галоши до идеи, что Европа будет плакать. Опять же: кто ЦА?</p>", 1.0], ["img/r25/r25-012.jpg", "r25-012", "<b>Ленинградский Государственный электромашиностроительный трест. Лампы «Светлана». 1924</b><p>Это реклама: есть товар, логотип, польза.<br>Но кто ЦА? Слоган: «Лампы повышают производительность труда». Значит, покупатель — завод?</p>", 1.0], ["img/r25/r25-013.jpg", "r25-013", "<p>Покупайте всюду кахетинские вина «Марани», особенно рекомендуем № На-Це. 1925<br>Настоящая нэпманская реклама, сделанная точно по дореволюционным образцам</p>", 1.0], ["img/r25/r25-014.jpg", "r25-014", "<b>Требуйте везде продукты Петровского уксусного завода в Москве.<br>1927, автор С. Каретникова.</b><p>Эта реклама тоже имеет прообразы в начале века. Но обычно пишущий человек рекламировал что-то, связанное с рекламой же. Например, краски, или это была театральная афиша.</p><p>Шрифт лихой и модный в 1927 году.<br>Что интересно: все дети босые, хотя мальчик и девочка явно из чистого сословия</p>", 1.0], ["img/r25/r25-015.jpg", "r25-015", "<b>Папиросы ДГТФ, бывшей В.И. Асмолова.<br>1923, автор, возможно, А. Занятов</b><p>Марка старорежимная, а буквы современные</p>", 1.0], ["img/r25/r25-016.jpg", "r25-016", "<b>Лучшие на Д-В папиросы. Гос. табачная фабрика, Владивосток. 1925</b><p>Нет, это не пролетарий</p>", 1.0], ["img/r25/r25-017.jpg", "r25-017", "<b>Папиросы Верненькие. Гос. табачная фабрика «Уртак», Ташкент. 1928</b><p>Обратите внимание на арабский текст. В 1928 году еще не была проведена ни латинизачция, ни русификация</p>", 1.0], ["img/r25/r25-018.jpg", "r25-018", "<b>Гос. табачная фабрика «Уртак», Ташкент. 1929<br>Автор М. Нестерова-Берзина</b><p>А на этом плакате кириллица соседствует с очень специфической латиницей. Это, судя по всему, след очень недолгой латинизации</p>", 1.0], ["img/r25/r25-019.jpg", "r25-019", "<b>Жиртрест Тэ-Жэ. Государственные парфюмерные фабрики. 1925-26</b><p>Герой — коробейник. Подтекст явно песня «Ой, полным-полна моя коробочка». А вон и Катя бежит. Интересная идея — торговать в чистом поле духами с лотка. Опять обошлось без пролетариев</p>", 1.0], ["img/r25/r25-020.jpg", "r25-020", "<p>Жиртрест Тэ-Жэ. 15 миллионов покупают мыло «Букет моей бабушки». 1925-26, автор, видимо, В. Каабак</p><p>На упаковке — дореволюционный, но очень завлекательный, «славянский» шрифт. Госпредприятие торгует мечтами о прошлом с чудесным слоганом, отсылающим в пропорции 1/10 к поэме т. Маяковского</p>", 1.0], ["img/r25/r25-021.jpg", "r25-021", "<b>Папиросы «Трезвон» ЛенГосТабТреста.<br>1925, автор А. Зеленский</b><p>Это реклама! Персонажи гротескные, но смотрим на буквы. Крупный логотип продукта, стандартный блок производителя. Аккуратный слоган</p><p>Кто эти двое? До 1917 — мещане. Теперь советские горожане средней руки</p>", 1.0], ["img/r25/r25-022.jpg", "r25-022", "<b>ЛенГосЖирТрест, марка ЖЕТ. Линейка продуктов «Кадюмь»<br>1925.</b><p>Эта госкомпания пыталась стащить марку у более известной московской Тэ-Жэ. Был скандал и суд, ленинградцам пришлось раскрыть карты</p>", 1.0], ["img/r25/r25-023.jpg", "r25-023", "<b>Фабр. Знак Тэ-жэ. Тоже крем от веснушек, но от законного владельца бренда. 1926</b><p>Как видим, госжиртресты тоже чувствительны к авторскому праву, когда сталкиваются на рынке</p>", 1.0], ["img/r25/r25-024.jpg", "r25-024", "<b>Шоколадная фабрика товарищества Симанов и Сальман.<br>1924, автор А. Зеленский</b><p>Этот нэпманский плакат надо было поставить пораньше</p>", 1.0], ["img/r25/r25-025.jpg", "r25-025", "<b>Пиво и воды завода «Южная Бавария» из Симферополя.<br>1928</b><p>Опять обошлось без пролетариев</p>", 1.0], ["img/r25/r25-026.jpg", "r25-026", "<b>Резинотрест. Глалоши с маркой «Треугольник».<br>1925, автор В. Баускин</b><p>Любопытное сочетание «русского народного» стиля со счастливой пейзанкой и промышленного пейзажа в бекграунде</p>", 1.0], ["img/r25/r25-027.jpg", "r25-027", "<b>Алюминиевый бойлер «Титан» кооперативного завода.<br>1926, автор, кажется, В. Каабак</b><p>Очень любопытный посыл рекламы. Внизу стратифицированный советский народ с кипятком. Сбоку бегущая смерть. Над ней — пропагандистский слоган. Внизу по центру — настоящая реклама про ведро кипятка на фунт дров. Как думаете, кто ЦА?</p>", 1.0], ["img/r25/r25-028.jpg", "r25-028", "<b>Реклама такси. 1929, автор, возможно, М. Буланов</b><p>Этот плакат надо смотреть и читать весь, он страшно любопытный. Кто эти люди? Памятка пассажиру. Такса. Ручной банаж бесплатно до 60 кило. Два слогана. Извозчик на заднем плане. И многое другое</p>", 1.0], ["img/r25/r25-029.jpg", "r25-029", "<b>ГосЭлектроТрест. 1929</b><p>Загадочный плакат. Что и кому он предлагает?<br>Смотрим на буквы: это не реклама</p>", 1.0], ["img/r25/r25-030.jpg", "r25-030", "<b>Кто куда, а я в Сберкассу. 1929<br>Автор М. Буланов</b><p>Я не застал этих плакатов, но мем слышал даже в детском саду. Видимо, когда-то этот постер висел во всех отделениях госбанка</p>", 1.0], ["img/r25/r25-031.jpg", "r25-031", "<b>Наркомпищепром ссср Главкондитер. Ирис<br>1939. Автор А. Зеленский</b><p>Пионер — один из главных героев псевдорекламы времен пятилеток. Он — и его мама, советская горожанка непонятного достатка</p>", 1.0], ["img/r25/r25-032.jpg", "r25-032", "<b>Еще пионер. 1939. Автор Б. Зеленский</b><p>Псевдореклама. Где пейте? Какие соки? Зачем тут гусь?</p><p>Но буквы красивые, хотя и не связаны ни с героем, ни с соками</p>", 1.0], ["img/r25/r25-033.jpg", "r25-033", "<b>Наркомпищепром ссср Главконсерв. Варенье. 1938</b><p>Очень характерная советская продуктовая псевдореклама. Консервов было особенно много. Казвалось бы всё на месте, но без всякого воодушевления</p>", 1.0], ["img/r25/r25-034.jpg", "r25-034", "<b>Наркомпищепром ссср. Расфасованное мясо им. т. Микояна.<br>1937. Автор А. Побединский</b><p>Радостная леди, одетая как в театр, несет в руке сомнительного вида упаковку. Это, кстати, похоже на рекламу (опять-таки смотрим на буквы).</p><p>Маленькая деталь: у дамы в другой руке классическая советская авоська</p>", 1.0], ["img/r25/r25-035.jpg", "r25-035", "<b>Наркомпищепром ссср. Главхлеб<br>1937, автор Б. Зеленский</b><p>Один из серии очень лихо нарисованных плакатов про хлебные изделия со стишками квазимаяковского.<br>Смотрим на буквы. Нет, не реклама</p>", 1.0], ["img/r25/r25-036.jpg", "r25-036", "<b>Наркомпищепром ссср. Главхладопром<br>1936, автор С. Ахвледиани (но это не точно)</b><p>Добрались до лучшего в мире мороженого. Мороженое подается как лайфстайл на просторах ЦПКО или ВДНХ.<br>Реклама ли это? По буквам вроде да. Но читаем закавыченную цитату внизу и начинаем сомневаться</p>", 1.0], ["img/r25/r25-037.jpg", "r25-037", "<p>Наркомпищепром ссср. Главмолоко. Мороженое вкусно и полезно зимой и летом.<br>1937. Автор, кажется, А. Андреади</p><p>Мощный плакат с ликующей мамой и затаившейся дочкой-пионеркой. Правда, хочется мороженого из звенящей металлической розетки (я такие застал в конце 60-х в кафешках). Есть даже логотип треста. Реклама?</p>", 1.0], ["img/r25/r25-038.jpg", "r25-038", "<b>Наркомпищепром ссср. Главликёроводка. Столовая водка<br>1938. Автор Ю. Цейров (?)</b><p>Этот плакат, скорее всего, вдохновил в нулевые одного талантливого менеджера на создание бренда «Зелёная марка». Сам по себе плакат, на мой взгляд, страшноватый, но как раз буквы на нем отлично дистиллированы. Заметим, что первые две рюмки соколóм, остальные мелкими пташечками, и количество их легион</p>", 1.0], ["img/r25/r25-039.jpg", "r25-039", "<b>Наркомвнуторг ссср. Покупайте в консервах кукурузу<br>1936. Автор И. Боград</b><p>Типичный консервированный плакат с мелким текстом про то, что консервированная кукуруза это то, что надо. Буквы не обманут: псевдореклама</p>", 1.0], ["img/r25/r25-040.jpg", "r25-040", "<b>Наркомпищепром ссср, Главрыба. Всем попробовать пора бы…<br>1938, автор А. Миллер</b><p>Не смотрим на завораживающий взгляд и блистательную улыбку. Смотрим только на буквы. Вам всё ясно?</p>", 1.0], ["img/r25/r25-041.jpg", "r25-041", "<b>ЛенГосТабТрест. Сигары<br>1927. Автор А. Зеленский</b><p>Поставил сюда два госплаката времен непманских, чтоб вы встряхнулись и вспомнили о настоящей рекламе. Кстати, это еще и настоящее раннее ардеко</p>", 1.0], ["img/r25/r25-042.jpg", "r25-042", "<b>ЛенГосТабТрест. Папиросы «Мак»<br>1927. Автор А. Зеленский</b><p>Еще один плакат ардеко: плоско, ярко, геометрично, секси. И лого на месте, вполне пристойное</p>", 1.0], ["img/r25/r25-043.jpg", "r25-043", "<b>Наркомвнуторг ссср. Пельмени.<br>1936, автор И. Боград</b><p>Здесь есть некая живинка в композиции, и даже буквы Е не без задора. Да и электрокастюля блестит весело. Но отсутствие бренда и слогана разоблачают псевдорекламу</p>", 1.0], ["img/r25/r25-044.jpg", "r25-044", "<b>Glavkonditer. Monoansje.<br>1938. Автор Б. Зеленский.</b><p>Следом за этим плакатом (через один) пойдут внешторговские. Он тоже кажется экспортным, но это просто художник оттянулся на латинице и восточном колорите</p>", 1.0], ["img/r25/r25-045.jpg", "r25-045", "<b>Курите сигары «Север».<br>1941, автор А. Федосеев.</b><p>Этот плакат — последний и самый поздний по времени в альбоме, любезно предоставленном Павлом Снопковым ( Павел Снопков). Судя по всему, на нём пароход «Челюскин» (?) Стильный постер, как будто на экспорт. Но нет производителя и как всегда, неясна ЦА</p>", 1.0], ["img/r25/r25-046.jpg", "r25-046", "<b>Резинотрест. Шины. Экспортный плакат.<br>1929. Автор Д. Кравченко</b><p>Почувствуйте разницу. Ничего лишнего. Товар и производитель лицом</p>", 1.0], ["img/r25/r25-047.jpg", "r25-047", "<b>Резинотрест. Галоши из Москвы.<br>1931. Автор Г. Замской</b><p>Европа не плачет. Логотип на месте</p>", 1.0], ["img/r25/r25-048.jpg", "r25-048", "<b>Консервы Socra.<br>1932. Автор С. Игумнов</b><p>По-моему, это просто (и) круто</p>", 1.0], ["img/r25/r25-049.jpg", "r25-049", "<b>Torgsin orders.<br>1935. Автор С. Сахаров (?)</b><p>Гениальная идея по добыче валюты. Иностранным гражданам предлагается слать в ссср подарки друзьям и родственникам. Платите в долларах — друзьчюя не голодают. Дива с лицом Любови Орловой. Много текста (всё по делу). Цинизм, возведенный в ранг торговой политики</p>", 1.0], ["img/r25/r25-050.jpg", "r25-050", "<p>ЖирТрест Тэ-Жэ. Мыльная палочка и крем «Санит». Только в Торгсине (за валюту и драгметаллы)<br>1934. Автор С. Сахаров (?)</p><p>У Торгсина был очень модный логотип с непременным ссср</p>", 1.0], ["img/r25/r25-051.jpg", "r25-051", "<p>Аладар Рихтер, Сигаретная бумага &quot;Модиано&quot;. 1923</p>", 1.0], ["img/r25/r25-052.jpg", "r25-052", "<p>Роберт Берени, Гильзы &quot;Modiano&quot;. 1929</p>", 1.0], ["img/r25/r25-053.jpg", "r25-053", "<p>Серхио Трухильо Маньената, Боливарианские спортивные игры в честь четырехсотлетия основания Боготы. 1938</p>", 1.0], ["img/r25/r25-054.jpg", "r25-054", "<p>Серхио Трухильо Маньената, Боливарианские спортивные игры в честь четырехсотлетия основания Боготы. 1938</p>", 1.0], ["img/r25/r25-055.jpg", "r25-055", "<p>Роберто Алой (Roberto Aloy, 1897-1981)<br>Ликер &quot;Costume&#x27; Canetta&quot;. 1925</p>", 1.0], ["img/r25/r25-056.jpg", "r25-056", "<p>Макс Кернер (Max Körner 1883–1963)<br>Выставка декоративно-прикладного искусства<br>«ФОРМА И ОТДЕЛКА»<br>Нюрнберг, 1925</p>", 1.0], ["img/r25/r25-057.jpg", "r25-057", "<p>Герберт Маттер, 1932</p>", 1.0], ["img/r25/r25-058.jpg", "r25-058", "<p>Герберт Маттер, 1932</p>", 1.0], ["img/r25/r25-059.jpg", "r25-059", "<p>Акилле Маузан (до 1905 - Ашиль Мозан, 1883-1952)<br>Содовая вода &quot;Бильц&quot;. 1927</p>", 1.0], ["img/r25/r25-060.jpg", "r25-060", "<b>Пауль Шойрих (1883-1945) Реклама модного журнала.<br>1908</b><p>Европейское арнуво (для сравнения с российским до 1917)</p>", 1.0], ["img/r25/r25-061.jpg", "r25-061", "<p>Новозеландская реклама мороженого (с белым медведем, до которого плыть и плыть в другое полушарие)</p><p>Arctic Ice Cream &quot;Arctic Pie&quot; sign, Hawkes Bay Frozen Supplies Ltd.,<br>signwriter Geoff Walker, Clive Square, Napier, ca. 1930.</p><p>The History of Ice Cream in New Zealand</p>", 1.0], ["img/r25/r25-062.jpg", "r25-062", "<b>Реклама велолотков Walls из веломузея:</b><p>https://shop.onlinebicyclemuseum.co.uk/.../1930s-triang.../</p><p>Этот вид продаж со слоганом Stop me and Buy one был чрезвычайно популярным и породил целую субкультуру</p>", 1.0], ["img/r25/r25-063.jpg", "r25-063", "<p>Замороженые фруктовые соки Popsicles тоже породили не только новый класс продуктов (советское мороженое за 7 к. — поздний отголосок), но и стали образцом рекламного постера</p>", 1.0], ["img/r25/r25-064.jpg", "r25-064", "<p>И еще Popsickes</p>", 1.0], ["img/r25/r25-065.jpg", "r25-065", "<p>И еще они же</p>", 1.0]], "research": null}, {"intro": false, "num": "26", "title": "Глава про латиникириллизацию в СССР", "ptitle": "Как был упущен лучший случай сбросить Пушкина с корабля современности", "subtitle": "", "date": "14 мая 2025 г.", "perm": "https://www.facebook.com/story.php?story_fbid=23987832897490830&id=100000723643455", "slug": "", "html": "<div class=\"epi\"><p>И изъяснялася с трудом<br>На языке своём родном<br><br>I izjasnálasá s trudom<br>Na jazyke svojom rodnom<br><br>I izjasnälasä s trudom<br>Na jazyke svojom rodnom</p></div>\n<p><span class=\"dc\">[</span>Пост написан на базе двух статей в Вики, книги «Империя наций» и материалов, собранных для карты «Кириллица в пространстве и времени» в экспозиции центра «Слово»].</p>\n<p>Большевики мыслили глобально, даже когда начинали «строить социализм в одной, отдельно взятой». Доставшуюся от царского режима территорию они считали безнадежно отсталой и годной только на капитальную переделку. Поэтому сразу задумались о замене кириллицы на что-то более модное и прогрессивное.</p>\n<p>Что же это могло быть? Конечно, только латиница. Латинский алфавит к началу 20 века использовался везде, где утвердилась христианская вера в ее католическом и протестантском изводах: в Европе и ее колониях, а также в переставших быть колониями Америках.</p>\n<p>Все прозелитические религии — доктрины книг и азбук. Иудаизм шел в комплекте с квадратным письмом. Христианство, начав говорить и писать по-гречески, быстро усвоило латынь и латиницу, и так же быстро породило армянский, грузинский, а потом и глаголический с кириллическим алфавиты. Ислам разнес по миру арабицу, и она победила даже там, где были многовековые письменные традиции — например, в Египте, в Персии и в Сирии.</p>\n<p>Кириллица досталась одной из самых хищных мировых империй — Российской. Вплоть до своего развала эта империя была к тому же православной — то есть, казалось бы, должна была неумолимо перемалывать любое другое письмо, попавшее в ее границы. Однако, несмотря на все попытки, царям и Синоду не удалось навязать кириллицу ни одному из письменных народов, попавших в черту оседлости православия. Ни Польша с Финляндией, ни Прибалтика, ни Грузия с Арменией, ни мусульманский Кавказ и Центральная Азия не лишились своих систем письма. Даже не имевшие своей территории евреи имели комплекты типографских шрифтов везде, где проживали.</p>\n<p>И только советский строй сумел потеснить, а где-то полностью вытеснить связанные с религиями письменности. Это произошло потому, что большевики были не просто атеистами, но воинствующими безбожниками: их квазирелигия должна была стереть все прочие веры и заменить священные книги «Капиталом» в качестве Ветхого завета и «Кратким курсом» в качестве Нового.</p>\n<p>Что интересно: важным фактором, повлиявшим на отношение советской власти к письменностям, была борьба марксистов с набиравшей силу фашистской расовой теорией.</p>\n<p>Большевики считали, что все народы развиваются. Что состав крови — не приговор. Что нет народов первого и второго сорта. И это довольно круто, не так ли?</p>\n<p>Но! Марксизм гласил: все как один народы проходят одни и те же стадии развития — от первобытной до коммунистической. И никак иначе. И на этом пути создание наций прогрессивно только при переходе от средневековья к буржуазному обществу. А дальше нации вредны и должны слиться в общечеловеческом экстазе строительства земного рая.</p>\n<p>Поэтому надо всячески поощрять отсталые народы к национальному самосознанию, нацкультуре и нацписьму. А тех, кто уже самосознался — наоборот, избавлять от пережитков национализма. Поэтому сначала внедрялась коренизация, а потом сразу же — дружба народов с интеграцией в новую общность — советский народ. (Как создавались и пересоздавались советские нации, народы и народности вместе с приписанными им культурами и письменностями — отдельная и кровавая история).</p>\n<p>Советский же народ, по первоначальной утопической грёзе вождей, должен был заразить окрестные народы призраком коммунизма, и тут им всем очень бы пригодилась общая письменность.</p>\n<p>То, что у народа может быть собственная культура, связанная с письменностью, не смущало политических авангардистов. Ведь они же одним из первых декретов отменили яти с ижицами — и ничего! Значит, можно и весь алфавит поменять. Впечатляющий сплав научной рациональности с утопическим безумием. Корабль современности — не место для нянюшкиных сказок. За борт их!</p>\n<p>Надо сказать, советский эксперимент с буквами был не единственным. Параллельно шли еще две алфавитных революции.</p>\n<p>На руинах Османской империи младотурки отказались от ислама и арабицы, вместо которых ввели светское обучение и латиницу. Это был сверхрадикальный слом парадигмы в развитой государственнической и религиозной культуре.</p>\n<p>На западе тоже произошел алфавитный перелом. Еще в начале 20 века немецкие педагоги утверждали, что письмо и шрифты, основанные на антикве, вредны для глаз. Только немецкое! Только готическое!</p>\n<p>А в 1941-м нацисты были готовы объявить готический шрифт коварным иудейским изобретением.</p>\n<p>Советские ученые и политики следили и за турками, и за немцами. Например, советские эксперименты с латинизацией тюркских языков шли прямо параллельно с турецкими. А немецкому модернизаторству соответствовал отказ от «славянских» шрифтов, ассоциировавшихся с церковью и старым режимом.</p>\n<p>Но ведь письмо связано с культурой. Гражданка Петрова почти мгновенно сделала Московию Россией. Сто лет для культуры — очень немного. Что же должно было произойти при переходе от арабицы к латинице с полным изменением графики и даже направления письма?!</p>\n<p>Арабское письмо противостоит прямоугольной цивилизации. Арабская строка состоит из мелких крючков, хвостов и воздуха. По заполнению пространства она настолько не экономна, что и сравнить не с чем.</p>\n<p>При этом арабица легко закручивается в сложнейшие каллиграфические узлы, полностью используя данное поле. То есть может быть и тесной, и даже кирпичной. Но не становится — в текстовом наборе.</p>\n<p>На мой взгляд, это должно как-то влиять на мироощущение читающих арабицу на всех языках, где она используется. Интересно, как?</p>\n<p>А уж поворот движения строки в
