 интересного, начиная с языка рассказчика.</p>\n<p>На мой взгляд, именно с букв на вывесках, а не из наборных шрифтов, начала развиваться оригинальная современная кириллица. Наборные шрифты были слишком строгими, слишком честными, даже в извилистых вариациях модерна. Они обычно копировали и развивали латинские образцы — причем, скорее всего, шрифтовики были французы, а позже немцы. А вот вывесочный леттеринг был буйным, не всегда ловким, но часто находчивым. Он легко смешивал «славянские» и латинские жесты, и так же непринужденно вводил новые гибридные формы.</p>\n<p>В подписях к картинкам я обращаю внимание на всяких причудливых тварей с уличных композиций. Они очень точно показывают, как формировались представления о правильных буквах.</p>\n<p>Для поста отобраны в основном вывески, сохранившиеся до наших дней. Они все цветные — и это сразу дает вкус эпохи. Бóльшая часть их — нэпманская, но стилистика еще старорежимная. Основная масса вывесок взята с прекрасного сайта «Вспомнить всё». Одного из членов команды я знаю — это архитектор Пётр Шутов — Шлиман старинных московских вывесок.</p>\n<p>Последняя серия картинок — из упомянутого в начале поста проекта. Четыре года назад мне пришлось реконструировать около сотни старомосковских вывесок. Это была азартная охота с большим процентом выстрелов в молоко. Честно говоря, тогда я имел довольно смутное, по сравнению с нынешним, представление о предмете, но честно старался попасть в стиль и форму.</p>\n<p>Отчасти мои промахи извиняет очень низкое качество фотографий, с которыми приходилось работать. Как правило, вывеска на фото была снята в ракурсе и нерезко. Я выпрямлял ее в Фотошопе и потом отрисовывал в Иллюстраторе. За редкими исключениями реконструкции были фантазиями на тему. Правда, заказчику не всегда было необходимо стопроцентное сходство.</p>\n<p>Вывески столетней давности — свидетельство большой свободы выражения, которой пользовался растущий капитализм. Полицейское православное государство с его цензурой и строгими канонами общежития как бы оторопело перед натиском рекламного контента. Пройдет немного лет, и новая форма правления постарается снести со стен и крыш всё, что не укладывалось в ее идеологические рамки.</p>", "figs": [["img/r11/r11-001.jpg", "r11-001", "<p>Что было до: на литографии 1832 года вывески еще только робко осваивают фасады на Невском</p>", 1.0], ["img/r11/r11-002.jpg", "r11-002", "<p>Это Невский конца 19 века. Плотность рекламы сильно выросла. Константин Шапиро применяет семи-сериф.</p>", 1.0], ["img/r11/r11-003.jpg", "r11-003", "<p>Вывески многословны (можно даже скобки использовать) — пешеход не убежит</p>", 1.0], ["img/r11/r11-004.jpg", "r11-004", "<p>Очень характерные П и Н без внутренних засечек</p>", 1.0], ["img/r11/r11-005.jpg", "r11-005", "<p>А вот здесь реклама полностью закрыла архитектуру.<br>И это уже новая эстетика, а не просто визуальное варварство.</p>", 1.0], ["img/r11/r11-006.jpg", "r11-006", "<p>Тверская в начале прошлого века. Где там мэрия с кодом города?</p>", 1.0], ["img/r11/r11-007.jpg", "r11-007", "<p>Реклама была цветной. А буквы искали себя: смотрите на Ф, К, У — они как бы в раздумьях, какой тип шрифта выбрать. Кстати, У с горизонталью по центру — точная примета времени.</p>", 1.0], ["img/r11/r11-008.jpg", "r11-008", "<p>Эта вывеска на Пречистенке — одна из первых находок Петра Шутова. Это НЭП, видно падение качества исполнения. Но форма букв и тень через пробел — остатки прежней роскоши.</p>", 1.0], ["img/r11/r11-009.jpg", "r11-009", "<p>Еще одна нэпманская булочная. Опять не слишком ловко, но с претензией. Очень забавно вывернут объем. От эпохи — буквы У, Ч, Я</p>", 1.0], ["img/r11/r11-010.jpg", "r11-010", "<p>Типичная вывеска средней руки конца 19 века. Всё аккуратно, буква Л еще не умеет отлепить гнутый штрих от прямого</p>", 1.0], ["img/r11/r11-011.jpg", "r11-011", "<p>Булочная на Покровке. Вывески по кафелю в три слоя. Самый нижний не вижу, два других сделаны по типографским образцам</p>", 1.0], ["img/r11/r11-012.jpg", "r11-012", "<p>Фрагмент предыдущего снимка. Снизу виден модный ромбик с №2</p>", 1.0], ["img/r11/r11-013.jpg", "r11-013", "<p>Очень дорогая вывеска товарищества Кузнецова (фарфоровый магнат). Резьба по камню с покрытием сусальным золотом. При всей дороговизне буквы самопальные: разница в форме, плотности штрихов и т. д.<br>Но в этой неправильности — самый кайф. Как интересно сталкиваются М и С. Какое стильное Т-во. И, конечно, какие куцелапые, но обаятельные УЗ!</p>", 1.0], ["img/r11/r11-014.jpg", "r11-014", "<p>Еще одна дорогая вывеска — богатый винный дом француза Депре. Тоже резьба по камню с золочением, но буквы значительно строже кузнецовских</p>", 1.0], ["img/r11/r11-015.jpg", "r11-015", "<p>Скоропечатня Левенсона позволила себе сложный, стильный и хорошо проработанный леттеринг на крыше.</p>", 1.0], ["img/r11/r11-016.jpg", "r11-016", "<p>Все рельефные буквы на фасаде типографии Левенсона сделаны по образцам наборных шрифтов</p>", 1.0], ["img/r11/r11-017.jpg", "r11-017", "<p>Не смотрите на иль, смотрите выше. А. Ф. Дютфуа, довольно смелый модерн с игреком на месте У</p>", 1.0], ["img/r11/r11-018.jpg", "r11-018", "<p>Крутая реклама инденера Винавера с брандмауэра на шестом этаже дома в Чистом переулке. Очень характерный гротеск с Т с засечками. Забавно, что фамилия заказчика вдруг нарисована итальянскими буквами</p>", 1.0], ["img/r11/r11-019.jpg", "r11-019", "<p>Аптека времен НЭПа. Под неточно поставленной странноватой надписью с разными А проглядывает строгий старорежимный гротеск. Ну, и конечно без теней никуда: «нам, барыня, без белил никак нельзя»</p>", 1.0], ["img/r11/r11-020.jpg", "r11-020", "<p>Зубной врач с того же дома. Стрелка типографского образца</p>", 1.0], ["img/r11/r11-021.jpg", "r11-021", "<p>Шедевральный рельеф: очень дерзко и даже умело, хотя и дико. Буква З с выпяченной губой и совершенно непонятно зачем проваленные Д. 1900-е.</p>", 1.0], ["img/r11/r11-022.jpg", "r11-022", "<p>Аббревиатура технического свойства. Конец 19 века. Видно, как мучительно рождается типовой «обыкновенный» шрифт. Внимание на 2, У, Ч, 537</p>", 1.0], ["img/r11/r11-023.jpg", "r11-023", "<p>Зоологический монументальный гротеск: Г с козырьком, неловкие Л, Ч, гнутоногая К, узкая М, У в поиске идентичности</p>", 1.0], ["img/r11/r11-024.jpg", "r11-024", "<p>А вот здесь всё четко. Может быть, эскиз набрали в типографии</p>", 1.0], ["img/r11/r11-025.jpg", "r11-025", "<p>Глядя на эту надпись, подумал: человек 19 века пытается представить, как будет выглядеть монументальная типографика в 20-м. Помните, что мы пытались изобразить в 2000 году?<br>19 ЧАИ НЕКРАСОВА 00 — это же прогрессивно?<br>Не знаю, из чего буквы. Но очень выразительные, как будто кирпичами выложены</p>", 1.0], ["img/r11/r11-026.jpg", "r11-026", "<p>Печатная реклама. Как я мучился с этим Опорто — смотрите ниже.<br>В леттеринге интересно сочетание модных форм арнуво и почти вязевой Ф. Вообще Ф-тюльпан часто попадается в леттеринге модерна</p>", 1.0], ["img/r11/r11-027.jpg", "r11-027", "<p>Техношрифт эпохи золоченых шильдиков. Видно, что хочется минимализма, но до Баухауса еще лет десять</p>", 1.0], ["img/r11/r11-028.jpg", "r11-028", "<p>Обложка брошюры про вывески. 1917 год. Еще немного — и всё накроется военным коммунизмом</p>", 1.0], ["img/r11/r11-029.jpg", "r11-029", "<p>Как размечать вывески при помощи простейшего шаблона и веревочки</p>", 1.0], ["img/r11/r11-030.jpg", "r11-030", "<p>Кейс рекламиста-самоучки. Прочтите</p>", 1.0], ["img/r11/r11-031.jpg", "r11-031", "<p>Здесь и дальше — скриншоты из моих пдфов с восстановленными вывесками. Опять Христофоров, любитель Ф-амфор. Буквы в лого «ОПОРТО» имеют не только подлый изгиб по форме бутылки, но и тройную тень-объем с мягким краем.</p>", 1.0], ["img/r11/r11-032.jpg", "r11-032", "<p>Опять тюльпанная Ф, только перевернутая. Л у Лапина — такие тогда носили</p>", 1.0], ["img/r11/r11-033.jpg", "r11-033", "<p>Модный салон Франсуа и Александра. Образец шрифта для имен владельцев — наборный модерн-гротеск</p>", 1.0], ["img/r11/r11-034.jpg", "r11-034", "<p>Характерная Ф в Фотографии — со сплющенным по вертикали телом. У, как всегда, с перекладиной</p>", 1.0], ["img/r11/r11-035.jpg", "r11-035", "<p>Сначала был тонированный снимок. Потом я его обработал, стараясь вытащить детали. Потом отрисовал в Иллюстраторе</p>", 1.0], ["img/r11/r11-036.jpg", "r11-036", "<p>Сверху — пример того, с чем приходилось работать.<br>Снизу — достойный монументальный модерн в цирке. Это уже почти дизайн</p>", 1.0], ["img/r11/r11-037.jpg", "r11-037", "<p>Сергей Васильевич Перлов имел почти логотип — форма надписи повторяется на нескольких вывесках и в печатной рекламе. Здесь тоже «русский стиль» наползает на междунароный</p>", 1.0]], "research": null}, {"intro": false, "num": "12", "title": "Знаменитые футуристы", "ptitle": "Знаменитые футуристы", "subtitle": "", "date": "24 августа 2022", "perm": "https://www.facebook.com/story.php", "slug": "", "html": "<p><span class=\"dc\">з</span>НаМЕниТыЕ О|ОутУрИстЫ</p>\n<p>и  л  и</p>\n<h3>Пощекочёчина общественному вкусу</h3>\n<p>Огромное спасибо Ольге Дерновой, Главному библиографу Исторической библиотеки, за доступ к коллекции оцифрованных книг футуристов.</p>\n<p>Этот пост можно было и не писать, а просто сослаться на великолепную статью Владимира Кричевского (далее — ВК) в журнале «Шрифт».</p>\n<p>Однако, есть кое-что, оставленное в тени даже всеведущим ВК. А именно:</p>\n<p>Стоп. Предуведомление</p>\n<p>В этом посте речь идет о дооктябрьских футуристах: эксцентриках, хулиганах и маргиналах — но еще не комиссарах. Досоветские авангардисты отлично вписаны в ту культуру, которую они будоражат своими наскоками и пошлёпываниями.</p>\n<h3>Так вот</h3>\n<p>Футуристы _до Ильязда_ почти не занимаются типографикой. Со шрифтами играют, а типографической идеи не имеют. Их игровые модели — как точно заметил ВК — наборная афиша и титульный лист эпохи первоначального накопления. А всё прочее — как наборщик прописал. Или как Наталья Гончарова намахала незаточенным литографским карандашом.</p>\n<p>Расключенный набор в текстах и выключка по центру на особых полосах. Стандартные способы оформления эпиграфов, колонцифр, пьес. Содержания и списки литературы — как в академических томах.</p>\n<p>Отличный пример — «Пропевень о проросли мировой» — действо художника Филонова с его же иллюстрациями. Текст набран обыкновенной антиквой (а просится гротеск). Картинки вклеены на другой бумаге. Художник есть. Метранпаж есть. Типограф отсутствует.</p>\n<p>Нельзя быть авангардным во всем. Чуть забылся — и стал человеком своего (т. е. прошедшего) времени.</p>\n<p>Что же касается игры шрифтами — здесь тоже не всё так однозначно. В статье ВК есть две сестринские афиши футуристических гастролей 1914 года. Одна — казанская. Вторая — тифлисская. Макеты (если можно говорить о макетах) — почти идентичные. А шрифты все разные, видимо какие нашлись на месте.</p>\n<p>Значит, футуристы не сильно заботились о форме букв, даже когда ставили их вверх тормашками. Главное — чтоб были разные. А в типографиях того времени букв было завались — любой каприз за ваши деньги.</p>\n<p>Еще одна беда авангардистов — среди них попадались действительно сильные поэты. И вот им — Хлебникову и Маяковскому — игра шрифтами серьезно мешала. И тот, и другой работали с мясом текста. Им было важно, чтобы стихи прочитывались — звук за звуком, слог за слогом, связка за связкой. А в авангардной типографике они проглядывались. В игровом наборе Маяковский ничем не отличается от Андрея Кравцова, а вся его, Маяковского, ритмическая мощь гасится игрой в буквы. При этом полосы смотрятся очень нарядно.</p>\n<p>Футуристы любили печатать книги на всякой малопригодной всячине — на обоях, оберточной бумаге, картоне. Это создавало имидж нищих, но гордых поэтов. Однако, когда дело доходило до регулярных изданий, с расходом бумаги они не считались.</p>\n<p>Классика футуристического сборника: белая левая полоса; на правой — шмуцтитул с именем очередного автора; оборот шмуца пустой; на следующей правой полосе — поэза из трёх строчек. Авангард предельно торжествен в самоподаче. Вершина этого стиля — шмуц поэмы Маяковского «Я». Одна буква. И точка (непременный атрибут тогдашних шмуцов).</p>\n<p>В целом наборные книги и журналы футуристов — просто книжки с как придется заверстанными картинками. Картинки практически всегда глазастее набора: они лихие, небрежные, с плотными чёрными пятнами.</p>\n<p>Отдельно стоят литографические издания с рукописным текстом. Это штуки мощные, цельные, визуальнопоэтические, дикие — и очень плохо читаемые. И тут уж неважно, кто подвернулся под литографский карандаш — Крученых ли, Хлебников ли, Маяковский… Важно, кто рубил: Розанова, Гончарова, Ларионов, Филонов…</p>\n<p>Живописцы про типографику не ведают ничего, а буквы используют для заполнения пространства. Надо сказать, что на холсте тот же Ларионов обходится с текстами куда нежнее.</p>\n<p>Многие кириллические живописцы отдали дань кубистическим забавам с буквами. Это чисто внешние эффекты, независимо от того, написаны знаки маслом или вклеен кусок реальной газеты. Даже Малевич поиграл в вывески, да и бросил.</p>\n<p>На десерт я оставил немного рекламы и четвёртых обложек с ценой. Футуристические классифайды часто живее, чем громокипящие тексты. А цены говорят об истинном положении гордых поэтов в тогдашнем культурном поле. Видимо, поэтому в рекламе часто появляются сообщения: «распродано».</p>\n<p>Вы б купили «Изборник» Хлебникова, где, кроме стихов, на обложке заявлено: «11 рисунков Филонова (кисть, перо и резец), 1 рис. К. Малевича. Подобень* В. Хлебникова рис. Над. Бурлюк»? Цена 70 коп. Я б купил.</p>\n<p>*подобень — судя по всему портрет на обложке. Хороший портрет.</p>\n<p>Конклюзия: удивительно, но футуристы очень мало подвинули кириллицу. Даже добавка грубости, примитива скорее заслуга конструктивистов с их палочным шрифтом — и безвестных советских оформителей с их плакатными перьями и объявлениями о профсоюзных собраниях.</p>\n<p>Значительно сильнее выступили менее радикальные модернисты из «Мира искусств», а особенно мощно — Чехонин, Билибин, Нарбут. Именно у них современная кириллица начала становиться сама собой, отделяясь от петровско-латинской матрицы.</p>\n<p class=\"ps\"><span class=\"pslabel\">PS</span> Как всегда, картинки с подписями. Читайте, там есть очень интересные детали.</p>", "figs": [["img/r12/r12-001.jpg", "r12-001", "<p>«Садок Судей». 1910. Ранний опыт на обоях. Наклейка на обложке. Малый формат</p>", 1.0], ["img/r12/r12-002.jpg", "r12-002", "<p>«Садок Судей». В. Бурлюк в стиле Валлотона</p>", 1.0], ["img/r12/r12-003.jpg", "r12-003", "<p>«Садок Судей». Первый стих сборника. Василий Каменский. Набор Обыкновенной антиквой и курсивом</p>", 1.0], ["img/r12/r12-004.jpg", "r12-004", "<p>«Садок Судей». Левые страницы пустые, зато с рисуночком</p>", 1.0], ["img/r12/r12-005.jpg", "r12-005", "<p>«Пощечина общественному вкусу». 1912. Обложка с гротеском и выключкой влево (не часто). Точка на обложке. Редкий случай минимализма</p>", 1.0], ["img/r12/r12-006.jpg", "r12-006", "<p>Полоса из критического сборника «Ослиный хвост и мишень», начинающегося словами: «мы, лучисты и будущники, не желаем…» Дальше много интересного, но совсем нет авангардного набора. И вдруг…</p><p>На картинке — пример «нарощения фразы» из статьи Ильязда. Как выяснилось (спасибо, Евгений Григорьев) это не схема, а таки сам стих. Теперь вопрос: кто его набрал для сборника?</p>", 1.0], ["img/r12/r12-007.jpg", "r12-007", "<p>Следующая полоса из «Ослиного хвоста и мишени». Статья Ильязда. Опять красивый набор — и кажется, это визуальная поэзия. А кто наборщик?</p>", 1.0], ["img/r12/r12-008.jpg", "r12-008", "<p>«Владимир Маяковский. Трагедия». 1914<br>Титул непростой, с разбросанными блоками текста.<br>Шрифты — все — модерн.<br>Год и типографию ставил метранпаж. По центру</p>", 1.0], ["img/r12/r12-009.jpg", "r12-009", "<p>«Владимир Маяковский. Трагедия». Авантитул</p>", 1.0], ["img/r12/r12-010.jpg", "r12-010", "<p>«Владимир Маяковский. Трагедия». Первая полоса.<br>Верстальщик мешает поэту, но украшает лист</p>", 1.0], ["img/r12/r12-011.jpg", "r12-011", "<p>«Владимир Маяковский. Трагедия». Вторая полоса.<br>Слом строки с расключкой — классика тогдашнего набора</p>", 1.0], ["img/r12/r12-012.jpg", "r12-012", "<p>«Владимир Маяковский. Трагедия». Следующая полоса</p>", 1.0], ["img/r12/r12-013.jpg", "r12-013", "<p>«Владимир Маяковский. Трагедия». И еще одна. Показываю так много для понимания ритма книги</p>", 1.0], ["img/r12/r12-014.jpg", "r12-014", "<p>«В. Маяковский. Я!» 1913. Обложка литографированного издания. Ставлю автора внутрь кавычек, потому что он — не более чем предлог для игры</p>", 1.0], ["img/r12/r12-015.jpg", "r12-015", "<p>«В. Маяковский. Я!» Первая полоса. Выходные данные. Или титул.</p>", 1.0], ["img/r12/r12-016.jpg", "r12-016", "<p>«В. Маяковский. Я!» Фронтиспис</p>", 1.0], ["img/r12/r12-017.jpg", "r12-017", "<p>«В. Маяковский. Я!» И понеслась, вперебивку с картинками. Приятного чтения</p>", 1.0], ["img/r12/r12-018.jpg", "r12-018", "<p>Крученых. «Помада». 1913. Рисунки Ларионова.<br>Роскошная книга</p>", 1.0], ["img/r12/r12-019.jpg", "r12-019", "<p>Крученых. «Помада». Четвертая обложка.<br>Раскрашенная вручную — за два рубля.</p>", 1.0], ["img/r12/r12-020.jpg", "r12-020", "<p>Крученых. «Помада». Первая страница.</p>", 1.0], ["img/r12/r12-021.jpg", "r12-021", "<p>Крученых. «Помада». Вторая страница. На золоте.</p>", 1.0], ["img/r12/r12-022.jpg", "r12-022", "<p>Крученых. «Помада».<br>Литографированный почерк Михаила Ларионова</p>", 1.0], ["img/r12/r12-023.jpg", "r12-023", "<p>Крученых. «Утиное гнездышко дурных слов». 1914. Рисунки Розановой. Обложка-обманка, как будто внутри стихи наборчиком</p>", 1.0], ["img/r12/r12-024.jpg", "r12-024", "<p>Крученых. «Утиное гнездышко дурных слов». Вторая, настоящая обложка</p>", 1.0], ["img/r12/r12-025.jpg", "r12-025", "<p>Крученых. «Утиное гнездышко дурных слов». Первая полоса.<br>И понеслась.</p>", 1.0], ["img/r12/r12-026.jpg", "r12-026", "<p>Крученых. «Утиное гнездышко дурных слов».<br>Это Розанова крутит Крученых</p>", 1.0], ["img/r12/r12-027.jpg", "r12-027", "<p>Крученых. «Пустынники. Пустынница». 1913. Рисунки Гончаровой. Вот думаю — а может наоборот? Гончарова, слова крученых?</p>", 1.0], ["img/r12/r12-028.jpg", "r12-028", "<p>Крученых. «Пустынники. Пустынница». Первая иллюстрация после титула (который я пропустил)</p>", 1.0], ["img/r12/r12-029.jpg", "r12-029", "<p>Крученых. «Пустынники. Пустынница».<br>Гончарова литографирует буквы с уклоном в устав</p>", 1.0], ["img/r12/r12-030.jpg", "r12-030", "<p>Павел Филонов. «Пропевень о проросли мировой». 1915. Обложка.<br>Небольшая аккуратная книжка</p>", 1.0], ["img/r12/r12-031.jpg", "r12-031", "<p>Павел Филонов. «Пропевень о проросли мировой». Шмуцтитул. Выключка по центру. Капитель.</p>", 1.0], ["img/r12/r12-032.jpg", "r12-032", "<p>Павел Филонов. «Пропевень о проросли мировой». Первая полоса. Обыкновенный (это название) шрифт. Действующие лица в разрядку. Текст со втяжкой. Колонцифра нонпарелью.<br>Чисто.</p>", 1.0], ["img/r12/r12-033.jpg", "r12-033", "<p>Павел Филонов. «Пропевень о проросли мировой».<br>Филонов рисовал. Вклейка</p>", 1.0], ["img/r12/r12-034.jpg", "r12-034", "<p>Павел Филонов. «Пропевень о проросли мировой».<br>Филонов рисовал. Вклейка набок</p>", 1.0], ["img/r12/r12-035.jpg", "r12-035", "<p>Павел Филонов. «Пропевень о проросли мировой».<br>Филонов рисовал. Вклейка (последняя в книге).<br>Вдруг подпись: «Принцип чистой действующей формы».<br>Вот где прятался авангардист!</p>", 1.0], ["img/r12/r12-036.jpg", "r12-036", "<p>Афиша гастролей знаменитых московских футуристов. Казань, 20 февраля 1914</p>", 1.0], ["img/r12/r12-037.jpg", "r12-037", "<p>Афиша гастролей знаменитых московских футуристов. Тифлис, 27 марта 1914.<br>Сравните две афиши и найдите две одинаковых буквы на одинаковых позициях. Возможно, их очень много. Я не полез сравнивать</p>", 1.0], ["img/r12/r12-038.jpg", "r12-038", "<p>Михаил Ларионов. Серия «Времена года». 1912. Весна<br>Кащалось бы — тот же прием, что и в наборе: чередующиеся буквы разных начертаний. Но в рукописной живописи они выглядят куда современней, чем оттиснутые на бумаге. Здесь, на мой взгляд, начинается трансфомация кириллицы</p>", 1.0], ["img/r12/r12-039.jpg", "r12-039", "<p>Михаил Ларионов. Серия «Времена года». 1912. Лето.<br>Эти картинки — самые любимые мои у Ларионова. Потому что с ухоженными буковками</p>", 1.0], ["img/r12/r12-040.jpg", "r12-040", "<p>Казимир Малевич. Англичанин в Москве. 1914.<br>Неплохо срисованы вывески. Но это пока еще пост-кубизм</p>", 1.0], ["img/r12/r12-041.jpg", "r12-041", "<p>Михаил Ларионов. Портрет Натальи Гончаровой. 1915<br>Коллаж с вклейкой кусков афиш. Печатные буквы в кубистической стилистике почти ничем не отличаются от живописных</p>", 1.0], ["img/r12/r12-042.jpg", "r12-042", "<p>Наталья Гончарова. Ох, устал искать, откуда фрагмент. Очень забавная кириллица, изображающая готическое письмо. Говорил же — не знают они типографики!<br>И слава богу</p>", 1.0], ["img/r12/r12-043.jpg", "r12-043", "<p>Иван Пуни. «Трамвай номер 5». 1910-е<br>Вот где новые-то буквы</p>", 1.0], ["img/r12/r12-044.jpg", "r12-044", "<p>Владимир Татлин. «Трамвай В». 1915<br>Видать дизайнера</p>", 1.0], ["img/r12/r12-045.jpg", "r12-045", "<p>В. Хлебников. «Ряв! Перчатки» 1914. Обложка</p>", 1.0], ["img/r12/r12-046.jpg", "r12-046", "<p>В. Хлебников. «Ряв! Перчатки». Авантитул</p>", 1.0], ["img/r12/r12-047.jpg", "r12-047", "<p>В. Хлебников. «Ряв! Перчатки». Первая полоса.<br>Текст 1908 года, но опубликован сразу после начала войны. Прочтите</p>", 1.0], ["img/r12/r12-048.jpg", "r12-048", "<p>«Велемир Владимирович Хлебников. Творения, том 1»<br>«Первый журнал русских футуристов». 1914. Издание футуристического же издательства «Гилея»<br>Не знаю, случайно иль нарочно всё встало под обрез</p>", 1.0], ["img/r12/r12-049.jpg", "r12-049", "<p>«Велемир Владимирович Хлебников. Творения, том 1». Фронтиспис (до титула)</p>", 1.0], ["img/r12/r12-050.jpg", "r12-050", "<p>«Велемир Владимирович Хлебников. Творения, том 1». Титул</p>", 1.0], ["img/r12/r12-051.jpg", "r12-051", "<p>«Велемир Владимирович Хлебников. Творения, том 1». Первая полоса<br>И сразу: ГЕНИАЛЬНОГО. Даже не дождавшись именительного падежа. И потом еще и еще — жирным шрифтом (арнувошным) вразрядку.</p>", 1.0], ["img/r12/r12-052.jpg", "r12-052", "<p>«Велемир Владимирович Хлебников. Творения, том 1»<br>Вторая полоса и опять полно выкриков п/ж.<br>Читатель подчеркнул: «тявкали Осоргины»</p>", 1.0], ["img/r12/r12-053.jpg", "r12-053", "<p>«Первый журнал русских футуристов». 1914. Обложка и титул одинаковые.<br>Наконец догадались набрать что-то гротеском с выключкой влево. И тут же долбанули итальянскими цифрами</p>", 1.0], ["img/r12/r12-054.jpg", "r12-054", "<p>«Первый журнал русских футуристов». Первая полоса. Скучно, господа</p>", 1.0], ["img/r12/r12-055.jpg", "r12-055", "<p>«Первый журнал русских футуристов». Оглавление.<br>Гротеск, и с жирным, чисто — а выпендриться забыли</p>", 1.0], ["img/r12/r12-056.jpg", "r12-056", "<p>Хлебников. «Время мера мира». 1916. Обложка</p>", 1.0], ["img/r12/r12-057.jpg", "r12-057", "<p>Хлебников. «Время мера мира». 1916. Титул.<br>Догадайтесь, что внутри</p>", 1.0], ["img/r12/r12-058.jpg", "r12-058", "<p>Хлебников. «Время мера мира». 1916.<br>А вот и не угадали. Внутри безумная нумерология</p>", 1.0], ["img/r12/r12-059.jpg", "r12-059", "<p>Хлебников. «Время мера мира». 1916.<br>И даже с табличкой</p>", 1.0], ["img/r12/r12-060.jpg", "r12-060", "<p>Хлебников. «Изборник стихов с послесловием речаря». Изд. ЕУЫ, 1914. Обложка с рекламой картинок</p>", 1.0], ["img/r12/r12-061.jpg", "r12-061", "<p>Хлебников. «Изборник стихов с послесловием речаря». Титул<br>Это авангард или декаданс?</p>", 1.0], ["img/r12/r12-062.jpg", "r12-062", "<p>Хлебников. «Изборник стихов с послесловием речаря». Шмуцтитул.<br>Ай!</p>", 1.0], ["img/r12/r12-063.jpg", "r12-063", "<p>Хлебников. «Изборник стихов с послесловием речаря».<br>И вот такой набор той же Обыкновенной гарнитурой</p>", 1.0], ["img/r12/r12-064.jpg", "r12-064", "<p>Хлебников. «Изборник стихов с послесловием речаря».<br>О том, как футуристы любили пустую бумагу</p>", 1.0], ["img/r12/r12-065.jpg", "r12-065", "<p>Хлебников. «Изборник стихов с послесловием речаря».<br>А вот и Малевич в конце</p>", 1.0], ["img/r12/r12-066.jpg", "r12-066", "<p>Хлебников. «Изборник стихов с послесловием речаря».<br>Послесловие речаря<br>После этой полосы вставлена дичайшая литографская книга на оранжеврй бумаге, нарисованная и написанная Филоновым. Красота адская, но уже не влезла. Ищите в коллекции</p>", 1.0], ["img/r12/r12-067.jpg", "r12-067", "<p>Крученых, Хлебников. «Бух лесиный».<br>На этом месте я устал писать подписи. Добавлю позже</p>", 1.0], ["img/r12/r12-068.jpg", "r12-068", "<p>Крученых, Хлебников. «Бух лесиный».</p>", 1.0], ["img/r12/r12-069.jpg", "r12-069", "<p>Крученых, Хлебников. «Бух лесиный».</p>", 1.0], ["img/r12/r12-070.jpg", "r12-070", "<p>Обложка, простая как мычание. Редкость</p>", 1.0], ["img/r12/r12-071.jpg", "r12-071", "<p>Не знаю фуистов, но книжка супер</p>", 1.0], ["img/r12/r12-072.jpg", "r12-072", "<p>Здесь написано «Бубен», но автор слегка перемешал алфавиты</p>", 1.0], ["img/r12/r12-073.jpg", "r12-073", "<p>Четвертая обложка со стильным лого издательства «Центрифуга» и грандиозной ценой в 1₽</p>", 1.0], ["img/r12/r12-074.jpg", "r12-074", "<p>Четвертая обложка. Все новые поэты любили слово «лира». В данном случае — имя издательства. 50 к.</p>", 1.0], ["img/r12/r12-075.jpg", "r12-075", "<p>Рекламная полоса в конце книги</p>", 1.0], ["img/r12/r12-076.jpg", "r12-076", "<p>Последняя страница с ценой</p>", 1.0], ["img/r12/r12-077.jpg", "r12-077", "<p>Про эту книгу подробно написал ВК.<br>Я тоже напишу, когда сил наберусь</p>", 1.0], ["img/r12/r12-078.jpg", "r12-078", "<p>Тот самый Кравцов, соперник Маяковского</p>", 1.0], ["img/r12/r12-079.jpg", "r12-079", "<p>А вот это Василий Каменский, пилот-авиатор. И это — настоящая наборная визуальная поэзия. До Ильязда</p>", 1.0], ["img/r12/r12-080.jpg", "r12-080", "<p>И еще того же автора. Здесь всё по делу — композиция, выделения, отбивки</p>", 1.0]], "research": null}, {"intro": false, "num": "13", "title": "Кириллица по направлению к латинице, или «болгарица» в Российской империи", "ptitle": "Кириллица по направлению к латинице, или «болгарица» в Российской империи", "subtitle": "", "date": "6 сентября 2022", "perm": "https://www.facebook.com/story.php", "slug": "", "html": "<p><span class=\"dc\">К</span>ириллица по направлению к латинице,</p>\n<p>или «болгарица» в Российской империи</p>\n<p>По моему глубокому убеждению, кириллица в начале 20 века еще не окончательно пришла в себя после петровской реформы и не была осознана как пластическое целое.</p>\n<p>(Она и сейчас еще не вполне самоорганизовалась, но об этом в другой раз и в другом контексте).</p>\n<p>Текстовые наборные шрифты к 1900 году уже устаканились. Но их форму двести лет шлифовали преимущественно европейские пуансонисты — голландцы, французы, немцы. Ничего специфически кириллического в ней не было, за исключением отдельных знаков. Скажем, вместо треугольных Дд, Лл возникли трапециевидные.</p>\n<p>Процесс выглаживания, очистки, взаимной подгонки форм букв в наборных шрифтах похож на обтачивание гальки морем. В результате должны получиться максимально приятные глазу, разборчивые, корректные, аккуратные, но всё же немного скучные буковки.</p>\n<p>Параллельно с этим идет второй процесс: поиск границ — читаемости, красоты, неоскорбительности. И вот именно здесь проявляется характер письменности, складывается её автопортрет. Что можно и чего нельзя? Что читается и что уже не буква? Что жуть как безобразно, что ужас как прелестно, что слишком простонародно, а что неприемлемо артистично?</p>\n<p>В РИ к началу 20 века этот автопортрет только начали набрасывать. Первыми и самыми последовательными новаторами были художники круга «Мира искусства». Но не только они.</p>\n<p>Самоидентификация кириллицы шла по нескольким направлениям.</p>\n<p>Первое и главное — шлифовка петровской формы в прямых типографских шрифтах.</p>\n<p>Второе — модернизация допетровских форм, как в наборе, так и в акциденции и леттеринге.</p>\n<p>Третий поток — самоосознание курсива и рукописных почерков. Кириллический послепетровский курсив гораздо ближе к латинице, чем прямой типографский шрифт. Поэтому он был сильнее подвержен западным влияниям.</p>\n<p>Наконец, четвертое направление — поиск новых форм, не предусмотренных Петром. Здесь в куче всё: искажения арнуво, низовые влияния от лубка, «славянские» стилизации…</p>\n<p>Один из радикальных видов трансформации «гражданки петровой» — внедрение в ее строчной ряд прямого курсива на манер латиницы. То, что через сто лет назовут «болгарицей».</p>\n<p>О первом опыте такого рода я узнал из «Русского типографского шрифта» Шицгала. В 1874 году книгопродавец и словолитчик М. О. Вольф выпустил «новый эльзевир» — шрифт со строчными, близкими по форме к латинице.</p>\n<p>Забавно, что побудительным мотивом было импортозамещение: русский немец Вольф купил словолитню русского француза Ревильона и заказал истинно русские буквы, страсть как похожие на латинские.</p>\n<p>Причины для резкой трансформации строчных один в один те же, что спустя сто лет у сторонников болгарицы:</p>\n<p>«Современные русские шрифты представляют множество неудобств, как в чисто типографском отношении, так и в гигиеническом, по вредному действию на глаза читателя. Многие буквы по форме своей весьма схожи, например, буквы „н”, „п”, „и”, что ведет неминуемо к опечаткам; к этой похожести букв друг на друга присоединяется еще один недостаток: весьма немногие буквы выдаются над строкой, отчего строки выходят однообразные, печать некрасивая, и глаз, не находя точек опоры, весьма скоро утомляется».</p>\n<p>(Скажу в скобках: кажется, никто до меня не попытался проанализировать, как именно читается наборная строчная кириллица. Выносные элементы в этом процессе почти не участвуют).</p>\n<p>Кстати, в те же годы немецкие гигиенисты не рекомендовали соотечественникам читать антикву (а только готику!), потому что антиква портит зрение.</p>\n<p>Эксперимент патриота Вольфа не имел больших последствий. Спустя 30-40 лет новый эльзевир так и остался единственной чисто текстовой антиквой в новой раскладке. Скажем, более поздняя Пальмира с ярко выраженными «болгарскими» чертами — все же скорее акцидентный шрифт, хотя ее можно встретить и в текстовых блоках.</p>\n<p>Правда, среди гротесков Лемана нашелся один «болгарский» (см. картинки), но у него был второй, «гражданский» вариант.</p>\n<p>Чаще всего латинизация видна в шрифтах арнуво. Видимо, их переводчики старались использовать латинские формы как более модные — в конце 1970-х мы еще раз переболели этой детской болезнью )</p>\n<p>Намного больше сближений с латиницей в курсивах. Строчная k латинского вида — обычное дело, но были и другие прямые заимствования. Например, в шрифтах рондо заглавные И, Ц, Ш, Щ часто делали на базе латинской U.</p>\n<p>В стоячих курсивах форма букв бывала самой разнообразной, иногда меняясь даже в разных кеглях одного шрифта. Часто прямая а соседствовала с курсивной д хвостом вверх (как в Каролле), а латинского вида k стояла рядом с низенькой ж. Все эти вариации говорят о поиске устраивающего большинство читателей комплекта курсивных знаков. Но общая тенденция начала века — на сближение с латиницей.</p>", "figs": [["img/r13/r13-001.jpg", "r13-001", "<p>Эльзевир Вольфа. 1874. Прорисовка некоторых знаков. Автор пытается переосмыслить буквы кириллицы в латинской логике, но не знает, как справиться с штрихами, не соответствующими движениям широкого пера (хвост я, тонкий штрих д).</p>", 1.0], ["img/r13/r13-002.jpg", "r13-002", "<p>Эльзевир Вольфа. Альтернейты в металлическом наборе. Самые радикальные глифы (б, вторая г, ж, последняя u) — прямые предшественники «болгарицы»</p>", 1.0], ["img/r13/r13-003.jpg", "r13-003", "<p>Шрифт «Слава» Синодальной типографии. 1900. Латинские односторонние засечки ы, ч; латинская u вместо й.</p>", 1.0], ["img/r13/r13-004.jpg", "r13-004", "<p>Шрифт «Слава» Синодальной типографии. С одной стороны — латинские ходы в u, ш, с другой — архаичная т, обыкновенные л, д.</p>", 1.0], ["img/r13/r13-005.jpg", "r13-005", "<p>Шрифт «Слава» Синодальной типографии в текстовом блоке</p>", 1.0], ["img/r13/r13-006.jpg", "r13-006", "<p>Шрифт «Слава» на титуле. 1902</p>", 1.0], ["img/r13/r13-007.jpg", "r13-007", "<p>Готическая кириллица Синодальной типографии</p>", 1.0], ["img/r13/r13-008.jpg", "r13-008", "<p>Внезапный «книжный» гротеск словолитни Гербека. Первый вариант — жестокая «болгарица», даже ж слелана из двух k с проваленной серединой. Латиница кажется куда менее курсивной: в кириллице полно мест, где подряд идут uuuuu</p>", 1.0], ["img/r13/r13-009.jpg", "r13-009", "<p>Тот же «книжный» гротеск Гербека, но совершенно обычный. Любопытно сравнить латиницу с обоими вариантами.</p>", 1.0], ["img/r13/r13-010.jpg", "r13-010", "<p>Эльзевир Гербека 1911 года очень похож на вольфовский 1874, но имеет несколько явно завиральных букв. например, т и особенно х, которую непонятно зачем и в латиницу запихнули</p>", 1.0], ["img/r13/r13-011.jpg", "r13-011", "<p>Тот же самый эльзевир Гербека, но в «гражданском» варианте</p>", 1.0], ["img/r13/r13-012.jpg", "r13-012", "<p>Курсив эльзевира Гербека. Строчная ф с вывернутым контрастом овалов. Строчная в — в рост строчных, по-кириллически, а ж, k — «латинские»</p>", 1.0], ["img/r13/r13-013.jpg", "r13-013", "<p>В некоторых обыкновенных шрифтах начала прошлого века делали курсивную у с круглым низом</p>", 1.0], ["img/r13/r13-014.jpg", "r13-014", "<p>Запомните эту Гейшу. Она еще появится в самом неожиданном месте )</p>", 1.0], ["img/r13/r13-015.jpg", "r13-015", "<p>Крупнокегельный вариант «книжного» гротеска. Из обычного набора вдруг торчит k</p>", 1.0], ["img/r13/r13-016.jpg", "r13-016", "<p>Итальянский Гербека. Строчная k на латинский манер</p>", 1.0], ["img/r13/r13-017.jpg", "r13-017", "<p>Еще «болгарский» титульный гротеск Гербека</p>", 1.0], ["img/r13/r13-018.jpg", "r13-018", "<p>Эту страницу притащил за одну букву. Видите её? )</p>", 1.0], ["img/r13/r13-019.jpg", "r13-019", "<p>Каролла, вообще-то, г-на Бертгольда сочинение. Один из самых последовательно решенных стоячих курсивов</p>", 1.0], ["img/r13/r13-020.jpg", "r13-020", "<p>Еще Каролла Гербека</p>", 1.0], ["img/r13/r13-021.jpg", "r13-021", "<p>Циркулярный Гербека. Строчная к — низкая</p>", 1.0], ["img/r13/r13-022.jpg", "r13-022", "<p>Пример разных решений в разных кеглях. Кегель 8 — наклонный шрифт. Кегель 16 — почти каллиграфия. Кг 24 — опять наклонный</p>", 1.0], ["img/r13/r13-023.jpg", "r13-023", "<p>Стоячий курсив с явными курсивными наклонностями. Трехногие Т, т. Высокая в</p>", 1.0], ["img/r13/r13-024.jpg", "r13-024", "<p>Еще курсивный гротеск Гербека</p>", 1.0], ["img/r13/r13-025.jpg", "r13-025", "<p>Жирный курсив со скорописной б и курсивной в</p>", 1.0], ["img/r13/r13-026.jpg", "r13-026", "<p>Каллиграфическая Гербека. В слове Либава курсивная б, но низкая в</p>", 1.0], ["img/r13/r13-027.jpg", "r13-027", "<p>Скорописные Гербека просто для красоты</p>", 1.0], ["img/r13/r13-028.jpg", "r13-028", "<p>Эту страницу ставлю за две У в словах Сухиничи и Сурухан</p>", 1.0], ["img/r13/r13-029.jpg", "r13-029", "<p>Еще эльзевир. Вперемешку обычный и «болгарский»</p>", 1.0], ["img/r13/r13-030.jpg", "r13-030", "<p>Каким боком эти скрипты к эльзевиру — ума не приложу. Но пусть будут</p>", 1.0], ["img/r13/r13-031.jpg", "r13-031", "<p>Вы еще не устали листать гербековские курсивы? Я, честно говоря, уже замотался</p>", 1.0], ["img/r13/r13-032.jpg", "r13-032", "<p>А они всё никак не кончаются. И всё такие деликатные. Жаль, что революционные матросы перелили их на пули</p>", 1.0], ["img/r13/r13-033.jpg", "r13-033", "<p>А вот рондо. В этом варианте заглавная И не равна заглавной U. То есть это рондоготика</p>", 1.0], ["img/r13/r13-034.jpg", "r13-034", "<p>А это рондобарокко. Всё круглое, кроме самого жирного начертания.</p>", 1.0], ["img/r13/r13-035.jpg", "r13-035", "<p>А это рондо, играющее в обычный курсив. Кстати, мне кажется, что курсивы намного органичнее по формам отдельных знаков, чем прямые шрифты. Видимо потому, что их уже двести лет шлифовали массовым переписыванием от руки.</p>", 1.0], ["img/r13/r13-036.jpg", "r13-036", "<p>Несколько готических шрифтов от Отто Оттовича. Интересно, в слове Або такая б?</p>", 1.0], ["img/r13/r13-037.jpg", "r13-037", "<p>Еще Гербек-кириллик-готика. Забавно смотрится Жито. А еще страннее — Юс большой йотированный. Найдёте?</p>", 1.0], ["img/r13/r13-038.jpg", "r13-038", "<p>Если вы думаете, что у Гербека было три страницы кирил-готики, то вы ошибаетесь</p>", 1.0], ["img/r13/r13-039.jpg", "r13-039", "<p>Их было четыре, и даже с ломбардскими версалами</p>", 1.0], ["img/r13/r13-040.jpg", "r13-040", "<p>Для разнообразия — английский курсив с английскими k в кириллице</p>", 1.0], ["img/r13/r13-041.jpg", "r13-041", "<p>А здесь в верхней строке низкая в. Это влияние антиквенных текстовых курсивов, где победил этот вариант</p>", 1.0], ["img/r13/r13-042.jpg", "r13-042", "<p>Ну всё, последний из Гербеков. С тремя разными строчными д. Иногда такие альтернейты попадались в одном наборе</p>", 1.0], ["img/r13/r13-043.jpg", "r13-043", "<p>Два бертгольдовских арнуво с u на месте и. А вот строчнык к — без высокой мачты</p>", 1.0], ["img/r13/r13-044.jpg", "r13-044", "<p>Виктория. Лемановский ответ бертгольдовской Каролле. Строчные в стоячем курсиве решены точно так же</p>", 1.0], ["img/r13/r13-045.jpg", "r13-045", "<p>Газетный курсив Лемана. Странные незакрытые в, срифмованные с k. Но только в первом случае петля для кириллицы — смысловой элемент, а во втором — декоративный. Строчная б — рукописная. Интересно, что такую форму имеют многие б в прямых шрифтах Лемана</p>", 1.0], ["img/r13/r13-046.jpg", "r13-046", "<p>Упавший Фурор. Последовательно латинизированный перевод</p>", 1.0], ["img/r13/r13-047.jpg", "r13-047", "<p>Страшно выпендрежный двухкрасочный курсив с неожиданно готической р</p>", 1.0], ["img/r13/r13-048.jpg", "r13-048", "<p>Новинка 1902 года: шрифт Германия от Лемана. Авангардная кириллическая готика, где чего только не намешано. Германию под разными именами продавали почти все словолитни. Не знаю, покупали у Лемана или сами перепилили. Она есть даже в советском репертуаре двадцатых. Потом, видимо, переплавили</p>", 1.0], ["img/r13/r13-049.jpg", "r13-049", "<p>Еще Германия с той же рекламы Лемана</p>", 1.0], ["img/r13/r13-050.jpg", "r13-050", "<p>Курсивы Лемана, в том числе рондо — со своими прибамбасами</p>", 1.0], ["img/r13/r13-051.jpg", "r13-051", "<p>Скандия Бертгольда — тоже стоячий курсив. Жаль, не видно ни одной и</p>", 1.0], ["img/r13/r13-052.jpg", "r13-052", "<p>Рондо из каталога варшавской словолитни Пиус-Бауера. 1888. Заглавные А на европейский манер</p>", 1.0], ["img/r13/r13-053.jpg", "r13-053", "<p>Любопытный каталог одного шрифта: словолитня Флинша из Франкфурта на Майне с представительством в Питере презентует в 1910 году новейший шрифт по рисунку проф. Ланга. Кириллица сделана точно по «гражданскому» канону, но Ш и ц с легким выгибом первого штриха</p>", 1.0], ["img/r13/r13-054.jpg", "r13-054", "<p>Еще шрифт Флинш-Ланга</p>", 1.0], ["img/r13/r13-055.jpg", "r13-055", "<p>И еще шрифт Флинш-Ланга. 18 агентств за границей, между прочим</p>", 1.0], ["img/r13/r13-056.jpg", "r13-056", "<p>Последний наборный шрифт с «болгарской» логикой — знаменитая Пальмира. Полоса из каталога издательства «Книга» 1966 года. Да, вот такая желтая бумажка. И шрифт сильно потрёпанный.<br>В Пальмире масса странностей, начиная от куцего нижнего выноса р, ф. Строчные д, ж, k, л, ы, ь — «болгарского» вида. Строчная б — барочная, но обычной формы. Строчная m — старинно трёхногая. Но самое, может быть, странное — диересис, он же умляут, вместо кратки. А строчные и — нормальные вдруг.</p>", 1.0], ["img/r13/r13-057.jpg", "r13-057", "<p>Всё! Хватит набора. Отсюда и до конца — картинки из учебника каллиграфии 1915 года. Первая — строчное рондо с латинской k, но кириллической рукописной ж</p>", 1.0], ["img/r13/r13-058.jpg", "r13-058", "<p>Каллиграфия 1915. Заглавное рондо. Е, Ж и прочие ЦЧШЩ — прямиком из прописей. А вот Ъ (или это ять?!) готичекий</p>", 1.0], ["img/r13/r13-059.jpg", "r13-059", "<p>Каллиграфия 1915. Батард — тоже почерк плоским пером.</p>", 1.0], ["img/r13/r13-060.jpg", "r13-060", "<p>Каллиграфия 1915. Батард — алфавит. Как бы латинский в прошлом, но очень сильно одомашненный</p>", 1.0], ["img/r13/r13-061.jpg", "r13-061", "<p>Каллиграфия 1915. Готика. Посмотрим, как каллиграф справится с переводом</p>", 1.0], ["img/r13/r13-062.jpg", "r13-062", "<p>Каллиграфия 1915. Строчная готика. И вот пошли смешные неожиданности. Строчная б без выноса. Зато ж получилась. А вот с л, я не удалось справиться.</p>", 1.0], ["img/r13/r13-063.jpg", "r13-063", "<p>Каллиграфия 1915. Фрактура. На заголовке смотрится неплохо</p>", 1.0], ["img/r13/r13-064.jpg", "r13-064", "<p>Каллиграфия 1915. Готический, заглавные. Что-то поторопился скорописец.</p>", 1.0], ["img/r13/r13-065.jpg", "r13-065", "<p>Каллиграфия 1915. Фрактура строчные. Тех же щей, что и просто готика. Сложных и неоднозначных</p>", 1.0], ["img/r13/r13-066.jpg", "r13-066", "<p>Каллиграфия 1915. Фрактура заглавные. Вот это я понимаю красота. Особенно Ж</p>", 1.0], ["img/r13/r13-067.jpg", "r13-067", "<p>Каллиграфия 1915. Помните, я намекал на вторую встречу с гейшей? Вот она, слегка замаскированная под модный славянский имидж</p>", 1.0]], "research": null}, {"intro": false, "num": "14", "title": "Часть 2: Буря и натиск", "ptitle": "Часть 2: Буря и натиск", "subtitle": "", "date": "3 октября 2022", "perm": "https://www.facebook.com/story.php", "slug": "", "html": "<p><span class=\"dc\">С</span> трудом заставляю себя перейти черту 25 октября 1917 года по старому стилю. Трудно писать беспристрастно о большевиках и устроенном ими порядке, будучи убежденным антикоммунистом. Но все же постараюсь не пропустить ничего из происходившего с момента развала Российской империи до момента развала Советского Союза. Тем более, что происходило далеко не только печальное — жизнь ведь гораздо сложнее политических доктрин.</p>\n<h3>Этим семидесяти годам будут посвящены четыре главы</h3>\n<h3>Буря и натиск (1917-1930)</h3>\n<h3>Империя (1930-1953)</h3>\n<h3>Оттепель (1954-1964)</h3>\n<h3>Застой и распад (1964-1991)</h3>\n<p>С моей точки зрения всё это время паровоз, летевший в коммуну, несся в тупик, выбрав не тот путь. А потом долго и мучительно выбирался задом, да так до сих пор и не выбрался. Правда, буквам в последние 30 лет повезло больше, чем всей стране, но до этого места в рассказе еще очень далеко.</p>\n<p>Ну, что ли поехали.</p>\n<p>Начну с декретов, благо новая власть навыпускала их в изрядном количестве.</p>\n<p>Не скажу, что особенно долго искал оригиналы. В их доступности (или недоступности) в публичном пространстве есть своя логика.</p>\n<h3>Проще всего найти три бумаги</h3>\n<p>«К гражданам России» от 26.10.1917 за подписью Ленина — сообщение о госперевороте.</p>\n<p>Декрет о земле от 26.10.1917 — это скорее эсэрское творчество.</p>\n<p>Декрет о мире от от 28.10.1917 — а это скорее большевистское.</p>\n<p>Эти документы представлены в сети густо и в неплохих сканах — ударные пропагандистские мессиджи новой власти, десятилетиями бывшие главной рекламой переворота.</p>\n<p>Рассмотрим декреты с типографической точки зрения. Для сравнения привожу императорский Манифест о даровании конституции 19 октября 1905 года.</p>\n<p>Смотрите подписи к картинкам.</p>\n<p>Для этой книги было бы важнее найти еще один декрет — о печати. Но вот его, похоже, на заборах никто не расклеивал. Пришлось использовать скан из более позднего издания.</p>\n<h3>Из Декрета о печати</h3>\n<p>«В тяжкий решительный час переворота и дней, непосредственно за ним следующих, Временный Революционный Комитет вынужден был предпринять целый ряд мер против контр-революционной печати разных оттенков.</p>\n<p>Немедленно со всех сторон поднялись крики о том, что новая социалистическая власть нарушила, таким образом, основной принцип своей программы, посягнув на свободу печати.</p>\n<p>Рабочее и Крестьянское Правительство обращает внимание населения на то, что в нашем обществе за этой либеральной ширмой фактически скрывается свобода для имущих классов, захвативших в свои руки львиную долю всей прессы, невозбранно отравлять умы и вносить смуту в сознание масс.</p>\n<p>Всякий знает, что буржуазная пресса есть одно из могущественнейших оружий буржуазии. Особенно в критический момент, когда новая власть, власть рабочих и крестьян, только упрочивается, невозможно было целиком оставить это оружие в руках врага, в то время, как оно не менее опасно в такие минуты, чем бомбы и пулеметы. Вот почему и были приняты временные и экстренные меры пресечения потока грязи и клеветы, в которых охотно потопила бы молодую победу народа желтая и зеленая пресса.</p>\n<p>Как только новый порядок упрочится, всякие административные воздействия на печать будут прекращены; для нее будет установлена полная свобода в пределах ответственности перед судом, согласно самому широкому и прогрессивному в этом отношении закону».</p>\n<p>Простите за длинную цитату. Вам она ничего не напоминает?</p>\n<p>Новый порядок, судя по всему, не упрочился в течение следующих 70 лет: всё это время на территории бывшей империи действовала жесткая идеологическая цензура. И ее послабления в периоды НЭПа и оттепели только четче показывают границы, за которые нельзя было переходить.</p>\n<p>Декрет о печати — самый страшный удар по буквам после декрета об отмене частной собственности. Успехи типографики всегда связаны с двумя свободами: слова и частного предпринимательства. Большевики уничтожили и ту, и другую.</p>\n<p>Это привело не просто к застою в типографике, но к остановке самопознания новой кириллицы. В России вот-вот должны были появиться новые шрифты собственных рисунков. Увы, дальше леттеринга так и не пошло.</p>\n<p>Не буду подробно останавливаться на реформе алфавита и орфографии — об этом лучше прочесть в Википедии. Для букв реформа аукнулась быстро и болезненно: из национализированных типографских касс реквизировали отмененные яти, ижицы, i десятеричные, заодно прихватив не отмененные твёрдые знаки. С тех пор и до конца тридцатых нормальным стал набор слова с’езд через апостроф.</p>\n<p>А гартовые литеры пошли на пули — разить свинцовым глаголом врагов коммуны, бывших сограждан.</p>\n<p>Декретом о печати были закрыты все газеты, показанные в посте о периодике. Замечу: это были не экстремистские, популярные, весьма респектабельные издания, все как одно на ура встретившие февральскую революцию. Через некоторое время часть из них переехала заграницу — о чем будет отдельный пост.</p>\n<p>В дополнение к главным декретам — не менее важные и весьма прогрессивные: о свободе совести и вероисповедания и об уничтожении сословий.</p>\n<p>Отделение церкви от государства — абсолютно необходимое действие для всякого современного общественного устройства. Но для российских букв оно стало буквально геноцидом: были уничтожены почти все «славянские» шрифты, использовавшиеся отнюдь не только для набора священных книг. Целая область культуры пошла в распыл.</p>\n<p>Уничтожение сословий — такая же аксиома прогресса. Но вместе с ними были уничтожены чины, армейские и гражданские — то есть разрушена символическая и закрепленная в знаковых системах иерархия командования. Многие господа офицеры заплатили жизнью за свои погоны и нежелание становиться товарищами командирами. Порядка от этого не прибавилось — погоны и звания были в результате возвращены, хотя далеко не сразу. Но пропагадистский эффект был роскошный.</p>", "figs": [["img/r14/r14-001.jpg", "r14-001", "<p>Первая после переворота прокламация ВРК — 25 октября 1917 года. Предназначена для расклейки на улицах. Видите что-нибудь любопытное?</p>", 1.0], ["img/r14/r14-002.jpg", "r14-002", "<p>Деталь предыдущей картинки. В типографии не хватило крупнокегельного итальянского шрифта. Пролетарьят и гарнизон слегка заикали.</p>", 1.0], ["img/r14/r14-003.jpg", "r14-003", "<p>Второй декрет новой власти — о земле, призванный узаконить самозахваты крестьянами господских владений. Здесь тоже есть пикантный фрагмент</p>", 1.0], ["img/r14/r14-004.jpg", "r14-004", "<p>Вторая колонка, сверху. Первый раз в жизни вижу, как у наборщика тряслись руки. Видимо, из недавних крестьян был паренёк</p>", 1.0], ["img/r14/r14-005.jpg", "r14-005", "<p>Декрет о мире — первый из большевистских. 26.10.1917 по ст. ст. Довольно чисто набрано, даже с шиком</p>", 1.0], ["img/r14/r14-006.jpg", "r14-006", "<p>Что радует типографа в этой публикации? Конечно же, цельность стиля. Все шрифты — наимоднейший модерн, никакого пролетарства</p>", 1.0], ["img/r14/r14-007.jpg", "r14-007", "<p>Декрет о мире отдельным листом, видимо не для улицы. Почему-то краска синеватая — или скан такой? Сравните его со следующим документом — видно, что в чисто бюрократическом наборе большевики не далеко ушли от прислужников царя-батюшки</p>", 1.0], ["img/r14/r14-008.jpg", "r14-008", "<p>Манифест 17 октября 1905 года. Газетный вариант. Всё солидно и чинно</p>", 1.0], ["img/r14/r14-009.jpg", "r14-009", "<p>Тот же манифест в виде прокламации. Жаль, не нашлось хорошего скана. Но и без того понятно: наглядную агитацию придумали не большевики. Но, конечно, казенно, без декаданса</p>", 1.0], ["img/r14/r14-010.jpg", "r14-010", "<p>Декрет об уничтожении сословий. Тоже плохонький случайный скан с какого-то сайта, порадовавший перечеркнутым двуглавым, ставшим нынче, в бессословной рф, на добрую старую имперскую вахту. И даже о всех трех коронах</p>", 1.0], ["img/r14/r14-011.jpg", "r14-011", "<p>Три страницы Декрета о печати, выпущенного «в критический момент, когда новая власть, власть…»</p>", 1.0], ["img/r14/r14-012.jpg", "r14-012", "<p>Декрет о печати, продолжение. «имеет временный характер и будет отменено…» ага</p>", 1.0], ["img/r14/r14-013.jpg", "r14-013", "<p>Декрет о печати, окончание. Подписан большими сторонниками свободы слова</p>", 1.0], ["img/r14/r14-014.jpg", "r14-014", "<p>Еще пара старых бумажек с «декретами» — футуристам тоже хотелось командовать. До руля они пока что не допущены и находятся в легком замешательстве. Прямо на глазах тает их любимая аудитория: пощечины обывателям и буржуям начали раздавать государственные органы.</p>", 1.0], ["img/r14/r14-015.jpg", "r14-015", "<p>И тут видно, какие они милые и смешные ребята. «Только я не покупаю «Газету футуристов». Но ведь я — осёл…»</p>", 1.0], ["img/r14/r14-016.jpg", "r14-016", "<p>Эту афишку я утащил не помню где. И решил понять, в каком году 6 декабря состоялся литературный вечер с таким составом участников.</p><p>Подумал: вот Эренбург. Он же колесил по Европе. А когда он мог попасть на Большую Никитскую? Полез в вики:</p><p>«25 октября 1920 года Эренбург был арестован ВЧК… освобождён через трое суток благодаря вмешательству Н. И. Бухарина… С помощью последнего получил разрешение на выезд из страны и в марте 1921 года вместе с женой выехал в Париж». Значит, 6.12. 1920 точно был в РСФСР!</p><p>Ну-ка, а Блок? Его стихи читали, а самого не было. Почему? Вики отвечает: «у Блока развилась астма, появились психические расстройства, зимой 1920 года началась цинга». Значит, точно: 6 декабря 1920 )</p><p>Отдельно вдруг понял, какая невообразимо декадентская фамилия Луначарский.</p><p>И наконец — видите, как забавно жирный гротеск прорежен узким? Все имена — узкие, кроме заглавных букв. Новая эстетика или недостаток квалификации?<br>Как напишет много позже Галич: «и это была вполне весомая примета, что новые настали времена» Показать меньше</p>", 1.0], ["img/r14/r14-017.jpg", "r14-017", "<p>Две последних картинки — открытка. Похороны жертв революции, 19.11.1917. Что тут интересно типографу? Показать меньше</p>", 1.0], ["img/r14/r14-018.jpg", "r14-018", "<p>Конечно, обратная сторона. Справа по вертикали: «Т-во Р. Голике и А. Вильборг, Петроград, Нижегородская, 12». Частная буржуазная типография славит революцию. Недолго осталось Показать меньше</p>", 1.0]], "research": null}, {"intro": false, "num": "15", "title": "Очеловечивающие бумажки переходного периода", "ptitle": "Очеловечивающие бумажки переходного периода", "subtitle": "Часть 2, пост 2", "date": "12 октября 2022", "perm": "https://www.facebook.com/story.php", "slug": "", "html": "<p><span class=\"dc\">В</span>ласть держится на штыках, а прикрывается бумажками. Сегодняшний пост целиком собран на ХисДок_ру в разделе «Удостроверения».</p>\n<p>Мне было интересно проследить, как менялись личные документы от подданных и господ до граждан-товарищей. Новая власть старалась показать, что она как с луны свалилась — никакой связи с царским прижимом. А как было на самом деле?</p>\n<p>Почти первое, что я нашел — «паспортная книжка», выданная на пять лет Управлением Рабоче-Крестьянской Советской милиции г. Саратова 1923 года июля месяца 23 дня.</p>\n<p>На титуле красуется двуглавый орел. Поверх орла штамп: «Паспорт выдан 1938 20/XII». Видимо, новый паспорт. То есть 15 лет гражданин ссср ходил с дореволюционным паспортом с незаполненной графой «Вероисповедание», но без фото. Не пропадать же добру. Замечу, что саратовский милицейский чин писал небрежно, плохими чернилами и даже сделал ошибку.</p>\n<p>Для сравнения — Открытый лист Старшего Ревизора от 6/21 марта 1918 года, каллиграфически заполненный по всем дореволюционным правилам, но — с печатью Временного правительства, где орел опустил крылышки и лишился корон (как на российских рублях конца прошлого века). Видимо, советская власть еще не утвердилась во Владимирской губернии в марте 18-го года.</p>\n<p>Бюрократия склонна к наследованию внешних принципов оформления документов. Например, в Российской империи бланки госучреждений имели в левом верхнем углу гриф (типографски отпечатанный или отштампованный) с названием конторы и ее реквизитами. На левой же стороне ставились печати и отметки. А содердательная часть шла колонкой справа.</p>\n<p>Советская бюрократия унаследовала структуру документов и довольно долго ее держала. Что любопытно — шрифтов не жалели (благо не успели еще разорить типографии).</p>\n<p>Вот, например, загадочный Билет, не могущий служить видом на жительство, на бланке Иностранного Под’отдела при Административном Отделе Моск. Сов. Раб. и Кр. Деп. (шрифт! смотрите, какой шрифт!). Обращаем внимание на апостроф вместо ъ. Твердые знаки исчезли из обращения мгновенно.</p>\n<p>Ниже грифа — дата, 20.04.20, причем «Апрель» оттиснут дореволюционным штампиком (видимо, гордостью делопроизводителя).</p>\n<p>В целом, документ Инпод’отдела выглядит даже несколько вальяжно. Хотя с каллиграфией уже не очень.</p>\n<p>Но самый тонкий штрих — на обороте бумажки. Там царский орёл пришлёпнут православным крестом из пробельного материала.</p>\n<p>Третий экспонат — красная корочка М.С.Р.К. и К.Д. 1923 года. Самая характерная деталь: пролетарии соединяются на трех из четырех ее поверхностей. Впрочем, четвертую сторонку не сосканировали</p>\n<p>На обложке — Р.С.Ф.С.Р. с точками. Картинка ниже — весьма любопытная. Серп &amp; молот еще не нашли чеканную точку скрещения. Между ними — египетский обелиск, украшенный перевернутой пятиконечной звездой. Похожие штуки попадаются в американских каталогах типографий в разделе Masonic lodge signs.</p>\n<p>Леттеринг на обложке такой наивный и старательный, что хоть шрифт делай. Как будто Фаворский и Рерберг из второго класса гимназии чертили.</p>\n<p>Внутри корочки — ужас вахтера. Левая страница набрана в вертикальном формате, правая — в горизонтальном.</p>\n<p>Кажется, это два удостоверения в одном. Слева — член Моссовета. Справа — член фракции РКП(б). На месте для карточки — надпись от руки «фин-нал».</p>\n<p>Почерк у писаря послеоктябрьский.</p>\n<p>На красной корочке нет фотокарточки. А вот две следующих карточки — вовсе не селфи-фоточки, как кажется. Это удостоверения личности. Смотрите подписи.</p>\n<p>Но что я всё время о большевиках? На просторах бывшей РИ в те трудные годы кто только не был начальником — и каких только свидетельств не выдавал. Два следующих документа — свидетельства о браке.</p>\n<p>Первое дано гражданину деревни Сетицка в том, что на его брак с гражданкою деревни Кострова препятствий не имеется. Подписал священник Михаил С. Печать, кажется, почтовая.</p>\n<p>Второе свидетельство — оно же удостоверение №11716 — по-военному лаконичное и суровое. На экономном листке, пишмаштекстом, Штабс Капитан разрешает солдату вступить с девицей в первый законный брак. На дворе 18 февраля 1918 года. Власть три с лишним месяца как у большевиков. А в действующей армии все чины, яти и твёрдые знаки на месте. И полковая печать с имперским орлом.</p>\n<p>Еще удостоверение с ятями и ъъ. 21 мая 1918 года. Дано токарю снарядного завода в том, что больше он не токарь «вследствие полного закрытия завода». Снаряды кончились, все свободны.</p>\n<p>Вы еще не устали? А, впрочем, неважно.</p>\n<p>Следующее удостоверение (большевистское, но по старой орфографии!) надо читать целиком и с оборотом. Это песня и крик души. На обороте припечатан даже т. Ульянов /Ленин/, а всё почему? Чтоб ни под каким видом у железнодорожника Святослава Пушкина не отобрали б ни еды, ни квартиры! И мануфактуру не трогать! 10.11.1918. Год как товарищи у власти, а мануфактура уже кончилась.</p>\n<p>Следующий документ — от Датского Красного креста. Билет военнопленного. Выдан 19 марта 1919 в Киеве для этапирования из Австрии в Орловскую губернию. Приехал человек из плена опять на войну.</p>\n<p>Киевский сборный пункт Датского Красного Креста по оказанию помощи военнопленным, билет военнопленного, выдан Петушкову Андрею Сергеевичу, 5 марта 1919 года.</p>\n<p>Последняя, сильно потрепанная бумажка с ятями — эмигрантский паспорт. Белые еще в Новороссийске, но это ненадолго. 11 марта 1920 года. Семья из четырех человек отплывает — куда?</p>\n<p>Следующая бумага с фото уже времен с.с.с.р. с точками. 5 мая 1924 года милой девушке Межлаук Е. М. разрешили носить и хранить револьвер Вальтер. Действительно на всей территории СССР без точек.</p>\n<p>Твердых знаков нет. Лейаут уже советского образца, выключкой по центру. Из шрифтов рубленные и Латинская (Литературная) в ассортименте.</p>\n<p>Закончу на мажорной ноте. Цветным советским свидетельством от Феодосийского управления Сов. Раб-Кр. Милиции, выданным гр. Гравелю (и при нем жене) в том, что он «уволен в разные города и селения Советских Социалистических Республик». Хеппи энд.</p>", "figs": [["img/r15/r15-001.jpg", "r15-001", "<p>Паспорт гражданина ссср с гербом Российской империи. 1923 год. Использовался до 1938 года (судя по штампу)</p>", 1.0], ["img/r15/r15-002.jpg", "r15-002", "<p>Тот же паспорт, личные данные</p>", 1.0], ["img/r15/r15-003.jpg", "r15-003", "<p>Открытый лист на право осмотра всякого рода заводов, фабрик, складов и заведений. 6/21 марта 1918 года. Осматривать надо быстро, пока не отобрали.</p>", 1.0], ["img/r15/r15-004.jpg", "r15-004", "<p>Иностранный подотдел при Административном отделе Московского Совета рабочих и крестьянских депутатов, билет на свободное проживание и передвижение в пределах Российской Федеративной Республики, выдан Адильбею Сафарову, 20 апреля 1920 года. Не является внж.</p>", 1.0], ["img/r15/r15-005.jpg", "r15-005", "<p>Удостоверение личности, лицо и оборот.<br>Личность на сей изображена след. действительно Кимельфельд Лия Иосифовна ... Свидетельствуется на предмет представления в высшее учебное заведение.<br>30 августа 1918 года.</p>", 1.0], ["img/r15/r15-006.jpg", "r15-006", "<p>Удостоверение личности, лицо и оборот.<br>Предъявитель сего гражданин Королевской волости Петр Прохорович Королев. 1918 г.</p>", 1.0], ["img/r15/r15-007.jpg", "r15-007", "<p>Членский билет Моссовета и фракции РКП(б) в Моссовете же. 1923 год. Интересно, какие еще фракции были представлены в данном совете.</p>", 1.0], ["img/r15/r15-008.jpg", "r15-008", "<p>Священник Плотницкой Свято-Покровской церкви Михал Сакля, свидетельство, выдано Николаю Захарьевичу Бокша, Пинский уезд, 2 ноября 1918 года. Нет препятствий к браку.</p>", 1.0], ["img/r15/r15-009.jpg", "r15-009", "<p>Временно командующий 519 пехотным Алашкертским полком штабс-капитан Миронов, удостоверение солдату Михаилу Иванову, 16 февраля 1918 года. Разрешается вступить в первый законный брак с девицей.</p>", 1.0], ["img/r15/r15-010.jpg", "r15-010", "<p>Завод закрывается, нас всех тошнит. 1 марта 1918 года</p>", 1.0], ["img/r15/r15-011.jpg", "r15-011", "<p>Петроградские городские железные дороги, Московский трамвайный парк, удостоверение Николаю Васильевичу Михайлову, 16 июля 1919 года. Подчеркнутое красным обязательно к прочтению.</p>", 1.0], ["img/r15/r15-012.jpg", "r15-012", "<p>Билет военнопленного от Датского Красного креста. 1919 год, лицо и оборот</p>", 1.0], ["img/r15/r15-013.jpg", "r15-013", "<p>Заграничный паспорт.<br>Предъявитель сего Александр Прокофьевич Макаренко 50 лет с женой Августой Павловной 47 лет, дочерью Татьяной 16 лет и сыном Олегом 13 лет оправляется за границу, во свидетельство чего и для свободного проезда дан сей паспорт за надлежащими подписями и приложением казенной печати.</p><p>Паспорт выдан в Новороссийске 11 марта 1920 года.<br>Не большевиками.</p>", 1.0], ["img/r15/r15-014.jpg", "r15-014", "<p>Объединенное государственное политическое управление при СНК, удостоверение на право ношения и хранения оружия, выдано Межлаук Е.М., 5 мая 1924 года.</p>", 1.0], ["img/r15/r15-015.jpg", "r15-015", "<p>Предъявитель сего гражданин Курляндской губернии Иллукстского уезда Колкужной волости Гравель Казимир Иосифович уволен в разные города и селения Советских Социалистических Республик, от двадцать седьмого 27 числа марта месяца 1923 года по 27/III 1924 года.</p>", 1.0]], "research": null}, {"intro": false, "num": "16", "title": "Красные начинают и выигрывают", "ptitle": "Красные начинают и выигрывают", "subtitle": "О плакатах Гражданской войны", "date": "18 октября 2022", "perm": "https://www.facebook.com/story.php", "slug": "", "html": "<p><span class=\"dc\">К</span>ак известно, большевики превратили империалистическую войну в гражданскую. И выиграли её — с огромным трудом, чудовищными человеческими потерями и разрушением всего, что можно было разрушить.</p>\n<p>А вот пропагадистскую войну красные выиграли даже не за явным преимуществом — просто нокаутом. Плакаты красных наголову сильнее агитации белых.</p>\n<p>Почему это произошло?</p>\n<p>Красные были единоверцами. Их идеи выражались однолинейно, и пропагандистские залпы ложились кучно.</p>\n<p>Белые были очень пестрой толпой. И так и не нашли одного убойного лозунга.</p>\n<p>Красные захватили главные темы: мир, воля, хлеб, равенство. Белые не сумели перехватить ни одну из них.</p>\n<p>Красные нашли тройку сказочных супергероев: красноармеец, рабочий, крестьянин. Героями белых были солдат-доброволец, казак и генерал-командующий. Частное против всеобщего.</p>\n<p>С цветом у белых тоже не срослось: российский триколор не заиграл на плакатах. Глядя из сегодня, кажется, что красные последовательнее маркировали противников бело-сине-красным, чем белые сами себя.</p>\n<p>У белых не оказалось копирайтеров класса Маяковского и Ленина с Троцким, разошедшихся на цитаты.</p>\n<p>Наконец, именно красные нашли для своих панчлайнов лучшие буквы. Должен признать: буквы Гражданской войны развивали кириллицу. И это были красные буквы.</p>\n<p>Начну с козырей: у белых не было Окон РОСТа. Команда из Маяковского, Черемных, Моора, Лебедева, Малютина, Лавинского и др. выдавала комиксы буквально по каждому значимому поводу.</p>\n<p>Сначала картинки рисовали вручную и вывешивали в окнах Российского Телеграфного Агентства на Тверской (отсюда название серии). Потом придумали размножать листы трафаретами и дошли до тиражей в 300 экземпляров. Листы развозили по местным отделениям РОСТа — их было 47 — и расклеивали там.</p>\n<p>Трудно сказать, насколько массовым был сиюминутный эффект Окон. Но стилистически это был мощнейший прорыв.</p>\n<p>Визуальный язык Окон был найден еще в Первую Мировую. Тогда Маяковский и Малевич, завзятые патриоты и сторонники войны до победного, рисовали провоенные лубки с очень похожими фигурами. Их тиражировали типографским способом. Соответственно, подписи были наборными. С нынешней точки корявые трафаретные буквы смотрятся намного более сильно, чем аккуратный текстовый шрифт.</p>\n<p>Сильнейшим красным плакатистом был Дмитрий Моор. На его счету несколько абсолютных шедевров — не только с пропагандистской точки зрения. Имеет смысл сравнить иконический «Ты записался добровольцем?» с точно таким же по сюжету плакатом Добровольческой армии. Моор выигрывает по всем позициям: убедительность рисунка, необходимость деталей, цветовая раскладка. Но особенно сильно выигрывает в буквах.</p>\n<p>Красные побили белых и образами злодеев. Их буржуи и генералы не столько персоны, сколько представители мирового империализма и буржуазии. Злодеи у красных смешны и жалки.</p>\n<p>А вот белые сосредоточились на персонах — выбрав мишенью Ленина и особенно Троцкого, и не жалея антисемитских ассоциаций. Злодеи белых зловещи, страшны и отвратительны, да к тому же еще инородцы-иноверцы. Не очень удачная тактика, учитывая количество евреев и передовой интеллигенции в белом движении. В результате сатира красных тотальна, а сатира белых — избирательна и кляузна.</p>\n<p>Ну и отдельно про буквы. У леттеринга красных намного шире диапазон — от затейливого модерна до протопалочных гротесков. Белые стараются держаться наборных форм. Приходится признать, что свободы выражения на красной стороне было значительно больше.</p>\n<p>В первом комменте — ссылка на замечательную монографию Вячеслава Полонского «Русский революционный плакат» 1925 года. Имеет смысл посмотреть целиком и прочесть. Текст исключительно страстный, лаконичный, ясно написанный.</p>\n<p>Вот определение красного плаката: у него «активный, не оборонительный, но наступательный характер, не пропагандистский, но агитационный, не миролюбивый, но агрессивный». Важная деталь: не пропагандистский, но агитационный. То есть требующий немедленного содействия.</p>\n<p>Красные показали мощнейшие образцы отмобилизованной, централизованной, узконаправленной — но свободной в форме выражения агитации. Белые проиграли, не найдя ни слов, ни букв.</p>\n<p>Пройдет десять лет — и агитпроп навязнет на зубах главного его творца. А пока весьма забавно посмотреть, как Окна РОСТа рекламируют нэп.</p>", "figs": [["img/r16/r16-001.jpg", "r16-001", "<b>Маяковский и Малевич. Провоенный лубок. 1914 год.</b><p>Шел австриец в Радзивилы<br>Да попал на бабьи вилы.</p><p>Все мотивы будущих Окон РОСТа налицо. Упрощенный рисунок, частушечный текст, смешной враг на шампуре. Весёлая жестокость и любовь к пролитию крови. Не хватает только трафаретных букв.</p>", 1.0], ["img/r16/r16-002.jpg", "r16-002", "<p>Маяковский. Окна РОСТа. 1920. Пан имеется в виду польский. Рисунок стал еще лапидарнее. Буквы — тоже.</p>", 1.0], ["img/r16/r16-003.jpg", "r16-003", "<p>Маяковский. Окна РОСТа. 1920.<br>Еще одно надевание пана на штык.<br>Речь идет, заметим, о предложении мира от ВЦИК.</p><p>Трафаретные буквы из самых лучших. Видимо, было время их аккуратно нарисовать и вырезать</p>", 1.0], ["img/r16/r16-004.jpg", "r16-004", "<b>Маяковский. Окна РОСТа. 1920.<br>Мир подписан. Винтовка рядом.</b><p>Буквы на скорую руку.</p>", 1.0], ["img/r16/r16-005.jpg", "r16-005", "<p>Окна РОСТа. 1919.<br>До трафарета еще не додумались.<br>Буквы написаны по красоте и модерну.</p>", 1.0], ["img/r16/r16-006.jpg", "r16-006", "<p>Маяковский. Окна РОСТа. 1920.<br>Образцовое окно и по выразительности рисунков, и по небрежности буквенного трафарета</p>", 1.0], ["img/r16/r16-007.jpg", "r16-007", "<p>Не я первый придумал совместить указующий перст белого (слева) и красного (справа) добровольца.<br>Моор побеждает по всем пунктам.</p>", 1.0], ["img/r16/r16-008.jpg", "r16-008", "<p>Еще один белогвардейский призыв на фронт.<br>Почему ты не выучил уроки?</p>", 1.0], ["img/r16/r16-009.jpg", "r16-009", "<p>Зеленый змий против красного дракона. Казалось бы, всадник справа круче букашек слева. Да и Москва с куполами куда как привлекательнее для освобождения, чем чорный город Готам в кольцах гада.</p><p>Но все же Моор намного конкретнее. Да и слоган понятнее у красных.</p>", 1.0], ["img/r16/r16-010.jpg", "r16-010", "<p>Положительные герои красных (опять Моор). Веселые красные ребята, настоящие супергерои.</p>", 1.0], ["img/r16/r16-011.jpg", "r16-011", "<p>Еще герой красных: сеятель книг. Обратите внимание: цветовая маркировка на месте.</p>", 1.0], ["img/r16/r16-012.jpg", "r16-012", "<p>Дени. Дедушка Ленин по-казански. Не знаю, связан ли образ с тем, что в столицах часто дворники были татарами. Опять добрый юмор не только к своим, но и к врагам.</p><p>Леттеринг старательно подражает набору</p>", 1.0], ["img/r16/r16-013.jpg", "r16-013", "<p>Прокламация белых с Колчаком. Текст — наборный. Герой даже не смотрит на зрителя. Кто ж так агитирует?</p>", 1.0], ["img/r16/r16-014.jpg", "r16-014", "<p>Положительный герой белых: солдат добровольческой армии. Инфографика смешная, агитация отрицательная.</p>", 1.0], ["img/r16/r16-015.jpg", "r16-015", "<p>Третий герой белых — белый казак. Не знаю, что значит красная трапеция слева, но именно она самое сильное место плаката. Малиновый цвет, чтобы не использовать красный — провал.</p><p>Буквы почти от Билибина. В принципе по делу, но игривы</p>", 1.0], ["img/r16/r16-016.jpg", "r16-016", "<p>Белые пытаются подражать красным. Однако непонятно, кто этот серый человек в начищенных сапогах с игрушечной винтовкой. При этом красный отлично считывается.</p><p>В леттеринге внезапно увидел прием из собственного шрифта Флёрдюмаль: жирные засечки-галоши на контрастной антикве.</p>", 1.0], ["img/r16/r16-017.jpg", "r16-017", "<p>Образ врага у красных (художник Дени). Обобщение и осмеяние, даже несмотря на страшилки</p>", 1.0], ["img/r16/r16-018.jpg", "r16-018", "<p>Окно РОСТа: эсер. Милашка же.</p>", 1.0], ["img/r16/r16-019.jpg", "r16-019", "<p>Маяковский. Окно РОСТа. Идеальный образ врага.</p>", 1.0], ["img/r16/r16-020.jpg", "r16-020", "<p>Образ врага. Красный лубок с нехорошими белыми и неприятными империалистами на заднем плане. Обратим внимание на аккуратное кодирование триколором</p><p>Антанта набрана. Тогда еще в типографиях водились изыски с шипиками</p>", 1.0], ["img/r16/r16-021.jpg", "r16-021", "<p>Образ врага у белых. Нехорошие немцы запускают в Россию большевика в виде Ленина, обросшего до состояния Маркса</p>", 1.0], ["img/r16/r16-022.jpg", "r16-022", "<p>Образ врага у белых. Ленин и Троцкий, оба семиты и масоны</p>", 1.0], ["img/r16/r16-023.jpg", "r16-023", "<p>Образ врага у белых. Троцкий. Без комментариев. Рисунок, кстати, качественный</p>", 1.0], ["img/r16/r16-024.jpg", "r16-024", "<p>Образ врага у белых. Ленин и Троцкий — врачи-вредители. Рисунок качественный, плакат очень слабый</p>", 1.0], ["img/r16/r16-025.jpg", "r16-025", "<p>Моор. Коммунистическая икона с житием. То есть нет — плакат «Все на оборону!»</p>", 1.0], ["img/r16/r16-026.jpg", "r16-026", "<p>Моор. Помоги. Гениальный плакат. И леттеринг тоже</p>", 1.0], ["img/r16/r16-027.jpg", "r16-027", "<p>Лебедев. Окна РОСТа, Питер.<br>Работать надо — винтовка рядом.<br>Не знаю, как это воспринималось современниками. Для нас — бессмертный шедевр.<br>Леттеринг, кстати, предвосхищает шрифты класса Broadway.</p>", 1.0], ["img/r16/r16-028.jpg", "r16-028", "<p>Эль Лисицкий. Клином красным бей белых. 1920.<br>Впервые был издан в 1920 году в Витебске Литиздатом Политуправления Запфронта.</p><p>Поразительно, но этот супрематический шедевр — реальный агитационный плакат!</p><p>Полонский справедливо замечает, что агитаторы заигрались и перестали быть понятными ширнармассам. Понятными, может и перестали, но выразительными остались еще как.</p><p>Леттеринг — из будущего. Привет Баухаусу.</p>", 1.0], ["img/r16/r16-029.jpg", "r16-029", "<p>Еще немного красного леттеринга от художника Апсита.</p>", 1.0], ["img/r16/r16-030.jpg", "r16-030", "<p>И еще красный леттеринг. Как видим, он может быть всяким</p>", 1.0], ["img/r16/r16-031.jpg", "r16-031", "<p>Не знаю, Апсит ли это, но леттеринг уже почти Тулуз-Лотрековский. Апдейт от Павла Снопкова: автор Пётр Киселис</p>", 1.0], ["img/r16/r16-032.jpg", "r16-032", "<p>Черемных. Окно РОСТа, рекламирующее НЭП.<br>«Раньше мы с крестьянином враждовали немного».<br>Коммунисты переобуваются налету. Выходит довольно забавно.</p><p>Через 7-8 лет, когда благодаря нэпу советское население немного отъестся, товарищ Маяковский взвоет: «скорее канарейкам головы сверните». Свернут — и съедят канареек в первую же пятилетку. Голод не тетка.</p><p>Заметно, что это окно рисовали неспеша. Буквы аккуратно выполнены.</p>", 1.0], ["img/r16/r16-033.jpg", "r16-033", "<p>Обложка и титул монографии Вячеслава Полонского «Русский революционный плакат». Госиздат, 1925.</p><p>На обложке очень качественный рисованный леттеринг.<br>Титул наборный. Запомним это: титул — наборный.</p>", 1.0]], "research": null}, {"intro": false, "num": "17", "title": "Эмигрантская печать. Шапочное знакомство", "ptitle": "Эмигрантская печать. Шапочное знакомство", "subtitle": "", "date": "8 декабря 2022", "perm": "https://www.facebook.com/story.php", "slug": "", "html": "<p><span class=\"dc\">Э</span>тот пост будет поверхностным, как мои знания о том, что и как печатали релоцировавшиеся от большевиков граждане свободной России (не забываем, что уезжали они уже не из империи Романовых). Даже более чем поверхностным — именно шапочным.</p>\n<p>Здесь собрано и рассмотрено некоторое количество шапок (логотипов и заодно текстов с первых полос) эмигрантских газет первых лет после массового отъезда. И еще немного книжных и журнальных обложек и титулов. Никакого погружения — только вершки.</p>\n<p>Что же видно? Первое и главное — орфография.</p>\n<p>А именно: приняли или не приняли реформу.</p>\n<p>На мой взгляд, эмиграция сделала очень большую ошибку, не перейдя на новое правописание. Реформа ведь готовилась до 1917 года, а введена была Временным правительством. Но большевики сумели не просто довести реформу до конца, но присвоить ее себе. В результате, глядя из 21 века, тексты с ятями и твердыми знаками выглядят безнадежно архаичными. Понятно, что для современников это было не так. Но всё же игнорирование эмигрантами реформы дало большевикам слишком сильный и незаслуженно лёгкий пропагандистский козырь.</p>\n<p>По орфографии легко вычислить тех, кто сотрудничал с Москвой или пытался попасть на советский рынок. Например, издательство Гржебина — достойнейшего человека, поверившего большевикам и в конце концов разоренного ими.</p>\n<p>В первые годы советской власти Гржебин печатал книги с выходными данными «Петроград — Берлин». Я посмотрел несколько обложек — почти все в новой орфографии, даже посмертное издание стихов Гумилева. А вот Цветаева — в старой. И это не случайно. В то время она была яростной антибольшевичкой — а значит — была Цвѣтаева.</p>\n<p>Интересно, что некоторые издатели использовали промежуточную орфографию: убрали твёрдые знаки на концах слов, а ять оставили. Такая форма правописания, например, у единственной попавшейся мне фашистской газеты — правые радикалы тоже считали себя прогрессистами. В отличие от казаков, печатавших строго как учили в церковно-приходской школе.</p>\n<p>В одной гржебинской книжке попалась замена твёрдого знака апострофом. Возможно, это сделано специально для советской публики — ведь в берлинских типографиях не уничтожали запасы ъъъ. Но не исключено, что снятие твёрдого знака с концовъ словъ было понято как из’ятие буквы из алфавита, не только из набора.</p>\n<p>В конце всей сегодняшней «орфографической» подборки — анахронизм: полоса из Набоковского «Дара» 1938 года в классической старой орфографии. Всё понимаю — но так не должно было быть. Набоков слишком современен для ятей и твёрдых знаков. Даже если он сам считал иначе.</p>\n<p>Что ещё подхватил мой внимательный скользящий взгляд? Попытки вспомнить прошлое. Несколько газетных логотипов — или точные копии, или прямые отсылки к дореволюционным изданиям. Самая трогательная — белградское «Новое время» 1921 года «редактора-издателя М. А. Суворина» с логотипом от 1882 года. Причем, судя по всему, это не просто копия, но то же клише.</p>\n<p>Шапка берлинской газеты «Руль» — явно производная от такой же странной шапки влиятельной до 1918 года «Речи». Забавно, что буквы Р в них разные, а вот Ь почти близнецы.</p>\n<p>Кто появился раньше — берлинское «Время» или рижское «Сегодня» — сказать не берусь. Но уверен, что это родственники.</p>\n<p>Интересна разница между немецкими и российскими типографиями начала 20-х. Немецкие стали страшно дёшевы на фоне гиперинфляции. Российские на пару лет просто замерли: не было ни работников, ни бумаги. Оживать советская печать начала примерно с 1922-23 года. Поэтому был момент, когда напечатать в Берлине было дешевле и скорее, чем в Москве или Питере.</p>\n<p>Однако поток новых литер, бесперебойно шедший в Россию до 1914 года, иссяк. Это означало, что и советские, и эмигрантские издания могли использовать только шрифты модерна — не позже. Наборная кириллица начала быстро отставать от моды. Это станет очевидно лет через десять, в начале пятилеток.</p>\n<p>А ведь Германия проиграла войну. И революция там тоже была. Но не было ни гражданской резни, ни массовой эмиграции. И вот хочу спросить любителей большевистских реформ и индустриализаций: а оно того стоило?</p>\n<p>С моей, очень узкой, позиции букводела — нет. Не стоило нисколько.</p>\n<h3>Конклюзия к шапкозакидательству</h3>\n<p>Эмигрантские издания воспроизводят ушедшую Россию. Какую? Неужели империю, против которой боролись почти все уехавшие? О чем ностальгия?</p>", "figs": [["img/r17/r17-001.jpg", "r17-001", "<p>Суворинское Новое время из С-Петербурга 1882 года и из Белграда 1921 года с одинаковыми логотипами.</p>", 1.0], ["img/r17/r17-002.jpg", "r17-002", "<p>«Речь» из Петрограда в момент отречения Николая в 1917 и «Руль» из Берлина 1921 года. Формат другой. Шапка явно намеренно похожа.</p>", 1.0], ["img/r17/r17-003.jpg", "r17-003", "<p>Независимое демократическое «Сегодня» из Риги 1921 года и просто еженедельное «Время» из Берлина 1920 года. Шапки явно похожи (это не набор, а рисованный леттеринг). И там, и там старая орфография.</p>", 1.0], ["img/r17/r17-004.jpg", "r17-004", "<p>Еще суворинская газета — «Вечернее время» приветствует свободу в 1917 в нижнем слое.<br>На ней сверху — парижское «Русское время» (один из релакторов тоже Суворин, но Борис) 1925 года.<br>А верхний слой — константинопольская «Вечерняя пресса» 1922 года. Клон? Орфография везде старая</p>", 1.0], ["img/r17/r17-005.jpg", "r17-005", "<p>Мне попалось несколько газет с одинаковыми именами. Вот «Русский голос». Харбин, 1922.<br>Шапка — набор. Итальянский шрифт с засечками.<br>Орфография смешанная: без ъъъ, но с ятями</p>", 1.0], ["img/r17/r17-006.jpg", "r17-006", "<p>Тот же харбинский «Русский голос» 1924 года.<br>Шапка тоже наборная (хотя не знаю такого шрифта). За два года исчезли засечки.<br>А орфография всё та же — полуновая</p>", 1.0], ["img/r17/r17-007.jpg", "r17-007", "<p>Еще один «Русский голос», из другого полушария и другой эпохи: Львов (польский), 1930.<br>Шапка — «славянский» шрифт (это ностальгический тренд). А вот набор — той же смешанной орфографией.</p>", 1.0], ["img/r17/r17-008.jpg", "r17-008", "<p>Еще славянская шапка — монархисеский «Русский стяг».<br>Белград, 1926 год. Орфография, разумеется, тоже монархическая</p>", 1.0], ["img/r17/r17-009.jpg", "r17-009", "<p>«Казачье слово» из Софии 1922 года печалится по атаману Каледину. Шапка наборная, арнувошная. Орфография, как положено, дореформенная.</p>", 1.0], ["img/r17/r17-010.jpg", "r17-010", "<p>«Казачьи думы» наследовали «Казачьему слову» в той же Софии (и Константинополе) в том же 1922 году. Но были кудрявы, как чуб. Леттеринг точно народный. Орфография твёрдозначно-ятевая</p>", 1.0], ["img/r17/r17-011.jpg", "r17-011", "<p>А теперь три разных «Дела» подряд.<br>«Русское дело», Прага, 1920. Шапка — леттеринг под видом набора. Партийность не проявлена, но точно не слишком левая: судя по старой орфографии.</p>", 1.0], ["img/r17/r17-012.jpg", "r17-012", "<p>«Общее дело». Бульвар
