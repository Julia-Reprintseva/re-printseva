 вставлено в блок с годами. Нет ни малейшей попытки заполнить низ полосы.</p><p>Вспомните титул «ИШ-1960». Сильнее он не смог бы возразить.</p>", 1.0], ["img/10/10-016.jpg", "10-016", "<b>«ИШ-1977» Разворот с Содержанием</b><p>Здесь так много типографики, что боюсь вас заболтать.<br>Слева межколонник между текстом на русском и тремя переводами шире, чем колонки между ними.<br>Редколлегия подвешена на той же высоте, что блок авторов. Длиииииннннаая горизонталь.</p><p>Справа работа в два кегля, где основное выделение — фамилии, причем автор предисловия Юрий Герчук уравнен с участниками. Колонки авторов не выравнены. Почему? Потому, что если выравнять, левая не достанет до низа полосы, а к тому же повиснет одна строка. А так флаг становится еще более флагом. Цифры страниц мелко и слева. Техническая часть выбита в третью колонку и мельче.</p><p>Даже в ИнДизайне такой разворот сходу не построишь. А этот был расписан руками на бумаге. В ссср это мог сделать один человек. Он и сделал.</p>", 1.0], ["img/10/10-017.jpg", "10-017", "<b>«ИШ-1977» фрагмент предыдущего разворота, блок авторов и редколлегия.</b><p>Не знаю почему, но почти уверен, что переводы состоялись благодаря МГЖ. В этом тоже принципиальное отличие «ИШ-1977» от «ИШ-1960». Там был междусобойчик, здесь заявка на общение с миром. Напомню: на дворе не оттепель, а самый что ни на есть застой.</p><p>В редколлегию вошли два художника, не участвовавших в книге: Бисти и Носков. Не знаю, что это значит.</p>", 1.0], ["img/10/10-018.jpg", "10-018", "<p>«ИШ-1977» Спусковая полоса с началом вступительной статьи и первой сноской. Фрагмент.<br>Во-первых, типографика. Минимальное и равное выделение автора и заголовка. Заголовок откинут на один шаг сетки (очень скромное выделение) и на тот же шаг втянуты первые строки абзацев (наглый швейцарский визг). Сноска мелким кеглем отправлена в боковое поле в узкую колонку. И висит прямо напротив цифры. Модно.</p><p>По содержанию: видимый куб текста больше, чем всё предисловие к «ИШ-1960». А ведь Герчук еще только воздуха набирает.<br>Первая сноска — про гротеск. Случайность?</p>", 1.0], ["img/10/10-019.jpg", "10-019", "<b>«ИШ-1977» Первый автор: Михаил Аникст.</b><p>Альбом заходит с козырей: Аникст, с Жуковым и Троянкером — первая тройка книжных дизайнеров того времени. А потом (или уже тогда?) главных художников «Искусства», «Мира» и «Книги».</p><p>У Аникста две полосы, и на второй — «Подводная газета». Это манифест набора. Стиль воспроизводит дореволюционные афиши — теми старыми шрифтами, которые еще остались в типографиях. Не знаю, настоящий это набор или рекле, но выглядит натурально.</p>", 1.0], ["img/10/10-020.jpg", "10-020", "<b>«ИШ-1977» Три полосы Банниковой.</b><p>Слева перед ней типичный оттепельный леттеринг Бажанова — свободный и даже игривый, но это было и в «ИШ-1960».</p><p>А вот экспозиция Банниковой — сплошь наборная. В советской книге про искусство шрифта внезапно появляются подписи: образец набора, курсив, полужирный. Никогда не было.</p>", 1.0], ["img/10/10-021.jpg", "10-021", "<b>«ИШ-1977» Две полосы Васина между Васильевым и Ганнушкиным.</b><p>Помните Васина из «ИШ-1960»? Там он был еще немного скованным, а здесь в лучшем виде. Центральная композиция побеждена и обсмеяна — посмотрите на «Теплицу» с осью из шатких кубиков букв и со сбоем фамилией автора. Остальные работы прямо девочки на шаре — балансируют на хитро выстроенных осях.</p>", 1.0], ["img/10/10-022.jpg", "10-022", "<p>«ИШ-1977» разворот Гордиана Дмитриева — с ч/б фото «ИШ-1960» и логотипом издательства «Искусство». Только я вижу здесь иронию Жукова?</p>", 1.0], ["img/10/10-023.jpg", "10-023", "<b>«ИШ-1977» Три полосы Максима Жукова.</b><p>Однажды, еще в ЖЖ, я имел дерзость сказать, что считаю себя учеником МГ. Он тут же возмутился: где это я вас учил?! А вот здесь, дорогой Максим. Эти три полосы в «ИШ-1977» сделали из меня — любителя букв — профессионального типографа. Они и сейчас смотрятся живо, а в конце семидесятых были просто ошарашивающим ударом по голове. А что, так тоже можно?</p><p>Я тысячу раз пересматривал эти картинки, любовался стилизованными знаками Зодиака, промерял «Меандр», восхищался шрифтом Театр… Примерно такой же шок я испытал, листая U&amp;lc и Emigre. Вся книга «ИШ-1977» про контроль и умную типографику, а эти полосы про свободу и лёгкость в дизайне. С кем из наших это сравнить? С ранним Телингатером и с Володей Чайкой.</p>", 1.0], ["img/10/10-024.jpg", "10-024", "<b>«ИШ-1977» для контраста: один из двух разворотов Николая Кудряшева (здесь Кудряшова).</b><p>Слева — Трудовская гарнитура, намеренно показанная как Univers. Системный подход к типографике, custom font — оказывается, всё это было в ссср, только показывать не умели.</p><p>А на правой полосе просто страница из энциклопедии, набранная первой советской superfamily — (нарочно латиницей, для пущей диковинности) — Энциклопедической гарнитурой.</p><p>Мне кажется, этот разворот, вместе в Банниковой и самим МГЖ — самое сильное противопоставление международного типографического дизайна «искусству книги» в советском понимании.</p>", 1.0], ["img/10/10-025.jpg", "10-025", "<b>«ИШ-1977» два разворота тогдашнего соратника и сокурсника МГЖ Юрия Курбатова.</b><p>На первом — самый наглый макетный пассаж во всей книге: фотолеттеринг «Я землю эту люблю», пущенный через корешок так, что буква Э рубится пополам. Мало того, что вся эта каллиграммная история с Маяковским нарывается на спор. Но резануть прямо по букве, уже закрученной в спираль??! Это пощечина общественному вкусу, которую мог себе позволить только один дизайнер в ссср. Он и позволил.</p><p>На втором развороте среди студенческих проб наборного шрифта притаилась умилительно нелепая «болгарская» Хельветика, авторства Курбатова и Жукова. Это тоже манифест. Сейчас ее, кажется, кто-то цифранул. Ну, или вдохновился. А тогда это был крик души.</p>", 1.0], ["img/10/10-026.jpg", "10-026", "<p>Четыре полосы Лазурского. На одной из них — целая страница набора Гарнитурой Лазурского (помните, как в «ИШ-1960» он скрывал свою причастность к низкому ремеслу шрифтовика?). Конечно, в экспозиции присутствуют и роскошные шрифтовые композиции, но целая страница набора… Кстати, прочтите текст )</p>", 1.0], ["img/10/10-027.jpg", "10-027", "<p>«ИШ-1977», в отличие от «ИШ-1960», чрезвычайно разнообразна. Я нарочно выбрал контрастные развороты. В прошлом альбоме невозможно представить лубошника. А тут пожалуйста — целая Маврина с буковками, кой-как накрашенными кисточкой.</p>", 1.0], ["img/10/10-028.jpg", "10-028", "<p>Разворот Маркевича. Слева на черной плашке — шрифтовая композиция, на базе которой был сделан шрифт Citizen M</p>", 1.0], ["img/10/10-029.jpg", "10-029", "<p>Один из двух разворотов Телингатера с эскизом Народной гарнитуры. Так и написано: Титульный наборный акцидентный шрифт. А не алфавит какой-нибудь.</p>", 1.0], ["img/10/10-030.jpg", "10-030", "<p>Еще один разворот, сильно на меня повлиявший. Буквы Фаика Тагирова, сочетающие геометрическую конструкцию с лёгким безумием. Особенно люблю Ё. И точку с запятой.</p>", 1.0], ["img/10/10-031.jpg", "10-031", "<p>Разворот Аркадия Троянкера — один из последних. Если у Аникста набор отсылает к набору, то у Троянкера старинная афиша нарисована вручную.</p><p>Теперь вы понимаете, почему я пишу эту книгу )</p>", 1.0], ["img/10/10-032.jpg", "10-032", "<b>Разворот с началом справочного аппарата. Блок текста слева я отдельно покажу.</b><p>Справа — начало многостраничного Списка репродукций. Левая колонка по-русски, три правых перевод. Цифры слева, выключены вправо. Цифры — номера иллюстраций, не страниц. Навигация по имени участника. Всё смакетировано по сетке, разумеется.</p>", 1.0], ["img/10/10-033.jpg", "10-033", "<p>Блоки «Вниманию читателя» и «Принятые сокращения» с предыдущей картинки. Вы обратили внимание, что на типографе Лазурском был галстук-бабочка? Так вот, этот блок — невидимая бабочка типографа Максима Жукова (он же, в данном случае, Владимир Набоков), которую МГЖ слегка трогает пальцами, как бы поправляя.</p>", 1.0], ["img/10/10-034.jpg", "10-034", "<p>Разворот с окончанием Списка литературы (а как же) и выходными данными. Слева, опять заметим, снова невыравненные колонки.</p>", 1.0], ["img/10/10-035.jpg", "10-035", "<p>Выходные данные крупно.<br>Скромно об издательских работниках.<br>Ни слова о работниках типографии (вспомните как их перечислили в «ИШ-1960»).</p><p>Непристойная бумага.<br>Неприличная цена.<br>Тираж странный: 27000.<br>Обычно в ссср тиражи были от 50000 и выше. Но тут платили твёрдой валютой и на ветер ее, судя по всему, не кидали.</p><p>Хотя любопытно, как распространялось издание. В странах ли народной демократии, в буржуазно ли империалистических?</p><p>Не помню, как я его купил. Но помню лютую борьбу жажды причащения и жабы. Хорошо, что жаба пошла в болото</p>", 1.0]], "research": {"task": "Сравнить состав участников двух альбомов, систематизировать по типу работ, сравнить работы по времени и композиции; для всех участников — даты жизни и четыре хронологических списка.", "work": "Четыре шага верификации: первый ответ Gemini → проверка ChatGPT по страницам библиотеки, где вскрылись выдуманные участники и проценты → анализ по сканам оглавлений (38 и 59 имён, 16 общих) → выверенная база с датами жизни и 13 авторами гарнитур.", "tools": "Gemini, ChatGPT", "dates": "март 2026"}}, {"intro": false, "num": "36", "title": "Глава о каллилеттеринге оттепели («Попустило и скукожило»)", "ptitle": "Попустило и скукожило", "subtitle": "Советский неоромантизм в надписях оттепели: взмах крыла и суровый стиль небритого гротеска", "date": "3 апреля 2026 г.", "perm": "https://www.facebook.com/100000723643455/posts/26880068174933940/", "slug": "ottepel", "html": "<p><span class=\"dc\">Ш</span>естидесятые годы — поиски того, как можно. Чтобы понять, что это значит: «как можно», давайте разбежимся издалека.</p>\n<div class=\"orn\" role=\"separator\"><b></b></div>\n<p>Нулевые годы двадцатого века — возбухание. Российская культура тащит с Запада всё, что может утащить — от импрессионизма до эмансипации, и набирает воздуха для крика. Приличное общество морщится и нервно спрашивает: а что, так можно?</p>\n<p>Десятые годы — мощный вопль. Вдруг выясняется, что российские футуристы вполне способны переорать итальянских, а пощечины общественному вкусу грозят перерасти в скидывание с корабля современности. ДА, ТАК МОЖНО! капслоком рычит авангард.</p>\n<p>Двадцатые годы. Авангардисты внезапно в силе и при власти. А те, кто реально власти, с некоторым офигением спрашивают у т. Луначарского: а что, теперь так носят? И выясняют, что да, так носят, причем в Париже и в Нью-Йорке.</p>\n<p>Тридцатые годы. Товарищи приходят в себя и начисто соскрёбывают авангард с паровоза. Объявлен тотальный соцреализм и членство в творческих союзах. Теперь, чтобы открыть рот, сначала надо показать корочку. Вопрос о том, как можно, снят с повестки. Правила в уставе. Неуставные отношения с искусством караются по статье. Всё, что по внешнему контуру соврая, объявлено буржуазным пережитком.</p>\n<p>Культура, только что собиравшаяся стать мировым событием, становится бурчанием в животе жругра, уцраора или как его там звали.</p>\n<p>Сороковые – пятьдесят третий. Все занятия культурой начинаются с вопроса: а как теперь можно? Точного ответа, несмотря на уставы творческих союзов, не знает никто. Зато все точно знают: что высунешь — то и оттяпают.</p>\n<p>И вот чейнстокс закончился. Отшибленная культура высунулась из-под лавки и стала пробовать: а так можно? А так? Тогда (да и мне по сю пору, до самой предыдущей главы) казалось, что оттепель стала почти свободой. А на самом деле она была только робким вопросом: а так можно?</p>\n<div class=\"orn\" role=\"separator\"><b></b></div>\n<p>Теперь давайте посмотрим, что и как стало можно. Источниками будут гугл имидж, те две книги «ИШ-1960» и «ИШ-1977», которые я разбирал в прошлой главе, статья в журнале «Шрифт» и еще кое-что.</p>\n<p>Поговорим о самом заметном, вместе с отменой центральной композиции. О размашистой шестидесятнической каллиграфии. Откуда она?</p>\n<p>Каллиграфия, как любое искусство, основанное на технических навыках, требует школы. В ссср были музыкальные школы. Была школа балета. А вот каллиграфии не учили нигде. Школьное чистописание похоже на каллиграфию как строевой шаг на милонгу. Тоже вроде ровненько, но как-то асексуально.</p>\n<p>Сталинский книжный леттеринг, который часто называют каллиграфией, на самом деле практически всегда нарисован. Да, руки у советских оформителей книги были твердые. Но строгая цензура и отсутствие образцов делали буквы или скованными, или странноватыми. Эта странность заметна даже у Соломона Телингатера. На титуле «Штурм Берлина» 1948 года каллиграфия, изображающая свободную дневниковую запись, как будто танцует в полной парадной форме с аксельбантами, не отцепив саблю и не сняв шпор.</p>\n<p>На соседней полосе в той же «ИШ-1960» показан титульный лист, в свое время поразивший меня своей своеобычностью: «Памятники народного зодчества Верхнего Поволжья». Изображенные Телингатером буквы, видимо, должны отсылать одновременно к вязи, Гражданке Петровой и к народному рукописному книжному шрифту где-то середины 18 века. Дополнительные надписи сделаны условной писарской скорописью тех же 1750-х.</p>\n<p>Эклектика настолько дикая и настолько обаятельная, что ничем, кроме поиска ответа на вопрос, можно ли так в 1952 году, я ее объяснить не могу.</p>\n<p>Оттепель «отпустила руку». Каллиграфы стали каллиграфами.</p>\n<p>Например, Александр Васин и Сергей Пожарский: в «ИШ-1960 они скорее рисуют, а в «ИШ-1977» уже явно рукопишут.</p>\n<p>Еще характернее работы Юрия Васильева. В 1957 он от руки рисует почти наборный шрифт среднего кегля, а в 1970 выдает титул с изящнейшей скорописью.</p>\n<p>Но главной звезды оттепельной каллиграфии нет ни в одном из «ИШ». Для первого альбома Феликс-Лев Збарский был слишком молод и стилен. То, на что другие отважились в 1961, он крутил еще в 1956. А это совсем разные времена.</p>\n<p>Ну а ко времени застойного либерализма 1977 года Збарский уже оказался в Нью-Йорке транзитом через Израиль, и след его в отечественной книжной графике аккуратно стёрли. Интересно, что к началу семидесятых Збарский стал чуть не адептом швейцарской школы и строил титулы из наборного шрифта.</p>\n<p>В начале шестидесятых в ссср начал заводиться дизайн — и промышленный, и графический. Правда, само слово вошло в оборот только в 80-е. До того дисциплина называлась «техническая эстетика», а дизайнеры были «художниками-конструкторами». Головной институт ВНИИТЭ (технической эстетики) организован в 1962. Примерно в то же время появились отраслевые СХКБ (специальные художественно-конструкторские бюро). Обо всем этом напишу отдельно, а сейчас только вспомню о комбинате «Промграфика» и его главном художнике А. Д. Крюкове. Пожалуй, он был первым советским графическим дизайнером. Он сделал знаки фирмы грамзаписи «Мелодия» и «Спортлото». Его вывески светились вдоль всего пропиленного по живому Калининского проспекта.</p>\n<p>В частности — неоновое лого кинотеатра «Октябрь». Оно было сделано острым скриптом, более жестким, чем нынешняя вывеска. К тому же заглавная «О» была почти в рост строчных — юникейс. Тоже своего рода проба: можно ли священный месяц начать без раскрутки? Тогда прокатило.</p>\n<p>Еще один шестидесятнический логотип — у шоколада «Алёнка». Его автор — Леонид Константинович Челноков, многолетний главный художник «Красного Октября». Кстати, он же автор лого «конд. ф-ки», как писали на советских конфетных обертках. После Збарского легендарные фантики смотрятся как просто советские фантики — но полезно сравнить, насколько из прошлой жизни вышедшая в 1964 году «Аленка» рядом с обложками Збарского 1956.</p>\n<p>Чуть не забыл главную легенду оттепели, воплотившую сразу все ее символы. Что это? Делаю длиииинную томительную паузу.</p>\n<p>Догадались? Нет? Ищите слово [Отгадка] в подписях к картинкам )</p>\n<p>А напоследок имеет смысл заглянуть в книгу Виллу Тоотса «Современный шрифт», от которой я в 1978 году сошел с ума настолько, что перекопировал ее вручную на кальку.</p>\n<p>Там можно увидеть, как работает нормальный европейский каллиграф, волей судьбы записанный в советские. Это очень хорошо отрезвляет.</p>\n<h3>Конклюзия</h3>\n<p>Летящие надписи шестидесятых есть прежде всего запрос на волеизъявление.</p>\n<p>Хотим ветра в волосах и журнала «Юность»! Хотим космических перелётов и журнал «Чешское фото» с неодетыми девушками! Хотим небритой нежности у костра и сырок на троих, по-братски!</p>\n<p>Весь этот исторический оптимизм закончился глубоко ироническим постмодерном эпохи застоя. Но до него еще рассказывать и рассказывать.</p>\n<p>А пока партия забыла сказать «нельзя» и потом вынуждена была орать блажным генсеком на перешедших границы художников модерна два. Абстракцию тогда отменили. А вот брутализм с дизайном остались.</p>\n<p class=\"ps\"><span class=\"pslabel\">PS</span> То, что об этом предмете думает ИИ под руководством Юлии Репринцевой.</p>", "figs": [["img/11/11-001.jpg", "11-001", "<b>Заглавный титр фильма «Летят журавли». 1957 г.</b><p>Иконический советский титр оттепели. Это рисованный леттеринг, скорее всего, отработанный на кальке и потом прорисованный белилами по целлулоиду (судя по скругленным концам штрихов), а после этого смонтированный с фоновым кадром.<br>То же самое можно было вырезать из бумаги (я примерно такие титры делал на Киностудии МО в 1978 году).</p><p>Стиль надписи промежуточный, послесталинский. Через три-четыре года было бы гораздо более экспрессивно. Вопрос: «а так можно?» решили не задавать. Так было можно.</p>", 1.0], ["img/11/11-002.jpg", "11-002", "<b>Удивительный титул работы Телингатера. 1952 год</b><p>Судя по всему, это стилизация под середину 18 века, когда пошел отбой от петровской реформы и буквы слегка «приуставились». Но резчайшие диагонали и затейливые формы букв явно не историчны. А вот скорописные куски вполне в духе Елизаветинских времён.</p><p>На мой взгляд, уже заслуженный и сверхопытный СТ пытается найти границы дозволенного.</p>", 1.0], ["img/11/11-003.jpg", "11-003", "<b>Телингатер. Титул 1948 и переплет 1955.</b><p>И там, и там леттеринг изображает каллиграфию. На сталинском титуле он как бы свободно писан — но чем? Кистью? В дневнике? С маленьким интерлиньяжем и строгой выключкой по центру? Это я и называю танцем в шпорах.</p><p>«Буря» вроде как лихая и не центрованная, но как же продуманно связаны все буквы. Особенно фантастически выглядит вход Б в у. Так можно написать, если очень-очень постараться — но зачем, когда эффект должен быть ярким и спонтанным?</p>", 1.0], ["img/11/11-004.jpg", "11-004", "<p>Обложка и титул Юрия Васильева 1956 и 1970 годов. Заодно еще и тщательно нарисованный логотип попался.</p><p>На обложке довольно удивительная как бы наборная антиква компонуется с таким странным «Глядя на людей», что прямо дивно. Так можно? Можно?</p><p>А вот свободный скрипт справа никого не спрашивает. Он просто очень хорошо уложен и поддержан двумя набранными Литературной строчками. Оттепель кончилась, но рукописный курсив не запретили.</p>", 1.0], ["img/11/11-005.jpg", "11-005", "<b>Сергей Пожарский 1956 года — титул и пара деталей переплётов.</b><p>Пожарский каллиграф. Он очень легко крутит хвосты. Но даже в вегетарианские времена выдерживает центральную композицию, хотя и позволяет себе некоторую фламандскую неуклюжесть. А в переплетных штампах всё выдержано идеально аккуратно.</p>", 1.0], ["img/11/11-006.jpg", "11-006", "<b>Сергей Пожарский. Разворот из азбуки «Моя Россия» 1967 года.</b><p>Очень легкая и в легкую сделанная, хотя и тонко отделанная, композиция. Можно себе позволить и рваные линии, и мелкий текст без разметки — рука идет, чего опасаться?</p>", 1.0], ["img/11/11-007.jpg", "11-007", "<b>Александр Васин. Титул, 1965</b><p>Нарочито небрежная кистевая каллиграфия (какова дырка в слове «кураж»!).</p><p>Дополнение к названию написано белым по черной плашке. Всё это можно было бы набрать, но художник криво (мастерски криво) пишет от руки. Это свобода в чистом виде — сама для себя, как дачный букет, надранный прямо у забора.</p>", 1.0], ["img/11/11-008.jpg", "11-008", "<p>Владимир Вагин. «Русские потешки». Разворот. 1969.<br>Еще «левее» обычных шестидесятников были стилизаторы под лубок. Вот две работы — Вагина и следующая — Мавриной. Здесь профессиональные каллиграфы уходят почти в арт брют, оставаясь нарядными и опрятными.</p>", 1.0], ["img/11/11-009.jpg", "11-009", "<p>Татьяна Маврина. «Сказочная азбука». Титул. Гознак, 1969<br>Маврина, судя по печати на Гознаке, в конце шестидесятых шла по статусу народного художника (не в смысле «из народа», а как «народный артист»).</p><p>Это любопытная тема: наивно-профессиональное рисование кривых буковок со сказочными мотивами было вполне дозволенным, а вот попробовавший изображать цветочки в стиле make love not war рисковал попаданием в «Крокодил».</p>", 1.0], ["img/11/11-010.jpg", "11-010", "<b>Феликс-Лев Збарский. Титульный лист. 1955</b><p>Самый обычный сталинский титул. Вообще ничто не предвещает следующую картинку</p>", 1.0], ["img/11/11-011.jpg", "11-011", "<b>Феликс-Лев Збарский. Олеша. Обложка. 1956</b><p>За год аутсайдер стал лидером оттепели.</p>", 1.0], ["img/11/11-012.jpg", "11-012", "<b>Феликс-Лев Збарский. Монтан. Суперобложка. 1956</b><p>Здесь уже полная свобода. Особенно смело кинуты белые надписи поверх рисунка</p>", 1.0], ["img/11/11-013.jpg", "11-013", "<b>Феликс-Лев Збарский. Миллер. Титул. 1956</b><p>Две характерных черты оттепельного каллилеттеринга (кроме небрежности): скошенные вправо треугольные буквы и тяготение к правой выключке. Как будто художник хочет, чтоб читатель упирался в каждый конец строки и заново оглядывал всю композицию.</p>", 1.0], ["img/11/11-014.jpg", "11-014", "<b>Феликс-Лев Збарский. Миллер. Шмуцтитул. 1956</b><p>Правая выключка текста, и так же все фигуры на иллюстрации на левой полосе уперты вправо.</p><p>Очень характерная игра с толщиной штриха букв — она пляшет от сильной вертикали до сильной горизонтали.</p>", 1.0], ["img/11/11-015.jpg", "11-015", "<b>Феликс-Лев Збарский. Овидий. Титул. 1963</b><p>Опять выключка вправо. Это значит: левый край полосы как бы возникает из ниоткуда, а вот правый обрез книжного блока сильный. Правая выключка как бы запирает дверь в книгу, заставляет помедлить на титуле.</p><p>Очень вольное обращение с антиквой. Резкая разноширинность. Нарочито заваленные О-Ю. Исключительно обаятельная в своей куцелапости S. Маэстрозная игра с интерлиньяжем.</p><p>В отличие от более ранних работ Збарского, здесь совсем нет вызова, зато есть веселая небрежность уверенного в себе мастера</p>", 1.0], ["img/11/11-016.jpg", "11-016", "<b>Феликс-Лев Збарский. День поэзии. Суперобложка. 1963</b><p>Внезапно: игра в швейцарскую школу. Леттеринг в сочетании с набором (похоже, не рекле).<br>Это тоже шестидесятые, но опять Збарский немного обгоняет советское время</p>", 1.0], ["img/11/11-017.jpg", "11-017", "<b>Феликс-Лев Збарский. Распашной титул. 1970</b><p>А это уже чистый набор очень старым гротеском. Явная игра и со швейцарцами, и с советским авангардом.</p><p>И опять выключка вправо (вот чего бы себе никогда не позволил Рудер сотоварищи).</p><p>Выключка вправо есть античитательская, антитекстовая и антинаборная вольность. Попробуйте писать от руки с выключкой вправо, и вы быстро поймете, что такой цирк вам не нужен. Зачем же это раз за разом делает советский художник-шестидесятник? Затем же, зачем Незнайка носит своё сомбреро: во-первых, это красиво.</p>", 1.0], ["img/11/11-018.jpg", "11-018", "<b>А. Д. Крюков. Вывеска на кинотеатре «Октябрь». 1967</b><p>Буквы, по сравнению со Збарским, старомодные, но очень энергично прорисованные. И нарочито не парадные.</p><p>Калининский проспект — ранний образец советского модернизма два-ноль, еще скорее гавана-клаб, чем оскар-нимейер (который сэв).</p><p>Обязательная черта модернизма — некоторая неловкость, неуклюжесть, брутальность. Вот и крюковский «Октябрь» дребезжит, если его сопоставить с каллиграфическими логотипами американского большого коммерческого стиля пятидесятых. Так пакуется левизна, когда хочет стать брендом. И это очень советский способ продаж.</p>", 1.0], ["img/11/11-019.jpg", "11-019", "<b>А. Д. Крюков. Логотип фирмы «Мелодия». 1964.</b><p>Спираль нарисована от руки. Это из 50-х. А вот ленточная антиква и аккуратная М — шестидесятнические, причем скорее западные, чем советские.</p><p>В то время Оптима была свежей новинкой, и ее блестящая парфюмерная карьера еще только намечалась.</p><p>Внизу вывеска фирменного магазина «Мелодия» на Калининском. Автор тот же Крюков, но на вывеске не логотип. Слово «брендинг» появится в дизайнерском лексиконе только в следующем веке.</p>", 1.0], ["img/11/11-020.jpg", "11-020", "<p>Фасад с логотипом кинотеатра «Россия» на Пушкинской. Июль 1961 года. Кинотеатр был открыт к кинофестивалю.</p><p>Лого — модный тогда гротеск с очень легким допетровским флером в буквах ОСС. Скорее всего, нарисовано архитекторами. Они вообще считают, что понимают в буквах. Иногда понимают, не спорю.</p>", 1.0], ["img/11/11-021.jpg", "11-021", "<b>Два логотипа Театра сатиры.</b><p>Слева нечто народно-сталинское, сделанное в додизайнерские времена. Что-то сатирическое в нем есть: «взял он вилку, взял он остру, и зарезал сам себя»</p><p>А вот фасадная надпись как бы классического оттепельного вида: толстый гротеск и скрипт — наверняка была допилена минимум в восьмидесятых. Уж больно она чистая.</p>", 1.0], ["img/11/11-022.jpg", "11-022", "<b>Леонид Константинович Челноков. Логотип фабрики и логотип продукта.</b><p>Надпись «Красный Октябрь» такого вида встретилась мне на фантике 1952 года. Да и по виду она сталинская, вдохновлена чем-то дореволюционным, примерно Кока-Колой.</p><p>А вот лого «Алёнка» позднеимперское, хотя и сделано в 1964 году. Такое чувство, что автор пытался пройти по границе между чем-то школьным и чем-то дамско-мыльным. И ему это удалось, чему особенно способствует строчная [а] на месте заглавной. Унылый брендинг, вкус знакомый с детства.</p>", 1.0], ["img/11/11-023.jpg", "11-023", "<p>[Отгадка] Ну конечно же, плавленый сырок «Дружба»! Он появился в 1963 году и стал идеальной эмблемой эпохи.</p><p>Во-первых, имя. В тот момент ссср, раньше бывший главным мировым букой, начал навязчиво дружить со всем, что плохо лежало на глобусе. Отсюда вдруг беспечно голубой земной шарик на обертке.<br>Во-вторых, космос. Заглавная Д подмышкой изображает околоземную орбиту.<br>В-третьих, либерализация. Композиция этикетки не центральная, желто-красный фон динамически перекошен (думаете, советский обыватель этой вольности не считывал? Ха-ха).<br>В-четвертых, «РУЖБА» модной ленточной антиквой.<br>В-пятых, гротески. В 1965 году (см. мрту 49/6-65) в ссср еще не было наборных гротесков такого вида. Но для рекле нашлись!</p>", 1.0], ["img/11/11-024.jpg", "11-024", "<b>Виллу Тоотс. Современный шрифт. Разворот. 1963.</b><p>Закусим Дружбу нормальной латинской каллиграфией. Надо ли объяснять, почему я не считаю Тоотса советским художником?</p>", 1.0], ["img/11/11-025.jpg", "11-025", "<b>Виллу Тоотс. Современный шрифт. Разворот. 1963.</b><p>Слева наборные каллиграфические (латинские, естественно) шрифты 1960-х. У юного меня в конце семидесятых вызывали бессильное желание перевода.</p><p>Справа автор книги изволил руку разминать. Hallo, Narva! Свободная от прелестей соцреализма рука выглядит именно так.</p>", 1.0]], "research": {"task": "Собрать вывески, обложки, плакаты и рекламу оттепели, определить стилистику и мотивы, выяснить источники, проследить эволюцию, сопоставить с западными аналогами; затем — добавить кинотеатры, концертные залы, фирменные магазины.", "work": "Бриф в проекте для промптов → Gemini Deep Research: 30 объектов с описанием формы буквы, шесть типов шрифтовой формы, 23 источника; доработка по замечанию автора.", "tools": "Gemini Deep Research, ChatGPT", "dates": "март — апрель 2026"}}, {"intro": false, "num": "37", "title": "Глава о машинописи и литературном языке", "ptitle": "Машинопись и литературный язык", "subtitle": "", "date": "18 мая 2026 г.", "perm": "https://www.facebook.com/100000723643455/posts/27410854155188670/", "slug": "", "html": "<div class=\"epi\"><p>Эрика берет четыре копии —<br>Вот и всё, а этого достаточно.</p><span class=\"epi-a\">Александр Галич</span></div>\n<p><span class=\"dc\">П</span>омните, в самом начале книги я сравнивал себя с человеком, зашедшим с фонариком в огромный тёмный склад? Пусть эта короткая главка будет таким спотлайтом, выхватившим всего один элемент большого явления под именем «Самиздат».</p>\n<p>Запрещенную литературу размножали по-разному. Переписывали от руки. Переснимали на фото. Издавали заграницей и нелегально ввозили. Под конец советского строя ксерокопировали и даже печатали на ранних принтерах.</p>\n<p>Но, видимо, главным способом распространения была машинопись. Пишмашинок было много, в том числе в частных руках. Они компактны и достаточно производительны. Писчей бумаги хватало. Копирки в те времена тоже было полно.</p>\n<p>Зарядил(а) четыре листа, проложил(а) между ними три копирки — и вперёд. За ночь можно отстучать небольшую книгу.</p>\n<p>Первый лист был ярким, даже пережатым. Четвёртый — бледным до почти невидимости. На пятый сил у машинки не хватало.</p>\n<p>Говорят, все пишмашинки состояли на учете в кгб (не доказано). Говорят, отследить по характерному натиску отдельных букв можно было любую из них. Это правда. Можно было также изъять копирку и посмотреть, что на ней оттиснулось. Но количество самиздата свидетельствует о том, что государство так и не смогло заткнуть этот рот.</p>\n<p>У меня дома (за 3500 км от холма, где я сейчас) лежит машинописный Хармс. Видимо, вторая копия. Сильно пожелтевшие листы формата А4 (неведомого советским людям, он назывался просто «писчая бумага», но вполне соответствующего нынешнему). Всё это подшито в картонную папку со скоросшивателем и с завязкой тесьмой. На обложке стандартный брусковый шрифт: «Дело №»…</p>\n<p>Стоп.</p>\n<p>Самиздат упакован в ту же форму, в которую подшивались дела сначала врагов народа, а потом диссидентов. И внутри — та же машинопись. Вы оценили?</p>\n<p>У шрифта есть голос. У текста есть вкус. Это неотменяемо и съедается читателем независимо от желания.</p>\n<p>Отпечатанный на машинке самиздат говорит ментовским, тюремным и лагерным языком.</p>\n<p>Неужели никто не замечал эту амбивалентность?</p>\n<p>Здесь можно задуматься о литературном и общекультурном эффекте машинописи. Когда, в какой момент, для какой цели мы выбираем этот неровный, кривоватый, моноширинный (то есть адски монотонный) и совсем некрасивый шрифт? За что мы его ценим?</p>\n<p>Мне кажется, лучшее определение — «искренность». Это тоже крайне неоднозначное слово в русской-российской-советской-постсоветской культуре.</p>\n<p>С одной стороны, от него идёт земляной дух крестьянской правды. С другой — перегар и треск раздираемого тельника. А с третьей — казённый стиль «чистосердечного признания и искреннего раскаяния», за которым могла последовать поблажка, а могла и нет.</p>\n<p>То же и с машинописным кларендоном. Им одинаково органично смотрится набранное капслоком «ПРОТОКОЛ», и строчными в столбик:</p>\n<p class=\"verse\">«Из дома вышел человек<br>С дубинкой и мешком<br>И в дальний путь<br>И в дальний путь<br>Отправился пешком»</p>\n<p>В этом, на мой взгляд, сущность нашего постсоветского литературного языка. Он шероховат, норовит сорваться в крик или прорезаться матюком. Ему плохо даются изящные обороты, зато хорошо выходит рубка правды-матки. А еще у него отлично получается переходить в канцелярит, скоросшивательно протоколируя материал и высокочастотно задействуя слово «данный».</p>\n<p>Но есть и хорошие новости. Машинописный шрифт идеально подходит для карточек Рубинштейна:</p>\n<p class=\"verse\">1.<br>Итак, я здесь!<br>2.<br>И вот...<br>3.<br>И вот я здесь...<br>4.<br>(Откуда ты? Тебя уже не ждали...)<br>5.<br>И вот..<br>6. …</p>\n<p>Им должен быть набран весь Пригов. Да. Весь! Все сто томов.</p>\n<p>И так далее.</p>\n<div class=\"orn\" role=\"separator\"><b></b></div>\n<p>Как всегда, не забывайте про подписи к картинкам. Они дополняют текст.</p>", "figs": [["img/12/12-001.jpg", "12-001", "<p>Исходник моего шрифта Erika. Скан машинописи пишмашинки Эрика-10, серийный номер 1751649.<br>Найдено в интернете</p>", 1.0], ["img/12/12-002.jpg", "12-002", "<p>Набрано на маке шрифтом Erika</p>", 1.0], ["img/12/12-003.jpg", "12-003", "<b>Протокол допроса свидетеля Л.Н.Гумилева от 26 августа 1987 года</b><p>Машинопись</p><p>Взято отсюда:<br>https://mandelstam.hse.ru/archive/201884309</p>", 1.0]], "research": null}, {"intro": false, "num": "38", "title": "Глава о Фестивале 1957 и Олимпиаде 1980 («От ромашки до мишки»)", "ptitle": "От ромашки до мишки — визуальная коммуникация Фестиваля-57 и Олимпиады-80", "subtitle": "", "date": "12 июня 2026 г.", "perm": "https://www.facebook.com/100000723643455/posts/27730650253209057/", "slug": "festival", "html": "<p><span class=\"dc\">И</span>сторический контекст: в 1956 году на ХХ съезде кпсс генсек Хрущев публично разоблачил покойного отца народов Сталина. В ссср буйно забулькала оттепель. Даже начал приподниматься уголок железного занавеса. И тут очень кстати международный союз прогрессивной молодежи вместе с не менее прогрессивным союзом международных студентов решили провести свой опрятный вудсток в Москве. И товарищи из цк вместе с товарищем майором внезапно это разрешили.</p>\n<p>Чтобы понять, почему Это произошло, достаточно генеалогии. Международный союз молодежи — наследник Коммунистического интернационала молодёжи (КИМ), который, в свою очередь, был молодежной секцией коминтерна — организации, стоявшей на довольствии в Москве и в конце концов Москвой же прикрытой.</p>\n<p>И всё ж случился шок-контент: ссср вдруг повернулся к миру передом и стал настойчиво демонстрировать всем желающим свои неоспоримые преимущества. Но чу: в числе преимуществ не было графического дизайна. Вообще не было — он отсутствовал за полной ненадобностью.</p>\n<p>А теперь скакнём на двадцать три года вперед. К 1980 году советский союз успел похерить оттепель, влезть в Афганистан, поругаться с Америкой. Состояние политбюро называлось «застой». Как оказалось позже, это была разминка перед гонкой на лафетах. Однако сотрудники головного института технической эстетики уже вовсю звали себя дизайнерами, и даже слово «хельветика» успело подхватить начальную «г».</p>\n<p>А теперь подробности.</p>\n<p>У каждого крупного международного события начиная с середины прошлого века обязательно должна быть эмблема. Почему?</p>\n<p>Потому, что в двадцатом веке начался рекламный вихрь, связанный с индустриальной (не путать с промышленной) революцией. Лбы всех авто украсили товарные знаки производителей. Товарные знаки стали носить там, где раньше красовались ордена: на сердце. Партии, союзы и секты возвели свои крестики-нолики в ранг сакральных символов. Футбольные клубы поголовно обзавелись гербами.</p>\n<p>Одновременно событие, не попавшее в газеты, перестало быть событием. А чтобы попасть в газеты, надо свести событие к легко читаемому знаку. К эмблеме.</p>\n<p>В ссср не было дизайна, зато эмблем встречалось навалом, начиная с консервооткрывающей пары из серпа и молота. И вот внезапно с неба падает какой-то фестиваль. Что объявляет советская власть? Конечно, конкурс на лучшую эмблему. Прислали триста вариантов, выбрали ромашку.</p>\n<p>В 2007 году мы выбирали знак рубля из 30 знаков — победителей всероссийского конкурса 1999 года. Поэтому я примерно представляю, что было прислано в 1956 году.</p>\n<p>Ромашку нарисовал московский художник-плакатист Константин Кузгинов. Его плакаты участвовали в предыдущих молодежных фестивалях.</p>\n<p>До Москвы прогрессивные молодые люди собирались в Праге (1947), Будапеште (1949), Берлине (1951), Бухаресте (1953), Варшаве (1955) и не выработали общей символики. А вот ромашка Кузгинова так пришлась ко двору, что стала постоянным символом почти всех последующих мероприятий прогрессивной молодежи. Наверное, она дивно хороша?</p>\n<p>Чтобы понять, хорош или плох знак, надо посмотреть, что он означает и как работает. И заодно сравнить с современными ему эмблемами.</p>\n<p>Эмблемы предыдущих фестивалей, так же как эмблемы Олимпиад, вели родословную от гербов городов или символики гильдий и сообществ. Они громоздки, сюжетны, повествовательны. Московская ромашка абсолютно другая. Она напоминает… значок. Клубный, партийный — комсомольский, пионерский, например. Ее легко представить в металле и глазури на лацкане.</p>\n<p>Что и было сделано. Первое, что я нашел в сети, когда полез за картинками к фестивалю — огромную коллекцию, в несколько сотен, в основном советских, значков.</p>\n<p>В ссср не знали, что такое дизайн, зато нашли простой и понятный символ: пять олимпийских колец, скрытых за шестым, превращенным в земной шар, с надписью на нём «За мир и дружбу» (разумеется, по-русски).</p>\n<p>На ромашку не слишком похоже, скорее на цветик-семицветик из жутковатой сказки Катаева, что, может быть, было понятно для советских пользователей. Но в таком случае девиз должен был звучать: «бери, пока дают».</p>\n<p>Важный колористический момент: чёрный африканский лепесток заменили фиолетовым. Вышло и толерантней (европейский тоже не белый, а голубой), и не так мрачно: в отечественной культуре чёрный намертво связан с трауром.</p>\n<p>Как всякий простой символ, фестивальная ромашка была разнообразно использована. В средний круг вписывали голубя, олимпийский огонь, голубя-огонь, виды городов, виды спорта, и так далее. Уже в другую эпоху из ромашки сделали кокошник — в общем, символ оказался исключительно удобным и податливым.</p>\n<p>Фирменного стиля, особой типографики, навигации, брендирования в 1957 году в Москве не было — как не было нигде. Максимум, что выходило к Олимпиадам еще с тридцатых годов — серии плакатов в едином стиле. В Москве не было и этого. Первый мировой прорыв в спортивном брендинге случился через семь лет — на Олимпиаде в Токио.</p>\n<p>А что же было в Москве-80?</p>\n<p>К этому времени в брендировании Олимпиад произошла революция. После стиля Токио-1964 был создан цельнодизайнерский комплект для Мехико-1968, а потом канонический Мюнхен-1972, где понятие «стиль Олимпиады» было окончательно сформулировано. После этого все следующие Олимпиады оформляли специально нанятые команды с общим подходом к эмблеме, пиктограммам, типографике, навигации и брендированию.</p>\n<p>Здесь останавливаюсь и отсылаю к картинкам. Добрый ИИ показал дорогу к отчетам национальных олимпийских комитетов перед МОК о проведенных мероприятиях. Я вытащил оттуда некоторые страницы, посвященные дизайну. Так вот: чтобы понять, чем отличаются настоящие дизайн-системы от московской, просто сравните количество иллюстраций на странице. Там, где у Мюнхена десять картинок, у Москвы одна. Даже в Токио, за шестнадцать лет до Москвы, спортивные пиктограммы предварялись настоящим дизайн-исследованием.</p>\n<p>Продолжаю. На фоне предшественников Москва выделяется разностильностью. Эмблему сделал один дизайнер. Маскота нарисовал (именно нарисовал как иллюстратор, в одной, весьма неудобной для использования, позе, а не показал со всех сторон как полагается) художник-график. Шрифт перевел даже не дизайнер шрифта. Наконец, спортивные пиктограммы нарисовал студент, а служебные — команда лучших на тот момент графических дизайнеров. Всё это вместе не составляло ни единой концепции, ни единого графического стиля.</p>\n<p>При этом каждая часть была неплохой. Футура — вполне спортивный шрифт. Чижиковский Мишка вышел дружелюбным и обаятельным. Спортивные пиктограммы советская и постсоветская дизайн-критика считает чуть ли не лучшими в истории...</p>\n<p>Не знаю, как вы, я помню свои ощущения того времени. Я был начинающим дизайнером 22 лет от роду и смотрел на московскую символику как на нечто вторичное, провинциальное и в целом старомодное.</p>\n<p>Знак-высотка (он не слишком похож на Кремль) был неплох, но к тому моменту только совсем ленивый не сделал знаков из полосочек. При этом кто-то быстро придумал класть башню на бочок, так что получалась пусковая установка на гусеничном ходу, что не способствовало (или наоборот способствовало).</p>\n<p>Шестидесятнический Мишка резко выбивался из общей стилистики евродизайна. Он был из журнала «Мурзилка» — быстро, лихо, небрежно нарисованный в очень узнаваемом стиле Чижикова.</p>\n<p>Спортивные пиктограммы получились более округлыми, чем мюнхенские, но стилистически не сильно привязывались ни к эмблеме, ни к фирменному шрифту, а с маскотом вообще ничего общего не имели. Чтобы заставить Мишу заниматься спортом, его перерисовали специально нанятые художники, подогнав к стилистике пиктограмм.</p>\n<p>Почему в качестве фирменного шрифта выбрали Футуру? Мне кажется, сработали три рефлекса и один расчет. Во-первых, Футура слаще Гельветики. Чтобы Гельветика заиграла, вокруг необходим сплошной дизайн. А Футура даёт игру сама по себе. Кстати, из эмблемы и блока названия так и не вышло цельной композиции — очень редкий случай на Олимпиадах. Вторая причина — буква М с косыми сторонами — подсознательно напоминающая лого московского метро. Наконец, Футура связана с Баухаусом, а где Баухаус — там и ВХУТЕМАС. Расчет же, как мне кажется, заключался в том, что единственным советским гротеском на тот момент была Журнальная рубленая — переделка Эрбар гротеска с оглядкой на Футуру.</p>\n<p>Футуру перевели, но в наборный шрифт не превратили. Чтобы что-то набрать, надо было резать и клеить.</p>\n<p>Апдейт: специалист (см. комментарии) не дал соврать. Футуру перевели и сделали наборным шрифтом для ручного фотонабора. В ФРГ, в компании Letterphot. Видимо, поэтому ее больше никто не видел после 1980 года.</p>\n<p>Напомню: в Мюнхене-72 фирменным шрифтом был Универс Фрутигера — самая развернутая и разумно устроенная семья наборных шрифтов 60-70-х. Вот здесь московским дизайнерам могла и пригодиться Журнальная рубленая в мелком кегле. Не знаю, пригодилась ли — надо смотреть.</p>\n<p>Что касается хвалимых спортивных пиктограмм, в 1980-м они смотрелись как подслащенный плагиат мюнхенских, менее спортивный и динамичный. Сейчас, учитывая принципиально другую сетку, на которой они были построены, пиктограммы выглядят хорошей базой для большого стиля — которого не было. Построенные на той же сетке служебные и навигационные пиктограммы больше напоминают имевшиеся еще с тридцатых годов международные системы, чем московскую спортивную.</p>\n<p>Самая сильная визуальная находка Московской Олимпиады не связана с графическим дизайном и типографикой. Весь мир (кто смотрел телевизор) запомнил улетание Карлсона Миши под нежное и печальное пение:</p>\n<p>До свиданья, наш ласковый Мииша,<br>Возвращайся в свой сказочный лес…</p>\n<h3>Конклюзия</h3>\n<p>Нет, ни Фестиваль, ни Олимпиада-80, ни даже Олимпиада-2014 не стали дизайнерскими событиями — ни мирового, ни даже локального значения.</p>\n<p>Зато Фестиваль ознаменовался (хорошее советское канцеляризмо) такой внезапной открытостью Москвы, что появился специальный термин «дети фестиваля» для украсивших столицу и окрестности деточек всех цветов ромашки, включая, возможно, голубой и фиолетовый.</p>\n<p>Олимпиада не только улетела Мишу, но и стала пробным камнем (еще один советский канцеляризм) для большого советского дизайна — примерно в это же время крупные экспортёры украсились логотипами Sudo, Promo, Atomo и снабдились почти настоящими брендбуками о ста страницах, с сетками, фирменными шрифтами etc.</p>\n<p>ссср, еще не знавший, что станет простой бензоколонкой, вползал в мировой рынок, пытаясь замаскировать крокодилий хвост дизайнерскими паттернами.</p>\n<p class=\"ps\"><span class=\"pslabel\">PS</span> Для тех, кому хочется большей объективности — глубокое исследование от ChatGPT под руководством Юлии Репринцевой. В частности, чат нашел отличные ссылки на дизайн-проекты Олимпиад между Токио и Москвой.</p>\n<p>В этот раз ИИ продемонстрировал серьезные возможности поиска, отбора и анализа информации. По ссылке в комментарии — все подготовленные им эссе и аннотированная база источников.</p>", "figs": [["img/13/13-001.jpg", "13-001", "<b>Фестиваль 1957 и Олимпиада 1980.</b><p>Два советских значка с разницей в 23 года</p>", 1.0], ["img/13/13-002.jpg", "13-002", "<b>Эмблемы послевоенных Олимпиад до 1980.</b><p>До Токио — именно эмблемы. После — логотипы.</p>", 1.0], ["img/13/13-003.jpg", "13-003", "<p>Торжественное мотошествие в день открытия VI Всемирного фестиваля молодежи и студентов, Москва 1957. Фото с сайта pastvu.com</p>", 1.0], ["img/13/13-004.jpg", "13-004", "<p>Открытие Фестиваля молодёжи и студентов. Москва, 1957</p>", 1.0], ["img/13/13-005.jpg", "13-005", "<p>Эмблемы фестивалей в Праге 1947, Берлине 1951, Бухаресте 1953</p>", 1.0], ["img/13/13-006.jpg", "13-006", "<p>Пабло Пикассо. Плакат I Всемирного конгресса сторонников мира в Париже, январь 1949 г.</p>", 1.0], ["img/13/13-007.jpg", "13-007", "<b>Открытка I Всемирного фестиваля молодежи и студентов, 1947</b><p>Откуда голубка? От Пабло, вестимо</p>", 1.0], ["img/13/13-008.jpg", "13-008", "<p>Значки Фестиваля 1957 года.<br>Середина ромашки трактуется весьма по-разному</p>", 1.0], ["img/13/13-009.jpg", "13-009", "<p>Значки фестиваля 1957 г.<br>Эмблема — не обязательная часть</p>", 1.0], ["img/13/13-010.jpg", "13-010", "<b>Фестивальные значки 1957 года.</b><p>Все они взяты отсюда: https://yacollectioner.ru/festivalnye-znachki-1957-goda/</p><p>Там их намного больше, и есть совсем странные.</p><p>Одним из основных мотивов была голубка (когда-то улетевшая из-под руки Пикассо). Но иногда встречался и лось. Каждый советский регион норовил прибавить что-то своё. Общего стиля не было и не могло быть.</p>", 1.0], ["img/13/13-011.jpg", "13-011", "<p>«Настолько лаконичного символа фестиваля придумать было сложно, поэтому в 1958 году Венский конгресс Всемирной федерации демократической молодежи принял решение взять ромашку за основу всех последующих фестивальных эмблем». (из комплиментарного описания)</p><p>Эмблемы Всемирных фестивалей молодежи и студентов 1957, 1985 и 2017</p>", 1.0], ["img/13/13-012.jpg", "13-012", "<p>«Разноцветную ромашку на XII Всемирном фестивале молодежи и студентов дополнил еще один символ, полюбившийся и запомнившийся всем. Изображение девочки Катюши в ярко-красном сарафане и кокошнике. Кокошник по задумке автора эмблемы напоминал ту самую фестивальную ромашку 1957 года, которая отлично подходила к русскому народному костюму Катюши.</p><p>Создатель Катюши – советский художник и архитектор Михаил Веременко. Ранее он уже имел опыт участия в подобных конкурсах. Он рисовал плакаты для разных крупных мероприятий, в том числе для Олимпиады 1980».</p><p>Цитата из комплиментарного источника. Для меня приключения ромашки, ставшей кокошником — очередной советский кружок умелые руки</p>", 1.0], ["img/13/13-013.jpg", "13-013", "<p>Отсюда начинается показ элементов визуальной коммуникации Олимпиад с Токио 1964 до Москвы 1980. Сначала идет логотип, потом несколько страниц из официальных отчетов. И еще что-то, понемногу.</p><p>Токио 1964. Раскадровка логоблока и сам блок.<br>По-моему, эмблема Токийской Олимпиады — некий абсолют. Проще сказать трудно</p>", 1.0], ["img/13/13-014.jpg", "13-014", "<p>Токио 1964. Спортивные пиктограммы на сетке. Еще нет канонического квадрата и немецкого лаконизма, но дизайн есть, и это сильный дизайн</p>", 1.0], ["img/13/13-015.jpg", "13-015", "<p>Токио 1964. Спортивные пиктограммы.<br>Только готовя главу, разглядел, как это круто нарисовано</p>", 1.0], ["img/13/13-016.jpg", "13-016", "<p>Токио 1964. Служебные и навигационные пиктограммы. В шестидесятые дизайн был полон тонкой иронии</p>", 1.0], ["img/13/13-017.jpg", "13-017", "<p>Токио 1964. Гайд</p>", 1.0], ["img/13/13-018.jpg", "13-018", "<p>Токио 1964. Программки</p>", 1.0], ["img/13/13-019.jpg", "13-019", "<b>Мехико 1968. Логотип</b><p>Мексиканский стиль впервые настойчиво использует параллельные линии, но это не обязательно метафора беговых дорожек.</p><p>Это и поп-арт, и ацтекские орнаменты.</p><p>Лого Мехико игнорирует канон пропорций знака — квадрат или около того. Это вообще очень странно, но мексиканский стиль убедителен</p>", 1.0], ["img/13/13-020.jpg", "13-020", "<p>Мехико 1968. Страница про дизайн из официального отчета. Компактный и полный вариант лого. Вариант с прорастанием паттерна. Фирменный шрифт.</p>", 1.0], ["img/13/13-021.jpg", "13-021", "<p>Мехико 1968. Спортивные и служебные пиктограммы. Появляется квадрат в качестве стандартного поля.</p>", 1.0], ["img/13/13-022.jpg", "13-022", "<p>Мехико 1968. Логопаттерн.<br>Торжество поп-артной психоделики.<br>Не знаю, красиво ли это. Но точно смело</p>", 1.0], ["img/13/13-023.jpg", "13-023", "<p>Мехико 1968. Нечто брендированное. Много</p>", 1.0], ["img/13/13-024.jpg", "13-024", "<p>Мехико 1968. Еще много деталей стиля</p>", 1.0], ["img/13/13-025.jpg", "13-025", "<b>Мюнхен 1972. Логотип</b><p>Один из самых странных и самых абстрактных логотипов олимпиад</p>", 1.0], ["img/13/13-026.jpg", "13-026", "<p>Мюнхен 1972. Страница из отчета с основными элементами стиля. Построение логотипа. Общая сетка. Фирменный шрифт. Фирменные блоки.</p><p>Одна страница. Запомните</p>", 1.0], ["img/13/13-027.jpg", "13-027", "<p>Мюнхен 1972. Вторая страница брендбука из отчета. Палитра, маскот, дополнительные сетки на разные случаи</p>", 1.0], ["img/13/13-028.jpg", "13-028", "<p>Мюнхен 1972. Страница из брендбука про установку флагов. Опять сетка, порядок, варианты</p>", 1.0], ["img/13/13-029.jpg", "13-029", "<p>Мюнхен 1972. Бюллетени. Сетка, принципы дизайна</p>", 1.0], ["img/13/13-030.jpg", "13-030", "<b>Мюнхен 1972. Календарь соревнований. Опять всё по сетке и всё понятно.</b><p>Заметьте — я даже не вытащил из отчета самые вкусные страницы про дизайн канонических пиктограмм</p>", 1.0], ["img/13/13-031.jpg", "13-031", "<p>Мюнхен 1972. Иллюстрации. И вот тут выясняется, что стиль, продуманный до последней буквы — тотально игровой</p>", 1.0], ["img/13/13-032.jpg", "13-032", "<p>Монреаль 1976. Логотип</p>", 1.0], ["img/13/13-033.jpg", "13-033", "<p>Монреаль 1976. Постер</p>", 1.0], ["img/13/13-034.jpg", "13-034", "<p>Монреаль 1976. Страница из отчета с дизайном логотипа. Блоки для разных размеров, варианты, охранные поля</p>", 1.0], ["img/13/13-035.jpg", "13-035", "<p>Монреаль 1976. Цветовая палитра</p>", 1.0], ["img/13/13-036.jpg", "13-036", "<p>Монреаль 1976. Плакат и маскот. Принципы графического оформления</p>", 1.0], ["img/13/13-037.jpg", "13-037", "<p>Монреаль 1976. Детали стиля. Приглашение, флаг, огонь…</p>", 1.0], ["img/13/13-038.jpg", "13-038", "<p>Монреаль 1976. Брошюры по графике и дизайну, опубликованные в процессе подготовки к играм. Не одна</p>", 1.0], ["img/13/13-039.jpg", "13-039", "<p>Вам ничего не напоминает этот значок? В отечественных дизайнерских кругах ходит легенда, что эмблема московской Олимпиады 1980 была содрана с эмблемы Спартакиады народов ссср 1979 года. Обе они были разработаны в 1975 году, причем спартакиада подавалась как разминка перед олимпиадой — так что сходство логотипов, вроде бы, закономерно.</p><p>Сообщает ИИ: «Логотип (официальная эмблема) Олимпиады-80 был утвержден 15 июля 1976 года на 78-й сессии Международного олимпийского комитета в Монреале.</p><p>Сообщает ИИ: «Официальная дата утверждения или принятия логотипа VII Спартакиады народов СССР не имеет документарного подтверждения в открытых архивах, однако его эскиз был разработан и презентован общественности в 1975–1976 годах»</p>", 1.0], ["img/13/13-040.jpg", "13-040", "<b>Москва 1980. Блок логотипа и названия.</b><p>Это самый странный логоблок из всех мной виденных. Знак строго симметричный. Название выключено влево и приставлено сбоку примерно по оптическому центру. При этом для выравнивания букв не использована естественная горизонталь основания лого</p>", 1.0], ["img/13/13-041.jpg", "13-041", "<b>Москва 1980. Шмуцтитул из официального отчета, посвященный дизайну</b><p>Композиция на фото, видимо, должна показать, как много мы трудились и какие у нас были красивые западные фломастеры</p>", 1.0], ["img/13/13-042.jpg", "13-042", "<p>Москва 1980. Страница из дизайн-отчета с построением логотипа и отдельно звёздочки. И с портретом автора.</p><p>Ни блоков, ни вариантов использования, ни охранных полей.</p><p>Вспомните такую же мюнхенскую или хоть монреальскую</p>", 1.0], ["img/13/13-043.jpg", "13-043", "<p>Москва 1980. Маскот с портретом Чижикова и длинный рассказ про то, как Мишу выбрали из 26000 вариантов</p>", 1.0], ["img/13/13-044.jpg", "13-044", "<p>Москва 1980. Страница из отчета. Построение спортивной пиктограммы и портрет автора</p>", 1.0], ["img/13/13-045.jpg", "13-045", "<p>Москва 1980. Страница из отчета. Спортивные пиктограммы</p>", 1.0], ["img/13/13-046.jpg", "13-046", "<p>Москва 1980. Страница из отчета: официальные цвета. Целая страница</p>", 1.0], ["img/13/13-047.jpg", "13-047", "<b>Москва 1980. Фирменный шрифт.</b><p>На самом деле не наборный шрифт, а его эскиз.<br>Текст посвящен не шрифту, а цветовой палитре. На странице с палитрой не уместился</p>", 1.0], ["img/13/13-048.jpg", "13-048", "<p>Москва 1980. Страница из отчета. Медали и диплом</p>", 1.0], ["img/13/13-049.jpg", "13-049", "<p>Москва 1980. Стиль в городе. Скромно</p>", 1.0], ["img/13/13-050.jpg", "13-050", "<p>Москва 1980. Постер</p>", 1.0], ["img/13/13-051.jpg", "13-051", "<b>Москва 1980. Олимпийские значки</b><p>Найдите двадцать отличий от значков Фестиваля 1957 года. Можно попытаться найти системный подход к дизайну. Можно поискать сам дизайн</p>", 1.0]], "research": {"task": "«Давай я скину идею, а ты превратишь её в промпт»: описать и сравнить оформление Фестиваля молодёжи 1957 года и Олимпиады 1980 года, сопоставить с западным оформлением того же времени; нужны и глубокие исследования, и выжимка.", "work": "Серия из шести брифов и шести Deep Research: советские массовые праздники, олимпийские дизайн-системы 1968–1980, чемпионаты мира, аннотированная база западных источников — и единая аналитическая глава на их основе. Итоговую базу Юрий Гордон назвал лучшим, что ИИ сделал для его книги.", "tools": "ChatGPT Deep Research", "dates": "май — июнь 2026"}}, {"intro": false, "num": "39", "title": "Советские прописи шестидесятых. Воспоминания школьника-левши", "ptitle": "Советские прописи шестидесятых", "subtitle": "Воспоминания первоклассника-левши, пошедшего в школу в 1965 году", "date": "15 июня 2026 г.", "perm": "https://www.facebook.com/100000723643455/posts/27770387565901992/", "slug": "", "html": "<p><span class=\"dc\">Н</span>а стене в классе висело учебное пособие. На нём был представлен алфавит прописей — заглавные и строчные буквы. Буквы были крупные, аккуратно начерченные, с ровным механическим нажимом. Над всем этим тянулась наборная строка (Литературная гарнитура, узкое полужирное начертание): «Пиши правильно и красиво».</p>\n<p>Я много наблюдал, как мама работает. Она была литредактором и часто брала статьи на дом. Мама сидела за секретером с откидным столом, держа в одной руке ручку, в другой — цветной карандаш кохинор (щегольство в тогдашней Москве). Мама не была амбидекстром — просто левшой, как и я. Левшой, наученной письму правой в советской школе двадцатых.</p>\n<p>До школы я и не пытался что-то делать правой. Зачем? Ведь у меня есть чудесная левая, которой я начал рисовать раньше, чем научился говорить. Мои способности были настолько очевидны, что даже папа-правша пытался к ним пристроиться, говоря, что он держит нож левой.</p>\n<p>Мама никогда не говорила о том, что в школе придется писать правой. У нее была золотая медаль за школу. Видимо, обучение письму нерабочей рукой она считала такой же полезной фичей, как запись в паспорте старшего брата «русский» в графе «национальнось». Себя мама называла латышкой. Папа, как вы догадались по фамилии Гордон, был евреем.</p>\n<p>А теперь представьте себе, что вам надо научиться танцевать на пуантах, когда вы не умеете ходить.</p>\n<p>Моё счастье, что первая учительница — Мария Михайловна Глинкова — была настоящей, а не только заслуженной, учительницей рсфср. Она разрешила мне рисовать левой, а писать научила правой максимально бережно, не сломав психику. Всю школу я писал только правой, а всю остальную жизнь — левой. Могу обеими сразу в разные стороны. Чрезвычайно полезная опция.</p>\n<p>Так вот. Обучение письму в советской школе на самом деле было обучением каллиграфии по максимально неудобным образцам. Советские прописи — испорченная рейсфедером копия дореволюционных. Продолжая метафору с балетом: плясать учили на пуантах, но строевым шагом в кирзовых сапогах.</p>\n<p>Для чего нужно письмо? Чтобы фиксировать и передавать смысл. Для коммуникации с другими людьми и с самим собой, а также для складирования знаний.</p>\n<p>Для чего нужно учить писать по прописям? Зачем чистописать? Видимо, чтобы зафиксировать моторно и визуально некий стандартный вид букв. Научить не графемам, но одному шрифту. Это удобно для учителя, но полезно ли для ученика?</p>\n<p>Почерк — точный слепок характера. Обучаясь одинаковым буквам, школьники проходят, прежде всего, науку смирения, подавления индивидуальных качеств.</p>\n<p>Со мной номер не прошел. Не потому, что я не старался выписывать буквы «с нажимом», а потому, что правая рука куцелапила и не слушалась. Добрая Марья Михайловна ставила за чистописание четвёрки, но прописи так и остались недостижимым совершенством.</p>\n<p>Кстати, а почему образцы прописей не были написаны от руки? Ведь до тридцатых они были только рукописными. Потому, что к шестидесятым годам 20 века в ссср исчезли каллиграфы. Красивый почерк больше никому не был нужен. Документы набирались на пишущих машинках. Инструментом письма, вместо пера, стала авторучка, а потом и шариковая ручка. Смена перьевых ручек на шариковые произошла как раз когда я учился в школе. Обучение письму ручкой с пером, которое надо макать в чернила, стало абсолютным анахронизмом. Но нас учили именно так.</p>\n<p>Почерк «с нажимом», промокашки и перочистки, руки в чернилах, тетрадки, густо линованные диагоналями для поддержания единого наклона. Во втором классе была разрешена авторучка — но только с открытым пером. В третьем разрешили с полузакрытым. Все эти манипуляции дико мешали письму, зато отлично пачкали руки.</p>\n<p>Еще раз: вместо того, чтобы учить думать на письме, нас учили тянуть носок и осваивать третью позицию. С пятого (или с шестого? в общем, как только сняли запреты) класса все поголовно перешли на шариковые ручки.</p>\n<p>Письмо правой мешало мне всю школу. Я писал медленнее других, поэтому не успевал на диктантах и вообще везде, где требовалась скорость записи. А если начинал спешить, почерк, и без того не идеальный, портился окончательно.</p>\n<p>А вот если б я учился писать левой, мне бы не пришлось поворачивать тетрадку наискось и потом выворачивать шею, чтоб контролировать написанное. Еще в начале 20 века был разработан стоячий курсив, удобный для левшей. Он и читается лучше, и тетрадку крутить не надо.</p>\n<p>Единственная польза, которую я получил от обучения письму нерабочей рукой — неизлечимый комплекс перед недостижимой красотой букв. Написать или нарисовать приятную глазу букву никогда не получится — можно даже не пытаться.</p>\n<p>Именно это убеждение — в сочетании с изрядным упрямством — и превратило троешника-левшу в самозванца, рисующего буквы десятками тысяч. Все они никуда не годятся, но всё же стали немного аккуратнее, чем в первом классе.</p>", "figs": [["img/14/14-001.jpg", "14-001", "<p>То самое пособие, но издание 1973 года.<br>Уже все перешли на шариковые ручки, а в первом классе всё учат правильно нажимать.</p><p>Посмотрите внимательно: буквы не написаны, а начерчены.</p>", 1.0], ["img/14/14-002.jpg", "14-002", "<p>Прямое письмо. Образцы из «Пособия по каллиграфии и канцелярскому письму», Петроград, 1916.</p><p>Буквы написаны от руки.<br>Левше так писать намного удобнее</p>", 1.0], ["img/14/14-003.jpg", "14-003", "<p>Написано на айпаде в программе Скетчес Про</p>", 1.0]], "research": null}, {"intro": false, "num": "40", "title": "Каталог ручных и машинных шрифтов 1966 года как зеркало советской деградации", "ptitle": "Каталог ручных и машинных шрифтов 1966 года как зеркало советской деградации", "subtitle": "", "date": "25 июня 2026 г.", "perm": "https://www.facebook.com/story.php?story_fbid=27897516943189053&id=100000723643455", "slug": "", "html": "<p><span class=\"dc\">Е</span>сли вы помните, я как-то разбирал афишу знаменитых футуристов, напечатанную в Тифлисе в 1913 году (рис. 2). На ней было использовано пятьдесят шрифтов. Тифлис, конечно, не маленький и культурный город, но в типографическом смысле не Питер и не Москва. Тем более, что грузины никогда не переходили на кириллицу. Так вот: пятьдесят шрифтов — это много не только для рекламной бумажки, отпечатанной на южной границе империи. Это больше того, чем могла похвастаться спустя полвека вся полиграфическая промышленность «самой читающей страны мира».</p>\n<p>Шрифтов в Российской империи было полно. Большая часть поставлялась Бертгольдом и Леманом из Германии, но хватало и собственных словолитен. В любом уездном городе не бедный обыватель мог заказать себе приличную визитную карточку или приглашение на свадьбу (рис. 3) на хорошей бумаге, каллиграфическим шрифтом, можно с виньетками и рамочками.</p>\n<p>Потом настал 1914 год, германское снабжение прервалось.<br>Потом случился октябрь 1917, типографии экспроприировали.<br>Потом, после НЭПа, в 1930 году, собрались умные люди и стали с умным видом отбирать подходящие шрифты, а неподходящие переплавили. Тогда же составили умные планы по развитию наилучших шрифтов для нужд полиграфического производства.</p>\n<p>Прошло тридцать шесть лет. Профильное издательство «Книга» выпустило «Каталог ручных и машинных шрифтов» (рис. 1), в котором собралось всё, что недопереплавили, и поверх то, что сумели воплотить из запланированного.</p>\n<p>Это был, фактически, итоговый документ развития шрифтовой индустрии для высокой печати в ссср. В то время типографии стали переходить на офсет и фотонабор, и случилось на коле мочало, начинай сначала. Об этой печальной истории будет особая глава.</p>\n<p>Конечно, в каталог 1966 года попало не всё. В нём нет газетных шрифтов — некоторые советские газеты, например, «Труд» (рис. 4) или «Известия», имели собственные комплекты шрифтов. Нет в каталоге и первой в ссср узкоспециализированной суперсемьи: Кудряшовской энциклопедической гарнитуры. Отсутствуют и крупнокегельные деревянные афишные шрифты — отдельная тема для разговора.</p>\n<p>Но всё остальное есть.</p>\n<p>Ассортимент умещается на одной странице Содержания (рис. 5). Давайте его проанализируем.</p>\n<p>РУЧНЫЕ ШРИФТЫ<br>1 Литературная · 2 Банниковская · 3 Табличная · 4 Обыкновенная · 5 Обыкновенная новая · 6 Елизаветинская · 7 Академическая · 8 Школьная · 9 Журнальная · 10 Новая газетная · 11 «Балтика» · 12 «Коррина» · 13 Бажановская · 14 Брусковая газетная · 15 «Реклама» · 16 Рубленая · 17 Журнальная рубленая · 18 Древняя · 19 Плакатная · 20 «Пальмира» · 21 Машинописная · 22 Каллиграфическая · 23 Букварная · 24 Шрифт 1812 года · 25 Телингатера · 26 Гарнитура № 23 · 27 Гарнитура № 1 (Ревильон) · 28 Гарнитура № 2 (англ. жирн.) · 29 Гарнитура № 3 (англ. узк.) · 30 Гарнитура № 5 (англ. узк.) · 31 Гарнитура № 6 (египетск. жирн.) · 32 Гарнитура № 7 (египетск. узк.) · 33 Гарнитура № 8 (египетск. узк. жирн.) · 34 Оттененные шрифты · Греческий · Математические и химические знаки · Дроби, почтовые и картографические знаки · Разные знаки · Бордюры · Орнаменты</p>\n<p>МАШИННЫЕ ШРИФТЫ<br>Буквоотливной набор: 1 Литературная · 5 Обыкновенная новая · 8 Школьная · Греческая · Математические знаки · Дроби<br>Строкоотливной набор: 1 Литературная · 35 Обыкновенная узкая · 5 Обыкновенная новая · 7 Академическая · 6 Елизаветинская · 8 Школьная · 2 Банниковская · 10 Новая газетная · 36 Журнальная · 17 Журнальная рубленая · 11 «Балтика» · 37 Малановская · 38 Пискаревская · 39 «Баченас» · 40 Северная · 41 «Бодони» · Греческая · «Насхи-Асуана» · Дроби составные и цельные · Математические знаки · Газетные украшения<br>Строкоотливной крупнокегельный набор: 1 Литературная · 10 Новая газетная · 42 Газетная рубленая · 14 Брусковая газетная · 17 Журнальная рубленая · 43 Журнальная рубленая оттененная · 44 Журнальная рубленая декоративная · 13 Бажановская · 2 Банниковская · 5 Обыкновенная новая · 11 «Балтика» · 8 Школьная · 45 Рукописная Жихарева · 46 Кузаняна · 47 Телингатера · 48 Рерберга · 49 Рукописная Кулькова и Сергеевой</p>\n<p>Что значат значки: сделано до 1917 (16); сделано после 1917 (28); сделано до 1917, а после 1917 переназвано и обновлено (5); советские переработки западных образцов (4); авторские (10).</p>\n<p>Кириллических шрифтов обнаружено 49. Из них 17 досоветских и 27 советских (если я не просчитался. Ну — примерно так).</p>\n<p>Состав гарнитур обычно не больше трех начертаний: регулярное, курсив, полужирное. Расширения (светлое, узкое, широкое начертания) имеют только старые шрифты вроде Литературной и Обыкновенной гарнитуры.</p>\n<p>Авторские советские шрифты часто не имеют строчных (гарнитуры Телингатера и Рерберга, прямое начертание Бажановской).</p>\n<p>Хорошо это или плохо? Много или мало?</p>\n<p>Давайте сравним. Например, с каталогом кириллических шрифтов фирмы Berthold 1912 года. Это немецкое издание, гораздо более скромное, чем русский каталог Бертгольда. Russische Griechische, Hebräische und Orientalische Schriften (рис. 6). 68 вариантов кириллического шрифта плюс один допетровский.</p>\n<p>Да, многие из них — модные шрифты модерн, которые в ссср ушли в переплавку. Но и среди советских авторских шрифтов большинство составляют декоративные или узкопрофильные. А если представить, что Бертгольд остался бы все эти 50 лет главным поставщиком букв в ссср, то резонно предположить, что ассортимент сильно расширился бы.</p>\n<p>Итак: Berthold &amp; Bauer в 1912 году предлагали потребителям кириллицы больше возможностей, чем все словолитни ссср в 1966. А ведь кириллица была для немецкого концерна важной, но не основной продукцией.</p>\n<p>Но не Бертгольдом единым. Были и другие немецкие богатыри в земле русской. Непримиримый конкурент Бертгольда — О. И. Леман (поставщик двора ЕИВ, рис. 7) еще в 1902 году предлагал 120 кириллических шрифтов, среди которых два машинописных против одного в советском каталоге.</p>\n<p>Две крупных частных словолитни предлагали 188 шрифтов. Весь ссср через полвека сподобился на 49. Если это не деградация, то что?</p>\n<p>Каталоги должны демонстрировать как сами шрифты, так и возможности полиграфии. Уж это за полвека должно было улететь в стратосферу? Сравним.</p>\n<p>Чтобы сравнить было проще, выбрал практически один и тот же шрифт: Латинский Бертгольда (рис. 8), он же, переименованный в ссср в Литературную гарнитуру (рис. 10), и Ренату Лемана (рис. 9), похожую на них настолько, что может считаться версией Латинской. Кегль на трех скриншотах один — 10 пунктов. Все шрифты — в версии для ручного набора.</p>\n<p>Советский скриншот виден сразу: бумага ярко-желтая и явно неровная. На его фоне Бертгольд с Леманом смотрятся новыми изданиями, а ведь они на 50 и 60 лет старше.</p>\n<p>Печать советская тоже как будто сделана на пишмашинке: буквы то светлее, то плотнее, с сильным растискиванием.</p>\n<p>Можно возразить: Бертгольд и Леман печатали рекламные каталоги, а издательство «Книга» — справочник для технических редакторов. Но тут же напрашивается контрдовод: а почему узкоспециальное профессиональное издание в профильном издательстве напечатано на газетной бумаге и с газетным же качеством?</p>\n<div class=\"orn\" role=\"separator\"><b></b></div>\n<p>Этот советский каталог — единственная книга по шрифту, которую я взял из Москвы на холм в Абруццо. Сказать, что он красивый, никак не выйдет. Найти в нём нечто новое невозможно. Больше всего он похож на лавку старьёвщика — тем и ценен. По сути дела это признание советской шрифтовой культуры в полном провале всех научно обоснованных планов и рациональных надежд.</p>\n<p>А еще этот каталог — самое позднее собрание Бертгольда и Лемана, к которому добавились никак не систематизированные произведения нескольких талантливых авторов: Банниковой, Телингатера, Кузаняна, Рерберга, и еще кое-что вроде Жихаревской или Бажановской.</p>\n<p>Каталоги Бертгольда и Лемана — бодрые зазывы накатывающей новой культуры, обещающие процветание и буржуазный избыток.</p>\n<p>Каталог ручных и машинных шрифтов — жизни античной цветы запоздалые посреди космической державы с туалетами во дворе и фалангами хрущевок, решающими неразрешимый квартирный вопрос.</p>\n<p>Когда я говорю о деградации, то имею в виду не полиграфическое производство — оно в ссср только расширялось — но типографику и качество печати. Гигантскими тиражами с убогой шрифтовой палитрой на плохой бумаге можно обогнать весь мир — и через десять лет повторить круг, собрав и сдав в переработку всю эту макулатуру.</p>\n<h3>Конклюзия</h3>\n<p>Дисбаланс многотиражной полиграфии и убогой типографики — следствие того, о чем я писал в первой главе этой книги. Типографика расцветает, когда становится рыночной услугой. Это правило работало при Альде Мануции, работает и сейчас.</p>\n<p>Как только до словолитного дела и печатного станка дорывается власть — неважно, римкого Папы, московского царя или красного комиссара — начинают гореть книги и печатные дворы, составляются цензурные списки, а высокая шрифтовая культура превращается бессмысленную свинцовую массу.</p>\n<p class=\"ps\"><span class=\"pslabel\">PS</span> Однако 1966 год не вершина деградации типографики, начавшейся в 1917. Впереди фотонабор и комплекс «Каскад», о котором в другой раз.</p>\n<p class=\"ps\"><span class=\"pslabel\">PPS</span> Листая советский каталог, я понял, что должен написать про буквы 20 века. Вот и таскаю его за собой по европам.</p>\n<p>А еще я его время от времени сканирую, чтобы произвести постпостмодернистскую ревизию. Из узкого полужирного начертания Литературной вышел ПалеоЛит. Из жирной Рубленой (бывшей Рубленой Лемана) — богатый зверями dAndy. Из гарнитуры Древняя от Бертгольда — вариативный Фагот, умеющий корчить рожи. Все шрифтозаготовки сканировались тщательно, чтобы сохранить растискивания и побитость, накопившиеся за полвека на советской госслужбе. (Картинки прилагаются)</p>", "figs": [["img/15/15-001.jpg", "15-001", "<p>Книга, о которой идет речь в этой главе.<br>Фото сделано только что в моем кабинете на холме.</p>", 1.0], ["img/15/15-002.jpg", "15-002", "<p>Афиша знаменитых футуристов. Тифлис, 1913.<br>50 начертаний наборных шрифтов</p>", 1.0], ["img/15/15-003.jpg", "15-003", "<p>Вверху: Патутковы Сергей Алексеевич и Анна Алексеевна, приглашение на бракосочетание дочери, Москва, 30 апреля 1903 года.<br>Наборное приглашение в размер визитной карточки.</p><p>Внизу: (лицо и оборот) Московский Дом Союзов ВЦСПС, приглашение на утренник, посвященный 300-летию воссоединения Украины с Россией, 7 февраля 1954 года.<br>Наборное приглашение в размер советской корочки.</p><p>Взято отсюда: https://www.hisdoc.ru/invitations</p><p>Судя по чину жениха (штабс-капитан) тесть мог быть и генералом. Но это просто один генерал приглашает на свадьбу дочери.</p><p>Во втором случае приглашает госконтора на уровне министерства. Спустя 51 год. И краски не жалеет.<br>А вот с качеством печати проблемки. И шрифты на обороте все от Бертгольда, 1903 года.</p><p>Особенно же умиляет линеечка, под которой номер заказа и выходные данные, абсолютно необходимые на такой эфимере. У генеральской визитки, как писал поэт, «нихрена на обороте». Показать меньше</p>", 1.0], ["img/15/15-004.jpg", "15-004", "<b>Николай Кудряшов, Зоя Масленникова. Трудовская гарнитура. 1954-1956.</b><p>Системный подход к шрифту — следствие точно поставленной задачи.</p><p>Здесь видно, что типографика и культура вообще готовы принять настоящие сложносоставные шрифтовые семьи. Но их нет в каталоге. Почему б? Показать меньше</p>", 1.0], ["img/15/15-005.jpg", "15-005", "<p>Каталог ручных и машинных шрифтов. Содержание Показать меньше</p>", 1.0], ["img/15/15-006.jpg", "15-006", "<p>Berthold &amp; Bauer. Титул каталога русских, греческих и еврейских шрифтов. Показать меньше</p>", 1.0], ["img/15/15-007.jpg", "15-007", "<p>И. О. Леман. Переплет каталога 1902 года Показать меньше</p>", 1.0], ["img/15/15-008.jpg", "15-008", "<p>Berthold. Lateinisch (Латинская гарнитура). Прямое регулярное начертание, 10 пт Показать меньше</p>", 1.0], ["img/15/15-009.jpg", "15-009", "<b>Леман. Рената. Прямое регулярное начертание, 10 пт.</b><p>Съемка с руки, поэтому не очень резкая. Но равномерность натиска отлично видна Показать меньше</p>", 1.0], ["img/15/15-010.jpg", "15-010", "<p>Литературная гарнитура, 10 пт.<br>Чтобы оценить качество печати и сохранность литер, посмотрите на четвертую строку, начиная со слова «ширилась». Такое чувство, что каждую литеру впечатывали отдельно. Показать меньше</p>", 1.0], ["img/15/15-011.jpg", "15-011", "<p>Как создавались советские шрифты.<br>Слева шрифт Реклама Курсив от Бертгольд. Справа шрифт Реклама от советской промышленности Показать меньше</p>", 1.0], ["img/15/15-012.jpg", "15-012", "<p>Не только качество печати, но и форма букв со временем должна становиться точнее, а набор ровнее.</p><p>Однако это происходит только когда идет прогресс.</p><p>Слева курсив Регина от Бертгольда. Справа гарнитура Жихаревская, ссср Показать меньше</p>", 1.0], ["img/15/15-013.jpg", "15-013", "<p>Бажановская — очень странная гарнитура.<br>Во-первых, в прямом начертании нет строчных.<br>Зато есть очень странная Д (спесимен слева).<br>Ну, а с таким строчным курсивом сейчас бы не допустили до вступительных экзаменов Показать меньше</p>", 1.0], ["img/15/15-014.jpg", "15-014", "<p>Полностью вымершая флора. Настительный орнамент «Стилизованная водяная лилия» из каталога Бертгольда. Серия 603. Просто число Показать меньше</p>", 1.0], ["img/15/15-015.jpg", "15-015", "<p>Каталог Лемана. Орнамент 31<br>Обратите внимание: орнаменты выпускаются большими комплектами, позволяющими построить множество вариантов рамок каждый. Показать меньше</p>", 1.0], ["img/15/15-016.jpg", "15-016", "<p>Орнаменты рсфср. Прошло 60 лет Показать меньше</p>", 1.0], ["img/15/15-017.jpg", "15-017", "<p>Шрифт ПалеоЛит собран из узкого полужирного начертания Литературной гарнитуры с добавлением альтернативных знаков, капителей, лигатур, поддержки расширенной латиницы, с добавкой допертровского сета.</p><p>Орнаменты и политипажи в основном взяты из советского каталога, а кое-что дорисовано Показать меньше</p>", 1.0], ["img/15/15-018.jpg", "15-018", "<p>Шрифт дЭнди — дерриват жирного начертания Рубленой гарнитуры Лемана с добавкой альтернейтов (например, сет с открытой апертурой), орнаментов, политипажей и крупной зверюжины моего производства Показать меньше</p>", 1.0], ["img/15/15-019.jpg", "15-019", "<p>Шрифт Фагот — аккуратно сосканированная Древняя гарнитура, сложными перемещениями точек превращенная в глумливую вариативную физиономию Показать меньше</p>", 1.0]], "research": null}, {"intro": false, "num": "41", "title": "Случай Шварцмана", "ptitle": "Случай Шварцмана", "subtitle": "", "date": "18 июля 2026 г.", "perm": "https://www.facebook.com/100000723643455/posts/28155623924045019/", "slug": "", "html": "<p><span class=\"dc\">М</span>ы порываем с сухим, заученным дизайном, геометрическими комбинациями, нивелирующими своеобычное, неповторимо индивидуальное, порываем с иллюстративной ложнозначительной позой, с назойливой тематичностью, не свойственной структуре знака.</p>\n<p>Мы новыми трансформациями спонтанно воплощаем извечную мечту о магическом знаке, напряженно ищем полноты означенности, высокой знаковой независимости, благого молчания иератического тавра.</p>\n<h3>Главный художник графического сектора СХКБ-Легпром Михаил Шварцман</h3>\n<p>Эпиграф к этой главе — классический манифест художника-модерниста, создающего очередной изм. В нулевые-двадцатые годы прошлого века такие тексты публиковались к каждой выставке. Однако этот манифест особенный.</p>\n<p>Во-первых, он опоздал на полвека. Он был написан в конце шестидесятых или в начале семидесятых.</p>\n<p>Во-вторых, его автор не буйный авангардист в желтой кофте, а «Главный художник графического сектора СХКБ-Легпром». Должностное лицо в советской конторе эпохи раннего застоя.</p>\n<p>Если вы внимательно читаете мою книгу, то уже поняли, что речь в ней идет о небольшой, провинциальной, но амбициозной культуре, использовавшей и развивавшей кириллицу.</p>\n<p>В этой культуре всего понемногу, а часто в одном экземпляре. Один крупный художник-типограф — Соломон Телингатер. Один большой гравёр, работавший с буквами — Владимир Фаворский. Один системный шрифтовой дизайнер — Николай Кудряшов (в паре с женой, Зоей Масленниковой). Одна контора, производившая наборные шрифты: Отдел наборных шрифтов ВНИИ Полиграфмаш. И так далее.</p>\n<p>Но Михаил Шварцман выпадает даже из этой тонкой цепочки. Он абсолютно уникален.</p>\n<p>(Начнем с того, что он не лезет в мою книгу. Он был противником использования букв в товарных знаках).</p>\n<p>Шварцман руководил дизайнерским отделом, но не был графическим дизайнером. Более того: он был воинствующим антидизайнером. Будучи при этом профессиональным издательским художником и отлично разбираясь в ремесле и технологиях.</p>\n<p>Если Михаила Шварцмана можно с кем-то сравнивать, то, наверное, с Павлом Филоновым. Оба, прежде всего, магические живописцы, считавшие себя проводниками высших сил и космических энергий. Шварцман называл себя иератом, а свои произведения — иературами. Он писал темперой на досках, как если бы был иконописцем. А может быть, он им и был.</p>\n<p>Всё это не имело ни малейшего отношения к образцовому советскому дому моды, которым должно было стать СХКБ Легпром.</p>\n<p>Не знаю, какие были соображения у создательницы этого странного предприятия модельера Аллы Левашовой, но иерату Шварцману удалось внутри обычной советской конторы создать нечто вроде средневековой боттеги с «удалёнкой» (такого слова еще не было) и двумя присутственными днями, когда отдел собирался и обсуждал эскизы.</p>\n<p>За всё это прилично платили, а продукцию (товарные знаки) спускали подведомственным швейным и ткацким фабрикам примерно как папа рассылал свои буллы епископам. Мы сформулировали на горнем престоле — а вы принимайте и приспосабливайте к своей юдольной реальности.</p>\n<p>Товарный знак, по идее, должен быть первым идентификатором бренда и центральной фигурой фирменного стиля. Он должен нести идею бренда, соотноситься с продукцией, быть удобным в воспроизведении, работать в связке с логотипом и прочей брендирующей типографикой. Наконец, он должен нести фирменную цветовую палитру.</p>\n<p>Но только если это не знак от Шварцмана.</p>\n<p>Давайте вернемся к эпиграфу. «…спонтанно воплощаем извечную мечту о магическом знаке, напряженно ищем полноты означенности, высокой знаковой независимости, благого молчания иератического тавра». Опаньки.</p>\n<p>СХКБ Легпром выпускало Иератические Тавро. Не знаки, но Знаки. В советском союзе, с конца шестидесятых по середину восьмидесятых. Сравнить это можно с выходом в ссср «Соляриса» и «Сталкера».</p>\n<p>Шварцман не любил буквы в знаках, отчасти справедливо считая, что его художники не слишком сильны в типографике. Поэтому в отделе господствовало рекле из тех небогатых касс, какие были в то время в ходу. Сам Шварцман имел легкую сильную руку и мог бы быть каллиграфом свободного стиля.</p>\n<p>К пластической идее и качеству контура в бюро относились трепетно. Шварцмановские знаки могут казаться наивными и даже смешными, но они крепко нарисованы.</p>\n<p>Еще одна характерная черта этих знаков — господствующая центральная композиция. Она тоже следствие серьезных намерений и благих тавромыслей, хотя настоящие тавро вполне могли быть асимметричными.</p>\n<p>Однако, при всей торжественности, есть в шварцмановских знаках некоторая весёлость. Из аналогий вдруг всплыли в памяти «Ёжик в тумане» и «Сказка сказок». Это та же лирически-ироническая маргинальная советская культура, легко возгоняющая себя до пафоса.</p>\n<p>Однажды где-то посередине восьмидесятых, мне, скромному художественному конструктору из отдела промграфики СХКБ Легмаш, пришла шальная мысль перебраться к Шварцману в Легпром. Собрал портфолио и поехал.</p>\n<p>В то время я
