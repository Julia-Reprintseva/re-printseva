я 1986 года (компиляция материала была завершена в 1985 году).<br>Оформлением конверта занимался художник А. Терехов. Автором самой фотографии музыкантов является фотограф А. Астафьев.</p><p>Помню этот трафаретный шрифт, он ходил в негативах. Откуда взялся — не знаю. Для 1985 года он довольно чистый, могло быть куда хуже.</p><p>Зато вся остальная типографика — с легким присвистом. Во-первых, МВ не какой-нибудь ВИА, а рок-группа рок-группа. Чтоб знали. А во-вторых — фантастическая латиница. Откуда ее такую выгребли — ума не приложу. Я почти такой же шрифт сделал для Esquire в 2008 году, но он базировался на английских уличных табличках 19 века</p>", 1.0], ["img/21/22-041.jpg", "22-041", "<p>ГуИ: обложка культового альбома «Радио Африка» рок-группы «Аквариум».<br>Альбом был записан и выпущен в самиздате (магнитиздате) в 1983 году. Официальное всесоюзное издание на виниловых пластинках от фирмы «Мелодия» вышло позже — в 1988 году.<br>Автор обложки: Ленинградский фотограф Андрей «Вилли» Усов. Идея и общая концепция оформления принадлежали музыкантам группы.</p><p>Дополнительные факты об обложке:</p><p>• Силуэт на фото: На лицевой стороне обложки запечатлён силуэт виолончелиста группы — Всеволода Гаккеля. Снимок был сделан на пустынном берегу Финского залива неподалёку от гостиницы «Репино».<br>• Иероглифы: Вертикальную надпись в рамке справа тушью вырисовывал синолог Сергей Пучков. Иероглифы (無線非洲) переводятся как «Беспроводная Африка», что является дословным переводом словосочетания «Радио Африка» (поскольку «радио» по-китайски буквально означает «без проводов»).</p><p>В этой обложке всё уместно: и пустотное фото, и китайская надпись, и даже кривоватая выклейная Гельветика в левом верхнем углу</p>", 1.0], ["img/21/22-042.jpg", "22-042", "<p>ГуИ: обложка шестого «естественного» альбома группы «Аквариум» под названием «Дети Декабря».<br>• Год выпуска: Альбом был записан во второй половине 1985 года и выпущен как магнитоальбом в январе 1986 года.<br>• Автор обложки: Фотографии и графическое оформление конверта выполнил легендарный ленинградский рок-фотограф и дизайнер группы Андрей «Вилли» Усов. На круговом зимнем снимке в центре запечатлены Борис Гребенщиков, Всеволод Гаккель и Александр Титов.</p><p>Это единственный здесь диск не «Мелодии». Настоящий андеграунд до последней буквы. Буквы не просто пиратские, но и крайне наивно поставленые. Два DD — не только закос под латиницу, но и трогательное неумение рисовать. И — перевернутые N, у которых срезы косых засечек смотрят не в ту сторону. Но самый смешной косяк — изображающий У игрек, зачем-то тоже перевернутый.</p>", 1.0], ["img/21/22-043.jpg", "22-043", "<p>Четыре лицензионных диска с обложками настоящего дизайнера. Более того, легенды отечественного дизайна Анатолия Гусева, многолетнего арт-дизайна «Коммерсанта», автора лучшего определения для крепкого дизайна: «неоскорбительно».</p><p>Слово ГуИ:<br>1. виниловая пластинка группы The Doors — «Зажги во мне огонь» (Light My Fire), которая является самым первым выпуском из знаменитой советской серии «Архив популярной музыки». Пластинка впервые вышла в 1988 году (позже допечатывалась вплоть до начала 1990-х годов).<br>2. обложка виниловой пластинки «Солнце моей жизни» (Sunshine of My Life) американского музыканта Стиви Уандера, выпущенной в СССР Всесоюзной фирмой грамзаписи «Мелодия» в рамках известной серии «Архив популярной музыки» (Выпуск 2). 1988 год.<br>3. виниловая пластинка «Игра с огнем» (Play With Fire) группы The Rolling Stones, выпущенная в СССР Всесоюзной фирмой грамзаписи «Мелодия». Альбом был впервые издан в 1988 году в рамках знаменитой серии «Архив популярной музыки» (Выпуск № 4). При составлении серии использовались архивные фотографии группы середины 1960-х годов<br>4. конверт виниловой пластинки группы «Лед Зеппелин» — «Лестница на небеса» (Led Zeppelin — Stairway to Heaven), выпущенной в СССР фирмой Всесоюзной студии грамзаписи «Мелодия» под шестым номером в культовой серии «Архив популярной музыки». Год выпуска: 1988 год (первый тираж и оформление копирайта звукозаписи датируются 1988 годом, допечатки тиражей на разных заводах продолжались также в 1989 и 1990 годах).</p><p>Оформлением конвертов для всей серии «Архив популярной музыки» занимался советский художник А. Гусев.</p><p>Оставим «советского художника» на совести ГуИ. Главную роль в типографике серии играет ITC Lubalin Graph, со странно наклоненной и подрезанной строчной е. Что интересно: это юникейс, но не болгарица. Только на одной из обложек появляется «болгарская» g вместо д.</p>", 1.0], ["img/21/22-044.jpg", "22-044", "<p>ГуИ: На изображении представлена обложка культового второго студийного альбома «Смерть на рейве» группы «Кирпичи».<br>• Год выпуска: Альбом был выпущен в 1999 году на лейбле Gala Records.<br>• Автор оформления: Официальным автором оформления альбома является Глеб Трушкин.</p><p>А впрочем, вот еще немелодия. Отчаянно корявый, настоящий заднедворовый леттеринг. А ведь это уже точно не руками рисовано. Естественно, болгарица. И опять тильда в виде кратки над й</p><p>Нам всем дана свобода<br>Свобода без конца<br>Без выхода и входа<br>Без матери-отца<br>Посередине Руси<br>За весь прошедший век<br>И я ее страшуся<br>Как честный человек</p><p>ДАП</p>", 1.0], ["img/21/22-045.jpg", "22-045", "<b>ГуИ: 1972 год. Художник неизвестен</b><p>Сальери:<br>Ты мог остановиться у трактира<br>И слушать скрипача слепого?!<br>Ты, Моцарт, недостоин сам себя.</p><p>Пушкин, «Моцарт и Сальери», цитпопам.</p><p>Перебирая и жестоко критикуя изделия апрелевских дизайнеров, чувствую себя холоднопалым сальерием, души не имеющим.</p><p>Однако кто-то должен же сказать правду: советская визуальная массовая культура застойного времени находилась на таком низком уровне, что даже с сегодняшнего полусреднего надо сильно приглядываться, что там на дне копошится.</p><p>Вот, например, серийная обложка альбомов Моцарта 1972 года. На ней довольно пристойная рисованная каллиграфия (только что точка мелковата и места на финальный вензель не хватило, отчего под конец Моцарта буквы теснятся, как в трамвае в восемь утра).</p><p>Но ниже — попытка простой типографики шрифтом Таймс — почему-то одними заглавными, без знаков № и с чужими цифрами. Мелочь, скажете? Представьте: вы берётесь за дверную ручку, а из нее торчит острый конец шурупа. Мелочь, но надо бежать за пластырем.</p><p>Я вырос в этой культуре, знаю, как она скручивалась из конфетных фантиков и цветных стёклышек — мне и выводить ее под свет фонарика</p>", 1.0]], "research": null}];

function paginate(htmlStr, header){

  const tmp = document.createElement('div'); tmp.innerHTML = htmlStr;
  const blocks = [...tmp.children];
  const pages = [];
const blank = () => { if (!PORTRAIT) pages.push(el('empty','')); }; let cur = [];
  const render = arr => { mp.innerHTML = '<div class="rh">'+header+'</div>' + arr.map(b=>b.outerHTML).join(''); };
  const pushPage = () => { if(cur.length){ pages.push(cur.map(b=>b.outerHTML).join('')); cur = []; } };
  for (const b of blocks){
    cur.push(b); render(cur);
    if (fits()) continue;
    cur.pop();
    if (b.tagName === 'P' && b.textContent.split(' ').length > 40){
      const words = b.textContent.split(' '); let lo = 0, hi = words.length, best = 0;
      const mk = (n) => { const p = document.createElement('p'); p.textContent = words.slice(0,n).join(' '); return p; };
      while (lo < hi){ const mid = (lo+hi+1)>>1; render([...cur, mk(mid)]); if (fits()){ best = mid; lo = mid; } else hi = mid-1; }
      if (best > 15){ cur.push(mk(best)); pushPage(); const rest = document.createElement('p'); rest.textContent = words.slice(best).join(' '); blocks.splice(blocks.indexOf(b)+1, 0, rest); continue; }
    }
    pushPage(); cur.push(b); render(cur);
    if (!fits()){ pushPage(); }
  }
  pushPage();
  return pages;
}

pages.forEach(p=>{ const b=document.createElement('i'); b.className='bm'; p.appendChild(b); const n=document.createElement('i'); n.className='nt'; n.textContent='✎ заметка'; p.appendChild(n); });
document.querySelectorAll('#book .page a[href]').forEach(a => ['mousedown','mouseup','pointerdown','pointerup'].forEach(ev => a.addEventListener(ev, e => e.stopPropagation())));
const pf = new St.PageFlip(book, { width: PW, height: PH, size: 'fixed', showCover: true, maxShadowOpacity: .35, mobileScrollSupport: false, usePortrait: PORTRAIT });
pf.loadFromHTML(document.querySelectorAll('#book .page'));
const pos = document.getElementById('pos');
const keyOf = i => pages[i] && (pages[i].dataset.key || ('p|' + i));
const findByKey = k => { const i = pages.findIndex(p => p.dataset.key === k); return i >= 0 ? i : (k.startsWith('p|') ? Math.min(+k.slice(2), pages.length-1) : 0); };
let marks = LS('marks') || {}; let notes = LS('notes') || {};
const paint = () => pages.forEach(p => { const k = p.dataset.key; p.classList.toggle('marked', !!(k && marks[k])); p.classList.toggle('noted', !!(k && notes[k])); });
const upd = () => { const i = pf.getCurrentPageIndex(); pos.textContent = (i+1) + ' / ' + pages.length; document.querySelector('#progress i').style.width = (100*(i+1)/pages.length)+'%'; SV('last', keyOf(i)); const k=keyOf(i); document.getElementById('b-mark').classList.toggle('on', !!marks[k]); document.getElementById('b-mark').textContent = (marks[k]?'★':'☆')+' закладка'; };
pf.on('flip', upd); paint(); upd();
const hp = (location.hash.match(/^#p=(\d+)/) || [])[1];   // #p=N — открыть на странице N
const last = LS('last'); if (hp) setTimeout(()=>pf.turnToPage(Math.min(+hp-1, pages.length-1)), 300); else if (last && last !== 'p|0') setTimeout(()=>pf.turnToPage(findByKey(last)), 300);
document.getElementById('home').onclick = e => { e.preventDefault(); pf.turnToPage(0); };
document.getElementById('b-toc').onclick = () => pf.turnToPage(pages.indexOf(tocPage));
const mm = document.getElementById('mineMenu');
mm.innerHTML = DATA.map((ch,i) => ch.research ? `<a href="#" data-p="${starts[i]}"><span>${ch.num}</span>${ch.ptitle}</a>` : '').join('');
document.getElementById('b-mine').onclick = e => { e.stopPropagation(); mm.classList.toggle('open'); };
mm.addEventListener('click', e => { const a = e.target.closest('a[data-p]'); if (a){ e.preventDefault(); pf.turnToPage(+a.dataset.p); mm.classList.remove('open'); } });
document.addEventListener('click', () => mm.classList.remove('open'));
document.getElementById('b-mark').onclick = () => { const k = keyOf(pf.getCurrentPageIndex()); if (!k) return; if (marks[k]) delete marks[k]; else marks[k] = { ch: pages[pf.getCurrentPageIndex()].dataset.ch || '', q: pages[pf.getCurrentPageIndex()].textContent.replace(/\s+/g,' ').trim().slice(0,90), t: Date.now() }; SV('marks', marks); paint(); upd(); };
const nb = document.getElementById('noteBox'), nt = document.getElementById('noteText'); let noteKey = null;
document.getElementById('b-note').onclick = () => { noteKey = keyOf(pf.getCurrentPageIndex()); nt.value = (notes[noteKey]||{}).n || ''; document.getElementById('noteTitle').textContent = 'Заметка · стр. ' + (pf.getCurrentPageIndex()+1); nb.classList.add('open'); nt.focus(); };
document.getElementById('n-close').onclick = () => nb.classList.remove('open');
document.getElementById('n-save').onclick = () => { if (nt.value.trim()) notes[noteKey] = { ch: pages[pf.getCurrentPageIndex()].dataset.ch || '', q: pages[pf.getCurrentPageIndex()].textContent.replace(/\s+/g,' ').trim().slice(0,90), n: nt.value.trim(), t: Date.now() }; else delete notes[noteKey]; SV('notes', notes); paint(); nb.classList.remove('open'); };
document.getElementById('n-del').onclick = () => { delete notes[noteKey]; SV('notes', notes); paint(); nb.classList.remove('open'); };
const panel = document.getElementById('panel'), plist = document.getElementById('plist');
const chTitle = n => { const c = DATA.find(x => x.num === n); return c ? ((c.intro ? 'Вступление' : 'Глава ' + n) + ' · ' + c.ptitle) : ''; };
const renderList = () => { const items = []; for (const [k,v] of Object.entries(marks)) items.push({k, kind:'★ закладка', ...v}); for (const [k,v] of Object.entries(notes)) items.push({k, kind:'✎ заметка', ...v}); items.sort((a,b)=>findByKey(a.k)-findByKey(b.k)); plist.innerHTML = items.length ? items.map(it => `<div class="it" data-k="${it.k}"><small>${it.kind} · стр. ${findByKey(it.k)+1} · ${chTitle(it.ch)}</small><span class="q">${it.q}…</span>${it.n?`<div class="n">${it.n.replace(/</g,'&lt;')}</div>`:''}</div>`).join('') : '<div class="empty">Пока пусто. Поставьте закладку ☆ или напишите заметку ✎ на любой странице.</div>'; };
document.getElementById('b-list').onclick = () => { renderList(); panel.classList.toggle('open'); };
document.getElementById('b-close').onclick = () => panel.classList.remove('open');
plist.addEventListener('click', e => { const it = e.target.closest('.it'); if (it){ pf.turnToPage(findByKey(it.dataset.k)); panel.classList.remove('open'); } });
document.getElementById('b-export').onclick = () => { const items = []; for (const [k,v] of Object.entries(marks)) items.push(`★ стр. ${findByKey(k)+1} · ${chTitle(v.ch)}\n   «${v.q}…»`); for (const [k,v] of Object.entries(notes)) items.push(`✎ стр. ${findByKey(k)+1} · ${chTitle(v.ch)}\n   «${v.q}…»\n   ${v.n}`); const blob = new Blob(['Буквы XX века — закладки и заметки\n\n' + items.join('\n\n')], {type:'text/plain'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Буквы XX века — заметки.txt'; a.click(); };
const q = document.getElementById('q');
const doSearch = () => { const term = q.value.trim().toLowerCase(); if (term.length < 2) return; const hits = []; pages.forEach((p,i) => { if (!p.dataset.key) return; const t = p.textContent.replace(/\s+/g,' '); const pos = t.toLowerCase().indexOf(term); if (pos >= 0) hits.push({i, ch: p.dataset.ch, snip: t.slice(Math.max(0,pos-60), pos+80)}); }); document.querySelector('#panel .ph b').textContent = 'Поиск: «' + q.value.trim() + '» — ' + hits.length; plist.innerHTML = hits.length ? hits.map(h => `<div class="it" data-p="${h.i}"><small>стр. ${h.i+1} · ${chTitle(h.ch)}</small>…${h.snip.replace(/</g,'&lt;').replace(new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'), m=>'<mark>'+m+'</mark>')}…</div>`).join('') : '<div class="empty">Ничего не найдено.</div>'; panel.classList.add('open'); };
q.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); if (e.key === 'Escape'){ q.value=''; panel.classList.remove('open'); } });
plist.addEventListener('click', e => { const it = e.target.closest('.it[data-p]'); if (it){ pf.turnToPage(+it.dataset.p); panel.classList.remove('open'); } });
document.getElementById('b-list').addEventListener('click', () => { document.querySelector('#panel .ph b').textContent = 'Закладки и заметки'; });
document.getElementById('b-full').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{}); };
document.addEventListener('fullscreenchange', () => { const k = keyOf(pf.getCurrentPageIndex()); SV('last', k); setTimeout(() => location.reload(), 150); });
const refs = d => { const k = keyOf(pf.getCurrentPageIndex()); SV('fs', d); SV('last', k); location.reload(); };
document.getElementById('b-minus').onclick = () => refs(Math.max(-4, FSB-1));
document.getElementById('b-plus').onclick = () => refs(Math.min(6, FSB+1));
document.getElementById('b-theme').onclick = () => { const order = ['', 'sepia', 'night']; const cur = order.indexOf(THEME); const nxt = order[(cur+1)%order.length]; SV('theme', nxt); location.reload(); };
document.getElementById('prev').onclick = () => pf.flipPrev();
document.getElementById('next').onclick = () => pf.flipNext();
document.addEventListener('keydown', e => { if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return; if (e.key === 'ArrowRight') pf.flipNext(); if (e.key === 'ArrowLeft') pf.flipPrev(); });
// ссылки оглавления: StPageFlip сам ловит клики по странице как перелистывание — глушим его события и переходим напрямую
tocPages.forEach(tp => tp.querySelectorAll('a[data-p]').forEach(a => {
  ['mousedown','mouseup','touchstart','touchend','pointerdown','pointerup'].forEach(ev => a.addEventListener(ev, e => e.stopPropagation()));
  a.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); pf.turnToPage(+a.dataset.p); });
}));
</script>
</body>
</html>
