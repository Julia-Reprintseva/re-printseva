был одержим графическим дизайном и фирменными стилями. И сам уже делал один из первых в ссср системных стилей для куста фабрик, фасующих муку и крупы. Цельность, воспроизводимость, системная типографика, и даже ЦА (такого понятия еще не было, но о потребителях я задумывался). А параллельно делал станковую графику как раз со Знаками (Борхес-шморхес, язык символов…)</p>\n<div class=\"orn\" role=\"separator\"><b></b></div>\n<p>Мы со Шварцманом яростно спорили минут пятнадцать — я ему про знаки и стили, он мне про Знак и Космос. Судя по тому, что он долго меня вспоминал, не я один получил от этой беседы удовольствие.</p>\n<p>Работать в Легпром я так и не пошел, но Михаила Матвеевича помню как одного из самых своеобычных людей, с которыми пришлось встречаться.</p>\n<p>Сейчас Шварцман и его СХКБ сильно подзабыты — и совершенно напрасно. Если искать нечто исконно советское* (в хорошем, культурном смысле) и при этом вполне оригинальное, то именно там.<br>____________<br>*в этом контексте «советское» не значит «имеющее отношение к советскому строю, образу мыслей или (избави бог) к пропаганде, но только ко времени между 1917 и 1991 годом и территории, скованной границами ссср.</p>", "figs": [["img/16/16-001.jpg", "16-001", "<b>Михаил Шварцман на фоне знаков СХКБ Легпром.</b><p>Одной этой фотографии хватило бы на всю главу</p>", 1.0], ["img/16/16-002.jpg", "16-002", "<p>Обложка каталога СХКБ с одним из самых известных шварцмановских знаков</p>", 1.0], ["img/16/16-003.jpg", "16-003", "<p>Отсюда начинается подборка знаков, собранная для меня Машей Овчинниковой. У них есть авторы и клиенты. Но я намеренно их не упоминаю.</p><p>Тавро так тавро!</p>", 1.0], ["img/16/16-004.jpg", "16-004", "", 1.0], ["img/16/16-005.jpg", "16-005", "", 1.0], ["img/16/16-006.jpg", "16-006", "", 1.0], ["img/16/16-007.jpg", "16-007", "", 1.0], ["img/16/16-008.jpg", "16-008", "", 1.0], ["img/16/16-009.jpg", "16-009", "", 1.0], ["img/16/16-010.jpg", "16-010", "", 1.0], ["img/16/16-011.jpg", "16-011", "", 1.0], ["img/16/16-012.jpg", "16-012", "<p>Несколько графических листов МШ из коллекции Маши Овчинниковой с характерной шварцмановской скорописью</p>", 1.0], ["img/16/16-013.jpg", "16-013", "", 1.0], ["img/16/16-014.jpg", "16-014", "", 1.0], ["img/16/16-015.jpg", "16-015", "<p>Михаил Шварцман как иерат-живописец. Дальше несколько иератур в технике темпера на доске.</p>", 1.0], ["img/16/16-016.jpg", "16-016", "<p>Взято отсюда:<br>www.art-critic-kuskov.com/czhvarzman.html</p>", 1.0], ["img/16/16-017.jpg", "16-017", "", 1.0], ["img/16/16-018.jpg", "16-018", "", 1.0], ["img/16/16-019.jpg", "16-019", "", 1.0], ["img/16/16-020.jpg", "16-020", "", 1.0], ["img/16/16-021.jpg", "16-021", "<b>Одно из характерных шварцмановских лиц-масок.</b><p>В живописи, так же как в графическом дизайне, господствует центральная композиция, каждый раз осложненная динамическим искажением форм</p>", 1.0]], "research": null}, {"intro": false, "num": "42", "title": "Фотонабор и ОНШ: последний акт советского шрифтостроения", "ptitle": "Фотонабор и ОНШ: последний акт советского шрифтостроения", "subtitle": "", "date": "16 августа 2026 г.", "perm": "https://www.facebook.com/100000723643455/posts/28514747981465943/", "slug": "", "html": "<p><span class=\"dc\">«К</span>огда у меня в руках новая книга…» — эту строку из «Оды типографии» Пабло Неруды страшно любили советские типографы.</p>\n<p>Так вот, когда у меня в руках или перед глазами двухтомный каталог шрифтов для фотонаборного комплекса «Каскад» — гордости советского полиграфического машиностроения — у меня опускаются руки и пропадает всякое желание смотреть на буквы.</p>\n<p>В прошлый раз я описывал «Каталог ручных и машинных шрифтов» 1966 года. Это был финал советской высокой печати (в смыле момент перехода на плоскую, офсет), когда назрела смена парка печатных машин, а вместе с ним переделка всего комплекта шрифтов. Тогдашний набор состоял из остатков дореволюционных гарнитур и жидкой неструктурированной кашицы новых советских дополнений.</p>\n<p>К началу восьмидесятых ситуация не улучшилась, но изменилась. Давайте рассмотрим и проанализируем содержание нового каталога (см. картинку 1)</p>\n<p>01 Академическая (3 начертания) · 02 Балтика (3) · 03 Банниковская (3) · 04 Брусковая газетная (4) · 05 Газетная рубленая (1) · 06 Журнальная (3) · 07 Журнальная рубленая (3) · 08 Звездочка (3) · 09 Кудряшевская энциклопедическая (3) · 10 Литературная (4) · 11 Малановская (2) · 12 Новая газетная (2) · 13 Новая журнальная (3) · 14 Обыкновенная (1) · 15 Обыкновенная новая (3) · 16 Тип Бодони (4) · 17 Тип Таймс (4) · 18 Школьная (4) · 19 Кириллица (1) · 20 Арарат (3) · 21 Грузинская обыкновенная (4) · 22 Рубленая Слуцкера (3) · 23 Абридж Кузнецовой (2) · 24 Бейрут (1) · 25 Хинди-Каскад (2) · 26 Бенгальская-Каскад (2) · 27 Каннада (1) · Знаки сложного набора · Шахматы, шашки · Линейки · Украшения</p>\n<p>Что значат значки: новинка (3-9); сделано до 1917 (3); сделано после 1917 (10); советские переработки западных образцов (4); авторские (5).</p>\n<p>По сравнению с 1966 годом кириллических шрифтов стало почти в три раза меньше (18 против 48). При этом видна стандартизация гарнитур. Как правило, это три базовых начертания: регулярное, полужирное, курсив. В самых новых шрифтах добавлен полужирный курсив. Зато из больших старых семейств — прежде всего из Литературной — исчезли все изыски вроде жирных и узких начертаний. А ведь они были еще в бертгольдовской Латинской.</p>\n<p>Внезапно добавились грузинский, армянский, еврейский, пара арабских, пара индийских. Не то, чтоб до этого в ссср не было не кириллических шрифтов. Просто они не попали в каталог 1966 года.</p>\n<p>Новинок в фотонаборной кириллице три: Звёздочка, Тип Бодони, Тип Таймс. Два последних — намеренно огрубленные копии Бодони и Таймса, приспособленные для скверной советской печати.</p>\n<p>По-настоящему акцидентный шрифт остался один: жирная Обыкновенная гарнитура.</p>\n<p>Качество контуров и общий уровень шрифтов стали существенно выше. В Отделе наборных шрифтов работали весьма квалифированные профессионалы.</p>\n<p>Что сразу бросается в глаза при взгляде на содержание каталога — он адски скучен. Из 18 кириллических гарнитур семь построены на базе обыкновенной гарнитуры или сенчури (что почти одно и то же). Новых ярких шрифтов нет вообще. Из старых убрано всё, чем можно разнообразить набор.</p>\n<p>Ну чего вы хотите — вылезает из-под лавки любитель всего советского. Новая технология, не всё сразу… Ага.</p>\n<p>К счастью, у меня есть для сравнения содержание каталога компании ITC того же 1983 года, взятое из культовой газеты-журнала U&amp;lc, издававшегося всё той же компанией (см. картинку 2).</p>\n<p>Пока грамотные советские дизайнеры пилили Тип Таймс, некие американцы Херб Лубалин, Том Карнас, Альдо Новарезе, Эд Бенгиат и примкнувший к ним Герман Цапф (и прочие, и прочие) переосмыслили само понятие антиквы и задали новые стандарты состава начертаний. Заодно они подняли повыше линию строчных и тем самым бестрепетно улучшили читаемость.</p>\n<p>Когда мы с благодарностью вспоминаем дизайнеров, имевших отношение к ОНШ-Параграфу-ПараТайпу, нам скорее придут на ум переведенные ими шрифты ITC, чем оцифрованное (до)советское наследие.</p>\n<p>Дело в том, что в конце советской эпохи типографика окончательно оторвалась от рынка. Фотонаборные шрифты разрабатывались не для дизайнеров и типографов, и уж тем более не для их заказчиков и не дай бог не для потребителей букв. Шрифты были нужны были полиграфическому производству — вот их и сделали равномерно кирзовыми.</p>\n<p>Натужный и выспренний (два тома на 18+ шрифтов!) каталог «Каскада» вышел из печати в 1982-83 годах.</p>\n<p>А год спустя в далекой Калифорнии два наглых эмигранта по имени Зузана и Руди начали при помощи первых Маков издавать журнал Emigre.</p>\n<p>С чем это сравнить? Не с полетом на Луну, это государственное достижение, но пожалуй с айфоном и Старлинком. В шрифтовом деле началась абсолютно новая блистательная эпоха, какой не было со времён Альда. Такой вот случился каскад, господа и дамы.</p>", "figs": [["img/17/17-001.jpg", "17-001", "<p>Разворот содержания (Шрифтовой указатель) из каталога фотонаборных шрифтов. Москва, 1982 год</p><p>Обратите внимание на Журнальную, Кудряшевскую, Обыкновенную, Обыкновенную новую, Тип Бодони, Школьную. Все эти шрифты можно было бы свести в одно семейство Обыкновенных.</p><p>Всего в каталоге 27 гарнитур (не считая шашек). Это продукт не частной словолитни, но единственной государственной организации в ссср, выпускавшей шрифты. Самой, как мы помним, читавшей Литературную гарнитуру страны в мире</p>", 1.0], ["img/17/17-002.jpg", "17-002", "<b>Первая полоса содержания каталога ITC. 1983</b><p>Первое, что бросается в глаза — количество начертаний в семействах. Это придумали айтисишники, которые первыми отделили создание рисунка шрифтов от производства шрифтовых носителей.</p>", 1.0], ["img/17/17-003.jpg", "17-003", "<b>Вторая полоса содержания каталога ITC. 1983</b><p>Всего в каталоге 50 семей шрифтов. Это частная словолитня, одна из нескольких в тогдашних США. А еще шрифты выпускали производители фотонаборного оборудования. Их тоже было несколько.</p>", 1.0], ["img/17/17-004.jpg", "17-004", "<p>Разворот из советского каталога с тем самым Типом Таймс. Как же меня бесила эта голубая сетка, не дававшая его толком переснять! Правда, качество печати было такое, что и пересняв умаялся бы править контуры</p>", 1.0], ["img/17/17-005.jpg", "17-005", "<p>ITC Caslon 224 Эда Бенгиата.<br>В шрифтах ITC много всяких красот. Возможно, даже чуть-чуть многовато. Но чтобы понять суть этого направления, сразу смотрите на строчные a, c, e. Они всегда необычные.</p>", 1.0], ["img/17/17-006.jpg", "17-006", "<p>ITC Tiffany Бенгиата.<br>Когда я впервые увидел тиффаниевские KR, я понял, что в этой профессии можно всё</p>", 1.0], ["img/17/17-007.jpg", "17-007", "<p>ITC Isbell. Буква a с резким обратным наклоном — очень частая фишка в шрифтах ITC</p>", 1.0], ["img/17/17-008.jpg", "17-008", "<b>Обложка журнала U&amp;lc за 1980 год</b><p>Вы держали в руках U&amp;lc? Если нет — найдите и скорее подержите. Это огромная толстенная газета, отпечатанная на издевательски тонкой, но дьявольски приятной руке и глазу бумаге. Черный цвет и качество печати вызывали у советского типографа резкое слюноотделение, слёзы зависти и оргазмический вздох восхищения одновременно.</p>", 1.0], ["img/17/17-009.jpg", "17-009", "<p>Обложка первого номера журнала для эмигрантов, закрывшего великую эпоху ITC и начавшего современность</p>", 1.0]], "research": null}, {"intro": false, "num": "43", "title": "Случай Чернихова", "ptitle": "Случай Чернихова", "subtitle": "", "date": "29 августа 2026 г.", "perm": "https://www.facebook.com/story.php?story_fbid=28679794764961263&id=100000723643455", "slug": "", "html": "<p><span class=\"dc\">С</span> конца 1930-х годов в поле его деятельности были две темы: ветряные мельницы и шрифты.<br>Из Википедии</p>\n<p>Он был на три года старше Мандельштама.</p>\n<p>Биография Якова Чернихова — образец того, чего может добиться упорный и талантливый еврейский мальчик из семьи обедневшего коммерсанта с одиннадцатью детьми. При любой власти.</p>\n<p>Он учился в трех вузах. Стал виртуозным чертежником и автором впечатляющих архитектурных фантазий. Был вполне успешным архитектором. Преподавал, стал профессором. Написал несколько книг. В нормальной стране — отличная карьера. В ссср пришлось каяться в формализме и слава богу, что не расстреляли.</p>\n<p>Но я не о биографии, а о хобби. В какой-то момент Чернихов открыл для себя шрифты и их построение на основе модульных сеток и сложных расчетов, а потом еще более сложных манипуляций с циркулем. На беду, этим в истории занимались такие авторитеты, как Альбрехт Дюрер, Леон Баттиста Альберти, Лука Пачоли и Жофруа Тори.</p>\n<p>Чернихов с отвагой Дон Кихота и мастерством чертежника с черным поясом бросился в гущу букв (длиннющая цитата из Вики):</p>\n<p>«...я увлекся модульным построением классического шрифта. Я сначала хотел ограничиться только созданием труда на тему „Архитектурные шрифты“, но неожиданно развернул работу на более широкую тему, когда обнаружил необычайные материалы в работах классиков архитектуры и живописи: Леонардо да Винчи, Пиранези, Альберти, Серлио, Дюрера, Пачиоли, Тори, Жожона и мн. др. У нас на русском языке таких исследований нет, но зато у нас есть изумительное богатство, оставленное нам в русских письменах. Я разыскал материалы гражданского шрифта еще до петровской реформы. Шрифт, утвержденный Петром, является одним из ценнейших русских творений. Русское барокко, елизаветинский шрифт, русский ампир и другие шрифты, столь богатый и совершенный материал, что давно надо было дать ему математическое обоснование, и на сегодняшний день я успел это сделать, применив модуль — парту и секунду* в построениях нашего классического шрифта».<br>______________<br>* Модуль — единица измерения, принятая в архитектуре, равна в большинстве случаев диаметру колонны у ее основания; парта — часть модуля; секунда — часть парты.</p>\n<p>Результатом стала коллекция таблиц, которую автор не успел превратить в книгу. Чернихов умер в 1951. Книга вышла в 1958 с предисловием и даже текстом, написанным неким Николаем Александровичем Соболевым, который то хвалит маэстро за труд, то журит за приверженность формализму и недостаточную социалистическую реалистичность. Спасибо товарищу Соболеву, что издал!</p>\n<p>Переплет выполнен Лазурским. То-то я гляжу — не без мастера леттеринга книжка!</p>\n<p>Чернихов мастером леттеринга не был. Шрифтовым дизайнером он настолько не был, насколько Дон Кихот не был мастером копейного боя.</p>\n<p>Чернихов рисовал (нет! чертил!) отдельные буквы. И цифры. Цифры у него роскошнейшие. Собрать из букв Чернихова шрифт невозможно — они исключительно плохо подогнаны друг к другу. Леттеринг может выйти, но придется сильно поработать над гармонизацией. Я это пишу так уверенно, потому что купил книгу Чернихова в чудовищно лоховатом переиздании начала 90-х и тут же попытался что-то оттуда использовать. Но не смог.</p>\n<p>Сами по себе таблицы Чернихова великолепны. Это Луиджи Серафини от чертографики. Настоящее высокое и бессмысленное в высоком смысле искусство. Ими хочется любоваться. Украшать стены, воспроизведя в масштабе 10:1. Растащить на цитаты в самые гилтиплежистые шрифты. Но только никогда (никогда!) не говорить, что сами они — шрифты. Многие таблицы держат тон и ритм только на подложенных под буквы сетках. А про чертежные изыски даже товарищ Соболев написал, что они мешают понять конструкцию.</p>\n<p>Книга Чернихова набрана Академической гарнитурой. Это шрифт-франкенштейн, в котором постпетровские барочные формы внаглую впендюрены в модернистский Челтенхем. Рассуждать таким набором о каком-то общем методе систематизации на каких-то геометрических принципах — примерно как прийти в пудреном парике на парад физкультурников. Чернихов не виноват в выборе шрифта, но Академическая подходит к его таблицам как влитая. Правда, как шрифт она на порядок лучше.</p>\n<p>Таблицы дурацкие, но превосходные в своей изысканной чертографике. Текстовый шрифт дурацкий, но самый изысканный и аристократичный из всего, что было в советских типографиях.</p>\n<p>Буквы можно начертить, но нельзя загнать в модульную систему без поломок и вывихов суставов. Дело в том, что буквы только наполовину архитектура, а на другую половину — живые существа. Именно поэтому шрифты архитекторов обычно только боком одним схожи с тем, чем пишут и набирают.</p>\n<p>Шрифт, его ритм и бег, держится с одной стороны на мускульных усилиях пишущего-рисующего, а с другой — на суммирующей силе глаз читающего. Поэтому шрифт не нарисовать по букве. Он не картина, он процесс. Чернихов об этом догадывался, но не сделав ни одного настоящего шрифта, совсем не чувствовал, как буквы взаимодействуют друг с другом в бесконечной пляске набора и чтения.</p>\n<p>Книга Чернихова — артефакт. Книга художника. Вещь в себе. Она утопична. Она была бы невозможна в более сильной типографической культуре. Чернихова восприняли бы как малограмотного фрика, зачем-то лезущего в соседний цех учить тому, чего сам не знает. Но в нашей странноватой полуподвальной культуре он вполне на месте. Братья его Филонов и Платонов — натуральные гении. И Веничка Ерофеев с ними.</p>\n<p>Смотрите картинки. Они, как всегда, с подписями. В конце небольшая подборка реальной и нереальной архитектуры Якова Чернихова.</p>", "figs": [["img/18/18-001.jpg", "18-001", "<b>Вадим Лазурский. Переплет книги Якова Чернихова. 1958</b><p>Единственный в книге высокопрофессиональный леттеринг</p>", 1.0], ["img/18/18-002.jpg", "18-002", "<b>Пример построения букв по модульной сетке</b><p>Каждый раз, видя клеточки, хочу спросить: а что, если вдруг в них не попасть? Может, только лучше будет?</p>", 1.0], ["img/18/18-003.jpg", "18-003", "<p>Один из борхесовских бестиариев Чернихова. Попытка перебрать все возможные варианты композиций строк в леттеринге. И еще животные, невиданные императором</p>", 1.0], ["img/18/18-004.jpg", "18-004", "<p>Попытка справиться с трекингом-кернингом при помощи модулей. Сами буквы при этом выглядят как-то немного странно</p>", 1.0], ["img/18/18-005.jpg", "18-005", "<p>Первая таблица книги. Главный бестиарий.<br>Что изображают вертикальные членения в среднем ряду — не знаю.</p>", 1.0], ["img/18/18-006.jpg", "18-006", "<p>Это как бы устав, но писаный уставшей и дрожащей рукой стареющего Нестора. Держится только на сетке</p>", 1.0], ["img/18/18-007.jpg", "18-007", "<p>Это академик Фоменко. Откуда взялся допетровский гражданский алфавит (и как вообще применимо к любому допетровскому алфавиту слово «гражданский») — загадка</p>", 1.0], ["img/18/18-008.jpg", "18-008", "<p>Древнерусский гражданский алфавит с пропорциями антиквы середины 19 века. И арабские цифры вперемежку с титлами.</p><p>Возможно, Чернихов имел в виду европейские типографии, где в 17 веке уже резали кириллические протоантиквы?</p>", 1.0], ["img/18/18-009.jpg", "18-009", "<p>Вы видели азбуку Кариона Истомина? Обязательно посмотрите, она очень хороша. А потом сравните с таблицей Чернихова</p>", 1.0], ["img/18/18-010.jpg", "18-010", "<p>Это, судя по всему, отсылка к первым опытам Петра и Тессинга, когда новоизобретенные литеры Гражданки Петровой шли в куче с уставом</p>", 1.0], ["img/18/18-011.jpg", "18-011", "<p>Свободная вариация на тему гражданки петровой, поступившей в труппу Дягилева под именнм Иды Рубинштейн. И какие цифры!</p>", 1.0], ["img/18/18-012.jpg", "18-012", "<p>Вот эта таблица больше всех висит на сетке. Если убрать клеточки, исчезнет половина шарма, зато вылезут большие странности конструкции</p>", 1.0], ["img/18/18-013.jpg", "18-013", "<p>То, что Чернихов считает академическим шрифтом</p>", 1.0], ["img/18/18-014.jpg", "18-014", "<p>То, как Чернихов описывает Академический шрифт. Набрано Академической гарнитурой</p>", 1.0], ["img/18/18-015.jpg", "18-015", "<p>Настоящая Академическая гарнитура. Обратите внимание на буквы ЖЗКЩ. Полюбите их. А потом быстро сравните с латиницей!</p>", 1.0], ["img/18/18-016.jpg", "18-016", "<p>Попытка состязаться с Бодони. Посмотрите на амперсанд. Жалко, я не поискал бодониевский. Это производит впечатление</p>", 1.0], ["img/18/18-017.jpg", "18-017", "<p>После таблиц в книге целая тетрадка расчетов. Когда видите такое применительно к шрифту — бегите!</p>", 1.0], ["img/18/18-018.jpg", "18-018", "<p>Яков Чернихов. Водонапорная башня канатного цеха завода «Красный гвоздильщик». 1931</p>", 1.0], ["img/18/18-019.jpg", "18-019", "<p>Яков Чернихов. Архитектурная фантазия</p>", 1.0], ["img/18/18-020.jpg", "18-020", "<p>Яков Чернихов. Дом трестов. Из цикла «Город будущего». 1931</p>", 1.0], ["img/18/18-021.jpg", "18-021", "<p>Яков Чернихов. Композиция 58. «Архитектурные фантазии. 101 композиция». 1933</p>", 1.0], ["img/18/18-022.jpg", "18-022", "<b>Яков Чернихов. Из серии «Дворцы коммунизма». 1930-1939</b><p>Вот вы и попались, Пиранези. Знаю я, что у вас, хитреца, на уме одни тюрьмы</p>", 1.0], ["img/18/18-023.jpg", "18-023", "<b>Яков Чернихов. Из серии «Дворцы коммунизма». 1930-1939</b><p>Кристал Пэлас плюс Тауэр равно коммунизм</p>", 1.0], ["img/18/18-024.jpg", "18-024", "<b>Яков Чернихов. Композиция из цикла «Аристография». 1918-1924</b><p>Хороший художник, правда? Такой свободный</p>", 1.0]], "research": null}, {"intro": false, "num": "44", "title": "Последние советские прописи", "ptitle": "Последние советские прописи", "subtitle": "", "date": "31 августа 2026 г.", "perm": "https://www.facebook.com/100000723643455/posts/28704805405793532/", "slug": "", "html": "<div class=\"epi\"><p>Подшипник с шариком пошли соревноваться:<br>Подшипники шипеть, а шарики кататься.</p><span class=\"epi-a\">Осип Мандельштам</span></div>\n<p><span class=\"dc\">О</span>бучив моё поколение макать перо в чернильницу, советская педогогика всё-таки пала под натиском фирмы BiC, с рыданием отбросила письмо с нажимом и отменила чистописание в начальных классах. Шариковая ручка, этот кольт-письмейкер, уравняла всех.</p>\n<p>Последние советские прописи провозгласили безотрывное письмо. Безотрывность заключалась не в попытке написать букву одним движением, а в отсутствии необходимости периодически макать перо в фиолетовую жижу с нефтяным отблеском.</p>\n<p>Форма строчных букв осталась практически неизменной: всё те же палочки, крючочки и кружки (пардон овалы). Послабление вышло только в отсутствии нажима. А вот заглавные попытались отмотать от лишних завитушек (в классической каллиграфии они нужны для разгона руки), зато некоторые буквы — например, А, Б — приобрели некоторую безотрывность (то есть их стало сложней писать неопытной рукой).</p>\n<p>Кто был герой-методист, отдавший весь свой почерк родной прописи, мне неведомо. Ведомо, что ритм письма стал еще хуже. Пропорции овалов и крючков соотнесены с диагональной разметкой тетрадей (исчезнувшей вместе с чистописанием), а не с живым движением шарика по бумаге. Ну, и заглавные буквы, мягко говоря, красивей не стали. Особенно Ф, с которой сбили фуражку и даже сбрили верхний штрих.</p>\n<p>Все прежние советские прописи были буржуазны: они наследовали английскому письму, владея которым скромный клерк имел лучшие шансы стать секретарем у босса. Последняя советская пропись обращена к послушному и безличному советскому народу — строителю чего-то дефицитного в отдельно взятой стране.</p>\n<p>В подборке картинок смотрите, как повышается самоощущение прописей, уходя вглубь веков. Или — при обратном просмотре — как из них уходит жизнь.</p>\n<p>Насколько я понимаю, шарикоручечная пропись пережила ссср и применяется до сих пор. Правда, я видел, как Александра Королькова выводила новые прописи, но это было скорее упражнение в высокой каллиграфии, чем попытка реанимации обучения чистописьму непригодным для этого инструментом.</p>\n<p>Шариковой ручкой, безусловно, можно писать красиво с той же лёгкостью, что половой щеткой (есть мастера!), пальцем или топором. Надо ли обучать детей в школе таким экзотическим техникам (параллельно с обучением письму)? Не знаю.</p>\n<p>С последними прописями связана одна личная история. В середине 90-х мы еще не Леттерхедом делали тетради для обучения письму для одного милейшего частного заказчика.</p>\n<p>И вот я должен был воспроизводить все эти буквы в Иллюстраторе по одной. Повоспроизводил-повоспроизводил, да и задолбался. Сами мы шрифтов еще (почти) не делали, но с ПараТайпом уже дружили.</p>\n<p>Я связался с Владимиром Ефимовым и пожаловался, что в родной стране отсутствует шрифт для прописей. Внезапно он обещал помочь — и вот через некоторое время на прописи был назначен Манвел Шмавонян, который быстро и аккуратно (под присмотром Владимира Венедиктовича) создал нужную гарнитуру.</p>\n<p>Так что российские школьники обязаны своим типосчастьем трём частным лицам еврейской национальности (наш заказчик в счет) и одному природному армянину. Дружбы народов надёжный оплот.</p>\n<p>Смотрите картинки, там много вкусного.<br>Смотрите также все предыдущие главы о прописях.</p>\n<div class=\"orn\" role=\"separator\"><b></b></div>\n<p>Обучение письму и чистописание — две разных дисциплины.</p>\n<p>Письмо — один из способов хранения и передачи информации. Неважно, красив или шероховат почерк. Главное: он должен быть разборчив для пишущего и читающего.</p>\n<p>Чистописание — это упрощенная каллиграфия. Это обучение классическому танцу на уровне мелкой моторики.</p>\n<p>Да, это полезная практика — дворян поголовно учили танцевать, а заодно держать спину, что выгодно отличало их от разночинцев.</p>\n<p>Однако насколько нужна именно каллиграфия всем (всем!) современным детям?</p>\n<p>И почему — если уж хочется научить дитя писать красиво — нужно в качестве образца использовать уродливые и не писаные рукой (это важно) советские прописи?</p>\n<p>Опять же смотрите картинки — там есть кое-что сильно получше того, чему всех нас учили )</p>\n<div class=\"orn\" role=\"separator\"><b></b></div>\n<p class=\"ps\"><span class=\"pslabel\">PS</span> Честное слово — случайно выложил главу аккурат под 1 сентября ))</p>", "figs": [["img/19/19-001.jpg", "19-001", "<b>Последние советские прописи были приняты в 1969 году, однако см. картинку 3</b><p>Буквы не написаны рукой, но вычерчены с учетом линовки тетради, иначе никак не объяснить такое маленькое расстояние между прямыми штрихами.</p><p>Строчные буквы имеют устоявшуюся за 150 лет форму. А вот заглавные выглядят несколько робко — потому что отсутствует каллиграфический канон для шариковой ручки.</p><p>Некоторые заглавные (и только заглавные) показаны как безотрывные.</p><p>На картинке именно шрифт Propisi, в котором отсутствуют латинские буквы (как будто в школе не учат иностранным языкам). Показать меньше</p>", 1.0], ["img/19/19-002.jpg", "19-002", "<p>Сравнение нынешних прописей и шрифта Александры Корольковой (две нижних строки). Понятно, что профессиональный шрифтовой дизайнер в одну калитку выносит методиста из министерства просвещения. Но вот по каким проще учиться писать? Не знаю.</p>", 1.0], ["img/19/19-003.jpg", "19-003", "<p>Прописи, по которым меня учили писать в 1965 году. Новые прописи ввели в 1970. Однако на плакате дата — 1973. Так что неизвестно, когда на самом деле произошел переход.</p><p>Буквы начерчены. Нажим, все дела. Декор старорежимный. Есть зачем-то вариант строчной з без петли. А вот д хвостиком вверх нет.</p>", 1.0], ["img/19/19-004.jpg", "19-004", "<b>Воскресенская. Прописи 1962, 1 класс</b><p>Буквы начерчены. Декор буржуазный. Строго вписаны в линейки. Есть варианты с соединительными штрихами и концевые (вв, оо). З только с петлей.</p>", 1.0], ["img/19/19-005.jpg", "19-005", "<b>Воскресенская. Прописи 1948, 2 класс</b><p>Буквы начерчены. Есть варианты с соединительными штрихами и концевые. Строчная з с петлей и без.</p>", 1.0], ["img/19/19-006.jpg", "19-006", "<p>Воскресенская. Прописи 1947<br>Всё то же, что в 1948. Точнее наоборот.</p>", 1.0], ["img/19/19-007.jpg", "19-007", "<b>Воскресенская. Прописи 1935</b><p>Попытка избавиться от заглавных. Их формы максимально сближены со строчными. Здравая идея для обучения малограмотных сторонников уравниловки. Буквы начерчены.</p>", 1.0], ["img/19/19-008.jpg", "19-008", "<b>В. Флеров. «Наглядные уроки письма». 1916</b><p>Буквы нарисованы (не начерчены).<br>Две д — хвостами вверх и вниз.<br>Строчная з без петли.<br>Заглавные П, Т — на латинский манер, копируют строчные.</p>", 1.0], ["img/19/19-009.jpg", "19-009", "<b>В. С. Гербач. «Методическое руководство к обучению письму». 1915</b><p>Буквы написаны с дорисовкой.<br>Две строчных д хвостами туда-сюда.<br>Две строчных з с петлей и без.</p>", 1.0], ["img/19/19-010.jpg", "19-010", "", 1.0], ["img/19/19-011.jpg", "19-011", "<b>Прописи 1909 года</b><p>Видны некоторые следы английского письма — например, вынос вверх у строчной к.</p>", 1.0], ["img/19/19-012.jpg", "19-012", "<b>Прописи 1844<br>Источник: Данила Воробьев</b><p>Это, скорее, каллиграфический образец. Следы латинского скрипта усилились</p>", 1.0], ["img/19/19-013.jpg", "19-013", "<b>Каллиграфический алавит. 1837<br>Источник: Данила Воробьев</b><p>Строчные д, з двух видов.<br>Заглавные Ш, Щ имеют сильно устаревшую форму, отсылающую к скорописи</p>", 1.0], ["img/19/19-014.jpg", "19-014", "<b>1809 Источник: Данила Воробьев</b><p>Строчные буквы скорее курсивного вида. У строчных п, т, ц, ш, щ плоские крышки и донышки.<br>Строчная д — как в наборном шрифте.</p>", 1.0], ["img/19/19-015.jpg", "19-015", "<b>1788 Источник: Данила Воробьев</b><p>Образцы для обучения не только письму, но и каллиграфии. С вариантами заглавных и строчных букв.<br>Строчные п, т, ц, ш, щ — и с плоскими крышками, и как их западные аналоги mn.</p>", 1.0], ["img/19/19-016.jpg", "19-016", "<b>1778 Источник: Данила Воробьев</b><p>Образцы прописей в сопровождении старостильного уставного набора (для церковной школы?)</p>", 1.0], ["img/19/19-017.jpg", "19-017", "<b>1776 Источник: Данила Воробьев</b><p>Каллиграфические образцы. Строчные смешанной формы: например, в — от скорописного квадратика до современного вида. Строчная д пытается найти себя: она и q, и g, и д.</p>", 1.0], ["img/19/19-018.jpg", "19-018", "<p>Богатый образец прописей, если не ошибаюсь, конца 1750-х. Форма букв скорее курсивная, но неожиданно д, п, т похожи на современные</p>", 1.0], ["img/19/19-019.jpg", "19-019", "<b>Долгожданная А с петелькой! 1971 год и около.<br>Тех же щей покренделей.</b><p>Спасибо, Дмитрий Красинский!</p>", 1.0]], "research": null}, {"intro": false, "num": "45", "title": "Таймс против Литературной, или битва Масленицы с Великим Постом", "ptitle": "Таймс против Литературной, или битва Масленицы с Великим Постом", "subtitle": "", "date": "28 сентября 2026 г.", "perm": "https://www.facebook.com/yuri.gordon/posts/pfbid0X78aoThYMdqbbz5mQemo5ZzhiMWnHo9SPutump8pbooyNLkTKEA947qiiJTfPLhyl", "slug": "", "html": "<p><span class=\"dc\">В</span> этой главе речь пойдет о великой битве старого с новым, фактически об отмене крепостного права и даровании вольностей дворянских, которую, однако, практически никто не заметил и которую пресёк, сам того не ведая, лесник номер 286.</p>\n<p>В середине-конце 80-х издательство «Мир» было единственным стильным издательством в ссср. В том смысле, что одно оно имело продуманный и развитой фирменный стиль, базировавшийся на типографике, и в частности — на шрифте Таймс.</p>\n<p>Позвольте, но никакого шрифта Таймс в ссср тогда не было! Не было-не было, а в «Мире» был.</p>\n<p>Попав по хорошему блату в «Мир» делать серийные обложки (level one в иерархии придворных дизайнеров), в первый же визит к худредам я случайно увидел такую сцену:</p>\n<p>В коридоре, рядом с дверью в кабинет главного художника, элегантный молодой мужчина в костюме-тройке, начищенных до космического блеска туфлях и с аккуратнейшими усиками, чем-то неуловимо похожий на всех первых героев-любовников советского кино, на неприлично английском английском что-то подробно объяснял интеллигентной даме бальзаковского возраста. Дама кивала и записывала.</p>\n<p>Как выяснилось чуть позже, это главный художник «Мира» Максим Георгиевич Жуков давал комментарии начальнице мировских переводчиков. Моему тогдашнему взору он представился портретом шрифта Times New Roman — сочетанием суховатой элегантности и недостижимой британской точности в деталях.</p>\n<p>Издательство «Мир» было окном на запад. Там издавались переводы оттуда и переводы туда. Поэтому неудивительно, что главным художником в «Мире» был самый продвинутый на запад советский дизайнер. И что именно в «Мире» завелся фотонаборный автомат с Таймсом фирмы Compugraphic.</p>\n<p>В то время ссср все еще был страной Литературной гарнитуры. Она уже не лезла из всех «Правд» и неправд, но крепко держалась везде, где что-то набирали «по умолчанию». Она была похожа на застой, на день сурка, на политинформацию в восьмом классе. Ее следовало преодолеть и забыть. Именно этим и занялся рафинированный западник Максим Жуков.</p>\n<p>Я уже несколько раз писал про царицу советского набора. Когда рассказываешь о типографике в ссср, не упомянуть Литературную всё равно, что не использовать аббревиатуры ВКПб или НКВД, говоря о советской политике.</p>\n<p>Но сейчас давайте сравним ее с Таймсом. Что у них общего, где различия? Наконец, кто из них лучше в качестве первого выбора как текстовый шрифт?</p>\n<p>Литературная была выпущена в самом начале 20 века словолитней Бертгольда как модный современный шрифт «Латинская гарнитура» — заменитель «обыкновенных» шрифтов и более старых «эльзевиров». Она довольно светлая, с невысоким контрастом, маленькими крепкими засечками и вертикальными овалами. Всё это делает шрифт хорошо читаемым и не убиваемым плохой печатью. Дополнительно, вертикальные овалы хороши именно в кириллице, где и так много вертикалей — они согласуются друг с другом.</p>\n<p>Если бы не актуальные на  момент создания шрифта детали — чубчик А, странноватые Жж, Кк, еще кое-что по мелочи — Литературная была бы нейтральным текстовым шрифтом. В нормальной типографической ситуации все эти модные в 1901 году штучки исчезли бы уже в 1930. Но советская типографика проглотила Латинскую гарнитуру как есть, сменив только имя. И вот к восьмидесятым шрифт смотрелся как франт в котелке и с тросточкой в троллейбусе в час пик.</p>\n<p>Таймс в то время еще не был шрифтом операционных систем и программы Word. Но в латинском мире он стремительно становился серифом по умолчанию. Все основные поставщики букв для фотонабора имели собственные Таймсы, а оттуда он так же молча перетёк в первые настольные верстальные системы.</p>\n<p>Если Латинская — шрифт арнуво (и даже, пожалуй, стиля промышленной революции), то Таймс — продукт ардеко, родственник шрифтов Эрика Гилла. Таймс контрастен, остр засечками, кос овалами, лишен всего, что можно назвать чистой декоративностью. Однако общий строй шрифта выраженно английский. Таймс не Кэзлон и не Баскервиль, но холёный и породистый грейхаунд Баскервилей.</p>\n<p>Забавно, что и Латинская, и Таймс имеют в родословной безродных «эльзевиров» середины 19 века. Я где-то читал, что они похожи друг на друга. Ну, нет. Латинская — немецкий бюргер, если не юнкер. Таймс — лондонский клерк или даже член клуба любителей крикета.</p>\n<p>Латинская была переведена в кириллицу сразу же по создании, тем же Бертгольдом. И мгновенно стала хитом на российском рынке. Ближайший конкурент, Леман, тут же выпустил Ренату, настолько близкую к Латинской, что их можно считать двоюродными сестрами.</p>\n<p>Надо сказать, для своего времени кириллица в Латинской была неплохой. Кроме того, сама конструкция Латинской хорошо подходит для кириллического набора. Прямые овалы, невысокий контраст, короткие тупоносые засечки — всё это способствует лёгкому чтению по-русски.</p>\n<p>Основные кириллические буквы при такой конструкции могут быть почти любыми, они максимум дадут некоторую шероховатость при чтении. Если быть честным, Латинская/Литературная в качестве текстового шрифта намного приятнее Таймса. Но ее было так много все годы советской власти, что все мы — тогдашние дизайнеры — люто ее ненавидели.</p>\n<p>А вот с Таймсом всё было ровно наоборот. Он изначально английский. Контраст, наклон овалов, длинные острые засечки — всё это делает шрифт неудобным в кириллице. Собственно кириллические буквы: Дд, Жж, Йй, Кк, Лл в Таймсе всегда будут слегка дребезжать. Поэтому что ни Таймс — то новый заход на кириллицу, каждый раз не совсем точный.</p>\n<p>Переводческой школы для шрифтов в ссср никогда не было, потому что переводы (легальные или нелегальные) были большой редкостью, и даже один в один  перепиленные с западных образцов шрифты неизменно проседали в кириллице. В частности, бытовали оставшиеся еще от Петра странные представления о том, что кириллица, полностью перекроеннная под антикву, имеет какие-то особые родовые отличия от латиницы даже в идентичных знаках. Не дай бог было скопировать K в К или сделать Я из R!</p>\n<p>Сейчас, почти через полвека интенсивнейшего притирания кириллицы к латинице, стало куда проще переводить. Зато возникли новые, уже «отлатиненные» казусы. Например, трёхногая кириллическая т (m) почти однозначно считывается новым поколением как м, а курсивная и (u) как латинская u. Кириллический логотип «mumaн» имеет большие шансы быть прочитанным как «мумах». Видиmо, скоро mы будеm mычать так: mу-mу. Но я отвлёкся.</p>\n<p>К середине восьмидесятых в ссср все же появился свой Таймс — точнее, Тип Таймс. Это была нарочито огрублённая копия, сделанная в Отделе наборных шрифтов для фотонаборного комплекса «Каскад» (я о нем уже писал). Но его никто не полюбил и толком не попробовал.</p>\n<p>В общем, фотонаборный Таймс, даже при наличии Компьюграфика в «Мире», рисковал так и остаться импортным продуктом для избранных, но тут подоспела новая волна. Под самый развал ссср его накрыло компьютерной революцией. 286-е писюки и примкнувшие к ним принтеры заполонили советские конторы, превратив их в офисы. В тех писюках почти не было кириллицы, но та, что была — была Таймсом и Ариалом (а если писюк внезапно оказывался маком — то Гельветикой).</p>\n<p>Литратурная в компьютер не попала и вымерла со скоростью последних мамонтов. Вместе с ней вымерли Академическая, Банниковская, Журнальная рубленая и далее по списку. И даже то, что Отдел наборных шрифтов, превратившийся в ПараТайп, стал продавать свою коллекцию, содержащую многие советские шрифты (моментально украденную и разошедшуюся в миллионах копий), не спасло небогатое наследие ссср.</p>\n<p>Кстати, в той же коллекции ПараТайпа найдется и «лучший кириллический таймс» под именем Times ET или Newton — действительно качественная совместная работа Владимира Ефимова и Александра Тарбеева, по удивительному капризу судьбы (или авторов) не совпадающая по метрикам ни с одним с оригинальным Таймсом — и потому плохо уворовываемая.</p>\n<p>Литературная почила. Никто не набирает ей объявления. Ни один бухгалтер не вносит ею правку в отчёт. И даже ни один поэт не доверяет ей сокровища души и рифмы.  Вы скорее всего сможете встретить бывшую советскую приму на моих литературных картах под именем ПалеоЛит и НеоЛит.</p>\n<p>Для всего остального есть Times New Roman в самом корявом монотайповском переводе, где Жж и Кк с развесисто-клюквенными каплями будут напоминать о безвестном переводчике-иностранце, скопировавшим их из советской книжки, набранной бывшей Латинской гарнитурой.</p>\n<p>Подробности о Таймсе и Таймсах от ПараТайпа смотрите по ссылвкомм.</p>", "figs": [["img/20/21-001.jpg", "21-001", "<p>Слева направо:<br>Times от Linotype<br>Times New Roman от Monotype<br>НеоЛит (Литературная гарнитура) от ВПС</p><p>Обратите внимание на латинские K и кириллические Жж, Кк. В линотайповском Таймсе кириллические почти (но не совсем!) копируют латинскую.</p><p>А вот в монотайповском — явно подсмотрены у Литературной. И явно плохо подсмотрены.</p><p>У которой, в свою очередь, латинская K не такая, как кириллические ЖК</p><p>Кроме того, заметно, насколько строчные у Литературной выше и уже, чем у Таймса, при одинаковом росте заглавных.</p>", 1.0], ["img/20/21-002.jpg", "21-002", "<p>Newton, он же Times ET — самый лучший перевод Таймса (по мнению компании ПараТайп), выполненный Владимиром Ефимовым и Александром Тарбеевым.</p><p>К сожалению, я не нашел фирменного спесимена, поэтому пришлось скачать его с какой-то шрифтовой помойки ((</p>", 1.0], ["img/20/21-003.jpg", "21-003", "<p>Шрифт Тип Таймс, созданный Отделом наборных шрифтов ВНИИ Полиграфмаш для советского фотонаборного комплекса «Каскад».</p><p>Он кажется перетиснутым даже в каталоге. Кроме того, в нем еще сильнее, чем в других Таймсах, видна неровность распределения чёрного — следствие высокого контраста и свойственной Таймсу вообще «рисованности» контуров, из которых исчез след пишущего инструмента</p>", 1.0]], "research": null}, {"intro": false, "num": "46", "title": "Мелодии и ритмы с болгарским акцентом", "ptitle": "Мелодии и ритмы с болгарским акцентом", "subtitle": "", "date": "9 октября 2026 г.", "perm": "https://www.facebook.com/yuri.gordon/posts/pfbid0U4Dio5Tm2kNbTd5EtgAG21ehGZE71Pyjca1R6fhxy1Qs5pnWf6BSGPfpeVMu7dXMl", "slug": "", "html": "<div class=\"epi\"><p>«Вписывай круг в квадрат»</p><span class=\"epi-a\">И. Бродский</span></div>\n<p><span class=\"dc\">Ч</span>ем отличался фирменный магазин «Мелодия» на Калининском от соседнего с ним Дома книги? Похожи они были толпами народа, дикими очередями и всякими полусерыми личностями, неизменно тусовавшимися у входа. Но была и разница.</p>\n<p>Советская книга нечасто упаковывалась в красивую суперобложку. Да и советский читатель был готов проглотить что угодно — от ксерокса до макулатуры, лишь бы буквы разобрать.</p>\n<p>А вот винил был крупен, пёстр и ярок. Заглядывая в «Мелодию» через головы очереди в сторону прилавка, иногда можно было увидеть, что «выбросили» — просто потому, что вожделенный предмет имел размер 30 на 30 см и запечатку полноцветом.</p>\n<p>До основания концерна «Мелодия» в 1964 г. советские пластинки паковались в белые конверты с круглыми окошками на обеих сторонах, через которые были видны лейблы с содержанием каждой из сторон. Иногда конверты чем-то надпечатывались, но в нашем доме такого не водилось.</p>\n<p>«Мелодия» издавала звукозаписи, но была совсем не похожа на книжные издательства. Это было промышленное производство с собственной графической студией, видимо, похожей на СХКБ, в одном из которых я работал. Поэтому на обложках дисков до начала 80-х не было имен художников. Некоторые из них мне попались при атрибутировании, но чаще герои остались неизвестными.</p>\n<p>Советский книжный дизайн имел корни и традиции (пусть даже основательно погрызанные государственной монополией на печать). А вот обложки пластинок начинали делать с нуля. Ориентироваться можно было только на Запад, и тут возникла главная проблема.</p>\n<p>В позднем ссср не было модных букв. Совсем не было. Их не было с двадцатых годов. И специалистов по модному леттерингу или модной типографике не было. Ни одного. На книжную обложку еще можно было что-то от руки нарисовать или каллиграфически написать, но с западных каверов смотрела пышная наборная типографика. Чем ответить?</p>\n<p>Давайте здесь тормознем на минуту и оценим ситуацию. С одной стороны — советская культура с гигантской пропагандистской машиной, с госпечатью, госкино, госконцертом, гостеатром и госцирком. Этакий тиранозавр рекс с нечеловеческой пастью, но с махонькими ручками недоразвитой поп-культуры. Потому что советскому человеку не положено было иметь этих буржуазных излишеств.</p>\n<p>С другой — хм — стоглавый дракон мировой популярной культуры. С многомиллионными бюджетами Голливуда. С высокоразвитой индустрией производства и раскрутки звёзд в любом виде искусства. И с мощнейшей технологической базой, обеспечивающей высочайшее качество масс-продукции. Ведь мы же знаем, что попса должна быть не только голимой, но и блестящей — иначе ее никто не купит.</p>\n<p>То есть артели безымянных недизайнеров Апрелевского комбината грампластинок противостояла, скажем, дизайн-команда Columbia Records, во главе которой (цитирую гугл) «Джон Берг — легендарный дизайнер, создавший более 500 обложек для Columbia (включая культовые работы для Боба Дилана, Simon &amp; Garfunkel и Брюса Спрингстина)».</p>\n<p>С чем это сравнить? Например, с советским хоккеем. Спортивная машина ссср могла обеспечить сборную, способную выиграть чемпионат мира. Но вот на уровне клубов даже всемогущего монополиста ЦСКА приходилось усиливать, чтоб на равных играть с Монреаль Канадиенс или Филадельфия Флайерс. Напомню, в НХЛ было тогда 18 примерно равных по силе команд, а потом еще АХЛ появилась.</p>\n<p>Не говоря уже о баскетболе. Спорт как пропаганда проигрывал спорту как развлечению там, где он становился частью масс-культуры.</p>\n<p>Итак, стартовые позиции.</p>\n<p>В мире бушевала фотонаборная революция. ITC перепридумывала подход к акцидентным шрифтам. В это же время появился Letraset, фактически переводной аналог ручного набора, позволявший такие вольности с типографскими шрифтами, каких не было никогда раньше. А на горизонте маячил дтп (desktop publishing), которого ссср уже не пережил.</p>\n<p>Что было делать советским еще не дизайнерам, вооруженным фотоувеличителем «Беларусь»? Только переснимать отовсюду, где были красивые буквы. Из редких западных каталогов. Просто из книг. С упаковок. И потом дорисовывать и доклеивать вручную.</p>\n<p>Ибо переснять — полдела. Надо было ещё превратить нарядную латиницу в родные осинки. А она не хотела превращаться.</p>\n<p>Как известно, 26 русских строчных — копии заглавных. Это значит, что если латиницу перевести правильно, шрифт в кириллице станет заметно скучнее. Да и кто знает, как ее переводить-то? В советских художественных школах, и даже в Полиграфе, такому не учили.</p>\n<p>А что если не переводить, а перевернуть и приспособить? Помните, в прошлой главе был логотип mumaн? Вот он как раз так и был сделан: переводом в болгарицу.</p>\n<p>«Болгарица» — для тех, кто не в курсе — принятый в Болгарии в начале 1960-х подход к рисованию прямых строчных знаков алфавита по образу и подобию курсивных. То есть с большим количеством выносных элементов и с сохранением плавных переходов внутри букв, характерных для письма от руки.</p>\n<p>В послепетровской кириллице одновременно сосуществуют фактически два алфавита: «печатный» и «письменный». Болгарские товарищи решили оставить один письменный и сумели убедить свое руководство. Помимо всего прочего, строчная болгарица стала намного ближе к латинице.</p>\n<p>Это сходство быстро заметили советские «художники книги». Два поколения дизайнеров — моё и предыдущее — всерьез переболели болгарским синдромом. Даже первая кириллическая «Хельветика» от Жукова-Курбатова 1963 года была «болгарской».</p>\n<p>Уверен: увлечение болгарицей было вызвано вовсе не желанием сделать кириллицу лучше читаемой или более логичной по конструкции. Да, мы все повторяли эти мантры, но про себя знали: так намного проще передирать с западных каталогов.</p>\n<p>В советской книге болгарица не прижилась, потому что некому было сделать наборные шрифты такого вида. А вот на обложках «Мелодии» болгарский акцент очень заметен. Смотрите в подборке картинок, я отметил все случаи появления болгарицы.</p>\n<p>Пожалуй, обложки пластинок — лучшее место для леттеринга в ссср. Ни книги, ни даже постеры с афишами не дают такой свободы в обращении с пространством и такого разнообразия тем. Кроме того, обложка диска — и тем более альбома — это упаковка с теми же рекламными задачами, что подарочная коробка или винная этикетка. Надпись на диске — почти логотип или даже прямо логотип.</p>\n<p>Советские леттерингисты-пластиночники могли пойти двумя путями. Первый — нарисовать буквы от руки. Каллиграфов было мало, да и не везде подходит лихой росчерк. Рисовать буквы, похожие на наборный шрифт, не умел никто. Поэтому от руки рисовали в основном детские обложки. Для всего остального использовался метод рекле.</p>\n<p>Как это делалось? Нетрудно ответить. Возьмем, к примеру, обложку диска Криса Кельми «Открой свой Сезам». Выпуск 1990 года. Художник Л. Володин.</p>\n<p>На ней два блока: русский и английский. В каждом имя певца и название альбома.</p>\n<p>Конечно, я намертво забыл имена использованных шрифтов, хотя внешне их помню отлично. Пришлось слазить в программу WhatTheFont, умеющую иногда распознать шрифт по паре букв.</p>\n<p>Имя певца было выклеено шрифтом Releigh Black. Название — чем-то каллиграфическим того же времени, вместо чего я нашел на MyFonts новую версию в виде шрифта Gv Time от Bejeletter.</p>\n<p>Конечно, оригинальные шрифты были латинскими, но превратить их в кириллицу не слишком сложно.</p>\n<p>Для имени «Крис Кельми» берутся буквы Kpuc Kev wu. Отличная болгарица, надо только перевернуть v и w, и нарисовать мягкий знак. С переворотом художник справился, а вот мягкий знак немного не в стиле шрифта. Ну да кто заметит.</p>\n<p>С каллиграфической частью всё примерно так же просто. Берём Omkpou Cbou Cegam. Отрываем вынос вверх у «к». Превращаем b в в, g в з, дорисовываем кратки для й — и всё готово. Художник почти справился с задачей, только напрасно приклеил к буквам u малюсенькие тильды. Но, опять же, в худсовете не было шрифтовых дизайнеров, а прочая публика такого не видит.</p>\n<p>Правки обычно делались по фотоотпечатку тушью и белилами. Результат еще раз переснимался — и вуаля.</p>\n<p>После прихода Корел Дро то же самое делалось на компьтере.</p>\n<p>Это чистое, незамутнённое авторским правом пиратство, но разрази меня гром, если я решусь осуждать художника Л. Володина. Мы все так делали, потому что жили в ссср, который все 70 лет своего существования боролся с частной инициативой, от которой и только от которой родятся шрифты.</p>\n<p>Морфологию других советских леттерингов смотрите в подписях к картинкам. Там есть масса любопытного.</p>\n<p>Отдельно хочу сказать о лицензионных пластинах. Как правило, для них изготавливались отличные от оригиналов конверты, даже в тех случаях, когда можно было использовать оригинальное фото. Это связано не только с частыми переменами названий. Фото можно было скопировать. Название можно было воспроизвести, а вот типорафика не давалась.</p>\n<p>В моей подборке есть три лицензионных пластинки. Одна с полностью измененным леттерингом, вторая с попыткой подражания и третья с попыткой копирования. Все три не слишком удались — увидите.</p>\n<p>Одной из самых заметных, забавных, но объяснимых примет советского леттеринга была популянрость шрифта Pump Bold от ITC. Всё просто: его почти не надо переводить, а с виду он как Карлсон: в меру упитанный мужчина в самом расцвете сил.</p>\n<p>Конклюзия: западная типографика (включая шрифты) на обложках фирмы «Мелодия» подвергалась глубокой кустарной пиратской вторичной переработке. Результат был примерно равен качеству печати Апрелевского завода в сравнении с оригинальными образцами. Тем не менее, это был один из самых свободных сегментов советской типографики.</p>\n<p>Прочесав частым гребнем сорок штук апрелевских шедевров, на что ушло трое суток, я полностью переменил свое отношение к этому виду художественной продукции. Раньше мне казалось, что там что-то есть. Видимо, остались юношеские воспоминания о культовых альбомах, восхищение содержанием которых — иногда действительно превосходным — автоматически переносилось на обложку. Посмотрев сейчас, порадовался только всем детским и одной недетской «Алисе». Ну, ладно — еще обложка «Радио Африки» сохранила скромное обаяние.</p>\n<h3>Важное дополнение из сегодняшнего разговора с Галиной Ельшевской</h3>\n<p>Когда заходишь со стороны букв, достаточно открутить один винтик, и вся культура рассыпается на понятные детальки.</p>\n<p>Например, сразу видно, что все эти обложки — лихорадочный поиск языка для понятий, которых нет в культуре.</p>\n<p>Особенно видно при сравнении с западными, где все иерархии выстроены и каждая буковка на своем месте</p>\n<p>Смотрите картинки, слушайте пластинки (если они у вас есть и есть на чем слушать). Некоторую ностальгию испытал даже я.</p>\n<p class=\"ps\"><span class=\"pslabel\">PS</span> При поиске обложек был задействован встроенный в гугл ИИ G-mini (или как его). Поэтому вступительные описания звучат пластмассово. Перед текстами ИИ ставлю метку ГуИ: (гуглоинтеллект)</p>\n<p class=\"ps\"><span class=\"pslabel\">PPS</span> Добавил в хвост одну картинку и под ней дал длиннющую апологию собственной безжалостности</p>", "figs": [["img/21/22-001.jpg", "22-001", "<p>Болгарица от лучших производителей: Хельветика Жукова-Курбатова 1963 года, переведенная в otf неизвестным героем и найденная мной на непочтенном сайте, раздающем чужое задаром</p>", 1.0], ["img/21/22-002.jpg", "22-002", "<p>ГуИ: «Бременские музыканты»<br>Пластинка впервые вышла в 1969 году (параллельно с выходом одноименного мультфильма).<br>Оформление конверта выполнила художница Н. Литвинова.</p><p>Буквы, судя по всему, рисованные (три разных Е, две разных Ы, две совсем разных К). Стиль сказочный, псевдоготический</p>", 1.0], ["img/21/22-003.jpg", "22-003", "<p>ГуИ: Год выпуска: 1970.<br>Издание: Изначально этот стильный графический конверт был создан для 10-дюймового диска-сборника эстрадных композиций «Всем, кто любит песню (№ 14)». На самой обложке крупно выведен знаменитый лозунг: «Нам песня строить и жить помогает!» (строка из «Марша весёлых ребят»). (Текст от Гугл-ИИ, далее ГуИ)</p><p>Имя художника-иллюстратора, оформившего этот конверт, на самой пластинке не указано.</p><p>Рисованный шестидесятнический леттеринг с характерным отскочившим (!)</p>", 1.0], ["img/21/22-004.jpg", "22-004", "<p>ГуИ: обложка советской виниловой пластинки «Старик Хоттабыч» (повесть-сказка Лазаря Лагина в инсценировке Сергея Богомазова и с музыкой Владимира Рубина) от всесоюзной фирмы грамзаписи «Мелодия».<br>• Оригинальный год выпуска: Сама аудиопостановка была записана, а пластинка с данным классическим дизайном конверта впервые выпущена в 1958 году. Впоследствии альбом многократно переиздавался в СССР и современной России (включая официальный ремастеринг «Мелодии»).<br>• Автор обложки (художник): Оформлением этого релиза и иллюстрацией для обложки занимался советский художник И. Акишев</p><p>Ох, не верю я, что это обложка 1958 года. Рисунок — да, но как-то всё слишком отдает 1980-ми</p>", 1.0], ["img/21/22-005.jpg", "22-005", "<p>ГуИ: бложка первого полноформатного диска-гиганта вокально-инструментального ансамбля «Самоцветы» под названием «У нас, молодых», выпущенного всесоюзной фирмой грамзаписи «Мелодия».<br>• Год выпуска: 1975.<br>• Автор обложки: Оформление большинства тиражей этой пластинки выпускалось в типовых, общих или комбинированных конвертах заводов фирмы «Мелодия». Конкретный художник индивидуальной обложки на самом конверте не указывался</p><p>Очень характерный леттеринг начала 1970-х. Перерисовка шрифта типа Бродвей на оригинале-раскладке на две краски (краски немного сместились). Фотка дана в обтравку, но не прямо в край, а «художественно», с запасом, чтоб на ч/б не заехала цветная плашка.</p><p>Дополнительный текст выклеен тупеньким советским гротеском, гулявшим по рукам в виде больших негативов с наборной кассой</p>", 1.0], ["img/21/22-006.jpg", "22-006", "<p>ГуИ: конверт легендарного советского сборника зарубежной поп-музыки «Эстрадная орбита», выпущенного всесоюзной фирмой грамзаписи «Мелодия».<br>• Год выпуска: Оригинальный релиз этой пластинки состоялся в 1974 году.<br>• Автор обложки: Как и на большинстве конвертов массовых серийных сборников «Мелодии» тех лет, имя конкретного штатного художника-оформителя или дизайнера в выходных данных на оборотной стороне не указывалось (оформление числилось за художественной лабораторией или студией грамзаписи фирмы) (не стал править нечелразум).</p><p>Лихой леттеринг начала семидесятых. Грифтовое искусство прошло вдали от автора, но тогда так можно было</p>", 1.0], ["img/21/22-007.jpg", "22-007", "<p>ГуИ: конверт советской виниловой пластинки со сказкой Г. Х. Андерсена «Гадкий утёнок», выпущенной всесоюзной фирмой грамзаписи «Мелодия».<br>• Год выпуска: Оригинальная запись аудиосказки в исполнении Марии Бабановой состоялась в 1961 году. В данном художественном оформлении пластинка (каталожный номер 33Д-7775/76) массово издавалась и переиздавалась начиная со второй половины 1970-х годов (в частности, тиражи 1977, 1978 и последующих годов).<br>• Автор обложки (художник): Оформление конверта выполнила советский художник-иллюстратор Л. Фирсанова</p><p>Пятидесятнический леттеринг. Авторская работа, вполне пристойное качество</p>", 1.0], ["img/21/22-008.jpg", "22-008", "<p>ГуИ: конверт детской виниловой пластинки «Оле-Лукойе» (сказка Г. Х. Андерсена, инсценировка В. Смирновой, музыка Э. Грига), выпущенной всесоюзной фирмой грамзаписи «Мелодия».<br>• Год выпуска: Данное конкретное издание с этим вариантом оформления впервые вышло в 1972 году (в последующие годы, например в 1980 и 1981 гг., выпускались его дополнительные тиражи с аналогичной обложкой). При этом сама радиопостановка с участием Марии Бабановой и Ростислава Плятта была записана значительно раньше — в 1946 году.<br>• Автор обложки: Оформлением и иллюстрацией этого конверта занимался советский художник-график Юрий Молоканов (известный мастер детской книжной и журнальной иллюстрации, долгие годы бывший главным художником журнала «Мурзилка»). Его характерный стиль с яркими силуэтами, сказочными домиками и мягкой прорисовкой персонажей легко узнаваем на обложках детской серии «Мелодии» тех лет.</p><p>Авторский леттеринг в стиле позднего советского барокко. Как почти все детские обложки, смотрится крепко и органично, но дико старомодно. Впрочем, сейчас это уже повод для ностальгии</p>", 1.0], ["img/21/22-009.jpg", "22-009", "<p>ГуИ: обложка детской виниловой грампластинки со сказкой Ганса Христиана Андерсена «Соловей императора», выпущенной всесоюзной фирмой грамзаписи «Мелодия».<br>Оригинальная запись аудиоспектакля была осуществлена в 1967 году, а первая виниловая пластинка с данным художественным оформлением вышла в 1968 году (каталожный номер Д—22567-8). Позже пластинка неоднократно переиздавалась с этой же обложкой вплоть до конца 1980-х и начала 1990-х годов (в 1980, 1983, 1986, 1989 и 1991 годах).<br>Автор обложки (художник): На советских тиражах этой пластинки имя иллюстратора на самом конверте не указывалось</p><p>Как почти всегда на детских обложках леттеринг получше. На этой имя автора так и вовсе написано, а выклеено только название. Опять удивляет похожая на тильду кратка Й. Видимо, так носили, хотя я тогда таких не рисовал</p>", 1.0], ["img/21/22-010.jpg", "22-010", "<p>ГуИ: 1974 год.<br>На фотографии представлена грампластинка-миньон (EP) вокально-инструментального ансамбля «Битлз» (на этикетке обозначен просто как «Вокально-инстр. ансамбль (Англия)») с песнями «Солнце восходит» (Here Comes The Sun) и «Потому что» (Because). Данный стерео-релиз под каталожным номером С62-05613 был впервые выпущен всесоюзной фирмой грамзаписи «Мелодия» в 1974 году.<br>Данная обложка является универсальным (стандартным) фирменным конвертом серии «Эстрада» («Грампластинка — действенное средство эстетического воспитания»), массово выпускавшимся фабриками фирмы «Мелодия» для сотен различных релизов того периода</p><p>Адовый советский леттеринг. Действенное средство. Слово «стерео» переделано из какой-то советской шрифтовой книжки. Слово «эстрада» — болгарица из шести латинских букв и отзеркаленной с. Надо ж, как повезло «переводчику»</p>", 1.0], ["img/21/22-011.jpg", "22-011", "<p>ГуИ: стандартный (универсальный) конверт фирмы «Мелодия» для семидюймовых виниловых пластинок (миньонов).<br>• Год выпуска: Данный тип обложки массово печатался и использовался заводами грампластинок (в частности, Апрелевским) в 1973–1974 годах.<br>• Автор обложки: Это типовой (фирменный) дизайн, разработанный штатными художниками и художественно-конструкторским бюро Всесоюзной студии грамзаписи «Мелодия». На подобных массовых обезличенных конвертах имя конкретного художника-графика на полиграфии не указывалось</p><p>Что-то гуглоИИ подвирает. Это не стандартная, а индивидуальная упаковка. Видимо, он споткнулся о лово «Мелодия», но это название ансамбля, а не издателя.</p><p>Печальный советский леттеринг с попыткой нарисовать буквы из палочек. Но еще более печально стоят «ансамбль» и «стерео».</p><p>Печать в две краски</p>", 1.0], ["img/21/22-012.jpg", "22-012", "<p>ГуИ: обложка винилового альбома «В старых ритмах» инструментального ансамбля «Мелодия» под руководством Георгия Гараняна и Владимира Чижика.<br>• Год выпуска: Альбом был записан и выпущен Всесоюзной фирмой грамзаписи «Мелодия» в 1973 году (номер по каталогу: 33 СМ 04365-66).<br>• Автор обложки: Разработкой визуального оформления (конверта с фотографией первого состава ансамбля) занималось Художественное оформление фирмы «Мелодия»</p><p>Слово «Мелодия» настолько нелепое, что даже симпатичное. Видимо, так в 1973 году представляли старые ритмы.</p><p>Весь текст, кроме названия — наборный, самыми советскими шрифтами: Журнальной рубленой и Литературной. Зачем звёздочка — не знаю</p>", 1.0], ["img/21/22-013.jpg", "22-013", "<p>ГуИ: На изображении представлена коробка-комплект из двух виниловых пластинок «Поэзия Пушкина в музыке» (романсы на слова А. С. Пушкина), выпущенная всесоюзной фирмой грамзаписи «Мелодия».<br>Впервые этот комплект вышел в 1974 году, после чего неоднократно переиздавался (например, в 1984 году).<br>• Автор обложки: Оформлением конвертов и шрифтовым дизайном для этого издания занимался советский художник-график Ю. Бажанов (Юрий Бажанов). На лицевой стороне в овальном медальоне использован знаменитый графический автопортрет самого А. С. Пушкина (хи-хи).</p><p>Рисованный каллиграфический леттеринг одними заглавными. Современные каллиграфы поёжились, но для середины 70-х не так уж печально.</p>", 1.0], ["img/21/22-014.jpg", "22-014", "<p>ГуИ: Культовый концептуальный альбом Давида Тухманова «По волне моей памяти» имеет следующие данные оформления:<br>• Год выпуска: Альбом официально вышел 9 сентября 1976 года на всесоюзной фирме грампластинок «Мелодия».<br>• Автор обложки: Иллюстрацию создал советский художник и музыкант Александр Шварц.<br>Графика создавалась под впечатлением от прослушивания музыкального материала, который композитор лично наигрывал художнику на рояле. В правом нижнем углу лицевой стороны конверта можно увидеть факсимильную подпись автора — «Шварц».</p><p>Прости, ГуИ, в правом нижнем углу написано «Давид Тухманов».</p><p>Когда я в первый раз взял в руки эту обложку, то ужаснулся, насколько она плохо сделана. Внутри была качественная поп-музыка с большой претензией на нечто большее, а снаружи — какой-то капустник.</p><p>Сейчас мне кажется, что эта обложка — удивительный островок свободы с застойном ссср, причем, что особенно странно, прямо на его фасаде. Такое чувство, что обычный советский парень — интеллигентный, конечно, но не из верхних слоев — взял да и нарисовал спроста, что было на уме: Афину с куском копья, какого-то монаха в куколе, и тут же пару мотоциклистов. И буквы пририсовал как в собственном дневнике: кривые, с тенями.</p><p>Очень странная обложка</p>", 1.0], ["img/21/22-015.jpg", "22-015", "<p>ГуИ: На представленном изображении показана обложка знаменитой советской музыкальной сказки (дискоспектакля) «Алиса в Стране чудес» (с песнями Владимира Высоцкого):<br>• Год выпуска: 1976 год<br>• Автор обложки: художник-абсурдист Игорь Лемешев</p><p>Для 1976 года — очень свободная композиция. Весь леттеринг нарисован. Слово «Алиса» — просто буквы, похожие на гротеск. А вот «в стране чудес» — перерисовка главного шрифта фирмы «Мелодия» — ITC Pump</p>", 1.0], ["img/21/22-016.jpg", "22-016", "<p>ГуИ: советская лицензионная виниловая пластинка вокально-инструментального ансамбля «АББА» (одноимённый альбом ABBA, оригинальный релиз которого состоялся на Западе в 1975 году).<br>• Год выпуска в СССР: 1977 год (производство всесоюзной фирмы грамзаписи «Мелодия» по лицензии Polydor International).<br>• Автор обложки: В отличие от оригинального шведского релиза, для которого дизайн создавал Руне Сёдерквист (Rune Söderqvist), для советского издания использовалось официальное промо-фото группы, а графическим оформлением и адаптацией конверта для фирмы «Мелодия» занимался советский художник-иллюстратор Юрий Балашов.</p><p>Слово «АBBA» — гротеск «вообще», без привязки к шрифту. А вот «АББА» — это ITC Pump</p>", 1.0], ["img/21/22-017.jpg", "22-017", "<p>ГуИ: Советская пластинка фирмы «Мелодия» «Луи Армстронг — Какой удивительный мир» (лицензия ABC Records) имеет следующие данные:<br>• Год выпуска: 1978 год.<br>• Автор обложки: Оформление этого релиза является стандартным для ряда джазовых лицензионных пластинок «Мелодии» конца 1970-х годов с узнаваемым шрифтом художественного редактора. Однако конкретное имя художника или фотографа на самом конверте данного издания не указывалось</p><p>«Узнаваемый шрифт художественного редактора» я больше нигде не видел (хотя смутно вспоминается Эллингтон). Сделан он, кажется, вручную, хотя может и отчасти выклейкой. Уже две заглавные буквы, зачем-то решенные по-разному, наводят на мысль, что худред шрифтовиком не был. Однако Футуру до Олимпиады откуда-то нарыл.</p>", 1.0], ["img/21/22-018.jpg", "22-018", "<p>ГуИ: универсальный рекламный конверт Всесоюзной фирмы грамзаписи «Мелодия».<br>• Год выпуска: Такой тип художественного фирменного конверта («Мелодия Стерео» с миниатюрами других популярных пластинок на лицевой стороне) активно использовался заводами фирмы «Мелодия» с конца 1970-х по середину 1980-х годов (в основном в 1979–1984 гг.). Точный год печати конкретного экземпляра обычно указывался на оборотной стороне в самом низу мелким шрифтом (например, «Тип. РЗГ „Мелодия“ 1981» или «Заказ 432. Тираж 10000. 1983 г».).<br>• Автор обложки: Это серийный (универсальный) конверт, над оформлением которого трудились штатные художники и редакторы Ленинградской или Московской студии грамзаписи.</p><p>Ещё один адовый леттеринг. Шрифты один другого краше. Слово «стерео» удачно отболгарено из откуда-то склеенной Гельветики или даже Универса. Всё вместе предвосхищает толкучки 90-х</p>", 1.0], ["img/21/22-019.jpg", "22-019", "<p>ГуИ: обложка виниловой пластинки «Ритмическая гимнастика» (Aerobic Exercises), выпущенной советским лебелем «Мелодия» в 1984–1985 годах.</p><p>Авторами этого новаторского для советской полиграфии оформления стали культовый фотограф Сергей Борисов и художник Юрий Балашов.</p><p>Помнится, в суровом 1985 году эта картинка казалась весьма пикантной.<br>Леттеринг — болгарица на базе ITC American Typewriter, ходившего тогда по рукам в виде самопальной наборной кассы</p>", 1.0], ["img/21/22-020.jpg", "22-020", "<p>ГуИ: Пластинка была записана в 1979 году и массово выпущена всесоюзной фирмой «Мелодия» в 1980 году.<br>Автором этой необычной пластилиновой обложки является советский художник А. Саядянц.</p><p>Наивный леттеринг, поддержанный какой-то непонятно зачем выбранной латинской антиквой.</p>", 1.0], ["img/21/22-021.jpg", "22-021", "<p>ГуИ: Релиз этого сборника впервые состоялся в 1977 году. В последующие годы пластинка неоднократно переиздавалась с этой же обложкой.<br>• Автор обложки: Имя конкретного советского художника-оформителя или фотографа на конвертах данного издания не указывалось.</p><p>Буквы точно советские, но вот откуда стянуты — убей бог, не помню. Простота решения неописуемая, сравнимая с богатыми могильными камнями на советских кладбищах</p>", 1.0], ["img/21/22-022.jpg", "22-022", "<p>ГуИ: обложка пластинки «Пол Маккартни + Ансамбль „Wings“», выпущенной всесоюзной фирмой грамзаписи «Мелодия».<br>• Год выпуска: Пластинка впервые вышла в 1977 году. Издание представляло собой видоизмененную версию знаменитого альбома Band on the Run (1973), где заглавную песню заменили на хит Silly Love Songs.<br>• Автор обложки: Имя конкретного штатного художника или дизайнера Всесоюзной студии грамзаписи, адаптировавшего портрет, на самой обложке не указывалось. В советской практике тех лет авторы графических компиляций для лицензионных пластинок часто оставались анонимными (в выходных данных значились лишь «Художники цеха художественного оформления» или редакторы).</p><p>Простое и незатейливое использование шрифта Pump. Или не его самого, а чего-то из него вышедшего после долгого пиратского пережевывания</p>", 1.0], ["img/21/22-023.jpg", "22-023", "<p>ГуИ: студийный альбом Аллы Пугачёвой «Зеркало души».<br>• Год выпуска: Альбом официально поступил в продажу 1 января 1978 года (записи велись в период с 1975 по 1977 год).<br>• Автор обложки: Фотосессию для финального оформления альбома провёл известный художник-фотограф Вячеслав Манешин.</p><p>Буквы названия похожи на сильно перерисованный шрифт стиля модерн. Но человек, взявшийся за этот леттеринг, явно не представлял, что такое ритм надписи, как должны выглядеть украшения, да и о форме букв имел весьма смутное представление. А ещё — вот беда — в названии 11 разных букв! Пожалуй, эта надпись может претендовать на звание самой мусорной во всей подборке</p>", 1.0], ["img/21/22-024.jpg", "22-024", "<p>ГуИ: Эта виниловая пластинка имеет следующие выходные данные:<br>Год выпуска: Оригинальный релиз данной пластинки состоялся в 1979 году.<br>Автор обложки: Оформлением и графическим дизайном этого конверта занимался советский художник Александр Саядянц. На лицевой стороне изображён стилизованный портрет Иоганна Себастьяна Баха.</p><p>Есть подозрение, что леттеринг нарисован. Или, по крайней мере, нарисованы составляющие его буквы. Большая редкость</p>", 1.0], ["img/21/22-025.jpg", "22-025", "<p>ГуИ: Первые пластинки этой серии с данным дизайном конверта начали выходить в 1979–1980 годах. Записи сонат производились исполнителями Игорем Ойстрахом и Наталией Зерцаловой в период с 1976 по 1979 год.<br>Автор обложки (оформления): Художником-оформителем этой серии конвертов (включающей характерный медальон-барельеф с профилем Моцарта по центру на цветном фоне) является советский график и дизайнер Борис Вечканов.</p><p>Наконец-то чистопородная и беспощадная болгарица! Берем Кларендон (близкий родственник Школьной гарнитуры) и делаем вид, что он sovsem ne umeet po-russki. Настолько, что даже И надо сделать из N, в буквы в, ь, я нарисовать с курсивной затейливостью.</p><p>Но и этого мало. Берем для названия произведений шрифт Olive и фигачим из него окончательную болгарицу. Зелень лавра, доходящая до дрожи.</p>", 1.0], ["img/21/22-026.jpg", "22-026", "<p>ГуИ: культовая обложка дебютного альбома «Disco Alliance» латвийской советской группы «Зодиак» (Zodiac).<br>• Год выпуска: 1980.<br>• Автор обложки: Известная латышская художница Франческа Кирке (Frančeska Kirke), чей фирменный автограф можно заметить в правой части иллюстрации («Kirke F».).</p><p>Прибалтийский вариант обложки с несколькими отличиями от обычных советских. Во-первых, название латиницей, а кириллическая версия выглядит как логотип (болгарицей, конечно). А еще «рок-группа» вместо обычного ВИА, и подпись художницы справа на ободе.<br>Но и здесь не без болгарицы: кириллическое лого Зодиак на самом деле 3oguak</p>", 1.0], ["img/21/22-027.jpg", "22-027", "<p>ГуИ: Год выпуска: 1980 год (пластинка вышла в свет вскоре после смерти артиста).<br>Автор фото на обложке: Борис Палатник. Снимок был сделан во время съемок телепередачи «Кинопанорама» в январе 1980 года</p><p>Посмертный диск Высоцкого со странным леттерингом. Фамилию как будто пытались спрятать, дав тонким прозрачным шрифтом с огромной бессмысленной тенью. Надпись почему-то расположена не по центру, причем не закрытым остается самый светлый кусок фото. Была ли это цензура? Не думаю</p><p>Подумал, что был еще один певец и актер с еврейской фамилией, такой же бешено популярный и тоже женатый на удивительной женщине. Он так же старательно разрушал свою жизнь всем, чем только мог, и умер задолго до естественного срока. Но вот разница:</p><p>Серж Генсбур 1928-1991 (62 года)<br>Владимир Высоцкий 1938-1980 (42 года)</p><p>Просто так написал, вне всякой связи с постом</p>", 1.0], ["img/21/22-028.jpg", "22-028", "<p>ГуИ: Альбом был официально издан всесоюзной фирмой «Мелодия» в сентябре 1982 года.<br>Автор обложки: Оформлением послужила картина художника Сергея Борисовича Симакова (ныне известного как отец Сергий). На полотне изображен романтизированный портрет певицы на фоне экспрессивного пейзажа.</p><p>Еще один невероятный образец советского поп-леттеринга. Тут есть всё: нечитаемый ни в кириллице, ни в латинице техношрифт. Не сочетающийся с ним ни одним штрихом шрифт Pump (строчная болгарица). «Экспрессивный пейзаж» с дробным фоном, на котором под шрифт приходится подкладывать тень, иначе вообще пропадет. Дополнительный наборный гротеск, не бьющийся ни с чем вообще. Если вы не видели ад типографа — любуйтесь</p>", 1.0], ["img/21/22-029.jpg", "22-029", "<p>ГуИ: 1980 год — это официальный год выпуска (первого релиза) оригинального лицензионного сборника «Под музыку Вивальди» оркестра Поля Мориа, изданного всесоюзной фирмой грамзаписи «Мелодия». В последующие годы (1981, 1982, 1983 и т.д.) пластинка с этой же обложкой неоднократно допечатывалась и переиздавалась различными заводами грамзаписи СССР.<br>В качестве автора оформления и обложки на оборотных сторонах конвертов этого тиражируемого издания указывался советский художник-иллюстратор и дизайнер фирмы «Мелодия» Б. Дударев (оформитель конверта), а автором оригинальной портретной фотографии дирижера выступил В. Плотников.</p><p>У этого выдающегося образца совлеттеринга две части: верхняя и нижняя. Сверху — взята некая несоветская антиква вроде Таймса (в 1981 году таймсы еще не бегали по просторам) и дальше ее сначала превратили в болгарицу, а потом долго мучали, налепив буквы друг на друга. Художнику удалась только заглавная П. Остальное (к, л, я) — беда. Особенно л. Или я.</p><p>Нижняя часть собрана из заглавной каллиграфической латиницы, в которую были кое-как врисованы буквы З, Ь, возможно, У. Для З, судя по всему, просто использовали тройку.</p>", 1.0], ["img/21/22-030.jpg", "22-030", "<p>ГуИ: Альбом «Гимн Солнцу» группы Стаса Намина («Цветы»)<br>Год выпуска: 1980.<br>Автор обложки (художник): А. Шегерян</p><p>Самый дерзкий логолеттеринг в моей подборке. Стиль (видимо) ранний совпанк (есть такой?)</p><p>Во всяком случае это бодро, молниеносно, смело до отваги. Внутри магического круга даже логотип группы (чем-то Pump-образным, очень плохо переведенным). Название повторено более смирными буквами, чтобы редактор не плакал, что не читается.</p><p>А совсем внизу всё то же по-английски, причем название тоже дано дважды — слева и справа от имени группы.</p>", 1.0], ["img/21/22-031.jpg", "22-031", "<p>ГуИ: обложка виниловой пластинки «Сюрприз для мсье Леграна» (Surprise for Monsieur Legrand) группы Стаса Намина (советская рок-группа «Цветы»), выпущенная всесоюзной фирмой грамзаписи «Мелодия».<br>Альбом был записан и впервые выпущен в 1983 году. Дополнительные тиражи активно печатались заводами в 1984 году.<br>Дизайн конверта в виде стилизованного авиаконверта с сургучной печатью разработал художник П. Шегерян.</p><p>Игривый псевдопочтовый конверт с печатью, выполненной Футурой Блэк (модный в ссср 80-х трафаретный шрифт, исключительно легкий в переводе).<br>Но самое интересное — народная каллиграфия, которой написаны адреса отправителя и получателя. Это честная попытка вспомнить, не подражая прописям, как от руки пишутся красивые буквы. Получилось нечто вроде канцелярского почерка, которым в ссср заполняли паспорта. Это не слитный курсив, где школьные навыки борются с ефрейторским представлением о красоте. Нарядно</p>", 1.0], ["img/21/22-032.jpg", "22-032", "<p>ГуИ: Этот семидюймовый мини-альбом (миньон) был впервые выпущен всесоюзной фирмой грамзаписи «Мелодия» на виниле и гибких пластинках на рубеже 1982–1983 годов. Сами записи песен «Каскадёры», «А жизнь идёт» и «Прости, Земля» были сделаны Всесоюзной студией грамзаписи в 1982 году.<br>• Автор обложки: Точное имя художника или фотографа на конвертах этого конкретного релиза фирмой «Мелодия» не указывалось.</p><p>Шрифт Broadway исключительно легко переводился, поэтому был весьма распространен на просторах. Слово «группа» выклеено протокольным советским гротеском</p>", 1.0], ["img/21/22-033.jpg", "22-033", "<p>ГуИ: Альбом «Открой свой Сезам» Криса Кельми имеет следующие официальные выходные данные оформления Discogs:<br>• Год выпуска: 1990 год (запись материала проходила в 1989 году) Collectomania.<br>• Фотограф: Е. Матвеев (автор портретного снимка музыканта на лицевой стороне) Discogs.<br>• Художник: Л. Володин (отвечал за графическое оформление и шрифты конверта)</p><p>Шрифты художник позаимствовал, скорее всего, из летрасетовского каталога или из чешской Типографики. Подробности как это было сделано, смотрите в теле поста. Впрочем, в 1990 году то же самое вполне можно было изобразить на компьютере</p>", 1.0], ["img/21/22-034.jpg", "22-034", "<p>ГуИ: Данная пластинка была выпущена всесоюзной фирмой «Мелодия» в 1978 году.<br>Автор обложки неизвестен. На лицевой стороне конверта использована фотография французского фотографа Ж. Меньяна (J. Maignan)</p><p>Первая из трех лицензионных пластинок, упомянутых в тексте. Попытка точно скопировать оригинальную обложку. Неудачная: имя певицы выклеено Авангардом. В оригинале имя и название набраны Футурой</p>", 1.0], ["img/21/22-035.jpg", "22-035", "<p>Альбом французской певицы Коры Вокер (Cora Vaucaire) под названием «Plaisir d&#x27;amour…» (выпущенный лейблом Le Chant du Monde, каталожный номер LDX 74509) имеет следующие данные:<br>Год выпуска: 1973 (в некоторых источниках упоминается конец 1972 года).<br>Автор обложки: Оригинальное оформление конверта (макет/дизайн) для этого релиза на лейбле Le Chant du Monde выполнил французский графический дизайнер и иллюстратор Жан-Поль Теодуль (Jean-Paul Théodule), который в тот период регулярно занимался оформлением пластинок этого издательства</p><p>На оригинальной обложке только Футура. Сама по себе она далеко не шедевр. Но разница в качестве видна сразу</p>", 1.0], ["img/21/22-036.jpg", "22-036", "<p>ГуИ: Первое издание этой пластинки вышло в 1976 году, а массовые дополнительные тиражи активно печатались в 1977 году.</p><p>Оформление обложки:<br>Конкретный автор художественного оформления (художник) на конверте не указан.</p><p>Обычно для лицензионных пластинок делали не те обложки, что были в оригинале. Здесь взяли оригинальное фото и постарались как-то попасть в шрифтовую композицию. Но для начала не попали в шрифт. На следующей картинке — оригинал</p>", 1.0], ["img/21/22-037.jpg", "22-037", "<p>ГуИ: Альбом компиляции «Dave Brubeck’s Greatest Hits» имеет следующие данные:<br>Год выпуска: 1966 год.<br>Автор обложки (фотограф): Автором культового снимка Дэйва Брубека является Генри Паркер (Henry Parker), работавший для фотостудии лейбла Columbia Records.</p><p>Дизайн обложки и уникальная блочная типографика, ставшая визитной карточкой этого релиза, были разработаны штатным графическим дизайнером и арт-директором лейбла Columbia Records — Джоном Бергом (John Berg).<br>Джон Берг — легендарный дизайнер, создавший более 500 обложек для Columbia (включая культовые работы для Боба Дилана, Simon &amp; Garfunkel и Брюса Спрингстина). Для этого сборника Брубека он скомпоновал названия треков в ровную правую колонку, которая идеально дополняет крупные заглавные буквы имени музыканта.</p><p>Оригинал, с которого была сделана предыдущая обложка. Высокий образец западной шестидесятнической типографики. То, о чем я писал в начале главы: сравнивать уровни невозможно</p>", 1.0], ["img/21/22-038.jpg", "22-038", "<p>ГуИ: Данная лицензионная пластинка была выпущена в СССР в 1977 году (хотя оригинальный альбом Main Course вышел на Западе в 1975 году).</p><p>Автор обложки (конверта): Автором оригинального дизайна и иллюстрации для альбома Main Course является знаменитый американский художник-иллюстратор Дрю Струзан (Drew Struzan) совместно со студией Pacific Eye &amp; Ear. На оригинальном конверте была изображена фантазийная иллюстрация с девушкой в ложке.</p><p>Однако всесоюзная фирма «Мелодия» полностью изменила оформление. Для советского релиза использовалась более простая лицевая обложка с фотографией группы, сидящей в студии. Конкретный штатный художник или дизайнер художественной лаборатории «Мелодии», скомпоновавший этот советский вариант конверта, на самом издании не указан</p><p>Электронный мозг во втором абзаце описывает то, что вы увидите на следующей картинке. Её фирма «Мелодия» даже не пыталась воспроизвести</p>", 1.0], ["img/21/22-039.jpg", "22-039", "<p>ГуИ: Альбом Main Course группы Bee Gees был выпущен в 1975 году.<br>Над оформлением этой обложки работала известная дизайнерская студия Pacific Eye &amp; Ear:<br>Дрю Струзан (Drew Struzan) — американский художник, создавший иллюстрацию. Впоследствии он стал всемирно знаменит как автор культовых киноплакатов («Назад в будущее», «Звёздные войны», «Индиана Джонс»).<br>Эрни Чефалу (Ernie Cefalu) — креативный арт-директор студии, который разработал для этой обложки знаменитый фирменный шрифт-логотип группы Bee Gees</p><p>No comments</p>", 1.0], ["img/21/22-040.jpg", "22-040", "<p>ГуИ: обложка официального сборника рок-группы «Машина времени» под названием «В добрый час».<br>Пластинка была издана всесоюзной фирмой «Мелодия» 14 октябр
