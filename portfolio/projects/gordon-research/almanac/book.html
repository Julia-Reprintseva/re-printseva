5-021.jpg", "05-021", "<b>Кировская. Вестибюль, 1935</b><p>Надпись «МЕТРО» почти как современная, но есть нюансы: буква М поуже, а у Е более решительная нижняя челюсть</p><p>Логотип М явно великоват. Названия станции нет</p>", 1.0], ["img/05/05-022.jpg", "05-022", "<p>Лубянка. Портал вписан в дом. Надпись «МЕТРО» палочного вида уехала аж на крышу. А вот логотипа М нет. Над арками фриз с какими-то прославленцами новой жизни. Названия станции нет, но есть надписи «вход»</p>", 1.0], ["img/05/05-023.jpg", "05-023", "<p>Станция «Охотный ряд» (в будущем «им. Канановича», «Проспект Маркса», «Охотный ряд»). Над входом с Тверской квадратичная надпись «МЕТРО» и статуи псевдоантичных атлетов. По углам логотипы М. 1935</p><p>Бонус: красивый белый регулировщик на первом плане в английском шлеме и раннемосковский автобус на втором</p><p>На нижнем фото вход в гостинице «Москва». Тоже, похоже, 1935 (?)</p><p>Надпись «МЕТРО» (внимание) палочная, но с косоугольной М! Интересно, ее одну поменяли, когда приняли логотип?</p><p>На углу лого М. Сверху, загораживая пару окон, журит глазами главный метробог.</p><p>Названия станции (вы догадались) нет, зато есть классическое метрошное «вход вход вход нет входа»</p>", 1.0], ["img/05/05-024.jpg", "05-024", "<b>Библиотека имени Ленина. Вход праворучь от Пашкова дома. 1935</b><p>Внизу эскиз с названием станции (!) Стилистика — ардеко. Огромные декоративные решетки на окнах в виде буквы М. В готовом вестибюле они упростились и вписаны в круг монограммой ММ</p>", 1.0], ["img/05/05-025.jpg", "05-025", "<p>Библиотека имени Ленина. 1935<br>Два разных по стилю вестибюля — от библиотеки и от Пашкова дома.</p><p>Тот, что от библиотеки, мавзолейного типа, с палочной надписью «МЕТРО» и логотипом по диагонали.</p><p>Второй ардекошный, с логотипом М на боку и с крупноблочной хвалой некому Кагановичу по карнизу (причем буква Ч выпала из строя)</p><p>Названия станции нет (а ведь собирались), зато есть надпись «вход»</p><p>Вот мы всё: «унификация, централизация» — а тут стоят два входа на одну станцию вообще как не родные.</p><p>Бонус: раннемосковский троллейбус</p>", 1.0], ["img/05/05-026.jpg", "05-026", "<b>Библиотека имени Ленина, кассы. 1935 или около того</b><p>Надпись «КАССЫ» и все прочие во вневременном «стиле плакатного пера».</p><p>Над окном кассы и (контрольная в голову сверху) — трижды отабличено повелительным инфинитивом: «деньги проверять не отходя от кассы»!</p><p>Очень интересно: на двух табличках написано: «дежурный кассир» — и окошко для сменной надписи. Кассиры менялись по несколько раз в сутки. Как они могли вставить свое имя, если табличка приделана на стекло с внешней стороны? Неужели был хитрый механический интерфейс удалённого перекассиривания? Что-то не верится. Кстати, левое окошко пусто. А вот справа какие-то буквы есть.</p><p>За спиной гражданина в кепке виднеется схема метро</p>", 1.0], ["img/05/05-027.jpg", "05-027", "<b>Библиотека имени Ленина, навигация. 1935</b><p>На первом плане указатель при входе: туда и сюда. Потом световое табло в начале/конце платформы, где появлялось сообщение о том, куда идет поезд. Где-то на путевых стенах написано название станции, но его не видно. Вроде бы, оно должно быть на табличке справа, укрепленной по центру большущей белой рамы. Но там надпись в две строки, а названия — даже длинные — всегда вытягивали в строку. Может быть, там сообщение «остановка первого вагона»?</p>", 1.0], ["img/05/05-028.jpg", "05-028", "<p>Дворец Советов (Кропоткинская). Ранний эскиз вестибюля. Стиль «нежное вднх с послевкусием постконструктивизма».</p><p>Лого М нет</p><p>Надпись «МЕТРО» очень модная, ардекошная: тонкий геометрический гротеск, юникейс, трехногая m</p>", 1.0], ["img/05/05-029.jpg", "05-029", "<p>Кропоткинская (Дворец советов). Стиль «садовая беседка гражданки Помпадур», но если честно — нарядные ворота бульвара.</p><p>Два вида на вестибюль почти с одной точки. Вроде как 1935, но:</p><p>На верхней картинке железный Лазарь почтен модным гротеском-времянкой радугой по крыше, а на нижней растянут антиквой внутри арки. Антиква как бы солиднее и должна была появиться позже гротеска, но:</p><p>На верхней картинке деревья на Гоголевском доходят до второго этажа дальнего дома, а на нижней до третьего.</p><p>А также: на верхней картинке по бокам от арки логотипы М, а на нижней надписи «МЕТРО». По идее, логотипы должны появиться позже палочных надписей, но:</p><p>На нижней картинке по фризу натянуты духоподъемные лозунги, а на верхней их нет. Вроде лозунг — друг открытия? Или просто первомай?</p><p>Всё это было навсегда, но постоянно елозило</p>", 1.0], ["img/05/05-030.jpg", "05-030", "<b>Кропоткинская (Дворец Советов). 1935</b><p>Вид на вестибюль сзади, со стороны Гоголевского. Две огромных М глядят на бульвар, но входа по ходу движения нет.</p><p>Пройди под ярмом арки, гражданин хороший, насладись видом супердворца, и только потом, просветленный, делай кругом марш в подземелье.</p><p>Там, где небо слева, должны были каскадом спускаться отроги колоссального Дворца с годзиллоразмерным вождём на башне</p>", 1.0], ["img/05/05-031.jpg", "05-031", "<p>Кропоткинская, навигация в разные эпохи и от разных входов. Сверху семидесятые, вход с бульвара: на полу гранит, на указателе станции от Юго-Западной до Сокольников.</p><p>Снизу 1935. На полу асфальт, на указателе (вход с бульвара): налево к Парку, направо к центру.</p><p>Что удобнее?<br>Вроде, проще старый указатель. Во-первых, он крупный. Но если тебе надо не в центр, а Москву ты не знаешь, то задумаешься: а куда в Сокольники? То есть лучше более новый?</p><p>С другой стороны, спускаться по лестнице, одновременно вчитываясь в мелкобуквенный указатель в поиске нужной станции, тоже не слишком эргономично.</p><p>А еще непонятно, почему на подробном указателе левые названия в узкой колонке, а правые в широкой-широкой? Отдел оформления, дай ответ? Не дает ответа</p>", 1.0], ["img/05/05-032.jpg", "05-032", "<b>Дворец Советов (Кропоткинская). 1935</b><p>Шлангист моет путевую стену с надписью «Дворец советов», выполненную «стандартным» гротеском.</p><p>Сейчас на Кропоткинской антиква</p>", 1.0], ["img/05/05-033.jpg", "05-033", "<p>Выемка грунта прямо под портиком ГМИИ им. Пушкина. Как пошутили бы через 15 лет, ищут корни космополитизма.</p><p>Лень гуглить, но когда у художников Р.С.Ф.С.Р. был XV юбилей — вряд ли это 1932 год?</p><p>Стиль эмблемы — поздний, причесанный конструктивизм с выпадением волос в виде буквы Т</p>", 1.0], ["img/05/05-034.jpg", "05-034", "<b>Парк культуры (вестибюль радиуса на месте будущей кольцевой). Эскиз</b><p>Слово «МЕТРО» палочное, стиль павильона — постконструктивизм</p><p>Логотипа М нет. Названия станции нет</p>", 1.0], ["img/05/05-035.jpg", "05-035", "<b>Два вестибюля Парка культуры, похожие друг на друга, как параллелепипед на цилиндр. 1935</b><p>Но оба — постконструктивизм.</p><p>Надписи «МЕТРО» в обоих случаях антиквой. Такого не было ни на одной другой станции первой линии.</p><p>На прямоугольном вестибюле она для верности продублировала — рельефом, с торца, другим, более изящным шрифтом. Такая же рельефная М смотрит вбок, на Садовое. А прямо над ней по диагонали на палке поставлен М-логотип. Второй такой же направлен по диагонали в сторону Комсомольского проспекта.</p><p>На ротонде за монументальной надписью «МЕТРО» притаилась надпись помельче: «метро им. Л. М. Кагановича».</p><p>А лого М стоят на самой крыше, причем их, судя по всему, четыре, и они наклонены друг к другу! А между ними проросла тоненькая шпилявка со звездочкой.</p><p>На лбу прямоугольного входа нет Лазаря, зато позабыт какой-то лозунг. А вот слово «вход» в одном случае крупное на табличке, как на других станциях, а в другом — прямо по стеклу, но мелкое.</p><p>За прямоугольным вестибюлем виден конструктивистский дом. Сравним, насколько новый имперский стиль богаче и нарядней суровых форм авангарда.</p><p>А совсем слева, за забором, доживает последние дни деревянная развалюшка</p>", 1.0], ["img/05/05-036.jpg", "05-036", "<b>Парк культуры и не курения. 1935</b>", 1.0], ["img/05/05-037.jpg", "05-037", "<p>Названия станций на путевой стене. Цветные фото — современные, ч/б — 1935 год. Часть первая, Сокольники — Красные ворота.</p><p>Мне кажется, что здесь прослеживается некий общий шрифт: плотный металлический геометрический гротеск с круглыми О, С и характерными плоскоголовыми А. Таким шрифтом набраны «Сокольники», «Красносельская», старая надпись «Красные ворота».</p><p>Надпись «Комсомольская» сделана довольно наивной антиквой с робкими засечками и неловкими, слишком тонкими ветками К. Такая же антиква на фризе при входе. Думаю, они из тридцатых.</p><p>А вот нынешняя надпись «Красные ворота» как будто из конца сороковых. Может, поменяли, когда переименовали в «Лермонтовскую»? Но это было в 1962-м. Загадка.</p><p>Надпись «Кировская» взята из компьютерной визуализации. Думаю, оригинальный гротеск был такой же, как на Красных воротах</p>", 1.0], ["img/05/05-038.jpg", "05-038", "<p>Названия станций на путевой стене. Цветные фото — современные, ч/б — 1935 год. Часть вторая, Лубянка — Парк культуры.</p><p>Две станции из четырех — Библиотека и Дворец советов — имели «стандартный» сокольнический гротеск. Возможно, такой же был и на Охотном ряду, потому что сегодняшний новодел на черной плашке как бы к нему отсылает. Что было на Лубянке — не знаю.</p><p>Буквы Кропоткинской такие же, как на Красных воротах — проверил наложением. Обе станции переименовывались, правда в разное время. К моменту переименования метро уже могло восприниматься управляющей компанией как некая целостная визуальная система (хотя бы в пределах одной линии). Ну, или просто формы остались )</p><p>Буквы на радиальном Парке не похожи ни на какие другие. Типологически они ближе к надписям на Кольцевой. Опять-таки: не знаю, есть в этом замысел или они — след непримиримой борьбы проектировщиков вестибюлей )</p>", 1.0], ["img/05/05-039.jpg", "05-039", "<b>Логотип М на технической дверце. Середина тридцатых, стиль ардеко</b>", 1.0], ["img/05/05-040.jpg", "05-040", "<p>Две навигационных таблички с путевой стены станции Комсомольская. В реальности они висят в разных местах в начале перрона, но на одном уровне.</p><p>Судя по всему, они старые, тридцатых годов. Они выполнены в одной технике: глянцевая глазурь на металле. У них одна ЦА — пассажиры, и одна функция: направить людей в нужное место.</p><p>То, что они разного цвета и с разными шрифтами — лучшее свидетельство не просто отсутствия дизайна, но отсутствия представления о том, что такое навигационная система.</p><p>Антикву рисовал оформитель с некоторыми художественными амбициями. Гротеск строил менее опытный оформитель, поэтому и шрифт проще, и буквы гуляют вольнее.</p>", 1.0], ["img/05/05-041.jpg", "05-041", "<p>Две стандартных памятных таблички сложной судьбы, одна из Сокольников, вторая с Красносельской. Обе тридцатых, может быть сразу и прикручены. У верхней тоже есть низ с названием станции, но он не попал на фото.</p><p>Долгое время обе прославляли товарища Кагановича, но потом в Ленинграде выкопали свою подземку и посвятили ее Ленину.</p><p>И тут начальство (не знаю, какого уровня) схватилось за голову: в Питере целый Ленин, а в Москве непойми кто, да еще и не мёртвый, то есть не вечноживой, да к тому же с такой фамилией!</p><p>На счастье т. Каганович внезапно оступился вместе с тт. Молотовым и Маленковым, да еще примкнул к себе какого-то сомнительного т. Шепилова. В более суровые времена за такое Лазарь бы живо сошел во гроб, но эпоха была вегетарьянская и дело кончилось персональной пенсией.</p><p>А место негодника на всех входах-выходах (и на мемориальных табличках) занял единственно верный к тому моменту вождь.</p><p>Однако кое-какие следы железного наркома железным Лениным не были окончательно перекрыты. И что особенно странно: на одинаковые таблички прикрутили разных Ленинов. А вы говорите компанейщина и плановое хозяйство.</p>", 1.0], ["img/05/05-042.jpg", "05-042", "<b>Автоматы конфектный и папиросный. Попытка наладить мелкую торговлю в вестибюлях.</b><p>Не вижу, что за герб на фураже товарища, пытающегося угостить девушку конфектой.</p><p>А за ее спиной не карта ли Москвы вывороткой?</p><p>Стиль надписей — ардеко, причем неплохое</p>", 1.0], ["img/05/05-043.jpg", "05-043", "<b>Стильный билетный автомат тридцатых с логотипом М.</b><p>Стиль ардеко.</p><p>Стильный советский человек в микропапахе, кожаном полувоенном пальто и валенках с галошами</p>", 1.0], ["img/05/05-044.jpg", "05-044", "<b>План первой линии метро. 1935</b><p>Напечатан в три краски (если это печать, а не оригинал).</p><p>Все тексты написаны вручную, даже те, что можно было бы набрать.</p><p>Черная мелочь — чертёжный шрифт.<br>Остальное — гротеск ардеко на базе того же чертёжного шрифта.</p><p>Работа выполнена старательно, но есть ощущение, что красную краску шлёпнули просто поверх готового плана (некоторые названия станций перекрывают имена улиц).</p><p>Самая важная информация — время доезда от станции до станции в минутах. Для тогдашней Москвы вторая космическая скорость.</p>", 1.0], ["img/05/05-045.jpg", "05-045", "<p>Монументальная реклама строительства метрополитена. Странно, что на плане отсутствует уже тогда запроектированная кольцевая линия.</p><p>Стиль как бы конструктивистский, но шрифты уже непалочные</p>", 1.0], ["img/05/05-046.jpg", "05-046", "<p>Наглядная агитация Метростроя.<br>Месячник штурма прохождения шахт.<br>Да здравствует ВКПб, вождь и организатор побед социализма.</p><p>Стиль «народный конструктивизм»</p>", 1.0], ["img/05/05-047.jpg", "05-047", "<b>Просто для очистки глаз: станция метро Мондриянцево. Первая половина 21 века</b><p>Не то, чтоб я сходил с ума от восторга, но хочу напомнить: метро могло бы быть совсем другим — причем и тогда, в первой половине прошлого века, тоже. Все необходимые для этого скотчи т. Мондриан уже успел к тому времени наклеить</p>", 1.0]], "research": {"task": "Проанализировать надписи метро по семи группам — наружные, на платформах, навигационные, памятные, технические, вагонные, временные; определить стилистику, проследить изменения, разобрать тексты по содержанию.", "work": "Промпт собран по требованиям OpenAI к GPT-5: цель, входные данные, критерии качества, формат, верификация. Perplexity нашёл 245 источников; GPT-5 написал эссе на 13 страниц с классификацией и оговорками по датировкам — и сам предложил проверки, которых в задании не было.", "tools": "Perplexity, ChatGPT GPT-5 Deep Research", "dates": "август — сентябрь 2025"}}, {"intro": false, "num": "06", "title": "Глава о советских вывесках и витринах 1930-х («Лампы сияют, цены снижены»)", "ptitle": "Лампы сияют, цены снижены", "subtitle": "Советские вывески и витрины эпохи великого перелома", "date": "4 октября 2025 г.", "perm": "https://www.facebook.com/story.php?story_fbid=25178341208439987&id=100000723643455", "slug": "vyveski", "html": "<div class=\"epi\"><p>«Советскую наружную рекламу отличали самобытность, непохожесть на западную, и проявлялось это в мягкости, чувствительности, задушевности ее характера. Наружная реклама находила отклик в душе человека своей проницательностью и честностью. Ей были чужды агрессия и навязчивость, нескромность и наглость, потому что люди, жившие в СССР, отличались чувством сострадания, верности, дружбы, сентиментальностью»*.</p></div>\n<div class=\"orn\" role=\"separator\"><b></b></div>\n<p><span class=\"dc\">Т</span>орговля — лучшее из человеческих занятий, совершенно незаслуженно проклятое в культуре русского языка. Причем проклятое с обоих концов: с «народного» поговоркой «не обманешь — не продашь», а с «интеллигентского» — Карлом Марксом с его лютой ненавистью к частному капиталу и прибавочной стоимости.</p>\n<p>Реклама — весёлая дочь торговли. Да, часто слишком навязчивая, слишком сладкая, слишком неразборчивая в обольщении. Но зато приносящая радость дурацкой покупки и самодовольство от обладания очередным пирожком цивилизации, что, собственно, и делает нас людьми.</p>\n<p>В предреволюционной Российской империи реклама была густой, яркой и повсеместной — особенно наружная в больших городах. Вывесок и витрин было столько, что на центральных улицах архитектура полностью пропадала под буквами и картинками, зазывавшими, манившими и обещавшими что угодно, от рюмки водки до «синьки в пакетикахъ и мешочкахъ тов. Ратнеръ» (реальная вывеска заведения, принадлежавшего предкам лучшего друга моего папы).</p>\n<p>(ссылка на главу о рекламе до 1917 в комм.).</p>\n<p>Военный коммунизм укокошил рекламу вместе с прочей нормальной жизнью. НЭП ее возродил, но общество уже было отравлено марксом.</p>\n<p>Коммунисты не любили деньги (ссылка на главу о советских деньгах в комм.), потому что деньги — это свобода, а у них вместо нее была осознанная необходимость жить по талонам.</p>\n<p>Впрочем, когда припирало, большевики с неподражаемым цинизмом использовали рыночные отношения в своих интересах (см. «Торгсин»**).</p>\n<p>Но обычно старались минимизировать возможность выбора, а если чего рекламировали — то оно с гарантией было непродавабельно никак иначе или отсутствовало ввиду дефицита.</p>\n<p>Нет ничего скучнее советской вывески и советской витрины. Но вы, вслед за автором, посмотрев картинки к этой главе, разумеется, растечетесь сентиментом и ностальгией. Потому что даже чудовищная реклама содержит достаточно сахара, особенно когда засахаривается лет девяносто.</p>\n<p>Советская магазинная вывеска резко отличается от дореволюционной и нэпманской. И дело не в ятях и не в количестве теней и завитушек у букв. Советская вывеска безлична.</p>\n<p>Вместо имени владельца, марки товара и уточняющей детали — например: «Магазин Елисеева и погреба русских и иностранных вин» — просто сообщение о том, что здесь должны быть «Продукты», «Обувь» или «Гастроном» (довольно странное название, похожее на остаток былой роскоши).</p>\n<p>То же с витринами. В нормальном мире витрина — главный источник соблазна, самое индивидуальное, авторское, творческое место магазина. В ссср существовал специальный «Альбом образцов торговых витрин» (ссылка в комм.), где типовой продмаг или типовой магазин роскоши могли подсмотреть, как им заполнить место между внешними стёклами. Пару образцов выкладываю среди картинок к посту.</p>\n<p>Конечно, жизнь сложнее схем, в том числе той, что у меня в предыдущих абзацах. Со временем в ссср появились даже «фирменные» магазины, да и начальственные рекомендации существуют для того, чтоб их обходить. В конце 70-х мне довелось посмотреть, как работал матёрый халтурщик-оформитель со звучным именем Тагир Закирович Хусаинов, задувший павлиньей аэрографией все витрины в окрестностях платформы Вешняки.</p>\n<p>Но это изыск поздней эпохи. В целом советский человек ходил за хлебом в типовой магазин «Хлеб» (или в «Булочную»), а за лекарствами в безымянную «Аптеку». Вывески этих заведений были стандартными. Витрины — скучными, а иногда и пустыми. Лучшей рекламой советского магазина была очередь у входа. Именно она возбуждала у потребителя живой вопрос: «что дают?»</p>\n<p>Но было одно исключение — в «Торгсин». Этот удивительный гриб-паразит, мгновенно выросший на сухом теле коммунистического ссср, выкачавший из населения сотни тонн золота и так же быстро сдувшийся. Там в разные периоды покупалось всё, чего было не достать иначе — от муки до грелок, от сахара до чёрной икры. Там были другие деньги, своя реклама, чрезвычайно агрессивная, настоящие рыночные отношения. Торгсин был брендом, сетью, мемом — всем, чего не должно было быть в большевистском мире. Но главное: это был архипелаг настоящего, предельно циничного и безжалостного монополистического капитализма. Гениальная идея: довести людей до голода, а потом втридорога продавать им муку и хлеб за личные золотые запасы — монетки, сережки, нательные крестики… или за твердую валюту, полученную от сострадательных родственников из-за кордона.</p>\n<p>Изначально в золотодобыче коммунисты полагались на ЧК с экспроприациями, а в Торгсинах продавали за валюту сувениры для иностранцев. Но нашелся один директор по фамилии Курлянд (см. коммент. ***), пустивший голодных сограждан сдавать золотишко на лом. И они понесли — добровольно! — да так, что торгсинов быстро стала тысяча, они выскочили буквально везде, где у граждан завалялось хоть что-то драгметаллическое.</p>\n<p>Подробности о Торгсине читайте в двух книгах, вышедших в серии Historia Rossica. Это не самая кровавая, но возможно самая бесстыдная из историй взаимоотношений власти и населения в ссср.</p>\n<p>Однако я никак не дойду до букв. С ними, вообще-то, всё куда веселей, чем с образцами витрин из типового альбома.</p>\n<p>Дореволюционная вывесочно-витринная индустрия сильно просела в военный коммунизм, и даже НЭП не сумел ее полностью восстановить. Советские вывески 20-х похуже имперских до 1913 года (уж не говоря о прекращении поставок из Германии).</p>\n<p>Централизованные рекламные предприятия стали делать то же, что национализированные типографии: гнать план по валу за счет разнообразия и сложности. Меньше шрифтов — меньше проблем.</p>\n<p>Еще один удар по рекламным фильдеперсам нанесли конструктивисты, внедрявшие палочные шрифты даже в пропаганду детских сосок. Это было всегда решительно, почти всегда неумело, часто талантливо, в редчайших случаях гениально.</p>\n<p>В подборке картинок к посту я внимательно рассматриваю разные шрифтовые случаи — смотрите, читайте подписи.</p>\n<p>Но что сильнее всего бросается в глаза на советской улице с начала тридцатых — да и пожалуй до конца восьмидесятых — букв по сравнению с 1913 годом стало намного меньше. Даже гигантские крышные установки со всякими славами вождям и призывами хранить деньги в сберкассе не давали того густого навара, который пенился на Тверской и Невском в эпоху первоначального накопления.</p>\n<p>Торговая улица десятых годов — пышная и кичливая, обольстительная и гордая собой.</p>\n<p>Та же улица в середине двадцатых — сильно потёрханная, веселая, хитрованская и жуликоватая, но старающаяся держать фасон, где можно покрикивая лозунгами.</p>\n<p>В тридцатые улицу перекроили, настроили высоких домов, и она стала чинной, нарядной — но скучной. Советская улица — витрина достижений не человека, даже не сообществ людей, но левиафана.</p>\n<p>И что еще заметно на фотографиях Москвы — даже Москвы — начала тридцатых: это чрезвычайно бедное и архаичное общество, где извозчик был органичнее авто, а двухэтажный облезлый домик с ужасом косился на кубистические чудеса новой архитектуры (а потом пал, дав место всяким жолтовским палладиям).</p>\n<p>Торгсин резко выбивается из этой картины. Это первый в советской истории настоящий крупный бренд — с настойчиво употребляемым логотипом, с особым способом подачи информации, с явным упором на продажи, а не на показуху. Странным образом в этом чудовищном предприятии проглядывает та индустриализация, которая должна была произойти в России без большевиков.</p>\n<p>Совсем забыл: в Москве в 1931 появились первые светящиеся вывески. И быстро стали популярны — например, слово «МЕТРО» на вестибюлях первой ветки почти всегда светилось.</p>\n<p>Сколько было неона, не очень представляю, но вспомнил о многочисленных упоминаниях о бегущих светящихся буквах у Набокова — а это конец двадцатых в бедной Веймарской Германии — и решил сильно не напирать на достижения советской электрификации.</p>\n<p>Конклюзия. Советские вывески и витрины времен первых пятилеток — попытка заменить торговую рекламу распределительной системой. Затея удалась — вывески поскучнели и перестали мешать демонстрации фасадов. Буквы стали проще, технологичней, избавились от золотых подложек и обзавелись подсветкой.</p>\n<p>Пожалуй, можно сказать о трех стилях надписей.</p>\n<p>Один продолжал дореволюционную традицию, но без тогдашнего шика (см. вывески «Мясо» и «Обувь» из моей подборки). Это провинциальный, ностальгический стиль тоски по 1913 году. В наше время он вывернулся в любовь ко всему советскому.</p>\n<p>Второй — постконструктивистский: упрощение формы, объемные буквы, часто вертикальные композиции. Это размашистый стиль «ща мы вам покажем», сознательно отстраивающийся от мировых образцов (см. гигантский «Продмаг»). В торговле он не задержался, а вот в пропаганде дожил до позднего брежневского брутализма. Оба стиля рассчитаны на внутреннее потребление.</p>\n<p>Третий стиль — торгсиновско-экспортный. Там всё ровно наоборот. Буквы нового индустриального стиля и ардеко, все отсылки — к последней западной моде, профессионализм и качество на хорошем уровне.</p>\n<div class=\"orn\" role=\"separator\"><b></b></div>\n<p>Этот пост-глава сопровождается глубоким исследованием от Gemini, сделанным на базе материалов, добытых и обработанных Перплексити и Чатом GPT.</p>\n<p>Там, для охлаждения ностальгического пыла, имеется подробное сравнение цветущей советской рекламы времен, когда жить стало веселее, с американской жуткого периода Великой депрессии и европейской страшного периода великой послевоенной разрухи.</p>\n<p>Эссе от Gemini стоит посмотреть, в том числе, из-за любопытного заключительного аккорда. (Ссылка в комм).</p>\n<p>С каждым туром общения с ИИ моя зависимость от него растет. Нейронки всё лучше ищут, всё точней формулируют, всё меньше врут. А мой партнер и нейрокапитан Юлия Репринцева всё изощреннее тасует и комбинирует возможности сетей (ссылка на ее отчет в комментарии).</p>", "figs": [["img/06/06-001.jpg", "06-001", "<b>Витрина двадцатых. Слева банкир, справа, скорее всего, торговец обувью.</b>", 1.0], ["img/06/06-002.jpg", "06-002", "<b>Витрина НЭПа. Парикмахерская.</b><p>Предельная завлекательность, внимание к мельчайшим деталям. Справа внизу на бархатной подложке отрезанная ручка с маникюром.</p>", 1.0], ["img/06/06-003.jpg", "06-003", "<p>Печатное объявление времен НЭПа. От дореволюционного отличается только новой орфографией и Совнаркомовской улицей. Шрифты, как видим, еще не переплавлены.<br>Выходные данные: Мосгублит (одобрено?), тип. Лейбман, Лубянский проезд. Тираж 2000</p>", 1.0], ["img/06/06-004.jpg", "06-004", "<p>Продавец баварского кваса и морса по 20 к. за стакан. 1920-е. Народный леттеринг в стиле арнуво</p>", 1.0], ["img/06/06-005.jpg", "06-005", "<p>Киоск «Союзпечати». Конец 1920-х.<br>«Логотип» в переходном от арнуво к конструктивизму стиле. Сделан довольно неплохо, даже удивительно видеть его над такой кустарной развалюшкой. На первом плане висят листочки с модами. Из журналов я смог определить только «Пионер».</p><p>Не знаю, как раскрашивали эти снимки, но пробирает.</p>", 1.0], ["img/06/06-006.jpg", "06-006", "<b>Москва, центр, середина двадцатых.</b><p>Слева самодельная, но завлекательная вывеска столовой: вкусно, дешево, уютно. Стиль букв — коммерческий, народное арнуво.</p><p>Вдали перетяжка, на ней тоже столовая — «Оливье».</p><p>В раннесоветское время слово «ресторан» было табу. Но потом попустило.</p><p>Заметим: много пешеходов (значит, нет общественного транспорта), извозчики, развозчики с тележками. Авто не видать.</p>", 1.0], ["img/06/06-007.jpg", "06-007", "<p>Тверская улица в районе Камергерского переулка. Конец 1920-х. Слева «ситиформат» с рекламой Госуд. электрической конторы «Мосэлемент». Радио, граммофоны, телефоны. Еще левее вывеска ремонта пишущих машин. На круглом знаке — объявление, судя по всему, продмага: «торговля до 12 часов ночи». На перетяжке — если не ошибаюсь — открытие кабаре «Флора» с обедами и оркестром (!) Еще дальше перетяжка «Народные гуляния».</p><p>Авто всё ещё отсутствуют, но жизнь явно налаживается.</p><p>Стилистика всех вывесок дореволюционная. А вот «Флора» уже из следующей эпохи</p>", 1.0], ["img/06/06-008.jpg", "06-008", "<p>Бывшие крестьяне, ныне колхозники, прилаживают вывеску Правления кр=октябрьской с/х артели колхоза имени Цвиллинга. Судя по старательности леттерингиста, это еще не самые жуткие времена, где-то 1929-1930.</p><p>Стиль надписи — народно-коммерческий, делал явно специалист-артельщик.</p>", 1.0], ["img/06/06-009.jpg", "06-009", "<p>Демонстрация за лучшее обслуживание рабочих на маршруте трамвая №4 (читается: Арбат-Русаковская). Видимо, конец 1920-х.</p><p>Стиль транспаранта — коммерческое арнуво. Сделано чисто, празднично.<br>Стиль надписи на трамвае — раннекоммерческий. На другом фото были цифры на остановке — такие же затейливые.</p>", 1.0], ["img/06/06-010.jpg", "06-010", "<p>Клуб завода «Каучук» на Плющихе. Архитектор Мельников. Судя по 10-й годовщине — не раньше 1927 года. Скорее позже.</p><p>Надпись конструктивистская, то есть заполошно-палочная. Десятка модная, футуристая.</p><p>Справа объявление, видимо о спектакле «Красный мак». Тоже палочное. Единый стиль.</p>", 1.0], ["img/06/06-011.jpg", "06-011", "<b>Фабрика-кухня МОСПО №1. Столовая. 1928 год, архитектор Мешков.</b><p>Чистейший, беспримесный конструктивизм до последней буквы. Леттеринг хорошо сравнить с каучуковским — бывают же и чистые решения.</p><p>А еще отмотайте назад — в каком городе приземлился этот нло</p>", 1.0], ["img/06/06-012.jpg", "06-012", "<b>Рекламный блок на Ленинградском вокзале. 1930.</b><p>Удивительная вещь. Настоящий газетный классифайд, но в цвете (!) и в формате постера.</p><p>Это реальная коммерческая реклама. Мало того: набранная недопереплавленными шрифтами с весьма сложной вёрсткой. С адресами, подробностями. Как будто не в великопереломном ссср отпечатана, а в нормальной стране с рыночной экономикой.</p><p>Рисованные шрифты шапки и подвала — прямиком из шрифтовых альбомов 1927 года</p>", 1.0], ["img/06/06-013.jpg", "06-013", "<b>Вывеска над воротами завода «Серп и молот». Начало 1930х.</b><p>Классика жанра: металлические буквы приварены к сетке.<br>Стиль — ранний сталинский. Вполне приличные рисованные гротески с главным словом «Сталь» антиквой.<br>В слове «об’единение» апостроф вместо ъ</p>", 1.0], ["img/06/06-014.jpg", "06-014", "<b>Смоленский гастроном в виде продмага. Доторгсиновские времена, наверное 1930-31.</b><p>Вывеска конструктивизма. Мощь, презрение к быту. Продмаг для заправки совчела с’едпродуктом. Но лампы уже сияют.</p>", 1.0], ["img/06/06-015.jpg", "06-015", "<p>Торгсин (нет, Torgsin) в Москве. 1931 год. Постовой регулировщик отдает команду извозчику. В витрине видна буржуазная занавеска.</p><p>Стиль вывески — западный коммерческий.</p>", 1.0], ["img/06/06-016.jpg", "06-016", "<p>Вывеска «Торгсин» по-русски. Видимо, 1931-32 годы. Транспарант «Темпы решают» — там, где пару лет назад рекламировали обеды с оркестром.</p><p>Стиль вывесок Торгсина — еврокоммерческий.</p><p>Стиль транспаранта — постконструктивизм: трёхногие Т, но наклон и круглые буквы.</p><p>Справа на брандмауэре две вывески позапрошлой эпохи. Сверху некто С. Клубовъ, под ним «музыка и ноты А. М. Лисянскiй», и указующий перст.</p><p>Народу тьма, жилищный вопрос портит их. Вместо извозчиков автобусы</p>", 1.0], ["img/06/06-017.jpg", "06-017", "<b>Смоленский из продмага стал торгсином (и нарастил этаж!). 1932 (?)</b><p>Стиль вывесок — аккуратный поздний конструктивизм. Использован логотип Торгсина, которого не было на двух предыдущих картинках.</p><p>И товар в коробках. Много. На телеге. Разгрузка через окно.</p>", 1.0], ["img/06/06-018.jpg", "06-018", "<b>Магазин Торгсина в Днепропетровске (ныне Днепр, Украина).</b><p>Конструктивистские вывески с вариантом логотипа. Нам через почти век трудно оценить, насколько этот стиль опережает тогдашнюю советскую торговую культуру</p>", 1.0], ["img/06/06-019.jpg", "06-019", "<b>Торгсин взамен заграничных посылок. Это объявление прямо рассчитано на эмигрантов.</b><p>Набор советский, шрифты по ОСТу. Логотип на месте.</p>", 1.0], ["img/06/06-020.jpg", "06-020", "<p>Торгсиновская рекламная листовка, по-английски убеждающая зарубежную ЦА сдавать валюту в пользу бедных советских родственников. В качестве иллюстрации — всё тот же Смоленский, куда еще не наведались Коровьев, Бегемот и примус.</p><p>Стиль ардеко с запахом конструктивизма. Логотип на каждой полосе.<br>Основной наборный шрифт — Футура. Набирали, скорее всего, заграницей</p>", 1.0], ["img/06/06-021.jpg", "06-021", "<p>Торгсиновские 10 рублей. Внутренние деньги торговой империи. На черном рынке стоили во много раз дороже обычных.</p><p>Стиль «товарного ордера» — гознаковский, дубасовский.</p>", 1.0], ["img/06/06-022.jpg", "06-022", "<p>Большой цветной Пушкин на Страстном монастыре учит советский народ звезде пленительного счастья. 1937 год.</p><p>Стиль оформления раннеимперский. Основной текст антиквой, композиция центральная, книжки понизу сложены аккуратным могильным веночком.</p><p>Народ безмолвствует и лезет в автобус.</p><p>Вдали слева устаревший логотип «Известий». Потом его демонтируют. А потом-потом вернут.</p>", 1.0], ["img/06/06-023.jpg", "06-023", "<p>Витрина Аэрофлота. Конец 1930-х или начало 1940-х.<br>Судя по отражению в стекле, это первый этаж гостиницы «Москва». Судя по самолету на плакате — Ли 2 — не раньше 1939.</p><p>Элегантная вывеска на стекле. Рекламный плакат авиа-экспресса тоже вполне пристойного уровня. Правда внизу, из-за плеча военного, торчит какая-то вполне советская табличка «Внимание».</p>", 1.0], ["img/06/06-024.jpg", "06-024", "<b>Тверская, 1938. Продажа соковод с тележки Главфруктвода.</b><p>Стиль надписи раннеимперский гастрономический.</p><p>Литераторы, выжившие после встречи с Воландом, продолжают пить абрикосовую.</p>", 1.0], ["img/06/06-025.jpg", "06-025", "<p>«Спартак»-чемпион. 1938. Живая композиция на демонстрации. Не знаю, реальный ли это «Спартак» рискует сверзиться с капота, или наигранный.</p><p>Леттеринг нового советского типа — «оформительский». Так обычно писали умелые мастера из домов культуры. В конце семидесятых — тоже.</p>", 1.0], ["img/06/06-026.jpg", "06-026", "<b>Вывеска магазина «Мясо». Скорее всего, довоенная, год не знаю.</b><p>Стиль оформления витрины и вывески — дореволюционный, но сама надпись отдает густым полупрофессиональным имперством конца тридцатых. Есть в этом слове «МЯСО» какая-то запретная чувственность</p>", 1.0], ["img/06/06-027.jpg", "06-027", "<p>О советском единообразии вывесок (которого не было). Я собрал шесть вывесок «Гастроном» разных лет и разных мест. Все они — дети одного ГОСТа ли, альбома ли рекомендаций. И все разные.</p><p>№1. Гастроном в Мурманске, 1939 год. Заглавная каллиграфическая. Строчные а, т курсивной формы. Строчная р на самом деле капитель.</p>", 1.0], ["img/06/06-028.jpg", "06-028", "<b>№2. Гастроном в Москве, середина или конец 1930-х.</b><p>Заглавная каллиграфическая, строчная а курсивная, остальные буквы капитель. Толщина меньше мурманской, контраст ниже.</p><p>Но вот же: название дублировано латиницей! Конечно же, сплошь заглавными.</p>", 1.0], ["img/06/06-029.jpg", "06-029", "<p>№3. Русско-финский Гастроном в Карелии. 1930-е.<br>По стилю очень близок к мурманскому, но продублирован строчной (!) латиницей</p>", 1.0], ["img/06/06-030.jpg", "06-030", "<b>№4. Гастроном в Москве на Тверской. Июнь 1941.</b><p>Надпись более светлая и квадратичная, чем прочие. Хвост Г уходит под строку. Все строчные буквы капительные, даже А</p>", 1.0], ["img/06/06-031.jpg", "06-031", "<b>№5. Гастроном в Ногинске, на улице Третьего Интернационала. 1956 г.</b><p>Все буквы заглавные. Г первая среди равных.</p>", 1.0], ["img/06/06-032.jpg", "06-032", "<b>№6. Смоленский гастроном в начале 1950-х.</b><p>Помните, какой он был авангардный? И вот на старорежимной доске с фигурной рамочкой прописаны заглавные буквы, причем заметно расплющенные и не похожие ни на что прочее.</p><p>Строгость регламентов умеряется неточностью их исполнения</p>", 1.0], ["img/06/06-033.jpg", "06-033", "<b>Вывеска обувного магазина. Видимо, послевоенная, судя по водосточным трубам.</b><p>Стиль надписи — позднесталинский: невнятный мещанский курсив с отсылками к придуманному 1913 году. Но тогда надпись была бы золотой, а теперь просто охра. Черная доска с ассортиментом при входе — тоже из дореволюционных времён.</p>", 1.0], ["img/06/06-034.jpg", "06-034", "<b>Витрины 1948 года. Магазин «Рыба» Центросоюза (то есть кооперативный).</b><p>Вывеска — аккуратный постконструктивизм. От имперского стиля — только висюльки вроде тех, что украшали кивера в 19 веке.</p><p>Ассортимент обозначен монументально: металлическими буквами, максимально общо и с некоторым расширением в сторону сухопутности: окорок, сыр, масло.</p>", 1.0], ["img/06/06-035.jpg", "06-035", "<b>Консервная витрина начала 1960-х. Похоже, Москва, улица Горького.</b><p>Определил по стилю объявления и «Победе», отражающейся справа внизу.</p><p>Рекомендую сравнить с новозеландской витриной 1926 года</p>", 1.0], ["img/06/06-036.jpg", "06-036", "<b>Образец витрины «Продтовары» с битой птицей</b><p>Стиль дореволюционный</p>", 1.0], ["img/06/06-037.jpg", "06-037", "<b>Альбом образцов торговых витрин. 1935<br>Витрина 10. Ателье мод.</b>", 1.0], ["img/06/06-038.jpg", "06-038", "<b>Альбом образцов торговых витрин. 1935<br>Витрина 70. Выкладка из консервов</b>", 1.0], ["img/06/06-039.jpg", "06-039", "<b>Витрина магазина домашней утвари в Ланкашире, Англия. Конец 1940-х — начало 1950-х.</b><p>Бедное время в сильно потрепанной войной стране. Очень традиционное решение витрины, почти барахолка. Зато какая приятная вывеска. Ничего особенного, но глаз отдыхает</p>", 1.0], ["img/06/06-040.jpg", "06-040", "<b>Витрина магазина самообслуживания (?). Около 1926 года, Веллингтон, Новая Зеландия</b>", 1.0], ["img/06/06-041.jpg", "06-041", "<b>Нью Йорк, Таймс Сквер, 1930-е.</b><p>Золотой век неоновой рекламы — так это, кажется, называется</p>", 1.0], ["img/06/06-042.jpg", "06-042", "<b>Еще Нью Йорк, машины конца 1930-х</b>", 1.0], ["img/06/06-043.jpg", "06-043", "<b>Забытая мной первая в ссср неоновая вывеска «САД». 1931.</b><p>Забор в стиле садово-беседочного конструктивизма. Надписи раскиданы взрывом фантазии автора. Стиль трудноописуем.</p><p>Справа опять «Красный мак» (см. «Каучук»), но уже арнувошный</p>", 1.0]], "research": {"task": "Найти визуальные и текстовые источники о вывесках и витринах 1928–1941: как производились, были ли стандарты, чем отличались столица и периферия; отдельно — Торгсин.", "work": "Два брифа — на сбор корпуса и на сравнительный анализ (СССР 1928–41, США времён Депрессии, послевоенная Европа). Три исследования каскадом: результаты ChatGPT и Perplexity (111 ссылок) — на вход Gemini с поиском западных источников.", "tools": "ChatGPT Deep Research, Perplexity, Gemini Deep Research", "dates": "сентябрь — октябрь 2025"}}, {"intro": false, "num": "07", "title": "Глава о советских обложках и титульных листах 1935–1953 («Если выпало в провинции родиться»)", "ptitle": "Если выпало в провинции родиться", "subtitle": "Советские обложки и титулы 1935-1953", "date": "6 ноября 2025 г.", "perm": "https://www.facebook.com/story.php?story_fbid=25508324675441637&id=100000723643455", "slug": "oblozhki", "html": "<p><span class=\"dc\">В</span>озможно, я взялся за эту книгу только затем, чтобы написать эту главу. А думать о ней начал в 1981 году, делая свои первые книжные обложки и титулы.</p>\n<p>То, чем мы тогда почти все, за редкими исключениями, занимались, казалось мне страшно убогим кустарным провинциализмом, дремучей архаикой.</p>\n<p>Особенно это касалось букв. Наборных шрифтов было раз два и обчелся, доступ к ним для рядового дизайнера был адски сложным. Новых практически никто не делал. Гельветики не было. Кириллическая Футура стала свежей сенсацией стиля Олимпиады 80.</p>\n<p>Даже роскошный и авангардно-модный том «Работы московских художников шрифта» 1978 года на толстенной серой австрийской верже и в дизайне мощного и безукоризненного Максима Жукова, стоило заглянуть внутрь, оказывался собранием всё тех же советских художников-оформителей, из которого ничего нельзя было переснять и уволочь для собственного пользования. То ли дело чешская «Typografia» в трёх томах!</p>\n<p>Как же так вышло, что книжная культура, фонтанировавшая с десятых до середины тридцатых, поскучнела и отстала от века в «самой читающей стране мира»?</p>\n<p>Ответ такой же простой и скучный, как переплёты классиков (не только марксизма) 1948 года выпуска:</p>\n<p>Монополия на печать, гостипографии.<br>Цензура.<br>Отсутствие рекламы и конкуренции издателей.<br>Геноцид наборных шрифтов (см. главу об этом в комм.) и почти полное отсутствие новых гарнитур.<br>Закрытость от мира.</p>\n<p>Оценить глубину ямы легко по работам двух сильных книжников, начавших в 1920-е — Соломона Телингатера и Ивана Рерберга.</p>\n<p>Телингатер, ярко-красный и комсомольский, начинал с авангардной типографики самого крутого конструктивистского замеса. В его ранних макетах (см. ссылку в комм.) видны не только дадаисты, но и будущий Нэвил Броуди.</p>\n<p>В цельнонаборных обложках — одну из поздних смотрите в подборке — Телингатер использует Академическую, возможно самый важный шрифт российской типографики десятых. К ней же отсылал в гравированном леттеринге Фаворский. Ей же часто пользовался Рерберг, когда набирал титулы. Этот шрифт мог бы стать предшественником российского ардеко — но вышло иначе.</p>\n<p>Телингатер настолько хорош, что даже явная заказная халтура у него бывает высокого качества. Тем страннее выглядит взятое с персонального сайта приглашение на выставку рисованного шрифта 1953 года. Я его сохранил в пдф и выкладываю отдельно в комментариях с комментарием же. Это прямо необъяснимая вещь. Кстати, набранная Академической.</p>\n<p>Рерберг, интеллигент из питерской семьи архитекторов, с самого начала строг и консервативен. Свой коронный шрифт — будущую гарнитуру Рерберга — он находит почти сразу и методично использует с середины двадцатых. Это тоже прото-ардеко: геометричность, брусковость, низкий контраст, почти циркульные круглые буквы.</p>\n<p>Рерберг прославился титульными листами (именно ими, многобуквенными) солидных книг издательства Academia. Там его антиква ардеко успешно изображала то ли римский капитальный, то ли альдины, то ли голландцев 17 века.</p>\n<p>Переплёты и титулы Academia отразились много позже в моей любимой серии «Литпамятники». Когда дойду до нее, разберу, в чем сходства и различия.</p>\n<p>И вот эти два диаметрально противоположных мастера угодили в воронку советской книжной продукции 1937-1953 гг. В 1935 всё было еще весело.</p>\n<p>На выходе мы имеем двух почти одинаковых книжников, мало чем отличающихся от общей массы советских оформителей. Замечу: никаких репрессий. Оба были уважаемыми профессионалами, честно делавшими свои заказы.</p>\n<p>Рерберг так и не выбрался — он умер в 1957.</p>\n<p>А вот у Телингатера после 1953 года случился второй расцвет — уже в качестве леттерингиста и даже «рисованного каллиграфа». Но о «нашем Цапфе» тоже в свое время. А сейчас — смотрите картинки, в подписях разберу, как случился профундис.</p>\n<p>В нынешней подборке еще несколько типичных обложек и титулов позднесталинского времени. Они как раз не на контраст, а в подобие — показывают, что герои поста вписывались в ряды. Один-два шрифта, выключка по центру. Или всё рисованное, выключка по центру. Лаврушка. Звёздочки.</p>\n<p>Забавно, кстати, сопоставить титулы «советского классицизма» с дореволюционными, которым они вроде бы подражали. Основной претензией у советских критиков была эклектика и обилие гарнитур. Глядя из 1913 года в 1948, эстет поморщился бы на убожество набора, шрифтовую скудость — и ту же самую эклектику, только на уровне леттеринга с оборванной традицией.</p>\n<p>Увы, товарищ Шицгал, буржуазные титулы были хотя бы нарядными. Для примера — титул сочинения г-на В. Ильина 1908 года. Девять шрифтов, не считая ценника. И там же тов. Н. Ленинъ 1918. Тоже девять шрифтов, причем других.</p>\n<p>Второй не менее забавный миф: советские художники книги, отсеченные от набора, дивно научились рисовать леттеринг руками. И этим всему миру показали мать Кузьмы и Горького. Увы, советский леттеринг может порадовать в основном лихостью и милым незнанием правил.</p>\n<p>Для сравнения в подборке — несколько западных обложек того же периода с разнообразным леттерингом. Но особенно меня впечатлили переплёты, созданные американскими художницами позднего арнуво. Я не искал специально — пять минут в гугле in English.</p>\n<p>Что же до наборных обложек и титулов, в подборке немного неистового Яна Чихольда с пингвинами и Гилл Сансом. И вот ей богу — рядом с ними отлично мог бы жить наборный Телингатер.</p>\n<p>А рисованному Рербергу в пару подобран тот же Чихольд — с титулом Данте. Наборным.</p>\n<div class=\"orn\" role=\"separator\"><b></b></div>\n<p>Когда написал весь текст выше, вдруг понял, что за кадром осталась самая важная тема. Ленин!</p>\n<p>Я посмотрел и сопоставил обложки и титулы дореволюционных изданий г-на Ульянова-В. Ильина-Н. Ленина с третьим (1925-1936), четвертым (1941-1967) и пятым (1958-1966(?) полными собраниями сочинений этого товарища. Для детализации анализа смотрите картинки и подписи.</p>\n<h3>А в общем</h3>\n<p class=\"verse\">Третье издание — «поэтическое».<br>Четвёртое — «Книга книг».<br>Пятое — «закат учения».</p>\n<p>Конец тридцатых — время последовательной канонизации и самого Ленина, и его проповедей. Как раз начали возводить зиккурат Дворца Советов с колоссальным истуканом на башне, рядом с которым построенные позже высотки должны были стать всего лишь сексапильным хором березок на подтанцовке. Такому размаху нужна была совершенно особенная Книга. Или книги. Четвертое издание своим переплетом и титулом соответствует этой задаче.</p>\n<p>Сравним три переплёта, заранее условившись, что в них всё важно и что их делали хорошие профессионалы. Про титулы поговорим отдельно. Всё, что будет ниже — домыслы художника книги, не более. Спорить можно, цитировать с осторожностью.</p>\n<p>Третье издание.</p>\n<p>Тканевый красный переплёт с плоским тиснением черной краской. Сверху автограф. Снизу силуэт. Название только на корешке. Почему название? — у автора есть хотя бы инициалы, а тут просто «Ленин». С инициалами каждый может. Это шаг к канонизации. Однако силуэт повернут на запад. Это немного декадентство. Такое хорошо с поэтами, а не с вождями. Намек на белый воротничок тоже добавляет арнувошности.</p>\n<p>Подумал еще, что в красно-черной гамме есть некоторая доля скорби тогда еще живых соратников по безвременно оставившему их на произвол усатого Старику.</p>\n<p>И самое важное: автограф выше портрета. Это очень странная композиция: почти нечитаемая подпись выше знакового профиля. Не знаю, что хотели этим сказать оформители, но вышло живо. Не вечноживо, а просто живо.</p>\n<p>Четвёртое издание — вершина. Переплёт коленкоровый под кожу. Сверху название строгой антиквой, под ним медальный конгрев. Никаких автографов. Чистый мавзолей. Конгрев высокий, сталинский. Лысина куполом. Смотрит на восток, в будущее. Мне попалось два цвета переплёта — бурдовый и коричневый. Почему не красный? Трудно сказать. Варианты: а) не нашли красного коленкора 10%; б) решили сделать посолиднее 10%; в) товарищ усатый велел быть скромными 80%.</p>\n<p>Этот переплёт, простой как крышка гроба, максимально сакрален. Примкнул штык, отдал честь, застыл ошую и одесную.</p>\n<p>Пятое издание — хрущевско-брежневское.</p>\n<p>Переплёт синий, коленкоровый. Сверху канонический профиль с прищуром. Снизу автограф. Вроде бы почти ничего не поменялось, однако:</p>\n<p>Конгрев хрущевский, плосковатый и без излишеств. Смотрит на восток, как положено. Подпись тиснута дорогой золотой фольгой. Ближе к краю переплёта блинтовая рамка. Перед нами фасад академического собрания сочинений знаменитого, но скучноватого классика. С полным уважением, но без почетного караула и рукотрепещущего жреца, с низким партийным поклоном поднимающего заветную крышку.</p>\n<p>Имени или названия не надо — Пушкина и Чехова тоже с подписью на переплёте выпускали. Подпись (укороченная, с невнятным «Лнн»), уже давно стала частью имиджа вместе с лысиной и пришуром. Нормальное академическое собрание. Не завет и не молитвенник.</p>\n<p>Ну, и дополнением апофеоз. Роскошное подарочное издание 1975 года. Покойный должен был пропеллером крутиться в мавзолее от такой красоты. Смотрите в картинках, не пожалеете.</p>\n<p>Эти четыре собрания показывают, как шла сакрализация и десакрализация образа вождя — а заодно и его учения.</p>\n<p>Прошу прощения за качество картинок. Всё, кроме Тогдазина, Телингатера и Рерберга, собрал на Авито. На мастеров отдельные ссылки в комм. Ссылки на источники зарубежных изданий в подписях.</p>\n<div class=\"orn\" role=\"separator\"><b></b></div>\n<p>Работа ИИ в этот раз практически не связана с моим текстом. Юлия Репринцева решила провести сравнительный эксперимент и дала один и тот же промпт разным нейросетям.</p>\n<p>Вкратце задание: проанализировать советские книжные обложки и титулы с 1935 по 1953 год и описать их типологически. А потом сопоставить с дореволюционными, а также с американскими, английскими, французскими и немецкими того же периода мидсенчури.</p>\n<p>Получилось интересно — электронные исследователи написали по-разному и даже пришли к разным выводам. В комментариях даю ссылки на несколько эссе. Особенно рекомендую к прочтению текст от Gemini.</p>", "figs": [["img/07/07-001.jpg", "07-001", "<b>https://www.togdazine.ru</b><p>Обложки за 1935 год.<br>Конструктивизм отступает, но еще не забыт</p><p>Показываю сразу много для общего впечатления</p>", 1.0], ["img/07/07-002.jpg", "07-002", "<b>https://www.togdazine.ru</b><p>Обложки за 1936 год.</p>", 1.0], ["img/07/07-003.jpg", "07-003", "<b>https://www.togdazine.ru</b><p>За 1937 год почему-то только одна обложка</p>", 1.0], ["img/07/07-004.jpg", "07-004", "<b>https://www.togdazine.ru</b><p>Обложки за 1938 год.</p>", 1.0], ["img/07/07-005.jpg", "07-005", "<b>https://www.togdazine.ru</b><p>Обложки за 1939 год.<br>Здесь в основном журналы. Я не вижу тенденций, кроме, пожалуй, большего количества скорописных заголовков</p>", 1.0], ["img/07/07-006.jpg", "07-006", "<b>С. Телингатер. Л. Гроссман. Борьба за стиль. Обложка книги. 1927</b><p>Поздняя цельнонаборная обложка Телингатера. Гарнитура Академическая. Свободная композиция с несколькими осями</p>", 1.0], ["img/07/07-007.jpg", "07-007", "<b>Телингатер.<br>Переплёт, титул и спусковая полоса книги «Поход Челюскина». 1934.</b><p>Здесь есть все детали позднесталинского книжного оформления: рисованная антиква, две краски, даже намек на лавровый венок. Не хватает главного: выключки по центру</p>", 1.0], ["img/07/07-008.jpg", "07-008", "<b>Телингатер, переплёт и распашной титул книги «Героическая эпопея». 1935</b><p>Композиция постконструктивистская, если не постмодернистская. Титул в две краски и золото.</p><p>Буквы изображают наборный шрифт, но я не помню такого светлого крупнокегельного гротеска. Да еще с такой странной строчной а.</p><p>Конечно, Телингатер мог всё это начертить, подражая Древней и Рубленой гарнитурам, для которых как раз характерны такие к, ч, я.</p>", 1.0], ["img/07/07-009.jpg", "07-009", "<p>Телингатер.<br>Два варианта переплёта парадного ведомственного тома. Слева — листовая сталь на заклёпках. 1935</p><p>Композиция — поздний конструктивизм. Сверху рисованный гротеск, внизу наборная Коринна.</p>", 1.0], ["img/07/07-010.jpg", "07-010", "<b>Телингатер.<br>Слева распашной титул того же издания, что на предыдущей картинке. 1935</b><p>Справа — то ли другой вариант титула, то ли инфографика.</p><p>Пока еще не запрещен формальный подход. Нет не только композиции по центру, но даже одной оптической оси. Силуэт вместо портрета — тоже скорее макетная игра, чем мавзолейный подхалимаж.</p><p>На второй картинке видно, что качество печати не слишком впечатляющее, да и совмещение могло бы быть поточнее</p>", 1.0], ["img/07/07-011.jpg", "07-011", "<b>Телингатер.<br>Переплёт 1936 года и титул 1945.</b><p>Слева — еще один помпезный том с тем же персонажем. Тканевый переплёт, вклейка иллюстрации, блинтовое тиснение.</p><p>Заголовок отчаянно изображает набор, но опять напрягают буквы а, да еще не припомню шрифта с такими близкими по плотности светлыми начертаниями.</p><p>Справа — технический титул чисто сталинского вида. Рисованная антиква, выключка по центру, небольшой декор.</p><p>Вещь слева вряд ли мог сделать кто-нибудь, кроме того, кто ее сделал.<br>Вещь справа отличается от себе подобных только качеством прорисовки букв.</p>", 1.0], ["img/07/07-012.jpg", "07-012", "<b>Телингатер.<br>Слева — приглашение на свежеразрешенную новогоднюю ёлку. 1939</b><p>Конгрев, золото, рисованный леттеринг.<br>Из человеческого — две маленькие белые звездочки.</p><p>Справа — обложка. 1941.</p><p>Из интересного — двойная тень под прорисовкой подписи.</p><p>Выключка по центру</p>", 1.0], ["img/07/07-013.jpg", "07-013", "<p>Телингатер.<br>Переплет и титул (английский вариант) факсимиле бортового журнала самолета № 025, совершившего перелет через полюс. 1939 г.</p><p>На переплете вольность — наклейка слева. На титуле как по уставу. Ленточки, лаврушки.</p><p>Набор (Литературная гарнитура).</p><p>Выключка по центру</p>", 1.0], ["img/07/07-014.jpg", "07-014", "<p>Телингатер.<br>Слева переплёт — Горький. «Детство», 1946<br>Справа титул — Шолом-Алейхем. «Мальчик Мотл». 1949.</p><p>Рисованный леттеринг. Буквы отчасти подражают набору конца 19 века.</p><p>Выключка по центру</p>", 1.0], ["img/07/07-015.jpg", "07-015", "<p>Телингатер.<br>Слева — переплёт, «Песнь о вещем Олеге». Судя по всему, эскиз. 1949<br>Справа — обложка (или титул?), «Героические былины».</p><p>Рисованный леттеринг. С Олегом — попытка обмануть центральную ось при помощи золотой завитушки справа.</p><p>У «Былин» все буквы разные.</p><p>Видно, что С. Б. получал удовольствие от нетипичной работы с еще недавно подзапретной допетровской кириллицей</p><p>Выключка все же по центру</p>", 1.0], ["img/07/07-016.jpg", "07-016", "<p>Телингатер.<br>Слева — эскиз (?) титула книги академика Ферсмана «Очерки по истории камня». 1952</p><p>Справа — переплёт (?) альбома (?). 1956</p><p>Рисованный леттеринг, который мог бы стать образцом для наборных шрифтов — особенно тот, что слева.</p><p>Выключка по центру</p>", 1.0], ["img/07/07-017.jpg", "07-017", "<b>Телингатер.<br>Две обложки журнала «Полиграфическое производство» с разницей в десять лет.</b><p>Слева 1949, справа 1959 год.</p><p>Слева рисованный леттеринг, лаврушки, выключка по центру.</p><p>Справа (а что, так снова можно?) хитрый логотип, фотомонтаж, наборный шрифт.</p><p>Соломон Телингатер двадцать лет спустя стал сам собой. С чего б?</p>", 1.0], ["img/07/07-018.jpg", "07-018", "<b>Иван Рерберг.<br>Обложка и титул книги Бабеля «Беня Крик». Антель писателей «Круг», 1926.</b><p>Рерберг, в отличие от Телингатера, родился со встроенной выключкой по центру. А еще, кажется, он сразу нарисовал свой главный шрифт — гарнитуру Рерберга.</p><p>Обложка — очень характерный образец раннего ардеко: орнаментальный фон, строгая, но игровая антиква на плашке.</p><p>Титул наборный, разумеется Академической гарнитурой</p>", 1.0], ["img/07/07-019.jpg", "07-019", "<b>Иван Рерберг.<br>Обложка и титул писем Венецианова. Издательство Academia, 1931.</b><p>Обложка как будто серийная с Бабелем. А вот титул — типичная Academia. Рисованный леттеринг. Многобуквие. Подражание 18-19 веку</p><p>Выключка по центру здесь неизбежна и желанна.<br>Однако не отсюда ли потянулись корни нанизанных на спицу сталинских титулов?</p>", 1.0], ["img/07/07-020.jpg", "07-020", "<p>Иван Рерберг.<br>Переплёт и титул «Пяти ордеров архитектуры» Виньолы. Academia, MCMXXXIX, прости господи</p><p>Переплет только что не кожаный, золотое тиснение, блинтовая рамка.</p><p>Классическая книга по классической архитектуре классического издательства. Рисованный леттеринг с N-образными И, ай-яй-яй, как можно.</p><p>Здесь гарнитура Рерберга маскируется под капитальный шрифт.</p><p>Это первая книга издательства Academia, которую я купил еще в начале 1980-х. Тогда она произвела на меня оглушительное впечатление: огромная, с гравированными таблицами на всю полосу, и с вот этим титулом.</p><p>Выключка по центру</p>", 1.0], ["img/07/07-021.jpg", "07-021", "<b>Иван Рерберг.<br>Даниэль Дефо, «Молль Флендерс». Academia, 1932.</b><p>Рисованный леттеринг. Гарнитура Рерберга играет в голландцев 17 века.</p><p>Возможно, это самый обильный словами титул ИР. В оригинале, с 99% вероятностью, был набор. Что ж не воспроизвести-то, двести лет спустя, в индустриальной державе?</p><p>Выключка по центру</p>", 1.0], ["img/07/07-022.jpg", "07-022", "<b>Иван Рерберг.<br>Бумажный переплет и титул книги В. Яна «Чингиз-Хан». ХудЛит, 1939</b><p>Рисованный леттеринг. Гарнитура Рерберга с китайским акцентом, но с латинскими И.</p><p>Выключка по центру</p>", 1.0], ["img/07/07-023.jpg", "07-023", "<b>Неизвестные авторы.<br>Два переплёта сочинений Пушкина 1946 и 1949 гг.</b><p>Слева коленкор, конгрев, блинтовая рамка.<br>Справа бордовая ткань, тиснение золотом, лавры, блинтовая рамка. Рисованный леттеринг.</p><p>Выключка по центру</p><p>Запомните — потом сравним с одним вождем.</p><p>Отсюда и дальше советские обложки-титулы натасканы с Авито</p>", 1.0], ["img/07/07-024.jpg", "07-024", "<b>Распашные титулы из-под переплетов с предыдущей картинки.</b><p>Почему одно и то же издательство выпустило два разных «Избранных» с разницей в три года — загадка.</p><p>Автор, похоже, подан рисованным леттерингом, а всё остальное набор.</p><p>Если искать самые типичные советские титулы — вот они.</p><p>Выключка по центру</p>", 1.0], ["img/07/07-025.jpg", "07-025", "<p>Слева переплёт «Воскресения» 1949 года.<br>Коленкор, золото, блинтовая рамка.<br>Рисованный леттеринг. Подражание немецким переплетам начала 20 века</p><p>Справа титул Белинского 1948 года. Набор.</p><p>Выключка по центру</p>", 1.0], ["img/07/07-026.jpg", "07-026", "<b>Бумажный переплет и титул. Горький, «Мать», 1948</b><p>На переплете рисованный леттеринг (кажется, вдохновленный логотипом «Нового мира») и внезапная почти авангардная картинка с трубой.<br>Титул наборный.</p><p>Выключка по центру</p>", 1.0], ["img/07/07-027.jpg", "07-027", "<b>Переплёт и распашной титул, Гайдар, «Сочинения». 1948</b><p>Рисованный леттеринг с «латинскими» И.<br>На переплете конгрев и золото, на титуле рамочка.</p><p>Выключка по центру</p>", 1.0], ["img/07/07-028.jpg", "07-028", "<b>Бумажный переплет и титул, «Ручное вязание», 1948</b><p>Каллиграфический леттеринг в духе альбомов образцов начала века. Слитный скрипт имитирует нитку.</p><p>Выключка по центру на титуле</p>", 1.0], ["img/07/07-029.jpg", "07-029", "<b>Обложка и титул книги «Как читать радиосхемы». 1948</b><p>На обложке рисованный леттеринг.<br>На титуле набор Литературной.</p><p>На обложке робкая попытка выключки влево.<br>На титуле всё по центру без разговоров, и даже с расключенной последней строкой.</p><p>Всё, выдохнули.<br>Больше советской многотиражки не будет.<br>Надеюсь, вам понравилось кафкианское нагнетание процесса.</p><p>Теперь еще вдох — впереди труды вождя всех племён.</p>", 1.0], ["img/07/07-030.jpg", "07-030", "<b>Слева: В. Ильин, «Развитие капитализма в России», изд. «Паллада», 1908.</b><p>Справа: В. Ильин (Н. Ленин), «Государство и революция», изд. «Жизнь и знание», 1918</p><p>Два титула сочинений уже вождя, еще не классика.<br>Набор, по девять шрифтов в каждом, не считая ценника.</p><p>Выключка по центру</p><p>Обычные титулы дешевых брошюр того времени.</p>", 1.0], ["img/07/07-031.jpg", "07-031", "<b>Титульный лист Третьего издания сочинений Ленина 1935 г. Институт Маркса-Энгельса-Ленина</b><p>Рисованный леттеринг, косящий под набор, с эстетским кирпичом текста с переносами посередине, с еще живыми и уже в рамочке подредакторами и некоторым замешательством с буквой (б) в нижней строке.</p><p>Выключка по центру, но композиция громоздкая.</p><p>Это титул обычной книги. Не цитатника и не молитвенника.</p><p>Этому титулу соответствует красный переплет на следующей картинке.</p>", 1.0], ["img/07/07-032.jpg", "07-032", "<p>Три переплёта сочинений Ленина: третьего, 1935 года, четвертого, 1941, и пятого, два тома 1973 и 1974 гг, о которых я писал в посте.</p><p>Слева поэтический сборник.<br>По центру Книга книг и мавзолей<br>Справа собрание скучного классика, на трудах которого жирует целый институт.</p><p>Вроде бы между вторым и третьим больше сходств, чем различий, и оно явно старается продолжать дело предка, но насколько разное ощущение от двух похожих фасадов.</p><p>На одном в фокусе священное имя, а ниже денарий кесаря; на втором — проходная композиция, нечто вроде мемдоски, подписанная Ульбульбуль.</p><p>Выключка, разумеется, по центру.<br>Но здесь хотя бы понятно, зачем</p>", 1.0], ["img/07/07-033.jpg", "07-033", "<p>Титулы Четвертого и Пятого собраний.<br>На одном (с Авито же) умилительный листочек контролера (не подписанный). То есть книгу никто не открывал.</p><p>Титулы вроде еще похожее друг на друга, чем переплеты, но и тут слева настолько подмели, что с правой полосы распашного титула убрали издательскую марку и превратили его практически в шмуц.</p><p>Долго присматривался и решил, что всё, что есть на обоих титулах — рисованный леттеринг. Даже мелкий текст.</p><p>Не знаю, разделяете ли вы мое ощущение, что титул 1941 года не просто так минималистичен. Что его функция не столько открывать, сколько останавливать.</p>", 1.0], ["img/07/07-034.jpg", "07-034", "<b>Ну и наконец феерическое подарочное издание ПСС 1975 года.</b><p>Переплет натурально кожаный. На нем топорно высеченная рамка и золотой плоский вождь, глядящий на закат. Золотой муаровый обрез! Ааааааа! И титул, напечатленный чистым золотом, чтобы чаще господь замечал.<br>Леттеринг уж не Ганнушкин ли рисовал? Засечка на Е намекает.</p><p>Но все ж вы представьте: внутри, стало быть, бей буржуев, а по обрезу золотой маршальский галун. Дорогой вечноживой покойничек перестал бы картавить от возмущения</p><p>Вот это — настоящий конец сакрализации. Следующий шаг — юбилейный торт с портретом.</p>", 1.0], ["img/07/07-035.jpg", "07-035", "<p>Ну и чтоб вы окончательно не скисли — несколько действительно роскошных переплетов с рисованным леттерингом арнуво. Специально сделал скриншоты с подписями.</p><p>И никакой кириллицы, кормилицы нашей.</p><p>Взято отсюда:</p><p>Transforming the Ordinary: Women in American Book Cover Design</p><p>https://mainehomedesign.com/.../transforming-the.../</p>", 1.0], ["img/07/07-036.jpg", "07-036", "<b>Transforming the Ordinary: Women in American Book Cover Design</b><p>https://mainehomedesign.com/.../transforming-the.../</p>", 1.0], ["img/07/07-037.jpg", "07-037", "<b>Transforming the Ordinary: Women in American Book Cover Design</b><p>https://mainehomedesign.com/.../transforming-the.../</p>", 1.0], ["img/07/07-038.jpg", "07-038", "<b>Transforming the Ordinary: Women in American Book Cover Design</b><p>https://mainehomedesign.com/.../transforming-the.../</p><p>Эта композиция меня почему-то особенно очаровала</p>", 1.0], ["img/07/07-039.jpg", "07-039", "<b>Та самая чихольдовская серия карманных пингвинов. Первая книга: 30 июля 1935 года</b><p>На картинке: Penguin Books, 1949. Джордж Оруэлл, «1984»</p><p>Набор, Gill Sans.<br>Выключка по центру</p>", 1.0], ["img/07/07-040.jpg", "07-040", "<b>Ян Чихольд, титульный лист «Божественной комедии» Данте. 1949</b><p>Набор, выключка по центру.</p><p>Если бывает на свете близнец-антиРербег — вот он. Всё, что советские книжники рисовали потому, что нечем было набрать, Чихольд размечал под набор потому, что хлеб — дело печеное.</p><p>Выключка по центру</p>", 1.0], ["img/07/07-041.jpg", "07-041", "<b>Три книги от брата пингвина — пеликана.</b><p>1938 Ballet - Arnold Haskell</p><p>Набор, Gill Sans</p>", 1.0], ["img/07/07-042.jpg", "07-042", "<b>1938 Modern German Art - Peter Thoene</b><p>Набор, Gill Sans.</p>", 1.0], ["img/07/07-043.jpg", "07-043", "<b>1949 British Herbs - Florence Ranson</b><p>Набор, Gill Sans</p><p>Надеюсь, вы почувствовали, что значит иметь в типографическом арсенале всего один шрифт — Gill Sans</p>", 1.0], ["img/07/07-044.jpg", "07-044", "<b>Несколько серийных обложек сороковых с рисованным леттерингом</b><p>Agatha Christie, published between 1946 and 48.</p><p>https://grapheine.com/en/magazine/history-of-book-covers-3/</p>", 1.0], ["img/07/07-045.jpg", "07-045", "<b>Оттуда же:</b><p>https://grapheine.com/en/magazine/history-of-book-covers-3/</p>", 1.0], ["img/07/07-046.jpg", "07-046", "<b>Оттуда же:</b><p>https://grapheine.com/en/magazine/history-of-book-covers-3/</p>", 1.0], ["img/07/07-047.jpg", "07-047", "<b>Примерно оттуда же:</b><p>https://grapheine.com/en/magazine/history-of-book-covers-3/</p><p>Вообще очень интересный источник, рекомендую припасть )</p>", 1.0]], "research": {"task": "Собрать изображения обложек и титулов, классифицировать шрифты — наборные и рисованные, композицию, нешрифтовые элементы; сопоставить с дореволюционными и зарубежными.", "work": "Одно задание запущено параллельно в шести системах; выводы всех шести положены рядом для сравнения; три раунда итеративного поиска по художникам Рербергу и Телингатеру.", "tools": "ChatGPT, Perplexity, Gemini, DeepSeek, Grok, Qwen", "dates": "октябрь — ноябрь 2025"}}, {"intro": false, "num": "08", "title": "Советская монументальная пропаганда — от полотна до бетона", "ptitle": "Монументальная пропаганда — от полотна до бетона", "subtitle": "", "date": "18 февраля 2026 г.", "perm": "https://www.facebook.com/100000723643455/posts/26431847396422689/", "slug": "propaganda", "html": "<div class=\"epi\"><p>На что такой плакат,<br>Такой огромный лоскут?</p><span class=\"epi-a\">Блок, «Двенадцать»</span></div>\n<p><span class=\"dc\">Л</span>юбое тоталитарное государство лезет в мозги населения везде, где только может, начиная с улицы. Вождь мирового пролетариата выдвигает план монументальной пропаганды в 1918 году, еще даже не зная, что его государство тоталитарное.</p>\n<h3>1917-1922</h3>\n<p>Первые пробы монументалки пришли с улицы, с демонстраций, были дешевыми и крайне агрессивными. Главная задача — создать образ врага и отделить своих от чужих. Враги — «буржуи», генералы, попы; свои — «трудящиеся», пролетарии и крестьяне. Лозунги от «Долой!» до «Да здравствует!». Буквы — всякие, но много модного арнуво и футуристской криволапицы. Желание красивых и/или выразительных букв — наследие старого мира и некоторая теплота исполнителей.</p>\n<p>В этот первый период пропагандой занимаются «идейные» товарищи. И она выходит злой, кровожадной, но по-своему страстной и даже честной. Но так будет недолго — максимум до конца Гражданской войны.</p>\n<p>Формула послепереворотной пропаганды: смерть чужим, свои геть до кучи.</p>\n<h3>1918-1930</h3>\n<p>Параллельно, вместе с ленинским планом, начинается эстетизация революции. Это тоже пропаганда, но принципиально другого свойства. Она должна создать пластический и вербальный образ новой власти, встроить ее в историю, сделать властью среди властей, государством среди государств.</p>\n<p>Лозунг «до основанья, а затем» годится только для уж совсем отшибленных радикалов. Прочей публике (которой, собственно, этих отшибленных кормить и защищать) хочется жить в нормальной стране, что бы это ни значило. И пропаганда начинает искать предшественников и аналогии.</p>\n<p>Составляются списки духовно близких исторических деятелей, от Спартака и братьев Гракхов до Марата и Робеспьера. Что любопытно: не только Французская революция, но и Римская республика подтягивается в качестве предтечи свежезахваченной власти.</p>\n<p>Пластика и стиль этого периода — от чехонинского модернизна до татлинского авангарда. В этот недолгий момент большевики согласны (даже если не очень хотят) выглядеть модно.</p>\n<p>Первые образцы монументальной пропаганды делаются по случаю и на скорую руку. Обычно это праздничное оформление улицы или площади — холст, дерево, краска. Новым по сравнению с временем революции становится эстетизация объектов. А где больше красоты — там меньше страсти. Это первый шаг к позолоте и лепнине.</p>\n<p>Но всё же стиль двадцатых — динамика и полет в будущее. Татлинская башня летит вперёд, в коммуну, вместе с паровозом. Туда же шагает гораздо более поздняя мухинская пара гигантов. Шагает, чтобы застыть на вечном приколе на ВДНХ.</p>\n<p>Неожиданно пропаганда сталкивается с рекламой. Начинается НЭП — и вместо «долой» надо кричать «хватай». Так появляется бессмертный источник мемов: «Нигде кроме как в Моссельпроме». Не знаю, хорошая ли это реклама, но пропаганда качественная. Еще один пропагандистский слоган того же времени (и того же автора): «Лампы сияют, цены снижены». Коровьев и Бегемот, попав в Торгсин, по достоинству оценили сияние, снижение и ассортимент.</p>\n<p>Празднично-парадная пропаганда становится всё мощнее и дороже, обрастает лампочками и громоздится на грузовики. Но чем пышнее оформление, тем меньше в нем от живой демонстрации живых людей, зато больше государственного ритуала. Это, кстати, заметно и по буквам: они становятся аккуратными, лишенными живого чувства — и одновременно не модными. Идеология застывает и готовится отлиться в бронзе.</p>\n<p>Формула допятилеточной пропаганды: вперёд летим, а кто не с нами — замри и ляг.</p>\n<h3>1930-1941, 1945-1953</h3>\n<p>Золотой, бронзовый и гранитно-мраморный век советской пропаганды. Она становится не просто монументальной, но грандиозной.</p>\n<p>Первый мегапропагандистский проект — московское метро. Если первые станции еще можно сопоставить с современной им архитектурой ардеко, то чем дальше, тем архаичней становилась отделка, тем больше нарастало лепнины, тем антиквенней делались надписи. Метро строили как витрину государства, изначально метя в «самое красивое в мире». Особенно это заметно по вестибюлям. Если первые были с небольшую часовенку, то поздние — ближе к соборам. Можно сравнить вестибюли радиальной и кольцевой Парка Культуры: маленькую беседку-рондо и тяжеленный куб с портиком.</p>\n<p>Мы как-то привыкли, что нисхождение к остановке подземного трамвая похоже на посещение музея или храма — и ведь это действительно род причастия к величию советского проекта. Проверьте себя: вы непременно обнаружите, что метро входит в короткий список чего-то хорошего и значительного в вашей жизни. Маршрутка не входит. Электричка не входит. А метро в сердце. Почему бы?</p>\n<p>Развитием золотобронзовой темы стала ВСХВ–ВДНХ — выставка достижений советской пропаганды. Вся ее архитектура, вся позолота, все надписи капитальным шрифтом — свидетельства желания советов стать «нормальной империей». Чтоб как у приличных людей, дорого и солидно.</p>\n<p>При этом архитектурный стиль павильонов взят у сакральных объектов и перенесен на светские, выставочные. Поэтому ВДНХ смотрится Диснейлендом всерьез. Меня всегда поражало сочетание гиперболического пафоса и какого-то имперского балагана, не отпускающее на ВДНХ. Павильоны — то ли парфеноны, то ли таджмахалы, с эпическими быками на крышах — и ларьки с мороженым, и покатаечные паровозики. При слабости поп-культуры публичные места гуляний (ЦПКО им. Горького туда же) стали сочетанием святилища и гульбища.</p>\n<p>Ту же пропагандистскую задачу, что метро и ВДНХ, решали «сталинки» — дома для элиты. Их строили штучно, украсно и богато, несмотря на то, что страна еще была бедной. Чтобы понять, что это именно пропаганда, надо сравнить Тверскую и Черемушки. Массовая хрущевская застройка в куда более сытые времена отлично показала, сколько государство готово тратить на прожиточный минимум обычной публики.</p>\n<p>Ну а самым невероятным аттракционом гипермонументальной пропаганды должен был стать колоссальный Дворец Советов, окруженный хором сравнительно небольших высоток-подпевочек. Если бы его воззиждили, ссср мог бы претендовать на вечное величие, лет еще на сорок, вплоть до небоскребов в петромонархиях. Хорошо, что вышел только котлован, он же бассейн.</p>\n<p>Монументальная пропаганда бронзового века оказалась исключительно эффективной. Когда постсоветский человек ностальгирует по лучшим временам, он обязательно припоминает балясинки санаторной ограды в стиле сахарного барокко и вознесенные в сине небо звёзды на шпилях.</p>\n<p>Кстати о звёздах. На мой взгляд, рубиновые кремлевские — высшее достижение советской пропаганды. Эти подсвеченные флюгера (или они не вертятся?) стали главным положительным символом ссср, затмив всемирный серп-и-молот. С ними мрачный кирпичный Кремль приобрел дедморозный привкус вечной новогодней ёлки. Уж на что я холоден к сталинской эпохе, но считаю, что звёздочки намного лучше имперских орлов.</p>\n<p>Лозунги бронзового века были больше приказные: «Пятилетку в четыре года», «Даёшь ударные темпы» — государство требовало от населения напрячься и совершить прыжок из прошлого в настоящее, где будет больше угля и стали, то есть больше танков, пушек и снарядов. А в виде поощрения лично вождь констатировал, что жить стало лучше и веселее.</p>\n<p>Стилистически бронзовый век славит величие и вневременность. Центральные композиции, архаичные украшения, псевдоримский капитальный шрифт — всё это должно превратить новодел в пирамиды, сделать любое публичное пространство сакральным.</p>\n<p>И посреди всего — пантеон из тщательно отобранных священных персон: один самый человечный сверхчеловек и один лучший друг всего, что шевелится в нужном направлении. Одна вечноживая мумия и один вездесущий вождь-пророк. Два предка-призрака, бородатых патриарха, были как бы изъяты из повседневного обихода. Остальные вожди прославлялись в порядке живой очереди: пока живой — парсуну несут на палке. Как пустили в расход — исчез из обращения.</p>\n<p>Что любопытно: если в ранний период супостаты постоянно присутствовали в пропаганде крупным планом, то в имперскую эпоху их сильно задвинули. Классовая борьба всё усиливалась, но клеймили врагов народа мелким газетным кеглем и крокодильскими карикатурами.</p>\n<p>Возможно, апофеозом сиюминутной монументальной пропаганды были довоенные парады физкультурников. Они, в отличие от демонстраций, украшались и режиссировались централизованно и были настоящими ритуальными шествиями. Я посмотрел три фильма об этих парадах 1937, 38 и 39 годов. Довольно впечатляющее зрелище даже на фоне многочисленных виденных открытий всяких олимпиад. Телесное здоровье, явленное физкультпарадами, имело прямую утилитарную цель: «сегодня физкультурник — завтра боец». Отсюда живые картины в форме танков, где один из атлетов изображал пушку.</p>\n<p>Внутри имперского периода четыре года пришлось на войну. В это время пропаганда вернулась к стилю времен Гражданской: лапидарному, энергичному, часто с рукописными призывами. Этот стиль резко контрастировал с тем, что было до и особенно после войны.</p>\n<p>С 1945 и до 1956 года имперский стиль вернулся, но стал еще пышнее, торжественней, эклектичней и буржуазней. Многопудье бронзы, мрамора и лепнины нарастало вплоть до самого постановления о борьбе с излишествами. Еще раз повторю: всё это великолепие было в чистом виде пропагандой. Апофеозом (за неимением Дворца Советов) должны были стать восемь высоток, из которых построили семь, а главный заказчик увидел то ли две, то ли четыре. Ирония не только в том, что этот не дожил, но и в том, что высотки стали символом Москвы в оттепель, когда Хрущев похерил имперский стиль.</p>\n<p>Формула пропаганды имперского века: наше дело вечное, наш вождь всех вождее</p>\n<h3>1956-1964</h3>\n<p>В шестидесятые ссср затопила мозаичная монументалка, поначалу даже живая и весёлая. Главные темы оттепели — космонавты, мирный атом и легко одетые девушки (и юноши) за спортивными занятиями. И миру мир, конечно. Никаких танков и бомбардировщиков, если ракеты — то только с Гагариным. Буквы или совсем простые, или легко летящие. И что особенно заметно: ни одной центральной композиции. Контраст с предыдущей эпохой поразительный. В пропаганду проникло тщательно выживавшееся из нее живое чувство. Но недолго оттепель капала.</p>\n<p>Интересно, что оформление шествий в шестидесятые почти не изменилось по сравнению с имперской эпохой. Если не считать отсутствия одной персоны, без которой вождь мирового пролетариата остался один на хозяйстве. В таком архаичном виде шествия проследовали в застой, где расцвели старым новым красным цветом.</p>\n<p>Формула оттаявшей пропаганды: за всё хорошее и не будем о грустном</p>\n<h3>1965-1984</h3>\n<p>После оттепели случился застой. И еще один, довольно странный для Союза, стиль: брежневский брутализм. Вроде бы этот продукт бетономешалки был в моде по всему миру, но заграницей он стал левацкой реакцией на большой послевоенный стиль для богатых, а в ссср пришелся на время одервенения генсеков и новой имперскости.</p>\n<p>Чем глубже в застой, тем более монументальными и стилизованными становились мозаики. Казалось бы, дряхлеющий соцреализм должен был держаться за натуроподобие, но нет. Он продуцировал выхолащивание формы. Поздние ленины становились всё более гладкоповерхностными, утратив хитринку вместе с рыжинкой.</p>\n<p>Характерной чертой брежневского брутализма стали огромные серп-и-молоты самого разного вида, понаставленные от Москвы до самых Петушков. Это были знаки присутствия системы, символы действующей власти, уже никак не связанные с трудом даже самых условных пролетариев и крестьянства. Точно так же выглядели могучие крышные установки с лозунгами типа «слава кпсс», «народ и партия едины» и «партия ум честь и совесть нашей эпохи». В этих мантрах не было никакого призыва, никакой даже идеи — они фиксировали статус кво. Удивительно, как скоро — за полвека — выветрилась из лозунгов вся суть утопической большевистской доктрины.</p>\n<p>Типографика брежневских воззваний была проста и толста. Главное — чтоб издалека было заметно. По сути дела — пустые слова, на которые как будто никто не обращал внимания. Но вот что любопытно: именно эти славы кпсс посносили. Сталинскую бронзу с лепниной (кроме портретов и вождестатуй) оставили. Хрущевскую задорную космистику оставили — а славу кпсс уничтожили под корешок. По крайней мере в Москве ее не сыскать. Может быть, потому, что крыши понадобились для рекламы?</p>\n<p>Формула пропаганды времён застоя: нас здесь стояло, за нами не занимать</p>\n<p>Был еще перестроечный стиль, но его смыло вместе с перестройкой. А дальше пропаганду стало не отличить от рекламы.</p>\n<p>Конклюзия.</p>\n<p>Когда я начинал эту главу, то собирался просто рассказать о советской монументальной пропаганде. Но вдруг на ночь внезапно начитался ирландских легенд, каких не читал с «Похищения быка из Куальнге», то есть с прошлого века. И теперь я не смогу говорить нормальным языком, пока не напишу эту конклюзию.</p>\n<p>Что же такое советская монументальная пропаганда? Не трудно ответить.</p>\n<p>Это живучая тварь, которая никогда не была сама собой и всегда лгала, но лгала каждый раз по-разному.</p>\n<p>В первую эпоху она лгала, что большевики принесли народу свободу, а на самом деле они ее отобрали.</p>\n<p>Во вторую эпоху лгала, что всё будет хорошо и впереди светлое будущее. А на самом деле впереди были коллективизация, голодомор, а потом Большой террор. А чтобы народ не возмутился, она показала ему усатого злодея, сказав, что это великий вождь. И народ поверил, потому что никогда не видал настоящих великих вождей.</p>\n<p>В третью эпоху она лгала, что жить стало лучше и веселее. А на самом деле жить оставалось недолго и по карточкам, да еще и последнее золото у народа отобрали. А чтобы народ не фрякал, ему показали метро и красные звезды. Народ все еще был наивен и радовался.</p>\n<p>В четвертую эпоху случилась такая война, что лучше помолчать.</p>\n<p>А в пятую пропаганда опять взялась за свое и прославляла людоеда, которого все продолжали считать великим вождем-победителем, хотя победил-то народ.</p>\n<p>В шестую эпоху пропаганда опять сделала вид, что всё хорошо и нынешнее поколение будет жить в раю земном. А на самом деле вместо рая построился застой с дефицитом.</p>\n<p>В последнюю, седьмую эпоху пропаганда состарилась, шамкала губами и издавала невнятные звуки, но и тогда врала напропалую каждым словом. Но народ, которого столько раз водили за нос, уже перестал верить, и только ждал, когда проклятая старуха окочурится.</p>\n<p>И она откинулась. Но после себя оставила великие колдовские артефакты: мавзолей с мумией, метро с перилами дубовыми и лепниной-бронзулиной, кремль с рубиновыми звездами, высотки со шпилями, наконец, сталинки в роли элитного жилья. И пока всё это цело и не расколдовано, не будет у местного населения ясной мысли в головах.</p>\n<p>Ну вот, гейс исполнен.</p>\n<p>Вторая, не менее важная, но намного более подробная часть поста — в подписях к картинкам. Там я детально разбираю каждый случай пропагандирования.</p>", "figs": [["img/08/08-001.jpg", "08-001", "<p>1 мая 1919. Ленин на трибуне
