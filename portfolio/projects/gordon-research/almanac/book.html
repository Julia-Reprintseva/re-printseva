 Сен-Мишель, Париж, 1920. Шапка наборная (да, был такой диковатый шрифт). Орфография старая.</p>", 1.0], ["img/r17/r17-013.jpg", "r17-013", "<p>«Правое дело». 3 сента, Нью-Йорк, 1922. Орфография пока старая, но в Новом свете всё не так однозначно</p>", 1.0], ["img/r17/r17-014.jpg", "r17-014", "<p>«Русское эхо», 1922 год, Шанхай. Вы еще не удивляетесь, как много разнообразной наборной кириллицы было в начале прошлого века по всему миру? Я так очень дивлюсь. Орфография смешанная, с ятями и -аго вместо -ого</p>", 1.0], ["img/r17/r17-015.jpg", "r17-015", "<p>Кулидж и Смит избраны! «Новое русское слово» из Нью-Йорка в 1924 году — с новой орфографией (и апострофом вместо ъ). Интересно, какова партийная принадлежность? Я бы предположил как минимум с-д, а то и коммунистов.</p>", 1.0], ["img/r17/r17-016.jpg", "r17-016", "<p>Пролетарский «Голос труженика» из Чикаго с новой орфографией аж в 1920 году! Радуется отступлению поляков под натиском Красной армии. Радость будет недолгой.<br>У меня был припасён еще «Голос труда» из Буенос Айреса 1923 года в новой орфографии, но как-то он не влез в пост.</p>", 1.0], ["img/r17/r17-017.jpg", "r17-017", "<p>А вот орган демократической мысли «Рижский курьеръ» 1923 года по орфографии не отличить от монархистов.</p>", 1.0], ["img/r17/r17-018.jpg", "r17-018", "<p>Редчайшая модная шапка в духе первых проблесков ардеко: однодневная парижская пасхальная газета «Русскому мальчику». И даже довольно свежий крупнокегельный гротеск в хедлайне. 1926 год</p>", 1.0], ["img/r17/r17-019.jpg", "r17-019", "<p>А вот и национал-революционеры из Шанхая. Они намного более поздние — 1936 года, но сохранили промежуточную орфографию.<br>На всякий случай отмечу, что газета не из неведомых интернетов, а из собрания Государственной публичной исторической библиотеки России. Оттуда же и все остальные газеты</p>", 1.0], ["img/r17/r17-020.jpg", "r17-020", "<p>Обложка демократического журнала «Воля России». Прага, 1926. Леттеринг лого переходный между десятыми и тридцатыми годами. И довольно смелый, даже диковатый.<br>Чем-то неуловимо синим напоминает «Новый мир», хотя знакомая нам обложка появилась на четверть века позже.<br>Судя по орфографии (видите?) — издание очень левое.</p>", 1.0], ["img/r17/r17-021.jpg", "r17-021", "<p>Выходные данные высокохудожественного журнала «Жар Птица» (о нем расскажу в другом посте). 1920 год. Орфография санктъ-петербургская.</p><p>В Берлине нашелся хороший комплект Академической гарнитуры разных кеглей, и с курсивами. Набор, надо сказать, довольно хитроумный. И крупнокегельный акцидентный шрифт подобран к прочему набору не без изящества</p>", 1.0], ["img/r17/r17-022.jpg", "r17-022", "<p>Несколько книг издательства З. И. Гржебина.<br>Первая — Марина Цветаева, «Психея» с подзаголовком «Романтика». 1923 год, обложка (леттеринг, скорее всего Конашевича) и титул (наборный). Старая орфография.</p>", 1.0], ["img/r17/r17-023.jpg", "r17-023", "<p>Борис Пастернак, «Сестра моя жизнь». Гржебин, Берлин, Петербург, Москва, 1923 (заметим — на советский рынок).<br>Титул и фронтиспис (кажется, он был за титулом, тоже на правой полосе). Книга роскошная, в футляре и твердом переплете. Очень аккуратный набор одной Обыкновенной гарнитурой разных кеглей. Портрет работы Ю. Анненкова.<br>Орфография — советская. Издание того же года, что и Цветаева. Одно издательство. Разные орфографии.</p>", 1.0], ["img/r17/r17-024.jpg", "r17-024", "<p>Обложка и титул посмертного издания Николая Гумилёва.<br>На обложке леттеринг Конашевича (не проверял, но почти уверен). Титул набран Пальмирой. Петербург — Берлин, 1922. Новая орфография, которую автор, скорее всего, не одобрил бы.<br>Что удивительно: Гржебин собирался продавать в свежерожденном ссср стихи расстрелянного поэта.</p>", 1.0], ["img/r17/r17-025.jpg", "r17-025", "<p>Залихватский Есенин — того же Гржебина, 1922. Кто рисовал обложку — не знаю, хотя инициалы Н. З. должны были бы что-то прояснить. Если знаете — напишите, пожалуйста, коммент.</p>", 1.0], ["img/r17/r17-026.jpg", "r17-026", "<p>Обложка и полоса из «Кота в сапогах» с картинками Конашевича. Гржебин, Берлин, 1922. Новая орфография и апостроф вместо твердого знака. Видите, где? )</p>", 1.0], ["img/r17/r17-027.jpg", "r17-027", "<p>Последние две картинки — намного более поздние. Это обложка и полоса из «Современных записок» 1938 года, Парижъ. Вот здесь меня старая орфография прямо корёжит: ну сколько можно? И ведь это не монархический вестник, а вполне передовое интеллигентское издание.</p>", 1.0], ["img/r17/r17-028.jpg", "r17-028", "<p>Что общего у сверхнового писателя-интеллектуала Сирина в 1938 году и константинопольских казаков в 1920-м? Орфография.</p><p>Глава 5 из романа «Даръ» (после четырех пропущенных по настоятельным просьбам обиженных демократов, любителей Николая Гаврилыча).</p><p>Очень в набоковском стиле заканчивается полоса: «романтическое приключение с Любовью &lt;…&gt;, заразившей его любовью».</p>", 1.0]], "research": null}, {"intro": false, "num": "18", "title": "Другая кириллица", "ptitle": "Другая кириллица", "subtitle": "", "date": "26 декабря 2022", "perm": "https://www.facebook.com/story.php", "slug": "", "html": "<p><span class=\"dc\">О</span>бычно, говоря о вариантах кириллицы, у нас в Москве прежде всего вспоминают «болгарицу» — радикальный переход болгарских типографов на стоячий курсив в начале 60-х годов прошлого века. Действительно, это был смелый шаг, вплотную приблизивший наборную кириллицу к латинской матрице.</p>\n<p>Но значительно раньше, в начале 20 века, расцвела не менее мощная, но значительно более артистичная ветвь — украинская кириллица. Она была своеобычна, непохожа на общероссийскую, и росла из крепкого старого корня — более старого, чем московский.</p>\n<p>Скажу даже сильнее: украинская кириллица — другой алфавит, с пластической точки зрения. Она была иначе написана и по-иному переведена в литеры, чем московская. В ее пластике намного меньше Византии и куда больше Возрождения. Если бы Украину не накрыло Московией, тамошняя кириллица спокойно перетекла бы из средневековых форм в антиквенные без всякой петровской реформы. В работах украинских художников начала 20 века часто встречаются именно эти, переходные, из 17 века, формы.</p>\n<p>Каюсь: мне почти ничего не было известно об украинском модерне и авангарде. Конечно, я знал Нарбута и видел пару работ Василя Кричевского. Но никак не предполагал, что в Украине было так много сильных мастеров книжного леттеринга и каллиграфии.</p>\n<p>Мы, московские, привыкли делить буквы на до- и послепетровские. Устав и скоропись отдельно — антиква с гротеском отдельно. В Украине вообще нет понятия «старая форма». Любой, даже авангардный проект может в любую минуту прорасти украинской скорописью (ооочень непохожей на московскую) или превратиться в вязевую стену с двухэтажными лигатурами.</p>\n<p>Мало того: антиквенные формы отлично сочетаются со старославянскими. Между ними нет надзирателя, разгоняющего старых в одну, а новых — в другую сторону. Исторический поток непрерывен, и это сильно напоминает плавный переход готических форм в антиквенные где-нибудь в 15-м веке. И любая из стадий перехода может попасть в работу художника 20 века.</p>\n<p>Прежде чем перейти к картинкам, скажу, откуда они. Оказывается, есть великолепная открытая коллекция украинской печатной шрифтовой графики. Насколько я понимаю, она собрана одним специалистом, Marchela Mozhina. Впечатляющий труд! Ничего подобного по-русски я пока не видел.</p>\n<p>В нынешней подборке — украинская типографика от десятых до середины двадцатых годов. Позже было не меньше прекрасного, поэтому я решил разбить пост на два времени. Нарбута нет — умышленно. Возможно, в выборку попал кто-то из его учеников. Здесь мастера, ставшие для меня открытием. Не даю никаких биографических ссылок, кроме времени выхода работ. Пусть будет чистое удивление и радость.</p>\n<p>Василь Кричевский.</p>\n<p>Я бы назвал его украинским Гиллом за сильную, чистую, суховатую линию. Некоторые работы Кричевского напоминают венский сецессион, сочетая минимализм с декоративностью.</p>\n<h3>Василь Ермилов</h3>\n<p>Удивительный художник. Лёгкий, наивный, не мастеровитый, но мастерский. И очень разный.</p>\n<h3>Роберт Лисовский</h3>\n<p>Мощный леттерингист яркого национального стиля, сохранивший пластику знаков во все долгие годы работы.</p>\n<h3>Павло Ковжун</h3>\n<p>Пышный украинский модерн, отчасти близкий к чехонинско-нарбутовскому.</p>\n<p>И еще многие, многие другие. Смотрите подписи к картинкам.</p>\n<p>Не знаю, можно ли включать украинскую кириллицу в мои «Буквы 20 века». Это отдельная тема, заслуживающая собственной книги. Пока пусть будет этот пост. Хотя бы для того, чтобы показать, как много остается за узким лучом моего фонарика.</p>", "figs": [["img/r18/r18-001.jpg", "r18-001", "<p>Василь Кричевский. Отблески. 1905.<br>Украинская скоропись, очень мало общего имеющая с московской — и много с европейским курсивом.</p>", 1.0], ["img/r18/r18-002.jpg", "r18-002", "<p>Василь Кричевский. История Украины. Киев, 1912.<br>Еще один образец украинской скорописи с сумасшедшей С, вылетающей под строку.<br>Не знаю, как у вас, у меня чувство, что леттеринг сделан для своих, понимающих его законы, без всякой скидки на профанов.</p>", 1.0], ["img/r18/r18-003.jpg", "r18-003", "<p>Василь Кричевский. Проект издательской марки Всеукраинского кооперативного издательского союза. 1919.<br>Украинский сецессион.</p>", 1.0], ["img/r18/r18-004.jpg", "r18-004", "<p>Василь Кричевский. Серийная обложка Всеукраинского кооперативного издательского союза. Киев, 1919.<br>Лигатуры в верхних строках. Везде отсылки к старой кириллице, данные через пластику позднего модерна.</p>", 1.0], ["img/r18/r18-005.jpg", "r18-005", "<p>Василь Кричевский. 350 лет украинскому книгопечатанию. 1924. Композиция [350] на мой взгляд совершенно гилловская. И опять легкое сочетание современных, барочных и старославянских форм</p>", 1.0], ["img/r18/r18-006.jpg", "r18-006", "<p>Василь Ермилов. Обложка журнала. 1918.<br>Ермилов настолько же лёгок, насколько Кричевский точен. У него перетекание старых форм в современные идет на уровне прямой речи. Как будто художнику просто нравится вставлять тут и там загогулистые старинные слова</p>", 1.0], ["img/r18/r18-007.jpg", "r18-007", "<p>Василь Ермилов. Обложка. 1920.<br>Смотрю и радуюсь. Просто вот улыбаюсь. Ну ведь круто сделано, но как будто ребенок порисовал. И опять украинская скоропись, еще сильнее сплавленная с еврокурсивом.</p>", 1.0], ["img/r18/r18-008.jpg", "r18-008", "<p>Василь Ермилов. Плакат. 1920. Снова немыслимая лёгкость букв, необязательность форм и точнейший ритм.<br>Обратите внимание на украинскую У в виде V.</p>", 1.0], ["img/r18/r18-009.jpg", "r18-009", "<p>Василь Ермилов. 1920. Может быть, лучшая обложка Хлебникова</p>", 1.0], ["img/r18/r18-010.jpg", "r18-010", "<p>Василь Ермилов. 1920. Ну как он это делает?!</p>", 1.0], ["img/r18/r18-011.jpg", "r18-011", "<p>Василь Ермилов. 1920. И ещё. Люблю такое.</p>", 1.0], ["img/r18/r18-012.jpg", "r18-012", "<p>Василь Ермилов. 1920. Харьков. 50 экземпляров. Колофон со старинными переносами.</p>", 1.0], ["img/r18/r18-013.jpg", "r18-013", "<p>Василь Ермилов. Виньетка УСРР.</p>", 1.0], ["img/r18/r18-014.jpg", "r18-014", "<p>Василь Ермилов. Обложка брошюры. Харьков 1921.<br>Авангардная композиция и традиционные формы букв. Это чисто украинский ход.</p>", 1.0], ["img/r18/r18-015.jpg", "r18-015", "<p>Василь Ермилов. Серийная обложка. Харьков, 1921.<br>Я обзавидовался</p>", 1.0], ["img/r18/r18-016.jpg", "r18-016", "<p>Василь Ермилов. Упаковка цигарок.</p>", 1.0], ["img/r18/r18-017.jpg", "r18-017", "<p>Василь Ермилов. Обложка. 1921</p>", 1.0], ["img/r18/r18-018.jpg", "r18-018", "<p>Василь Ермилов. Обложка. Харьков, 1922.<br>Как можно быть мастером без капли мастеровитости (скрытая цитата из Л. Тишкова)</p>", 1.0], ["img/r18/r18-019.jpg", "r18-019", "<p>Василь Ермилов. Тоже, кажется, папиросная коробка.<br>Чистый кайф.</p>", 1.0], ["img/r18/r18-020.jpg", "r18-020", "<p>Роберт Лисовский. Обложка. 1918<br>Уровень буквенной свободы, которого не было в России.</p>", 1.0], ["img/r18/r18-021.jpg", "r18-021", "<p>Роберт Лисовский. 1923. Обложка в чистом стиле модерн с характерными украинскими N. Вот почему их нет в кириллице — так красиво )<br>И снова, обратите внимание: «славянские» уставные формы непринужденно сочетаются с антиквенными.</p>", 1.0], ["img/r18/r18-022.jpg", "r18-022", "<p>Роберт Лисовский. Обложка. Берлин – Киев, 1922.<br>Лисовский выработал собственный рисованный шрифт, который потом использовал вплоть до 80-х годов. Буквы максимально пряные, декоративные, при этом свободные от всяческих исторических и стилевых ограничений.</p>", 1.0], ["img/r18/r18-023.jpg", "r18-023", "<p>Павло Ковжун. Обложка. Львов, 1921.<br>«Славянские» формы вперемежку с гротеском. И орнамент такой густоты, что нет сомнений в стране происхождения (кстати, Львов в то время был в составе Польши).</p>", 1.0], ["img/r18/r18-024.jpg", "r18-024", "<p>Павло Ковжун. Обложка. Львов, 1922. Какая З!</p>", 1.0], ["img/r18/r18-025.jpg", "r18-025", "<p>Павло Ковжун. Обложка. Львов, 1922. Внезапная вязь с безжалостными лигатурами.</p>", 1.0], ["img/r18/r18-026.jpg", "r18-026", "<p>Микола Мищенко. Обложка журнала. Харьков, 1925.<br>Украинский конструктивизм</p>", 1.0], ["img/r18/r18-027.jpg", "r18-027", "<p>Микола Мищенко. Обложка. Харьков, 1926.<br>Вдруг две курсивных буквы посреди протоардекошного леттеринга.</p>", 1.0], ["img/r18/r18-028.jpg", "r18-028", "<p>Микола Мищенко. Обложка. Харьков, 1926.<br>По-моему, шикарно пойманный поэтический ритм. Прямо моностих из одного слова.</p>", 1.0], ["img/r18/r18-029.jpg", "r18-029", "<p>Микола Мищенко. Обложка. Харьков, 1926.<br>Удивительно удачно вписалось слово «Порвать», продырявившее бумагу</p>", 1.0], ["img/r18/r18-030.jpg", "r18-030", "<p>Борис Фридкин, Лев Каплан. Обложка. Харьков, 1923.<br>Еще пример стилизованной украинской скорописи</p>", 1.0], ["img/r18/r18-031.jpg", "r18-031", "<p>Лев Каплан. Эмблема. Харьков, 1926</p>", 1.0], ["img/r18/r18-032.jpg", "r18-032", "<p>Адольф Страхов. Обложка. Харьков, 1922<br>Леттеринг — модерн со славянскими мотивами</p>", 1.0], ["img/r18/r18-033.jpg", "r18-033", "<p>Юхим Михайлов. 1000 карбованцев. Киев, 1918.<br>Не верится, что все надписи на ценной бумаге — от руки</p>", 1.0], ["img/r18/r18-034.jpg", "r18-034", "<p>Юхим Михайлов. Обложка. 1924.</p>", 1.0], ["img/r18/r18-035.jpg", "r18-035", "<p>Олексий Маренков. Обложка. Киев – Харьков, 1927.<br>Сигмообразные С — тоже чисто украинский специалитет</p>", 1.0]], "research": null}, {"intro": false, "num": "19", "title": "Ликбез и азбучные истины", "ptitle": "Ликбез и азбучные истины", "subtitle": "", "date": "20 января 2023", "perm": "https://www.facebook.com/story.php", "slug": "", "html": "<div class=\"epi\"><p>«В целях предоставления всему населению Республики возможности сознательного участия в политической жизни страны СНК постановил:</p></div>\n<p><span class=\"dc\">1</span>. Всё население Республики в возрасте от 8-50 лет, не умеющее читать и писать, обязано обучаться грамоте на родном или русском языке по желанию.</p>\n<p>Декрет СНК о ликвидации безграмотности среди населения РСФСР. 26 декабря 1919»</p>\n<p>Большевики были одновременно кремлёвскими мечтателями и вполне циничными практиками. С одной стороны, они хотели Просвещения с заглавной буквы ради самого просвещения. С другой — насаждали грамотность в обязательном порядке для «сознательного участия населения в политической жизни».</p>\n<p>Учитывая, что все оппозиционные партии были запрещены вместе с их печатными органами, сознательное участие должно было сводиться к постановке галочки в правильном месте.</p>\n<p>То есть, ликвидация безграмотности была для советской власти прежде всего методом политического воздействия на подвластное население.</p>\n<p>Пишу об этом потому, что в том же самом 1919 году на территории, находившейся под контролем белых, грамотность тоже была в приоритете. Правда, без обязаловки и декрета. Интересно, что для обучения чтению и письму там использовали, в том числе, трофейные советские азбуки. Как это было возможно — см. ниже.</p>\n<p>Красная власть превратила обучение письму и счету в огромную, ярчайшую пропагандистскую кампанию, длившуюся непрерывно чуть ли не до следующей войны. При этом, конечно, преодолевались невероятные трудности и совершались чудеса гуманизма. Чего стоит обучение миллионов беспризорников в Деткомиссии ЧК!</p>\n<p>Кстати, кто такой беспризорник? Это не просто сирота-безотцовщина, у которого тятька погиб на германской войне. Это ребенок вообще без родственников: без бабушки с дедушкой, без дяди с тетей. Чтобы такое случилось, добрые люди должны были вырезать всю деревню. Или пустить в распыл семейство социально не близких. Напомню, что сначала большевики превратили империалистическую в гражданскую, а потом создали печально известную чрезвычайную комиссию. То есть сначала озаботились массовым производством беспризорников, а после героически их спасали.</p>\n<p>А ведь если бы не гражданская В., к 1921 году все дети в России должны были научиться грамоте. Это был скромный план Министерства народного просвещения от 1916 года. Ну да что вспоминать.</p>\n<p>Ликбез предполагал обучение грамоте не только детей, но и взрослых. Специально для взрослой азбуки был придуман слоган-скороговорка «мы не рабы, рабы немы». Или «рабы — не мы». В первом случае имеется в виду, что мы, в отличие от рабов, разговорчивы.</p>\n<p>Общего плана обучения, судя по всему, вначале не было. Первая азбука «по новой орфографии», что мне попалась, копирует дореволюционную. Там даже на одной картинке остался заголовок «Въ лѣсу» (а под ним текст про другое). Возможно, именно такие азбуки достались белым от красных. А среди белых вполне могли найтись прогрессивные учителя, сторонники новой орфографии. Скажем, в Архангельской губернии в 1919 году действовало социалистическое правительство.</p>\n<p>Что касается собственно обучения письму и прописей, никаких изменений по сравнению с царской гимназией не было. Тот же слитный почерк «с нажимом», та же линовка. Так будут учить письму до появления шариковых ручек в конце шестидесятых. Единственное изменение — тексты прописей. Например, «баба не раба» вначале и «Ленин. Сталин. Калинин. Молотов. Ворошилов. Каганович. Киров. Куйбышев». в конце. Кстати, по реестру вождей легко проверить, кто еще жив и какое место в пирамиде занимает.</p>\n<p>А ведь могло обойтись и без Молотова с Кагановичем. Начало 20 века — время азбук. Образование становилось массовым и действительно необходимым. А сама форма азбуки — актуальным артобъектом.</p>\n<p>Для художников модерна азбука — повод нарисовать что-то диковинное на нужную букву. Для авангардистов наоборот — упростить до лаптя, топора — и аэроплана. Пока готовил пост, выяснил, что азбуку рисовал не только Нарбут с его украинской Абеткой, но и Бенуа, Добужинский, Конашевич. Ну, и Маяковский с Лебедевым, конечно. Раньше это мелькало по другим поводам отдельными листами, а сейчас сложилось для меня в жанр. Попутно собрал несколько цельных азбук в пдфы и выложу в комментах — любуйтесь.</p>\n<p>Последняя тема — а могла быть первой — плакаты ликбеза. Их навыпускали тонны, самых разных. Мне кажется, они делятся на две большие группы. Первая — от прекраснодушных попутчиков вроде Николая Купреянова: знание — свет, невежество — тьма. Они как правило не красные (в смысле основного цвета) и по сути нежно-уговаривающие. Вторая группа — советские-советские. Они прямо агитируют: выучился сам — научи товарища. И так — больше десяти лет подряд, с 1919 до самых пятилеток. Такое чувство, что ликбез как-то притормаживал, а непонятливое население старалось увернуться от обязаловки.</p>\n<p>И это при том, что еще до всякой революции мужики, что посмышлёнее, сами отправляли детей в школу — смекнув, где начальная остановка социального лифта. Может быть, повернись история чуть иначе, борьба с неграмотностью в России прошла бы как везде — сравнительно тихо, скучновато и без плакатов?</p>\n<p>Как всегда, не пропустите подписи к картинкам. Там много невероятно интересного.</p>\n<p class=\"ps\"><span class=\"pslabel\">PS</span> Две истории из семейной истории. Моя белорусская бабушка и мой латышский дедушка были сельскими учителями в западной Белоруссии. До германской войны и революции. Такая сельская интеллигенция из крестьян. Потом дедушка ушел на фронт унтер-офицером, потом стал белогвардейцем — а дальше следы его пропали. Бабушка бежала от войны почему-то в Орел, где видимо встретила дедушку-белогвардейца и родила мою маму. Потом они с мамой добежали до Сибири, откуда неведомо как попали в Москву. Ни бабушка, ни дедушка в ликбезе участия не приняли. Бабушка вообще свое учительство почему-то не афишировала. А ведь могли бы еще поучить — такое сослагательное наклонение.</p>\n<p>А вот папа начал учиться в семь лет с меламедом (1926 год). Семья была сильно религиозная. То есть папин ликбез прошел с доставкой на дом и на идише. Но через год мой еврейский дедушка трагически умер от перитонита, и религиозность сильно просела. Еще через год папины старшие братья-комсомольцы вдруг всполошились: «а что это Мишка в школу не ходит?!» И отвели девятилетнего папу сразу в третий класс. В тот день был диктант, в котором папа сделал 35 ошибок. Но потом всё наладилось, и к десятому классу он стал круглым отличником. Правда, красного аттестата не получил, а наоборот, был из школы исключен за излишнюю удаль. А потом восстановлен. Но это уже другая история )</p>", "figs": [["img/r19/r19-001.jpg", "r19-001", "<p>Долой неграмотность. Букварь для взрослых. Москва, 1920.<br>Как вы думаете, кто здесь учитель? Мне почему-то кажется, что это инвалид слева. Солдат ведь учили грамоте</p>", 1.0], ["img/r19/r19-002.jpg", "r19-002", "<p>Долой неграмотность. Букварь для взрослых. Москва, 1920.<br>Обучение грамоте по-советски: все без исключения тексты — пропаганда</p>", 1.0], ["img/r19/r19-003.jpg", "r19-003", "<p>Долой неграмотность. Букварь для взрослых. Москва, 1920.<br>Мы не бары, бары не мы, не бары мы. На правой странице — барин, чтоб не забывать, как нельзя одеваться</p>", 1.0], ["img/r19/r19-004.jpg", "r19-004", "<p>Долой неграмотность. Букварь для взрослых. Москва, 1920.<br>Какой раз повторено «мы не рабы»?<br>На фоне тотальной антибуржуазной пропаганды очень мило смотрятся прописи, набранные каллиграфическим шрифтом, ранее использовавшимся преимущественно для визитных карточек.</p>", 1.0], ["img/r19/r19-005.jpg", "r19-005", "<p>Азбука-сеятель. Петроград, 1915. Это один из многих такого рода учебников, стандарта не было</p>", 1.0], ["img/r19/r19-006.jpg", "r19-006", "<p>Азбука-сеятель. Петроград, 1915.<br>Первый разворот. Обучение письму деталей букв. Первые буквы для занятий — А, У, М.</p>", 1.0], ["img/r19/r19-007.jpg", "r19-007", "<p>Азбука-сеятель. Петроград, 1915.<br>Типовой разворот из середины: волкъ вылъ, кротъ рылъ, мама мыла Власа.</p>", 1.0], ["img/r19/r19-008.jpg", "r19-008", "<p>Азбука-сеятель. Петроград, 1915.<br>В конце букваря — «буквы церковнославянские». Это обычная практика — церковное идет приложением.</p>", 1.0], ["img/r19/r19-009.jpg", "r19-009", "<p>Азбука-сеятель. Петроград, 1915.<br>Простейшие рисунки</p>", 1.0], ["img/r19/r19-010.jpg", "r19-010", "<p>Азбука-сеятель. Петроград, 1915.<br>А вот приложение с цветными таблицами довольно богатое</p>", 1.0], ["img/r19/r19-011.jpg", "r19-011", "<p>Букварь новой народной школы для классного и домашнего обучения по новой орфографии. Москва — Петроград, 1920. Издание 11-е (!)<br>Когда успело 11 раз издать этот букварь частное т-во Думнова и наследники бр. Салаевых?<br>И никаких признаков советской власти</p>", 1.0], ["img/r19/r19-012.jpg", "r19-012", "<p>Букварь новой народной школы для классного и домашнего обучения по новой орфографии. Москва — Петроград, 1920.<br>Первый разворот. Практически те же прописи, что и в 1915</p>", 1.0], ["img/r19/r19-013.jpg", "r19-013", "<p>Букварь новой народной школы для классного и домашнего обучения по новой орфографии. Москва — Петроград, 1920.<br>Второй разворот. Первые буквы: А, У, М</p>", 1.0], ["img/r19/r19-014.jpg", "r19-014", "<p>Разворот из середины. Параша ловила муху. Сено сыро.<br>Годится для белой школы.</p>", 1.0], ["img/r19/r19-015.jpg", "r19-015", "<p>Букварь новой народной школы для классного и домашнего обучения по новой орфографии. Москва — Петроград, 1920.<br>А вот и клише с ятью и твердым знаком.</p>", 1.0], ["img/r19/r19-016.jpg", "r19-016", "<p>Букварь новой народной школы для классного и домашнего обучения по новой орфографии. Москва — Петроград, 1920.<br>Картинки в конце — почти как в «Азбуке-сеятеле»</p>", 1.0], ["img/r19/r19-017.jpg", "r19-017", "<p>Тетрадь. 1924 год. На задней обложке — как во всех тетрадях того времени — перевод метрических мер в русские. Чему равна одна четверть или две осьмины?<br>Но самое любопытное — справа внизу. Календарь праздников. Оказывается, Духов день в ссср в 1924 году был выходным</p>", 1.0], ["img/r19/r19-018.jpg", "r19-018", "<p>Тетрадь. Госиздат, 1925<br>На обложке тов. Бухарин в колосьях, а под ним рабочий ручкается с крестьянином. На крестьянине — сапоги. Если присмотреться, все три персонажа примерно ровесники.</p>", 1.0], ["img/r19/r19-019.jpg", "r19-019", "<p>Тетрадь. Госиздат, 1925<br>Список литературы. Одни ужастики</p>", 1.0], ["img/r19/r19-020.jpg", "r19-020", "<p>Тетрадь. Середина 1920-х.<br>На обложке тов. Рыков (догадайтесь, почему).<br>Под ним крестьянин с рабочим складывают фигуру. На задней обложке — метры и аршины</p>", 1.0], ["img/r19/r19-021.jpg", "r19-021", "<p>Тетрадь. Середина 1920-х. Та, что с Рыковым.<br>На третьей сторонке обложки — правила новой орфографии.<br>Почерк явно не ребенка, да и текст про луну. Но написано простой ручкой — видно где перо макали и буквы жирнее.</p>", 1.0], ["img/r19/r19-022.jpg", "r19-022", "<p>Тетрадь для русского языка на 1925-26 учебный год.<br>Текст про Кавказ оттуда же. Империя рухнула, имперское отношение осталось.</p>", 1.0], ["img/r19/r19-023.jpg", "r19-023", "<p>Тетрадь «по теме» Александра В. Зуева. 1928 г.<br>Александр — ученик сельской школы. Поэтому В. неспроста: в его классе учился еще и Александр Г. Зуев.<br>Из этой тетради советского отличника показываю несколько страниц с текстами. Читайте.</p>", 1.0], ["img/r19/r19-024.jpg", "r19-024", "<p>Тетрадь «по теме» Александра В. Зуева. 1928 г.<br>Сверху инфографика. Внизу задача про двух летчиков, американца и англичанина. Причем американец летит в верстах, а англичанин в км</p>", 1.0], ["img/r19/r19-025.jpg", "r19-025", "<p>Тетрадь «по теме» Александра В. Зуева. 1928 г.<br>Вверху — текст о бедствиях германской войны, еще не названной Первой мировой.<br>Внизу — начало текста о преимуществах нового строя. Колхозов еще нет.</p>", 1.0], ["img/r19/r19-026.jpg", "r19-026", "<p>Тетрадь «по теме» Александра В. Зуева. 1928 г.<br>Чудесный текст о нашей торговле с заграницей.<br>С тех пор резины у нас прибавилось</p>", 1.0], ["img/r19/r19-027.jpg", "r19-027", "<p>Тетрадь «по теме» Александра В. Зуева. 1928 г.<br>Продолжение текста о преимуществах социализма.<br>Внизу — разгадка вопроса про тов. Рыкова</p>", 1.0], ["img/r19/r19-028.jpg", "r19-028", "<p>Тетрадь «по теме» Александра В. Зуева. 1928 г.<br>А это про сельсовет.<br>Обратите внимание на почерк А. В. Зуева. Это модный в 10-20-е годы стоячий курсив. Считалось, что он разборчивее (что правда) и лучше с физической точки зрения.</p>", 1.0], ["img/r19/r19-029.jpg", "r19-029", "<p>Пионер. Детский букварь. Ленинград, 1925<br>За спиной ученика кудряво дымят ещё не построенные заводы. Эта обложка середины НЭПа, взгляд в будущее</p>", 1.0], ["img/r19/r19-030.jpg", "r19-030", "<p>Пионер. Детский букварь. Ленинград, 1925<br>В середине 20-х советские дети наряжаются в скаутскую форму с галстуками и непременными короткими штанами</p>", 1.0], ["img/r19/r19-031.jpg", "r19-031", "<p>Разворот из прописей начала 30-х.<br>Слева ожил лужок — справа вожди в ассортименте.<br>Прописи, кстати, немного пуританские, без завитушек у заглавных. Эти завитушки то исчезали, то возвращались, пока не были отменены шариковой ручкой</p>", 1.0], ["img/r19/r19-032.jpg", "r19-032", "<p>Азбука в картинках Александра Бенуа. 1905</p>", 1.0], ["img/r19/r19-033.jpg", "r19-033", "<p>Азбука в картинках Александра Бенуа. 1905<br>Узнаю модерниста: буквы классицистические, фигура экзотическая</p>", 1.0], ["img/r19/r19-034.jpg", "r19-034", "<p>Азбука в картинках Александра Бенуа. 1905<br>Война и мир в одном развороте</p>", 1.0], ["img/r19/r19-035.jpg", "r19-035", "<p>Азбука в картинках Александра Бенуа. 1905<br>Ять еще в чести.</p>", 1.0], ["img/r19/r19-036.jpg", "r19-036", "<p>Азбука в рисунках Вл. Конашевича. Голике и Вильборг, 1918.<br>Картинки сделаны для дочери художника и только позже опубликованы.</p>", 1.0], ["img/r19/r19-037.jpg", "r19-037", "<p>Азбука в рисунках Вл. Конашевича. Голике и Вильборг, 1918.<br>Азбука в новой орфографии, но ять присутствует</p>", 1.0], ["img/r19/r19-038.jpg", "r19-038", "<p>Азбука в рисунках Вл. Конашевича. Голике и Вильборг, 1918.<br>Вам ничего не напоминает этот хоровод?</p>", 1.0], ["img/r19/r19-039.jpg", "r19-039", "<p>Азбука в рисунках Вл. Конашевича. Голике и Вильборг, 1918.<br>Фите поставлен веночек. Ижица изображена в виде безвестной могилки</p>", 1.0], ["img/r19/r19-040.jpg", "r19-040", "<p>Азбука М. Добужинского. 1925</p>", 1.0], ["img/r19/r19-041.jpg", "r19-041", "<p>Азбука М. Добужинского. 1925<br>Как узнать мирискусника? По форме букв и по иностранным словам в русской азбуке</p>", 1.0], ["img/r19/r19-042.jpg", "r19-042", "<p>Азбука М. Добужинского. 1925<br>Ау, Леонид Тишков! Водолаз представлен жутким гостем из будущего</p>", 1.0], ["img/r19/r19-043.jpg", "r19-043", "<p>Азбука М. Добужинского. 1925<br>Изобретатель чашки, туфельки и котла</p>", 1.0], ["img/r19/r19-044.jpg", "r19-044", "<p>Азбука М. Добужинского. 1925<br>Экзотика в начале, экзотика на Ч.<br>До политкорректности почти век</p>", 1.0], ["img/r19/r19-045.jpg", "r19-045", "<p>Абетка Георгия Нарбута. Голике и Вильборг, 1917.</p>", 1.0], ["img/r19/r19-046.jpg", "r19-046", "<p>Абетка Георгия Нарбута. Голике и Вильборг, 1917.<br>Две украинских Г</p>", 1.0], ["img/r19/r19-047.jpg", "r19-047", "<p>Абетка Георгия Нарбута. Голике и Вильборг, 1917.<br>Буквы барочные. Такие засечки, как у И, я недавно встретил в Турине, в храме 17 века</p>", 1.0], ["img/r19/r19-048.jpg", "r19-048", "<p>Абетка Георгия Нарбута. Голике и Вильборг, 1917.</p>", 1.0], ["img/r19/r19-049.jpg", "r19-049", "<p>Советская азбука. 1919.<br>Авторы — Владимир Маяковский, Роман Якобсон, Яков Гурьян</p>", 1.0], ["img/r19/r19-050.jpg", "r19-050", "<p>Советская азбука. 1919.<br>Советская школота резвится. «Арзамас» пишет, что они хотели «сделать неприличное приличным».<br>А по мне — просто хотели весело похамить.</p>", 1.0], ["img/r19/r19-051.jpg", "r19-051", "<p>Советская азбука. 1919.<br>Все три автора — чистой воды интеллигенты. Но! Советские интеллигенты. До сих пор многие господа с дипломами обижаются, когда их назовешь интеллигенцией.<br>Забавно, что на месте городового в 1919 г. должен стоять ревматрос или чекист в кожанке</p>", 1.0], ["img/r19/r19-052.jpg", "r19-052", "<p>Советская азбука. 1919.<br>Пишу этот коммент в Абруццо, где Д’Анунцио — национальный поэт и герой.<br>Кажется, для Маяковского сотоварищи он тоже был довольно привлекательной персоной</p>", 1.0], ["img/r19/r19-053.jpg", "r19-053", "<p>Азбука революции. Екатеринослав, 1921. Художник Адольф Страхов<br>Очень характерно украинская обложка</p>", 1.0], ["img/r19/r19-054.jpg", "r19-054", "<p>Азбука революции. Екатеринослав, 1921. Художник Адольф Страхов<br>Азбука — комплект плакатов-комиксов на стихотворной подкладке. Первое слово — Арена.</p>", 1.0], ["img/r19/r19-055.jpg", "r19-055", "<p>Азбука революции. Екатеринослав, 1921. Художник Адольф Страхов<br>Окна РОСТа на новый лад</p>", 1.0], ["img/r19/r19-056.jpg", "r19-056", "<p>Азбука революции. Екатеринослав, 1921. Художник Адольф Страхов<br>К 1921 году у красных — полностью сложившийся набор визуальных штампов. А нарисовано красиво</p>", 1.0], ["img/r19/r19-057.jpg", "r19-057", "<p>Азбука революции. Екатеринослав, 1921. Художник Адольф Страхов<br>Два мира — два стрелка. Последний стих начинается со слова «Язвить»</p>", 1.0], ["img/r19/r19-058.jpg", "r19-058", "<p>Азбука В. Лебедева. Госиздат, Ленин 1925 град</p>", 1.0], ["img/r19/r19-059.jpg", "r19-059", "<p>Азбука В. Лебедева. Госиздат, Ленин 1925 град<br>Блестяще придумано! Зачем акула? Для композиции!</p>", 1.0], ["img/r19/r19-060.jpg", "r19-060", "<p>Азбука В. Лебедева. Госиздат, Ленин 1925 град<br>Из-за козла показываю</p>", 1.0], ["img/r19/r19-061.jpg", "r19-061", "<p>Азбука В. Лебедева. Госиздат, Ленин 1925 град<br>Говорил я, что у авангардистов на Т топор?<br>И трамвайчик-зайчик</p>", 1.0], ["img/r19/r19-062.jpg", "r19-062", "<p>Азбука В. Лебедева. Госиздат, Ленин 1925 град<br>Буква Э — единственная с засечкой.<br>Долго думал, что внизу электросамокат.</p>", 1.0], ["img/r19/r19-063.jpg", "r19-063", "<b>Плакаты ликбеза. Серия, 1920<br>Вот она, бабанераба</b><p>Спустя век хочется прописать: «мы не рабы, мы — атомы»</p>", 1.0], ["img/r19/r19-064.jpg", "r19-064", "<p>Плакаты ликбеза. Серия, 1920</p>", 1.0], ["img/r19/r19-065.jpg", "r19-065", "<p>Плакаты ликбеза. Серия, 1920<br>Дизайнер был не прост и в шрифтах понимал.<br>Прописи — редкий скрипт с [д] хвостиком вверх.</p>", 1.0], ["img/r19/r19-066.jpg", "r19-066", "<p>Плакаты ликбеза. Серия, 1920<br>Затрудняюсь сказать, что значит «иду тина бита»</p>", 1.0], ["img/r19/r19-067.jpg", "r19-067", "<p>Неграмотный — тот же слепой. А. Радаков, Ленинград, 1918<br>Плакат первого типа — за всё хорошее против всего плохого. Но вот зачем быть грамотным — вопрос</p>", 1.0], ["img/r19/r19-068.jpg", "r19-068", "<p>С. Иванов. 1920.<br>Плакат первого типа: красиво, но непонятно.<br>Интересно, что слово «обязанность» взято прямо из декрета, но в этом контексте означает что-то другое.<br>Одно точно: читать — не радость</p>", 1.0], ["img/r19/r19-069.jpg", "r19-069", "<p>А Радаков. 1920<br>Плакат первого типа, красивый, с книжками на качелях</p>", 1.0], ["img/r19/r19-070.jpg", "r19-070", "<p>Н. Купреянов. Книги — источник знания. 1919<br>Плакат первого типа: красиво, задумчиво и без красного цвета.</p>", 1.0], ["img/r19/r19-071.jpg", "r19-071", "<p>А. Зеленский. Петроград, 1920.<br>Красивый лист, интересные буквы. Похоже, имеется в виду обряд с возложением серпа на книгу</p>", 1.0], ["img/r19/r19-072.jpg", "r19-072", "<p>Госиздат, 1921<br>Плакат второго типа: много красного и понятно, зачем книги.<br>Все ассоциации со священным писанием, рукой бога и прочей горой Синаем случайны</p>", 1.0], ["img/r19/r19-073.jpg", "r19-073", "<p>Издал отдел народного просвещения МСРД.<br>Плакат первого типа, аж даже с просвещенЬем и арнувошными шрифтовыми изысками</p>", 1.0], ["img/r19/r19-074.jpg", "r19-074", "<p>Госизд, 1920.<br>Плакат первого типа с пегасом и поджигателем. По углам два неканонических могендовида</p>", 1.0], ["img/r19/r19-075.jpg", "r19-075", "<p>Изогиз, 1931 г.<br>Плакат второго типа.<br>Идет двенадцатый год ликбеза.<br>Но здесь уже понятно, зачем учить буквы</p>", 1.0], ["img/r19/r19-076.jpg", "r19-076", "<p>Клубная секция Внешкольного отдела Народного комиссариата по просвещению.<br>Фортинбрас при умслопогасе с диогеновым фонарем роется в капиталистической помойке. И находит потерянные пролетариатом цепи</p>", 1.0], ["img/r19/r19-077.jpg", "r19-077", "<p>Этот плакат 1930 года — признание в неуспехе ликбеза. Государство говорит: не шмогла, давайте сами друг друга учите</p>", 1.0], ["img/r19/r19-078.jpg", "r19-078", "<p>Плакат второго типа. Начало 30-х. Еще есть батраки (то есть и кулаки не все повыбиты) и бедняки (то есть еще не всех загнали в колхоз). Но и колхозники в наличии.</p>", 1.0], ["img/r19/r19-079.jpg", "r19-079", "<p>И всё-таки знание — это круто.<br>Тут я без малейшей иронии</p>", 1.0], ["img/r19/r19-080.jpg", "r19-080", "<p>Без чего лик?</p>", 1.0]], "research": null}, {"intro": false, "num": "20", "title": "Кричальники вышли в начальники", "ptitle": "Кричальники вышли в начальники", "subtitle": "", "date": "26 июля 2023", "perm": "https://www.facebook.com/story.php", "slug": "", "html": "<p><span class=\"dc\">Ч</span>ем дольше собираюсь написать о вылупившихся из футуризма конструктивистах, тем сильнее зверею. Нет, конечно — они молодцы, авангардисты и создатели новой эстетики. Их буквы — я ведь про буквы — остались на век символом решительности и лаконизма, бесшабашной лихости и композиционного бесстрашия.</p>\n<p>Тем не менее они — паразиты и неблагодарные твари.</p>\n<p>Что больше всего ненавидели советские левые художники? Больше, чем свергнутого царя и чем мировой капитал? Больше даже, чем белую гвардию и недоэмигрировавшую интеллигенцию?</p>\n<p>НЭП.</p>\n<p>«Скорее канарейкам головы сверните, чтобы коммунизм канарейками не был побит!»</p>\n<p>Эти сытые, умытые, зарабатывающие приличные советские оклады (на позолотевшие рубли) товарищи не переставали сладострастно долбить то, что позволило им вылезти из вонючей ямы военного коммунизма.</p>\n<p>А между тем лучшим, что у них получалось, были дизайн и реклама — «нигде кроме, как в Моссельпроме». Реклама с дизайном требуют свободы выражения и конкуренции. При НЭПе всё это наличествовало. А позже — сами знаете.</p>\n<p>Для развития культуры НЭП был абсолютно лучшим из советских времён. Относительная свобода мысли. Относительно свободный рынок. Относительная возможность вести свой бизнес. Все эти мелкие уступки советской власти дали мощный урожай художества — от построенных на профсоюзные деньги мельниковских ДК до маленькой книжечки Мандельштама, от еще не запрещенной новой живописи до еще не перестрелянных новых писателей.</p>\n<p>1920-1930. Примерно так можно отмерить цветущее время советской культуры. По-настоящему, началось оно раньше, еще до исторического материализма, а закончилось лет на десять позже. Диктатура десять лет гигантскими зубами дожевывала остатки авангарда, и кое-что между ними застряло аж до начала сороковых, когда убили обэриутов.</p>\n<p>Но почему кричальники?</p>\n<p>Это парафраз из Галича: «а молчальники вышли в начальники, потому что молчание — золото…» Молчать стало выгодно с началом больших чисток. А в нэп все кричали, и бывшие хулиганы продвинулись в комиссары и апостолы новой жизни.</p>\n<p>Футуристы щипали буржуазию. Это была беспроигрышная тактика: ущипнутые буржуа покупали картины и сборники стишков, платили за выставки и терпели все нападки. То есть публика футуристов и прочих неистовых -истов была нисколько не пролетарская, а вовсе даже мещанско-буржуазная (горожанская). И тут вдруг бац — национализация.</p>\n<p>Один момент футуристы поголодали («три морковинки несу»), а потом быстро вписались в «пролетарскую» власть и стали на казённые средства учить жизни недобитков и попутчиков.</p>\n<p>Пролетариат никогда не был ЦА «пролетарских художников». Пролетарий (если ему не промывать мозги марксизмом для бедных) не хочет быть гегемоном. Он хочет стать мещанином, а при успехе — буржуа. Еще лучше — рантье. В пропагандистской поэме Маяковского о людях Кузнецкстроя («через четыре года здесь будет город-сад») есть две честные строчки: «здесь дом дадут хороший нам // и ситный без пайка». Это прямая речь настоящих пролетариев. Остальное — бесстыжий агитпроп.</p>\n<p>Уфф, высказался.</p>\n<h3>Теперь про буквы</h3>\n<p>Итак, кричальники.</p>\n<p>Кто в пантеоне? Маяковский с Бурлюком — дядьки, старослужащие левого войска. Ильязд и Эль Лисицкий не совсем в счёт — потёрлись об Европу с Америкой. Но пусть будет Эль-конструктор. А вот Родченко со Степановой, Телингатер и Стенберги — ясноглазые певцы советского образа.</p>\n<p>С архитекторами мне сложнее — не знаю, насколько советскими были те же братья Веснины или Гинзбург. Скорее всего, искренне верили, что строят новый мир. Мельников точно не был проповедником пролетарства — ни идейно, ни стилистически. Лучшее тому подтверждение — абсолютно не пролетарская надпись на фасаде дома в Кривоарбатском. Таким должен был стать московский стиль новой типографики: строго, лаконично, артистично.</p>\n<p>В этом посте — только про конструктивистский леттеринг и типографику. Это очень небольшая часть весёлого моря нэповских букв. Но о том, что не под прямым углом — в другой раз.</p>\n<p>С чего начать?</p>\n<p>Пусть это будет «Маяковский для голоса» Эл Лисицкого (так на контртитуле).</p>\n<p>В комменте — пдф. Советую смотреть не постранично, а разворотами, это важно по конструкции книги.</p>\n<p>Издание 1923 года. Типография Lutze Vogt GMBH, Берлин. Это на том же контртитуле. А вот на втором титульном развороте мелким кеглем, Академической, с выключкой по центру — «Р.С.Ф.С.Р. Государственное издательство, Берлин, 1923». Интересно, кто это вставил и почему так протокольно  скомпоновал?</p>\n<p>Дальше вы всё знаете: сначала «Левый марш», потом «Мой май», потом «Сволочи» (вырубка справа как у телефонного справочника пленила меня с первого раза, еще в раннем отрочестве)</p>\n<p>Печать в две краски, всё красиво и качественно. Видимо, сказалась тогдашняя немецкая дешевизна — издание вполне роскошное.</p>\n<p>Но вот что интересно: текст набран той же Академической. Хотя вся акциденция — гротесковая (или брусковая). Неужели в Берлине не было рубленой Бертгольда?</p>\n<p>Есть, есть рубленая. Но почему-то только в четырех словах: ГРИБ ГРАБЬ ГРОБ ГРУБ.</p>\n<p>Все иллюстрации — набором. Подумал: но вот на развороте с двумя перстами</p>\n<p>одно из «это вам» — то, что задом наперед — всё ж клише? Присмотрелся — нет, набор.</p>\n<p>А найдёте, где вместо одной буквы Ы стоят две латинские?</p>\n<p>Что такое эта книга (кроме того, что она — безусловный шедевр)? Чистое типохулиганство? «Книга художника»? Высокое искусство? Для меня маленького, увидевшего репродукцию чуть ли не в «Детской энциклопедии», это был мощнейший агитпродукт для занятия типографикой. Кстати — в отличие от большинства конструктивистских произведений — это чистая типографика, ничего от руки не нарисовано. То есть «производственное искусство» as is.</p>\n<p>В подборке к посту несколько обложек и наборных страниц ЛЕФа и Нового ЛЕФа. Я спокойно отношусь к творчеству Родченко и Степановой, хотя невозможно не признавать их крутости и мощи. Хочу только заметить, что в их журнальных обложках дизайнер ищет стабильности (особенно в использовании повторяющихся элементов — шапки, номера и т.д.), а художник-авангардист норовит каждый раз долбануть зрителя каждой деталью, сделать именно ее заметной, смысловой.</p>\n<p>Подробности — в подписях к фото. Что важно: чистой типографикой Родченко со Степановой не занимаются (или почти не занимаются). Они сконцентрированы на акциденции.</p>\n<p>В отличие от Лисицкого (не ходившего по цехам) и Телингатера (не выходившего из цеха) Родченко/Степанова не совсем типографы. Скорее графические дизайнеры с уклоном в печатный процесс.</p>\n<h3>Цитата (ссылка в комменте)</h3>\n<p class=\"aside\">Лисицкий убеждал Телингатера: «Ты — мастер, художник, и нечего тебе делать в типографии. Ты дал указания о наборе — и всё!»</p>\n<p>Вот кого я нежно люблю, так это Соломона Бенедиктовича Телингатера. Он знаменит, конечно, но всегда немного в тени — то Лисицкого с Родченкой, то Фаворского с фаворятами, а потом и Лазурского с Банниковой. А между тем именно он мог бы стать советским Гиллом или Цапфом, сложись вокруг всё по-человечески.</p>\n<p>В этой главе — несколько ранних работ Телингатера. Это чистая типографика — и суперакцидентная, как обложки к Белому, и текстовая. И каждый раз, что бы ни делал СБ, поражает качество и дотошность работы — редкое свойство в авангардном искусстве. Та самая ремесленная «сделанность», которой всегда не хватало в России, а тем более в ссср. У Телингатера это качество присутствует всю жизнь.</p>\n<p>Особенно хочу обратить внимание на «Комсомолию» — тончайшую работу типографа на бездарный текст Безыменского. Так бывает: «Гипнэротомахия Полифила» тоже не бог весть какой трактат.</p>\n<p>Из «Комсомолии», как из гоголевской шинели, вышли все книжные шестидесятники (включая Максима Жукова). А сама она — сильный ответ Лисицкому для голоса. В отличие от старшего брата по конструктивизму, Телингатер работает на уровне наборной формы. И то, во что он превращает вирши т. Безыменского — настоящий типографический прорыв.</p>\n<p>Верстка, работа со шрифтом и цветом, вклинивание специально сделанных фото- и ручных иллюстраций — высший пилотаж метранпажной типографики. Ссылка на полный пдф в комменте. Смотрите разворотами — не пожалеете.</p>\n<p>И (но) — я помню свой посыл: эта «Комсомолия» — страшный документ становящейся всё страшнее эпохи. Над ней парит когтистый серп-и-молот — родной брат одноглавого рейх-орла.</p>\n<p>Еще немного Телингатера — книжка поэта Кирсанова. Там тоже буйство типографики и цирк в наборе. Не знаю, видел ли С. Б. каллиграммы Аполлинера — местами очень напоминает. Ну, Ильязда он точно видел, а это близкие материи.</p>\n<p>У Телингатера много типошедевров. В картинках есть пара страниц из книги И.Фейнберга «1914». Это уже работа с документальным материалом — предвосхищение популярных энциклопедий 90-х. И опять: авангардная типографика на службе у читаемого текста. То есть заумничество ровно навыворот.</p>\n<p>Таков Соломон Телингатер — скромная звезда первой величины прихлопнутой госпланом советской типографики.</p>\n<p>Переходим к соскам и прочей бакалее.</p>\n<p>«Нигде кроме как в Моссельпроме!» — удивительный конгломерат левацкого поэтического райка, нахрапистого маркетинга и качественного графического дизайна. Пожалуй, именно в этих работах Родченко/Степановой лучше всего виден их потенциал коммерческих дизайнеров. Серийные блоки, паттерны, цветовое кодирование, работа с логотипом — всё это не имеет отношения к плановой экономике и тщедушной советской товарной рекламе пятилеточных времен. Моссельпром родом из промышленной революции нулевых-десятых. Он продолжает (а часто прямо подхватывает) рекламу Эйнема и резинотреста «Треугольник». Разница с дореволюционными рекламами только в ЦА: вместо стратифицированных горожан-мещан-буржуа — однослойные советские граждане-товарищи без классовых и вкусовых различий. Этим вызван выбор букв: рисованный палочный леттеринг, больше похожий на политические лозунги, чем на вкрадчивую рекламу. Подробности в подписях к картинкам.</p>\n<p>Закончу марафонский пост самой бесстыжей коммерцией, какую могли себе позволить советские дизайнеры.</p>\n<p>2 Стенберг 2! Целлулоид фильмы воровской, смачно отрекламированный в три-четыре краски братьями-конструктивистами родом из Швеции. Киноплакаты Стенбергов легко вписываются в мировой поп-контекст и не стесняются никаких зазывных приёмов. Это касается не только цирковых ракурсов, плашечных заливок и крупных планов кинодив. Леттеринг Стенбергов далеко выходит за палочный забор конструктивизма. Он так же дерзок и разнообразен, как на афишах по всему миру. Стенберги легко бы вписались в любой контекст — что в Париже, что в Нью-Йорке. Это а-советская эстетика. Не анти-, но и никак не про-. Недаром у братьев мгновенно появилась толпа подражателей. А вскоре всю эту буржуазную лавочку прикрыли.</p>\n<h3>Конклюзия</h3>\n<p>Все эти прекрасные люди со светлыми лицами (пишу с очень горькой иронией) считали, что именно они лучше всех знают, как правильно идти левым маршем к новой жизни. На самом же деле они просто глотнули ворованного воздуха НЭПа и воспользовались моментом, когда тоталитарная диктатура еще не нашла своего пластического выражения. Пройдёт всего несколько лет — и с авангардом в ссср будет покончено до самого двадцатого съезда.</p>\n<p>Пока писал этот текст, удивлялся: как же это: культура без авангарда. Бывает такое? А вот было.</p>\n<p>Но пока вокруг буря и натиск, Межрабпром-Русь и двенадцать стульев. И Азазелло с голубыми петлицами заряжает свой маузер.</p>", "figs": [["img/r20/r20-001.jpg", "r20-001", "<p>Эл Лисицкий. «Маяковский для голоса». Берлин, 1923<br>Обложка, набор, типографика</p>", 1.0], ["img/r20/r20-002.jpg", "r20-002", "<p>Эл Лисицкий. «Маяковский для голоса». Берлин, 1923<br>Второй титульный разворот</p>", 1.0], ["img/r20/r20-003.jpg", "r20-003", "<p>Эл Лисицкий. «Маяковский для голоса». Берлин, 1923<br>Первый титульный разворот. Слева чистый набор (любопытно, что стиль для титула не найден). Справа — сложная композиция из тоновой иллюстрации и набора второй краской</p>", 1.0], ["img/r20/r20-004.jpg", "r20-004", "<p>Эл Лисицкий. «Маяковский для голоса». Берлин, 1923<br>Самый иконический разворот. Набор</p>", 1.0], ["img/r20/r20-005.jpg", "r20-005", "<p>Эл Лисицкий. «Маяковский для голоса». Берлин, 1923<br>Конструктивиста тянет в дизайн: МойМай — практически логотип</p>", 1.0], ["img/r20/r20-006.jpg", "r20-006", "<p>Эл Лисицкий. «Маяковский для голоса». Берлин, 1923<br>А эту полосу редко показывают. Интересно, как оторвали головы орлу? Неужели политипаж испортили?</p>", 1.0], ["img/r20/r20-007.jpg", "r20-007", "<p>Эл Лисицкий. «Маяковский для голоса». Берлин, 1923<br>А вот и сволочи. Гражданская война в литературе продолжается</p>", 1.0], ["img/r20/r20-008.jpg", "r20-008", "<p>Эл Лисицкий. «Маяковский для голоса». Берлин, 1923<br>Указующий перст — крупнокегельный набор.<br>А текст набран Академической</p>", 1.0], ["img/r20/r20-009.jpg", "r20-009", "<p>Эл Лисицкий. «Маяковский для голоса». Берлин, 1923<br>Ы?</p>", 1.0], ["img/r20/r20-010.jpg", "r20-010", "<p>Обложка первого номера журнала ЛЕФ. Родченко.<br>Набор и двухкрасочное клише. Шапка журнала решена как логотип</p>", 1.0], ["img/r20/r20-011.jpg", "r20-011", "<p>Титул первого номера журнала ЛЕФ. Набор.<br>Родченко?</p>", 1.0], ["img/r20/r20-012.jpg", "r20-012", "<p>Обложка журнала Кино-Фот №3. 1922.<br>Варвара Степанова подписала иллюстрацию «Шарло».<br>Опять шапка выполнена как логоблок. Слова «дизайн» еще нет, а дизайн есть.</p>", 1.0], ["img/r20/r20-013.jpg", "r20-013", "<p>Первая полоса журнала Кино-Фот №3. 1922<br>Конструктивистский классифайд. Зал утопает в освещении. Таких полос в номере три — до содержательной части</p>", 1.0], ["img/r20/r20-014.jpg", "r20-014", "<p>Первая после рекламного блока полоса журнала Кино-Фот №3. 1922.<br>Типографика Степановой (?) Иллюстрация Родченко.</p>", 1.0], ["img/r20/r20-015.jpg", "r20-015", "<p>Обложка журнала Кино-Фот №1.<br>Натурщик Комаров. Гарнитура Рубленая.</p>", 1.0], ["img/r20/r20-016.jpg", "r20-016", "<p>Самая большая икона конструктивизма. Даже три иконы: стихи Маяковского, лик Лили Брик, композиция и фотомонтаж Родченко.<br>Буквы — рисованные</p>", 1.0], ["img/r20/r20-017.jpg", "r20-017", "<p>Обложка журнала Новый ЛЕФ №1, 1927.<br>Фото Родченко, дизайн и лого Родченко/Степанова, наборный гротеск (как всегда) Бертгольд, дореволюционный</p>", 1.0], ["img/r20/r20-018.jpg", "r20-018", "<p>(затесалась промеж лефа) Обложка журнала «Советское искусство». Сентябрь 1925. Дизайн Степановой. Логотип выглядит как выложенный из наборных элементов — но кто выкладывал?</p>", 1.0], ["img/r20/r20-019.jpg", "r20-019", "<p>Обложка журнала Новый ЛЕФ №6, 1927.<br>Родченко/Степанова. То, о чем я писал в посте: игра с логотипом. Это дизайн или авангардное искусство?</p>", 1.0], ["img/r20/r20-020.jpg", "r20-020", "<p>Обложка журнала Новый ЛЕФ №11-12, 1927.<br>Родченко/Степанова.<br>Опять логотип скакнул и блок изменился. Это смотрится очень современным приемом, но до него были годы, когда логотипный блок считался священным</p>", 1.0], ["img/r20/r20-021.jpg", "r20-021", "<p>(эх, не по порядку). Обложка журнала Новый ЛЕФ №5, 1927. Родченко/Степанова.</p>", 1.0], ["img/r20/r20-022.jpg", "r20-022", "<p>Обложка журнала Новый ЛЕФ №4, 1927. Родченко/Степанова. И опять игра в лого. Как будто сам дизайн-малютка переставляет кубики — и всё не наиграется</p>", 1.0], ["img/r20/r20-023.jpg", "r20-023", "<p>Обложка журнала Новый ЛЕФ №6, 1927. Родченко/Степанова. Паттернами, наверное, Варвара заведовала?</p>", 1.0], ["img/r20/r20-024.jpg", "r20-024", "<p>Обложка журнала Новый ЛЕФ №7, 1927.<br>Вам не надоело смотреть, как забавляются первые дизайнеры? Мне — нет.</p>", 1.0], ["img/r20/r20-025.jpg", "r20-025", "<p>Обложка журнала «Современная архитектура». №1, 1926. А. Ган. Я набрал несколько обложек СА, настолько разных, что не верится, что это один журнал в одни годы</p>", 1.0], ["img/r20/r20-026.jpg", "r20-026", "<p>Обложка журнала Новый ЛЕФ №1, 1928. Очень странный Новый ЛЕФ, вдруг решивший вспомнить старый логотип.<br>Родченко/Степанова. Все буквы в левой части рисованные, причем как-то кривовато</p>", 1.0], ["img/r20/r20-027.jpg", "r20-027", "<p>Родченко. Рисованная книжная обложка. Обратите внимание на цифры. Они похожи на степановские с обложки «Советского искусства».</p>", 1.0], ["img/r20/r20-028.jpg", "r20-028", "<p>Купреянов. Книжная обложка. Полностью рисованный леттеринг. Я говорю, что Родченко/Степанова не типографы, но графические дизайнеры. Купреянов, как выяснилось, тоже</p>", 1.0], ["img/r20/r20-029.jpg", "r20-029", "<p>Родченко. Книжная обложка. Коллаж, ручной леттеринг. Часть славных битв конструктивистов с имажинистами, закончившихся плачевной гибелью обоих вождей</p>", 1.0], ["img/r20/r20-030.jpg", "r20-030", "<p>Родченко. Четвертая обложка той же книги. Коллаж, ручной леттеринг</p>", 1.0], ["img/r20/r20-031.jpg", "r20-031", "<p>Соломон Телингатер. Одна из первых наборных обложек. Баку, 1923</p>", 1.0], ["img/r20/r20-032.jpg", "r20-032", "<p>Соломон Телингатер. Одна из трех серийных обложек к вещам Андрея Белого. Полностью наборная! 1927</p>", 1.0], ["img/r20/r20-033.jpg", "r20-033", "<p>Соломон Телингатер. Вторая из трех серийных обложек к вещам Андрея Белого. Наборный рисунок. 1927</p>", 1.0], ["img/r20/r20-034.jpg", "r20-034", "<p>Соломон Телингатер. Одна из трех серийных обложек к вещам Андрея Белого. 1927.<br>И это тоже чистый набор. Но как здесь живёт Академическая! Мне кажется, что СБ все композиции выверял под титульный шрифт. Вот это — типограф</p>", 1.0], ["img/r20/r20-035.jpg", "r20-035", "<p>Соломон Телингатер. Наборная обложка. 1928. Гарнитура рубленая, светлое начертание. Пять кеглей.<br>По-моему, это высокое искусство</p>", 1.0], ["img/r20/r20-036.jpg", "r20-036", "<p>Соломон Телингатер. «Комсомолия». 1928. Текст Безыменского. Обложка (или супер?)</p>", 1.0], ["img/r20/r20-037.jpg", "r20-037", "<p>Соломон Телингатер. «Комсомолия». 1928. Текст Безыменского. Авантитул</p>", 1.0], ["img/r20/r20-038.jpg", "r20-038", "<p>Соломон Телингатер. «Комсомолия». 1928. Текст Безыменского. Четвертая обложка (?)</p>", 1.0], ["img/r20/r20-039.jpg", "r20-039", "<p>Соломон Телингатер. «Комсомолия». 1928. Текст Безыменского. Обложка или заставочный шмуц (?)</p>", 1.0], ["img/r20/r20-040.jpg", "r20-040", "<p>Соломон Телингатер. «Комсомолия». 1928. Текст Безыменского. Наборная полоса.<br>Сложнейший двухкрасочный макет. Печать в два шрифта и в несколько (не берусь сосчитать) кеглей. Врезка иллюстрации (насколько я понимаю — фото делал сам СБ специально для этой книги). Невероятная работа</p>", 1.0], ["img/r20/r20-041.jpg", "r20-041", "<p>Соломон Телингатер. «Комсомолия». 1928. Текст Безыменского. Спусковая полоса. Врезка рисованной картинки поверх текста.<br>Удивительно, но буйный макет четко, по-дизайнерски структурирован. Спуски, заголовки, отбивки — вся эта протошвейцарская школа на месте.</p>", 1.0], ["img/r20/r20-042.jpg", "r20-042", "<p>Соломон Телингатер. «Комсомолия». 1928. Текст Безыменского. Наборная полоса с вывороткой и вбитым по ней наборным ильичем второй краской. Такое невозможно было сделать в советской типографии в 1980-е, когда я работал с книжными макетами. А Телингатер сделал в 1928</p>", 1.0], ["img/r20/r20-043.jpg", "r20-043", "<p>Соломон Телингатер. «Комсомолия». 1928. Текст Безыменского. Милейший лик братвы, аккуратно вписанный между тонких линеек</p>", 1.0], ["img/r20/r20-044.jpg", "r20-044", "<p>Соломон Телингатер. «Комсомолия». 1928. Текст Безыменского. Наборная полоса. Неправильное тире, создающее внезапную прямую речь. Идиотский стих, заканчивающийся дурацкой рифмой с ударением на ò: понесло—руслò</p>", 1.0], ["img/r20/r20-045.jpg", "r20-045", "<p>Соломон Телингатер. «Комсомолия». 1928. Текст Безыменского. Финальная полоса</p>", 1.0], ["img/r20/r20-046.jpg", "r20-046", "<p>Соломон Телингатер. «Слово предоставляется Кирсанову». Обложка</p>", 1.0], ["img/r20/r20-047.jpg", "r20-047", "<p>Соломон Телингатер. «Слово предоставляется Кирсанову». Разворот. Петра, кажется, клишировали. Остальное — набор</p>", 1.0], ["img/r20/r20-048.jpg", "r20-048", "<p>Соломон Телингатер. «Слово предоставляется Кирсанову». Перекошенная наборная полоса. Смертный сон метранпажа</p>", 1.0], ["img/r20/r20-049.jpg", "r20-049", "<p>Соломон Телингатер. «Слово предоставляется Кирсанову». Иконический набор, максимально близкий к Ильязду и каллиграммам</p>", 1.0], ["img/r20/r20-050.jpg", "r20-050", "<p>Соломон Телингатер. Обложка. Набор</p>", 1.0], ["img/r20/r20-051.jpg", "r20-051", "<p>Соломон Телингатер. «1914». Наборная полоса.<br>Очень тонкая игра со всеми деталями изображения, намного опередившая советское время</p>", 1.0], ["img/r20/r20-052.jpg", "r20-052", "<p>Соломон Телингатер. «1914». Наборная полоса.<br>Эстетика швейцарской школы: блоки текста, акценты, много белого</p>", 1.0], ["img/r20/r20-053.jpg", "r20-053", "<p>Соломон Телингатер. Обложка журнала «Современная архитектура». №5, 1930. Шрифт дореволюционный, бертгольдовский. Стиль — 1960-е<br>И — «сметём вредителей». Скоро вас сметут, дорогие дизайнеры</p>", 1.0], ["img/r20/r20-054.jpg", "r20-054", "<p>Соломон Телингатер. Первая полоса журнала «Современная архитектура». №5, 1930.<br>Мне она сильно напомнила Нэвила Броди</p>", 1.0], ["img/r20/r20-055.jpg", "r20-055", "<p>Соломон Телингатер. Обложка журнала «Рабис». №11(53). 1927. И вдруг — легчайшая скоропись! Ау, конструктивисты )</p>", 1.0], ["img/r20/r20-056.jpg", "r20-056", "<p>Соломон Телингатер. Реклама (на обложке?) журнала «Даёшь». Не понимаю, где тут рисованное, а где клише</p>", 1.0], ["img/r20/r20-057.jpg", "r20-057", "<p>Родченко/Степанова/Маяковский. Логотип-слоган Моссельпрома</p>", 1.0], ["img/r20/r20-058.jpg", "r20-058", "<p>Реклама Моссельпрома. Леттеринг полностью рисованный. Форма логотипа еще не устоялась</p>", 1.0], ["img/r20/r20-059.jpg", "r20-059", "<p>Здание Моссельпрома. Современный вид</p>", 1.0], ["img/r20/r20-060.jpg", "r20-060", "<p>Родченко/Степанова/Маяковский. Реклама на здании Моссельпрома. Паттерн брендирует</p>", 1.0], ["img/r20/r20-061.jpg", "r20-061", "<p>Родченко/Степанова/Маяковский. Реклама изделий Резинотреста (бывший «Треугольник», будущий «Красный треугольник»).</p>", 1.0], ["img/r20/r20-062.jpg", "r20-062", "<p>Родченко/Степанова/Маяковский. Реклама печенья «Красный октябрь» (бывший Эйнем) — ну и Моссельпрома заодно. Паттерн брендирует</p>", 1.0], ["img/r20/r20-063.jpg", "r20-063", "<p>Родченко/Степанова/Маяковский. Реклама хлеба в Моссельпроме. Паттерн брендирует</p>", 1.0], ["img/r20/r20-064.jpg", "r20-064", "<p>Родченко/Степанова/Маяковский. Реклама масла из стола (питательнее прочих масл!) в Моссельпроме. Паттерн всё так же брендирует</p>", 1.0], ["img/r20/r20-065.jpg", "r20-065", "<p>Очень забавная картинка из детской книжки с курящей юной моссельпрощицей в пенсне</p>", 1.0], ["img/r20/r20-066.jpg", "r20-066", "<p>1926 модель для сборки здания Моссельпрома из журнала «Мурзилка». По-моему, круто</p>", 1.0], ["img/r20/r20-067.jpg", "r20-067", "<p>Родченко/Степанова — Брик. Ни одной наборной буквы, зато логотип Родченко в правом нижнем углу.</p>", 1.0], ["img/r20/r20-068.jpg", "r20-068", "", 1.0], ["img/r20/r20-069.jpg", "r20-069", "<p>Родченко. Афиша «Броненосца Потемкина» в форме модного логотипа</p>", 1.0], ["img/r20/r20-070.jpg", "r20-070", "<p>2 Стенберг 2. Афиша «Броненосца Потемкина» в виде циркового плаката</p>", 1.0], ["img/r20/r20-071.jpg", "r20-071", "<p>2 Стенберг 2. Афиша фильмы Дзиги Вертова «Человек с киноаппаратом»</p>", 1.0], ["img/r20/r20-072.jpg", "r20-072", "<p>2 Стенберг 2. Афиша фильмы «Одиннадцатый»</p>", 1.0], ["img/r20/r20-073.jpg", "r20-073", "<p>2 Стенберг 2. Афиша гастролей Камерного театра Таирова в Париже. 1923</p>", 1.0], ["img/r20/r20-074.jpg", "r20-074", "<p>2 Стенберг 2. Афиша фильмы «Мулен Руж». Без палочного шрифта</p>", 1.0], ["img/r20/r20-075.jpg", "r20-075", "<p>2 Стенберг 2. Афиша фильмы «Проданный аппетит» по сценарию Эрдмана</p>", 1.0], ["img/r20/r20-076.jpg", "r20-076", "<p>2 Стенберг 2. Реклама лотереи. Кажется, четвертая обложка журнала</p>", 1.0], ["img/r20/r20-077.jpg", "r20-077", "<p>Константин Мельников. Фасад дома архитектора Мельникова в Кривоарбатском переулке с намеченной титульной надписью. Фото 1929 года</p>", 1.0], ["img/r20/r20-078.jpg", "r20-078", "<p>Константин Мельников. Фасад дома архитектора Мельникова в Кривоарбатском переулке. Надпись строгим гротеском, выпуклыми буквами.</p>", 1.0]], "research": null}, {"intro": false, "num": "21", "title": "Неконструктивисты", "ptitle": "Неконструктивисты", "subtitle": "", "date": "12 ноября 2023", "perm": "https://www.facebook.com/100000723643455/posts/7162162427151141/", "slug": "", "html": "<p><span class=\"dc\">В</span> этот раз решил рассказать буквах, не вписывающихся в три больших стиля двадцатых: модерн (арнуво), конструктивизм, ардеко. Или вписывающихся, но не совсем. Я специально избегал всего, что показывал в прошлые разы. Поэтому, например, Чехонин только один (и как он странен в этой компании!).</p>\n<p>Фаворского и Рерберга нет. О них отдельные главы.</p>\n<p>Признаюсь, никаких разысканий не проводил. Посветил фонариком направо и налево — что нашлось, то в посте. Выборка очень узкая: только обложки (и немного внутренней типографики). Но это тот случай, когда в малой форме видно время.</p>\n<p>Почти все буквы взяты с одного ресурса: онлайн-проекта «Тогда» (адрес в комментах). Это очень хорошая коллекция, уже не первый раз мне помогающая.</p>\n<p>Картинки к посту расставлены в хронологическом порядке с точностью до года. В этом есть смысл: видно, как меняются тренды, как из хаоса новой типографики вырастает советский стиль.</p>\n<p>В качестве отправной точки — дореволюционная футуристская обложка 1912 года со всеми прелестями авангардной эстетики: напористость, неряшливость, брутальность, демонизм. Посмотрим, как от этого отталкивались при историческом материализме.</p>\n<p>В этот раз не стал убирать детализацию в подписи к картинкам. Наверное, так сложнее найти, что к чему относится, зато есть цельный текст.</p>\n<p>1918–1922 гг.</p>\n<p>Первые три обложки — еще футуристического вида: грубая линогравюра, раскрашенная от руки. Буквы — гротеск, или скорее «так вышло». Можно сказать, что это «просто буквы», как их видели в 1922 году. Всё вместе смотрится живо, цельно и вневременно. К этой же компании близок ярославский поэт и художник Николай Дедюнин: отсутствие стиля как стиль.</p>\n<p>В первой временной группе несколько обложек имажинистов. Они быстро избавились от общеавангардного напора и стали нежнее и кудрявей. Буквы «Искандар наме» скорее глядят вперед, в ардеко, чем назад, в футуризм. И даже Шершеневич с наборной типографикой смотрится попутчиком, а не комиссаром.</p>\n<p>Отдельно стоит обложка Замятина-Гржебина (видимо, рисовал Конашевич). Вот это типичнейший поздний модерн, прямо мейнстрим десятых годов. Дальше в моей подборке таких обложек не будет (за одним исключением).</p>\n<p>Очень любопытная обложка журнала «Эримитаж» №8. Во-первых, логотип, где есть и конструктивистский напор (какова И!), и мирискустническая любовь к контрастным шрифтам, и даже весёленькие опереточные кудряшки. Во-вторых, набор… простите — леттеринг! Все буквы на обложке рисованные, кроме цены 50р. в правом верхнем углу. Художник (и неплохой) есть, а метранпаж исчез?</p>\n<p>Итог начала двадцатых — сумбур и вихрь. Кое-что осталось от прошлой жизни и даже пытается сойти за новое, а именно постфутуристические изломы. Но они уже анахронизм: поздно рушить, пора строить. Да и класс образованных, который рукоплескал пощечинам общественному вкусу, получил таких пинков (если не пулю в лоб), что ему бы чего поспокойнее.</p>\n<h3>1923–1924</h3>\n<p>(или 1925?)</p>\n<p>Попробуйте быстро пролистать эти 9(10) картинок. Как впечатление?</p>\n<p>У меня двоякое. С одной стороны — ничего общего (за исключением двух обложек Эренбурга). С другой — кажется, что начинается поиск чего-то, ещё непонятного самим ищущим.</p>\n<p>Самый архаичный — журнал «Аэро» с наполовину наборной обложкой. Он как будто вынырнул из дореволюционных классифайдов.</p>\n<p>Три трафаретных надписи на разных обложках, причем две из них — на совсем не брутальных: Шкапской и Северянина.</p>\n<p>Единственный по-настоящему грубый трафарет у Полонской. Смелый леттеринг, дождекаменный.</p>\n<p>Удивительно кокетливая «Явь» вышла у Лео Бруни. Как раз для Шкапской.</p>\n<p>Квинтессенция поиска — обложка «На застроенных пашнях». Каждая строчка — новый вид букв. Автор представлен очень неумелым чехонинством, а дальше борьба с формой всеми штампами века: гротеск, палочный шрифт, падающие буквы, падающая ленточная антиква. Куда летишь, дай ответ? Не дает ответа.</p>\n<p>Довольно неожиданный Северянин в крестьянских цветочках.</p>\n<p>Эренбург в обносках кубизма, еще как бы дерзких, но уже как бы не модных. Это даже не совсем графика и совсем не типографика. Это чернобелая посткубистическая живопись с буквами, с явной неохотой складывающимися в слова.</p>\n<p>Три последних обложки в этом периоде — знаковые.</p>\n<p>100 поэтов художника Соколова — неожиданно зрелый конструктивизм, но без палочного шрифта. Редкая в эту пору «дизайнерская» композиция: крепкая, в меру острая, удобочитаемая.</p>\n<p>Совершенно необычная обложка Эндера к туфановской «К зауми». Леттеринг с неявной зауминкой. Подробности в комменте.</p>\n<p>Ну, последняя, деревенско-молодёжная — весть из будущего. Типичный унылый советский красный уголок — да ещё и не красный, а тупозелёный. Специально ее отобрал — для контраста с общим весельем.</p>\n<p>Впрочем, стоп. Есть еще более последняя из 1925 года — обложка не кого-нибудь, а Юрия Анненкова! Альманах «Круг», номер 5, Москва-Ленинград.</p>\n<p>Ну и бог с ней. Были у ЮА и покруглее работы.</p>\n<p>В целом вторые годы нового строя всё ещё проходят в буре и натиске. Буквы с трудом ложатся в строки. Шрифт (или хотя бы умение его изобразить) почти отсутствует. Зато много экспрессии и поисков чего-то, чего пока нет.</p>\n<h3>1926-1929</h3>\n<p>Открывает раздел очень типичная обложка журнала «Авиация и химия». Типичная во всём, в первую очередь в милитаризме. Человек в противогазе и эскадрилья бомбардировщиков. Логотип журнала — попытка преодолеть палочность за счет диагоналей. Это шаг к ардеко. Смотрится мощно, но с ритмом беда. Дизайнера шрифту не учили.</p>\n<p>«Парнас дыбом» (художник Аверин) издательства «Космос». Попытка оформителя понять, какие буквы будут смешными в новом мире. В слове «Парнас» внезапно проглядывает Фаворский с «мнимостями в геометрии» 1922 года. Случайность?</p>\n<p>Двухкрасочная обложка, буквы и рисунок смотрятся единым целым, в духе времени, но как бы мимо трендов.</p>\n<p>Следом классический «Слонёнок» Киплинга с обложкой и картинками Лебедева. Подписан 1921 годом, но по стилю скорее ардеко, чем конструктивизм. Детского Киплинга переводили щедро, издавали красиво. Буквы по-настоящему смешные, мастерские. Финальная К даже со слонёнковой ножкой.</p>\n<p>Второй Киплинг 1926 года — «Откуда у кита такая глотка» — тоже как бы лебедевский, но нарисован Эдуардом Криммером. При внешней схожести графического приема — лаконичный силуэтный рисунок с отточковкой — обложки принципиально разные. У Лебедева обложка-картина. У Криммера — аккуратный дизайн с очень последовательно и строго сделанной шрифтовой частью. Надо бы из этого сделать вариативный шрифт.</p>\n<p>Стильный трёхкрасочный «Голод» имитирует обложку с наклейкой из уютных довоенных времен. Художник, возможно, Митрохин — да, буквы в его духе.</p>\n<p>Следующий номер моего отбора — «Красношейка» Асеева в дизайне Альтмана. Такая выразительная, что я аж три картинки показываю. Конструктивизм без конструтивизма, с палочным шрифтом, нарисованным от руки.</p>\n<p>Стиль такой французистый, что диво: и бык от Пикассо, и линейный рисунок а ля Матисс, и композиционная лёгкость как у Дюфи…</p>\n<p>Обложка «Нетстового репортера» — редкий в двадцатые годы случай шрифтовой композиции из формализованного шрифта, а не из отдельных нарисованных букв. Конечно, «шрифт» от руки, кривоватый и грубоватый.</p>\n<p>Книга «Двор» О. Гурьян оформлена конструктивистской плоскостной композицией, в которую вписаны курсивные буквы названия (ДВОр — три заглавных, одна строчная) и три миниатюрных картинки, из которых только одна — с птичкой в клетке — плоскостная и силуэтная. Как будто по Мондриану прошелся Лабас.</p>\n<p>«Ёжик» с рисунками К. Козловой — тоже игра в плоскость и пространство. Буквы пытаются формализоваться в шрифт и одновременно держат плоскость. Картинки как могут плоскость разваливают. Интересно, что трёхкрасочный оригинал, судя по всему, состоял из трёх плашечных плоскостных раскладок без намёка на тон.</p>\n<p>«Мышиный писк» — тоже три краски, тоже столкновение плоскостного и объемного. Но здесь леттеринг не статичен — это слитный скрипт, плотно упихнутый в не занятое рисунком пространство, да еще и разбитый на прямую и выворотную части. Читается с большой запинкой, но выглядит эффектно. Рукописность, в данном случае — не отсылка к гимназическому прошлому, а примета спешащего будущего.</p>\n<p>Следующим номером — лечение солнцем от д-ра Саркизова-Серазини (немного серой повеяло). Очень любопытная обложка. С одной стороны, название раскидано в духе лихих двадцатых. С другой — очень аккуратный семисериф, а поверху чистенькая ленточная антиква. Это гости из послезавтра, причем не советского, а европейского.</p>\n<p>Тадам! Альманах «Земля и фабрика» издательства Земля и Фабрика. Работа Чехонина! И какая же она старомодная по сравнению со всем, что я подобрал из этих годов. Как будто не 1927, а 1917 на дворе.</p>\n<p>Следом «Моя именинная» поэма Семена Кирсанова работы художницы Е. Рождественской. Название — удивительной высококонтрастной ленточной антиквой с неправильными М. Остальное — «палочный гротеск». Пиковая дама не продублирована фотоспособом, как сделали бы это в 1977 году, а по-честному дважды нарисована. Для меня эта обложка балансирует между канарейками и пролеткультом</p>\n<p>Дальше — путеводитель по театрам Ленинграда. Я выбрал эту обложку по трем причинам: 1) необычный вишнёвый цвет, 2) праворульное авто с прозрачной крышей, 3) буквы У. Оформитель был не мастер шрифта, но нашел три резких диагонали, перчащих центральную композицию.</p>\n<p>Наборный шрифт очень редкий гость на обложках двадцатых. Книжные оформители не часто сидели в типографиях (если они не Телингатер), а рекле тоже еще не практиковали из-за отсутствия домашних фотолабораторий. Но вот на обложке «Клубы металлистов» появляется набор: поставленное по вертикали второе слово. Как был сделан оригинал — не знаю.</p>\n<p>Льющий слёзы галчонок украшен буквами художника Суворова. Леттеринг как занятие хорош тем, что даже если совсем не владеть шрифтом, но очень стараться, получится что-нибудь, заслуживающее внимания.</p>\n<h3>Вот как интерпретировал текст на обложке авточитатель текста в айфоне</h3>\n<p>«А. СТЕПНАЯ</p>\n<p>сАПЧЕНОК</p>\n<p>1928 г.</p>\n<p>РАЛ,УТА рно др. Сувозова»</p>\n<p>Далее — три обложки Эренбурга работы Натана Альтмана. Как обложки они чудовищны: названий не прочесть, сложную трёхкрасочную печать типография осилила с огромным трудом. А вот как графические произведения это изысканные шедевры: хитрый ритм, интересный общий элемент (имя автора), нетривиальное цветовое решение.</p>\n<p>После Альтмана-Эренбурга хорошо освежает «Холодильное дело в сельском хозяйстве». Художник Holstein (судя по подписи). Стилистика — дореволюционные газетные объединения или рекламные плакаты. Буквы тоже из старого мира. И цвет.</p>\n<p>И сразу за древним хладокомбинатом — чистое, как стекло, ардеко Евгения Белухи.</p>\n<p>Каменский здесь вообще не футурист, а просто модный автор. Заккнига — это Тифлис. А как будто Вена. Белуха очень хорошо умел рисовать буквы.</p>\n<p>«Поход вещей» — интересная попытка пустить волной почти формализованный гротеск. Черные плашки не слишком удачно легли на последние буквы, но в целом вышло и живо, и по-дизайнерски.</p>\n<p>Из всей серии 26-29 моя любимая обложка — «Зверинец» Пастернака. Ну, ещё бы: Николай Купреянов, один из лучших графиков того времени. Леттеринг не формализован, но удивительно точно, поэтически рифмован на убывание. Второму текстовому блоку, издательству, и Фаворский бы позавидовал. Наконец, трёхкрасочная печать так богато разложена на плашки, что получается многоцветная живопись.</p>\n<p>А вот еще детский Киплинг: «Откуда у носорога шкура?». Художник Лебедев? Нет, Евгения Эвенбах. Опять старательно, но неумело нарисованный гротеск. Зато носорог, чудесно просунутый вовнутрь вопросительного знака</p>\n<p>Я показываю ещё и титул — на нем внезапно милый контраст между тоненькой рукописной «сказкой» и чёрной носорожьей тушей. Кстати, все буквы и на титуле рисованные.</p>\n<p>Обложка «Песен пищика» для меня немного загадочна. Во-первых, кто такой пищик? Комар? Во-вторых: неужели четырехкрасочная печать? Или литография? Ну, и в-главных для моей книги: что за буквы и как они сделаны? Название похоже на набор деревянным шрифтом. Фамилия автора — тоже как бы набор. Но это выворотка! То есть, как минимум, клише с пересъемкой. А вот «ГИЗ 1929» и имя художника скорее нарисованы. И сама композиция обложки очень необычна: текстовая часть загнана в углы и сжата до предела. Похоже на дизайнерское решение из начала 70-х, но никак не на весёлые и щедрые двадцатые.</p>\n<p>Итог последнего доколхозного времени: полное разнообразие, но с явным желанием формализации букв. В отличие от первых советских лет, буквы начинают собираться в слова и текстовые блоки. Появляется нечто похожее на регулярные шрифты. При этом нет ощущения, что на оформителей давят худреды: пока еще не выработаны догматы соцреализма в леттеринге.</p>\n<h3>1930–1935</h3>\n<p>Открывает раздел Демьян Бедный с могучими кривыми темпами, прущими на зрителя красной колбасой. Не знаю, за что мне нравится эта чудовищная нарезка, на которой мартышкой примостился Демьян, держась хвостом за Ы. Видимо, динамически вся композиция неплоха, вместе с издательством понизу</p>\n<p>Обложка «На злобу дня» типографически злободневна для 1930 года. На ней пытается сложиться советский вариант Футуры. Тут и юникейс, и болгарица, и заимствование из немецкого: ß в роли в. В леттеринге всё кажется строгим, но до шрифта здесь очень долго плыть.</p>\n<p>В «Старике и диких утках» катастрофически отлетела красная краска — с советской печатью такое нередко случалось. Макет обложки отчасти похож на «Песни пищика», только название все-таки крупное. Отмечу курсив — он уже послереволюционный: без заглавных, простой, с очень короткими выносами — но всё же с петлёй [д].</p>\n<p>И опять формализованный шрифт — но не наборный, а рисованный. Хотя здесь просится набор</p>\n<p>Книга «Рыбы» выпадает из всех эпох и стилей. Сначала бросается в глаза рисунок из 70-х. Потом — огромная и качественно начерченная Р. Потом дизайнерские «ыбы». Потом в правом верхнем углу обнаруживается автор, какой-то совершенно ихтиандристый. Ну, и под конец находятся два конструктивистских слова — одно рыбное: «плесковская», другое в кавычках. Очень странная обложка</p>\n<p>Второй Бедный Демьян с обложкой, похожей на классический советский античтоугодно плакат. И с чудесным названием «Долбанём» — высшая превосходная степень от пригубим, тяпнем, хватим, шарахнем.</p>\n<p>Курсив решительный, вневременной. Точно такой же мне приходилось вырезать в 1978 году для титров военного фильма на Киностудии МО ссср.</p>\n<p>Книга «Игра» с очень интересной обложкой. Во-первых, необычно и аккуратно нарисованное выпадающее название. Во-вторых, плашка с именем автора — действующая часть композиции. Наконец, разложенная на две краски фотоиллюстрация с ультрамодным ленточным остеклением в духе дома Наркомфина (но это не он)</p>\n<p>«Звериный уголок» киевского издательства — еще пример нехватки наборного или реклейного шрифта. Титульная надпись — промежуток между «как попало» и «как будто умею». А вот все дополнительные — старательное воспроизведение отсутствующего наборного шрифта. Это следствие полного огосудавствления типографий.</p>\n<p>«Лето в колхозе» художника Вольштейна далеко не так наивно, как хочет казаться. И рисунок, и буквы выполнены с небрежным изяществом (привет от Дюфи). Мне кажется, что здесь неконструктивизм достигает апогея: всё нежно, необязательно, непризывно и усмешливо</p>\n<p>Обложка живописца Штеренберга — настоящий конструктивизм без палок. Мой глаз тешит и нежит набор (с редчайшей подписью автора: «обложка Д. Штеренберга». С хорошим подбором шрифтов, ясной, но не простой, композицией, и смачной рукописной песней—молнией посерёдке, причем вместо куцего дефиса — полновесное тире. Как удалось всё это набрать — вопрос к Владимиру Кричевскому. «Через завсклад, через туваровед, через заднее кирильцо»</p>\n<p>Обложка журнала «Залп» — на мой взгляд, чистейшая советская самодеятельность. Она такая жуткая, что даже крутая. Как будто вколачивал гвозди вахтёра большой молоток. Буквы названия по-настоящему народные, а вот оригинал — раскладка на две краски, зеленую и бурую, был сделан с каким-то изуверским тщанием. Понимаете, ведь белое — не краска, а дырка в двух формах, и дырка эта мохнатая. А сами эти две формы чотко попадают друг на друга, это видно по треппингу. Шедевр печати, вырвиглаз дизайна.</p>\n<p>«Рекорды» Сельвинского — почти швейцарский дизайн в виде стенгазеты в пятом классе. Объявления под белкой набраны и нахально используются в качестве декоративного элемента. Всё отлично в этой обложке — даже ГИХЛ попадает в ритм и задирает лапки к концу аббревиатуры.</p>\n<p>Обложка Милашевского к «Соловьям» Полетаева — как бы итог пятнадцатилетнего развития шрифтового искусства в ссср без создания шрифта как такового.</p>\n<p>Буквы ровные (несмотря на цирковую траекторию надписи), аккуратные, даже с засечками почти полный порядок. Забавно, что это юникейс — в квазизаглавный леттеринг внедрены три строчных [е]</p>\n<p>«Барабанщик совхоза» сделан как будто в той же манере, что и позапрошлые «Рекорды», но здесь кролик наложен на рисованное от руки об’явление (без ненавистного ъ). Но совпадение стилистики любопытное. Интересно: это две обложки Марии Синяковой, или кто-то у кого-то позаимствовал? Или все об одном и том подумали?</p>\n<p>«Заграничный Степан» художника Воронова из 1932 года аукается со «Степаном Разиным» Белухи из 1929. Причем у Белухи буквы даже более ардекошные.</p>\n<p>Озадачивает нацарапанная гвоздём фамилия автора — вроде всё остальное такое чистенькое, а тут вдруг драма.</p>\n<p>Что еще любопытно: небоскрёбы на заднем плане. В ссср тогда таких не строили, и общий силуэт художник повторил, но окошки нарисовал как в обычных домиках</p>\n<p>Тихоокеанские стихи Сельвинского — как бы наборная обложка художника Эппле. На самом деле буквы, конечно, рисованные, и не очень ровно рисованные. Но сейчас, спустя почти век, в этом есть своя прелесть</p>\n<p>А вот «Улялаевщина» того же Сельвинского как будто выскочила из другого времени. Такую обложку легко представить в 1921 году — и в 1948. Но не в 1934, когда уже выработался некий стиль, но худреды еще не свернули шеи всем приличным художникам книги.</p>\n<p>Однотомник Луговского 1935 года можно считать точкой приезда послереволюционного буквенного паровоза. С одной стороны — леттеринг достиг полной формализации: буквы в строчку, с попыткой ритмизации и поиском индивидуальных форм в общем строе.</p>\n<p>С другой — это никак не шрифты. Это «шрифтовая композиция» без всякой заботы о том, как могла бы выглядеть цельная гарнитура.</p>\n<p>Вершинами нешрифтового подхода можно считать две [д] хвостиком кверху и две [м] — одну почти курсивную, вторую с закосом.</p>\n<p>Опять-таки: спустя век это смотрится живо и весело</p>\n<p>Последняя книжка — 7-е издание Лебедевско-Маршаковского «Глупого мышонка».</p>\n<p>В этой обложке сочетаются конструктивистские приёмы: блоки текста с выделениями — «О» в верхнем блоке, «ИЗДАНИЕ» в нижнем, каталожного типа иллюстрация
