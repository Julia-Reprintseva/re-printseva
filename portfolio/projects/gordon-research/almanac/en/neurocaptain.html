<script>
const DATA = [{"intro": true, "num": "00", "title": "In Place of an Introduction", "ptitle": "In Place of an Introduction", "subtitle": "", "date": "22 September 2026", "perm": "https://www.facebook.com/yuri.gordon/posts/pfbid02txWajZ2Dn6Ags5oh29WiCJGsmP6hPiQiVBjfQkaRQ1g974AFjPHWKtx6s645pwYol", "slug": "", "html": "<p><span class=\"dc\">N</span>ot a scholar, not a documentarian, not an art historian. A position that allows a great deal. A scholar must doubt and publish only what has been confirmed. A documentarian should, as far as possible, collect and publish all the available facts. An art historian has no right to be biased — he is an analyst, not a Zoilus.</p>", "figs": [], "aq": null, "research": null}, {"intro": false, "num": "01", "title": "How the Best Chance to Throw Pushkin Overboard from the Ship of Modernity Was Missed", "ptitle": "How the Best Chance to Throw Pushkin Overboard from the Ship of Modernity Was Missed", "subtitle": "", "date": "14 May 2025", "perm": "https://www.facebook.com/story.php?story_fbid=23987832897490830&id=100000723643455", "slug": "", "html": "<p><span class=\"dc\">И</span> изъяснялася с трудом / На языке своём родном — I izjasnálasá s trudom / Na jazyke svojom rodnom (Pushkin, “Eugene Onegin”: “and she expressed herself with difficulty in her own native tongue”, set in Latin transliterations of Cyrillic).</p>", "figs": [], "aq": null, "research": null}, {"intro": false, "num": "02", "title": "On Soviet Money", "ptitle": "On Soviet Money", "subtitle": "or Ivan Ivanovich Goznak", "date": "26 May 2025", "perm": "https://www.facebook.com/story.php?story_fbid=24086483494292436&id=100000723643455", "slug": "", "html": "<p><span class=\"dc\">I</span>n my father’s desk there always lay — as specimens — a “Katenka” and a “Petenka”: the tsarist hundred- and five-hundred-rouble notes bearing the portraits of Catherine II and Peter I.</p>", "figs": [], "aq": null, "research": null}, {"intro": false, "num": "03", "title": "Soviet Handwriting Primers through the Eyes of a Typographer and AI", "ptitle": "Soviet Handwriting Primers through the Eyes of a Typographer and AI", "subtitle": "From living script to dead drafting.", "date": "11 July 2025", "perm": "https://www.facebook.com/100000723643455/posts/24461477630126352/", "slug": "propisi", "html": "<p><span class=\"dc\">E</span>very person in the modern world must (is obliged to, has an urgent need to) be able to read and write. This is so obvious that Captain Obvious flies off, bored.</p>", "figs": [], "aq": ["As you will remember, my partner Julia Reprintseva and I are creating my digital doppelgänger to help write this book.", "Yuri Gordon, from the chapter text"], "research": {"task": "Find teaching manuals for writing and penmanship from 1900–1990, OCR the copybook texts, compare teaching methods, show how writing and politics intertwined.", "work": "Built a base of 18 editions: OCR, compression and slicing of PDFs to fit upload limits, two weeks of “feeding” a custom assistant tuned to the author’s voice. Found and documented an undocumented ChatGPT limit — 80 MB per account. Delivered the chapter in two registers: neutral analysis and the author’s voice.", "tools": "ChatGPT (custom project, Deep Research), ChatPDF, Perplexity", "dates": "June — July 2025"}}, {"intro": false, "num": "04", "title": "How to Turn a Blooming Meadow* into a Potato Field", "ptitle": "How to Turn a Blooming Meadow* into a Potato Field", "subtitle": "", "date": "26 August 2025", "perm": "https://www.facebook.com/story.php?story_fbid=24842304568710321&id=100000723643455", "slug": "shrifty", "html": "<p><span class=\"dc\">T</span>his chapter was meant to be the middle and the core of my book. In fact, my own work with type is a direct consequence of the fact that in 1930, on the orders of the Soviet government, a few clever, professional people full of concern for their neighbours sent about 95% of the 1,500 typefaces then available to be melted down.</p>", "figs": [], "aq": ["There is also a link to the study of the subject that Julia Reprintseva and I did with AI, which resulted in this article. In my view, it is our best performance.", "Yuri Gordon, from the chapter text"], "research": {"task": "Catalogue typefaces by decade, find out which were used most, locate the state measures that culled them — what was kept and what was discarded.", "work": "Perplexity gathered sources; a brief was built in my prompt-writing project; ChatGPT Deep Research compared type standardisation in the USSR, USA, Britain, France and Germany up to 1953. Found the OST 1337 and GOST 3489 standards and Bormann’s 1941 circular banning Fraktur.", "tools": "Perplexity, ChatGPT Deep Research (o3)", "dates": "July — August 2025"}}, {"intro": false, "num": "05", "title": "Letters of the Underground Cosmodrome", "ptitle": "Letters of the Underground Cosmodrome", "subtitle": "or From Sokolniki to Park on the Metro", "date": "9 September 2025", "perm": "https://www.facebook.com/story.php?story_fbid=24961957913411652&id=100000723643455", "slug": "metro", "html": "<p><span class=\"dc\">I</span>n the Moscow of the twenties people walked. Five kilometres — I have paced them myself — is the diameter of the Garden Ring. A cab was a good accelerator. The tram solved the transport problem. Buses had only just appeared. Taxis — there were taxis too, but they remained something exotic almost until the days of “The Diamond Arm”. Private cars belonged only to very special citizens.</p>", "figs": [], "aq": ["Head of the neural assistants, as always, Julia Reprintseva.", "Yuri Gordon, from the chapter text"], "research": {"task": "Analyse the Metro’s inscriptions in seven groups — façades, platforms, wayfinding, memorial, technical, carriages, temporary; define the style, trace its changes, read the texts for content.", "work": "The prompt was built from OpenAI’s own guidance for GPT-5: goal, inputs, quality criteria, format, verification. Perplexity found 245 sources; GPT-5 wrote a 13-page essay with a classification and dating caveats — and proposed checks that were not in the brief.", "tools": "Perplexity, ChatGPT GPT-5 Deep Research", "dates": "August — September 2025"}}, {"intro": false, "num": "06", "title": "Lamps Are Shining, Prices Are Cut", "ptitle": "Lamps Are Shining, Prices Are Cut", "subtitle": "Soviet shop signs and window displays of the Great Break", "date": "4 October 2025", "perm": "https://www.facebook.com/story.php?story_fbid=25178341208439987&id=100000723643455", "slug": "vyveski", "html": "<p><span class=\"dc\">“</span>Soviet outdoor advertising was distinguished by its originality, its unlikeness to the Western kind, and this showed in the softness, sensitivity and warmth of its character. Outdoor advertising found a response in the human soul through its perceptiveness and honesty. Aggression and obtrusiveness, immodesty and insolence were alien to it, because the people who lived in the USSR were distinguished by compassion, loyalty, friendship and sentimentality”*.</p>", "figs": [], "aq": ["And my partner and neurocaptain Julia Reprintseva shuffles and combines the networks’ capabilities ever more ingeniously.", "Yuri Gordon, from the chapter text"], "research": {"task": "Find visual and textual sources on signs and windows of 1928–1941: how they were made, whether standards existed, capital versus provinces; Torgsin stores separately.", "work": "Two briefs — corpus collection and comparative analysis (USSR 1928–41, Depression-era USA, post-war Europe). Three studies in cascade: ChatGPT and Perplexity results (111 links) fed into Gemini with a search of Western sources.", "tools": "ChatGPT Deep Research, Perplexity, Gemini Deep Research", "dates": "September — October 2025"}}, {"intro": false, "num": "07", "title": "If You Happen to Be Born in the Provinces", "ptitle": "If You Happen to Be Born in the Provinces", "subtitle": "Soviet book covers and title pages, 1935–1953", "date": "6 November 2025", "perm": "https://www.facebook.com/story.php?story_fbid=25508324675441637&id=100000723643455", "slug": "oblozhki", "html": "<p><span class=\"dc\">P</span>erhaps I took up this book only in order to write this chapter. And I began thinking about it in 1981, while making my first book covers and title pages.</p>", "figs": [], "aq": ["Julia Reprintseva decided to run a comparative experiment and gave the same prompt to different neural networks.", "Yuri Gordon, from the chapter text"], "research": {"task": "Collect cover and title-page images, classify typefaces (set and hand-drawn), composition and non-type elements; compare with pre-revolutionary and Western examples.", "work": "One brief run in parallel in six systems; the six sets of conclusions placed side by side; three rounds of iterative search on the artists Rerberg and Telingater.", "tools": "ChatGPT, Perplexity, Gemini, DeepSeek, Grok, Qwen", "dates": "October — November 2025"}}, {"intro": false, "num": "08", "title": "Monumental Propaganda — from Canvas to Concrete", "ptitle": "Monumental Propaganda — from Canvas to Concrete", "subtitle": "", "date": "18 February 2026", "perm": "https://www.facebook.com/100000723643455/posts/26431847396422689/", "slug": "propaganda", "html": "<p><span class=\"dc\">A</span>ny totalitarian state climbs into its population’s heads wherever it can, starting with the street. The leader of the world proletariat puts forward his plan of monumental propaganda in 1918, not yet even knowing that his state is totalitarian.</p>", "figs": [], "aq": ["As always, before I started writing the chapter, J. R. and I did a deep AI study on the same subject.", "Yuri Gordon, t.me/yurigordon/819, 20 February 2026"], "research": {"task": "Trace the evolution of monumental propaganda — parade décor, demonstrations, permanent structures — from 1917 to 1991: ideology, slogans, typography, materials; gather maximum visual material.", "work": "One working day: 11:55 brief received → 12:05 scaffold in Perplexity → 12:10 brief in the prompt project → 13:00 Gemini report → 14:01 final document and PDF. Three systems, three reports.", "tools": "Perplexity, ChatGPT Deep Research, Gemini Deep Research", "dates": "February 2026"}}, {"intro": false, "num": "09", "title": "The Bannikova Case and More", "ptitle": "The Bannikova Case and More", "subtitle": "or Was There a Plan?", "date": "12 March 2026", "perm": "https://www.facebook.com/100000723643455/posts/26643468658593894/", "slug": "shriftoviki", "html": "<p><span class=\"dc\">A</span> few chapters ago I described the genocide of typefaces in the USSR in the early 1930s. Back then some clever men got together, decided to fight bourgeois prejudices and melted down 75% of Berthold, Lehmann and their like. And a plan for developing the type industry for centuries to come was drawn up — one that came to rest on the Literaturnaya typeface.</p>", "figs": [], "aq": ["In parallel with me, ChatGPT under the direction of Julia Reprintseva analysed the same problem.", "Yuri Gordon, t.me/yurigordon/855, 13 March 2026"], "research": {"task": "Biographies of Soviet type designers 1930–1960, a catalogue of typefaces, typology, whether a state plan existed; revision — short biographies and corrections.", "work": "Two-step prompting: the model first acts as a brief specialist, writes the terms of reference and asks eight questions about depth; then the research runs. Three runs — the first two with errors, the third went into the chapter. Revisions closed the same day.", "tools": "ChatGPT Deep Research", "dates": "March 2026"}}, {"intro": false, "num": "10", "title": "Analysing Two Books with One Title: “The Art of Type. Works of Moscow Book Artists”", "ptitle": "Analysing Two Books with One Title: “The Art of Type. Works of Moscow Book Artists”", "subtitle": "", "date": "21 March 2026", "perm": "https://www.facebook.com/story.php?story_fbid=26733763439564415&id=100000723643455", "slug": "iskusstvo-shrifta", "html": "<p><span class=\"dc\">T</span>his chapter can be read as a continuation of the previous one, where I showed the two albums of “The Art of Type”. This time I want to compare them closely: when they came out, who took part, their subjects, the features of the work shown. Let’s call them “AoT-1960” and “AoT-1977” for short.</p>", "figs": [], "aq": ["And now let’s look into the Contents and the List of Illustrations, switching on AI (ChatGPT and Gemini). Julia Reprintseva, go ahead!", "Yuri Gordon, from the chapter text"], "research": {"task": "Compare the contributors of the two albums, classify by type of work, compare composition; for everyone — life dates and four chronological lists.", "work": "Four verification steps: Gemini’s first answer → ChatGPT check against the library’s page scans, which exposed invented contributors and percentages → analysis from the scanned tables of contents (38 and 59 names, 16 shared) → a verified base with life dates and 13 typeface authors.", "tools": "Gemini, ChatGPT", "dates": "March 2026"}}, {"intro": false, "num": "11", "title": "Let Go and Shrivelled", "ptitle": "Let Go and Shrivelled", "subtitle": "Soviet neo-romanticism in Thaw-era lettering: the sweep of a wing and the severe style of the unshaven grotesque", "date": "3 April 2026", "perm": "https://www.facebook.com/100000723643455/posts/26880068174933940/", "slug": "ottepel", "html": "<p><span class=\"dc\">T</span>he 1900s — a swelling. Russian culture drags in from the West everything it can drag, from Impressionism to emancipation, and draws breath to shout. Polite society winces and asks nervously: wait, is that allowed?</p>", "figs": [], "aq": ["What AI under the direction of Julia Reprintseva thinks about the subject — see a separate link…", "Yuri Gordon, postscript to the chapter"], "research": {"task": "Collect signs, covers, posters and advertising of the Thaw, define styles and motifs, find the sources, trace the evolution, compare with Western counterparts; then add cinemas and brand stores.", "work": "Brief in the constructor → Gemini Deep Research: 30 objects with letterform descriptions, six types of form, 23 sources; revised on the author’s note.", "tools": "Gemini Deep Research, ChatGPT", "dates": "March — April 2026"}}, {"intro": false, "num": "12", "title": "Typescript and Literary Language", "ptitle": "Typescript and Literary Language", "subtitle": "", "date": "18 May 2026", "perm": "https://www.facebook.com/100000723643455/posts/27410854155188670/", "slug": "", "html": "<p><span class=\"dc\">R</span>emember how, at the very beginning of the book, I compared myself to a man who walks into a huge dark warehouse with a torch? Let this short chapter be such a spotlight, picking out just one element of the vast phenomenon called “samizdat”.</p>", "figs": [], "aq": null, "research": null}, {"intro": false, "num": "13", "title": "From Daisy to Bear — the Visual Communication of Festival-57 and the 1980 Olympics", "ptitle": "From Daisy to Bear — the Visual Communication of Festival-57 and the 1980 Olympics", "subtitle": "", "date": "12 June 2026", "perm": "https://www.facebook.com/100000723643455/posts/27730650253209057/", "slug": "festival", "html": "<p><span class=\"dc\">H</span>istorical context: in 1956, at the 20th Congress of the CPSU, General Secretary Khrushchev publicly exposed the late father of nations, Stalin. The Thaw began to bubble wildly across the USSR. Even a corner of the Iron Curtain started to lift. And very conveniently, the international union of progressive youth, together with the no less progressive international union of students, decided to hold their tidy Woodstock in Moscow. And the comrades from the Central Committee, together with comrade Major, suddenly allowed it.</p>", "figs": [], "aq": ["For those who want more objectivity — a deep study by ChatGPT under the direction of Julia Reprintseva.", "Yuri Gordon, postscript to the chapter"], "research": {"task": "“Let me pitch the idea and you turn it into a prompt”: describe and compare the design of the 1957 Youth Festival and the 1980 Olympics, and set them against Western design of the same years.", "work": "A series of six briefs and six Deep Research runs — Soviet mass festivities, Olympic design systems 1968–1980, World Cups, an annotated base of Western sources — and a single analytical chapter built on them. Yuri Gordon called the final base the best thing AI had done for his book.", "tools": "ChatGPT Deep Research", "dates": "May — June 2026"}}, {"intro": false, "num": "14", "title": "Soviet Handwriting Primers of the Sixties", "ptitle": "Soviet Handwriting Primers of the Sixties", "subtitle": "Memories of a left-handed first-grader who started school in 1965", "date": "15 June 2026", "perm": "https://www.facebook.com/100000723643455/posts/27770387565901992/", "slug": "", "html": "<p><span class=\"dc\">O</span>n the classroom wall hung a teaching chart. It showed the copybook alphabet — capital and lowercase letters. The letters were large, neatly drawn, with an even, mechanical stroke. Above it all ran a line of type (Literaturnaya, condensed bold): “Write correctly and beautifully”.</p>", "figs": [], "aq": null, "research": null}, {"intro": false, "num": "15", "title": "The 1966 Catalogue of Hand-Set and Machine Typefaces as a Mirror of Soviet Decline", "ptitle": "The 1966 Catalogue of Hand-Set and Machine Typefaces as a Mirror of Soviet Decline", "subtitle": "", "date": "25 June 2026", "perm": "https://www.facebook.com/story.php?story_fbid=27897516943189053&id=100000723643455", "slug": "", "html": "<p><span class=\"dc\">I</span>f you remember, I once took apart a poster for the famous Futurists printed in Tiflis in 1913 (fig. 2). It used fifty typefaces. Tiflis is of course a sizeable and cultured city, but typographically it is neither Petersburg nor Moscow — all the more so since the Georgians never switched to Cyrillic. So: fifty typefaces is a lot, and not only for an advertising flyer printed on the empire’s southern document.querySelectorAll('#book .page a[href]').forEach(a => ['mousedown','mouseup','pointerdown','pointerup'].forEach(ev => a.addEventListener(ev, e => e.stopPropagation())));
const pf = new St.PageFlip(book, { width: PW, height: PH, size: 'fixed', showCover: true, maxShadowOpacity: .35, mobileScrollSupport: false, usePortrait: PORTRAIT, disableFlipByClick: true, useMouseEvents: false, showPageCorners: false });
/* мышь целиком за нами: у библиотеки клик по углу листает назад и вместе с нашим обработчиком возвращал тот же разворот */
book.addEventListener('click', e => { if (e.target.closest('a,button,input,textarea')) return; pf.flipNext(); });
pf.loadFromHTML(document.querySelectorAll('#book .page'));
const pos = document.getElementById('pos');
const keyOf = i => pages[i] && (pages[i].dataset.key || ('p|' + i));
const findByKey = k => { const i = pages.findIndex(p => p.dataset.key === k); return i >= 0 ? i : (k.startsWith('p|') ? Math.min(+k.slice(2), pages.length-1) : 0); };
let marks = LS('marks') || {}; let notes = LS('notes') || {};
const paint = () => pages.forEach(p => { const k = p.dataset.key; p.classList.toggle('marked', !!(k && marks[k])); p.classList.toggle('noted', !!(k && notes[k])); });
const upd = () => { const i = pf.getCurrentPageIndex(); pos.textContent = (i+1) + ' / ' + pages.length; document.querySelector('#progress i').style.width = (100*(i+1)/pages.length)+'%'; SV('last', keyOf(i)); const k=keyOf(i); document.getElementById('b-mark').classList.toggle('on', !!marks[k]); document.getElementById('b-mark').textContent = (marks[k]?'★':'☆')+' bookmark'; };
pf.on('flip', upd); paint(); upd();
const hp = (location.hash.match(/^#p=(\d+)/) || [])[1];   // #p=N — открыть на странице N
const last = LS('last'); if (hp) setTimeout(()=>pf.turnToPage(Math.min(+hp-1, pages.length-1)), 300); else if (last && last !== 'p|0') setTimeout(()=>pf.turnToPage(findByKey(last)), 300);
document.getElementById('home').onclick = e => { e.preventDefault(); pf.turnToPage(0); };
document.getElementById('b-toc').onclick = () => pf.turnToPage(pages.indexOf(tocPage));
const mm = document.getElementById('mineMenu');
mm.innerHTML = DATA.map((ch,i) => ch.research ? `<a href="#" data-p="${starts[i]}"><span>${ch.num}</span>${ch.ptitle}</a>` : '').join('');
document.getElementById('b-mine').onclick = e => { e.stopPropagation(); mm.classList.toggle('open'); };
mm.addEventListener('click', e => { const a = e.target.closest('a[data-p]'); if (a){ e.preventDefault(); pf.turnToPage(+a.dataset.p); mm.classList.remove('open'); } });
document.addEventListener('click', () => mm.classList.remove('open'));
document.getElementById('b-mark').onclick = () => { const k = keyOf(pf.getCurrentPageIndex()); if (!k) return; if (marks[k]) delete marks[k]; else marks[k] = { ch: pages[pf.getCurrentPageIndex()].dataset.ch || '', q: pages[pf.getCurrentPageIndex()].textContent.replace(/\s+/g,' ').trim().slice(0,90), t: Date.now() }; SV('marks', marks); paint(); upd(); };
const nb = document.getElementById('noteBox'), nt = document.getElementById('noteText'); let noteKey = null;
document.getElementById('b-note').onclick = () => { noteKey = keyOf(pf.getCurrentPageIndex()); nt.value = (notes[noteKey]||{}).n || ''; document.getElementById('noteTitle').textContent = 'Note · p. ' + (pf.getCurrentPageIndex()+1); nb.classList.add('open'); nt.focus(); };
document.getElementById('n-close').onclick = () => nb.classList.remove('open');
document.getElementById('n-save').onclick = () => { if (nt.value.trim()) notes[noteKey] = { ch: pages[pf.getCurrentPageIndex()].dataset.ch || '', q: pages[pf.getCurrentPageIndex()].textContent.replace(/\s+/g,' ').trim().slice(0,90), n: nt.value.trim(), t: Date.now() }; else delete notes[noteKey]; SV('notes', notes); paint(); nb.classList.remove('open'); };
document.getElementById('n-del').onclick = () => { delete notes[noteKey]; SV('notes', notes); paint(); nb.classList.remove('open'); };
const panel = document.getElementById('panel'), plist = document.getElementById('plist');
const chTitle = n => { const c = DATA.find(x => x.num === n); return c ? ((c.intro ? 'Introduction' : 'Chapter ' + n) + ' · ' + c.ptitle) : ''; };
const renderList = () => { const items = []; for (const [k,v] of Object.entries(marks)) items.push({k, kind:'★ bookmark', ...v}); for (const [k,v] of Object.entries(notes)) items.push({k, kind:'✎ note', ...v}); items.sort((a,b)=>findByKey(a.k)-findByKey(b.k)); plist.innerHTML = items.length ? items.map(it => `<div class="it" data-k="${it.k}"><small>${it.kind} · p. ${findByKey(it.k)+1} · ${chTitle(it.ch)}</small><span class="q">${it.q}…</span>${it.n?`<div class="n">${it.n.replace(/</g,'&lt;')}</div>`:''}</div>`).join('') : '<div class="empty">Nothing yet. Add a bookmark ☆ or write a note ✎ on any page.</div>'; };
document.getElementById('b-list').onclick = () => { renderList(); panel.classList.toggle('open'); };
document.getElementById('b-close').onclick = () => panel.classList.remove('open');
plist.addEventListener('click', e => { const it = e.target.closest('.it'); if (it){ pf.turnToPage(findByKey(it.dataset.k)); panel.classList.remove('open'); } });
document.getElementById('b-export').onclick = () => { const items = []; for (const [k,v] of Object.entries(marks)) items.push(`★ p. ${findByKey(k)+1} · ${chTitle(v.ch)}\n   «${v.q}…»`); for (const [k,v] of Object.entries(notes)) items.push(`✎ p. ${findByKey(k)+1} · ${chTitle(v.ch)}\n   «${v.q}…»\n   ${v.n}`); const blob = new Blob(['Neurocaptain — bookmarks and notes\n\n' + items.join('\n\n')], {type:'text/plain'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Neurocaptain — notes.txt'; a.click(); };
const q = document.getElementById('q');
const doSearch = () => { const term = q.value.trim().toLowerCase(); if (term.length < 2) return; const hits = []; pages.forEach((p,i) => { if (!p.dataset.key) return; const t = p.textContent.replace(/\s+/g,' '); const pos = t.toLowerCase().indexOf(term); if (pos >= 0) hits.push({i, ch: p.dataset.ch, snip: t.slice(Math.max(0,pos-60), pos+80)}); }); document.querySelector('#panel .ph b').textContent = 'Search: “' + q.value.trim() + '” — ' + hits.length; plist.innerHTML = hits.length ? hits.map(h => `<div class="it" data-p="${h.i}"><small>p. ${h.i+1} · ${chTitle(h.ch)}</small>…${h.snip.replace(/</g,'&lt;').replace(new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'), m=>'<mark>'+m+'</mark>')}…</div>`).join('') : '<div class="empty">Nothing found.</div>'; panel.classList.add('open'); };
q.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); if (e.key === 'Escape'){ q.value=''; panel.classList.remove('open'); } });
plist.addEventListener('click', e => { const it = e.target.closest('.it[data-p]'); if (it){ pf.turnToPage(+it.dataset.p); panel.classList.remove('open'); } });
document.getElementById('b-list').addEventListener('click', () => { document.querySelector('#panel .ph b').textContent = 'Bookmarks and notes'; });
document.getElementById('b-full').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{}); };
document.addEventListener('fullscreenchange', () => { const k = keyOf(pf.getCurrentPageIndex()); SV('last', k); setTimeout(() => location.reload(), 150); });
const refs = d => { const k = keyOf(pf.getCurrentPageIndex()); SV('fs', d); SV('last', k); location.reload(); };
document.getElementById('b-minus').onclick = () => refs(Math.max(-4, FSB-1));
document.getElementById('b-plus').onclick = () => refs(Math.min(6, FSB+1));
document.getElementById('b-theme').onclick = () => { const order = ['', 'sepia', 'night']; const cur = order.indexOf(THEME); const nxt = order[(cur+1)%order.length]; SV('theme', nxt); location.reload(); };
document.getElementById('prev').onclick = () => pf.flipPrev();
document.getElementById('first').onclick = () => pf.turnToPage(0);
document.getElementById('last').onclick = () => pf.turnToPage(pages.length - 1);
document.getElementById('next').onclick = () => pf.flipNext();
document.addEventListener('keydown', e => { if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return; if (e.key === 'ArrowRight') pf.flipNext(); if (e.key === 'ArrowLeft') pf.flipPrev(); });
// ссылки оглавления: StPageFlip сам ловит клики по странице как перелистывание — глушим его события и переходим напрямую
tocPages.forEach(tp => tp.querySelectorAll('a[data-p]').forEach(a => {
  ['mousedown','mouseup','touchstart','touchend','pointerdown','pointerup'].forEach(ev => a.addEventListener(ev, e => e.stopPropagation()));
  a.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); pf.turnToPage(+a.dataset.p); });
}));
</script>
</body>
</html>
